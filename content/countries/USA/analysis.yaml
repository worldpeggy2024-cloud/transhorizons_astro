      "probability": "High",
      "impact": "High",
      "timeHorizon": "4–12 weeks",
      "leadingIndicators": "CENTCOM strike tempo; Iranian proxy activity in Iraq/Syria/Lebanon; Oman mediation collapse; oil price above $120/bbl; Global shipping insurance premium spikes [icg-iran-us-trigger-list] [operation-epic-fury-iran-feb-2026]",
