      "interests": "Le rapport décrit une institution dont la priorité révélée est de maintenir la cohésion de la coalition au pouvoir plutôt que de réaffirmer sa prérogative institutionnelle : elle a financé l'Immigration and Customs Enforcement et la Customs and Border Protection par la réconciliation budgétaire plutôt que par les crédits annuels [house-approps-dhs-76day] et adopté une loi de réconciliation qui a accru les déficits projetés de 4 700 milliards de dollars alors que les priorités affichées étaient la réduction du déficit [capacity.steering].",
      "resources": "Le pouvoir d'appropriation, le pouvoir de confirmation des juges à vie [political.rightsAndChecks], l'autorité plénière sur les cinq territoires habités et sur la souveraineté tribale [political.constitutionalSubstrate], la voie de la réconciliation contournant les crédits ordinaires [house-approps-dhs-76day], et des autorités tarifaires légales que l'exécutif doit emprunter [crs-lsb11398-tariffs].",
