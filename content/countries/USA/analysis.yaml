    "opener": "Les États-Unis documentent leurs propres manquements plus complètement que la plupart des États : un bureau national de vérification qui évalue trente-huit domaines à haut risque tous les deux ans selon cinq critères, un bureau budgétaire législatif, des évaluations de besoins prévues par la loi, des unités ministérielles d'évaluation et le personnel de surveillance du Congrès; ce registre est donc long parce que le pays publie, et non parce qu'il ferait moins bien que des États au registre court. Ce qu'il consigne, c'est un État rarement ignorant de ses échecs et souvent incapable de convertir le diagnostic en action soutenue : le décompte de l'organe de vérification lui-même recense dix domaines à haut risque en amélioration depuis 2023 et trois en recul; ces derniers comptent parmi les domaines de mise en œuvre que ce rapport documente comme défaillants. La profondeur est maximale sur la mise en œuvre, les services publics et les opérations propres de l'État, et minimale sur la base renouvelable et minérale, où l'absence de mesure constitue elle-même le manquement consigné.",
