      "interests": "Consolider le contrôle de l'exécutif sur l'État régulateur plutôt que sur la propriété de la production [economy.politicalEconomy], et convertir ce contrôle en action rapide sur un ensemble restreint de priorités — défense du territoire, contrôle frontalier, lutte antidrogue, primauté hémisphérique et production minérale nationale [capacity.steering][security.transnationalExposure][capacity.approvals].",
      "resources": "Le contrôle républicain unifié de la présidence et des deux chambres [political.powerStructure], le commandement des forces armées comme chef des armées [political.stabilityDrivers], la révocation à discrétion des dirigeants d'agences indépendantes depuis Trump v. Slaughter [political.constitutionalSubstrate], des décrets qui réorientent les priorités des agences [capacity.approvals], et une capacité démontrée de mise en œuvre rapide là où il a établi une priorité, comme lors de l'opération au Venezuela de janvier 2026 [capacity.steering][maduro-capture-wardept].",
      "constraints": "Une majorité effective de cinq sièges à la Chambre avec cinq sièges vacants [political.powerStructure], une incapacité répétée à financer le gouvernement à temps [capacity.steering], et une cour suprême qui a tranché contre lui autant que pour lui — invalidant les tarifs fondés sur l'International Emergency Economic Powers Act, invalidant le décret 14160 sur le droit du sol et signalant une exception pour la banque centrale à la révocation à discrétion [political.constitutionalSubstrate][crs-lsb11398-tariffs].",
      "likelyMoves": "Déplacer l'autorité tarifaire durable vers les Sections 232 et 301 à mesure que la surtaxe de la Section 122 expire de plein droit le 24 juillet 2026 sans prolongation par le Congrès [crs-lsb11398-tariffs], et poursuivre les frappes et le blocus naval contre l'Iran ainsi que l'action cinétique contre les organisations criminelles transnationales dans l'hémisphère [cnn-iran-war-july18][security.internal].",
