situation_en: |-
  [
    {
      "thread": "United States–Iran war",
      "events": [
        {
          "date": "28 February 2026",
          "what": "The United States, in coordination with Israel, began major combat operations against Iran ('Operation Epic Fury'), striking nuclear, ballistic-missile and naval targets [iran-ops-transcript].",
          "changed": "Placed the United States in open armed conflict with Iran, triggering Iranian missile and drone retaliation against Gulf states hosting United States forces and Iran's closure of the Strait of Hormuz [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 April 2026 (7 April in the United States)",
          "what": "A two-week United States–Iran ceasefire mediated by Pakistan took effect, with Iran agreeing to reopen the Strait of Hormuz [whitehouse-epic-fury-ceasefire].",
          "changed": "Halted the principal combat phase after 38 days of strikes and opened negotiations on Iran's nuclear program and the Strait; the pause was later extended and formalised in an interim memorandum of understanding signed 17 June 2026 [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 July 2026",
          "what": "Speaking at the North Atlantic Treaty Organization (NATO) summit in Ankara, Turkey, President Trump declared the ceasefire with Iran 'over' ('For me, I think it's over ... It's just a waste of time dealing with them') after both sides exchanged strikes [cnbc-iran-ceasefire-over].",
          "changed": "Ended the negotiated pause and returned the United States and Iran to active hostilities, with renewed United States strikes, a reimposed naval blockade and Brent crude jumping about 5% to roughly $78 a barrel [cnbc-iran-ceasefire-over]."
        }
      ],
      "currentState": "As of 19 July 2026 United States–Iran hostilities are active: United States forces are conducting consecutive nights of strikes on Iranian infrastructure and enforcing a naval blockade while Iran attacks Gulf shipping and states hosting United States bases; no ceasefire is in effect [cnn-iran-war-july18]."
    },
    {
      "thread": "Federal funding lapses",
      "events": [
        {
          "date": "1 October – 12 November 2025",
          "what": "A lapse in fiscal year 2026 appropriations shut down the federal government for 43 days, ending 12 November 2025 when a continuing resolution and three full-year appropriations bills were enacted [crs-r48832-shutdowns].",
          "changed": "Became the longest full government shutdown in United States history and funded only part of the government through 30 January 2026, setting up the further 2026 lapses [crs-r48832-shutdowns]."
        },
        {
          "date": "14 February – 30 April 2026",
          "what": "Department of Homeland Security (DHS) funding lapsed on 14 February 2026 — after Customs and Border Protection (CBP) agents killed Alex Pretti, a 37-year-old intensive-care nurse, on 24 January 2026 and Senate Democrats withdrew support for the department's appropriations — and ran 76 days until 30 April 2026 [cbs-pretti-cbp-report][crs-r48832-shutdowns].",
          "changed": "Became the longest shutdown of a single federal department in United States history; the department reopened without funding for Immigration and Customs Enforcement (ICE) and CBP, which were financed instead through budget reconciliation [house-approps-dhs-76day]."
        }
      ],
      "currentState": "As of 19 July 2026 all twelve fiscal year 2026 appropriations are enacted, but Immigration and Customs Enforcement and Customs and Border Protection remain funded through reconciliation rather than regular annual appropriations [house-approps-dhs-76day]."
    },
    {
      "thread": "Tariff authority",
      "events": [
        {
          "date": "20 February 2026",
          "what": "The Supreme Court ruled 6–3 in Learning Resources, Inc. v. Trump that the International Emergency Economic Powers Act (IEEPA) does not authorize the President to impose tariffs, striking down the 'reciprocal' and 'trafficking' tariffs [scotus-learning-resources].",
          "changed": "Invalidated the legal basis for the administration's signature tariff program and exposed the government to potential refunds of more than $160 billion in collected duties; the IEEPA tariffs were terminated on 24 February 2026 [crs-lsb11398-tariffs]."
        },
        {
          "date": "24 February 2026",
          "what": "A 10% global import surcharge under Section 122 of the Trade Act of 1974 took effect as a replacement, with President Trump announcing an increase to the 15% statutory ceiling, and capped at 150 days [crs-lsb11398-tariffs].",
          "changed": "Restored broad tariffs on a temporary, statutorily capped footing that requires congressional action to extend beyond 24 July 2026, shifting the administration toward Section 232 and Section 301 authorities for durable duties [crs-lsb11398-tariffs]."
        }
      ],
      "currentState": "As of 19 July 2026 the Section 122 surcharge remains in effect and is set to expire by operation of law on 24 July 2026 absent congressional extension, with Section 301 investigations pending as a replacement and the refund process for the terminated IEEPA tariffs unresolved [crs-lsb11398-tariffs]."
    },
    {
      "thread": "Venezuela intervention",
      "events": [
        {
          "date": "3 January 2026",
          "what": "United States forces raided Caracas ('Operation Absolute Resolve'), capturing Venezuelan President Nicolás Maduro and his wife Cilia Flores and transporting them to New York on narco-terrorism and drug-trafficking charges [maduro-capture-wardept].",
          "changed": "Removed a sitting head of state by foreign military action and installed United States leverage over a Venezuelan transition, with Vice President Delcy Rodríguez sworn in as interim president [crs-maduro-capture]."
        }
      ],
      "currentState": "As of 19 July 2026 Maduro remains in United States custody awaiting trial in the Southern District of New York while the United States retains a large military presence off Venezuela [crs-maduro-capture]."
    }
  ]
situation_fr: |-
  [
    {
      "thread": "Guerre entre les États-Unis et l'Iran",
      "events": [
        {
          "date": "28 février 2026",
          "what": "Les États-Unis, en coordination avec Israël, ont lancé des opérations de combat d'envergure contre l'Iran (« Operation Epic Fury »), frappant des cibles nucléaires, balistiques et navales [iran-ops-transcript].",
          "changed": "Ont placé les États-Unis en conflit armé ouvert avec l'Iran, provoquant des représailles iraniennes par missiles et drones contre les États du Golfe hébergeant des forces américaines ainsi que la fermeture du détroit d'Ormuz par l'Iran [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 avril 2026 (7 avril aux États-Unis)",
          "what": "Un cessez-le-feu de deux semaines entre les États-Unis et l'Iran, négocié par le Pakistan, est entré en vigueur, l'Iran acceptant de rouvrir le détroit d'Ormuz [whitehouse-epic-fury-ceasefire].",
          "changed": "A interrompu la phase principale de combats après 38 jours de frappes et ouvert des négociations sur le programme nucléaire iranien et le détroit; la trêve a ensuite été prolongée puis formalisée par un protocole d'accord intérimaire signé le 17 juin 2026 [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 juillet 2026",
          "what": "Lors du sommet de l'Organisation du traité de l'Atlantique Nord (OTAN) à Ankara, en Turquie, le président Trump a déclaré le cessez-le-feu avec l'Iran « terminé » (« For me, I think it's over ... It's just a waste of time dealing with them ») après un nouvel échange de frappes [cnbc-iran-ceasefire-over].",
          "changed": "A mis fin à la pause négociée et ramené les États-Unis et l'Iran à des hostilités actives, avec la reprise des frappes américaines, le rétablissement d'un blocus naval et une hausse du Brent d'environ 5 %, à près de 78 dollars le baril [cnbc-iran-ceasefire-over]."
        }
      ],
      "currentState": "Au 19 juillet 2026, les hostilités entre les États-Unis et l'Iran sont actives : les forces américaines mènent des frappes plusieurs nuits d'affilée contre des infrastructures iraniennes et appliquent un blocus naval, tandis que l'Iran vise la navigation dans le Golfe et les États hébergeant des bases américaines; aucun cessez-le-feu n'est en vigueur [cnn-iran-war-july18]."
    },
    {
      "thread": "Ruptures de financement fédéral",
      "events": [
        {
          "date": "1er octobre – 12 novembre 2025",
          "what": "Une interruption des crédits pour l'exercice budgétaire 2026 a paralysé le gouvernement fédéral pendant 43 jours, prenant fin le 12 novembre 2025 avec l'adoption d'une résolution de financement provisoire et de trois lois de crédits pour l'année entière [crs-r48832-shutdowns].",
          "changed": "Est devenue la plus longue paralysie complète du gouvernement de l'histoire des États-Unis et n'a financé qu'une partie du gouvernement jusqu'au 30 janvier 2026, préparant les ruptures ultérieures de 2026 [crs-r48832-shutdowns]."
        },
        {
          "date": "14 février – 30 avril 2026",
          "what": "Le financement du Department of Homeland Security (DHS) a cessé le 14 février 2026 — après que des agents de la Customs and Border Protection (CBP) eurent tué Alex Pretti, infirmier en soins intensifs de 37 ans, le 24 janvier 2026, et que les sénateurs démocrates eurent retiré leur soutien aux crédits du ministère — et a duré 76 jours, jusqu'au 30 avril 2026 [cbs-pretti-cbp-report][crs-r48832-shutdowns].",
          "changed": "Est devenue la plus longue paralysie d'un seul ministère fédéral de l'histoire des États-Unis; le ministère a rouvert sans financement pour l'Immigration and Customs Enforcement (ICE) et la CBP, financées à la place par la voie de la réconciliation budgétaire [house-approps-dhs-76day]."
        }
      ],
      "currentState": "Au 19 juillet 2026, l'ensemble des douze lois de crédits de l'exercice 2026 est adopté, mais l'Immigration and Customs Enforcement et la Customs and Border Protection restent financées par la réconciliation budgétaire plutôt que par les crédits annuels ordinaires [house-approps-dhs-76day]."
    },
    {
      "thread": "Pouvoir tarifaire",
      "events": [
        {
          "date": "20 février 2026",
          "what": "La Cour suprême a jugé, par 6 voix contre 3 dans l'arrêt Learning Resources, Inc. v. Trump, que l'International Emergency Economic Powers Act (IEEPA) n'autorise pas le président à imposer des droits de douane, annulant les tarifs « réciproques » et « anti-trafic » [scotus-learning-resources].",
          "changed": "A invalidé le fondement juridique du programme tarifaire phare de l'administration et exposé le gouvernement à des remboursements potentiels de plus de 160 milliards de dollars de droits perçus; les tarifs fondés sur l'IEEPA ont pris fin le 24 février 2026 [crs-lsb11398-tariffs]."
        },
        {
          "date": "24 février 2026",
          "what": "Une surtaxe mondiale à l'importation de 10 %, fondée sur la Section 122 du Trade Act of 1974, est entrée en vigueur en remplacement, le président Trump ayant annoncé une hausse jusqu'au plafond légal de 15 %, et plafonnée à 150 jours [crs-lsb11398-tariffs].",
          "changed": "A rétabli des droits de douane étendus sur une base temporaire et plafonnée par la loi, exigeant une action du Congrès pour être prolongée au-delà du 24 juillet 2026, et a orienté l'administration vers les autorités des Sections 232 et 301 pour des droits durables [crs-lsb11398-tariffs]."
        }
      ],
      "currentState": "Au 19 juillet 2026, la surtaxe de la Section 122 demeure en vigueur et doit expirer de plein droit le 24 juillet 2026 en l'absence de prolongation par le Congrès, des enquêtes au titre de la Section 301 étant en cours comme remplacement et la procédure de remboursement des tarifs IEEPA supprimés restant non résolue [crs-lsb11398-tariffs]."
    },
    {
      "thread": "Intervention au Venezuela",
      "events": [
        {
          "date": "3 janvier 2026",
          "what": "Les forces américaines ont mené un raid sur Caracas (« Operation Absolute Resolve »), capturant le président vénézuélien Nicolás Maduro et son épouse Cilia Flores et les transférant à New York pour des accusations de narcoterrorisme et de trafic de drogue [maduro-capture-wardept].",
          "changed": "Ont écarté un chef d'État en exercice par une action militaire étrangère et instauré une influence américaine sur une transition vénézuélienne, la vice-présidente Delcy Rodríguez ayant prêté serment comme présidente par intérim [crs-maduro-capture]."
        }
      ],
      "currentState": "Au 19 juillet 2026, Maduro reste en détention aux États-Unis en attente de son procès dans le district sud de New York, tandis que les États-Unis maintiennent une importante présence militaire au large du Venezuela [crs-maduro-capture]."
    }
  ]
