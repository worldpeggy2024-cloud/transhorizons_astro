baseline_en: 'The United States is a federal presidential republic under unified Republican control of the presidency and both chambers, with the balance of power moving toward the executive: in 2026 the Supreme Court voided for-cause removal protection for the heads of independent agencies, leaving the Federal Reserve a provisional exception [trump-v-slaughter-2026][trump-v-cook-2026]. It is also at war. Strikes on Iran resumed after the President declared the Pakistan-mediated ceasefire over on 8 July 2026, and United States forces are striking Iranian targets and enforcing a naval blockade with no ceasefire in effect [cnbc-iran-ceasefire-over][cnn-iran-war-july18]; a January 2026 raid on Caracas removed the sitting Venezuelan president, who awaits trial in New York [maduro-capture-wardept][crs-maduro-capture]. Ordinary government has broken repeatedly around these operations: the longest full shutdown on record was followed by a 76-day funding lapse at the Department of Homeland Security, whose immigration and border agencies now run on reconciliation money rather than annual appropriations [crs-r48832-shutdowns][house-approps-dhs-76day], and the signature tariff program was struck down in February, its statutory replacement expiring by operation of law on 24 July 2026 [scotus-learning-resources][crs-lsb11398-tariffs]. The economy is growing and faces no external financing constraint as issuer of the principal reserve currency, against a deficit of 5.8% of gross domestic product and public debt at 101% [cbo-budget-outlook-2026][treasury-tic-debt-holders]. Trust in the federal government stands at 17%, near a seventy-year low and sorted by party rather than shared [pew-trust-in-government], and independent scorers have downgraded the country from liberal democracy to electoral democracy for the first time in over five decades [vdem-democracy-report-2026].'
baseline_fr: 'Les États-Unis sont une république fédérale présidentielle sous contrôle républicain unifié de la présidence et des deux chambres, l''équilibre des pouvoirs glissant vers l''exécutif : en 2026, la Cour suprême a invalidé la protection légale contre la révocation sans motif des dirigeants d''agences indépendantes, ne laissant à la Réserve fédérale qu''une exception provisoire [trump-v-slaughter-2026][trump-v-cook-2026]. Le pays est en outre en guerre. Les frappes contre l''Iran ont repris après que le président a déclaré terminé, le 8 juillet 2026, le cessez-le-feu négocié par le Pakistan, et les forces américaines frappent des cibles iraniennes et appliquent un blocus naval, aucun cessez-le-feu n''étant en vigueur [cnbc-iran-ceasefire-over][cnn-iran-war-july18]; un raid mené sur Caracas en janvier 2026 a écarté le président vénézuélien en exercice, qui attend son procès à New York [maduro-capture-wardept][crs-maduro-capture]. Le fonctionnement ordinaire de l''État s''est enrayé à répétition autour de ces opérations : la plus longue paralysie complète du gouvernement jamais enregistrée a été suivie d''un blocage de 76 jours du financement de la Sécurité intérieure, dont les agences d''immigration et des frontières sont désormais financées par la réconciliation budgétaire plutôt que par les crédits annuels [crs-r48832-shutdowns][house-approps-dhs-76day], et le programme tarifaire phare a été annulé en février, son remplacement légal expirant de plein droit le 24 juillet 2026 [scotus-learning-resources][crs-lsb11398-tariffs]. L''économie croît et ne connaît aucune contrainte de financement externe, en tant qu''émettrice de la principale monnaie de réserve, face à un déficit de 5,8 % du produit intérieur brut et à une dette publique de 101 % [cbo-budget-outlook-2026][treasury-tic-debt-holders]. La confiance envers le gouvernement fédéral s''établit à 17 %, près de son plus bas niveau en soixante-dix ans et clivée selon les lignes partisanes plutôt que partagée [pew-trust-in-government], et des évaluateurs indépendants ont rétrogradé le pays de démocratie libérale à démocratie électorale pour la première fois en plus de cinq décennies [vdem-democracy-report-2026].'
territory_geography_en: 'The United States is a continental-scale country spanning the middle of North America from the Atlantic to the Pacific, bordered by Canada to the north and Mexico to the south, with the non-contiguous state of Alaska in the far northwest and the Hawaiian archipelago in the central Pacific — a diversified terrain of coastal plains, interior lowlands, the Rocky Mountains and western deserts; detail follows. The periphery comprises five inhabited unincorporated territories: the Commonwealth of Puerto Rico, Guam, the United States Virgin Islands, the Commonwealth of the Northern Mariana Islands and American Samoa, plus uninhabited outlying possessions (Wake, Midway, Johnston, Palmyra, Howland, Baker, Jarvis, Navassa, Kingman Reef) [constitution-usa-1787][insular-cases-1901]. Alaska and Hawaii are non-contiguous states [constitution-usa-1787]. The physical arrangement is central to how the country functions as one country, with large internal distances and a mix of densely settled coasts and sparsely populated interior west.'
territory_geography_fr: 'Les États-Unis sont un pays à l''échelle continentale s''étendant au centre de l''Amérique du Nord de l''Atlantique au Pacifique, bordés par le Canada au nord et le Mexique au sud, avec l''État non contigu de l''Alaska à l''extrême nord-ouest et l''archipel hawaïen dans le Pacifique central — un relief diversifié de plaines côtières, de basses terres intérieures, des montagnes Rocheuses et de déserts occidentaux; les détails suivent. La périphérie comprend cinq territoires non incorporés habités : le Commonwealth de Porto Rico, Guam, les îles Vierges américaines, le Commonwealth des îles Mariannes du Nord et les Samoa américaines, ainsi que des possessions périphériques inhabitées (Wake, Midway, Johnston, Palmyra, Howland, Baker, Jarvis, Navassa, récif Kingman) [constitution-usa-1787][insular-cases-1901]. L''Alaska et Hawaï sont des États non contigus [constitution-usa-1787]. L''agencement physique est central pour le fonctionnement du pays en tant qu''entité unique, avec de vastes distances internes et un mélange de côtes densément peuplées et d''un intérieur occidental faiblement peuplé.'
territory_biosphere_en: 'The renewable base is vast and its condition diverges by resource: forest area and managed fish stocks broadly hold, while groundwater extraction and cropland do not [fao-forest-water-usa][noaa-status-of-stocks][usgs-water-use-united-states][usda-ers-major-land-uses]. Of a total land area of 2.26 billion acres in 2017, grassland pasture and range accounted for 659 million acres (29%), forest-use land 622 million acres (28%), cropland 390 million acres (17%), special uses such as parks and wildlife areas 318 million acres (14%), miscellaneous uses including wetlands and tundra 197 million acres (9%), and urban land 74 million acres (3%) [usda-ers-major-land-uses]. Agricultural land totalled 1.19 billion acres in 2017, or 52.5% of the land base, down from 59% in 1959; cropland fell 15% and grazed forestland 46% across that period, to 132 million acres [usda-ers-major-land-uses]. Forest area stood at about 310 million hectares in 2020, roughly 8% of the world total, placing the United States among the five countries that together hold more than half of all forest [fao-forest-water-usa]; North American forest area was broadly stable between 1990 and 2015, gains in the United States offsetting losses in Canada and Mexico [fao-forest-water-usa]. Total water withdrawals were 322 billion gallons per day in 2015, 9% below 2010 and the lowest level reported since before 1970, of which fresh water was 281 billion gallons per day (87%) and saline water 41.0 billion gallons per day (13%) [usgs-water-use-united-states]. The aggregate decline masks a divergence within the resource: fresh surface-water withdrawals fell 14% from 2010 to 198 billion gallons per day, while fresh groundwater withdrawals rose about 8% to 82.3 billion gallons per day, shifting extraction toward the slower-recharging stock [usgs-water-use-united-states]. Irrigation and thermoelectric power remained the two largest uses in 2015, and modelled across the conterminous United States for water years 2010–2020, crop irrigation withdrew an average of 105,497 million gallons per day, of which 75,698 million gallons per day was consumed rather than returned to the system [usgs-water-use-united-states]. Of the 506 federally managed stocks and stock complexes covered by the 2023 report to Congress, 21 were subject to overfishing — an all-time low — and 47 were overfished, with 94% not subject to overfishing and 82% not overfished, and 50 stocks rebuilt since 2000 [noaa-status-of-stocks]. The binding constraint is knowledge as much as harvest: only 364 of the 506 stocks had a known overfishing status and only 263 a known overfished status [noaa-status-of-stocks].'
territory_biosphere_fr: 'La base renouvelable est vaste et son état diverge selon la ressource : la surface forestière et les stocks halieutiques gérés tiennent globalement, l''extraction d''eau souterraine et les terres cultivées non [fao-forest-water-usa][noaa-status-of-stocks][usgs-water-use-united-states][usda-ers-major-land-uses]. Sur une superficie totale de 2,26 milliards d''acres en 2017, les pâturages et parcours herbagers représentaient 659 millions d''acres (29 %), les terres à usage forestier 622 millions d''acres (28 %), les terres cultivées 390 millions d''acres (17 %), les usages spéciaux tels que parcs et réserves fauniques 318 millions d''acres (14 %), les usages divers dont les milieux humides et la toundra 197 millions d''acres (9 %), et les terres urbaines 74 millions d''acres (3 %) [usda-ers-major-land-uses]. Les terres agricoles totalisaient 1,19 milliard d''acres en 2017, soit 52,5 % de la base foncière, contre 59 % en 1959; sur la même période, les terres cultivées ont reculé de 15 % et les terres forestières pâturées de 46 %, à 132 millions d''acres [usda-ers-major-land-uses]. La surface forestière s''établissait à environ 310 millions d''hectares en 2020, soit près de 8 % du total mondial, ce qui place les États-Unis parmi les cinq pays détenant ensemble plus de la moitié des forêts de la planète [fao-forest-water-usa]; la surface forestière nord-américaine est restée globalement stable entre 1990 et 2015, les gains américains compensant les pertes canadiennes et mexicaines [fao-forest-water-usa]. Les prélèvements d''eau totaux atteignaient 322 milliards de gallons par jour en 2015, soit 9 % de moins qu''en 2010 et le niveau le plus bas relevé depuis avant 1970, dont 281 milliards de gallons par jour d''eau douce (87 %) et 41,0 milliards de gallons par jour d''eau saline (13 %) [usgs-water-use-united-states]. Le recul global masque une divergence interne à la ressource : les prélèvements d''eau douce de surface ont chuté de 14 % depuis 2010, à 198 milliards de gallons par jour, tandis que les prélèvements d''eau douce souterraine ont progressé d''environ 8 %, à 82,3 milliards de gallons par jour, déplaçant l''extraction vers le stock à recharge la plus lente [usgs-water-use-united-states]. L''irrigation et la production thermoélectrique demeuraient les deux premiers usages en 2015 et, selon la modélisation pour les États-Unis contigus sur les années hydrologiques 2010-2020, l''irrigation des cultures a prélevé en moyenne 105 497 millions de gallons par jour, dont 75 698 millions de gallons par jour consommés et non restitués au système [usgs-water-use-united-states]. Sur les 506 stocks et complexes de stocks gérés au niveau fédéral couverts par le rapport 2023 au Congrès, 21 faisaient l''objet d''une surpêche — un plancher historique — et 47 étaient en état de surexploitation, 94 % n''étant pas soumis à la surpêche et 82 % n''étant pas surexploités, 50 stocks ayant été reconstitués depuis 2000 [noaa-status-of-stocks]. La contrainte est autant cognitive qu''halieutique : seuls 364 des 506 stocks avaient un statut de surpêche connu et seuls 263 un statut de surexploitation connu [noaa-status-of-stocks].'
territory_minerals_en: 'The United States holds a large but selectively developed subsurface endowment, and its critical-mineral position deteriorated in 2025. The US Geological Survey values 2025 nonfuel mineral production at $112 billion, with crushed stone the top commodity at $26.8 billion [usgs-mcs-2026]. The country was 100% net import reliant on 16 nonfuel mineral commodities in 2025 (up from 15 in 2024) and more than 50% import reliant on 54 commodities [usgs-mcs-2026]. China was the primary source for 14 of the most import-dependent critical minerals, supplying roughly 70% of rare earths and 55% of antimony [usgs-mcs-2026]. The USGS expanded its critical minerals list from 50 commodities in 2022 to 60 in 2025, adding copper and silver for the first time [usgs-mcs-2026]. Reserve figures are compiled by the USGS as the estimating body [usgs-mcs-2026].'
territory_minerals_fr: 'Les États-Unis disposent d''une dotation souterraine vaste mais exploitée de manière sélective, et leur position sur les minéraux critiques s''est détériorée en 2025. L''US Geological Survey évalue la production minière non combustible de 2025 à 112 milliards de dollars, la pierre concassée étant le premier produit à 26,8 milliards [usgs-mcs-2026]. Le pays dépendait à 100 % des importations nettes pour 16 produits minéraux non combustibles en 2025 (contre 15 en 2024) et à plus de 50 % pour 54 produits [usgs-mcs-2026]. La Chine était la source principale de 14 des minéraux critiques les plus dépendants des importations, fournissant environ 70 % des terres rares et 55 % de l''antimoine [usgs-mcs-2026]. L''USGS a élargi sa liste de minéraux critiques de 50 produits en 2022 à 60 en 2025, y ajoutant pour la première fois le cuivre et l''argent [usgs-mcs-2026]. Les chiffres de réserves sont compilés par l''USGS en tant qu''organisme d''estimation [usgs-mcs-2026].'
territory_climate_en: 'The United States spans a dramatically regional climate — from Arctic and subarctic Alaska through the temperate continental interior and humid east to the arid Southwest and tropical Hawaii and territories — so any warming signal sits atop a highly varied baseline; detail follows. Observed warming is faster than the global mean: temperatures in the contiguous United States have risen 2.5°F and in Alaska 4.2°F since 1970, against roughly 1.7°F globally over the same period, with the continental United States including Alaska warming about 60% faster than the planet as a whole [nca5-fifth-national-climate-assessment]. Precipitation has diverged regionally: annual precipitation over 2002–2021 was 5%–15% above the 1901–1960 average across the central and eastern United States, while Hawaii and parts of the Southwest recorded decreases of 10%–15% over the same period [nca5-fifth-national-climate-assessment]. Sea level along the continental coastline has risen about 11 inches over the past century against 7 inches globally, and rose at 1.8 inches per decade over 1993–2020 against 1.3 inches globally, with the highest rates on the Gulf and Mid-Atlantic coasts (above 2.4 inches per decade), the lowest in the Pacific Northwest (0–1 inch per decade), and relative sea level fall in Southeast Alaska [nca5-fifth-national-climate-assessment]. The Southwest experienced the driest soil moisture of any equivalent period in at least 1,200 years over 2000–2021, and is the only region where the total area of unusually dry soil moisture is increasing [nca5-fifth-national-climate-assessment]. Extreme heat is concentrated in the West, which has seen the largest increase in days above 95°F since the 1980s, while across 50 large cities the average number of heatwaves has doubled since the 1980s and the heatwave season has lengthened from about 40 to about 70 days [nca5-fifth-national-climate-assessment]. Heavy precipitation has increased most in the Northeast (around 60% more extreme precipitation days) and Midwest (around 45%) [nca5-fifth-national-climate-assessment]. Billion-dollar weather and climate disasters arrived roughly every four months in the 1980s and now arrive roughly every three weeks, with 18 such events in 2022 [nca5-fifth-national-climate-assessment]. Projections, each bound to its scenario and horizon: at a global warming level of 2°C relative to 1851–1900, average United States temperature is very likely to rise 4.4°F–5.6°F, with each further 1°C of global warming adding about 2.5°F and the largest increases in the north and west [nca5-fifth-national-climate-assessment]. Average sea level along United States coastlines is likely to stand 12–20 inches above 2000 levels by 2050 across the range of global warming levels — 4–12 inches in the Pacific Northwest but 20–27 inches in the western Gulf of Mexico — and at a 2°C global warming level 2–3 feet by 2100 and 2.5–5 feet by 2150; rises of 3–6 feet by 2100 and 5–12 feet by 2150 cannot be ruled out [nca5-fifth-national-climate-assessment]. Coastal flooding events that are currently damaging are projected to become more than ten times more frequent over the next 30 years [nca5-fifth-national-climate-assessment]. In the Southwest, the risk of a single-year drought as dry as 2002 rises 8% at a 2°C global warming level and 24% at 4°C, while multidecadal soil-moisture droughts are projected to increase regardless of warming level [nca5-fifth-national-climate-assessment]. Under a very high emissions scenario (Shared Socioeconomic Pathway 5-8.5) the world is very likely to pass 2°C between 2033 and 2054; under a low scenario (Shared Socioeconomic Pathway 1-2.6) it is very likely not to cross that threshold at all [nca5-fifth-national-climate-assessment]. Exposure and the capacity to meet it are unevenly distributed within the country, and the gap is measurable: low-income neighbourhoods, including those historically affected by redlining, can be as much as 12°F hotter during heatwaves than wealthier neighbourhoods in the same city and face substantially higher flood risk [nca5-fifth-national-climate-assessment]; Americans over 65 are several times more likely than younger people to die of heat-related cardiovascular disease [nca5-fifth-national-climate-assessment]. At national scale the country ranks among the high-readiness economies on adaptive capacity [ndgain-country-index], so the binding constraint is not aggregate national capacity but its distribution across the exposed populations named above [nca5-fifth-national-climate-assessment].'
territory_climate_fr: 'Les États-Unis couvrent un climat très régionalisé — de l''Alaska arctique et subarctique à l''intérieur continental tempéré et à l''est humide, jusqu''au Sud-Ouest aride et à Hawaï et aux territoires tropicaux — de sorte que tout signal de réchauffement se superpose à une base très variée; les détails suivent. Le réchauffement observé dépasse la moyenne mondiale : les températures des États-Unis contigus ont augmenté de 2,5 °F et celles de l''Alaska de 4,2 °F depuis 1970, contre environ 1,7 °F à l''échelle du globe sur la même période, les États-Unis continentaux Alaska compris se réchauffant environ 60 % plus vite que la planète dans son ensemble [nca5-fifth-national-climate-assessment]. Les précipitations ont divergé selon les régions : sur 2002-2021, les précipitations annuelles ont dépassé de 5 % à 15 % la moyenne 1901-1960 dans le centre et l''est du pays, tandis qu''Hawaï et une partie du Sud-Ouest enregistraient des baisses de 10 % à 15 % sur la même période [nca5-fifth-national-climate-assessment]. Le niveau de la mer le long du littoral continental s''est élevé d''environ 11 pouces au cours du siècle dernier contre 7 pouces à l''échelle mondiale, et progressait de 1,8 pouce par décennie sur 1993-2020 contre 1,3 pouce à l''échelle mondiale, les rythmes les plus élevés se trouvant sur les côtes du Golfe et du Mid-Atlantic (plus de 2,4 pouces par décennie), les plus faibles dans le Nord-Ouest pacifique (0 à 1 pouce par décennie), avec une baisse relative du niveau de la mer dans le sud-est de l''Alaska [nca5-fifth-national-climate-assessment]. Le Sud-Ouest a connu sur 2000-2021 l''humidité des sols la plus faible de toute période équivalente depuis au moins 1 200 ans, et constitue la seule région où la superficie totale de sols anormalement secs augmente [nca5-fifth-national-climate-assessment]. La chaleur extrême se concentre dans l''Ouest, qui enregistre depuis les années 1980 la plus forte hausse du nombre de journées dépassant 95 °F, tandis que dans 50 grandes villes le nombre moyen de vagues de chaleur a doublé depuis les années 1980 et que la saison des vagues de chaleur s''est allongée d''environ 40 à environ 70 jours [nca5-fifth-national-climate-assessment]. Les fortes précipitations ont le plus augmenté dans le Nord-Est (environ 60 % de journées de précipitations extrêmes en plus) et le Midwest (environ 45 %) [nca5-fifth-national-climate-assessment]. Les catastrophes météorologiques et climatiques à plus d''un milliard de dollars survenaient environ tous les quatre mois dans les années 1980 et surviennent désormais environ toutes les trois semaines, avec 18 événements de ce type en 2022 [nca5-fifth-national-climate-assessment]. Projections, chacune rattachée à son scénario et à son horizon : à un niveau de réchauffement planétaire de 2 °C par rapport à 1851-1900, la température moyenne des États-Unis augmentera très probablement de 4,4 °F à 5,6 °F, chaque degré Celsius supplémentaire de réchauffement mondial ajoutant environ 2,5 °F, les hausses les plus fortes touchant le nord et l''ouest [nca5-fifth-national-climate-assessment]. Le niveau moyen de la mer le long des côtes américaines devrait probablement dépasser de 12 à 20 pouces les niveaux de 2000 d''ici 2050 sur l''ensemble des niveaux de réchauffement — de 4 à 12 pouces dans le Nord-Ouest pacifique mais de 20 à 27 pouces dans l''ouest du golfe du Mexique — et, à un niveau de réchauffement de 2 °C, de 2 à 3 pieds d''ici 2100 et de 2,5 à 5 pieds d''ici 2150; des hausses de 3 à 6 pieds en 2100 et de 5 à 12 pieds en 2150 ne peuvent être exclues [nca5-fifth-national-climate-assessment]. Les épisodes d''inondation côtière aujourd''hui dommageables devraient devenir plus de dix fois plus fréquents au cours des 30 prochaines années [nca5-fifth-national-climate-assessment]. Dans le Sud-Ouest, le risque d''une sécheresse annuelle aussi sévère que celle de 2002 augmente de 8 % à un niveau de réchauffement de 2 °C et de 24 % à 4 °C, tandis que les sécheresses pluridécennales de l''humidité des sols devraient s''accentuer quel que soit le niveau de réchauffement [nca5-fifth-national-climate-assessment]. Selon un scénario d''émissions très élevées (trajectoire socio-économique partagée 5-8.5), le monde franchira très probablement le seuil de 2 °C entre 2033 et 2054; selon un scénario bas (trajectoire socio-économique partagée 1-2.6), il ne le franchira très probablement pas [nca5-fifth-national-climate-assessment]. L''exposition et la capacité d''y faire face sont inégalement réparties à l''intérieur du pays, et l''écart est mesurable : les quartiers à faibles revenus, dont ceux historiquement touchés par le redlining, peuvent être jusqu''à 12 °F plus chauds pendant les vagues de chaleur que les quartiers aisés d''une même ville et sont nettement plus exposés aux inondations [nca5-fifth-national-climate-assessment]; les Américains de plus de 65 ans ont plusieurs fois plus de risques que les plus jeunes de mourir d''une maladie cardiovasculaire liée à la chaleur [nca5-fifth-national-climate-assessment]. À l''échelle nationale, le pays figure parmi les économies à forte préparation en matière de capacité d''adaptation [ndgain-country-index] : la contrainte déterminante n''est donc pas la capacité nationale agrégée mais sa répartition entre les populations exposées nommées ci-dessus [nca5-fifth-national-climate-assessment].'
territory_metabolism_en: 'Scope: energy, food, water, movement and information. The United States is broadly self-sufficient in energy: after fifteen years of near-flat demand, electricity consumption has risen 2.1% annually over the past five years, driven by data centres and AI, and is projected to keep growing 0.9%–1.6% per year through 2050 [eia-aeo-2026][eia-power-outlook-2026]. Natural gas production reached 107 billion cubic feet per day in 2025 and crude oil production 13.6 million barrels per day in 2025 [eia-aeo-2026]. Natural gas supplied about 40% of electricity generation in 2025 and coal about 16%, with natural gas, solar and wind together about 60% of generation in 2025 [eia-aeo-2026][eia-power-outlook-2026]. The physical grid, transport and broadband networks carry these flows across continental distances; the approved sources characterise energy throughput in detail but not internal transport self-sufficiency [eia-aeo-2026].'
territory_metabolism_fr: 'Portée : énergie, alimentation, eau, mobilité et information. Les États-Unis sont largement autosuffisants en énergie : après quinze ans de demande quasi stable, la consommation d''électricité a augmenté de 2,1 % par an au cours des cinq dernières années, tirée par les centres de données et l''IA, et devrait continuer de croître de 0,9 % à 1,6 % par an jusqu''en 2050 [eia-aeo-2026][eia-power-outlook-2026]. La production de gaz naturel a atteint 107 milliards de pieds cubes par jour en 2025 et la production de pétrole brut 13,6 millions de barils par jour en 2025 [eia-aeo-2026]. Le gaz naturel a fourni environ 40 % de la production d''électricité en 2025 et le charbon environ 16 %, gaz naturel, solaire et éolien représentant ensemble environ 60 % de la production en 2025 [eia-aeo-2026][eia-power-outlook-2026]. Les réseaux physiques d''électricité, de transport et de haut débit acheminent ces flux sur des distances continentales; les sources approuvées caractérisent en détail le débit énergétique mais non l''autosuffisance du transport interne [eia-aeo-2026].'
territory_transition_en: 'The United States is a laggard in decarbonisation relative to its capacity, and its pledge-versus-policy gap has widened sharply. The Climate Action Tracker rates US climate targets, action and finance as ''Critically Insufficient'' overall, with policies and action ''Highly Insufficient'' [climateactiontracker-usa]. The Trump administration voided the existing 2030 and 2035 Nationally Determined Contribution (NDC) targets set under the prior administration, and the Climate Action Tracker considers the United States to no longer have a net-zero target [climateactiontracker-usa]. Under current policy, US emissions are projected to fall 19%–30% below 2005 levels by 2030 (excluding land use, land-use change and forestry, LULUCF), versus the 29%–39% the prior administration was on track to deliver — roughly 600–800 million tonnes of carbon dioxide equivalent higher in 2030 [climateactiontracker-usa]. Energy-related carbon dioxide emissions data are compiled by the Energy Information Administration [eia-emissions-outlook].'
territory_transition_fr: 'Les États-Unis sont à la traîne en matière de décarbonation au regard de leurs capacités, et l''écart entre engagements et politiques s''est fortement creusé. Le Climate Action Tracker qualifie de « critiquement insuffisants » les objectifs, l''action et le financement climatiques américains dans leur ensemble, les politiques et l''action étant « hautement insuffisantes » [climateactiontracker-usa]. L''administration Trump a annulé les objectifs de contribution déterminée au niveau national (CDN) pour 2030 et 2035 fixés sous l''administration précédente, et le Climate Action Tracker considère que les États-Unis n''ont plus d''objectif de neutralité carbone [climateactiontracker-usa]. Selon les politiques actuelles, les émissions américaines devraient baisser de 19 % à 30 % sous les niveaux de 2005 d''ici 2030 (hors utilisation des terres, changement d''affectation des terres et foresterie, UTCATF), contre les 29 % à 39 % que l''administration précédente était en voie d''atteindre — soit environ 600 à 800 millions de tonnes d''équivalent CO2 de plus en 2030 [climateactiontracker-usa]. Les données d''émissions de CO2 liées à l''énergie sont compilées par l''Energy Information Administration [eia-emissions-outlook].'
society_demographics_en: 'The United States is a settler-immigrant-built society whose population growth has depended on migration, and that growth has just slowed sharply; detail follows. The population reached 341.8 million as of 1 July 2025, growing only 0.5% (about 1.8 million) over the year, the slowest since 2021 [census-poprelease-2026]. The slowdown was driven by a historic fall in net international migration, from 2.7 million in the prior year to 1.3 million in July 2024–June 2025, projected to fall further to about 321,000 by July 2026 [census-poprelease-2026]. Natural change (births minus deaths) was about 519,000, roughly flat year-on-year but far below prior-decade levels [census-poprelease-2026]. Long-term demographic pressures include an ageing population documented by the Congressional Budget Office [cbo-demographic-outlook-2026][census-popclock].'
society_demographics_fr: 'Les États-Unis sont une société bâtie par les colons et l''immigration, dont la croissance démographique a dépendu des migrations, et cette croissance vient de ralentir fortement; les détails suivent. La population a atteint 341,8 millions au 1er juillet 2025, ne progressant que de 0,5 % (environ 1,8 million) sur l''année, le rythme le plus lent depuis 2021 [census-poprelease-2026]. Ce ralentissement s''explique par une chute historique du solde migratoire international, de 2,7 millions l''année précédente à 1,3 million de juillet 2024 à juin 2025, devant encore reculer à environ 321 000 d''ici juillet 2026 [census-poprelease-2026]. Le solde naturel (naissances moins décès) s''est établi à environ 519 000, à peu près stable d''une année sur l''autre mais bien inférieur aux niveaux de la décennie précédente [census-poprelease-2026]. Les pressions démographiques à long terme comprennent le vieillissement de la population documenté par le Congressional Budget Office [cbo-demographic-outlook-2026][census-popclock].'
society_composition_en: 'The United States population was about 340 million in 2024, of whom roughly 56% were non-Hispanic White alone, 20% Hispanic or Latino of any race, 12% Black or African American alone, 6% Asian alone, and 1% American Indian and Alaska Native alone [census-acs-dp05]. The Hispanic or Latino category is an ethnicity recorded independently of race, so its members are distributed across every racial category rather than forming a separate one [census-acs-dp05]. Spanish is the largest minority home language, while English functions as the universal lingua franca and language of instruction [census-acs-language]. Religious affiliation is predominantly Christian with a large unaffiliated share, and observance does not track racial or linguistic lines [pewresearch-religious-landscape]. Cleavage geometry (Interpretation): across ethnicity, language and religion the fault lines are largely CROSS-CUTTING — the ethnicity category cuts across the racial categories by construction [census-acs-dp05], home language does not partition access to the national lingua franca [census-acs-language], and religious observance is not coextensive with either [pewresearch-religious-landscape]. The REINFORCING line is partisan rather than ethnic: institutional trust splits sharply by party (26% of Republicans versus 9% of Democrats in 2025) and responses track which party holds power rather than stable underlying trust [pew-trust-in-government], and religious observance is increasingly aligned with partisan identity [pewresearch-religious-landscape]. The principal fault line therefore runs along partisan identity, which absorbs and organises the demographic differences rather than being produced by them.'
society_composition_fr: 'La population des États-Unis s''élevait à environ 340 millions d''habitants en 2024, dont environ 56 % de Blancs non hispaniques d''une seule race, 20 % d''Hispaniques ou Latinos toutes races confondues, 12 % de Noirs ou Afro-Américains d''une seule race, 6 % d''Asiatiques d''une seule race et 1 % d''Amérindiens et d''Autochtones d''Alaska d''une seule race [census-acs-dp05]. La catégorie hispanique ou latino relève de l''ethnicité, consignée indépendamment de la race : ses membres se répartissent donc dans toutes les catégories raciales au lieu d''en constituer une distincte [census-acs-dp05]. L''espagnol est la première langue minoritaire parlée à la maison, tandis que l''anglais fait office de langue véhiculaire universelle et de langue d''enseignement [census-acs-language]. L''affiliation religieuse est majoritairement chrétienne avec une forte part de personnes sans affiliation, et la pratique ne recoupe ni les lignes raciales ni les lignes linguistiques [pewresearch-religious-landscape]. Géométrie des clivages (Interprétation) : sur les axes ethnicité, langue et religion, les lignes de fracture sont largement TRANSVERSALES — la catégorie ethnique traverse par construction les catégories raciales [census-acs-dp05], la langue parlée à la maison ne conditionne pas l''accès à la langue véhiculaire nationale [census-acs-language], et la pratique religieuse ne coïncide avec aucune des deux [pewresearch-religious-landscape]. La ligne CUMULATIVE est partisane et non ethnique : la confiance institutionnelle se scinde nettement selon le parti (26 % des républicains contre 9 % des démocrates en 2025) et les réponses suivent le parti au pouvoir plutôt qu''une confiance de fond stable [pew-trust-in-government], tandis que la pratique religieuse s''aligne de plus en plus sur l''identité partisane [pewresearch-religious-landscape]. La principale ligne de fracture court donc le long de l''identité partisane, qui absorbe et organise les différences démographiques plutôt que d''en découler.'
society_language_en: 'English is the dominant lingua franca and language of instruction, with Spanish the largest minority language; the American Community Survey tabulates language spoken at home as the primary instrument [census-acs-language]. Specific rounded shares by language for 2024 are compiled in that survey [census-acs-language].'
society_language_fr: 'L''anglais est la langue véhiculaire dominante et la langue d''enseignement, l''espagnol étant la première langue minoritaire; l''American Community Survey recense la langue parlée à la maison comme instrument principal [census-acs-language]. Les parts arrondies précises par langue pour 2024 sont compilées dans cette enquête [census-acs-language].'
society_religion_en: 'The United States is a predominantly Christian country with a large and growing religiously unaffiliated share, measured by the Pew Research Center''s Religious Landscape Study, a self-report survey subject to social-desirability and sampling bias [pewresearch-religious-landscape]. The principal salience of religion runs along the religiously observant/secular divide, which is increasingly aligned with partisan identity [pewresearch-religious-landscape].'
society_religion_fr: 'Les États-Unis sont un pays à prédominance chrétienne avec une part importante et croissante de personnes sans affiliation religieuse, mesurée par la Religious Landscape Study du Pew Research Center, une enquête déclarative sujette au biais de désirabilité sociale et d''échantillonnage [pewresearch-religious-landscape]. La principale saillance de la religion suit le clivage pratiquants/laïcs, de plus en plus aligné sur l''identité partisane [pewresearch-religious-landscape].'
society_wellbeing_en: 'Life expectancy at birth was 79.0 years in 2024, up 0.6 year from 78.4 in 2023, with 81.4 years for females and 76.5 for males — a sex gap of 4.9 years, narrowed by 0.4 year from 2023 [nchs-mortality-2024]. Life expectancy at age 65 was 19.7 years in 2024 [nchs-mortality-2024]. The age-adjusted death rate fell 3.8%, from 750.5 deaths per 100,000 standard population in 2023 to 722.1 in 2024, with 3,072,666 registered deaths in 2024 [nchs-mortality-2024][nchs-mortality-2023-databrief]. The three leading causes in 2024 were heart disease (157.6 per 100,000), cancer (139.4) and unintentional injuries (53.3, down 14.4% from 2023); suicide entered the top ten at tenth place (13.7) while COVID-19 fell out of the top ten to fifteenth, its death count dropping 37.1% from 49,932 in 2023 to 31,426 in 2024 [nchs-mortality-2024]. The infant mortality rate was 552.5 infant deaths per 100,000 live births in 2024, not significantly different from 560.2 in 2023 [nchs-mortality-2024]. The mortality access gradient is steep by race and ethnicity: among males in 2024, age-adjusted death rates corrected for death-certificate misclassification were 1,213.0 per 100,000 for non-Hispanic American Indian and Alaska Native, 1,094.9 for non-Hispanic Black, 871.1 for non-Hispanic White, 651.9 for Hispanic and 454.2 for non-Hispanic Asian [nchs-mortality-2024]. Uncorrected rates understate deaths by 34% for the non-Hispanic American Indian and Alaska Native population and by 3% for the Hispanic and non-Hispanic Asian populations, so uncorrected series systematically flatter the gradient [nchs-mortality-2024]. On education, among 25- to 29-year-olds in 2022, 95% had completed at least high school (up from 89% in 2010), 49% held an associate''s or higher degree (from 41%), 40% a bachelor''s or higher degree (from 32%), and 10% a master''s or higher degree (from 7%) [nces-condition-of-education]. The attainment gradient widens with each level: in 2022 the bachelor''s-or-higher rate was 72% for Asian, 45% for White, 28% for Black and 25% for Hispanic 25- to 29-year-olds, while the associate''s-or-higher rate ranged from 78% for Asian down to 19% for American Indian/Alaska Native [nces-condition-of-education]. The White–Hispanic high school completion gap narrowed from 25 to 9 percentage points between 2010 and 2022, but the Asian–White gap at bachelor''s level widened by 9 points over the same period [nces-condition-of-education]. Attainment is higher for females at every level, with an 11-point sex gap among White 25- to 29-year-olds at bachelor''s or higher [nces-condition-of-education].'
society_wellbeing_fr: 'L''espérance de vie à la naissance atteignait 79,0 ans en 2024, en hausse de 0,6 an par rapport à 78,4 ans en 2023, soit 81,4 ans pour les femmes et 76,5 ans pour les hommes — un écart de 4,9 ans, réduit de 0,4 an depuis 2023 [nchs-mortality-2024]. L''espérance de vie à 65 ans s''établissait à 19,7 ans en 2024 [nchs-mortality-2024]. Le taux de mortalité standardisé par âge a reculé de 3,8 %, passant de 750,5 décès pour 100 000 habitants de la population type en 2023 à 722,1 en 2024, pour 3 072 666 décès enregistrés en 2024 [nchs-mortality-2024][nchs-mortality-2023-databrief]. Les trois premières causes de décès en 2024 étaient les maladies cardiaques (157,6 pour 100 000), le cancer (139,4) et les accidents (53,3, en baisse de 14,4 % sur un an); le suicide est entré dans les dix premières causes au dixième rang (13,7) tandis que la COVID-19 en est sortie pour tomber au quinzième rang, ses décès reculant de 37,1 %, de 49 932 en 2023 à 31 426 en 2024 [nchs-mortality-2024]. Le taux de mortalité infantile s''établissait à 552,5 décès pour 100 000 naissances vivantes en 2024, sans différence significative avec les 560,2 de 2023 [nchs-mortality-2024]. Le gradient d''accès en matière de mortalité est prononcé selon la race et l''origine ethnique : chez les hommes en 2024, les taux standardisés corrigés des erreurs de classement sur les certificats de décès atteignaient 1 213,0 pour 100 000 chez les Amérindiens et Autochtones d''Alaska non hispaniques, 1 094,9 chez les Noirs non hispaniques, 871,1 chez les Blancs non hispaniques, 651,9 chez les Hispaniques et 454,2 chez les Asiatiques non hispaniques [nchs-mortality-2024]. Les taux non corrigés sous-estiment les décès de 34 % pour la population amérindienne et autochtone d''Alaska non hispanique et de 3 % pour les populations hispanique et asiatique non hispanique : les séries non corrigées atténuent donc systématiquement le gradient [nchs-mortality-2024]. Sur le plan éducatif, chez les 25-29 ans en 2022, 95 % avaient au moins achevé le secondaire (contre 89 % en 2010), 49 % détenaient un diplôme d''associate ou supérieur (contre 41 %), 40 % un baccalauréat américain ou supérieur (contre 32 %) et 10 % une maîtrise ou plus (contre 7 %) [nces-condition-of-education]. Le gradient de réussite se creuse à chaque échelon : en 2022, le taux de baccalauréat ou plus atteignait 72 % chez les 25-29 ans asiatiques, 45 % chez les Blancs, 28 % chez les Noirs et 25 % chez les Hispaniques, tandis que le taux d''associate ou plus allait de 78 % chez les Asiatiques à 19 % chez les Amérindiens et Autochtones d''Alaska [nces-condition-of-education]. L''écart Blancs-Hispaniques pour l''achèvement du secondaire s''est resserré de 25 à 9 points de pourcentage entre 2010 et 2022, mais l''écart Asiatiques-Blancs au niveau du baccalauréat s''est élargi de 9 points sur la même période [nces-condition-of-education]. La réussite est plus élevée chez les femmes à tous les niveaux, avec un écart de 11 points entre sexes chez les Blancs de 25-29 ans au niveau du baccalauréat ou plus [nces-condition-of-education].'
society_cohesion_en: 'Social and institutional trust in the United States is low and, crucially, partisan-sorted, so the headline aggregate is a systematically distorted artefact and cohort breakdowns are reported instead. Per the Pew Research Center, just 17% of Americans said in 2025 they trust the federal government to do what is right just about always or most of the time, down from 22% in 2024 and near the lowest in about 70 years [pew-trust-in-government]. The figure splits sharply by party: 26% of Republicans versus only 9% of Democrats, the lowest level ever recorded for Democrats in Pew''s data — respondents answer honestly, but responses track which party holds power rather than stable underlying trust [pew-trust-in-government]. Gallup''s parallel governance series shows the same partisan swing, with Republican confidence in the executive branch rising sharply and Democratic confidence falling by comparable margins after the 2024 change of administration [gallup-confidence-institutions].'
society_cohesion_fr: 'La confiance sociale et institutionnelle aux États-Unis est faible et, surtout, clivée selon les lignes partisanes, de sorte que l''agrégat global est un artefact systématiquement biaisé et que des ventilations par cohorte sont rapportées à la place. Selon le Pew Research Center, seuls 17 % des Américains déclaraient en 2025 faire confiance au gouvernement fédéral pour agir correctement presque toujours ou la plupart du temps, contre 22 % en 2024 et près du plus bas niveau depuis environ 70 ans [pew-trust-in-government]. Le chiffre se scinde nettement selon le parti : 26 % des républicains contre seulement 9 % des démocrates, le plus bas niveau jamais enregistré pour les démocrates dans les données de Pew — les répondants répondent honnêtement, mais leurs réponses suivent le parti au pouvoir plutôt qu''une confiance de fond stable [pew-trust-in-government]. La série de gouvernance parallèle de Gallup montre le même basculement partisan, la confiance républicaine envers la branche exécutive augmentant fortement et la confiance démocrate chutant dans des proportions comparables après le changement d''administration de 2024 [gallup-confidence-institutions].'
economy_realEconomy_en: 'The United States has a diversified, services-dominated economy — services accounted for the large majority of value added, well above other major economies — that lives on domestic consumption, finance, technology and healthcare, and this character precedes the numbers that follow. Real GDP grew 2.2% in 2025, and the Congressional Budget Office projects growth accelerating to 2.2% in 2026 before slowing to about 1.8% annually from 2027 [cbo-budget-outlook-2026]. The value of US nonfuel mineral production reached $112 billion in 2025, up 5.6% [usgs-mcs-2026]. Business fixed investment is being driven by generative artificial intelligence (AI) and data-centre construction, which the CBO cites as a factor supporting productivity and electricity demand growth [cbo-budget-outlook-2026][eia-aeo-2026].'
economy_realEconomy_fr: 'Les États-Unis ont une économie diversifiée et dominée par les services — ceux-ci représentent la grande majorité de la valeur ajoutée, bien au-dessus des autres grandes économies — qui vit de la consommation intérieure, de la finance, de la technologie et de la santé, ce caractère précédant les chiffres qui suivent. Le PIB réel a progressé de 2,2 % en 2025, et le Congressional Budget Office prévoit une accélération à 2,2 % en 2026 avant un ralentissement à environ 1,8 % par an à partir de 2027 [cbo-budget-outlook-2026]. La valeur de la production minière non combustible des États-Unis a atteint 112 milliards de dollars en 2025, en hausse de 5,6 % [usgs-mcs-2026]. L''investissement fixe des entreprises est tiré par l''intelligence artificielle (IA) générative et la construction de centres de données, que le CBO cite comme facteur soutenant la productivité et la demande d''électricité [cbo-budget-outlook-2026][eia-aeo-2026].'
economy_publicFinances_en: 'The federal government runs large structural deficits and rising debt. The Congressional Budget Office projects an FY2026 deficit of $1.9 trillion, equal to 5.8% of GDP, against a 50-year average of 3.8% [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. Federal debt held by the public rises from 101% of GDP in 2026 to a projected 120% by 2036, surpassing the prior 1946 peak of 106% [cbo-budget-outlook-2026]. Outlays are 23.3% of GDP and revenues 17.5% of GDP in 2026 [cbo-budget-outlook-2026]. Net interest outlays reach $1.0 trillion in 2026 and are projected to double to $2.1 trillion (4.6% of GDP) by 2036 [cbo-budget-outlook-2026]. CBO projects Consumer Price Index (CPI) inflation of about 2.8% in 2026, easing thereafter [crfb-cbo-outlook-2026].'
economy_publicFinances_fr: 'Le gouvernement fédéral accuse d''importants déficits structurels et une dette croissante. Le Congressional Budget Office prévoit pour l''exercice 2026 un déficit de 1 900 milliards de dollars, soit 5,8 % du PIB, contre une moyenne de 3,8 % sur cinquante ans [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. La dette fédérale détenue par le public passe de 101 % du PIB en 2026 à 120 % projetés en 2036, dépassant le pic de 106 % de 1946 [cbo-budget-outlook-2026]. Les dépenses représentent 23,3 % du PIB et les recettes 17,5 % en 2026 [cbo-budget-outlook-2026]. Les intérêts nets atteignent 1 000 milliards de dollars en 2026 et devraient doubler pour atteindre 2 100 milliards (4,6 % du PIB) d''ici 2036 [cbo-budget-outlook-2026]. Le CBO prévoit une inflation de l''indice des prix à la consommation (IPC) d''environ 2,8 % en 2026, en repli ensuite [crfb-cbo-outlook-2026].'
economy_externalVulnerability_en: 'The United States runs a persistent trade deficit and finances it in part through foreign purchases of its sovereign debt. Foreign holdings of Treasury securities totalled roughly $9.2 trillion as of December 2025, about 31% of total federal debt [treasury-tic-debt-holders]. The largest holders as of February 2026 were Japan ($1.24 trillion), the United Kingdom ($897 billion) and mainland China ($693.3 billion) [treasury-tic-debt-holders]. China''s holdings have declined over the decade, reflecting geopolitical diversification [treasury-tic-debt-holders]. The country is highly exposed on critical-mineral supply: it was 100% net import reliant on 16 nonfuel mineral commodities in 2025, with China the primary source for 14 of the most import-dependent critical minerals [usgs-mcs-2026]. As the issuer of the principal global reserve currency, the United States faces no sovereign external financing constraint of the kind facing smaller economies [treasury-tic-debt-holders].'
economy_externalVulnerability_fr: 'Les États-Unis accusent un déficit commercial persistant qu''ils financent en partie par les achats étrangers de leur dette souveraine. Les avoirs étrangers en bons du Trésor s''élevaient à environ 9 200 milliards de dollars fin décembre 2025, soit environ 31 % de la dette fédérale totale [treasury-tic-debt-holders]. Les principaux détenteurs, en février 2026, étaient le Japon (1 240 milliards de dollars), le Royaume-Uni (897 milliards) et la Chine continentale (693,3 milliards) [treasury-tic-debt-holders]. Les avoirs chinois ont diminué au cours de la décennie, signe d''une diversification géopolitique [treasury-tic-debt-holders]. Le pays est très exposé sur l''approvisionnement en minéraux critiques : il dépendait à 100 % des importations nettes pour 16 produits minéraux non combustibles en 2025, la Chine étant la source principale de 14 des minéraux critiques les plus dépendants des importations [usgs-mcs-2026]. En tant qu''émetteur de la principale monnaie de réserve mondiale, les États-Unis ne subissent aucune contrainte de financement extérieur souverain comparable à celle des petites économies [treasury-tic-debt-holders].'
economy_politicalEconomy_en: 'The United States is a market-led economy with limited direct state ownership, and the current contested boundary lies in the reach of executive control over the regulatory state rather than in nationalisation. The model''s load-bearing entities are named in public rankings and federal records: the Fortune 500 ranks the largest United States corporations by revenue [fortune-500-2026]; four technology firms — Meta, Microsoft, Amazon and Alphabet — carry the artificial-intelligence data-centre buildout, with combined capital expenditure of about $410 billion in 2025, plans of roughly $725 billion for 2026 and a Goldman Sachs projection of $5.3 trillion across fiscal years 2025–2030 [goldman-hyperscaler-capex-2026]; the defence industrial base runs through the Department of Defense''s top-100 contractor list, which names the long-standing prime contractors, Lockheed Martin, RTX, Boeing, General Dynamics and Northrop Grumman among them [dod-top100-contractors-list][crs-dod-contractors-primer]; and organised labour''s weight is measured in the Bureau of Labor Statistics'' annual union-membership release [bls-union-members-2025], which the Economic Policy Institute — a think tank with a pro-labour orientation — reads as a 2025 increase in unionisation [epi-unionization-increase-2025]. The 2025 reconciliation act (Public Law 119-21, the One Big Beautiful Bill Act) permanently extended 2017 tax provisions and raised projected deficits by $4.7 trillion over 2026–2035, benefiting taxpayers and defence and homeland-security spending while cutting Medicaid and the Supplemental Nutrition Assistance Program (SNAP) [obbba-hr1][cbo-budget-outlook-2026]. The technically necessary reform — closing the primary and interest-driven fiscal gap — is politically constrained, with mandatory spending rising and net interest the fastest-growing outlay [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. The 2026 Supreme Court removal-power ruling shifts the state–market boundary by making formerly independent regulators subject to at-will presidential removal, increasing the political variability of enforcement [trump-v-slaughter-2026].'
economy_politicalEconomy_fr: 'Les États-Unis constituent une économie de marché à propriété publique directe limitée, la frontière contestée du moment portant sur la portée du contrôle exécutif sur l''État régulateur plutôt que sur des nationalisations. Les entités porteuses du modèle sont nommées dans les classements publics et les registres fédéraux : le Fortune 500 classe les plus grandes entreprises américaines par chiffre d''affaires [fortune-500-2026]; quatre entreprises technologiques — Meta, Microsoft, Amazon et Alphabet — portent l''expansion des centres de données d''intelligence artificielle, avec des dépenses d''investissement combinées d''environ 410 milliards de dollars en 2025, des plans d''environ 725 milliards pour 2026 et une projection de Goldman Sachs de 5 300 milliards sur les exercices 2025-2030 [goldman-hyperscaler-capex-2026]; la base industrielle de défense passe par la liste des 100 premiers entrepreneurs du département de la Défense, qui nomme les maîtres d''œuvre historiques, dont Lockheed Martin, RTX, Boeing, General Dynamics et Northrop Grumman [dod-top100-contractors-list][crs-dod-contractors-primer]; et le poids du travail organisé se mesure dans le communiqué annuel d''adhésion syndicale du Bureau of Labor Statistics [bls-union-members-2025], que l''Economic Policy Institute — groupe de réflexion à orientation pro-syndicale — lit comme une hausse de la syndicalisation en 2025 [epi-unionization-increase-2025]. La loi de réconciliation de 2025 (loi publique 119-21, la One Big Beautiful Bill Act) a pérennisé les dispositions fiscales de 2017 et relevé les déficits projetés de 4 700 milliards de dollars sur 2026-2035, au bénéfice des contribuables et des dépenses de défense et de sécurité intérieure, tout en réduisant Medicaid et le Supplemental Nutrition Assistance Program (SNAP) [obbba-hr1][cbo-budget-outlook-2026]. La réforme techniquement nécessaire — résorber le déficit primaire et celui tiré par les intérêts — est politiquement contrainte, les dépenses obligatoires augmentant et les intérêts nets étant le poste à la croissance la plus rapide [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. L''arrêt de 2026 de la Cour suprême sur le pouvoir de révocation déplace la frontière État-marché en soumettant des régulateurs autrefois indépendants à la révocation discrétionnaire présidentielle, accroissant la variabilité politique de l''application des règles [trump-v-slaughter-2026].'
political_powerStructure_en: 'The United States is a federal presidential republic in which power is won through separately elected executive and legislative branches, and as of 18 July 2026 the federal government is unified under Republican control, with the balance of power moving toward the presidency — detail follows. The executive is held by President Donald Trump, a Republican who won the November 2024 election and was inaugurated in January 2025 [freedomhouse-usa-2026]. Legislative control is stated separately from executive control because the system permits divergence, but here it does not: in the Senate (100 seats) Republicans hold 53 seats to the Democrats'' 45, with 2 independents (Senators King and Sanders) caucusing with the Democrats [senate-partydiv][senate-dailypress]; in the House of Representatives (435 seats) Republicans hold 217 seats, Democrats 212, with 1 independent and 5 vacancies following deaths and resignations in 2026 [house-partybreakdown]. Government is therefore unified rather than divided. Whether operative power tracks the constitutional allocation is contested: the Constitution vests executive power in the President and legislative power in Congress, but 2026 apex-court doctrine has expanded presidential control over the executive branch (removal of independent-agency heads) [scotus-opinions-portal], and this pass presents that contest without resolving it. [calibration-executive-source]'
political_powerStructure_fr: 'Les États-Unis sont une république fédérale présidentielle où le pouvoir se conquiert par l''élection distincte de l''exécutif et du législatif, et au 18 juillet 2026 le gouvernement fédéral est unifié sous contrôle républicain, l''équilibre des pouvoirs se déplaçant vers la présidence — les détails suivent. L''exécutif est détenu par le président Donald Trump, républicain élu en novembre 2024 et investi en janvier 2025 [freedomhouse-usa-2026]. Le contrôle du législatif est indiqué séparément de celui de l''exécutif, car le régime autorise leur divergence, mais tel n''est pas le cas ici : au Sénat (100 sièges), les républicains détiennent 53 sièges contre 45 aux démocrates, deux indépendants (les sénateurs King et Sanders) siégeant avec les démocrates [senate-partydiv][senate-dailypress]; à la Chambre des représentants (435 sièges), les républicains détiennent 217 sièges, les démocrates 212, avec un indépendant et cinq sièges vacants après des décès et démissions en 2026 [house-partybreakdown]. Le gouvernement est donc unifié et non divisé. La question de savoir si le pouvoir effectif suit la répartition constitutionnelle est contestée : la Constitution confie l''exécutif au président et le législatif au Congrès, mais la jurisprudence de la Cour suprême de 2026 a élargi le contrôle présidentiel sur la branche exécutive (révocation des dirigeants d''agences indépendantes) [scotus-opinions-portal]; cette étape présente ce différend sans le trancher. [calibration-executive-source]'
political_rightsAndChecks_en: 'The federal judiciary is appointed by the President with Senate confirmation and holds life tenure, and judicial review has been exercised since Marbury v. Madison [marbury-v-madison-1803][constitution-usa-1787]. Independent scorers document measured erosion of checks: Freedom House rated the United States 81 of 100 in its Freedom in the World 2026 report, a 3-point decline, and per Pew Research Center the US rating from 2005 to 2025 declined more than any other country Freedom House categorizes as ''free'' except Nauru and Bulgaria — Freedom House is an advocacy-oriented US-based scorer whose ratings are interpretive [freedomhouse-usa-2026]. V-Dem''s Democracy Report 2026 downgraded the United States from ''liberal democracy'' to ''electoral democracy'' for the first time in over five decades and characterises the decline as unprecedented in modern history [vdem-democracy-report-2026]. The World Justice Project Rule of Law Index 2025 ranked the United States 27th of 143 countries overall and 112th of 143 on access to civil justice [wjp-rule-of-law-2025]. Transparency International''s 2025 Corruption Perceptions Index scored the United States 64 of 100 and ranked it 29th of 182, its lowest-ever score, down from 65 in 2024 [transparency-cpi-2025]. On media, Freedom House records a free and diverse press under strong constitutional protection but eroded by government pressure, market concentration and partisan polarisation [freedomhouse-usa-2026].'
political_rightsAndChecks_fr: 'La magistrature fédérale est nommée par le président avec confirmation du Sénat et jouit d''un mandat à vie, le contrôle de constitutionnalité s''exerçant depuis l''arrêt Marbury v. Madison [marbury-v-madison-1803][constitution-usa-1787]. Les évaluateurs indépendants documentent une érosion mesurée des contre-pouvoirs : Freedom House a attribué aux États-Unis 81 sur 100 dans son rapport Freedom in the World 2026, soit un recul de 3 points, et selon le Pew Research Center la note américaine a, de 2005 à 2025, davantage reculé que celle de tout autre pays classé « libre » par Freedom House, hormis Nauru et la Bulgarie — Freedom House étant un évaluateur américain à vocation militante dont les notes sont interprétatives [freedomhouse-usa-2026]. Le rapport Democracy Report 2026 de V-Dem a rétrogradé les États-Unis de « démocratie libérale » à « démocratie électorale » pour la première fois en plus de cinquante ans, qualifiant ce déclin d''inédit dans l''histoire moderne [vdem-democracy-report-2026]. L''indice de l''État de droit 2025 du World Justice Project classe les États-Unis 27e sur 143 pays au total et 112e sur 143 pour l''accès à la justice civile [wjp-rule-of-law-2025]. L''indice de perception de la corruption 2025 de Transparency International attribue aux États-Unis 64 sur 100 et un rang de 29e sur 182, leur plus bas score jamais enregistré, contre 65 en 2024 [transparency-cpi-2025]. Concernant les médias, Freedom House constate une presse libre et plurielle sous forte protection constitutionnelle, mais érodée par la pression gouvernementale, la concentration du marché et la polarisation partisane [freedomhouse-usa-2026].'
political_stabilityDrivers_en: 'The regime is legitimated by regular competitive elections and a long constitutional tradition, and armed forces and federal law-enforcement are under civilian command through the President as commander-in-chief [constitution-usa-1787]. The 2026 National Defense Strategy directs the military toward homeland defence and Western Hemisphere operations, including border security and counter-narcotics support, indicating executive use of the armed forces for domestic-adjacent missions [ndstrategy-2026]. Elite cohesion within the governing bloc is high — unified Republican control of the presidency and both chambers [senate-partydiv][house-partybreakdown] — while cross-party elite cohesion is low, reflected in institutional trust that is sharply partisan-sorted [pew-trust-in-government]. Corruption safeguards weakened: Freedom House recorded a score decline tied to the erosion of anticorruption safeguards under the administration [freedomhouse-usa-2026].'
political_stabilityDrivers_fr: 'Le régime tire sa légitimité d''élections compétitives régulières et d''une longue tradition constitutionnelle, les forces armées et les forces fédérales de maintien de l''ordre relevant du commandement civil via le président, chef des armées [constitution-usa-1787]. La Stratégie de défense nationale 2026 oriente l''armée vers la défense du territoire et les opérations dans l''hémisphère occidental, dont la sécurité frontalière et l''appui à la lutte antidrogue, signe d''un recours de l''exécutif aux forces armées pour des missions à caractère quasi intérieur [ndstrategy-2026]. La cohésion des élites au sein du bloc au pouvoir est forte — contrôle républicain unifié de la présidence et des deux chambres [senate-partydiv][house-partybreakdown] — tandis que la cohésion inter-partisane est faible, comme en témoigne une confiance institutionnelle fortement clivée selon les lignes partisanes [pew-trust-in-government]. Les garde-fous anticorruption se sont affaiblis : Freedom House a enregistré un recul de note lié à l''érosion de ces garde-fous sous l''administration [freedomhouse-usa-2026].'
political_shockAbsorbers_en: 'The economy''s scale and the dollar''s reserve-currency role cushion fiscal and financial shocks — foreign investors held roughly $9.2 trillion in Treasuries as of December 2025, sustaining low-friction government borrowing [treasury-tic-debt-holders] — and deep, diversified services output provides resilience [cbo-budget-outlook-2026]. Against this, the rising debt trajectory (public debt from 101% of GDP in 2026 toward 120% by 2036, with net interest doubling to $2.1 trillion by 2036) narrows fiscal room [cbo-budget-outlook-2026], and recurrent funding lapses accelerate instability: the FY2026 shutdown ran 43 days (1 October–12 November 2025), the longest full-government shutdown on record, and a further Homeland Security funding lapse beginning 14 February 2026 ran 76 days to 30 April 2026, the longest shutdown of a single federal department on record [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations].'
political_shockAbsorbers_fr: 'L''ampleur de l''économie et le rôle du dollar comme monnaie de réserve amortissent les chocs budgétaires et financiers — les investisseurs étrangers détenaient environ 9 200 milliards de dollars de bons du Trésor fin décembre 2025, garantissant un endettement public sans heurts [treasury-tic-debt-holders] — et une production de services vaste et diversifiée assure une résilience [cbo-budget-outlook-2026]. En regard, la trajectoire ascendante de la dette (dette publique passant de 101 % du PIB en 2026 vers 120 % en 2036, les intérêts nets doublant pour atteindre 2 100 milliards de dollars d''ici 2036) réduit la marge budgétaire [cbo-budget-outlook-2026], et les blocages budgétaires répétés accélèrent l''instabilité : la fermeture de l''exercice 2026 a duré 43 jours (1er octobre-12 novembre 2025), la plus longue paralysie complète du gouvernement jamais enregistrée, et un nouveau blocage du financement de la Sécurité intérieure débutant le 14 février 2026 a duré 76 jours, jusqu''au 30 avril 2026, la plus longue paralysie d''un seul ministère fédéral jamais enregistrée [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations].'
political_constitutionalSubstrate_en: 'The constitutional form is a federal presidential republic founded on the written Constitution of the United States (1787, in force 4 March 1789), which allocates sovereignty between a national government and the states and separates legislative, executive and judicial power [constitution-usa-1787]. The Reconstruction Amendments re-founded the terms of citizenship and equal protection (Thirteenth 1865, Fourteenth 1868, Fifteenth 1870) [reconstruction-amendments], and judicial review has anchored the order since Marbury v. Madison [marbury-v-madison-1803]. The legal order is plural and each order is held separately: federal statutory law, supreme over state law under the Supremacy Clause (Article VI) [constitution-usa-1787]; state statutory and common law, each of the 50 states maintaining its own constitution, legislature, courts and code under powers reserved by the Tenth Amendment, with Louisiana retaining a civil-law tradition for private law [constitution-usa-1787]; tribal law, under which federally recognised tribes exercise inherent pre-constitutional sovereignty over their members and Indian country, subject to congressional plenary power and not derived from federal or state law (the Marshall Trilogy; McGirt v. Oklahoma; Oklahoma v. Castro-Huerta; Haaland v. Brackeen) [marshall-trilogy][mcgirt-v-oklahoma-2020][oklahoma-v-castro-huerta-2022][haaland-v-brackeen-2023][usc-title25]; and the insular territorial order, under which the five inhabited unincorporated territories are governed under the regime established by the Insular Cases, Congress holding plenary authority and the Constitution applying only selectively, residents holding no presidential vote and no voting congressional representation [insular-cases-1901]. This substrate is in motion, not stable: apex-court doctrine is actively reallocating power. In 2026 the Court held in Trump v. Slaughter (No. 25-332, decided 29 June 2026, 6–3) that statutory for-cause removal protections for Federal Trade Commission commissioners are unconstitutional, overruling Humphrey''s Executor v. United States (1935) and vesting the President with at-will removal of principal officers of independent agencies [trump-v-slaughter-2026][scotus-opinions-portal]; in Trump v. Cook (No. 25A312, 2026) the Court, 5–4, allowed Federal Reserve Governor Lisa Cook to remain pending merits review, signalling a central-bank carve-out [trump-v-cook-2026][scotus-opinions-portal]; in Trump v. Barbara (No. 25-365, decided 30 June 2026, 6–3) the Court held that children born in the United States to parents unlawfully or temporarily present are subject to the jurisdiction of the United States and are citizens at birth under the Fourteenth Amendment, striking down Executive Order 14160 [trump-v-barbara-2026][scotus-opinions-portal]; and in Watson v. Republican National Committee (decided 29 June 2026, 5–4) the Court held that federal election-day statutes do not prevent states from counting absentee ballots postmarked by election day but received afterward [watson-v-rnc-2026][scotus-opinions-portal]. This 2026 reallocation follows Trump v. United States (2024) on presidential immunity, Trump v. CASA (2025) on nationwide injunctions, Loper Bright (2024) ending Chevron deference, West Virginia v. EPA (2022), and Shelby County v. Holder (2013) [trump-v-usa-2024][trump-v-casa-2025][loper-bright-2024][wv-v-epa-2022][shelby-county-2013]. Administrative rules that implement this order are published in the Federal Register [federal-register], and non-partisan analysis is available through the Congressional Research Service [crs-congress-gov].'
political_constitutionalSubstrate_fr: 'La forme constitutionnelle est une république fédérale présidentielle fondée sur la Constitution écrite des États-Unis (1787, en vigueur le 4 mars 1789), qui répartit la souveraineté entre un gouvernement national et les États et sépare les pouvoirs législatif, exécutif et judiciaire [constitution-usa-1787]. Les amendements de la Reconstruction ont refondé les termes de la citoyenneté et de l''égale protection (treizième 1865, quatorzième 1868, quinzième 1870) [reconstruction-amendments], et le contrôle de constitutionnalité ancre l''ordre juridique depuis Marbury v. Madison [marbury-v-madison-1803]. L''ordre juridique est pluriel et chaque ordre est tenu séparément : le droit fédéral, supérieur au droit des États en vertu de la clause de suprématie (article VI) [constitution-usa-1787]; le droit statutaire et coutumier des États, chacun des 50 États conservant sa propre constitution, législature, tribunaux et code au titre des pouvoirs réservés par le dixième amendement, la Louisiane conservant une tradition de droit civil pour le droit privé [constitution-usa-1787]; le droit tribal, en vertu duquel les tribus reconnues au niveau fédéral exercent une souveraineté inhérente préconstitutionnelle sur leurs membres et les terres indiennes, sous réserve du pouvoir plénier du Congrès et non dérivée du droit fédéral ou des États (la trilogie Marshall; McGirt v. Oklahoma; Oklahoma v. Castro-Huerta; Haaland v. Brackeen) [marshall-trilogy][mcgirt-v-oklahoma-2020][oklahoma-v-castro-huerta-2022][haaland-v-brackeen-2023][usc-title25]; et l''ordre territorial insulaire, en vertu duquel les cinq territoires non incorporés habités sont régis par le régime établi par les Insular Cases, le Congrès détenant l''autorité plénière et la Constitution ne s''appliquant que sélectivement, les résidents n''ayant ni vote présidentiel ni représentation votante au Congrès [insular-cases-1901]. Ce substrat est en mouvement et non stable : la jurisprudence de la Cour suprême redistribue activement le pouvoir. En 2026, la Cour a jugé dans Trump v. Slaughter (n° 25-332, rendu le 29 juin 2026, 6 voix contre 3) que la protection légale contre la révocation sans motif des commissaires de la Federal Trade Commission est inconstitutionnelle, renversant Humphrey''s Executor v. United States (1935) et conférant au président le pouvoir de révoquer à discrétion les dirigeants d''agences indépendantes [trump-v-slaughter-2026][scotus-opinions-portal]; dans Trump v. Cook (n° 25A312, 2026), la Cour a, par 5 voix contre 4, autorisé la gouverneure de la Réserve fédérale Lisa Cook à rester en fonction en attendant l''examen au fond, signalant une exception pour la banque centrale [trump-v-cook-2026][scotus-opinions-portal]; dans Trump v. Barbara (n° 25-365, rendu le 30 juin 2026, 6 voix contre 3), la Cour a jugé que les enfants nés aux États-Unis de parents en situation irrégulière ou temporaire relèvent de la juridiction des États-Unis et sont citoyens à la naissance en vertu du quatorzième amendement, invalidant le décret 14160 [trump-v-barbara-2026][scotus-opinions-portal]; et dans Watson v. Republican National Committee (rendu le 29 juin 2026, 5 voix contre 4), la Cour a jugé que les lois fédérales sur le jour du scrutin n''empêchent pas les États de compter les bulletins par correspondance oblitérés le jour du scrutin mais reçus après [watson-v-rnc-2026][scotus-opinions-portal]. Cette redistribution de 2026 fait suite à Trump v. United States (2024) sur l''immunité présidentielle, Trump v. CASA (2025) sur les injonctions nationales, Loper Bright (2024) mettant fin à la déférence Chevron, West Virginia v. EPA (2022) et Shelby County v. Holder (2013) [trump-v-usa-2024][trump-v-casa-2025][loper-bright-2024][wv-v-epa-2022][shelby-county-2013]. Les règlements administratifs mettant en œuvre cet ordre sont publiés au Federal Register [federal-register], et une analyse non partisane est disponible auprès du Congressional Research Service [crs-congress-gov].'
political_stateStructure_en: 'The United States is a federal republic of 50 states plus the federal District of Columbia and five inhabited unincorporated territories [constitution-usa-1787]. Powers not delegated to the federal government are reserved to the states under the Tenth Amendment, so states maintain their own constitutions, legislatures, courts and codes operating concurrently with federal law [constitution-usa-1787][reconstruction-amendments]. Asymmetries are pronounced: the five inhabited territories (Puerto Rico, Guam, United States Virgin Islands, Northern Mariana Islands, American Samoa) have no presidential vote and no voting representation in Congress, and federally recognised tribes exercise inherent sovereignty over Indian country [usc-title25][insular-cases-1901].'
political_stateStructure_fr: 'Les États-Unis sont une république fédérale de 50 États, plus le district fédéral de Columbia et cinq territoires non incorporés habités [constitution-usa-1787]. Les pouvoirs non délégués au gouvernement fédéral sont réservés aux États par le dixième amendement, de sorte que les États conservent leurs propres constitutions, législatures, tribunaux et codes, coexistant avec le droit fédéral [constitution-usa-1787][reconstruction-amendments]. Les asymétries sont marquées : les cinq territoires habités (Porto Rico, Guam, îles Vierges américaines, îles Mariannes du Nord, Samoa américaines) n''ont ni vote présidentiel ni représentation votante au Congrès, et les tribus reconnues au niveau fédéral exercent une souveraineté inhérente sur les terres indiennes [usc-title25][insular-cases-1901].'
capacity_inheritedTerrain_en: 'The state works against a continental-scale, resource-rich but internally distant terrain and a large, ageing, immigration-built population whose growth has just slowed sharply [territory.geography][society.demographics]. It inherits an extensive energy and mineral endowment paired with deep import dependence on critical minerals [territory.minerals][territory.metabolism], the world''s largest and most diversified services economy [economy.realEconomy], and a fiscal base carrying historically high public debt [economy.publicFinances]. This inherited capacity is distributed by history, geography and scale — never earned or deserved — and forms the denominator for every performance claim below.'
capacity_inheritedTerrain_fr: 'L''État agit sur un terrain à l''échelle continentale, riche en ressources mais aux distances internes considérables, et sur une population nombreuse, vieillissante et bâtie par l''immigration, dont la croissance vient de ralentir fortement [territory.geography][society.demographics]. Il hérite d''une vaste dotation énergétique et minérale associée à une forte dépendance aux importations de minéraux critiques [territory.minerals][territory.metabolism], de la plus grande et de la plus diversifiée des économies de services au monde [economy.realEconomy], et d''une base budgétaire portant une dette publique historiquement élevée [economy.publicFinances]. Cette capacité héritée est distribuée par l''histoire, la géographie et l''échelle — jamais méritée ni acquise — et constitue le dénominateur de toute affirmation de performance ci-dessous.'
capacity_steering_en: 'The federal state retains formidable analytic and implementation capacity but its steering is degraded by fiscal gridlock and partisan volatility. The record shows repeated failure to prioritise among competing demands through the ordinary budget process: the FY2026 appropriations cycle produced the longest full-government shutdown on record (43 days, 1 October–12 November 2025), a further lapse from 1 February 2026, and a Homeland Security funding lapse from 14 February 2026 that ran 76 days to 30 April 2026 — the longest shutdown of a single federal department on record — resolved only through consolidated and continuing appropriations [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations]. Announced fiscal priorities (deficit reduction) diverge from implemented ones (the 2025 reconciliation act raised deficits by $4.7 trillion over 2026–2035) [obbba-hr1][cbo-budget-outlook-2026]. Where the executive has prioritised — homeland and hemispheric security — it has demonstrated rapid implementation, as in the January 2026 Venezuela operation [ndstrategy-2026][maduro-capture-wardept].'
capacity_steering_fr: 'L''État fédéral conserve une formidable capacité d''analyse et de mise en œuvre, mais son pilotage est dégradé par le blocage budgétaire et la volatilité partisane. Le bilan montre un échec répété à hiérarchiser les demandes concurrentes par le processus budgétaire ordinaire : le cycle d''appropriations de l''exercice 2026 a produit la plus longue fermeture complète du gouvernement jamais enregistrée (43 jours, 1er octobre-12 novembre 2025), un nouveau blocage à compter du 1er février 2026 et un blocage du financement de la Sécurité intérieure à compter du 14 février 2026 qui a duré 76 jours, jusqu''au 30 avril 2026 — la plus longue paralysie d''un seul ministère fédéral jamais enregistrée —, résolus seulement par des appropriations consolidées et provisoires [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations]. Les priorités budgétaires affichées (réduction du déficit) divergent de celles mises en œuvre (la loi de réconciliation de 2025 a accru les déficits de 4 700 milliards de dollars sur 2026-2035) [obbba-hr1][cbo-budget-outlook-2026]. Là où l''exécutif a établi une priorité — sécurité du territoire et de l''hémisphère — il a démontré une mise en œuvre rapide, comme lors de l''opération au Venezuela de janvier 2026 [ndstrategy-2026][maduro-capture-wardept].'
capacity_approvals_en: 'The federal state can say yes or no to a major project, but the decision is slow and only partially measured. Across all federal agencies, the median time to complete an environmental impact statement under the National Environmental Policy Act — from notice of intent to final statement — was 2.8 years for statements finalized between January 2019 and December 2024, and 2.2 years for those issued in 2024, when about 41% were completed in two years or less against 24% in 2019; the figures come from the Council on Environmental Quality''s January 2025 timeline update covering 1,903 statements finalized 2010–2024, which puts the pre-reform 2010–2018 median at 3.2 years [ceq-eis-timelines-2010-2024]. The pre-reform record measured to the record of decision was slower still: a 4.5-year average across the 1,276 statements whose final version was published between 1 January 2010 and 31 December 2018, half taking longer than 3.5 years and one quarter more than 6.0 years [ceq-eis-timeline-factsheet-2020]. The delay sits upstream of the draft document: notice of intent to draft statement consumed on average 58.4% of elapsed time, draft to final 32.2%, and final to record of decision 9.4% [ceq-eis-timeline-factsheet-2020]. Documents ran well past the Council on Environmental Quality''s own recommended limits of 150 pages, or 300 for proposals of unusual scope or complexity: across 761 actions with a final statement published between 1 January 2013 and 31 December 2018, draft statements averaged 575 pages, with appendices averaging a further 584 pages at draft stage and 1,042 at final [ceq-eis-timeline-factsheet-2020]. Predictability is limited less by the statute than by the absence of a governmentwide record of its own operation: the Government Accountability Office found in April 2014 that data on the number and type of most reviews were not readily available and that agencies did not routinely track environmental assessments or categorical exclusions, with the Council on Environmental Quality estimating that about 95% of reviews are categorical exclusions, under 5% environmental assessments and under 1% environmental impact statements [gao-nepa-review-2014]. A published approvals regime exists: Title 41 of the Fixing America''s Surface Transportation Act, enacted 4 December 2015 and codified at 42 United States Code § 4370m, requires the lead federal agency for every covered project to post target completion dates for environmental review and authorization on the Permitting Dashboard, which tracks each project through a status field — planned, in progress, paused, complete, cancelled — across covered projects, transparency projects, Department of Transportation projects and others [permits-performance-gov-dashboard]. The full project and timeline dataset is downloadable by lead agency [permits-performance-gov-data-portal]. That status field is where the proposed-versus-consented-versus-built record becomes visible, and it is sectorally uneven: among covered projects listed on 19 July 2026, several federal offshore wind projects carried paused or cancelled status while mining projects carried in-progress status [permits-performance-gov-dashboard]. The skew tracks policy — an executive order of 20 March 2025 on immediate measures to increase American mineral production directed the Permitting Council''s executive director to publish designated mineral production projects on the dashboard as transparency projects [permits-performance-gov-dashboard].'
capacity_approvals_fr: 'L''État fédéral sait dire oui ou non à un grand projet, mais la décision est lente et n''est mesurée qu''en partie. Toutes agences fédérales confondues, le délai médian d''achèvement d''une étude d''impact environnemental au titre de la loi nationale sur la politique environnementale (National Environmental Policy Act) — de l''avis d''intention à l''étude finale — s''établit à 2,8 ans pour les études finalisées entre janvier 2019 et décembre 2024, et à 2,2 ans pour celles publiées en 2024, année où environ 41 % ont été achevées en deux ans ou moins, contre 24 % en 2019; ces chiffres proviennent de la mise à jour de janvier 2025 du Council on Environmental Quality sur les délais, couvrant 1 903 études finalisées de 2010 à 2024, qui situe la médiane pré-réforme 2010-2018 à 3,2 ans [ceq-eis-timelines-2010-2024]. Le bilan pré-réforme mesuré jusqu''à la décision finale était plus lent encore : une moyenne de 4,5 ans sur les 1 276 études dont la version finale a été publiée entre le 1er janvier 2010 et le 31 décembre 2018, la moitié dépassant 3,5 ans et un quart 6,0 ans [ceq-eis-timeline-factsheet-2020]. Le délai se loge en amont du projet de document : le passage de l''avis d''intention au projet d''étude a absorbé en moyenne 58,4 % du temps écoulé, celui du projet à la version finale 32,2 %, et celui de la version finale à la décision 9,4 % [ceq-eis-timeline-factsheet-2020]. Les documents dépassent largement les limites que le Council on Environmental Quality recommande lui-même — 150 pages, ou 300 pour les projets d''ampleur ou de complexité inhabituelles : sur 761 actions dont l''étude finale a été publiée entre le 1er janvier 2013 et le 31 décembre 2018, les projets d''étude atteignaient en moyenne 575 pages, auxquelles s''ajoutaient des annexes de 584 pages en moyenne au stade du projet et de 1 042 pages au stade final [ceq-eis-timeline-factsheet-2020]. La prévisibilité tient moins à la loi qu''à l''absence de relevé pangouvernemental de son propre fonctionnement : le Government Accountability Office a constaté en avril 2014 que les données sur le nombre et le type de la plupart des examens n''étaient pas aisément disponibles et que les agences ne recensaient pas systématiquement les évaluations environnementales ni les exclusions catégorielles, le Council on Environmental Quality estimant qu''environ 95 % des examens sont des exclusions catégorielles, moins de 5 % des évaluations environnementales et moins de 1 % des études d''impact [gao-nepa-review-2014]. Un régime d''autorisation publié existe : le titre 41 de la loi Fixing America''s Surface Transportation Act, promulgué le 4 décembre 2015 et codifié au titre 42 du United States Code, § 4370m, impose à l''agence fédérale chef de file de tout projet couvert d''afficher les dates cibles d''achèvement de l''examen environnemental et de l''autorisation sur le Permitting Dashboard, lequel suit chaque projet par un champ d''état — planifié, en cours, suspendu, achevé, annulé — pour les projets couverts, les projets de transparence, ceux du département des Transports et les autres [permits-performance-gov-dashboard]. L''ensemble des données de projets et d''échéanciers est téléchargeable par agence chef de file [permits-performance-gov-data-portal]. C''est dans ce champ d''état qu''apparaît le bilan proposé-consenti-construit, et il est sectoriellement inégal : parmi les projets couverts répertoriés le 19 juillet 2026, plusieurs projets éoliens en mer fédéraux portaient l''état suspendu ou annulé tandis que des projets miniers portaient l''état en cours [permits-performance-gov-dashboard]. Ce déséquilibre suit la politique menée — un décret du 20 mars 2025 sur les mesures immédiates d''augmentation de la production minérale américaine a enjoint au directeur exécutif du Permitting Council de publier sur le tableau de bord, à titre de projets de transparence, des projets de production minérale désignés [permits-performance-gov-dashboard].'
capacity_delivery_en: 'The American Society of Civil Engineers graded United States infrastructure a C overall in its 2025 quadrennial assessment of 18 categories — the first C in the series, up from C- in 2021 and D+ in 2017 — and estimates that $9.1 trillion is needed across those categories to reach a state of good repair, against $5.4 trillion in forecast public and private investment over 2024–2033, leaving a $3.7 trillion gap; the Society is a professional engineering body with a known advocacy orientation toward higher infrastructure spending [asce-infrastructure-report-card-2025]. On execution rather than condition, the Government Accountability Office reports that the federal government has great difficulty controlling costs in its procurement portfolio of more than $750 billion, with major acquisitions at the Departments of Defense, Energy and Veterans Affairs and the National Aeronautics and Space Administration experiencing cost growth, schedule delays or both [gao-high-risk-cost-schedule-2025]. Three areas regressed between the 2023 and 2025 assessments — Department of Defense weapon systems acquisition, information-technology acquisition and management, and management of federal real property [gao-high-risk-list][gao-high-risk-cost-schedule-2025]. The federal real-property estate comprises 277,000 buildings whose annual maintenance and operating costs exceeded $10.3 billion in fiscal year 2023, while reported deferred maintenance and repairs rose from $170 billion in 2017 to $370 billion in 2024 [gao-high-risk-cost-schedule-2025]. Two projects illustrate the schedule record: the Veterans Affairs electronic health record modernisation, estimated in 2022 at $49.8 billion in life-cycle costs ($32.7 billion for 13 years of implementation and $17.1 billion for 15 years of sustainment), had been deployed to six locations as of December 2024 with more than 160 remaining [gao-high-risk-cost-schedule-2025]; and a 2023 operational risk assessment found 51 of the Federal Aviation Administration''s 138 air traffic control systems (37%) unsustainable and a further 54 (39%) potentially unsustainable [gao-high-risk-cost-schedule-2025]. Delivery of disaster recovery was added to the high-risk list as a new area in 2025, with federal disaster assistance fragmented across more than 30 entities; appropriations for disaster assistance totalled at least $448 billion over fiscal years 2015–2024, plus $110 billion in supplemental appropriations in December 2024 [gao-high-risk-list][gao-high-risk-cost-schedule-2025].'
capacity_delivery_fr: 'L''American Society of Civil Engineers a attribué la note globale C aux infrastructures américaines dans son évaluation quadriennale de 2025 portant sur 18 catégories — la première note C de la série, contre C- en 2021 et D+ en 2017 — et estime à 9 100 milliards de dollars les besoins d''investissement pour atteindre un bon état d''entretien, face à 5 400 milliards d''investissements publics et privés prévus sur 2024-2033, soit un écart de 3 700 milliards; cette société savante d''ingénieurs a une orientation de plaidoyer connue en faveur d''investissements accrus [asce-infrastructure-report-card-2025]. Du côté de l''exécution plutôt que de l''état, le Government Accountability Office signale que le gouvernement fédéral peine fortement à maîtriser les coûts de son portefeuille d''achats de plus de 750 milliards de dollars, les grands programmes des départements de la Défense, de l''Énergie et des Anciens Combattants ainsi que de la National Aeronautics and Space Administration connaissant des dépassements de coûts, des retards ou les deux [gao-high-risk-cost-schedule-2025]. Trois domaines ont régressé entre les évaluations de 2023 et de 2025 : l''acquisition des systèmes d''armes du département de la Défense, l''acquisition et la gestion des technologies de l''information, et la gestion du patrimoine immobilier fédéral [gao-high-risk-list][gao-high-risk-cost-schedule-2025]. Ce patrimoine immobilier fédéral compte 277 000 bâtiments dont les coûts annuels d''entretien et d''exploitation ont dépassé 10,3 milliards de dollars lors de l''exercice 2023, tandis que l''entretien et les réparations différés déclarés sont passés de 170 milliards en 2017 à 370 milliards en 2024 [gao-high-risk-cost-schedule-2025]. Deux projets illustrent la tenue des échéanciers : la modernisation du dossier de santé électronique des Anciens Combattants, dont le coût sur le cycle de vie était estimé en 2022 à 49,8 milliards de dollars (32,7 milliards pour 13 ans de déploiement et 17,1 milliards pour 15 ans de maintien en condition), n''avait été déployée que sur six sites en décembre 2024, plus de 160 restant à couvrir [gao-high-risk-cost-schedule-2025]; et une évaluation des risques opérationnels de 2023 a conclu que 51 des 138 systèmes de contrôle aérien de la Federal Aviation Administration (37 %) n''étaient pas soutenables, 54 autres (39 %) étant potentiellement non soutenables [gao-high-risk-cost-schedule-2025]. La prestation de l''aide au relèvement après catastrophe a été ajoutée à la liste à haut risque comme nouveau domaine en 2025, l''aide fédérale étant fragmentée entre plus de 30 entités; les crédits d''aide aux sinistrés ont totalisé au moins 448 milliards de dollars sur les exercices 2015-2024, auxquels s''ajoutent 110 milliards de crédits supplémentaires en décembre 2024 [gao-high-risk-list][gao-high-risk-cost-schedule-2025].'
capacity_publicServices_en: 'The Government Accountability Office''s February 2025 high-risk list contains 38 areas, of which a substantial block covers continuous public-service systems: Veterans Affairs health care, Medicare and improper payments, Medicaid programme integrity, oversight of medical products, leadership and coordination of public health emergencies, and federal programmes serving tribes and their members [gao-high-risk-list]. Twenty of the 38 areas are on the list in part because of skills gaps or inadequate staffing [gao-high-risk-cost-schedule-2025]. Programme-integrity losses are large and persistent: federal agencies have reported about $2.8 trillion in estimated improper payments since 2003, including more than $150 billion government-wide in each of the last seven years, and high-risk-list programmes — Medicare and Medicaid among the fastest-growing — accounted for about 80% of the government-wide improper-payment estimate for fiscal year 2023 [gao-high-risk-cost-schedule-2025]. Inspection capacity is a binding constraint in food and drug oversight: the Food and Drug Administration conducted an average of 917 foreign food safety inspections a year over fiscal years 2018–2023, about 5% of its 19,200 annual target [gao-high-risk-cost-schedule-2025]. In education, 53% of public schools reported being understaffed entering the 2022–23 school year, among them 65% in special education and 45% in general elementary teaching, and 44% reported at least one vacant teaching position in October 2022 after the year had started [nces-condition-of-education]. The share of public schools hiring for at least one open teaching position rose from 66% in 2011–12 to 80% in 2020–21, and difficulty filling those positions rose across all twelve reported subject fields — in special education, from 17% of hiring schools in 2011–12 to 40% in 2020–21 [nces-condition-of-education]. The supply pipeline contracted over the same period: completions of teacher preparation programmes fell 20%, from 189,200 in 2012–13 to 151,100 in 2019–20, with traditional-route completions down 28% and the alternative-route share of completers rising from 15% to 23% [nces-condition-of-education]. Staffing difficulty is distributed unevenly by place and poverty: among public schools hiring in mathematics in 2020–21, 24% of low-poverty schools reported difficulty filling the position against 31%–34% of higher-poverty schools, and 27% of suburban schools against 35% of rural schools and 41% of schools in towns [nces-condition-of-education].'
capacity_publicServices_fr: 'La liste à haut risque du Government Accountability Office de février 2025 comprend 38 domaines, dont un bloc important porte sur des systèmes de services publics à prestation continue : les soins de santé des Anciens Combattants, Medicare et les paiements indus, l''intégrité du programme Medicaid, la surveillance des produits médicaux, le pilotage et la coordination des urgences de santé publique, et les programmes fédéraux destinés aux tribus et à leurs membres [gao-high-risk-list]. Vingt des 38 domaines figurent sur la liste en partie en raison de déficits de compétences ou d''effectifs insuffisants [gao-high-risk-cost-schedule-2025]. Les pertes liées à l''intégrité des programmes sont massives et persistantes : les agences fédérales ont déclaré environ 2 800 milliards de dollars de paiements indus estimés depuis 2003, dont plus de 150 milliards à l''échelle du gouvernement chaque année depuis sept ans, les programmes inscrits à la liste à haut risque — Medicare et Medicaid comptant parmi ceux dont la croissance est la plus rapide — représentant environ 80 % de l''estimation gouvernementale pour l''exercice 2023 [gao-high-risk-cost-schedule-2025]. La capacité d''inspection constitue une contrainte déterminante en matière de surveillance alimentaire et pharmaceutique : la Food and Drug Administration a mené en moyenne 917 inspections alimentaires à l''étranger par an sur les exercices 2018-2023, soit environ 5 % de sa cible annuelle de 19 200 [gao-high-risk-cost-schedule-2025]. Dans l''éducation, 53 % des écoles publiques déclaraient manquer de personnel à l''entrée de l''année scolaire 2022-2023, dont 65 % en éducation spécialisée et 45 % en enseignement primaire général, et 44 % faisaient état d''au moins un poste d''enseignant vacant en octobre 2022, l''année déjà commencée [nces-condition-of-education]. La part des écoles publiques recrutant pour au moins un poste vacant est passée de 66 % en 2011-2012 à 80 % en 2020-2021, et les difficultés de recrutement se sont accrues dans les douze disciplines recensées — en éducation spécialisée, de 17 % des écoles recruteuses en 2011-2012 à 40 % en 2020-2021 [nces-condition-of-education]. Le vivier s''est contracté sur la même période : les diplômés des programmes de formation à l''enseignement ont reculé de 20 %, de 189 200 en 2012-2013 à 151 100 en 2019-2020, la filière traditionnelle chutant de 28 % et la part des filières alternatives parmi les diplômés passant de 15 % à 23 % [nces-condition-of-education]. Les difficultés de dotation se répartissent inégalement selon le territoire et la pauvreté : parmi les écoles publiques recrutant en mathématiques en 2020-2021, 24 % des écoles à faible taux de pauvreté signalaient des difficultés de recrutement contre 31 % à 34 % des écoles à taux plus élevé, et 27 % des écoles de banlieue contre 35 % des écoles rurales et 41 % des écoles de petites villes [nces-condition-of-education].'
capacity_productivity_en: 'US productivity growth is being supported by generative AI, which the Congressional Budget Office incorporates as adding about 10 basis points per year to average productivity growth, raising nonfarm business-sector output by about 1% by 2036 [cbo-budget-outlook-2026]. Real business fixed investment grows 3.9% in 2026, driven by AI and the 2025 reconciliation act''s investment incentives [cbo-budget-outlook-2026]. On internal barriers to the movement of goods, labour and capital between the 50 states, the approved Pass A source list contains no usable source measuring current interstate barriers.'
capacity_productivity_fr: 'La croissance de la productivité américaine est soutenue par l''IA générative, que le Congressional Budget Office intègre comme ajoutant environ 10 points de base par an à la croissance moyenne de la productivité, relevant la production du secteur des entreprises non agricoles d''environ 1 % d''ici 2036 [cbo-budget-outlook-2026]. L''investissement fixe réel des entreprises croît de 3,9 % en 2026, tiré par l''IA et les incitations à l''investissement de la loi de réconciliation de 2025 [cbo-budget-outlook-2026]. Concernant les barrières internes à la circulation des biens, de la main-d''œuvre et du capital entre les 50 États, la liste de sources approuvée de la phase A ne contient aucune source utilisable mesurant les barrières interétatiques actuelles.'
capacity_knownAndUnbuilt_en: ''
capacity_knownAndUnbuilt_fr: ''
security_posture_en: 'The United States maintains a globally expeditionary, power-projecting security posture increasingly reoriented toward homeland and Western Hemisphere defence, with an aligned diplomatic orientation anchored in its alliance network but shifting toward burden-transfer to partners [security.military][security.internal][security.transnationalExposure][security.diplomacy].'
security_posture_fr: 'Les États-Unis maintiennent une posture de sécurité expéditionnaire mondiale et de projection de puissance, de plus en plus réorientée vers la défense du territoire et de l''hémisphère occidental, avec une orientation diplomatique alignée ancrée dans leur réseau d''alliances mais évoluant vers un transfert de charge aux partenaires [security.military][security.internal][security.transnationalExposure][security.diplomacy].'
security_internal_en: 'The state maintains its monopoly on force across the whole territory, and the 2026 National Defense Strategy elevates border security and counter-narcotics as top homeland priorities, directing military support to interagency border operations and strikes on alleged drug-trafficking vessels [ndstrategy-2026]. Border enforcement statistics are compiled by Customs and Border Protection [dhs-cbp-border-stats]. Political violence and unrest are tracked by the Armed Conflict Location & Event Data Project (ACLED) [acled-usa]. Following the January 2026 Venezuela operation, the United States conducted a further strike in June 2026 against a Venezuelan gang leader, indicating continued kinetic action against transnational criminal organisations in the hemisphere [maduro-capture-wardept].'
security_internal_fr: 'L''État conserve son monopole de la force sur l''ensemble du territoire, et la Stratégie de défense nationale 2026 érige la sécurité frontalière et la lutte antidrogue en priorités majeures du territoire, orientant l''appui militaire vers les opérations frontalières interagences et les frappes contre des navires soupçonnés de trafic de drogue [ndstrategy-2026]. Les statistiques d''application aux frontières sont compilées par les douanes et la protection des frontières [dhs-cbp-border-stats]. La violence politique et les troubles sont suivis par l''Armed Conflict Location & Event Data Project (ACLED) [acled-usa]. Après l''opération au Venezuela de janvier 2026, les États-Unis ont mené une nouvelle frappe en juin 2026 contre un chef de gang vénézuélien, signe d''une action cinétique continue contre les organisations criminelles transnationales dans l''hémisphère [maduro-capture-wardept].'
security_military_en: 'The United States is the world''s pre-eminent military power with global power-projection across land, sea, air, cyber and space, and a volunteer force. Its 2025 military expenditure was $954 billion, about 33% of the world total and more than the next six countries combined, per the Stockholm International Peace Research Institute (SIPRI) [sipri-milex-2025]. It is a nuclear-weapons state prioritising nuclear modernisation, and in 2025 it allocated $9.9 billion to the Columbia-class ballistic-missile submarine and $13.9 billion to the Virginia-class attack submarine programmes [sipri-milex-2025]. Force size, structure and domain capabilities are catalogued by the International Institute for Strategic Studies in The Military Balance 2026 [iiss-military-balance-2026]. The 2026 National Defense Strategy reorients priorities to homeland defence, deterring China through denial in the Indo-Pacific, allied burden-sharing and rebuilding the defence industrial base [ndstrategy-2026].'
security_military_fr: 'Les États-Unis sont la première puissance militaire mondiale, dotée d''une capacité de projection de puissance mondiale sur terre, mer, air, cyberespace et espace, et d''une armée de volontaires. Leurs dépenses militaires de 2025 se sont élevées à 954 milliards de dollars, soit environ 33 % du total mondial et plus que les six pays suivants réunis, selon le Stockholm International Peace Research Institute (SIPRI) [sipri-milex-2025]. Puissance nucléaire privilégiant la modernisation de son arsenal, le pays a alloué en 2025 9,9 milliards de dollars au sous-marin lanceur d''engins de classe Columbia et 13,9 milliards au programme de sous-marins d''attaque de classe Virginia [sipri-milex-2025]. La taille, la structure et les capacités par domaine des forces sont recensées par l''International Institute for Strategic Studies dans The Military Balance 2026 [iiss-military-balance-2026]. La Stratégie de défense nationale 2026 réoriente les priorités vers la défense du territoire, la dissuasion de la Chine par le déni dans l''Indo-Pacifique, le partage du fardeau avec les alliés et la reconstruction de la base industrielle de défense [ndstrategy-2026].'
security_transnationalExposure_en: 'US transnational exposure centres on cross-border drug trafficking and migration flows, which the 2026 National Defense Strategy and administration frame as narco-terrorism warranting military response, including strikes on trafficking vessels and the January 2026 Venezuela operation targeting figures indicted for narco-terrorism [ndstrategy-2026][maduro-capture-wardept]. Border and migration flow statistics are compiled by Customs and Border Protection [dhs-cbp-border-stats]. Net international migration flows fell historically in 2024–2025 amid intensified enforcement [census-poprelease-2026].'
security_transnationalExposure_fr: 'L''exposition transnationale des États-Unis se concentre sur le trafic de drogue transfrontalier et les flux migratoires, que la Stratégie de défense nationale 2026 et l''administration qualifient de narcoterrorisme justifiant une réponse militaire, dont des frappes sur des navires de trafic et l''opération au Venezuela de janvier 2026 visant des personnes inculpées de narcoterrorisme [ndstrategy-2026][maduro-capture-wardept]. Les statistiques des flux frontaliers et migratoires sont compilées par les douanes et la protection des frontières [dhs-cbp-border-stats]. Le solde migratoire international a chuté historiquement en 2024-2025 dans un contexte d''application renforcée [census-poprelease-2026].'
security_diplomacy_en: 'The United States anchors a global alliance network while its 2026 National Defense Strategy shifts toward transactional burden-sharing, directing European allies to lead their own defence with limited US support and framing China as the primary balance-of-power competitor to be deterred by denial in the Indo-Pacific [ndstrategy-2026]. That network is named and treaty-based: the North Atlantic Treaty binds the United States to the 31 other member states of the North Atlantic Treaty Organization (NATO), 32 members in all as of 2026 [nato-member-countries]; collective-defence treaties cover Japan, South Korea, the Philippines, Australia and New Zealand (ANZUS), Thailand and the Americas under the Rio Treaty [state-collective-defense-arrangements]; a further statutory tier of major non-NATO allies includes Israel, Japan, South Korea and Australia [state-major-non-nato-ally-status]; the AUKUS partnership adds submarine and advanced-capability cooperation with the United Kingdom and Australia [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599]; and the overseas basing and troop presence underwriting these commitments is documented by host country [crs-overseas-basing-r48123]. In the Western Hemisphere the administration has asserted a ''Trump corollary'' to the Monroe Doctrine and acted directly, capturing Venezuelan leader Nicolás Maduro in a January 2026 military operation and installing US influence over a political transition [maduro-capture-wardept][ndstrategy-2026]. In the Middle East, US and Israeli forces began major combat operations against Iran on 28 February 2026 (following the June 2025 strikes on Iranian nuclear sites) [iran-ops-transcript]; a Pakistan-mediated ceasefire took effect 8 April 2026 and was extended and formalised in an interim memorandum of understanding signed 17 June 2026 [whitehouse-epic-fury-ceasefire], then declared over by the President on 8 July 2026 [cnbc-iran-ceasefire-over], and as of 19 July 2026 hostilities are active, with United States strikes and a naval blockade ongoing and no ceasefire in effect [cnn-iran-war-july18]. The character of these relationships is interpretive, anchored to those documented operations and the strategy text [ndstrategy-2026][iran-ops-transcript].'
security_diplomacy_fr: 'Les États-Unis ancrent un réseau d''alliances mondial tandis que leur Stratégie de défense nationale 2026 évolue vers un partage transactionnel du fardeau, enjoignant aux alliés européens de conduire leur propre défense avec un appui américain limité et qualifiant la Chine de principal concurrent d''équilibre des puissances, à dissuader par le déni dans l''Indo-Pacifique [ndstrategy-2026]. Ce réseau est nommé et fondé sur des traités : le traité de l''Atlantique Nord lie les États-Unis aux 31 autres États membres de l''Organisation du traité de l''Atlantique Nord (OTAN), soit 32 membres au total en 2026 [nato-member-countries]; des traités de défense collective couvrent le Japon, la Corée du Sud, les Philippines, l''Australie et la Nouvelle-Zélande (ANZUS), la Thaïlande et les Amériques via le traité de Rio [state-collective-defense-arrangements]; un étage statutaire supplémentaire d''alliés majeurs non membres de l''OTAN comprend Israël, le Japon, la Corée du Sud et l''Australie [state-major-non-nato-ally-status]; le partenariat AUKUS ajoute une coopération sur les sous-marins et les capacités avancées avec le Royaume-Uni et l''Australie [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599]; et les bases et la présence militaire à l''étranger qui sous-tendent ces engagements sont documentées par pays hôte [crs-overseas-basing-r48123]. Dans l''hémisphère occidental, l''administration a affirmé un « corollaire Trump » à la doctrine Monroe et agi directement, capturant le dirigeant vénézuélien Nicolás Maduro lors d''une opération militaire en janvier 2026 et installant l''influence américaine sur une transition politique [maduro-capture-wardept][ndstrategy-2026]. Au Moyen-Orient, les forces américaines et israéliennes ont lancé des opérations de combat majeures contre l''Iran le 28 février 2026 (après les frappes de juin 2025 sur les sites nucléaires iraniens) [iran-ops-transcript]; un cessez-le-feu négocié par le Pakistan est entré en vigueur le 8 avril 2026, prolongé puis formalisé par un protocole d''accord intérimaire signé le 17 juin 2026 [whitehouse-epic-fury-ceasefire], avant d''être déclaré terminé par le président le 8 juillet 2026 [cnbc-iran-ceasefire-over]; au 19 juillet 2026, les hostilités sont actives, avec des frappes américaines et un blocus naval en cours, sans cessez-le-feu en vigueur [cnn-iran-war-july18]. Le caractère de ces relations est interprétatif, ancré à ces opérations documentées et au texte de la stratégie [ndstrategy-2026][iran-ops-transcript].'
situation_en: |-
  [
    {
      "thread": "United States–Iran war",
      "events": [
        {
          "date": "28 February 2026",
          "what": "The United States, in coordination with Israel, began major combat operations against Iran ('Operation Epic Fury'), striking nuclear, ballistic-missile and naval targets [iran-ops-transcript].",
          "changed": "Placed the United States in open armed conflict with Iran, triggering Iranian missile and drone retaliation against Gulf states hosting United States forces and Iran's closure of the Strait of Hormuz [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 April 2026 (7 April in the United States)",
          "what": "A two-week United States–Iran ceasefire mediated by Pakistan took effect, with Iran agreeing to reopen the Strait of Hormuz [whitehouse-epic-fury-ceasefire].",
          "changed": "Halted the principal combat phase after 38 days of strikes and opened negotiations on Iran's nuclear program and the Strait; the pause was later extended and formalised in an interim memorandum of understanding signed 17 June 2026 [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 July 2026",
          "what": "Speaking at the North Atlantic Treaty Organization (NATO) summit in Ankara, Turkey, President Trump declared the ceasefire with Iran 'over' ('For me, I think it's over ... It's just a waste of time dealing with them') after both sides exchanged strikes [cnbc-iran-ceasefire-over].",
          "changed": "Ended the negotiated pause and returned the United States and Iran to active hostilities, with renewed United States strikes, a reimposed naval blockade and Brent crude jumping about 5% to roughly $78 a barrel [cnbc-iran-ceasefire-over]."
        }
      ],
      "currentState": "As of 19 July 2026 United States–Iran hostilities are active: United States forces are conducting consecutive nights of strikes on Iranian infrastructure and enforcing a naval blockade while Iran attacks Gulf shipping and states hosting United States bases; no ceasefire is in effect [cnn-iran-war-july18]."
    },
    {
      "thread": "Federal funding lapses",
      "events": [
        {
          "date": "1 October – 12 November 2025",
          "what": "A lapse in fiscal year 2026 appropriations shut down the federal government for 43 days, ending 12 November 2025 when a continuing resolution and three full-year appropriations bills were enacted [crs-r48832-shutdowns].",
          "changed": "Became the longest full government shutdown in United States history and funded only part of the government through 30 January 2026, setting up the further 2026 lapses [crs-r48832-shutdowns]."
        },
        {
          "date": "14 February – 30 April 2026",
          "what": "Department of Homeland Security (DHS) funding lapsed on 14 February 2026 — after Customs and Border Protection (CBP) agents killed Alex Pretti, a 37-year-old intensive-care nurse, on 24 January 2026 and Senate Democrats withdrew support for the department's appropriations — and ran 76 days until 30 April 2026 [cbs-pretti-cbp-report][crs-r48832-shutdowns].",
          "changed": "Became the longest shutdown of a single federal department in United States history; the department reopened without funding for Immigration and Customs Enforcement (ICE) and CBP, which were financed instead through budget reconciliation [house-approps-dhs-76day]."
        }
      ],
      "currentState": "As of 19 July 2026 all twelve fiscal year 2026 appropriations are enacted, but Immigration and Customs Enforcement and Customs and Border Protection remain funded through reconciliation rather than regular annual appropriations [house-approps-dhs-76day]."
    },
    {
      "thread": "Tariff authority",
      "events": [
        {
          "date": "20 February 2026",
          "what": "The Supreme Court ruled 6–3 in Learning Resources, Inc. v. Trump that the International Emergency Economic Powers Act (IEEPA) does not authorize the President to impose tariffs, striking down the 'reciprocal' and 'trafficking' tariffs [scotus-learning-resources].",
          "changed": "Invalidated the legal basis for the administration's signature tariff program and exposed the government to potential refunds of more than $160 billion in collected duties; the IEEPA tariffs were terminated on 24 February 2026 [crs-lsb11398-tariffs]."
        },
        {
          "date": "24 February 2026",
          "what": "A 10% global import surcharge under Section 122 of the Trade Act of 1974 took effect as a replacement, with President Trump announcing an increase to the 15% statutory ceiling, and capped at 150 days [crs-lsb11398-tariffs].",
          "changed": "Restored broad tariffs on a temporary, statutorily capped footing that requires congressional action to extend beyond 24 July 2026, shifting the administration toward Section 232 and Section 301 authorities for durable duties [crs-lsb11398-tariffs]."
        }
      ],
      "currentState": "As of 19 July 2026 the Section 122 surcharge remains in effect and is set to expire by operation of law on 24 July 2026 absent congressional extension, with Section 301 investigations pending as a replacement and the refund process for the terminated IEEPA tariffs unresolved [crs-lsb11398-tariffs]."
    },
    {
      "thread": "Venezuela intervention",
      "events": [
        {
          "date": "3 January 2026",
          "what": "United States forces raided Caracas ('Operation Absolute Resolve'), capturing Venezuelan President Nicolás Maduro and his wife Cilia Flores and transporting them to New York on narco-terrorism and drug-trafficking charges [maduro-capture-wardept].",
          "changed": "Removed a sitting head of state by foreign military action and installed United States leverage over a Venezuelan transition, with Vice President Delcy Rodríguez sworn in as interim president [crs-maduro-capture]."
        }
      ],
      "currentState": "As of 19 July 2026 Maduro remains in United States custody awaiting trial in the Southern District of New York while the United States retains a large military presence off Venezuela [crs-maduro-capture]."
    }
  ]
situation_fr: |-
  [
    {
      "thread": "Guerre entre les États-Unis et l'Iran",
      "events": [
        {
          "date": "28 février 2026",
          "what": "Les États-Unis, en coordination avec Israël, ont lancé des opérations de combat d'envergure contre l'Iran (« Operation Epic Fury »), frappant des cibles nucléaires, balistiques et navales [iran-ops-transcript].",
          "changed": "Ont placé les États-Unis en conflit armé ouvert avec l'Iran, provoquant des représailles iraniennes par missiles et drones contre les États du Golfe hébergeant des forces américaines ainsi que la fermeture du détroit d'Ormuz par l'Iran [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 avril 2026 (7 avril aux États-Unis)",
          "what": "Un cessez-le-feu de deux semaines entre les États-Unis et l'Iran, négocié par le Pakistan, est entré en vigueur, l'Iran acceptant de rouvrir le détroit d'Ormuz [whitehouse-epic-fury-ceasefire].",
          "changed": "A interrompu la phase principale de combats après 38 jours de frappes et ouvert des négociations sur le programme nucléaire iranien et le détroit; la trêve a ensuite été prolongée puis formalisée par un protocole d'accord intérimaire signé le 17 juin 2026 [whitehouse-epic-fury-ceasefire]."
        },
        {
          "date": "8 juillet 2026",
          "what": "Lors du sommet de l'Organisation du traité de l'Atlantique Nord (OTAN) à Ankara, en Turquie, le président Trump a déclaré le cessez-le-feu avec l'Iran « terminé » (« For me, I think it's over ... It's just a waste of time dealing with them ») après un nouvel échange de frappes [cnbc-iran-ceasefire-over].",
          "changed": "A mis fin à la pause négociée et ramené les États-Unis et l'Iran à des hostilités actives, avec la reprise des frappes américaines, le rétablissement d'un blocus naval et une hausse du Brent d'environ 5 %, à près de 78 dollars le baril [cnbc-iran-ceasefire-over]."
        }
      ],
      "currentState": "Au 19 juillet 2026, les hostilités entre les États-Unis et l'Iran sont actives : les forces américaines mènent des frappes plusieurs nuits d'affilée contre des infrastructures iraniennes et appliquent un blocus naval, tandis que l'Iran vise la navigation dans le Golfe et les États hébergeant des bases américaines; aucun cessez-le-feu n'est en vigueur [cnn-iran-war-july18]."
    },
    {
      "thread": "Ruptures de financement fédéral",
      "events": [
        {
          "date": "1er octobre – 12 novembre 2025",
          "what": "Une interruption des crédits pour l'exercice budgétaire 2026 a paralysé le gouvernement fédéral pendant 43 jours, prenant fin le 12 novembre 2025 avec l'adoption d'une résolution de financement provisoire et de trois lois de crédits pour l'année entière [crs-r48832-shutdowns].",
          "changed": "Est devenue la plus longue paralysie complète du gouvernement de l'histoire des États-Unis et n'a financé qu'une partie du gouvernement jusqu'au 30 janvier 2026, préparant les ruptures ultérieures de 2026 [crs-r48832-shutdowns]."
        },
        {
          "date": "14 février – 30 avril 2026",
          "what": "Le financement du Department of Homeland Security (DHS) a cessé le 14 février 2026 — après que des agents de la Customs and Border Protection (CBP) eurent tué Alex Pretti, infirmier en soins intensifs de 37 ans, le 24 janvier 2026, et que les sénateurs démocrates eurent retiré leur soutien aux crédits du ministère — et a duré 76 jours, jusqu'au 30 avril 2026 [cbs-pretti-cbp-report][crs-r48832-shutdowns].",
          "changed": "Est devenue la plus longue paralysie d'un seul ministère fédéral de l'histoire des États-Unis; le ministère a rouvert sans financement pour l'Immigration and Customs Enforcement (ICE) et la CBP, financées à la place par la voie de la réconciliation budgétaire [house-approps-dhs-76day]."
        }
      ],
      "currentState": "Au 19 juillet 2026, l'ensemble des douze lois de crédits de l'exercice 2026 est adopté, mais l'Immigration and Customs Enforcement et la Customs and Border Protection restent financées par la réconciliation budgétaire plutôt que par les crédits annuels ordinaires [house-approps-dhs-76day]."
    },
    {
      "thread": "Pouvoir tarifaire",
      "events": [
        {
          "date": "20 février 2026",
          "what": "La Cour suprême a jugé, par 6 voix contre 3 dans l'arrêt Learning Resources, Inc. v. Trump, que l'International Emergency Economic Powers Act (IEEPA) n'autorise pas le président à imposer des droits de douane, annulant les tarifs « réciproques » et « anti-trafic » [scotus-learning-resources].",
          "changed": "A invalidé le fondement juridique du programme tarifaire phare de l'administration et exposé le gouvernement à des remboursements potentiels de plus de 160 milliards de dollars de droits perçus; les tarifs fondés sur l'IEEPA ont pris fin le 24 février 2026 [crs-lsb11398-tariffs]."
        },
        {
          "date": "24 février 2026",
          "what": "Une surtaxe mondiale à l'importation de 10 %, fondée sur la Section 122 du Trade Act of 1974, est entrée en vigueur en remplacement, le président Trump ayant annoncé une hausse jusqu'au plafond légal de 15 %, et plafonnée à 150 jours [crs-lsb11398-tariffs].",
          "changed": "A rétabli des droits de douane étendus sur une base temporaire et plafonnée par la loi, exigeant une action du Congrès pour être prolongée au-delà du 24 juillet 2026, et a orienté l'administration vers les autorités des Sections 232 et 301 pour des droits durables [crs-lsb11398-tariffs]."
        }
      ],
      "currentState": "Au 19 juillet 2026, la surtaxe de la Section 122 demeure en vigueur et doit expirer de plein droit le 24 juillet 2026 en l'absence de prolongation par le Congrès, des enquêtes au titre de la Section 301 étant en cours comme remplacement et la procédure de remboursement des tarifs IEEPA supprimés restant non résolue [crs-lsb11398-tariffs]."
    },
    {
      "thread": "Intervention au Venezuela",
      "events": [
        {
          "date": "3 janvier 2026",
          "what": "Les forces américaines ont mené un raid sur Caracas (« Operation Absolute Resolve »), capturant le président vénézuélien Nicolás Maduro et son épouse Cilia Flores et les transférant à New York pour des accusations de narcoterrorisme et de trafic de drogue [maduro-capture-wardept].",
          "changed": "Ont écarté un chef d'État en exercice par une action militaire étrangère et instauré une influence américaine sur une transition vénézuélienne, la vice-présidente Delcy Rodríguez ayant prêté serment comme présidente par intérim [crs-maduro-capture]."
        }
      ],
      "currentState": "Au 19 juillet 2026, Maduro reste en détention aux États-Unis en attente de son procès dans le district sud de New York, tandis que les États-Unis maintiennent une importante présence militaire au large du Venezuela [crs-maduro-capture]."
    }
  ]
