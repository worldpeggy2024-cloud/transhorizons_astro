capacity_knownAndUnbuilt_fr: |-
  {
    "opener": "Sur les manques documentés et non comblés, les États-Unis relèvent d'une auto-évaluation abondante plutôt que rare : le registre ci-dessous repose presque entièrement sur les institutions du pays lui-même — le Government Accountability Office, le Council on Environmental Quality, le Congressional Budget Office, le National Center for Education Statistics, le National Center for Health Statistics et la National Climate Assessment —, complétées en deux points seulement par des évaluateurs externes, de sorte que sa longueur reflète autant ce que l'État publie sur lui-même que ce qu'il a laissé ouvert. C'est ici un registre central, et il s'allonge plutôt qu'il ne se résorbe : les organismes de contrôle consignent des domaines qui régressent d'une évaluation à l'autre et des arriérés qui plus que doublent, tandis que la plupart des entrées ne portent aucune réponse documentée. Les détails suivent.",
    "items": [
      {
        "gap": "Atteindre un bon état d'entretien dans les dix-huit catégories d'infrastructures évaluées en 2025 exige 9 100 milliards de dollars, face à 5 400 milliards d'investissements publics et privés prévus sur 2024-2033, soit un manque de 3 700 milliards; l'organisme évaluateur est une société savante d'ingénieurs à l'orientation de plaidoyer connue en faveur d'investissements accrus.",
        "anchor": [
          "capacity.delivery",
          "asce-infrastructure-report-card-2025"
        ],
        "since": "L'écart d'investissement est un constat récurrent de la série de bulletins depuis sa première édition en 1998 — datation d'un organisme de plaidoyer; aucune identification officielle antérieure n'a été repérée [asce-report-card-history].",
        "class": "in-progress-unclosed"
      },
      {
        "gap": "Le gouvernement fédéral peine fortement à maîtriser les coûts d'un portefeuille d'achats de plus de 750 milliards de dollars, les grands programmes des départements de la Défense, de l'Énergie et des Anciens Combattants ainsi que de la National Aeronautics and Space Administration connaissant des dépassements de coûts, des retards ou les deux, l'acquisition des systèmes d'armes ainsi que l'acquisition et la gestion des technologies de l'information ayant toutes deux régressé entre les évaluations à haut risque de 2023 et de 2025.",
        "anchor": [
          "capacity.delivery",
          "gao-high-risk-cost-schedule-2025",
          "gao-high-risk-list"
        ],
        "since": "L'acquisition des systèmes d'armes et la gestion des acquisitions de la National Aeronautics and Space Administration sont désignées à haut risque depuis 1990, l'acquisition et l'exploitation des technologies de l'information depuis 2015 [gao-high-risk-list].",
        "class": "no-attempt-documented"
