    "opener": "On documented-but-unclosed gaps the United States is a case of abundant self-assessment rather than scarce: the register below rests almost entirely on the country's own institutions — the Government Accountability Office, the Council on Environmental Quality, the Congressional Budget Office, the National Center for Education Statistics, the National Center for Health Statistics and the National Climate Assessment — supplemented at only two points by external scorers, so its length reflects how much the state publishes about itself as much as how much it has left unclosed. This is a central register here, and it is being added to rather than cleared: the auditing bodies record areas regressing between successive assessments and backlogs more than doubling, while most entries carry no documented response at all. Detail follows.",
    "items": [
