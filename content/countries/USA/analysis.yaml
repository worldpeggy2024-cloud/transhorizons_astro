      "rationale_fr": "La confiance envers le gouvernement fédéral s'établit à 17 %, près de son plus bas niveau en soixante-dix ans, et se scinde entre 26 % chez les républicains et 9 % chez les démocrates, le même basculement apparaissant dans la série parallèle de Gallup; le rapport conclut que la ligne de faille principale est partisane et cumulative, alors que les lignes ethniques, linguistiques et religieuses se recoupent."
