security_posture_en: >-
  The security posture is expeditionary, unmatched in reach, and currently at
  war [security.diplomacy]; the diplomatic orientation is aligned, with the
  country at the centre of the bloc rather than attached to one, and disengaging
  from institutions. Both are narrowing rather than expanding: military spending
  is falling and its share of the world total shrinking while allies' rises, and
  the standing strategy reorients from global presence toward homeland defence
  and the Western Hemisphere [security.military]. Capability itself is intact —
  forces are permanently based across dozens of countries, only two locations
  without host-nation consent, and the treaty alliance system remains the
  largest in the world, with Japan meeting the majority of the identifiable
  costs of the presence on its territory and South Korea a substantial share
  [security.military][security.diplomacy]. The reorientation is visible inward
  as well, in military support to interagency border operations and in a contest
  over which level of government commands federalised forces that the courts
  settled against the executive [security.internal]. The assessment machinery is
  being reduced at both ends at once: the statutory body coordinating
  intelligence on foreign influence was dissolved in August 2025 along with the
  equivalent task force at the federal police, while withdrawal from 66
  international organisations included the multilateral bodies for countering
  hybrid threats and for cyber expertise — all in the same period in which the
  intelligence services documented cartel networks, pre-positioned cyber
  intrusions and interference operations in detail
  [security.transnationalExposure][security.diplomacy]. The posture is therefore
  expeditionary in capability, hemispheric in emphasis, aligned but
  transactional in orientation, and increasingly unaccompanied by the
  institutional machinery through which that alignment was formerly exercised.
security_posture_fr: >-
  La posture de sécurité est expéditionnaire, d'une portée sans égale et
  actuellement engagée dans une guerre [security.diplomacy]; l'orientation
  diplomatique est alignée, le pays occupant le centre du bloc plutôt qu'y étant
  rattaché, et se désengage des institutions. Les deux se resserrent plutôt
  qu'elles ne s'étendent : les dépenses militaires reculent et leur part dans le
  total mondial diminue tandis que celle des alliés progresse, et la stratégie
  en vigueur réoriente la présence mondiale vers la défense du territoire et
  l'hémisphère occidental [security.military]. La capacité, elle, demeure
  intacte : des forces sont stationnées en permanence dans des dizaines de pays
  (deux emplacements seulement l'étant sans le consentement du pays hôte) et le
  système d'alliances par traité reste le plus vaste au monde; le Japon assumant
  la majorité des coûts identifiables de cette présence sur son territoire et la
  Corée du Sud une part substantielle [security.military][security.diplomacy].
  La réorientation se lit aussi vers l'intérieur, dans l'appui militaire aux
  opérations frontalières interagences et dans un conflit sur le palier de
  gouvernement habilité à commander des forces fédéralisées, que les tribunaux
  ont tranché contre l'exécutif [security.internal]. L'appareil d'évaluation se
  réduit simultanément aux deux extrémités : l'organisme créé par la loi pour
  coordonner le renseignement sur l'influence étrangère a été dissous en août
  2025, de même que le groupe de travail équivalent de la police fédérale,
  tandis que le retrait de 66 organisations internationales visait notamment les
  organismes multilatéraux de lutte contre les menaces hybrides et de
  cyberexpertise; le tout durant la période même où les services de
  renseignement documentaient en détail les réseaux de cartels, les intrusions
  informatiques pré-positionnées et les opérations d'ingérence
  [security.transnationalExposure][security.diplomacy]. La posture est donc
  expéditionnaire par la capacité, hémisphérique par l'accent, alignée mais
  transactionnelle par l'orientation, et de moins en moins accompagnée de
  l'appareil institutionnel par lequel cet alignement s'exerçait auparavant.
security_internal_en: >-
  The state's monopoly on force is uncontested by non-state actors and was
  contested during the period between levels of government. The sequence began
  on 11 August 2025, when the President declared a crime emergency in the
  District of Columbia and took federal direction of the capital's municipal
  police force under the Home Rule Act — not a National Guard federalisation but
  an authority peculiar to the District [eo-14333-dc-crime-emergency]. From
  October 2025 the executive federalised National Guard units under Title 10 for
  deployment to Chicago over the objection of Illinois's governor, having
  federalised units for Los Angeles and Portland earlier in the year; governors
  in three states obtained injunctions, and in December 2025 the Supreme Court
  declined to disturb them by six votes to three [scotus-trump-v-illinois-2025].
  Under the Federal Protection Mission those forces served under United States
  Army North with the Department of Homeland Security as lead federal agency;
  demobilisation in all three cities completed on 21 January 2026, and Texas
  National Guard personnel were released from stand-by on 11 March 2026
  [northcom-federal-protection-mission]. No episode involved forces declining
  lawful orders; what was disputed was which level of government was entitled to
  issue them.


  The border situation has changed by an order of magnitude. Nationwide
  encounters totalled 91,603 across October, November and December 2025, the
  lowest start to any fiscal year on record and 28% below the previous low set
  in fiscal 2012; the October figure of 30,561 was itself 29% below the previous
  record October [dhs-cbp-border-stats]. Southwest border apprehensions have
  averaged 258 a day, against a daily average of 5,110 between February 2021 and
  December 2024 [dhs-cbp-border-stats]. The Border Patrol recorded fourteen
  consecutive months without releasing an apprehended person into the country
  through June 2026 [dhs-border-releases-2026]. Interdiction has risen as
  crossings have fallen: nationwide seizures of cocaine, methamphetamine,
  heroin, fentanyl and cannabis by weight were 57% higher in fiscal 2026 through
  June than in the same period of fiscal 2024, with 1,072 pounds of fentanyl
  seized in June 2026 alone [dhs-border-releases-2026]. The 2026 National
  Defense Strategy elevates border security and counter-narcotics to top
  homeland priorities and directs military support to interagency border
  operations [ndstrategy-2026]. Domestic organised crime and illicit finance are
  not measured in consolidated form beyond these seizure weights. Illicit
  finance is assessed rather than counted, and enforced through a reporting
  regime of unusual scale. The Treasury's 2024 National Money Laundering Risk
  Assessment, issued with companion assessments of terrorist and proliferation
  financing, identifies the fentanyl trade, domestic and foreign terrorist
  financing, ransomware, professional money-laundering networks and the
  continued digitisation of payments as the principal threats, and a
  beneficial-ownership reporting requirement took effect on 1 January 2024
  [treasury-nra-2024]. Roughly 324,000 registered financial institutions and
  other filers report to the Financial Crimes Enforcement Network, which
  received 4.7 million suspicious activity reports in fiscal 2024 against 4.3
  million in fiscal 2022 [fincen-year-in-review]. In fiscal 2025 the Federal
  Bureau of Investigation arrested 5,957 investigative subjects tied to those
  filings, indicted 4,727 and obtained 2,795 convictions; the network's stated
  priority threats were cartels, Chinese money-laundering networks, fentanyl and
  terrorism financing [fincen-year-in-review].


  Conduct within the security forces is audited principally by bodies inside the
  executive that commands them, and the significant finding of the period came
  from outside it. The Inter-American Commission on Human Rights held the state
  responsible for the torture and death of a detainee in Customs and Border
  Protection custody, found that United States law governing the use of force
  lacked the parameters necessary to safeguard rights, identified serious flaws
  in the criminal investigation including destruction of evidence, and recorded
  that the state did not respond when the finding was transmitted to it twice
  [political.rightsAndChecks].


  Political mobilisation is very large and almost entirely peaceful.
  Demonstrations rose roughly 77% in 2025 over the previous year, the highest
  count since 2020, driven principally by opposition to the administration and
  its migration policy; approximately 97% saw no violence and no police
  intervention [acled-us-overview-2026]. Firearms were present at more than 50
  demonstrations, more than double the 2024 figure. Over two-thirds of those
  demonstrations were explicitly about the President, and about 17% of them
  turned violent — more than five times the rate for demonstrations without
  firearms [acled-us-overview-2026].


  The terrorism threat level is assessed as heightened: the Department of
  Homeland Security judges that the primary threat of mass-casualty violence
  comes from lone offenders and small groups motivated by a mix of ideological
  belief and personal grievance, and issued a bulletin tying the elevated
  environment to direct United States involvement in the conflict between Israel
  and Iran [dhs-ntas].
security_internal_fr: >-
  Le monopole de l'État sur la force n'est contesté par aucun acteur non
  étatique, mais il l'a été durant la période entre paliers de gouvernement. La
  séquence s'est ouverte le 11 août 2025, lorsque le président a déclaré une
  urgence criminelle dans le district de Columbia et pris la direction fédérale
  de la police municipale de la capitale en vertu du Home Rule Act; non pas une
  fédéralisation de la Garde nationale, mais une autorité propre au district
  [eo-14333-dc-crime-emergency]. À compter d'octobre 2025, l'exécutif a
  fédéralisé des unités de la Garde nationale en vertu du titre 10 pour un
  déploiement à Chicago malgré l'opposition du gouverneur de l'Illinois, après
  avoir fédéralisé des unités pour Los Angeles et Portland plus tôt dans
  l'année; les gouverneurs de trois États ont obtenu des injonctions et, en
  décembre 2025, la Cour suprême a refusé de les lever par six voix contre trois
  [scotus-trump-v-illinois-2025]. Dans le cadre de la Federal Protection
  Mission, ces forces relevaient de l'United States Army North, le département
  de la Sécurité intérieure agissant comme organisme fédéral responsable; la
  démobilisation s'est achevée dans les trois villes le 21 janvier 2026, et les
  militaires de la Garde nationale du Texas ont été libérés de l'état d'alerte
  le 11 mars 2026 [northcom-federal-protection-mission]. Aucun épisode n'a vu
  des forces refuser des ordres légaux; la contestation portait sur le palier de
  gouvernement habilité à les donner.


  La situation frontalière a changé d'un ordre de grandeur. Les interceptions de
  personnes à la frontière (que le service désigne par le terme « encounters »
  et qui regroupent les appréhensions entre les points d'entrée et les personnes
  jugées inadmissibles aux points d'entrée) ont totalisé 91 603 en octobre,
  novembre et décembre 2025, soit le plus faible début d'exercice jamais
  enregistré et 28 % en dessous du creux précédent de l'exercice 2012; le
  chiffre d'octobre, 30 561, se situait lui-même 29 % sous le record précédent
  pour ce mois [dhs-cbp-border-stats]. Les appréhensions à la frontière
  sud-ouest s'établissent en moyenne à 258 par jour, contre une moyenne
  quotidienne de 5 110 entre février 2021 et décembre 2024
  [dhs-cbp-border-stats]. La Border Patrol a enregistré quatorze mois
  consécutifs sans remise en liberté sur le territoire d'une personne
  appréhendée, jusqu'en juin 2026 [dhs-border-releases-2026]. Les saisies
  progressent à mesure que les passages diminuent : les saisies nationales de
  cocaïne, de méthamphétamine, d'héroïne, de fentanyl et de cannabis, en poids,
  étaient supérieures de 57 % à l'exercice 2026 jusqu'en juin par rapport à la
  même période de l'exercice 2024, avec 1 072 livres de fentanyl saisies au seul
  mois de juin 2026 [dhs-border-releases-2026]. La Stratégie de défense
  nationale de 2026 érige la sécurité frontalière et la lutte antidrogue en
  priorités intérieures de premier rang et prescrit un appui militaire aux
  opérations frontalières interagences [ndstrategy-2026]. Le crime organisé
  intérieur et le financement illicite ne font l'objet d'aucune mesure
  consolidée au-delà de ces poids de saisie. Le financement illicite fait
  l'objet d'une évaluation plutôt que d'un dénombrement, et il est réprimé au
  moyen d'un régime de déclaration d'une ampleur inhabituelle. L'évaluation
  nationale des risques de blanchiment d'argent publiée par le Trésor en 2024,
  accompagnée d'évaluations parallèles du financement du terrorisme et de la
  prolifération, désigne comme principales menaces le commerce du fentanyl, le
  financement du terrorisme intérieur et étranger, les rançongiciels, les
  réseaux professionnels de blanchiment et la numérisation continue des
  paiements, et une obligation de déclaration des bénéficiaires effectifs est
  entrée en vigueur le 1er janvier 2024 [treasury-nra-2024]. Environ 324 000
  institutions financières inscrites et autres déclarants transmettent leurs
  données au Financial Crimes Enforcement Network, qui a reçu 4,7 millions de
  déclarations d'opérations douteuses à l'exercice 2024, contre 4,3 millions à
  l'exercice 2022 [fincen-year-in-review]. À l'exercice 2025, le Federal Bureau
  of Investigation a arrêté 5 957 personnes visées par une enquête à partir de
  ces déclarations, en a mis 4 727 en accusation et a obtenu 2 795
  condamnations; les menaces prioritaires déclarées par l'organisme étaient les
  cartels, les réseaux chinois de blanchiment d'argent, le fentanyl et le
  financement du terrorisme [fincen-year-in-review].


  La conduite au sein des forces de sécurité est vérifiée principalement par des
  organes internes à l'exécutif qui les commande, et le constat marquant de la
  période est venu de l'extérieur. La Commission interaméricaine des droits de
  l'homme a tenu l'État responsable de la torture et du décès d'une personne
  détenue sous la garde du service des douanes et de la protection des
  frontières, a jugé que le droit des États-Unis régissant l'usage de la force
  ne comportait pas les paramètres nécessaires pour protéger les droits, a
  relevé de graves lacunes dans l'enquête criminelle, dont la destruction
  d'éléments de preuve, et a consigné que l'État n'a pas répondu lorsque le
  constat lui a été transmis à deux reprises [political.rightsAndChecks].


  La mobilisation politique est massive et presque toujours pacifique. Les
  manifestations ont augmenté d'environ 77 % en 2025 par rapport à l'année
  précédente, soit le nombre le plus élevé depuis 2020, portées principalement
  par l'opposition à l'administration et à sa politique migratoire; environ 97 %
  n'ont donné lieu à aucune violence ni à aucune intervention policière
  [acled-us-overview-2026]. Des armes à feu étaient présentes à plus de 50
  manifestations, soit plus du double du chiffre de 2024. Plus des deux tiers de
  ces manifestations portaient explicitement sur le président, et environ 17 %
  d'entre elles ont donné lieu à des violences; ce qui les rend plus de cinq
  fois plus susceptibles de le faire que les manifestations sans armes
  [acled-us-overview-2026]. 


  Le niveau de menace terroriste est jugé élevé : le département de la Sécurité
  intérieure estime que la principale menace de violence de masse provient
  d'auteurs isolés et de petits groupes mus par un mélange de convictions
  idéologiques et de griefs personnels, et a émis un bulletin liant cet
  environnement à l'implication directe des États-Unis dans le conflit entre
  Israël et l'Iran [dhs-ntas].
security_military_en: >-
  The United States is the world's pre-eminent military power, with an
  all-volunteer force and power projection across land, sea, air, cyber and
  space; the Space Force, established in 2019, is the sixth service. The
  department is styled the Department of War in its own publications under an
  executive order of 5 September 2025 authorising that secondary title, but
  remains statutorily the Department of Defense; this report uses the statutory
  name throughout, while sources are cited under the titles they carry
  [eo-14347-department-of-war]. The active force stood at 1,298,099 across the
  five Department of Defense services at the end of fiscal 2025 — Army 454,637,
  Navy 341,109, Air Force 319,119, Marine Corps 173,249 and Space Force 9,985,
  comprising 235,575 officers, 1,049,509 enlisted personnel and 13,015 academy
  cadets — with reserve components adding 760,210, of which the Army National
  Guard accounted for 328,870 and the Air National Guard 105,120
  [budget-appendix-fy2027-personnel]. Congress sets an authorised ceiling
  annually under 10 U.S.C. § 115; for fiscal 2026 it authorised 1,302,800 across
  those five services, an increase of 26,100 concentrated in the Army and Navy,
  or 1,352,800 including the Coast Guard [crs-end-strength-2026].


  The overseas footprint has no parallel. The Department of Defense manages or
  uses at least 128 overseas bases in at least 51 countries — 68 persistent
  bases, of which 56 were established during the Cold War, and 60 other sites to
  which it has access [crs-overseas-basing-r48123]. As of March 2024 roughly
  156,000 active-duty personnel were permanently assigned abroad: about 81,000
  in the Indo-Pacific across 24 persistent bases and 20 other sites,
  concentrated in Japan (54,774) and South Korea (24,234); about 67,200 in
  Europe across 31 persistent bases and 19 other sites, concentrated in Germany
  (35,068), Italy (12,375) and the United Kingdom (10,058); about 5,400 in the
  Middle East across eight persistent bases and 11 other sites, concentrated in
  Bahrain (3,479); about 1,650 in Latin America and the Caribbean; and about
  1,150 in Africa, where the regional command describes its seven access sites
  as minimal-presence posture locations [crs-overseas-basing-r48123]. Those
  figures exclude rotational deployments, which are substantial: in June 2024
  the executive reported roughly 80,000 personnel assigned or deployed to North
  Atlantic Treaty Organization countries in Europe against the 67,200
  permanently assigned [crs-overseas-basing-r48123]. Only two locations covered
  by the report (Syria and Guantánamo Bay) are used without host-nation consent,
  and access elsewhere carries political risk: Niger revoked its
  status-of-forces agreement in March 2024, compelling withdrawal from two bases
  by September [crs-overseas-basing-r48123].


  Host nations carry a larger share of the cost than the headline figure
  suggests. The department reported $714.2 million in burden-sharing
  contributions in fiscal 2023, from Kuwait, Japan, South Korea, Saudi Arabia
  and Poland — but that measure is narrow: the Government Accountability Office
  found that between fiscal 2016 and 2019 Japan provided $12.6 billion and South
  Korea $5.8 billion in direct financial support, equal to 60.2% and 43.3%
  respectively of the departmental obligations associated with the United States
  presence in each country [crs-overseas-basing-r48123]. Total overseas basing
  cost cannot be stated precisely because budget documents do not disaggregate
  by location; the department's own two estimates for fiscal 2023 were $27.8
  billion and $31.7 billion, and overseas military construction took $5.355
  billion of $13.593 billion appropriated worldwide
  [crs-overseas-basing-r48123].


  Spending is the largest in the world and falling. Military expenditure was
  $954 billion in 2025, equal to 3.1% of gross domestic product against 3.4% in
  2016, and 33% of world military spending [sipri-milex-2025]. That was a
  real-terms fall of 7.5% from 2024, against increases by twelve of the fifteen
  largest spenders, and the country's share of world spending dropped 4.3
  percentage points in a single year [sipri-milex-2025]. It still spent 2.8
  times as much as China, down from 3.2 times in 2024, and more than the next
  six countries combined [sipri-milex-2025]. The decline was driven mainly by
  the end of supplemental appropriations for military assistance abroad: of $127
  billion allocated for Ukraine-related support between 2022 and 2025, only
  $65.1 billion had been disbursed by the end of 2025, and no new supplemental
  appropriations were made in 2025 for either Ukraine or Israel
  [sipri-milex-2025].


  It is a nuclear-weapons state prioritising modernisation, allocating $9.9
  billion in 2025 to the nuclear-armed Columbia-class submarine programme and
  $13.9 billion to the conventionally armed Virginia-class programme
  [sipri-milex-2025]. That modernisation now proceeds without a treaty ceiling:
  New START expired on 5 February 2026 with no successor instrument, leaving
  deployed strategic forces under no legally binding numerical limit
  [newstart-cd-statement-2026].
security_military_fr: >-
  Les États-Unis sont la première puissance militaire mondiale, avec une force
  entièrement volontaire et une capacité de projection sur terre, sur mer, dans
  les airs, dans le cyberespace et dans l'espace; la Space Force, créée en 2019,
  en constitue la sixième armée. Le département porte le nom de département de
  la Guerre dans ses propres publications, en vertu d'un décret présidentiel du
  5 septembre 2025 autorisant ce titre secondaire, mais demeure statutairement
  le département de la Défense; le présent rapport emploie partout la
  dénomination légale, les sources étant citées sous le titre qu'elles portent
  [eo-14347-department-of-war]. L'effectif actif s'établissait à 1 298 099 pour
  les cinq armées du département de la Défense à la fin de l'exercice 2025 :
  armée de terre 454 637, marine 341 109, force aérienne 319 119, corps des
  marines 173 249 et Space Force 9 985, soit 235 575 officiers, 1 049 509
  militaires du rang et 13 015 élèves des académies militaires; les composantes
  de réserve y ajoutant 760 210, dont 328 870 pour la Garde nationale de l'armée
  de terre et 105 120 pour la Garde nationale aérienne
  [budget-appendix-fy2027-personnel]. Le Congrès fixe annuellement un plafond
  autorisé en vertu du 10 U.S.C. § 115; pour l'exercice 2026, il a autorisé 1
  302 800 pour ces cinq armées, en hausse de 26 100 concentrée dans l'armée de
  terre et la marine, ou 1 352 800 en incluant la garde côtière
  [crs-end-strength-2026]. 


  L'empreinte outre-mer est sans équivalent. Le département de la Défense gère
  ou utilise au moins 128 bases à l'étranger dans au moins 51 pays : 68 bases
  permanentes, dont 56 établies pendant la guerre froide, et 60 autres sites
  auxquels il a accès [crs-overseas-basing-r48123]. En mars 2024, environ 156
  000 militaires en service à temps plein y étaient affectés en permanence :
  quelque 81 000 dans l'Indo-Pacifique, répartis entre 24 bases permanentes et
  20 autres sites, concentrés au Japon (54 774) et en Corée du Sud (24 234);
  quelque 67 200 en Europe, répartis entre 31 bases permanentes et 19 autres
  sites, concentrés en Allemagne (35 068), en Italie (12 375) et au Royaume-Uni
  (10 058); quelque 5 400 au Moyen-Orient, répartis entre huit bases permanentes
  et 11 autres sites, concentrés à Bahreïn (3 479); quelque 1 650 en Amérique
  latine et dans les Caraïbes; et quelque 1 150 en Afrique, où le commandement
  régional qualifie ses sept sites d'accès "d'emplacements de présence minimale"
  [crs-overseas-basing-r48123]. Ces chiffres excluent les déploiements par
  rotation, qui sont considérables : en juin 2024, l'exécutif faisait état
  d'environ 80 000 militaires affectés ou déployés dans les pays de
  l'Organisation du Traité de l'Atlantique Nord en Europe, contre 67 200
  affectés en permanence [crs-overseas-basing-r48123]. Deux emplacements parmi
  ceux que recense le rapport (Syrie et Guantánamo) sont utilisés sans le
  consentement du pays hôte; l'accès ailleurs comporte un risque politique : le
  Niger a révoqué son accord sur le statut des forces en mars 2024, contraignant
  au retrait de deux bases avant septembre [crs-overseas-basing-r48123].


  Les pays hôtes assument une part des coûts plus importante que ne le laisse
  croire le chiffre global. Le département a déclaré 714,2 millions de dollars
  de contributions au partage du fardeau à l'exercice 2023, en provenance du
  Koweït, du Japon, de la Corée du Sud, de l'Arabie saoudite et de la Pologne.
  Ce chiffre ne recense toutefois qu'une catégorie de versements formellement
  comptabilisés comme telle : le Government Accountability Office a établi
  qu'entre les exercices 2016 et 2019, le Japon avait versé 12,6 milliards de
  dollars et la Corée du Sud 5,8 milliards en soutien financier direct, soit
  respectivement 60,2 % et 43,3 % des engagements du département liés à la
  présence des États-Unis dans chacun de ces pays [crs-overseas-basing-r48123].
  Le coût total des bases à l'étranger ne peut être établi avec précision; les
  documents budgétaires ne le ventilant pas par lieu. Les deux estimations du
  département pour l'exercice 2023 s'élevaient à 27,8 et à 31,7 milliards de
  dollars, et les constructions militaires outre-mer ont absorbé 5,355 milliards
  des 13,593 milliards affectés dans le monde [crs-overseas-basing-r48123].


  Les dépenses militaires des États-Unis sont les plus élevées au monde et elles
  reculent. Elles ont atteint 954 milliards de dollars en 2025, soit 3,1 % du
  produit intérieur brut contre 3,4 % en 2016, et 33 % des dépenses militaires
  mondiales [sipri-milex-2025]. Il s'agit d'un recul de 7,5 % en termes réels
  par rapport à 2024, alors que douze des quinze premiers pays dépensiers
  augmentaient les leurs, et la part du pays dans les dépenses mondiales a chuté
  de 4,3 points de pourcentage en une seule année [sipri-milex-2025]. Le pays
  dépensait encore 2,8 fois plus que la Chine, contre 3,2 fois en 2024, et
  davantage que les six pays suivants réunis [sipri-milex-2025]. Ce repli tient
  principalement à la fin des crédits supplémentaires d'aide militaire à
  l'étranger : sur les 127 milliards affectés au soutien lié à l'Ukraine entre
  2022 et 2025, seuls 65,1 milliards avaient été versés à la fin de 2025, et
  aucun nouveau crédit supplémentaire n'a été accordé en 2025 pour l'Ukraine ou
  pour Israël [sipri-milex-2025].


  Il s'agit d'un État doté de l'arme nucléaire qui privilégie la modernisation,
  ayant affecté 9,9 milliards de dollars en 2025 au programme de sous-marins de
  la classe Columbia, à armement nucléaire, et 13,9 milliards au programme de la
  classe Virginia, à armement conventionnel [sipri-milex-2025]. Cette
  modernisation se poursuit désormais sans plafond conventionnel : le traité New
  START a expiré le 5 février 2026 sans instrument successeur, laissant les
  forces stratégiques déployées sans aucune limite numérique juridiquement
  contraignante [newstart-cd-statement-2026].
security_transnationalExposure_en: >-
  The dominant cross-border flow reversed direction during the period. Net
  international migration fell from roughly 2.7 million in 2023 to 1.3 million
  in 2024 and to about 321,000 in 2025 [census-poprelease-2026]. Border
  encounters fell with it: nationwide encounters totalled 91,603 across October,
  November and December 2025, the lowest start to any fiscal year on record, and
  southwest border apprehensions have averaged 258 a day against 5,110 between
  February 2021 and December 2024 [dhs-cbp-border-stats]. The Intelligence
  Community attributes the decline to changes in United States policy during
  2025 and to increased enforcement both at the border and regionally
  [odni-ata-2026].


  Transnational criminal organisations are the principal non-state entanglement,
  and the assessment names them. Mexico-based organisations — the Sinaloa Cartel
  and the Jalisco New Generation Cartel — dominate production and smuggling of
  fentanyl, heroin, methamphetamine and cocaine into the country; Colombia-based
  organisations and armed groups including the Revolutionary Armed Forces of
  Colombia and the National Liberation Army traffic cocaine to United States and
  European markets, with Colombia remaining the world's largest producer and
  Colombian groups extending trafficking relationships to Ecuadorian and
  Brazilian gangs; and MS-13 maintains established cells inside the country,
  using violence against the Salvadoran diaspora [odni-ata-2026]. Fentanyl
  overdose deaths fell about 30% between September 2024 and September 2025 and
  potency declined, which the assessment attributes to disruption of the
  production supply chain, while cooperation with China and India on precursor
  chemicals is described as improving against tens of thousands of
  fentanyl-related deaths a year [odni-ata-2026]. Beyond narcotics, these
  organisations engage in financial fraud and launder money through
  international financial institutions [odni-ata-2026]. The 2026 National
  Defense Strategy frames this exposure as warranting military response,
  including strikes on trafficking vessels [ndstrategy-2026].


  Cyber exposure is the entanglement with no border at all. Actors linked to
  China, Russia, Iran and North Korea, together with non-state ransomware
  groups, seek to compromise government and private-sector networks and critical
  infrastructure to collect intelligence, create options for future disruption,
  and for financial gain; China and Russia are assessed as the most persistent
  and active [odni-ata-2026]. North Korean cryptocurrency thefts probably took
  $2 billion in 2025 alone, funding the regime including its strategic weapons
  programmes — illicit finance operating as state revenue [odni-ata-2026].
  Financially and ideologically motivated non-state actors are becoming bolder,
  with ransomware groups shifting to faster, high-volume attacks that are harder
  to identify and mitigate, and the assessment expects artificial intelligence
  to accelerate cyber threats [odni-ata-2026].


  Foreign influence is a standing exposure whose assessment apparatus was
  dismantled during the period. Congress established the Foreign Malign
  Influence Center within the Office of the Director of National Intelligence
  under the Intelligence Authorization Act for fiscal years 2018 to 2020,
  codified at 50 U.S.C. § 3059, following the Intelligence Community's
  assessment of Russian efforts to influence the 2016 presidential election; it
  began operating in September 2022 and housed the Election Threats Executive,
  the Community's coordinating authority on election security
  [crs-if12470-fmic]. In August 2025 the Director of National Intelligence
  announced its dissolution as part of a reorganisation, and the Federal Bureau
  of Investigation's Foreign Influence Task Force was dissolved in parallel; the
  ranking members of the House and Senate intelligence committees state that
  intelligence production on foreign plans and intentions toward future United
  States elections has been paralysed and that repeated requests for legally
  required briefings on threats to the 2026 midterms have gone unanswered
  [himes-warner-letter-2026]. Those members are the opposition party's senior
  representatives on the committees; what is not in dispute is that the
  statutory body was created by bipartisan legislation and no longer operates.


  Shared-resource friction runs on water. The 1944 Water Treaty entitles the
  United States to an average of at least 350,000 acre-feet a year from Mexican
  tributaries feeding the Rio Grande, measured over five-year cycles totalling
  1.75 million acre-feet, and the International Boundary and Water Commission
  administers it [crs-if12976-water-treaty]. Mexico has failed to meet the cycle
  obligation on multiple occasions since 1994, and at the close of the cycle in
  late October 2025 had delivered 0.88 million acre-feet against the 1.75
  million owed [crs-if12976-water-treaty]. Congress responded in the
  Consolidated Appropriations Act, 2026, conditioning some funds on the
  Secretary of State certifying delivery, and in February 2026 the State
  Department announced Mexico had committed to annual deliveries of at least
  350,000 acre-feet and to a plan addressing the shortfall
  [crs-if12976-water-treaty]. The same treaty governs border sanitation,
  including raw sewage and industrial wastewater flows in the Tijuana River
  Valley [crs-if12976-water-treaty].
security_transnationalExposure_fr: >-
  Le principal flux transfrontalier s'est inversé au cours de la période. La
  migration internationale nette est passée d'environ 2,7 millions en 2023 à 1,3
  million en 2024, puis à quelque 321 000 en 2025 [census-poprelease-2026]. Les
  interceptions de personnes à la frontière ont suivi : elles ont totalisé 91
  603 en octobre, novembre et décembre 2025, soit le plus faible début
  d'exercice jamais enregistré, et les appréhensions à la frontière sud-ouest
  s'établissent en moyenne à 258 par jour, contre 5 110 entre février 2021 et
  décembre 2024 [dhs-cbp-border-stats]. La communauté du renseignement attribue
  ce recul aux changements de politique intervenus aux États-Unis en 2025 et au
  renforcement de l'application des règles, à la frontière comme dans la région
  [odni-ata-2026].


  Les organisations criminelles transnationales constituent le principal
  enchevêtrement non étatique, et l'évaluation les nomme. Les organisations
  basées au Mexique (le cartel de Sinaloa et le cartel Jalisco Nouvelle
  Génération) dominent la production et l'acheminement du fentanyl, de
  l'héroïne, de la méthamphétamine et de la cocaïne vers le pays; les
  organisations et groupes armés basés en Colombie (dont les Forces armées
  révolutionnaires de Colombie et l'Armée de libération nationale) acheminent la
  cocaïne vers les marchés états-uniens et européens; la Colombie demeurant le
  premier producteur mondial et les groupes colombiens étendant leurs relations
  aux gangs équatoriens et brésiliens. La MS-13 maintient des cellules établies
  à l'intérieur du pays, recourant à la violence contre la diaspora
  salvadorienne [odni-ata-2026]. Les décès par surdose de fentanyl ont reculé
  d'environ 30 % entre septembre 2024 et septembre 2025 et la puissance du
  produit a diminué; ce que l'évaluation attribue à la perturbation de la chaîne
  de production, tandis que la coopération avec la Chine et l'Inde sur les
  précurseurs chimiques est jugée en progrès face à des dizaines de milliers de
  décès liés au fentanyl chaque année [odni-ata-2026]. Au-delà des stupéfiants,
  ces organisations pratiquent la fraude financière et blanchissent des fonds
  par l'entremise d'institutions financières internationales [odni-ata-2026]. La
  Stratégie de défense nationale de 2026 présente cette exposition comme
  justifiant une réponse militaire, y compris des frappes contre des navires de
  trafic [ndstrategy-2026].


  L'exposition cybernétique est l'enchevêtrement sans frontière aucune. Des
  acteurs liés à la Chine, à la Russie, à l'Iran et à la Corée du Nord, de même
  que des groupes non étatiques de rançongiciels, cherchent à compromettre les
  réseaux gouvernementaux, ceux du secteur privé et les infrastructures
  essentielles, afin de recueillir du renseignement, de se ménager des
  possibilités de perturbation future et d'en tirer un gain financier; la Chine
  et la Russie sont jugées les plus persistantes et les plus actives
  [odni-ata-2026]. Les vols de cryptomonnaie nord-coréens ont probablement
  rapporté 2 milliards de dollars pour la seule année 2025, finançant le régime
  et notamment ses programmes d'armement stratégique; financement illicite
  servant de recette d'État [odni-ata-2026]. Les acteurs non étatiques motivés
  par l'argent ou l'idéologie s'enhardissent; les groupes de rançongiciels
  adoptant des attaques plus rapides et plus nombreuses, plus difficiles à
  repérer et à contrer, et l'évaluation prévoit que l'intelligence artificielle
  accélérera les menaces dans le cyberespace [odni-ata-2026].


  L'influence étrangère constitue une exposition permanente dont l'appareil
  d'évaluation a été démantelé au cours de la période. Le Congrès a créé le
  Foreign Malign Influence Center au sein de l'Office of the Director of
  National Intelligence par la loi d'autorisation du renseignement pour les
  exercices 2018 à 2020, codifiée au 50 U.S.C. § 3059, à la suite de
  l'évaluation par la communauté du renseignement des efforts russes visant à
  influencer l'élection présidentielle de 2016. Il est entré en fonction en
  septembre 2022 et abritait l'Election Threats Executive, autorité de
  coordination de la communauté en matière de sécurité électorale
  [crs-if12470-fmic]. En août 2025, la directrice du renseignement national a
  annoncé sa dissolution dans le cadre d'une réorganisation, et la Foreign
  Influence Task Force du Federal Bureau of Investigation a été dissoute en
  parallèle. Les chefs de file de l'opposition aux comités du renseignement de
  la Chambre et du Sénat affirment que la production de renseignement sur les
  intentions étrangères à l'égard des prochaines élections états-uniennes est
  paralysée et que des demandes répétées de séances d'information exigées par la
  loi sur les menaces visant les élections de mi-mandat de 2026 sont restées
  sans réponse [himes-warner-letter-2026]. Ces élus sont les représentants
  principaux du parti d'opposition au sein de ces comités; ce qui n'est pas
  contesté est que l'organisme créé par une loi bipartisane n'existe plus.


  La friction sur les ressources partagées porte sur l'eau. Le traité sur les
  eaux de 1944 donne aux États-Unis droit à une moyenne minimale de 350 000
  acres-pieds par an provenant des affluents mexicains alimentant le Rio Grande,
  calculée sur des cycles de cinq ans totalisant 1,75 million d'acres-pieds; la
  Commission internationale des frontières et des eaux en assure
  l'administration [crs-if12976-water-treaty]. Le Mexique a manqué à cette
  obligation de cycle à plusieurs reprises depuis 1994 et, à la clôture du cycle
  à la fin d'octobre 2025, avait livré 0,88 million d'acres-pieds sur les 1,75
  million dus [crs-if12976-water-treaty]. Le Congrès a réagi dans la loi de
  crédits consolidés de 2026 en conditionnant certains fonds à une attestation
  de livraison par le secrétaire d'État; en février 2026 le département d'État a
  annoncé que le Mexique s'engageait à livrer au moins 350 000 acres-pieds par
  an et à établir un plan pour combler le déficit [crs-if12976-water-treaty]. Le
  même traité régit l'assainissement frontalier, notamment les rejets d'eaux
  usées brutes et d'effluents industriels dans la vallée de la rivière Tijuana
  [crs-if12976-water-treaty].
security_diplomacy_en: >-
  The United States anchors the largest treaty alliance system in the world
  while its 2026 National Defense Strategy shifts toward transactional
  burden-sharing, directing European allies to lead their own defence with
  limited support and framing China as the primary balance-of-power competitor
  to be deterred by denial in the Indo-Pacific [ndstrategy-2026]. The system is
  named and treaty-based: the North Atlantic Treaty binds the country to the 31
  other members of the North Atlantic Treaty Organization, 32 in all as of 2026
  [nato-member-countries]; collective-defence treaties cover Japan, South Korea,
  the Philippines, Australia and New Zealand, Thailand, and the Americas under
  the Rio Treaty [state-collective-defense-arrangements]; a statutory tier of
  major non-NATO allies includes Israel, Japan, South Korea and Australia
  [state-major-non-nato-ally-status]; and the AUKUS partnership adds submarine
  and advanced-capability cooperation with the United Kingdom and Australia
  [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599].


  The commitments are underwritten by forces on the ground, and the weight is
  unevenly distributed. As of March 2024, 54,774 personnel were permanently
  assigned in Japan, 35,068 in Germany, 24,234 in South Korea, 12,375 in Italy
  and 10,058 in the United Kingdom [crs-overseas-basing-r48123]. Host-nation
  support tracks that weight: between fiscal 2016 and 2019 Japan provided $12.6
  billion and South Korea $5.8 billion in direct financial support, covering
  60.2% and 43.3% respectively of the departmental obligations associated with
  the presence in each country [crs-overseas-basing-r48123]. Trade runs the
  other way from security: the largest bilateral goods deficits in 2025 were
  with the European Union at $218.8 billion, mainland China at $202.1 billion,
  Mexico at $196.9 billion, Vietnam at $178.2 billion and Taiwan at $146.8
  billion, against surpluses with the Netherlands at $60.7 billion and the
  United Kingdom at $32.2 billion [bea-census-trade-annual-2025]. The China
  relationship is being restructured through that channel: its share of United
  States goods imports fell from 13.2% in 2024 to 7.7% by the end of 2025
  [imf-art-iv-usa-2026].


  The standing territorial dispute is Guantánamo Bay. Under a February 1903
  lease agreement for coaling and naval stations, the United States recognised
  the continuance of Cuba's ultimate sovereignty over the leased area while Cuba
  consented that the United States would exercise complete jurisdiction and
  control within it [crs-r44137-guantanamo]. The 1934 Treaty of Relations
  repealed the 1903 treaty under which the lease was made but preserved the
  lease agreements themselves, which can now be modified or abrogated only by
  agreement between the two governments; the territorial limits therefore stand
  as they were in 1934 unless the United States abandons the station
  [crs-r44137-guantanamo]. Cuba's government regards the presence as an illegal
  occupation of its territory [crs-r44137-guantanamo].


  In the Western Hemisphere the administration has asserted a corollary to the
  Monroe Doctrine and acted directly, capturing Venezuelan leader Nicolás Maduro
  in a January 2026 military operation and installing influence over a political
  transition [maduro-capture-wardept][ndstrategy-2026].


  In the Middle East the country has been at war with Iran since 28 February
  2026, fighting alongside Israel [iran-ops-transcript]. Mediation has run
  through third parties rather than bilaterally: Pakistan brokered the ceasefire
  that held from April to July, and the substantive channel has since moved to
  Muscat, where Iran and Oman are negotiating a new Strait of Hormuz transit
  route [whitehouse-epic-fury-ceasefire][cnn-iran-war-august2026]. The naval
  blockade of Iranian ports reaches third-country commercial shipping, which
  gives states with no part in the conflict a direct interest in its terms
  [cnn-iran-war-august2026].


  Multilateral membership is being reduced on a scale without precedent since
  1945. An executive order of 20 January 2025 directed withdrawal from the Paris
  Agreement, effective 27 January 2026 under Article 28 of that agreement
  [crs-r48504-paris]. Executive Order 14199 of 4 February 2025 terminated
  participation in the United Nations Human Rights Council and ordered the
  Secretary of State to review every intergovernmental organisation, convention
  and treaty to which the country belongs [potus-memo-withdrawals-2026]. Acting
  on that review, a presidential memorandum of 7 January 2026 directed
  withdrawal from 66 named organisations — 35 outside the United Nations system
  and 31 within it — instructing agencies to effect the withdrawals as soon as
  possible and, for United Nations entities, to cease participation and funding
  so far as law permits; the memorandum states that review of further findings
  remains ongoing [potus-memo-withdrawals-2026]. The named bodies include the
  United Nations Framework Convention on Climate Change and the
  Intergovernmental Panel on Climate Change, and — bearing directly on exposures
  recorded elsewhere in this report — the European Centre of Excellence for
  Countering Hybrid Threats, the Global Forum on Cyber Expertise, the Global
  Counterterrorism Forum and the Global Forum on Migration and Development
  [potus-memo-withdrawals-2026][state-withdrawal-66-2026]. Ordered withdrawals
  are now completing: membership of the World Health Organization terminated on
  22 January 2026 [state-who-termination-2026]. The retreat reaches arms control
  as well — the New START treaty expired on 5 February 2026 with no successor
  instrument, leaving deployed strategic nuclear forces under no legally binding
  numerical limit [newstart-cd-statement-2026].
security_diplomacy_fr: >-
  Les États-Unis ancrent le plus vaste système d'alliances par traité au monde,
  tandis que leur Stratégie de défense nationale de 2026 s'oriente vers un
  partage transactionnel du fardeau, enjoignant aux alliés européens d'assurer
  eux-mêmes leur défense avec un appui limité et désignant la Chine comme le
  principal concurrent dans l'équilibre des puissances, à dissuader par le déni
  dans l'Indo-Pacifique [ndstrategy-2026]. Le système est nommé et fondé sur des
  traités : le Traité de l'Atlantique Nord lie le pays aux 31 autres membres de
  l'Organisation du Traité de l'Atlantique Nord, soit 32 en tout en 2026
  [nato-member-countries]; des traités de défense collective visent le Japon, la
  Corée du Sud, les Philippines, l'Australie et la Nouvelle-Zélande, la
  Thaïlande, ainsi que les Amériques au titre du Traité de Rio
  [state-collective-defense-arrangements]; un palier statutaire d'alliés majeurs
  hors OTAN comprend Israël, le Japon, la Corée du Sud et l'Australie
  [state-major-non-nato-ally-status]; et le partenariat AUKUS y ajoute une
  coopération sur les sous-marins et les capacités avancées avec le Royaume-Uni
  et l'Australie [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599].


  Ces engagements reposent sur des forces déployées, et le poids en est
  inégalement réparti. En mars 2024, 54 774 militaires étaient affectés en
  permanence au Japon, 35 068 en Allemagne, 24 234 en Corée du Sud, 12 375 en
  Italie et 10 058 au Royaume-Uni [crs-overseas-basing-r48123]. Le soutien des
  pays hôtes suit cette répartition : entre les exercices 2016 et 2019, le Japon
  a fourni 12,6 milliards de dollars et la Corée du Sud 5,8 milliards en soutien
  financier direct, couvrant respectivement 60,2 % et 43,3 % des engagements du
  département liés à cette présence [crs-overseas-basing-r48123]. Le commerce
  joue en sens inverse de la sécurité : les principaux déficits bilatéraux sur
  les biens en 2025 visaient l'Union européenne (218,8 milliards), la Chine
  continentale (202,1 milliards), le Mexique (196,9 milliards), le Vietnam
  (178,2 milliards) et Taïwan (146,8 milliards), contre des excédents avec les
  Pays-Bas (60,7 milliards) et le Royaume-Uni (32,2 milliards)
  [bea-census-trade-annual-2025]. La relation avec la Chine se restructure par
  ce canal : sa part dans les importations de biens des États-Unis est passée de
  13,2 % en 2024 à 7,7 % à la fin de 2025 [imf-art-iv-usa-2026].


  Le différend territorial permanent porte sur la baie de Guantánamo. Aux termes
  d'un accord de bail de février 1903 visant l'établissement de stations navales
  et de soutage, les États-Unis ont reconnu le maintien de la souveraineté
  ultime de Cuba sur la zone louée; Cuba consentant en retour à ce que les
  États-Unis y exercent une compétence et un contrôle complets
  [crs-r44137-guantanamo]. Le traité de relations de 1934 a abrogé le traité de
  1903 en vertu duquel le bail avait été conclu, mais a préservé les accords de
  bail eux-mêmes, qui ne peuvent désormais être modifiés ou abrogés que par
  entente entre les deux gouvernements. Les limites territoriales demeurent donc
  celles de 1934, à moins que les États-Unis n'abandonnent la station
  [crs-r44137-guantanamo]. Le gouvernement cubain considère cette présence comme
  une occupation illégale de son territoire [crs-r44137-guantanamo].


  Dans l'hémisphère occidental, l'administration a affirmé un corollaire à la
  doctrine Monroe et agi directement, capturant le dirigeant vénézuélien Nicolás
  Maduro lors d'une opération militaire en janvier 2026 et installant son
  influence sur une transition politique
  [maduro-capture-wardept][ndstrategy-2026].


  Au Moyen-Orient, le pays est en guerre contre l'Iran depuis le 28 février
  2026, aux côtés d'Israël [iran-ops-transcript]. La médiation passe par des
  tiers plutôt que par un canal bilatéral : le Pakistan a négocié le
  cessez-le-feu en vigueur d'avril à juillet, et le canal substantiel s'est
  depuis déplacé vers Mascate, où l'Iran et Oman négocient une nouvelle voie de
  transit dans le détroit d'Ormuz
  [whitehouse-epic-fury-ceasefire][cnn-iran-war-august2026]. Le blocus naval des
  ports iraniens touche la navigation commerciale de pays tiers; ce qui donne à
  des États étrangers au conflit un intérêt direct dans ses modalités
  [cnn-iran-war-august2026].


  L'appartenance multilatérale se réduit à une échelle sans précédent depuis
  1945. Un décret présidentiel du 20 janvier 2025 a ordonné le retrait de
  l'Accord de Paris, effectif le 27 janvier 2026 en application de l'article 28
  de cet accord [crs-r48504-paris]. Le décret présidentiel 14199 du 4 février
  2025 a mis fin à la participation au Conseil des droits de l'homme des Nations
  unies et chargé le secrétaire d'État d'examiner l'ensemble des organisations
  intergouvernementales, conventions et traités auxquels le pays est partie
  [potus-memo-withdrawals-2026]. Donnant suite à cet examen, un mémorandum
  présidentiel du 7 janvier 2026 a ordonné le retrait de 66 organisations
  nommément désignées (35 hors du système des Nations unies et 31 en son sein),
  enjoignant aux organismes de procéder aux retraits dans les meilleurs délais
  et, pour les entités onusiennes, de cesser toute participation et tout
  financement dans la mesure permise par la loi; le mémorandum précise que
  l'examen d'autres conclusions se poursuit [potus-memo-withdrawals-2026]. Parmi
  les organismes visés figurent la Convention-cadre des Nations unies sur les
  changements climatiques et le Groupe d'experts intergouvernemental sur
  l'évolution du climat ainsi que (ce qui touche directement des expositions
  relevées ailleurs dans le présent rapport) le Centre d'excellence européen
  pour la lutte contre les menaces hybrides, le Forum mondial sur la
  cyberexpertise, le Forum mondial de lutte contre le terrorisme et le Forum
  mondial sur la migration et le développement
  [potus-memo-withdrawals-2026][state-withdrawal-66-2026]. Les retraits ordonnés
  se concrétisent : l'appartenance à l'Organisation mondiale de la santé a pris
  fin le 22 janvier 2026 [state-who-termination-2026]. Ce repli atteint aussi la
  maîtrise des armements : le traité New START a expiré le 5 février 2026 sans
  instrument successeur, laissant les forces nucléaires stratégiques déployées
  sans aucune limite numérique juridiquement contraignante
  [newstart-cd-statement-2026].
