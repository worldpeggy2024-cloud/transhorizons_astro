      "probability": "Med",
      "impact": "High",
      "timeHorizon": "12–18 months",
      "leadingIndicators": "10-year Treasury yield; bid-to-cover ratios at auctions; CBO revised deficit projections; credit default swap (CDS) spreads on U.S. sovereign debt [cbo-outlook-2026-2036] [moodys-downgrade-2025]",
      "mitigants": "Reserve currency status provides extraordinary demand buffer; Fed emergency purchase authority; constitutional debt ceiling reform"
    },
    {
      "title": "Multi-Theater Military Overstretch",
      "trigger": "Simultaneous commitments in Iran (Operation Epic Fury), Venezuela (Absolute Resolve), Yemen (Rough Rider residual), Syria (Hawkeye Strike), Caribbean (Southern Spear), and West Africa exceed serviceable force rotation depth; readiness degradation triggers adversary opportunism (Taiwan Strait pressure, North Korea provocation)",
      "probability": "Med",
      "impact": "High",
      "timeHorizon": "6–18 months",
      "leadingIndicators": "Carrier strike group deployment tempo; maintenance backlog indicators; RAND/CRS readiness assessments; Chinese PLA activity in Taiwan Strait [sipri-milex-2025] [operation-epic-fury-iran-feb-2026]",
      "mitigants": "$954B defense budget sustains high optempo in near term [sipri-milex-2025]; allied burden-sharing increase from NATO Europe [sipri-milex-2025]; possible ceasefire in Iran that reduces primary theater load"
    },
    {
      "title": "Constitutional Crisis / Judicial Compliance",
      "trigger": "Executive branch refuses compliance with a Supreme Court order in a pending high-profile case (immigration, war powers, election integrity); triggers an Article III institutional crisis with no enforcement mechanism beyond the executive's own compliance",
      "probability": "Med",
      "impact": "High",
      "timeHorizon": "6–12 months",
      "leadingIndicators": "Administration's stated position on pending SCOTUS cases; Trump v. CASA enforcement record [trump-v-casa-2025]; Congressional response to executive noncompliance; ACLED protest data [acled-usa-conflict-data] [vdem-democracy-report-2026]",
      "mitigants": "Historical norm of executive compliance with SCOTUS; Republican Senate institutional interest in judicial authority; business elite concern over rule-of-law premium"
    },
    {
      "title": "Tariff Trade-War Reignition / WTO Architecture Damage",
      "trigger": "Post-IEEPA pivot to Section 301/232 investigations triggers retaliatory tariffs from EU, China, and Canada, reopening a full trade-war cycle; global WTO dispute queue becomes dysfunctional from overload; supply chain disruption raises domestic inflation",
      "probability": "Med",
      "impact": "Med",
      "timeHorizon": "3–12 months",
      "leadingIndicators": "EU and Chinese retaliatory tariff announcements; May 2026 monthly trade deficit trend [census-foreign-trade-press-release-2026]; BLS CPI import component [bls-cpi-may-2026]; WTO dispute filings [wto-usa-trade-profile]",
      "mitigants": "Administration preference for bilateral negotiated outcomes; business lobby pressure against systemic supply-chain disruption; USMCA stability provides North American buffer [ustr-trade-policy-2025]"
    },
    {
      "title": "Domestic Political Violence / 2026 Midterm Instability",
      "trigger": "Contested midterm results in November 2026 in a hyper-polarized environment; election integrity claims replay 2020 dynamics; ACLED-tracked political violence incidents escalate; loss of House or Senate majority triggers governance gridlock",
      "probability": "Med",
      "impact": "Med",
