security_posture_en: >-
  The United States maintains a globally expeditionary, power-projecting
  security posture increasingly reoriented toward homeland and Western
  Hemisphere defence, with an aligned diplomatic orientation anchored in its
  alliance network but shifting toward burden-transfer to partners
  [security.military][security.internal][security.transnationalExposure][security.diplomacy].
security_posture_fr: >-
  Les États-Unis maintiennent une posture de sécurité expéditionnaire mondiale
  et de projection de puissance, de plus en plus réorientée vers la défense du
  territoire et de l'hémisphère occidental, avec une orientation diplomatique
  alignée ancrée dans leur réseau d'alliances mais évoluant vers un transfert de
  charge aux partenaires
  [security.military][security.internal][security.transnationalExposure][security.diplomacy].
security_internal_en: >-
  The state maintains its monopoly on force across the whole territory, and the
  2026 National Defense Strategy elevates border security and counter-narcotics
  as top homeland priorities, directing military support to interagency border
  operations and strikes on alleged drug-trafficking vessels [ndstrategy-2026].
  Border enforcement statistics are compiled by Customs and Border Protection
  [dhs-cbp-border-stats]. Political violence and unrest are tracked by the Armed
  Conflict Location & Event Data Project (ACLED) [acled-usa]. Following the
  January 2026 Venezuela operation, the United States conducted a further strike
  in June 2026 against a Venezuelan gang leader, indicating continued kinetic
  action against transnational criminal organisations in the hemisphere
  [maduro-capture-wardept].
security_internal_fr: >-
  L'État conserve son monopole de la force sur l'ensemble du territoire, et la
  Stratégie de défense nationale 2026 érige la sécurité frontalière et la lutte
  antidrogue en priorités majeures du territoire, orientant l'appui militaire
  vers les opérations frontalières interagences et les frappes contre des
  navires soupçonnés de trafic de drogue [ndstrategy-2026]. Les statistiques
  d'application aux frontières sont compilées par les douanes et la protection
  des frontières [dhs-cbp-border-stats]. La violence politique et les troubles
  sont suivis par l'Armed Conflict Location & Event Data Project (ACLED)
  [acled-usa]. Après l'opération au Venezuela de janvier 2026, les États-Unis
  ont mené une nouvelle frappe en juin 2026 contre un chef de gang vénézuélien,
  signe d'une action cinétique continue contre les organisations criminelles
  transnationales dans l'hémisphère [maduro-capture-wardept].
security_military_en: >-
  The United States is the world's pre-eminent military power with global
  power-projection across land, sea, air, cyber and space, and a volunteer
  force. Its 2025 military expenditure was $954 billion, about 33% of the world
  total and more than the next six countries combined, per the Stockholm
  International Peace Research Institute (SIPRI) [sipri-milex-2025]. It is a
  nuclear-weapons state prioritising nuclear modernisation, and in 2025 it
  allocated $9.9 billion to the Columbia-class ballistic-missile submarine and
  $13.9 billion to the Virginia-class attack submarine programmes
  [sipri-milex-2025]. Force size, structure and domain capabilities are
  catalogued by the International Institute for Strategic Studies in The
  Military Balance 2026 [iiss-military-balance-2026]. The 2026 National Defense
  Strategy reorients priorities to homeland defence, deterring China through
  denial in the Indo-Pacific, allied burden-sharing and rebuilding the defence
  industrial base [ndstrategy-2026].
security_military_fr: >-
  Les États-Unis sont la première puissance militaire mondiale, dotée d'une
  capacité de projection de puissance mondiale sur terre, mer, air, cyberespace
  et espace, et d'une armée de volontaires. Leurs dépenses militaires de 2025 se
  sont élevées à 954 milliards de dollars, soit environ 33 % du total mondial et
  plus que les six pays suivants réunis, selon le Stockholm International Peace
  Research Institute (SIPRI) [sipri-milex-2025]. Puissance nucléaire
  privilégiant la modernisation de son arsenal, le pays a alloué en 2025 9,9
  milliards de dollars au sous-marin lanceur d'engins de classe Columbia et 13,9
  milliards au programme de sous-marins d'attaque de classe Virginia
  [sipri-milex-2025]. La taille, la structure et les capacités par domaine des
  forces sont recensées par l'International Institute for Strategic Studies dans
  The Military Balance 2026 [iiss-military-balance-2026]. La Stratégie de
  défense nationale 2026 réoriente les priorités vers la défense du territoire,
  la dissuasion de la Chine par le déni dans l'Indo-Pacifique, le partage du
  fardeau avec les alliés et la reconstruction de la base industrielle de
  défense [ndstrategy-2026].
security_transnationalExposure_en: >-
  US transnational exposure centres on cross-border drug trafficking and
  migration flows, which the 2026 National Defense Strategy and administration
  frame as narco-terrorism warranting military response, including strikes on
  trafficking vessels and the January 2026 Venezuela operation targeting figures
  indicted for narco-terrorism [ndstrategy-2026][maduro-capture-wardept]. Border
  and migration flow statistics are compiled by Customs and Border Protection
  [dhs-cbp-border-stats]. Net international migration flows fell historically in
  2024–2025 amid intensified enforcement [census-poprelease-2026].
security_transnationalExposure_fr: >-
  L'exposition transnationale des États-Unis se concentre sur le trafic de
  drogue transfrontalier et les flux migratoires, que la Stratégie de défense
  nationale 2026 et l'administration qualifient de narcoterrorisme justifiant
  une réponse militaire, dont des frappes sur des navires de trafic et
  l'opération au Venezuela de janvier 2026 visant des personnes inculpées de
  narcoterrorisme [ndstrategy-2026][maduro-capture-wardept]. Les statistiques
  des flux frontaliers et migratoires sont compilées par les douanes et la
  protection des frontières [dhs-cbp-border-stats]. Le solde migratoire
  international a chuté historiquement en 2024-2025 dans un contexte
  d'application renforcée [census-poprelease-2026].
security_diplomacy_en: >-
  The United States anchors a global alliance network while its 2026 National
  Defense Strategy shifts toward transactional burden-sharing, directing
  European allies to lead their own defence with limited US support and framing
  China as the primary balance-of-power competitor to be deterred by denial in
  the Indo-Pacific [ndstrategy-2026]. That network is named and treaty-based:
  the North Atlantic Treaty binds the United States to the 31 other member
  states of the North Atlantic Treaty Organization (NATO), 32 members in all as
  of 2026 [nato-member-countries]; collective-defence treaties cover Japan,
  South Korea, the Philippines, Australia and New Zealand (ANZUS), Thailand and
  the Americas under the Rio Treaty [state-collective-defense-arrangements]; a
  further statutory tier of major non-NATO allies includes Israel, Japan, South
  Korea and Australia [state-major-non-nato-ally-status]; the AUKUS partnership
  adds submarine and advanced-capability cooperation with the United Kingdom and
  Australia [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599]; and the overseas
  basing and troop presence underwriting these commitments is documented by host
  country [crs-overseas-basing-r48123]. In the Western Hemisphere the
  administration has asserted a 'Trump corollary' to the Monroe Doctrine and
  acted directly, capturing Venezuelan leader Nicolás Maduro in a January 2026
  military operation and installing US influence over a political transition
  [maduro-capture-wardept][ndstrategy-2026]. In the Middle East, US and Israeli
  forces began major combat operations against Iran on 28 February 2026
  (following the June 2025 strikes on Iranian nuclear sites)
  [iran-ops-transcript]; a Pakistan-mediated ceasefire took effect 8 April 2026
  and was extended and formalised in an interim memorandum of understanding
  signed 17 June 2026 [whitehouse-epic-fury-ceasefire], then declared over by
  the President on 8 July 2026 [cnbc-iran-ceasefire-over], and as of 19 July
  2026 hostilities are active, with United States strikes and a naval blockade
  ongoing and no ceasefire in effect [cnn-iran-war-july18]. The character of
  these relationships is interpretive, anchored to those documented operations
  and the strategy text [ndstrategy-2026][iran-ops-transcript].
security_diplomacy_fr: >-
  Les États-Unis ancrent un réseau d'alliances mondial tandis que leur Stratégie
  de défense nationale 2026 évolue vers un partage transactionnel du fardeau,
  enjoignant aux alliés européens de conduire leur propre défense avec un appui
  américain limité et qualifiant la Chine de principal concurrent d'équilibre
  des puissances, à dissuader par le déni dans l'Indo-Pacifique
  [ndstrategy-2026]. Ce réseau est nommé et fondé sur des traités : le traité de
  l'Atlantique Nord lie les États-Unis aux 31 autres États membres de
  l'Organisation du traité de l'Atlantique Nord (OTAN), soit 32 membres au total
  en 2026 [nato-member-countries]; des traités de défense collective couvrent le
  Japon, la Corée du Sud, les Philippines, l'Australie et la Nouvelle-Zélande
  (ANZUS), la Thaïlande et les Amériques via le traité de Rio
  [state-collective-defense-arrangements]; un étage statutaire supplémentaire
  d'alliés majeurs non membres de l'OTAN comprend Israël, le Japon, la Corée du
  Sud et l'Australie [state-major-non-nato-ally-status]; le partenariat AUKUS
  ajoute une coopération sur les sous-marins et les capacités avancées avec le
  Royaume-Uni et l'Australie [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599];
  et les bases et la présence militaire à l'étranger qui sous-tendent ces
  engagements sont documentées par pays hôte [crs-overseas-basing-r48123]. Dans
  l'hémisphère occidental, l'administration a affirmé un « corollaire Trump » à
  la doctrine Monroe et agi directement, capturant le dirigeant vénézuélien
  Nicolás Maduro lors d'une opération militaire en janvier 2026 et installant
  l'influence américaine sur une transition politique
  [maduro-capture-wardept][ndstrategy-2026]. Au Moyen-Orient, les forces
