baseline_en: >-
  The United States of America is a federal presidential republic under unified
  Republican control of the presidency and both chambers, with the balance of
  power moving toward the executive: in 2026 the Supreme Court voided for-cause
  removal protection for the heads of independent agencies, leaving the Federal
  Reserve a provisional exception [trump-v-slaughter-2026][trump-v-cook-2026].
  It is also at war. Strikes on Iran resumed after the President declared the
  Pakistan-mediated ceasefire over on 8 July 2026, and United States forces are
  striking Iranian targets and enforcing a naval blockade with no ceasefire in
  effect [cnbc-iran-ceasefire-over][cnn-iran-war-july18]; a January 2026 raid on
  Caracas removed the sitting Venezuelan president, who awaits trial in New York
  [maduro-capture-wardept][crs-maduro-capture]. Ordinary government has broken
  repeatedly around these operations: the longest full shutdown on record was
  followed by a 76-day funding lapse at the Department of Homeland Security,
  whose immigration and border agencies now run on reconciliation money rather
  than annual appropriations [crs-r48832-shutdowns][house-approps-dhs-76day],
  and the signature tariff program was struck down in February, its statutory
  replacement expiring by operation of law on 24 July 2026
  [scotus-learning-resources][crs-lsb11398-tariffs]. The economy is growing and
  faces no external financing constraint as issuer of the principal reserve
  currency, against a deficit of 5.8% of gross domestic product and public debt
  at 101% [cbo-budget-outlook-2026][treasury-tic-debt-holders]. Trust in the
  federal government stands at 17%, near a seventy-year low and sorted by party
  rather than shared [pew-trust-in-government], and independent scorers have
  downgraded the country from liberal democracy to electoral democracy for the
  first time in over five decades [vdem-democracy-report-2026].
baseline_fr: >-
  Les États-Unis d'Amérique sont une république fédérale présidentielle sous
  contrôle républicain unifié de la présidence et des deux chambres, l'équilibre
  des pouvoirs glissant vers l'exécutif : en 2026, la Cour suprême a invalidé la
  protection légale contre la révocation sans motif des dirigeants d'agences
  indépendantes, ne laissant à la Réserve fédérale qu'une exception provisoire
  [trump-v-slaughter-2026][trump-v-cook-2026]. Le pays est en outre en guerre.
  Les frappes contre l'Iran ont repris après que le président a déclaré terminé,
  le 8 juillet 2026, le cessez-le-feu négocié par le Pakistan, et les forces
  américaines frappent des cibles iraniennes et appliquent un blocus naval,
  aucun cessez-le-feu n'étant en vigueur
  [cnbc-iran-ceasefire-over][cnn-iran-war-july18]; un raid mené sur Caracas en
  janvier 2026 a écarté le président vénézuélien en exercice, qui attend son
  procès à New York [maduro-capture-wardept][crs-maduro-capture]. Le
  fonctionnement ordinaire de l'État s'est enrayé à répétition autour de ces
  opérations : la plus longue paralysie complète du gouvernement jamais
  enregistrée a été suivie d'un blocage de 76 jours du financement de la
  Sécurité intérieure, dont les agences d'immigration et des frontières sont
  désormais financées par la réconciliation budgétaire plutôt que par les
  crédits annuels [crs-r48832-shutdowns][house-approps-dhs-76day], et le
  programme tarifaire phare a été annulé en février, son remplacement légal
  expirant de plein droit le 24 juillet 2026
  [scotus-learning-resources][crs-lsb11398-tariffs]. L'économie croît et ne
  connaît aucune contrainte de financement externe, en tant qu'émettrice de la
  principale monnaie de réserve, face à un déficit de 5,8 % du produit intérieur
  brut et à une dette publique de 101 %
  [cbo-budget-outlook-2026][treasury-tic-debt-holders]. La confiance envers le
  gouvernement fédéral s'établit à 17 %, près de son plus bas niveau en
  soixante-dix ans et clivée selon les lignes partisanes plutôt que partagée
  [pew-trust-in-government], et des évaluateurs indépendants ont rétrogradé le
  pays de démocratie libérale à démocratie électorale pour la première fois en
  plus de cinq décennies [vdem-democracy-report-2026].
territory_geography_en: >-
  The United States of America is a continental-scale country spanning the width
  of North America from the Atlantic to the Pacific, bordered by Canada to the
  north and Mexico to the south, with the non-contiguous state of Alaska in the
  continent's northwest and the Hawaiian archipelago in the central Pacific. The
  terrain is diversified: coastal plains to the east, interior lowlands, the
  Rocky Mountains and the western deserts. The periphery comprises five
  inhabited unincorporated territories — the Commonwealth of Puerto Rico, Guam,
  the United States Virgin Islands, the Commonwealth of the Northern Mariana
  Islands and American Samoa — plus uninhabited outlying possessions (Wake,
  Midway, Johnston, Palmyra, Howland, Baker, Jarvis, Navassa, Kingman Reef)
  [constitution-usa-1787][insular-cases-1901]. The physical arrangement is
  central to how the country functions as one country: large internal distances,
  densely settled coasts and a sparsely populated interior west.
territory_geography_fr: >-
  Les États-Unis d'Amérique sont un pays à l'échelle continentale s'étendant sur
  toute la largeur de l'Amérique du Nord, de l'Atlantique au Pacifique, bordés
  par le Canada au nord et le Mexique au sud, auxquels s'ajoutent l'État non
  contigu de l'Alaska au nord-ouest du continent et l'archipel hawaïen au centre
  du Pacifique. Le relief est diversifié : plaines côtières à l'est, basses
  terres intérieures, montagnes Rocheuses et déserts de l'Ouest. La périphérie
  comprend cinq territoires non incorporés habités (le Commonwealth de Porto
  Rico, Guam, les îles Vierges américaines, le Commonwealth des îles Mariannes
  du Nord et les Samoa américaines) ainsi que des possessions périphériques
  inhabitées (Wake, Midway, Johnston, Palmyra, Howland, Baker, Jarvis, Navassa,
  récif Kingman) [constitution-usa-1787][insular-cases-1901]. L'agencement
  physique est déterminant pour le fonctionnement du pays comme entité unique :
  distances internes considérables, côtes densément peuplées et intérieur
  occidental faiblement peuplé.
territory_biosphere_en: >-
  The renewable base is vast, and its condition diverges by resource: forest
  area and managed fish stocks broadly hold, while groundwater and cropland do
  not
  [fao-forest-water-usa][noaa-status-of-stocks][usgs-water-use-united-states][usda-ers-major-land-uses].


  Forests hold. Forest area stood at about 310 million hectares in 2020 —
  roughly 8% of the world total, placing the United States among the five
  countries that together hold more than half of all forest — and North American
  forest area was broadly stable between 1990 and 2015, gains in the United
  States offsetting losses in Canada and Mexico [fao-forest-water-usa].


  Fisheries hold, but the constraint is knowledge as much as harvest. Of the 506
  federally managed stocks in the 2023 report to Congress, 21 were subject to
  overfishing — an all-time low — and 47 were overfished; 50 stocks have been
  rebuilt since 2000 [noaa-status-of-stocks]. But only 364 of the 506 had a
  known overfishing status and only 263 a known overfished status: what is
  unmeasured is larger than what is depleted [noaa-status-of-stocks].


  Total water withdrawals are falling, but extraction is shifting from surface
  water, which refills each year, to groundwater, whose aquifers take decades to
  recharge. They reached 322 billion gallons per day in 2015 — 9% below 2010 and
  the lowest since before 1970 [usgs-water-use-united-states]. The aggregate
  decline masks a divergence within the resource: fresh surface-water
  withdrawals fell 14% to 198 billion gallons per day, while fresh groundwater
  withdrawals rose about 8% to 82.3 billion gallons per day
  [usgs-water-use-united-states]. Irrigation and thermoelectric power remained
  the two largest uses; crop irrigation alone withdrew an average of 105,497
  million gallons per day over 2010–2020, of which 75,698 million was consumed
  rather than returned [usgs-water-use-united-states].


  Cropland is contracting. Agricultural land totalled 1.19 billion acres in 2017
  — 52.5% of the land base, down from 59% in 1959 — with cropland down 15% and
  grazed forestland down 46% across that period [usda-ers-major-land-uses].
  Against a total 2.26 billion acres in 2017: grassland pasture and range 659
  million (29%), forest-use land 622 million (28%), cropland 390 million (17%),
  special uses such as parks and wildlife areas 318 million (14%), miscellaneous
  including wetlands and tundra 197 million (9%), and urban land 74 million (3%)
  [usda-ers-major-land-uses].
territory_biosphere_fr: >-
  La base renouvelable est vaste, et son état diverge selon la ressource : la
  superficie forestière et les stocks halieutiques gérés se maintiennent
  globalement; ce n'est pas le cas pour les eaux souterraines et les terres
  cultivées
  [fao-forest-water-usa][noaa-status-of-stocks][usgs-water-use-united-states][usda-ers-major-land-uses].


  Les forêts se maintiennent : la superficie forestière s'établissait à environ
  310 millions d'hectares en 2020 (soit près de 8 % du total mondial; ce qui
  place les États-Unis parmi les cinq pays qui détiennent ensemble plus de la
  moitié des forêts de la planète) et la superficie forestière nord-américaine
  est demeurée globalement stable entre 1990 et 2015; les gains états-uniens
  compensant les pertes du Canada et du Mexique [fao-forest-water-usa].


  Les pêcheries se maintiennent, mais la contrainte tient autant à la
  connaissance qu'à la capture. Le suivi fédéral distingue deux mesures : le
  rythme de prélèvement (y a-t-il surpêche en cours) et l'état de la population
  (le stock est-il déjà trop bas). Sur les 506 stocks du rapport de 2023 au
  Congrès, 21 seulement faisaient l'objet d'une surpêche active (un creux
  historique) et 47 étaient à un niveau trop bas, tandis que 50 stocks ont été
  reconstitués depuis 2000 [noaa-status-of-stocks]. Toutefois, l'état de la
  plupart des stocks reste inconnu : le rythme de prélèvement n'était établi que
  pour 364 des 506 stocks, et le niveau de population pour seulement 263.
  Autrement dit, ce qui n'est pas mesuré dépasse ce qui est épuisé
  [noaa-status-of-stocks].


  Les prélèvements d'eau totaux diminuent, mais l'extraction se reporte des eaux
  de surface, qui se rechargent chaque année, vers les eaux souterraines, dont
  les nappes se reconstituent sur des décennies. Ils atteignaient 322 milliards
  de gallons par jour en 2015; 9 % de moins qu'en 2010 et le niveau le plus bas
  depuis avant 1970 [usgs-water-use-united-states]. Ce recul agrégé masque une
  divergence interne : les prélèvements d'eau douce de surface ont chuté de 14 %
  pour s'établir à 198 milliards de gallons par jour, tandis que les
  prélèvements d'eau douce souterraine ont augmenté d'environ 8 % pour atteindre
  82,3 milliards (déplaçant l'extraction vers la ressource la moins
  renouvelable) [usgs-water-use-united-states]. L'irrigation et la production
  thermoélectrique sont demeurées les deux principaux usages; l'irrigation des
  cultures à elle seule a prélevé en moyenne 105 497 millions de gallons par
  jour sur la période 2010-2020, dont 75 698 millions ont été consommés plutôt
  que restitués au système [usgs-water-use-united-states].


  Les terres cultivées se contractent : les terres agricoles totalisaient 1,19
  milliard d'acres en 2017 (soit 52,5 % de la base foncière, contre 59 % en
  1959); les terres cultivées ayant reculé de 15 % et les terres forestières
  pâturées de 46 % sur cette période [usda-ers-major-land-uses]. Sur un total de
  2,26 milliards d'acres en 2017 : prairies de pâturage et pâturages naturels
  659 millions (29 %), terres à usage forestier 622 millions (28 %), terres
  cultivées 390 millions (17 %), usages spéciaux tels que parcs et aires de
  faune 318 millions (14 %), usages divers dont zones humides et toundra 197
  millions (9 %), et terres urbaines 74 millions (3 %)
  [usda-ers-major-land-uses].
territory_minerals_en: >-
  The United States holds a large mineral endowment but is heavily dependent on
  imports for the critical minerals that matter most, and that dependence
  deepened in 2025. The country was 100% net import-reliant on 16 nonfuel
  mineral commodities in 2025, up from 15 in 2024, and more than 50%
  import-reliant on 54 [usgs-mcs-2026]. The concentration is the vulnerability:
  China was the primary source for 14 of the most import-dependent critical
  minerals, supplying roughly 70% of rare earths and 55% of antimony
  [usgs-mcs-2026]. Total nonfuel mineral production was valued at $112 billion
  in 2025 — crushed stone the largest single commodity at $26.8 billion — a
  figure weighted toward construction aggregates rather than the
  battery-and-defence minerals driving the import reliance [usgs-mcs-2026]. The
  scope of concern is widening: the Geological Survey expanded its
  critical-minerals list from 50 commodities in 2022 to 60 in 2025, adding
  copper and silver for the first time [usgs-mcs-2026]. Reserve figures
  throughout are compiled by the Geological Survey as the estimating body
  [usgs-mcs-2026].
territory_minerals_fr: >-
  Les États-Unis disposent d'un vaste patrimoine minier, mais dépendent
  lourdement des importations pour les minéraux critiques les plus importants;
  cette dépendance s'est accentuée en 2025. Le pays était tributaire des
  importations à 100 % net pour 16 produits minéraux non énergétiques en 2025,
  contre 15 en 2024, et à plus de 50 % pour 54 d'entre eux [usgs-mcs-2026]. La
  concentration est la vulnérabilité : la Chine était la principale source de 14
  des minéraux critiques les plus dépendants des importations, fournissant
  environ 70 % des terres rares et 55 % de l'antimoine [usgs-mcs-2026]. La
  production minérale non énergétique totale était évaluée à 112 milliards de
  dollars en 2025 (la pierre concassée constituant le principal produit à elle
  seule, à 26,8 milliards); chiffre qui penche vers les granulats de
  construction plutôt que vers les minéraux pour les batteries et la défense qui
  sont à l'origine de la dépendance aux importations [usgs-mcs-2026]. Le champ
  de préoccupation s'élargit : le United States Geological Survey a étendu sa
  liste de minéraux critiques de 50 produits en 2022 à 60 en 2025, y ajoutant le
  cuivre et l'argent pour la première fois [usgs-mcs-2026]. Les chiffres des
  réserves sont partout compilés par le Geological Survey, qui en est
  l'organisme estimateur [usgs-mcs-2026].
territory_climate_en: >-
  The climate of the United States is dramatically regional — from Arctic and
  subarctic Alaska through the temperate continental interior and humid east to
  the arid Southwest and tropical Hawaii and territories — so any warming signal
  sits atop a highly varied baseline. 


  Observed warming is faster than the global mean: temperatures in the
  contiguous United States have risen 2.5°F and in Alaska 4.2°F since 1970,
  against roughly 1.7°F globally over the same period, with the continental
  United States including Alaska warming about 60% faster than the planet as a
  whole [nca5-fifth-national-climate-assessment]. Precipitation has diverged
  regionally: annual precipitation over 2002–2021 was 5%–15% above the 1901–1960
  average across the central and eastern United States, while Hawaii and parts
  of the Southwest recorded decreases of 10%–15% over the same period
  [nca5-fifth-national-climate-assessment]. Sea level along the continental
  coastline has risen about 11 inches over the past century against 7 inches
  globally, and rose at 1.8 inches per decade over 1993–2020 against 1.3 inches
  globally, with the highest rates on the Gulf and Mid-Atlantic coasts (above
  2.4 inches per decade), the lowest in the Pacific Northwest (0–1 inch per
  decade), and relative sea level fall in Southeast Alaska
  [nca5-fifth-national-climate-assessment]. The Southwest experienced the driest
  soil moisture of any equivalent period in at least 1,200 years over 2000–2021,
  and is the only region where the total area of unusually dry soil moisture is
  increasing [nca5-fifth-national-climate-assessment]. Extreme heat is
  concentrated in the West, which has seen the largest increase in days above
  95°F since the 1980s, while across 50 large cities the average number of
  heatwaves has doubled since the 1980s and the heatwave season has lengthened
  from about 40 to about 70 days [nca5-fifth-national-climate-assessment]. Heavy
  precipitation has increased most in the Northeast (around 60% more extreme
  precipitation days) and Midwest (around 45%)
  [nca5-fifth-national-climate-assessment]. Billion-dollar weather and climate
  disasters arrived roughly every four months in the 1980s and now arrive
  roughly every three weeks, with 18 such events in 2022
  [nca5-fifth-national-climate-assessment].


  Projections, each bound to its scenario and horizon: at a global warming level
  of 2°C relative to 1851–1900, average United States temperature is very likely
  to rise 4.4°F–5.6°F, with each further 1°C of global warming adding about
  2.5°F and the largest increases in the north and west
  [nca5-fifth-national-climate-assessment]. Average sea level along United
  States coastlines is likely to stand 12–20 inches above 2000 levels by 2050
  across the range of global warming levels, 4–12 inches in the Pacific
  Northwest but 20–27 inches in the western Gulf of Mexico, and at a 2°C global
  warming level 2–3 feet by 2100 and 2.5–5 feet by 2150; rises of 3–6 feet by
  2100 and 5–12 feet by 2150 cannot be ruled out
  [nca5-fifth-national-climate-assessment]. Coastal flooding events that are
  currently damaging are projected to become more than ten times more frequent
  over the next 30 years [nca5-fifth-national-climate-assessment]. In the
  Southwest, the risk of a single dry year as severe as 2002 rises 8% at a 2°C
  warming level and 24% at 4°C; but the decades-long megadroughts, in which the
  soil stays dry year after year, are projected to worsen regardless of how far
  warming is limited [nca5-fifth-national-climate-assessment]. Under a very high
  emissions scenario (Shared Socioeconomic Pathway 5-8.5) the world is very
  likely to pass 2°C between 2033 and 2054; under a low scenario (Shared
  Socioeconomic Pathway 1-2.6) it is very likely not to cross that threshold at
  all [nca5-fifth-national-climate-assessment].


  Exposure and the capacity to meet it are unevenly distributed within the
  country, and the gap is measurable: low-income neighbourhoods, including those
  historically affected by redlining, can be as much as 12°F hotter during
  heatwaves than wealthier neighbourhoods in the same city and face
  substantially higher flood risk [nca5-fifth-national-climate-assessment];
  Americans over 65 are several times more likely than younger people to die of
  heat-related cardiovascular disease [nca5-fifth-national-climate-assessment].
  The country ranks among the high-readiness economies on adaptive capacity at
  national scale [ndgain-country-index] — which is precisely what conceals the
  problem: the binding constraint is not aggregate national capacity but its
  distribution across the exposed populations named above
  [nca5-fifth-national-climate-assessment].
territory_climate_fr: >-
  Le climat des États-Unis est fortement régionalisé : de l'Alaska arctique et
  subarctique à l'intérieur continental tempéré et à l'est humide, jusqu'au
  Sud-Ouest aride et aux tropiques d'Hawaï et des territoires; de sorte que tout
  signal de réchauffement s'inscrit sur une base de référence très variée. 


  Le réchauffement observé est plus rapide que la moyenne mondiale : les
  températures ont augmenté de 1.4 °C dans les États-Unis contigus et de 2.3 °C
  en Alaska depuis 1970, contre environ 0.9 °C à l'échelle mondiale sur la même
  période; les États-Unis continentaux, Alaska compris, se réchauffant environ
  60 % plus vite que la planète dans son ensemble
  [nca5-fifth-national-climate-assessment]. Les précipitations ont divergé selon
  les régions : les précipitations annuelles sur 2002-2021 dépassaient de 5 à 15
  % la moyenne de 1901-1960 dans le centre et l'est du pays, tandis qu'Hawaï et
  certaines parties du Sud-Ouest enregistraient des baisses de 10 à 15 % sur la
  même période [nca5-fifth-national-climate-assessment]. Le niveau de la mer le
  long du littoral continental s'est élevé d'environ 28 cm (11 pouces) au cours
  du dernier siècle, contre 18 cm (7 po) à l'échelle mondiale, et progressait de
  4.6 cm (1,8 po) par décennie entre 1993 et 2020 contre 3.3 cm (1,3 po) à
  l'échelle mondiale; les taux les plus élevés se situant sur les côtes du Golfe
  et de l'Atlantique central (plus de 6 cm [2,4 po] par décennie), les plus
  faibles dans le Nord-Ouest pacifique (0 à 2.5 cm [1 po] par décennie), avec
  une baisse relative du niveau de la mer dans le sud-est de l'Alaska
  [nca5-fifth-national-climate-assessment]. Le Sud-Ouest a connu l'humidité des
  sols la plus faible de toute période équivalente depuis au moins 1 200 ans sur
  2000-2021; c'est la seule région où la superficie totale de sols anormalement
  secs augmente [nca5-fifth-national-climate-assessment]. La chaleur extrême se
  concentre dans l'Ouest, qui a connu la plus forte hausse du nombre de jours
  au-dessus de 35 °C depuis les années 1980, tandis que, dans 50 grandes villes,
  le nombre moyen de vagues de chaleur a doublé depuis les années 1980 et que la
  saison des vagues de chaleur s'est allongée d'environ 40 à environ 70 jours
  [nca5-fifth-national-climate-assessment]. Les précipitations intenses ont le
  plus augmenté dans le Nord-Est (environ 60 % de jours de précipitations
  extrêmes en plus) et le Midwest (environ 45 %)
  [nca5-fifth-national-climate-assessment]. Les catastrophes météorologiques et
  climatiques à plus d'un milliard de dollars survenaient environ tous les
  quatre mois dans les années 1980 et surviennent désormais environ toutes les
  trois semaines, avec 18 événements de ce type en 2022
  [nca5-fifth-national-climate-assessment].


  Projections, chacune liée à son scénario et à son horizon : à un niveau de
  réchauffement mondial de 2 °C par rapport à 1851-1900, la température moyenne
  des États-Unis augmentera très probablement de 2,4 à 3,1 °C, chaque degré
  Celsius supplémentaire de réchauffement mondial ajoutant environ 1,4 °C; les
  hausses les plus fortes touchant le nord et l'ouest
  [nca5-fifth-national-climate-assessment]. Le niveau moyen de la mer le long
  des côtes des États-Unis se situera probablement de 30 à 50 cm (12 à 20 p)
  au-dessus des niveaux de 2000 d'ici 2050, sur l'ensemble des niveaux de
  réchauffement (de 10 à 30 cm [4 à 12 po] dans le Nord-Ouest pacifique, mais de
  50 à 70 cm [20 à 27 po] dans l'ouest du golfe du Mexique; à un niveau de
  réchauffement de 2 °C, de 0,6 à 0,9 m [2 à 3 pieds] d'ici 2100 et de 0,8 à 1,5
  m [2,5 à 5 pi] d'ici 2150; des hausses de 0,9 à 1,8 m [3 à 6 pi] d'ici 2100 et
  de 1,5 à 3,7 [5 à 12 pi] d'ici 2150 ne peuvent être exclues
  [nca5-fifth-national-climate-assessment]. Les inondations côtières aujourd'hui
  dommageables deviendront, selon les projections, plus de dix fois plus
  fréquentes au cours des 30 prochaines années
  [nca5-fifth-national-climate-assessment]. Dans le Sud-Ouest, le risque d'une
  seule année aussi sèche que 2002 augmente de 8 % à un niveau de réchauffement
  de 2 °C et de 24 % à 4 °C; mais les mégasécheresses pluridécennales, lorsque
  le sol demeure sec année après année, devraient s'aggraver quel que soit le
  degré de limitation du réchauffement [nca5-fifth-national-climate-assessment].
  Selon un scénario d'émissions très élevées (Shared Socioeconomic Pathway
  5-8.5), le monde franchira très probablement les 2 °C entre 2033 et 2054;
  selon un scénario d'émissions faibles (Shared Socioeconomic Pathway 1-2.6), il
  ne franchira très probablement pas du tout ce seuil
  [nca5-fifth-national-climate-assessment].


  L'exposition et la capacité d'y faire face sont inégalement réparties à
  l'intérieur du pays, et l'écart est mesurable : les quartiers à faible revenu,
  y compris ceux historiquement touchés par le « redlining » (discrimination
  hypothécaire par quartier), peuvent être jusqu'à 6,5 °C plus chauds pendant
  les vagues de chaleur que les quartiers plus aisés de la même ville et sont
  exposés à un risque d'inondation nettement plus élevé
  [nca5-fifth-national-climate-assessment]; les personnes de plus de 65 ans sont
  plusieurs fois plus susceptibles que les plus jeunes de mourir d'une maladie
  cardiovasculaire liée à la chaleur [nca5-fifth-national-climate-assessment].
  Le pays se classe parmi les économies à forte capacité d'adaptation à
  l'échelle nationale [ndgain-country-index]; ce qui masque précisément le
  problème : la contrainte déterminante n'est pas la capacité nationale globale,
  mais sa répartition entre les populations exposées nommées ci-dessus
  [nca5-fifth-national-climate-assessment].
territory_metabolism_en: >-
  The United States runs on high and rising energy throughput, a dense
  continental freight system, and physical distribution networks (water,
  broadband) that are extensive but ageing, and its self-sufficiency varies
  sharply by system. 


  Energy is abundant and domestically produced: after fifteen years of near-flat
  demand, electricity consumption has risen 2.1% annually over the past five
  years, driven by data centres and artificial intelligence, and is projected to
  keep growing 0.9%–1.6% per year through 2050
  [eia-aeo-2026][eia-power-outlook-2026]. 


  Production is at record levels — natural gas reached 107 billion cubic feet
  per day and crude oil 13.6 million barrels per day in 2025 — with natural gas
  supplying about 40% of electricity generation, coal about 16%, and natural
  gas, solar and wind together roughly 60%
  [eia-aeo-2026][eia-power-outlook-2026]. Goods move at continental scale: the
  freight system carried about 20.2 billion tons in 2023, a daily average of
  55.5 million tons, projected to grow about 1.2% per year through 2050, with
  trucks in the supply chain of all ten leading commodities
  [bts-freight-analysis-framework]. 


  Food self-sufficiency has quietly reversed: the country ran an agricultural
  trade surplus for nearly sixty years until 2019, but by 2025 imports exceeded
  exports by about $41 billion (a record deficit driven by high-value consumer
  imports) even as it remains the world's largest exporter of bulk grains and
  oilseeds [usda-ers-ag-trade-2026]. 


  The physical distribution networks are extensive but under strain: about 95%
  of homes and small businesses had access to fixed 100/20 megabit-per-second
  broadband by December 2024, but rural access lagged at 72% and more than 23%
  of people on Tribal lands lacked it [fcc-broadband-map-2024]; and the
  drinking-water system faces a $625 billion twenty-year investment need,
  two-thirds of it for ageing transmission and distribution pipes, with 9.2
  million lead service lines still to replace [epa-dwinsa-2023].
territory_metabolism_fr: >-
  Les États-Unis fonctionnent sur un débit énergétique élevé et croissant, un
  système de fret continental dense et des réseaux de distribution physique
  (eau, télécommunications) vastes mais vieillissants; leur autosuffisance
  variant fortement d'un système à l'autre. L'énergie est abondante et produite
  sur le territoire : après quinze ans de demande quasi stable, la consommation
  d'électricité a augmenté de 2,1 % par an au cours des cinq dernières années,
  sous l'effet des centres de données et de l'intelligence artificielle, et
  devrait continuer de croître de 0,9 à 1,6 % par an jusqu'en 2050
  [eia-aeo-2026][eia-power-outlook-2026]. 


  La production atteint des niveaux record (le gaz naturel a atteint 107
  milliards de pieds cubes par jour et le pétrole brut 13,6 millions de barils
  par jour en 2025); le gaz naturel fournissant environ 40 % de la production
  d'électricité, le charbon environ 16 %, et le gaz naturel, le solaire et
  l'éolien ensemble environ 60 % [eia-aeo-2026][eia-power-outlook-2026]. 


  Les marchandises circulent à l'échelle continentale : le système de fret a
  transporté environ 20,2 milliards de tonnes en 2023, soit une moyenne
  quotidienne de 55,5 millions de tonnes, avec une croissance prévue d'environ
  1,2 % par an jusqu'en 2050; les camions intervenant dans la chaîne
  d'approvisionnement des dix principales marchandises
  [bts-freight-analysis-framework]. 


  L'autosuffisance alimentaire s'est discrètement inversée : le pays a
  enregistré un excédent commercial agricole pendant près de soixante ans
  jusqu'en 2019; toutefois, en 2025 les importations dépassaient les
  exportations d'environ 41 milliards de dollars (déficit record tiré par des
  importations de produits de consommation à forte valeur) tout en demeurant le
  premier exportateur mondial de céréales et d'oléagineux en vrac
  [usda-ers-ag-trade-2026]. 


  Les réseaux de distribution physique sont vastes mais sous tension : environ
  95 % des ménages et petites entreprises avaient accès à un service fixe à
  large bande de 100/20 mégabits par seconde à la fin de 2024, mais l'accès
  rural n'atteignait que 72 % et plus de 23 % des personnes vivant sur des
  terres autochtones en étaient privées [fcc-broadband-map-2024]; le système
  d'eau potable fait face à un besoin d'investissement de 625 milliards de
  dollars sur vingt ans, dont les deux tiers pour des conduites de transport et
  de distribution vieillissantes, avec 9,2 millions de branchements en plomb
  encore à remplacer [epa-dwinsa-2023].
territory_transition_en: >-
  The United States has a widening gap between what it has pledged on climate
  and what its policies will deliver, and its emissions have begun to rise
  again. The Climate Action Tracker rates United States climate targets, action
  and finance as "Critically Insufficient" overall, with policies and action
  "Highly Insufficient" [climateactiontracker-usa]. The current administration
  voided the 2030 and 2035 Nationally Determined Contribution (NDC) targets set
  under the prior administration, and the Climate Action Tracker considers the
  United States to no longer hold a net-zero target [climateactiontracker-usa].
  Under current policy, United States emissions are projected to fall 19%–30%
  below 2005 levels by 2030, excluding land use, land-use change and forestry
  (LULUCF), against the 29%–39% the prior administration was on track to deliver
  — roughly 600–800 million tonnes of carbon dioxide equivalent higher in 2030
  [climateactiontracker-usa]. The delivered path is already turning the wrong
  way: after two decades of decline that left emissions about 20% below 2005
  levels, energy-related carbon dioxide emissions rose 2% in 2025 (about 115
  million tonnes) increasing across every sector, driven largely by a 13% rise
  in coal-fired electricity generation [eia-co2-emissions-2025].
territory_transition_fr: >-
  Les États-Unis présentent un écart croissant entre leurs engagements
  climatiques et ce que leurs politiques permettront de réaliser, et leurs
  émissions ont recommencé à augmenter. Le Climate Action Tracker juge les
  cibles, l'action et le financement climatiques des États-Unis « gravement
  insuffisants » dans l'ensemble; les politiques et l'action étant « très
  insuffisantes » [climateactiontracker-usa]. L'administration actuelle a annulé
  les cibles de contribution déterminée au niveau national (CDN) pour 2030 et
  2035 fixées sous l'administration précédente, et le Climate Action Tracker
  considère que les États-Unis n'ont plus de cible de carboneutralité
  [climateactiontracker-usa]. Selon les politiques actuelles, les émissions des
  États-Unis devraient diminuer de 19 à 30 % sous les niveaux de 2005 d'ici
  2030, hors utilisation des terres, changement d'affectation des terres et
  foresterie (UTCATF), contre les 29 à 39 % que l'administration précédente
  était en voie de réaliser; soit environ 600 à 800 millions de tonnes
  d'équivalent dioxyde de carbone de plus en 2030 [climateactiontracker-usa]. La
  trajectoire réelle s'inverse déjà : après deux décennies de baisse qui avaient
  ramené les émissions à environ 20 % sous les niveaux de 2005, les émissions de
  dioxyde de carbone liées à l'énergie ont augmenté de 2 % en 2025 (environ 115
  millions de tonnes), en hausse dans tous les secteurs, sous l'effet surtout
  d'une progression de 13 % de la production d'électricité au charbon
  [eia-co2-emissions-2025].
society_demographics_en: >-
  The United States is a settler-and-immigrant society whose population growth
  has always depended on migration; and that growth has just slowed sharply. The
  population reached 341.8 million as of 1 July 2025, growing only 0.5% (about
  1.8 million) over the year, the slowest pace since 2021
  [census-poprelease-2026]. The slowdown was driven by a historic fall in net
  international migration, from 2.7 million the prior year to 1.3 million in
  July 2024–June 2025, projected to fall further to about 321,000 by July 2026
  [census-poprelease-2026]. Natural change (births minus deaths) was about
  519,000, roughly flat year-on-year but far below prior-decade levels
  [census-poprelease-2026]. The country is ageing: median age reached a record
  39.1 in 2024, the population aged 65 and over rose to 61.2 million (18.0%, up
  from 12.4% in 2004) while children fell to 21.5%, and by 2024 nearly 45% of
  counties held more older adults than children [census-median-age-2025]. The
  growth that remains has shifted decisively south and west: the South grew 6.0%
  between 2020 and 2025 against 3.1% nationally, while the Northeast and Midwest
  lost population — and within the growing regions, gains concentrated not in
  the city cores, which grew sluggishly or declined, but in the exurban outlying
  counties on the fringes of metros such as Dallas, Atlanta, Charlotte and
  Nashville [census-poprelease-2026].
society_demographics_fr: >-
  Les États-Unis sont une société de colons et d'immigrants dont la croissance
  démographique a toujours reposé sur la migration; cette croissance vient de
  ralentir fortement. La population a atteint 341,8 millions au 1er juillet
  2025, ne croissant que de 0,5 % (environ 1,8 million) sur l'année; le rythme
  le plus lent depuis 2021 [census-poprelease-2026]. Ce ralentissement découle
  d'une baisse historique de la migration internationale nette, passée de 2,7
  millions l'année précédente à 1,3 million de juillet 2024 à juin 2025, et qui
  devrait encore diminuer jusqu'à environ 321 000 d'ici juillet 2026
  [census-poprelease-2026]. L'accroissement naturel (naissances moins décès)
  s'est établi à environ 519 000, à peu près stable d'une année à l'autre, mais
  bien en deçà des niveaux de la décennie précédente [census-poprelease-2026].
  Le pays vieillit : l'âge médian a atteint un record de 39,1 ans en 2024; la
  population de 65 ans et plus a atteint 61,2 millions (18,0 %, contre 12,4 % en
  2004) tandis que la part des enfants tombait à 21,5 %, et en 2024 près de 45 %
  des comtés comptaient plus d'aînés que d'enfants [census-median-age-2025]. La
  croissance qui subsiste s'est déplacée nettement vers le sud et l'ouest : le
  Sud a crû de 6,0 % entre 2020 et 2025 contre 3,1 % à l'échelle nationale,
  tandis que le Nord-Est et le Midwest perdaient de la population; à l'intérieur
  des régions en croissance, les gains se sont concentrés non pas dans les cœurs
  urbains, en croissance faible ou en déclin, mais dans les comtés exurbains
  périphériques des agglomérations comme Dallas, Atlanta, Charlotte et Nashville
  [census-poprelease-2026].
society_composition_en: >-
  The United States population was about 340 million in 2024, of whom, counting
  those who reported a single race, roughly 56% were non-Hispanic White, 12%
  Black or African American, 6% Asian, and 1% American Indian or Alaska Native,
  alongside 20% Hispanic or Latino of any race [census-acs-dp05]. The Hispanic
  or Latino category is an ethnicity recorded independently of race, so its
  members are distributed across every racial category rather than forming a
  separate one [census-acs-dp05]. Cleavage geometry (Interpretation): across
  ethnicity, language and religion the fault lines are largely cross-cutting;
  the ethnicity category cuts across the racial categories by construction
  [census-acs-dp05], home language does not partition access to the national
  lingua franca [census-acs-language], and religious observance is not
  coextensive with either [pewresearch-religious-landscape]. The reinforcing
  line is partisan rather than ethnic: institutional trust splits sharply by
  party — 26% of Republicans versus 9% of Democrats expressed trust in the
  federal government in 2025, and responses track which party holds power rather
  than a stable underlying level [pew-trust-in-government] — and religious
  observance is increasingly aligned with partisan identity
  [pewresearch-religious-landscape]. The principal fault line therefore runs
  along partisan identity, which absorbs and organises the demographic
  differences rather than being produced by them.
society_composition_fr: >-
  La population des États-Unis s'élevait à environ 340 millions en 2024, dont,
  parmi les personnes ayant déclaré une seule race, environ 56 % de Blancs non
  hispaniques, 12 % de Noirs ou Afro-Américains, 6 % d'Asiatiques et 1 %
  d'Amérindiens ou d'Autochtones de l'Alaska, auxquels s'ajoutent 20 %
  d'Hispaniques ou de Latino-Américains de toute race [census-acs-dp05]. La
  catégorie hispanique ou latino-américaine est une appartenance ethnique
  consignée indépendamment de la race; ses membres se répartissent donc dans
  toutes les catégories raciales plutôt que d'en former une distincte
  [census-acs-dp05]. Géométrie des clivages (interprétation) : entre
  l'ethnicité, la langue et la religion, les lignes de fracture sont largement
  transversales; la catégorie ethnique recoupe les catégories raciales par
  construction [census-acs-dp05], la langue parlée à la maison ne conditionne
  pas l'accès à la langue véhiculaire nationale [census-acs-language], et la
  pratique religieuse ne coïncide avec ni l'une ni l'autre
  [pewresearch-religious-landscape]. La ligne qui se renforce est partisane
  plutôt qu'ethnique : la confiance envers les institutions se divise fortement
  selon le parti : 26 % des Républicains contre 9 % des Démocrates déclaraient
  faire confiance au gouvernement fédéral en 2025, et les réponses suivent le
  parti au pouvoir plutôt qu'un niveau de fond stable [pew-trust-in-government];
  et la pratique religieuse s'aligne de plus en plus sur l'identité partisane
  [pewresearch-religious-landscape]. La principale ligne de fracture court donc
  le long de l'identité partisane, qui absorbe et organise les différences
  démographiques au lieu d'en être le produit.
society_language_en: >-
  English is the universal lingua franca and language of instruction, and
  language does not partition the country the way it does in many plural
  societies. About 78% of the population aged five and over speaks only English
  at home; roughly 22% speaks another language, overwhelmingly Spanish, which
  accounts for around 61% of non-English home languages and about 14% of the
  total population, followed at a distance by Chinese and Tagalog
  [census-acs-language]. The lived pattern is convergence, not division: among
  Spanish-speaking children aged five to seventeen, about 80% also speak English
  "very well," so minority home languages rarely survive as barriers past the
  second generation [census-acs-language]. Language became politically salient
  in 2025: Executive Order 14224 (1 March 2025) designated English the official
  language of the United States for the first time in the country's history,
  revoking a 2000 mandate that had required federal agencies to provide
  assistance to people with limited English proficiency [eo-14224-english-2025].
  The order is largely declaratory — it creates no enforceable right and
  requires no agency to change services — but it reframes a de facto lingua
  franca as a matter of official national identity, consistent with the
  administration's broader immigration posture [eo-14224-english-2025].
society_language_fr: >-
  L'anglais est la langue véhiculaire universelle et la langue d'enseignement;
  la langue ne divise pas le pays comme elle le fait dans bien des sociétés
  plurielles. Environ 78 % de la population de cinq ans et plus ne parle que
  l'anglais à la maison; à peu près 22 % parle une autre langue, très
  majoritairement l'espagnol, qui représente environ 61 % des langues parlées à
  la maison autres que l'anglais et à peu près 14 % de la population totale,
  suivi de loin par le chinois et le tagalog [census-acs-language]. La tendance
  vécue est la convergence, non la division : chez les enfants hispanophones de
  cinq à dix-sept ans, environ 80 % parlent aussi l'anglais « très bien », de
  sorte que les langues d'origine survivent rarement comme obstacles au-delà de
  la deuxième génération [census-acs-language]. La langue est devenue un enjeu
  politique en 2025 : le décret 14224 (1er mars 2025) a désigné l'anglais comme
  langue officielle des États-Unis pour la première fois de l'histoire du pays,
  révoquant un mandat de 2000 qui obligeait les organismes fédéraux à offrir de
  l'aide aux personnes ayant une maîtrise limitée de l'anglais
  [eo-14224-english-2025]. Le décret est largement déclaratoire (il ne crée
  aucun droit exécutoire et n'oblige aucun organisme à modifier ses services),
  mais il fait d'une langue véhiculaire de fait une question d'identité
  nationale officielle, en cohérence avec la posture migratoire plus large de
  l'administration [eo-14224-english-2025].
society_religion_en: >-
  The United States is a predominantly Christian country with a large and
  no-longer-growing religiously unaffiliated share. In the Pew Research Center's
  2023–24 Religious Landscape Study, 62% of adults identify as Christian — 40%
  Protestant, 19% Catholic, 3% other Christian — 29% are religiously
  unaffiliated (5% atheist, 6% agnostic, 19% "nothing in particular"), and 7%
  belong to non-Christian religions, the largest being Judaism (2%), Islam,
  Buddhism and Hinduism (about 1% each) [pewresearch-religious-landscape]. The
  long trend is decline levelling off: the Christian share fell from 78% in 2007
  to 62%, but has held between 62% and 64% since 2019, and the unaffiliated
  share has plateaued after decades of rapid growth
  [pewresearch-religious-landscape]. These are self-reported figures from a
  survey subject to social-desirability and sampling bias; the United States
  conducts no official religious census, so all national religion data comes
  from private surveys [pewresearch-religious-landscape]. The salient fault line
  is not between faiths but between the observant and the secular — and it is
  increasingly partisan: Pew finds the decline of Christian identity far more
  pronounced among political liberals than conservatives, so religious
  observance now tracks partisan alignment more closely than it tracks ethnicity
  or region [pewresearch-religious-landscape].
society_religion_fr: >-
  Les États-Unis sont un pays majoritairement chrétien où la part des personnes
  sans affiliation religieuse est importante et a cessé de croître. Dans l'étude
  Religious Landscape 2023-2024 du Pew Research Center, 62 % des adultes se
  déclarent chrétiens (40 % protestants, 19 % catholiques, 3 % autres
  chrétiens), 29 % sont sans affiliation religieuse (5 % athées, 6 %
  agnostiques, 19 % « rien en particulier ») et 7 % appartiennent à des
  religions non chrétiennes; les plus importantes étant étant le judaïsme (2 %),
  l'islam, le bouddhisme et l'hindouisme (environ 1 % chacun)
  [pewresearch-religious-landscape]. La tendance de fond est un déclin qui se
  stabilise : la part chrétienne est passée de 78 % en 2007 à 62 %, mais se
  maintient entre 62 et 64 % depuis 2019, et la part des personnes sans
  affiliation plafonne après des décennies de croissance rapide
  [pewresearch-religious-landscape]. Ces chiffres sont autodéclarés et
  proviennent d'une enquête sujette au biais de désirabilité sociale et
  d'échantillonnage; les États-Unis ne mènent aucun recensement religieux
  officiel, de sorte que toutes les données nationales sur la religion
  proviennent d'enquêtes privées [pewresearch-religious-landscape]. La ligne de
  fracture marquante n'oppose pas les confessions entre elles, mais les
  pratiquants aux laïques, et elle est de plus en plus partisane : le Pew
  constate que le déclin de l'identité chrétienne est bien plus prononcé chez
  les libéraux que chez les conservateurs, de sorte que la pratique religieuse
  suit désormais l'appartenance partisane de plus près que l'ethnicité ou la
  région [pewresearch-religious-landscape].
society_wellbeing_en: >-
  The defining feature of United States health outcomes is that they are poor
  for the country's wealth. Life expectancy at birth reached a record 79.0 years
  in 2024 — up 0.6 year from 2023, 81.4 for females and 76.5 for males — yet
  remained 3.7 years below the comparable-country average of 82.7, even as the
  United States spent an estimated $14,775 per person on health care in 2024,
  more than any peer nation [nchs-mortality-2024][kff-life-expectancy-peers].
  The gap has widened over decades: American life expectancy matched wealthy
  peers in 1980, then plateaued as theirs kept rising
  [kff-life-expectancy-peers]. Mortality is nonetheless improving at the margin:
  the age-adjusted death rate fell 3.8% to 722.1 per 100,000 in 2024, with 3.07
  million registered deaths; heart disease (157.6 per 100,000), cancer (139.4)
  and unintentional injuries (53.3) led, while COVID-19 fell out of the top ten
  and suicide entered it at tenth [nchs-mortality-2024]. Infant mortality was
  5.5 per 1,000 live births in 2024, statistically unchanged from 2023
  [nchs-mortality-2024]. The mortality gradient by race is steep and understated
  in raw data: among males in 2024, age-adjusted death rates corrected for
  death-certificate misclassification ran from 1,213.0 per 100,000 for American
  Indian and Alaska Native men and 1,094.9 for Black men down to 454.2 for Asian
  men; and uncorrected series understate American Indian and Alaska Native
  deaths by 34%, systematically flattering the gradient [nchs-mortality-2024].


  Educational attainment is high and rising, and the racial gaps are narrow at
  high-school level but widen sharply at each degree above it. Among
  25-to-29-year-olds in 2022, 95% had completed at least high school (up from
  89% in 2010), 40% held a bachelor's degree or higher (up from 32%), and 10% a
  master's or higher [nces-condition-of-education]. The gaps widen at every
  level up: the bachelor's-or-higher rate ran 72% for Asian, 45% for White, 28%
  for Black and 25% for Hispanic 25-to-29-year-olds, while the
  associate's-or-higher rate ranged from 78% for Asian down to 19% for American
  Indian and Alaska Native [nces-condition-of-education]. The gradients are
  moving in opposite directions at different levels: the White–Hispanic
  high-school-completion gap narrowed from 25 to 9 points between 2010 and 2022,
  while the Asian–White gap at bachelor's level widened by 9 points
  [nces-condition-of-education]. Attainment is higher for females at every
  level, an 11-point sex gap among White 25-to-29-year-olds at bachelor's or
  higher [nces-condition-of-education].
society_wellbeing_fr: >-
  Le trait déterminant des résultats de santé aux États-Unis est qu'ils sont
  médiocres au regard de la richesse du pays. L'espérance de vie à la naissance
  a atteint un record de 79,0 ans en 2024 (en hausse de 0,6 an par rapport à
  2023, soit 81,4 ans pour les femmes et 76,5 pour les hommes), mais demeurait
  inférieure de 3,7 ans à la moyenne des pays comparables (82,7 ans), alors même
  que les États-Unis dépensaient environ 14 775 $ par personne en soins de santé
  en 2024, plus que tout autre pays pair
  [nchs-mortality-2024][kff-life-expectancy-peers]. L'écart s'est creusé au fil
  des décennies : l'espérance de vie aux États-Unis égalait celle des pays
  riches comparables en 1980, puis a plafonné tandis qu'elle continuait de
  croître dans ces autres pays [kff-life-expectancy-peers]. La mortalité
  s'améliore néanmoins à la marge : le taux de mortalité normalisé selon l'âge a
  reculé de 3,8 % pour s'établir à 722,1 pour 100 000 en 2024, avec 3,07
  millions de décès enregistrés; les cardiopathies (157,6 pour 100 000), le
  cancer (139,4) et les blessures non intentionnelles (53,3) venaient en tête,
  tandis que l'épidémie de COVID-19 sortait du top dix et que le suicide y
  entrait au dixième rang [nchs-mortality-2024]. La mortalité infantile
  s'établissait à 5,5 pour 1 000 naissances vivantes en 2024, statistiquement
  inchangée par rapport à 2023 [nchs-mortality-2024]. Le gradient de mortalité
  selon l'origine ethnique est marqué et sous-estimé dans les données brutes :
  chez les hommes en 2024, les taux de mortalité normalisés selon l'âge et
  corrigés pour tenir compte des erreurs de classification sur les certificats
  de décès allaient de 1 213,0 pour 100 000 chez les Amérindiens et Autochtones
  de l'Alaska et 1 094,9 chez les Noirs jusqu'à 454,2 chez les Asiatiques. Les
  séries non corrigées sous-estiment de 34 % les décès chez les Amérindiens et
  Autochtones de l'Alaska; ce qui atténue artificiellement le gradient
  [nchs-mortality-2024].


  Le niveau de scolarité est élevé et en hausse, et les écarts raciaux, étroits
  au secondaire, se creusent nettement à chaque diplôme supérieur. Chez les 25 à
  29 ans en 2022, 95 % avaient terminé au moins le secondaire (contre 89 % en
  2010), 40 % détenaient un diplôme universitaire de premier cycle ou plus
  (contre 32 %) et 10 % une maîtrise ou plus [nces-condition-of-education]. Ces
  écarts se creusent à chaque palier : le taux de baccalauréat ou plus
  atteignait 72 % chez les Asiatiques, 45 % chez les Blancs, 28 % chez les Noirs
  et 25 % chez les Hispaniques de 25 à 29 ans, tandis que le taux de diplôme
  d'associé ou plus allait de 78 % chez les Asiatiques à 19 % chez les
  Amérindiens et Autochtones de l'Alaska [nces-condition-of-education]. Les
  gradients évoluent en sens contraire selon le palier : l'écart
  Blancs–Hispaniques pour l'achèvement du secondaire s'est resserré de 25 à 9
  points entre 2010 et 2022, tandis que l'écart Asiatiques–Blancs au
  baccalauréat se creusait de 9 points [nces-condition-of-education]. Le niveau
  de scolarité est plus élevé chez les femmes à chaque palier, avec un écart de
  11 points entre les sexes chez les étudiants blancs de 25 à 29 ans au delà du
  premier cycle universitaire [nces-condition-of-education].
society_cohesion_en: >-
  Cohesion in the United States is under strain along two different axes that
  behave oppositely. Institutional trust is low and partisan-sorted: just 17% of
  Americans said in 2025 they trust the federal government to do what is right
  most of the time, near the lowest in about 70 years, and the figure swings
  with power rather than measuring a stable underlying level — 26% of
  Republicans against 9% of Democrats in 2025, with Gallup's parallel series
  showing Republican confidence in the executive rising and Democratic
  confidence falling by comparable margins after the 2024 change of
  administration [pew-trust-in-government][gallup-confidence-institutions].
  Interpersonal trust is the deeper problem, and it is not partisan: the share
  of Americans saying most people can be trusted fell from 46% in 1972 to 34% by
  the 2020s, and the decline runs across liberals, conservatives and moderates
  alike [pew-interpersonal-trust]. The erosion is generational — in 2026
  polling, 77% of those born before 1960 said most people can be trusted,
  against 35% of those born in the 2000s — so it deepens as older cohorts are
  replaced [marquette-trust-2026]. The society's institutional trust divides it
  by party; its social trust is thinning across the whole population regardless
  of party, and each cohort enters adulthood trusting others less than the last.
society_cohesion_fr: >-
  La cohésion aux États-Unis subit des tensions selon deux axes distincts qui
  évoluent en sens contraire. La confiance envers les institutions est faible et
  clivée selon le parti : seuls 17 % des États-Uniens déclaraient en 2025 faire
  confiance au gouvernement fédéral pour agir correctement la plupart du temps
  (niveau proche du plus bas en une soixantaine d'années). Ce chiffre varie
  selon le parti au pouvoir plutôt que de mesurer un niveau de fond stable : 26
  % chez les Républicains contre 9 % chez les Démocrates en 2025; la série
  parallèle de Gallup montrant la confiance républicaine envers l'exécutif en
  hausse et la confiance démocrate en baisse dans des proportions comparables
  après le changement d'administration de 2024
  [pew-trust-in-government][gallup-confidence-institutions]. La confiance
  interpersonnelle constitue le problème plus profond, et elle n'est pas
  partisane : la part des États-Uniens estimant qu'on peut faire confiance à la
  plupart des gens est passée de 46 % en 1972 à 34 % dans les années 2020,;
  recul qui touche autant les libéraux que les conservateurs et les modérés
  [pew-interpersonal-trust]. L'érosion est générationnelle (dans les sondages de
  2026, 77 % des personnes nées avant 1960 estimaient qu'on peut faire confiance
  à la plupart des gens, contre 35 % de celles nées dans les années 2000), de
  sorte qu'elle s'accentue à mesure que les cohortes âgées sont remplacées
  [marquette-trust-2026]. La confiance institutionnelle divise la société selon
  le parti; sa confiance sociale s'amincit dans l'ensemble de la population sans
  égard au parti; chaque cohorte entrant dans l'âge adulte en se fiant aux
  autres moins que la précédente.
economy_realEconomy_en: >-
  The United States is a diversified economy in which services dominate both
  production and employment, and the country lives on domestic consumption,
  finance, technology and health care. Growth is moderate and set to firm in
  2026, with the generative artificial intelligence (AI) and data-centre
  buildout the leading impulse behind business investment. 


  Of 159.0 million nonfarm payroll jobs in June 2026, private service-providing
  industries account for 114.1 million (71.8%), goods-producing industries for
  21.5 million (13.5%) and government for 23.4 million (14.7%)
  [bls-empsit-june2026]. Within services, trade, transportation and utilities
  employ 28.7 million, health care and social assistance 23.9 million — more
  than the entire goods-producing sector — professional and business services
  22.5 million, and financial activities 9.1 million; manufacturing employs 12.6
  million, or 7.9% of nonfarm payrolls [bls-empsit-june2026]. Nonfarm employment
  rose 57,000 in June 2026, a pace in line with the average monthly gain of
  36,000 over the prior twelve months, and the April and May figures were
  revised down by a combined 74,000 [bls-empsit-june2026]. The unemployment rate
  was 4.2% in June 2026, with 7.1 million people unemployed and a labour-force
  participation rate of 61.5%, both rate and level little changed over the year;
  the number of people jobless for 27 weeks or longer rose by 286,000 over that
  year to 1.9 million, 27.3% of all unemployed [bls-empsit-june2026]. 


  Real gross domestic product (GDP) grew 2.1% in 2025; by industry that year,
  real value added rose 2.7% in private services-producing industries, 1.2% in
  private goods-producing industries and less than 0.1% in government
  [bea-gdp-q4-2025-third]. The Congressional Budget Office (CBO) projects 2.2%
  growth in 2026, an acceleration it attributes to the 2025 reconciliation act
  and to the rebound following the late-2025 lapse in discretionary
  appropriations [cbo-budget-outlook-2026]. Real business fixed investment is
  projected to grow 3.9% in 2026, driven by generative AI and data-centre
  investment [cbo-budget-outlook-2026][eia-aeo-2026]. Employment in the
  information sector stood at 2.8 million in June 2026, about 89,000 below its
  level a year earlier, while computer systems design and related services
  employed 2.4 million [bls-empsit-june2026]. Nonfuel mineral production was
  valued at $112 billion in 2025, up 5.6% [usgs-mcs-2026].
economy_realEconomy_fr: >-
  Les États-Unis ont une économie diversifiée où les services dominent tant la
  production que l'emploi; le pays vit de la consommation intérieure, de la
  finance, de la technologie et de la santé. La croissance est modérée et
  devrait se raffermir en 2026, l'essor de l'intelligence artificielle (IA)
  générative et des centres de données constituant le principal ressort de
  l'investissement des entreprises. 


  Sur 159,0 millions d'emplois salariés non agricoles en juin 2026, les services
  privés en comptent 114,1 millions (71,8 %), les industries productrices de
  biens 21,5 millions (13,5 %) et les administrations publiques 23,4 millions
  (14,7 %) [bls-empsit-june2026]. Au sein des services, le commerce, le
  transport et les services d'utilité publique emploient 28,7 millions de
  personnes, les soins de santé et l'aide sociale 23,9 millions (davantage que
  l'ensemble du secteur des biens), les services professionnels et aux
  entreprises 22,5 millions et les activités financières 9,1 millions; la
  fabrication en emploie 12,6 millions, soit 7,9 % des emplois non agricoles
  [bls-empsit-june2026]. L'emploi non agricole total a progressé de 57 000 en
  juin 2026, rythme comparable au gain mensuel moyen de 36 000 enregistré au
  cours des douze mois précédents, et les données d'avril et de mai ont été
  révisées à la baisse de 74 000 au total [bls-empsit-june2026]. Le taux de
  chômage s'établissait à 4,2 % en juin 2026, avec 7,1 millions de personnes au
  chômage et un taux d'activité de 61,5 %, taux et effectif ayant peu varié sur
  un an. Le nombre de personnes sans emploi depuis 27 semaines ou plus a
  augmenté de 286 000 sur cette même année pour atteindre 1,9 million, soit 27,3
  % de l'ensemble des chômeurs [bls-empsit-june2026]. 


  Le produit intérieur brut (PIB) réel a progressé de 2,1 % en 2025; par
  industrie cette année-là, la valeur ajoutée réelle a augmenté de 2,7 % dans
  les services privés, de 1,2 % dans les industries privées productrices de
  biens et de moins de 0,1 % dans les administrations publiques
  [bea-gdp-q4-2025-third]. Le Congressional Budget Office (CBO) prévoit une
  croissance de 2,2 % en 2026, accélération qu'il attribue à la loi de
  réconciliation de 2025 et au rebond consécutif à l'interruption des crédits
  discrétionnaires de la fin de 2025 [cbo-budget-outlook-2026]. L'investissement
  fixe des entreprises devrait progresser de 3,9 % en 2026, tiré par l'IA
  générative et l'investissement dans les centres de données
  [cbo-budget-outlook-2026][eia-aeo-2026]. L'emploi dans le secteur de
  l'information s'établissait à 2,8 millions en juin 2026, soit environ 89 000
  de moins qu'un an plus tôt, tandis que la conception de systèmes informatiques
  et les services connexes employaient 2,4 millions de personnes
  [bls-empsit-june2026]. La production minière non combustible a été évaluée à
  112 milliards de dollars en 2025, en hausse de 5,6 % [usgs-mcs-2026].
economy_publicFinances_en: >-
  The federal government runs large structural deficits and rising debt. The
  Congressional Budget Office (CBO) projects a fiscal-year 2026 deficit of $1.9
  trillion, equal to 5.8% of gross domestic product (GDP) against a 50-year
  average of 3.8%, on outlays of 23.3% of GDP and revenues 17.5%
  [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. Federal debt held by the
  public (that is, excluding securities held by the federal government's own
  trust funds) rises from 101% of GDP in 2026 to a projected 120% by 2036, above
  any level in the country's history and past the prior 1946 peak of 106%
  [cbo-budget-outlook-2026]. Net interest outlays reach $1.0 trillion in 2026
  and are projected to double to $2.1 trillion, or 4.6% of GDP, by 2036
  [cbo-budget-outlook-2026]. 


  Monetary policy is restrictive and inflation is above target: the Federal Open
  Market Committee held the federal funds target range at 3.50–3.75% in July
  2026, judging inflation still elevated relative to its 2% goal and attributing
  that in part to supply shocks raising prices in sectors including energy
  [fomc-statement-july-2026]. Consumer Price Index (CPI) inflation ran at 3.5%
  over the twelve months to June 2026, with the index excluding food and energy
  up 2.6% and the energy index up 15.7% [bls-cpi-june2026]. 

  The country no longer holds a top rating from either agency that has published
  a recent sovereign action: Moody's downgraded its long-term issuer and senior
  unsecured ratings to Aa1 from Aaa in May 2025 [moodys-us-rating], and Standard
  & Poor's rates the country AA+, with a stable outlook resting on the economy's
  resilience and on deficits it judges high but not rising [sp-us-rating-2025].
economy_publicFinances_fr: >-
  Le gouvernement fédéral accuse d'importants déficits structurels et une dette
  croissante. Le Congressional Budget Office (CBO) prévoit pour l'exercice 2026
  un déficit de 1 900 milliards de dollars, soit 5,8 % du produit intérieur brut
  (PIB) contre une moyenne de 3,8 % sur cinquante ans : les dépenses
  représentant 23,3 % du PIB et les recettes 17,5 %
  [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. La dette fédérale détenue
  par le public (c'est-à-dire hors titres détenus par les fonds fiduciaires
  fédéraux eux-mêmes) passe de 101 % du PIB en 2026 à 120 % projetés en 2036,
  au-delà de tout niveau atteint dans l'histoire du pays et du pic antérieur de
  106 % de 1946 [cbo-budget-outlook-2026]. Les intérêts nets atteignent 1 000
  milliards de dollars en 2026 et devraient doubler pour atteindre 2 100
  milliards, soit 4,6 % du PIB, d'ici 2036 [cbo-budget-outlook-2026]. 


  La politique monétaire est restrictive et l'inflation dépasse la cible : le
  Comité fédéral de l'open market a maintenu en juillet 2026 la fourchette cible
  du taux des fonds fédéraux à 3,50-3,75 %, jugeant l'inflation encore élevée
  par rapport à sa cible de 2 % (que le Comité mesure sur l'indice des dépenses
  de consommation personnelle [personal consumption expenditures, PCE]),
  distinct de l'indice des prix à la consommation [IPC]) et l'attribuant en
  partie à des chocs d'offre ayant fait monter les prix dans certains secteurs,
  dont l'énergie [fomc-statement-july-2026]. Sur l'IPC, les prix ont progressé
  de 3,5 % sur les douze mois clos en juin 2026; l'indice hors alimentation et
  énergie augmentant de 2,6 % et celui de l'énergie, de 15,7 %
  [bls-cpi-june2026]. 

  Le pays ne détient plus la note maximale d'aucune des agences ayant publié une
  décision souveraine récente : Moody's a abaissé en mai 2025 sa note d'émetteur
  à long terme et celle de sa dette non garantie de premier rang de Aaa à Aa1
  [moodys-us-rating], et Standard & Poor's attribue au pays la note AA+,
  assortie d'une perspective stable fondée sur la résilience de l'économie et
  sur des déficits qu'elle juge élevés, mais non croissants [sp-us-rating-2025].
economy_externalVulnerability_en: >-
  The United States runs a large and persistent deficit in goods, partly offset
  by a services surplus, and finances the gap by borrowing abroad on terms no
  other borrower obtains. Exports of goods and services were $3,432.3 billion in
  2025 against imports of $4,333.8 billion, a deficit of $901.5 billion — $2.1
  billion narrower than 2024, but composed of a goods deficit that widened $25.5
  billion to $1,240.9 billion and a services surplus that grew 8.9% to $339.5
  billion [bea-census-trade-annual-2025]. The composition is asymmetric: goods
  imports rose $143.2 billion, led by capital goods at $165.9 billion, within
  which computers rose $101.4 billion, computer accessories $42.7 billion and
  telecommunications equipment $30.3 billion, while services exports rose $82.1
  billion, led by other business services, charges for the use of intellectual
  property, and financial services [bea-census-trade-annual-2025]. Goods-partner
  concentration is broad rather than narrow, and it shifted sharply in 2025: the
  largest bilateral goods deficits were with the European Union ($218.8
  billion), mainland China ($202.1 billion), Mexico ($196.9 billion), Vietnam
  ($178.2 billion) and Taiwan ($146.8 billion), against surpluses with the
  Netherlands ($60.7 billion), South and Central America ($52.4 billion) and the
  United Kingdom ($32.2 billion) [bea-census-trade-annual-2025]. The deficit
  with China fell $93.4 billion as imports from China dropped $130.4 billion to
  $308.4 billion, while the deficits with Taiwan and Vietnam rose $73.0 billion
  and $54.7 billion [bea-census-trade-annual-2025]. Measured at end-2025 rather
  than as a full-year average, China's share of United States goods imports had
  fallen to 7.7% from 13.2% in 2024, which the International Monetary Fund reads
  as substitution across suppliers rather than a reduction in import demand
  [imf-art-iv-usa-2026].


  Energy and food run in opposite directions. Total energy exports reached a
  record 31 quadrillion British thermal units (quads) in 2025 against imports of
  21 quads, giving record net exports of 11 quads, 20% above the previous
  record; petroleum supplied 63% of exports and natural gas a record 9 quads, or
  29% [eia-energy-trade-2025]. Petroleum is simultaneously the largest single
  import at 83% of the total, and natural gas imports from Canada remain
  important for balancing seasonal demand [eia-energy-trade-2025]. Agriculture
  has reversed within five years: fiscal 2021 and fiscal 2022 closed in surplus
  ($8.5 billion and $1.9 billion), followed by deficits of $17.3 billion in
  fiscal 2023, $31.9 billion in fiscal 2024 and $43.7 billion in fiscal 2025,
  when exports of $175.6 billion met imports of $219.4 billion; the fiscal 2026
  deficit is forecast at $29.0 billion [usda-aes-136].


  Foreign holdings of federal debt totalled approximately $9.2 trillion in
  December 2025, equal to 31% of publicly held debt of $30.1 trillion — a share
  down from 34% in December 2021 because total debt grew faster than foreign
  holdings [crs-rs22331-foreign-holdings]. Governmental sources hold 41.9% of
  that ($3.9 trillion) and private investors 58.1% ($5.4 trillion)
  [crs-rs22331-foreign-holdings]. The largest country holdings in December 2025
  were Japan at $1,185.5 billion (12.8% of foreign holdings), the United Kingdom
  at $866.0 billion (9.3%) and mainland China at $683.5 billion (7.4%)
  [treasury-tic-debt-holders]. China's holdings have fallen in both nominal
  terms and share, from 13.4% of all foreign holdings in December 2021
  [crs-rs22331-foreign-holdings]. Country attribution is weaker than it appears:
  the Treasury records the location of a holding, not the nationality of its
  holder, so securities held for third-country clients in Belgium, Luxembourg,
  the Cayman Islands or Switzerland are attributed to those jurisdictions
  [crs-rs22331-foreign-holdings].


  The reserve-currency position removes the financing constraint smaller
  economies face, but not the accumulating claim. The current-account deficit
  was 3.7% of gross domestic product (GDP) in 2025, against roughly 2% in
  2013–19, and the net international investment position now exceeds −80% of
  GDP, widened by government external borrowing and by non-resident inflows into
  United States equities and corporate debt [imf-art-iv-usa-2026]. The
  composition of that funding has shifted from official-sector holders toward
  non-bank private investors whose behaviour is more price- and risk-sensitive,
  which the International Monetary Fund (IMF) names as the principal external
  vulnerability: an abrupt shift in portfolio preferences could force a
  disorderly rebalancing [imf-art-iv-usa-2026]. The Fund judged the 2025
  external position moderately weaker than medium-term fundamentals and
  appropriate policies imply, attributing the misalignment largely to the
  chronic federal deficit, which weakens the current account and appreciates the
  dollar — the external finding restates the fiscal one rather than adding a
  second [imf-art-iv-usa-2026]. The country holds no IMF program; the Fund's
  engagement is annual Article IV surveillance, last concluded on 1 April 2026
  [imf-art-iv-usa-2026]. On physical supply the exposure inverts: the country
  was 100% net import reliant on 16 nonfuel mineral commodities in 2025, with
  China the primary source for 14 of the most import-dependent critical minerals
  [usgs-mcs-2026].
economy_externalVulnerability_fr: >-
  Les États-Unis accusent un déficit important et persistant sur les biens,
  partiellement compensé par un excédent sur les services, et financent l'écart
  en empruntant à l'étranger à des conditions qu'aucun autre emprunteur
  n'obtient. Les exportations de biens et services se sont établies à 3 432,3
  milliards de dollars en 2025 contre 4 333,8 milliards d'importations, soit un
  déficit de 901,5 milliards; 2,1 milliards de moins qu'en 2024, mais composé
  d'un déficit sur les biens qui s'est creusé de 25,5 milliards pour atteindre 1
  240,9 milliards et d'un excédent sur les services en hausse de 8,9 % à 339,5
  milliards [bea-census-trade-annual-2025]. La composition est asymétrique : les
  importations de biens ont augmenté de 143,2 milliards, tirées par les biens
  d'équipement à hauteur de 165,9 milliards, dont les ordinateurs pour 101,4
  milliards, les accessoires informatiques pour 42,7 milliards et le matériel de
  télécommunication pour 30,3 milliards, tandis que les exportations de services
  progressaient de 82,1 milliards, portées par les autres services aux
  entreprises, les redevances d'utilisation de la propriété intellectuelle et
  les services financiers [bea-census-trade-annual-2025]. La concentration des
  partenaires sur les biens est large plutôt qu'étroite, et elle s'est nettement
  déplacée en 2025 : les principaux déficits bilatéraux visaient l'Union
  européenne (218,8 milliards), la Chine continentale (202,1 milliards), le
  Mexique (196,9 milliards), le Vietnam (178,2 milliards) et Taïwan (146,8
  milliards), contre des excédents avec les Pays-Bas (60,7 milliards),
  l'Amérique du Sud et centrale (52,4 milliards) et le Royaume-Uni (32,2
  milliards) [bea-census-trade-annual-2025]. Le déficit avec la Chine a reculé
  de 93,4 milliards, les importations chinoises chutant de 130,4 milliards à
  308,4 milliards, tandis que les déficits avec Taïwan et le Vietnam
  augmentaient de 73,0 et 54,7 milliards [bea-census-trade-annual-2025]. Mesurée
  en fin d'année 2025 plutôt qu'en moyenne annuelle, la part de la Chine dans
  les importations de biens des États-Unis était tombée à 7,7 %, contre 13,2 %
  en 2024; ce que le Fonds monétaire international interprète comme une
  substitution entre fournisseurs plutôt que comme une réduction de la demande
  d'importation [imf-art-iv-usa-2026].


  L'énergie et l'alimentation évoluent en sens inverse. Les exportations totales
  d'énergie ont atteint un record de 31 quadrillions d'unités thermiques
  britanniques (quads) en 2025, contre 21 quads d'importations, soit des
  exportations nettes record de 11 quads, en hausse de 20 % par rapport au
  record précédent; le pétrole a fourni 63 % des exportations et le gaz naturel
  un record de 9 quads, soit 29 % [eia-energy-trade-2025]. Le pétrole constitue
  simultanément la première importation, à 83 % du total, et les importations de
  gaz naturel en provenance du Canada demeurent importantes pour équilibrer la
  demande saisonnière [eia-energy-trade-2025]. L'agriculture s'est renversée en
  cinq ans : les exercices 2021 et 2022 se sont soldés par des excédents (8,5 et
  1,9 milliards), suivis de déficits de 17,3 milliards à l'exercice 2023, de
  31,9 milliards à l'exercice 2024 et de 43,7 milliards à l'exercice 2025, où
  175,6 milliards d'exportations ont fait face à 219,4 milliards d'importations;
  le déficit de l'exercice 2026 est prévu à 29,0 milliards [usda-aes-136].


  Les avoirs étrangers en dette fédérale s'élevaient à environ 9 200 milliards
  de dollars en décembre 2025, soit 31 % de la dette détenue par le public, qui
  atteignait 30 100 milliards; part en recul par rapport aux 34 % de décembre
  2021, la dette totale ayant crû plus vite que les avoirs étrangers
  [crs-rs22331-foreign-holdings]. Les sources gouvernementales en détiennent
  41,9 % (3 900 milliards) et les investisseurs privés 58,1 % (5 400 milliards)
  [crs-rs22331-foreign-holdings]. Les principaux avoirs par pays en décembre
  2025 étaient ceux du Japon, à 1 185,5 milliards (12,8 % des avoirs étrangers),
  du Royaume-Uni, à 866,0 milliards (9,3 %), et de la Chine continentale, à
  683,5 milliards (7,4 %) [treasury-tic-debt-holders]. Les avoirs chinois ont
  diminué tant en valeur nominale qu'en part, contre 13,4 % de l'ensemble des
  avoirs étrangers en décembre 2021 [crs-rs22331-foreign-holdings].
  L'attribution par pays est plus fragile qu'il n'y paraît : le Trésor
  enregistre le lieu de détention et non la nationalité du détenteur, de sorte
  que les titres détenus pour des clients de pays tiers en Belgique, au
  Luxembourg, aux îles Caïmans ou en Suisse sont attribués à ces territoires
  [crs-rs22331-foreign-holdings].


  La position de monnaie de réserve lève la contrainte de financement que
  subissent les petites économies, mais non la créance qui s'accumule. Le
  déficit du compte courant s'élevait à 3,7 % du produit intérieur brut (PIB) en
  2025, contre environ 2 % en 2013-2019, et la position extérieure globale nette
  dépasse désormais −80 % du PIB, creusée par l'emprunt extérieur des
  administrations publiques et par les entrées non résidentes dans les actions
  et la dette d'entreprise des États-Unis [imf-art-iv-usa-2026]. La composition
  de ce financement s'est déplacée des détenteurs du secteur officiel vers des
  investisseurs privés non bancaires, dont le comportement est plus sensible aux
  prix et au risque; ce que le Fonds monétaire international (FMI) désigne comme
  la principale vulnérabilité extérieure : un revirement brutal des préférences
  de portefeuille pourrait imposer un rééquilibrage désordonné
  [imf-art-iv-usa-2026]. Le Fonds a jugé la position extérieure de 2025
  modérément plus faible que ne l'indiquent les fondamentaux à moyen terme et
  des politiques appropriées, attribuant ce désalignement en grande partie au
  déficit fédéral chronique, qui affaiblit le compte courant et apprécie le
  dollar; le constat extérieur reformule le constat budgétaire plutôt qu'il n'en
  ajoute un second [imf-art-iv-usa-2026]. Le pays ne fait l'objet d'aucun
  programme du FMI; l'engagement du Fonds se limite à la surveillance annuelle
  au titre de l'article IV, dont la dernière conclusion date du 1er avril 2026
  [imf-art-iv-usa-2026]. Sur l'approvisionnement physique, l'exposition
  s'inverse : le pays dépendait à 100 % des importations nettes pour 16 produits
  minéraux non combustibles en 2025, la Chine étant la source principale de 14
  des minéraux critiques les plus dépendants des importations [usgs-mcs-2026].
economy_politicalEconomy_en: >-
  The United States is a market-led economy in which direct state ownership has
  historically been minimal, and both edges of the state–market boundary are now
  being redrawn at once — the executive taking equity in named firms, and the
  courts removing the insulation of independent regulators. The movement is
  toward executive discretion over both ownership and enforcement, and it is
  happening largely outside legislation.


  On ownership, the federal government announced investments worth $27.6 billion
  across thirty-seven deals involving direct ownership between January 2025 and
  July 2026 — the Department of Commerce leading at twenty-four deals, the
  Department of Defense at seven, the Development Finance Corporation at six and
  the Department of Energy at two — a portfolio for which the only consolidated
  record is a think-tank compilation assembled from open sources
  [cfr-equity-tracker-2026]. The two largest positions are documented by the
  companies themselves. The government purchased 433.3 million Intel shares at
  $20.47, a 9.9% stake worth $8.9 billion, funded by the $5.7 billion in
  Creating Helpful Incentives to Produce Semiconductors (CHIPS) and Science Act
  grants awarded but not yet paid and $3.2 billion from the Secure Enclave
  program; the holding is passive, carrying no board seat or governance rights,
  the government agreed to vote with the board on shareholder matters, and it
  took a five-year warrant for a further 5% exercisable only if Intel ceases to
  own a majority of its foundry business [intel-usg-agreement-2025]. The
  Department of Defense committed $400 million to convertible preferred stock
  and a warrant in MP Materials at a $30.03 conversion price, representing 15%
  of shares outstanding as of 9 July 2025 and positioning the department as the
  company's largest shareholder, alongside a ten-year floor price of $110 per
  kilogram for its neodymium-praseodymium products and a ten-year commitment to
  purchase the entire output of its planned second magnet plant
  [mp-materials-dod-2025].


  The private structure is concentrated and health-weighted. The 2026 Fortune
  500, in its seventy-second year, accounted for $21.0 trillion in revenue and
  $2.1 trillion in profits and employed 30.5 million people worldwide
  [fortune-500-2026]. Amazon took first place, ending Walmart's thirteen-year
  run, and four of the top ten are health-care companies — UnitedHealth Group
  third, CVS Health sixth, McKesson eighth and Cencora tenth — alongside Apple,
  Alphabet, Berkshire Hathaway and ExxonMobil [fortune-500-2026]. Amazon took
  first place with revenue above $700 billion in 2025, up 12%, ending Walmart's
  thirteen-year run; UnitedHealth Group held third as the largest health-care
  company; and Alphabet, at fifth, was the most profitable company on the list
  with record earnings of $132 billion [fortune-500-2026]. Financial companies
  were the largest sector bloc at ninety-five firms, $4.1 trillion in revenue
  and over $474 billion in profits, while health care generated $3.6 trillion
  and placed eight companies in the top twenty-five [fortune-500-2026]. Four
  technology firms — Meta, Microsoft, Amazon and Alphabet — carry the
  artificial-intelligence data-centre buildout, with combined capital
  expenditure of about $410 billion in 2025 and announced plans of roughly $725
  billion for 2026 [goldman-hyperscaler-capex-2026]. The defence industrial base
  runs through the Department of Defense's top-100 contractor list, naming the
  long-standing prime contractors Lockheed Martin, RTX, Boeing, General Dynamics
  and Northrop Grumman among them
  [dod-top100-contractors-list][crs-dod-contractors-primer].


  Organised labour is the weak counterparty. The union membership rate was 10.0%
  in 2025 with 14.7 million members, against 20.1% and 17.7 million in 1983, the
  first year of comparable data; a further 1.8 million workers are covered by a
  union contract without membership, putting union representation at 11.2%
  [bls-union-members-2025]. The remaining density is public: 32.9% in the public
  sector against 5.9% in the private sector, and 1.5% in financial activities
  and 2.1% in professional and business services — the sectors the Fortune 500
  is concentrated in [bls-union-members-2025]. Union members' median usual
  weekly earnings were $1,404 in 2025 against $1,174 for non-union workers
  [bls-union-members-2025].


  Distribution under the 2025 reconciliation act (Public Law 119-21, the One Big
  Beautiful Bill Act) runs against the bottom decile. The act permanently
  extended 2017 tax provisions and raised projected deficits by $4.7 trillion
  over 2026–2035 [obbba-hr1][cbo-budget-outlook-2026]. CBO estimates households
  on average will gain resources over 2026–2034, but the gradient runs against
  the bottom: the lowest decile loses about $1,200 a year, or 3.1% of income,
  driven by reduced Medicaid and Supplemental Nutrition Assistance Program
  (SNAP) benefits; the fifth and sixth deciles gain $800 and $1,200 (0.8% and
  1.0%); and the highest decile gains about $13,600, or 2.7%, driven by
  reductions in the taxes it owes [cbo-distributional-pl119-21]. The technically
  necessary reform — closing the primary and interest-driven fiscal gap — is
  politically constrained, with mandatory spending rising and net interest the
  fastest-growing outlay [cbo-budget-outlook-2026][crfb-cbo-outlook-2026].
economy_politicalEconomy_fr: >-
  Les États-Unis constituent une économie de marché où la propriété publique
  directe est historiquement minime, et les deux bords de la frontière
  État-marché sont désormais redessinés simultanément : l'exécutif prenant des
  participations dans des entreprises nommées, et les tribunaux retirant leur
  protection aux régulateurs indépendants. Le mouvement va vers une discrétion
  accrue de l'exécutif sur la propriété comme sur l'application des règles, et
  il s'opère largement hors du champ législatif.


  Du côté de la propriété, le gouvernement fédéral a annoncé des investissements
  de 27,6 milliards de dollars répartis sur trente-sept opérations comportant
  une participation directe entre janvier 2025 et juillet 2026 (le département
  du Commerce en menant vingt-quatre, celui de la Défense sept, la Development
  Finance Corporation six et celui de l'Énergie deux), portefeuille dont le seul
  relevé consolidé est une compilation de groupe de réflexion établie à partir
  de sources ouvertes [cfr-equity-tracker-2026]. Les deux plus importantes
  positions sont documentées par les entreprises elles-mêmes. Le gouvernement a
  acheté 433,3 millions d'actions d'Intel à 20,47 dollars, soit une
  participation de 9,9 % valant 8,9 milliards, financée par les 5,7 milliards de
  subventions du Creating Helpful Incentives to Produce Semiconductors (CHIPS)
  and Science Act attribuées, mais non versées et par 3,2 milliards du programme
  Secure Enclave. Cette participation est passive, sans siège au conseil ni
  droits de gouvernance; le gouvernement s'engageant à voter avec le conseil sur
  les questions soumises aux actionnaires, et assortie d'un bon de souscription
  de cinq ans portant sur 5 % supplémentaires, exerçable seulement si Intel
  cesse de détenir la majorité de son activité de fonderie
  [intel-usg-agreement-2025]. Le département de la Défense a engagé 400 millions
  de dollars en actions privilégiées convertibles et bons de souscription dans
  MP Materials, au prix de conversion de 30,03 dollars, représentant 15 % des
  actions en circulation au 9 juillet 2025 et faisant du département le premier
  actionnaire de l'entreprise, avec un prix plancher sur dix ans de 110 dollars
  le kilogramme pour ses produits de néodyme-praséodyme et un engagement d'achat
  sur dix ans de toute la production de sa deuxième usine d'aimants prévue
  [mp-materials-dod-2025].


  La structure privée est concentrée et pondérée par la santé. Le Fortune 500 de
  2026, dans sa soixante-douzième année, représentait 21 000 milliards de
  dollars de chiffre d'affaires et 2 100 milliards de profits, et employait 30,5
  millions de personnes dans le monde [fortune-500-2026]. Amazon a pris la
  première place, mettant fin à treize ans de règne de Walmart, et quatre des
  dix premières sont des entreprises de santé (UnitedHealth Group en troisième,
  CVS Health en sixième, McKesson en huitième et Cencora en dixième), aux côtés
  d'Apple, Alphabet, Berkshire Hathaway et ExxonMobil [fortune-500-2026]. Les
  sociétés financières formaient le premier bloc sectoriel avec
  quatre-vingt-quinze entreprises, 4 100 milliards de chiffre d'affaires et plus
  de 474 milliards de profits, tandis que la santé générait 3 600 milliards et
  plaçait huit entreprises dans les vingt-cinq premières [fortune-500-2026].
  Quatre entreprises technologiques (Meta, Microsoft, Amazon et Alphabet)
  portent l'expansion des centres de données d'intelligence artificielle, avec
  des dépenses d'investissement combinées d'environ 410 milliards en 2025 et des
  plans annoncés d'environ 725 milliards pour 2026
  [goldman-hyperscaler-capex-2026]. La base industrielle de défense passe par la
  liste des cent premiers entrepreneurs du département de la Défense, qui nomme
  les maîtres d'œuvre historiques, dont Lockheed Martin, RTX, Boeing, General
  Dynamics et Northrop Grumman
  [dod-top100-contractors-list][crs-dod-contractors-primer].


  Le travail organisé est la contrepartie faible. Le taux de syndicalisation
  s'établissait à 10,0 % en 2025, pour 14,7 millions de membres, contre 20,1 %
  et 17,7 millions en 1983, première année de données comparables; 1,8 million
  de travailleurs supplémentaires sont couverts par une convention collective
  sans être membres, portant la représentation syndicale à 11,2 %
  [bls-union-members-2025]. La densité résiduelle est publique : 32,9 % dans le
  secteur public contre 5,9 % dans le privé, et 1,5 % dans les activités
  financières et 2,1 % dans les services professionnels et aux entreprises (soit
  les secteurs où se concentre le Fortune 500) [bls-union-members-2025]. Le
  salaire hebdomadaire médian habituel des syndiqués atteignait 1 404 dollars en
  2025, contre 1 174 dollars pour les non-syndiqués [bls-union-members-2025].


  La répartition sous la loi de réconciliation de 2025 (loi publique 119-21, la
  One Big Beautiful Bill Act) joue contre le décile inférieur. La loi a
  pérennisé les dispositions fiscales de 2017 et relevé les déficits projetés de
  4 700 milliards de dollars sur 2026-2035 [obbba-hr1][cbo-budget-outlook-2026].
  Le CBO estime que les ménages gagneront en moyenne des ressources sur
  2026-2034, mais le gradient joue contre le bas de la distribution : le décile
  inférieur perd environ 1 200 dollars par an, soit 3,1 % de son revenu, en
  raison de la réduction des prestations de Medicaid et du Supplemental
  Nutrition Assistance Program (SNAP); les cinquième et sixième déciles gagnent
  800 et 1 200 dollars (0,8 % et 1,0 %); et le décile supérieur gagne environ 13
  600 dollars, soit 2,7 %, grâce à la baisse des impôts qu'il doit
  [cbo-distributional-pl119-21]. La réforme techniquement nécessaire (résorber
  le déficit primaire et celui tiré par les intérêts) est politiquement
  contrainte; les dépenses obligatoires augmentant et les intérêts nets étant le
  poste à la croissance la plus rapide
  [cbo-budget-outlook-2026][crfb-cbo-outlook-2026].
political_powerStructure_en: >-
  The United States is a federal presidential republic in which power is won
  through separately elected executive and legislative branches, and as of 18
  July 2026 the federal government is unified under Republican control, with the
  balance of power moving toward the presidency — detail follows. The executive
  is held by President Donald Trump, a Republican who won the November 2024
  election and was inaugurated in January 2025 [freedomhouse-usa-2026].
  Legislative control is stated separately from executive control because the
  system permits divergence, but here it does not: in the Senate (100 seats)
  Republicans hold 53 seats to the Democrats' 45, with 2 independents (Senators
  King and Sanders) caucusing with the Democrats
  [senate-partydiv][senate-dailypress]; in the House of Representatives (435
  seats) Republicans hold 217 seats, Democrats 212, with 1 independent and 5
  vacancies following deaths and resignations in 2026 [house-partybreakdown].
  Government is therefore unified rather than divided. Whether operative power
  tracks the constitutional allocation is contested: the Constitution vests
  executive power in the President and legislative power in Congress, but 2026
  apex-court doctrine has expanded presidential control over the executive
  branch (removal of independent-agency heads) [scotus-opinions-portal], and
  this pass presents that contest without resolving it.
  [calibration-executive-source]
political_powerStructure_fr: >-
  Les États-Unis sont une république fédérale présidentielle où le pouvoir se
  conquiert par l'élection distincte de l'exécutif et du législatif, et au 18
  juillet 2026 le gouvernement fédéral est unifié sous contrôle républicain,
  l'équilibre des pouvoirs se déplaçant vers la présidence — les détails
  suivent. L'exécutif est détenu par le président Donald Trump, républicain élu
  en novembre 2024 et investi en janvier 2025 [freedomhouse-usa-2026]. Le
  contrôle du législatif est indiqué séparément de celui de l'exécutif, car le
  régime autorise leur divergence, mais tel n'est pas le cas ici : au Sénat (100
  sièges), les républicains détiennent 53 sièges contre 45 aux démocrates, deux
  indépendants (les sénateurs King et Sanders) siégeant avec les démocrates
  [senate-partydiv][senate-dailypress]; à la Chambre des représentants (435
  sièges), les républicains détiennent 217 sièges, les démocrates 212, avec un
  indépendant et cinq sièges vacants après des décès et démissions en 2026
  [house-partybreakdown]. Le gouvernement est donc unifié et non divisé. La
  question de savoir si le pouvoir effectif suit la répartition
  constitutionnelle est contestée : la Constitution confie l'exécutif au
  président et le législatif au Congrès, mais la jurisprudence de la Cour
  suprême de 2026 a élargi le contrôle présidentiel sur la branche exécutive
  (révocation des dirigeants d'agences indépendantes) [scotus-opinions-portal];
  cette étape présente ce différend sans le trancher.
  [calibration-executive-source]
political_rightsAndChecks_en: >-
  The federal judiciary is appointed by the President with Senate confirmation
  and holds life tenure, and judicial review has been exercised since Marbury v.
  Madison [marbury-v-madison-1803][constitution-usa-1787]. Independent scorers
  document measured erosion of checks: Freedom House rated the United States 81
  of 100 in its Freedom in the World 2026 report, a 3-point decline, and per Pew
  Research Center the US rating from 2005 to 2025 declined more than any other
  country Freedom House categorizes as 'free' except Nauru and Bulgaria —
  Freedom House is an advocacy-oriented US-based scorer whose ratings are
  interpretive [freedomhouse-usa-2026]. V-Dem's Democracy Report 2026 downgraded
  the United States from 'liberal democracy' to 'electoral democracy' for the
  first time in over five decades and characterises the decline as unprecedented
  in modern history [vdem-democracy-report-2026]. The World Justice Project Rule
  of Law Index 2025 ranked the United States 27th of 143 countries overall and
  112th of 143 on access to civil justice [wjp-rule-of-law-2025]. Transparency
  International's 2025 Corruption Perceptions Index scored the United States 64
  of 100 and ranked it 29th of 182, its lowest-ever score, down from 65 in 2024
  [transparency-cpi-2025]. On media, Freedom House records a free and diverse
  press under strong constitutional protection but eroded by government
  pressure, market concentration and partisan polarisation
  [freedomhouse-usa-2026].
political_rightsAndChecks_fr: >-
  La magistrature fédérale est nommée par le président avec confirmation du
  Sénat et jouit d'un mandat à vie, le contrôle de constitutionnalité s'exerçant
  depuis l'arrêt Marbury v. Madison
  [marbury-v-madison-1803][constitution-usa-1787]. Les évaluateurs indépendants
  documentent une érosion mesurée des contre-pouvoirs : Freedom House a attribué
  aux États-Unis 81 sur 100 dans son rapport Freedom in the World 2026, soit un
  recul de 3 points, et selon le Pew Research Center la note américaine a, de
  2005 à 2025, davantage reculé que celle de tout autre pays classé « libre »
  par Freedom House, hormis Nauru et la Bulgarie — Freedom House étant un
  évaluateur américain à vocation militante dont les notes sont interprétatives
  [freedomhouse-usa-2026]. Le rapport Democracy Report 2026 de V-Dem a
  rétrogradé les États-Unis de « démocratie libérale » à « démocratie
  électorale » pour la première fois en plus de cinquante ans, qualifiant ce
  déclin d'inédit dans l'histoire moderne [vdem-democracy-report-2026]. L'indice
  de l'État de droit 2025 du World Justice Project classe les États-Unis 27e sur
  143 pays au total et 112e sur 143 pour l'accès à la justice civile
  [wjp-rule-of-law-2025]. L'indice de perception de la corruption 2025 de
  Transparency International attribue aux États-Unis 64 sur 100 et un rang de
  29e sur 182, leur plus bas score jamais enregistré, contre 65 en 2024
  [transparency-cpi-2025]. Concernant les médias, Freedom House constate une
  presse libre et plurielle sous forte protection constitutionnelle, mais érodée
  par la pression gouvernementale, la concentration du marché et la polarisation
  partisane [freedomhouse-usa-2026].
political_stabilityDrivers_en: >-
  The regime is legitimated by regular competitive elections and a long
  constitutional tradition, and armed forces and federal law-enforcement are
  under civilian command through the President as commander-in-chief
  [constitution-usa-1787]. The 2026 National Defense Strategy directs the
  military toward homeland defence and Western Hemisphere operations, including
  border security and counter-narcotics support, indicating executive use of the
  armed forces for domestic-adjacent missions [ndstrategy-2026]. Elite cohesion
  within the governing bloc is high — unified Republican control of the
  presidency and both chambers [senate-partydiv][house-partybreakdown] — while
  cross-party elite cohesion is low, reflected in institutional trust that is
  sharply partisan-sorted [pew-trust-in-government]. Corruption safeguards
  weakened: Freedom House recorded a score decline tied to the erosion of
  anticorruption safeguards under the administration [freedomhouse-usa-2026].
political_stabilityDrivers_fr: >-
  Le régime tire sa légitimité d'élections compétitives régulières et d'une
  longue tradition constitutionnelle, les forces armées et les forces fédérales
  de maintien de l'ordre relevant du commandement civil via le président, chef
  des armées [constitution-usa-1787]. La Stratégie de défense nationale 2026
  oriente l'armée vers la défense du territoire et les opérations dans
  l'hémisphère occidental, dont la sécurité frontalière et l'appui à la lutte
  antidrogue, signe d'un recours de l'exécutif aux forces armées pour des
  missions à caractère quasi intérieur [ndstrategy-2026]. La cohésion des élites
  au sein du bloc au pouvoir est forte — contrôle républicain unifié de la
  présidence et des deux chambres [senate-partydiv][house-partybreakdown] —
  tandis que la cohésion inter-partisane est faible, comme en témoigne une
  confiance institutionnelle fortement clivée selon les lignes partisanes
  [pew-trust-in-government]. Les garde-fous anticorruption se sont affaiblis :
  Freedom House a enregistré un recul de note lié à l'érosion de ces garde-fous
  sous l'administration [freedomhouse-usa-2026].
political_shockAbsorbers_en: >-
  The economy's scale and the dollar's reserve-currency role cushion fiscal and
  financial shocks — foreign investors held roughly $9.2 trillion in Treasuries
  as of December 2025, sustaining low-friction government borrowing
  [treasury-tic-debt-holders] — and deep, diversified services output provides
  resilience [cbo-budget-outlook-2026]. Against this, the rising debt trajectory
  (public debt from 101% of GDP in 2026 toward 120% by 2036, with net interest
  doubling to $2.1 trillion by 2036) narrows fiscal room
  [cbo-budget-outlook-2026], and recurrent funding lapses accelerate
  instability: the FY2026 shutdown ran 43 days (1 October–12 November 2025), the
  longest full-government shutdown on record, and a further Homeland Security
  funding lapse beginning 14 February 2026 ran 76 days to 30 April 2026, the
  longest shutdown of a single federal department on record
  [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations].
political_shockAbsorbers_fr: >-
  L'ampleur de l'économie et le rôle du dollar comme monnaie de réserve
  amortissent les chocs budgétaires et financiers — les investisseurs étrangers
  détenaient environ 9 200 milliards de dollars de bons du Trésor fin décembre
  2025, garantissant un endettement public sans heurts
  [treasury-tic-debt-holders] — et une production de services vaste et
  diversifiée assure une résilience [cbo-budget-outlook-2026]. En regard, la
  trajectoire ascendante de la dette (dette publique passant de 101 % du PIB en
  2026 vers 120 % en 2036, les intérêts nets doublant pour atteindre 2 100
  milliards de dollars d'ici 2036) réduit la marge budgétaire
  [cbo-budget-outlook-2026], et les blocages budgétaires répétés accélèrent
  l'instabilité : la fermeture de l'exercice 2026 a duré 43 jours (1er
  octobre-12 novembre 2025), la plus longue paralysie complète du gouvernement
  jamais enregistrée, et un nouveau blocage du financement de la Sécurité
  intérieure débutant le 14 février 2026 a duré 76 jours, jusqu'au 30 avril
  2026, la plus longue paralysie d'un seul ministère fédéral jamais enregistrée
  [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations].
political_constitutionalSubstrate_en: >-
  The constitutional form is a federal presidential republic founded on the
  written Constitution of the United States (1787, in force 4 March 1789), which
  allocates sovereignty between a national government and the states and
  separates legislative, executive and judicial power [constitution-usa-1787].
  The Reconstruction Amendments re-founded the terms of citizenship and equal
  protection (Thirteenth 1865, Fourteenth 1868, Fifteenth 1870)
  [reconstruction-amendments], and judicial review has anchored the order since
  Marbury v. Madison [marbury-v-madison-1803]. The legal order is plural and
  each order is held separately: federal statutory law, supreme over state law
  under the Supremacy Clause (Article VI) [constitution-usa-1787]; state
  statutory and common law, each of the 50 states maintaining its own
  constitution, legislature, courts and code under powers reserved by the Tenth
  Amendment, with Louisiana retaining a civil-law tradition for private law
  [constitution-usa-1787]; tribal law, under which federally recognised tribes
  exercise inherent pre-constitutional sovereignty over their members and Indian
  country, subject to congressional plenary power and not derived from federal
  or state law (the Marshall Trilogy; McGirt v. Oklahoma; Oklahoma v.
  Castro-Huerta; Haaland v. Brackeen)
  [marshall-trilogy][mcgirt-v-oklahoma-2020][oklahoma-v-castro-huerta-2022][haaland-v-brackeen-2023][usc-title25];
  and the insular territorial order, under which the five inhabited
  unincorporated territories are governed under the regime established by the
  Insular Cases, Congress holding plenary authority and the Constitution
  applying only selectively, residents holding no presidential vote and no
  voting congressional representation [insular-cases-1901]. This substrate is in
  motion, not stable: apex-court doctrine is actively reallocating power. In
  2026 the Court held in Trump v. Slaughter (No. 25-332, decided 29 June 2026,
  6–3) that statutory for-cause removal protections for Federal Trade Commission
  commissioners are unconstitutional, overruling Humphrey's Executor v. United
  States (1935) and vesting the President with at-will removal of principal
  officers of independent agencies
  [trump-v-slaughter-2026][scotus-opinions-portal]; in Trump v. Cook (No.
  25A312, 2026) the Court, 5–4, allowed Federal Reserve Governor Lisa Cook to
  remain pending merits review, signalling a central-bank carve-out
  [trump-v-cook-2026][scotus-opinions-portal]; in Trump v. Barbara (No. 25-365,
  decided 30 June 2026, 6–3) the Court held that children born in the United
  States to parents unlawfully or temporarily present are subject to the
  jurisdiction of the United States and are citizens at birth under the
  Fourteenth Amendment, striking down Executive Order 14160
  [trump-v-barbara-2026][scotus-opinions-portal]; and in Watson v. Republican
  National Committee (decided 29 June 2026, 5–4) the Court held that federal
  election-day statutes do not prevent states from counting absentee ballots
  postmarked by election day but received afterward
  [watson-v-rnc-2026][scotus-opinions-portal]. This 2026 reallocation follows
  Trump v. United States (2024) on presidential immunity, Trump v. CASA (2025)
  on nationwide injunctions, Loper Bright (2024) ending Chevron deference, West
  Virginia v. EPA (2022), and Shelby County v. Holder (2013)
  [trump-v-usa-2024][trump-v-casa-2025][loper-bright-2024][wv-v-epa-2022][shelby-county-2013].
  Administrative rules that implement this order are published in the Federal
  Register [federal-register], and non-partisan analysis is available through
  the Congressional Research Service [crs-congress-gov].
political_constitutionalSubstrate_fr: >-
  La forme constitutionnelle est une république fédérale présidentielle fondée
  sur la Constitution écrite des États-Unis (1787, en vigueur le 4 mars 1789),
  qui répartit la souveraineté entre un gouvernement national et les États et
  sépare les pouvoirs législatif, exécutif et judiciaire
  [constitution-usa-1787]. Les amendements de la Reconstruction ont refondé les
  termes de la citoyenneté et de l'égale protection (treizième 1865, quatorzième
  1868, quinzième 1870) [reconstruction-amendments], et le contrôle de
  constitutionnalité ancre l'ordre juridique depuis Marbury v. Madison
  [marbury-v-madison-1803]. L'ordre juridique est pluriel et chaque ordre est
  tenu séparément : le droit fédéral, supérieur au droit des États en vertu de
  la clause de suprématie (article VI) [constitution-usa-1787]; le droit
  statutaire et coutumier des États, chacun des 50 États conservant sa propre
  constitution, législature, tribunaux et code au titre des pouvoirs réservés
  par le dixième amendement, la Louisiane conservant une tradition de droit
  civil pour le droit privé [constitution-usa-1787]; le droit tribal, en vertu
  duquel les tribus reconnues au niveau fédéral exercent une souveraineté
  inhérente préconstitutionnelle sur leurs membres et les terres indiennes, sous
  réserve du pouvoir plénier du Congrès et non dérivée du droit fédéral ou des
  États (la trilogie Marshall; McGirt v. Oklahoma; Oklahoma v. Castro-Huerta;
  Haaland v. Brackeen)
  [marshall-trilogy][mcgirt-v-oklahoma-2020][oklahoma-v-castro-huerta-2022][haaland-v-brackeen-2023][usc-title25];
  et l'ordre territorial insulaire, en vertu duquel les cinq territoires non
  incorporés habités sont régis par le régime établi par les Insular Cases, le
  Congrès détenant l'autorité plénière et la Constitution ne s'appliquant que
  sélectivement, les résidents n'ayant ni vote présidentiel ni représentation
  votante au Congrès [insular-cases-1901]. Ce substrat est en mouvement et non
  stable : la jurisprudence de la Cour suprême redistribue activement le
  pouvoir. En 2026, la Cour a jugé dans Trump v. Slaughter (n° 25-332, rendu le
  29 juin 2026, 6 voix contre 3) que la protection légale contre la révocation
  sans motif des commissaires de la Federal Trade Commission est
  inconstitutionnelle, renversant Humphrey's Executor v. United States (1935) et
  conférant au président le pouvoir de révoquer à discrétion les dirigeants
  d'agences indépendantes [trump-v-slaughter-2026][scotus-opinions-portal]; dans
  Trump v. Cook (n° 25A312, 2026), la Cour a, par 5 voix contre 4, autorisé la
  gouverneure de la Réserve fédérale Lisa Cook à rester en fonction en attendant
  l'examen au fond, signalant une exception pour la banque centrale
  [trump-v-cook-2026][scotus-opinions-portal]; dans Trump v. Barbara (n° 25-365,
  rendu le 30 juin 2026, 6 voix contre 3), la Cour a jugé que les enfants nés
  aux États-Unis de parents en situation irrégulière ou temporaire relèvent de
  la juridiction des États-Unis et sont citoyens à la naissance en vertu du
  quatorzième amendement, invalidant le décret 14160
  [trump-v-barbara-2026][scotus-opinions-portal]; et dans Watson v. Republican
  National Committee (rendu le 29 juin 2026, 5 voix contre 4), la Cour a jugé
  que les lois fédérales sur le jour du scrutin n'empêchent pas les États de
  compter les bulletins par correspondance oblitérés le jour du scrutin mais
  reçus après [watson-v-rnc-2026][scotus-opinions-portal]. Cette redistribution
  de 2026 fait suite à Trump v. United States (2024) sur l'immunité
  présidentielle, Trump v. CASA (2025) sur les injonctions nationales, Loper
  Bright (2024) mettant fin à la déférence Chevron, West Virginia v. EPA (2022)
  et Shelby County v. Holder (2013)
  [trump-v-usa-2024][trump-v-casa-2025][loper-bright-2024][wv-v-epa-2022][shelby-county-2013].
  Les règlements administratifs mettant en œuvre cet ordre sont publiés au
  Federal Register [federal-register], et une analyse non partisane est
  disponible auprès du Congressional Research Service [crs-congress-gov].
political_stateStructure_en: >-
  The United States is a federal republic of 50 states plus the federal District
  of Columbia and five inhabited unincorporated territories
  [constitution-usa-1787]. Powers not delegated to the federal government are
  reserved to the states under the Tenth Amendment, so states maintain their own
  constitutions, legislatures, courts and codes operating concurrently with
  federal law [constitution-usa-1787][reconstruction-amendments]. Asymmetries
  are pronounced: the five inhabited territories (Puerto Rico, Guam, United
  States Virgin Islands, Northern Mariana Islands, American Samoa) have no
  presidential vote and no voting representation in Congress, and federally
  recognised tribes exercise inherent sovereignty over Indian country
  [usc-title25][insular-cases-1901].
political_stateStructure_fr: >-
  Les États-Unis sont une république fédérale de 50 États, plus le district
  fédéral de Columbia et cinq territoires non incorporés habités
  [constitution-usa-1787]. Les pouvoirs non délégués au gouvernement fédéral
  sont réservés aux États par le dixième amendement, de sorte que les États
  conservent leurs propres constitutions, législatures, tribunaux et codes,
  coexistant avec le droit fédéral
  [constitution-usa-1787][reconstruction-amendments]. Les asymétries sont
  marquées : les cinq territoires habités (Porto Rico, Guam, îles Vierges
  américaines, îles Mariannes du Nord, Samoa américaines) n'ont ni vote
  présidentiel ni représentation votante au Congrès, et les tribus reconnues au
  niveau fédéral exercent une souveraineté inhérente sur les terres indiennes
  [usc-title25][insular-cases-1901].
capacity_inheritedTerrain_en: >-
  The state works against a continental-scale, resource-rich but internally
  distant terrain and a large, ageing, immigration-built population whose growth
  has just slowed sharply [territory.geography][society.demographics]. It
  inherits an extensive energy and mineral endowment paired with deep import
  dependence on critical minerals [territory.minerals][territory.metabolism],
  the world's largest and most diversified services economy
  [economy.realEconomy], and a fiscal base carrying historically high public
  debt [economy.publicFinances]. This inherited capacity is distributed by
  history, geography and scale — never earned or deserved — and forms the
  denominator for every performance claim below.
capacity_inheritedTerrain_fr: >-
  L'État agit sur un terrain à l'échelle continentale, riche en ressources mais
  aux distances internes considérables, et sur une population nombreuse,
  vieillissante et bâtie par l'immigration, dont la croissance vient de ralentir
  fortement [territory.geography][society.demographics]. Il hérite d'une vaste
  dotation énergétique et minérale associée à une forte dépendance aux
  importations de minéraux critiques [territory.minerals][territory.metabolism],
  de la plus grande et de la plus diversifiée des économies de services au monde
  [economy.realEconomy], et d'une base budgétaire portant une dette publique
  historiquement élevée [economy.publicFinances]. Cette capacité héritée est
  distribuée par l'histoire, la géographie et l'échelle — jamais méritée ni
  acquise — et constitue le dénominateur de toute affirmation de performance
  ci-dessous.
capacity_steering_en: >-
  The federal state retains formidable analytic and implementation capacity but
  its steering is degraded by fiscal gridlock and partisan volatility. The
  record shows repeated failure to prioritise among competing demands through
  the ordinary budget process: the FY2026 appropriations cycle produced the
  longest full-government shutdown on record (43 days, 1 October–12 November
  2025), a further lapse from 1 February 2026, and a Homeland Security funding
  lapse from 14 February 2026 that ran 76 days to 30 April 2026 — the longest
  shutdown of a single federal department on record — resolved only through
  consolidated and continuing appropriations
  [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations].
  Announced fiscal priorities (deficit reduction) diverge from implemented ones
  (the 2025 reconciliation act raised deficits by $4.7 trillion over 2026–2035)
  [obbba-hr1][cbo-budget-outlook-2026]. Where the executive has prioritised —
  homeland and hemispheric security — it has demonstrated rapid implementation,
  as in the January 2026 Venezuela operation
  [ndstrategy-2026][maduro-capture-wardept].
capacity_steering_fr: >-
  L'État fédéral conserve une formidable capacité d'analyse et de mise en œuvre,
  mais son pilotage est dégradé par le blocage budgétaire et la volatilité
  partisane. Le bilan montre un échec répété à hiérarchiser les demandes
  concurrentes par le processus budgétaire ordinaire : le cycle d'appropriations
  de l'exercice 2026 a produit la plus longue fermeture complète du gouvernement
  jamais enregistrée (43 jours, 1er octobre-12 novembre 2025), un nouveau
  blocage à compter du 1er février 2026 et un blocage du financement de la
  Sécurité intérieure à compter du 14 février 2026 qui a duré 76 jours, jusqu'au
  30 avril 2026 — la plus longue paralysie d'un seul ministère fédéral jamais
  enregistrée —, résolus seulement par des appropriations consolidées et
  provisoires
  [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations]. Les
  priorités budgétaires affichées (réduction du déficit) divergent de celles
  mises en œuvre (la loi de réconciliation de 2025 a accru les déficits de 4 700
  milliards de dollars sur 2026-2035) [obbba-hr1][cbo-budget-outlook-2026]. Là
  où l'exécutif a établi une priorité — sécurité du territoire et de
  l'hémisphère — il a démontré une mise en œuvre rapide, comme lors de
  l'opération au Venezuela de janvier 2026
  [ndstrategy-2026][maduro-capture-wardept].
capacity_approvals_en: >-
  The federal state can say yes or no to a major project, but the decision is
  slow and only partially measured. Across all federal agencies, the median time
  to complete an environmental impact statement under the National Environmental
  Policy Act — from notice of intent to final statement — was 2.8 years for
  statements finalized between January 2019 and December 2024, and 2.2 years for
  those issued in 2024, when about 41% were completed in two years or less
  against 24% in 2019; the figures come from the Council on Environmental
  Quality's January 2025 timeline update covering 1,903 statements finalized
  2010–2024, which puts the pre-reform 2010–2018 median at 3.2 years
  [ceq-eis-timelines-2010-2024]. The pre-reform record measured to the record of
  decision was slower still: a 4.5-year average across the 1,276 statements
  whose final version was published between 1 January 2010 and 31 December 2018,
  half taking longer than 3.5 years and one quarter more than 6.0 years
  [ceq-eis-timeline-factsheet-2020]. The delay sits upstream of the draft
  document: notice of intent to draft statement consumed on average 58.4% of
  elapsed time, draft to final 32.2%, and final to record of decision 9.4%
  [ceq-eis-timeline-factsheet-2020]. Documents ran well past the Council on
  Environmental Quality's own recommended limits of 150 pages, or 300 for
  proposals of unusual scope or complexity: across 761 actions with a final
  statement published between 1 January 2013 and 31 December 2018, draft
  statements averaged 575 pages, with appendices averaging a further 584 pages
  at draft stage and 1,042 at final [ceq-eis-timeline-factsheet-2020].
  Predictability is limited less by the statute than by the absence of a
  governmentwide record of its own operation: the Government Accountability
  Office found in April 2014 that data on the number and type of most reviews
  were not readily available and that agencies did not routinely track
  environmental assessments or categorical exclusions, with the Council on
  Environmental Quality estimating that about 95% of reviews are categorical
  exclusions, under 5% environmental assessments and under 1% environmental
  impact statements [gao-nepa-review-2014]. A published approvals regime exists:
  Title 41 of the Fixing America's Surface Transportation Act, enacted 4
  December 2015 and codified at 42 United States Code § 4370m, requires the lead
  federal agency for every covered project to post target completion dates for
  environmental review and authorization on the Permitting Dashboard, which
  tracks each project through a status field — planned, in progress, paused,
  complete, cancelled — across covered projects, transparency projects,
  Department of Transportation projects and others
  [permits-performance-gov-dashboard]. The full project and timeline dataset is
  downloadable by lead agency [permits-performance-gov-data-portal]. That status
  field is where the proposed-versus-consented-versus-built record becomes
  visible, and it is sectorally uneven: among covered projects listed on 19 July
  2026, several federal offshore wind projects carried paused or cancelled
  status while mining projects carried in-progress status
  [permits-performance-gov-dashboard]. The skew tracks policy — an executive
  order of 20 March 2025 on immediate measures to increase American mineral
  production directed the Permitting Council's executive director to publish
  designated mineral production projects on the dashboard as transparency
  projects [permits-performance-gov-dashboard].
capacity_approvals_fr: >-
  L'État fédéral sait dire oui ou non à un grand projet, mais la décision est
  lente et n'est mesurée qu'en partie. Toutes agences fédérales confondues, le
  délai médian d'achèvement d'une étude d'impact environnemental au titre de la
  loi nationale sur la politique environnementale (National Environmental Policy
  Act) — de l'avis d'intention à l'étude finale — s'établit à 2,8 ans pour les
  études finalisées entre janvier 2019 et décembre 2024, et à 2,2 ans pour
  celles publiées en 2024, année où environ 41 % ont été achevées en deux ans ou
  moins, contre 24 % en 2019; ces chiffres proviennent de la mise à jour de
  janvier 2025 du Council on Environmental Quality sur les délais, couvrant 1
  903 études finalisées de 2010 à 2024, qui situe la médiane pré-réforme
  2010-2018 à 3,2 ans [ceq-eis-timelines-2010-2024]. Le bilan pré-réforme mesuré
  jusqu'à la décision finale était plus lent encore : une moyenne de 4,5 ans sur
  les 1 276 études dont la version finale a été publiée entre le 1er janvier
  2010 et le 31 décembre 2018, la moitié dépassant 3,5 ans et un quart 6,0 ans
  [ceq-eis-timeline-factsheet-2020]. Le délai se loge en amont du projet de
  document : le passage de l'avis d'intention au projet d'étude a absorbé en
  moyenne 58,4 % du temps écoulé, celui du projet à la version finale 32,2 %, et
  celui de la version finale à la décision 9,4 %
  [ceq-eis-timeline-factsheet-2020]. Les documents dépassent largement les
  limites que le Council on Environmental Quality recommande lui-même — 150
  pages, ou 300 pour les projets d'ampleur ou de complexité inhabituelles : sur
  761 actions dont l'étude finale a été publiée entre le 1er janvier 2013 et le
  31 décembre 2018, les projets d'étude atteignaient en moyenne 575 pages,
  auxquelles s'ajoutaient des annexes de 584 pages en moyenne au stade du projet
  et de 1 042 pages au stade final [ceq-eis-timeline-factsheet-2020]. La
  prévisibilité tient moins à la loi qu'à l'absence de relevé pangouvernemental
  de son propre fonctionnement : le Government Accountability Office a constaté
  en avril 2014 que les données sur le nombre et le type de la plupart des
  examens n'étaient pas aisément disponibles et que les agences ne recensaient
  pas systématiquement les évaluations environnementales ni les exclusions
  catégorielles, le Council on Environmental Quality estimant qu'environ 95 %
  des examens sont des exclusions catégorielles, moins de 5 % des évaluations
  environnementales et moins de 1 % des études d'impact [gao-nepa-review-2014].
  Un régime d'autorisation publié existe : le titre 41 de la loi Fixing
  America's Surface Transportation Act, promulgué le 4 décembre 2015 et codifié
  au titre 42 du United States Code, § 4370m, impose à l'agence fédérale chef de
  file de tout projet couvert d'afficher les dates cibles d'achèvement de
  l'examen environnemental et de l'autorisation sur le Permitting Dashboard,
  lequel suit chaque projet par un champ d'état — planifié, en cours, suspendu,
  achevé, annulé — pour les projets couverts, les projets de transparence, ceux
  du département des Transports et les autres
  [permits-performance-gov-dashboard]. L'ensemble des données de projets et
  d'échéanciers est téléchargeable par agence chef de file
  [permits-performance-gov-data-portal]. C'est dans ce champ d'état qu'apparaît
  le bilan proposé-consenti-construit, et il est sectoriellement inégal : parmi
  les projets couverts répertoriés le 19 juillet 2026, plusieurs projets éoliens
  en mer fédéraux portaient l'état suspendu ou annulé tandis que des projets
  miniers portaient l'état en cours [permits-performance-gov-dashboard]. Ce
  déséquilibre suit la politique menée — un décret du 20 mars 2025 sur les
  mesures immédiates d'augmentation de la production minérale américaine a
  enjoint au directeur exécutif du Permitting Council de publier sur le tableau
  de bord, à titre de projets de transparence, des projets de production
  minérale désignés [permits-performance-gov-dashboard].
capacity_delivery_en: >-
  The American Society of Civil Engineers graded United States infrastructure a
  C overall in its 2025 quadrennial assessment of 18 categories — the first C in
  the series, up from C- in 2021 and D+ in 2017 — and estimates that $9.1
  trillion is needed across those categories to reach a state of good repair,
  against $5.4 trillion in forecast public and private investment over
  2024–2033, leaving a $3.7 trillion gap; the Society is a professional
  engineering body with a known advocacy orientation toward higher
  infrastructure spending [asce-infrastructure-report-card-2025]. On execution
  rather than condition, the Government Accountability Office reports that the
  federal government has great difficulty controlling costs in its procurement
  portfolio of more than $750 billion, with major acquisitions at the
  Departments of Defense, Energy and Veterans Affairs and the National
  Aeronautics and Space Administration experiencing cost growth, schedule delays
  or both [gao-high-risk-cost-schedule-2025]. Three areas regressed between the
  2023 and 2025 assessments — Department of Defense weapon systems acquisition,
  information-technology acquisition and management, and management of federal
  real property [gao-high-risk-list][gao-high-risk-cost-schedule-2025]. The
  federal real-property estate comprises 277,000 buildings whose annual
  maintenance and operating costs exceeded $10.3 billion in fiscal year 2023,
  while reported deferred maintenance and repairs rose from $170 billion in 2017
  to $370 billion in 2024 [gao-high-risk-cost-schedule-2025]. Two projects
  illustrate the schedule record: the Veterans Affairs electronic health record
  modernisation, estimated in 2022 at $49.8 billion in life-cycle costs ($32.7
  billion for 13 years of implementation and $17.1 billion for 15 years of
  sustainment), had been deployed to six locations as of December 2024 with more
  than 160 remaining [gao-high-risk-cost-schedule-2025]; and a 2023 operational
  risk assessment found 51 of the Federal Aviation Administration's 138 air
  traffic control systems (37%) unsustainable and a further 54 (39%) potentially
  unsustainable [gao-high-risk-cost-schedule-2025]. Delivery of disaster
  recovery was added to the high-risk list as a new area in 2025, with federal
  disaster assistance fragmented across more than 30 entities; appropriations
  for disaster assistance totalled at least $448 billion over fiscal years
  2015–2024, plus $110 billion in supplemental appropriations in December 2024
  [gao-high-risk-list][gao-high-risk-cost-schedule-2025].
capacity_delivery_fr: >-
  L'American Society of Civil Engineers a attribué la note globale C aux
  infrastructures américaines dans son évaluation quadriennale de 2025 portant
  sur 18 catégories — la première note C de la série, contre C- en 2021 et D+ en
  2017 — et estime à 9 100 milliards de dollars les besoins d'investissement
  pour atteindre un bon état d'entretien, face à 5 400 milliards
  d'investissements publics et privés prévus sur 2024-2033, soit un écart de 3
  700 milliards; cette société savante d'ingénieurs a une orientation de
  plaidoyer connue en faveur d'investissements accrus
  [asce-infrastructure-report-card-2025]. Du côté de l'exécution plutôt que de
  l'état, le Government Accountability Office signale que le gouvernement
  fédéral peine fortement à maîtriser les coûts de son portefeuille d'achats de
  plus de 750 milliards de dollars, les grands programmes des départements de la
  Défense, de l'Énergie et des Anciens Combattants ainsi que de la National
  Aeronautics and Space Administration connaissant des dépassements de coûts,
  des retards ou les deux [gao-high-risk-cost-schedule-2025]. Trois domaines ont
  régressé entre les évaluations de 2023 et de 2025 : l'acquisition des systèmes
  d'armes du département de la Défense, l'acquisition et la gestion des
  technologies de l'information, et la gestion du patrimoine immobilier fédéral
  [gao-high-risk-list][gao-high-risk-cost-schedule-2025]. Ce patrimoine
  immobilier fédéral compte 277 000 bâtiments dont les coûts annuels d'entretien
  et d'exploitation ont dépassé 10,3 milliards de dollars lors de l'exercice
  2023, tandis que l'entretien et les réparations différés déclarés sont passés
  de 170 milliards en 2017 à 370 milliards en 2024
  [gao-high-risk-cost-schedule-2025]. Deux projets illustrent la tenue des
  échéanciers : la modernisation du dossier de santé électronique des Anciens
  Combattants, dont le coût sur le cycle de vie était estimé en 2022 à 49,8
  milliards de dollars (32,7 milliards pour 13 ans de déploiement et 17,1
  milliards pour 15 ans de maintien en condition), n'avait été déployée que sur
  six sites en décembre 2024, plus de 160 restant à couvrir
  [gao-high-risk-cost-schedule-2025]; et une évaluation des risques
  opérationnels de 2023 a conclu que 51 des 138 systèmes de contrôle aérien de
  la Federal Aviation Administration (37 %) n'étaient pas soutenables, 54 autres
  (39 %) étant potentiellement non soutenables
  [gao-high-risk-cost-schedule-2025]. La prestation de l'aide au relèvement
  après catastrophe a été ajoutée à la liste à haut risque comme nouveau domaine
  en 2025, l'aide fédérale étant fragmentée entre plus de 30 entités; les
  crédits d'aide aux sinistrés ont totalisé au moins 448 milliards de dollars
  sur les exercices 2015-2024, auxquels s'ajoutent 110 milliards de crédits
  supplémentaires en décembre 2024
  [gao-high-risk-list][gao-high-risk-cost-schedule-2025].
capacity_publicServices_en: >-
  The Government Accountability Office's February 2025 high-risk list contains
  38 areas, of which a substantial block covers continuous public-service
  systems: Veterans Affairs health care, Medicare and improper payments,
  Medicaid programme integrity, oversight of medical products, leadership and
  coordination of public health emergencies, and federal programmes serving
  tribes and their members [gao-high-risk-list]. Twenty of the 38 areas are on
  the list in part because of skills gaps or inadequate staffing
  [gao-high-risk-cost-schedule-2025]. Programme-integrity losses are large and
  persistent: federal agencies have reported about $2.8 trillion in estimated
  improper payments since 2003, including more than $150 billion government-wide
  in each of the last seven years, and high-risk-list programmes — Medicare and
  Medicaid among the fastest-growing — accounted for about 80% of the
  government-wide improper-payment estimate for fiscal year 2023
  [gao-high-risk-cost-schedule-2025]. Inspection capacity is a binding
  constraint in food and drug oversight: the Food and Drug Administration
  conducted an average of 917 foreign food safety inspections a year over fiscal
  years 2018–2023, about 5% of its 19,200 annual target
  [gao-high-risk-cost-schedule-2025]. In education, 53% of public schools
  reported being understaffed entering the 2022–23 school year, among them 65%
  in special education and 45% in general elementary teaching, and 44% reported
  at least one vacant teaching position in October 2022 after the year had
  started [nces-condition-of-education]. The share of public schools hiring for
  at least one open teaching position rose from 66% in 2011–12 to 80% in
  2020–21, and difficulty filling those positions rose across all twelve
  reported subject fields — in special education, from 17% of hiring schools in
  2011–12 to 40% in 2020–21 [nces-condition-of-education]. The supply pipeline
  contracted over the same period: completions of teacher preparation programmes
  fell 20%, from 189,200 in 2012–13 to 151,100 in 2019–20, with
  traditional-route completions down 28% and the alternative-route share of
  completers rising from 15% to 23% [nces-condition-of-education]. Staffing
  difficulty is distributed unevenly by place and poverty: among public schools
  hiring in mathematics in 2020–21, 24% of low-poverty schools reported
  difficulty filling the position against 31%–34% of higher-poverty schools, and
  27% of suburban schools against 35% of rural schools and 41% of schools in
  towns [nces-condition-of-education].
capacity_publicServices_fr: >-
  La liste à haut risque du Government Accountability Office de février 2025
  comprend 38 domaines, dont un bloc important porte sur des systèmes de
  services publics à prestation continue : les soins de santé des Anciens
  Combattants, Medicare et les paiements indus, l'intégrité du programme
  Medicaid, la surveillance des produits médicaux, le pilotage et la
  coordination des urgences de santé publique, et les programmes fédéraux
  destinés aux tribus et à leurs membres [gao-high-risk-list]. Vingt des 38
  domaines figurent sur la liste en partie en raison de déficits de compétences
  ou d'effectifs insuffisants [gao-high-risk-cost-schedule-2025]. Les pertes
  liées à l'intégrité des programmes sont massives et persistantes : les agences
  fédérales ont déclaré environ 2 800 milliards de dollars de paiements indus
  estimés depuis 2003, dont plus de 150 milliards à l'échelle du gouvernement
  chaque année depuis sept ans, les programmes inscrits à la liste à haut
  risque — Medicare et Medicaid comptant parmi ceux dont la croissance est la
  plus rapide — représentant environ 80 % de l'estimation gouvernementale pour
  l'exercice 2023 [gao-high-risk-cost-schedule-2025]. La capacité d'inspection
  constitue une contrainte déterminante en matière de surveillance alimentaire
  et pharmaceutique : la Food and Drug Administration a mené en moyenne 917
  inspections alimentaires à l'étranger par an sur les exercices 2018-2023, soit
  environ 5 % de sa cible annuelle de 19 200 [gao-high-risk-cost-schedule-2025].
  Dans l'éducation, 53 % des écoles publiques déclaraient manquer de personnel à
  l'entrée de l'année scolaire 2022-2023, dont 65 % en éducation spécialisée et
  45 % en enseignement primaire général, et 44 % faisaient état d'au moins un
  poste d'enseignant vacant en octobre 2022, l'année déjà commencée
  [nces-condition-of-education]. La part des écoles publiques recrutant pour au
  moins un poste vacant est passée de 66 % en 2011-2012 à 80 % en 2020-2021, et
  les difficultés de recrutement se sont accrues dans les douze disciplines
  recensées — en éducation spécialisée, de 17 % des écoles recruteuses en
  2011-2012 à 40 % en 2020-2021 [nces-condition-of-education]. Le vivier s'est
  contracté sur la même période : les diplômés des programmes de formation à
  l'enseignement ont reculé de 20 %, de 189 200 en 2012-2013 à 151 100 en
  2019-2020, la filière traditionnelle chutant de 28 % et la part des filières
  alternatives parmi les diplômés passant de 15 % à 23 %
  [nces-condition-of-education]. Les difficultés de dotation se répartissent
  inégalement selon le territoire et la pauvreté : parmi les écoles publiques
  recrutant en mathématiques en 2020-2021, 24 % des écoles à faible taux de
  pauvreté signalaient des difficultés de recrutement contre 31 % à 34 % des
  écoles à taux plus élevé, et 27 % des écoles de banlieue contre 35 % des
  écoles rurales et 41 % des écoles de petites villes
  [nces-condition-of-education].
capacity_productivity_en: >-
  US productivity growth is being supported by generative AI, which the
  Congressional Budget Office incorporates as adding about 10 basis points per
  year to average productivity growth, raising nonfarm business-sector output by
  about 1% by 2036 [cbo-budget-outlook-2026]. Real business fixed investment
  grows 3.9% in 2026, driven by AI and the 2025 reconciliation act's investment
  incentives [cbo-budget-outlook-2026]. On internal barriers to the movement of
  goods, labour and capital between the 50 states, the approved Pass A source
  list contains no usable source measuring current interstate barriers.
capacity_productivity_fr: >-
  La croissance de la productivité américaine est soutenue par l'IA générative,
  que le Congressional Budget Office intègre comme ajoutant environ 10 points de
  base par an à la croissance moyenne de la productivité, relevant la production
  du secteur des entreprises non agricoles d'environ 1 % d'ici 2036
  [cbo-budget-outlook-2026]. L'investissement fixe réel des entreprises croît de
  3,9 % en 2026, tiré par l'IA et les incitations à l'investissement de la loi
  de réconciliation de 2025 [cbo-budget-outlook-2026]. Concernant les barrières
  internes à la circulation des biens, de la main-d'œuvre et du capital entre
  les 50 États, la liste de sources approuvée de la phase A ne contient aucune
  source utilisable mesurant les barrières interétatiques actuelles.
capacity_knownAndUnbuilt_en: |-
