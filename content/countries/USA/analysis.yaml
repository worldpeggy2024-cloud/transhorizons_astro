      "rationale_en": "Unified Republican control of the presidency and both chambers holds and the report records intra-bloc cohesion as high; the constraints that bit in 2026 — a struck-down tariff program, a five-seat House of Representatives margin — came from the courts and from arithmetic, not from defection inside the bloc.",
      "rationale_fr": "Le contrôle républicain unifié de la présidence et des deux chambres tient et le rapport qualifie de forte la cohésion au sein du bloc au pouvoir; les contraintes qui ont mordu en 2026 — programme tarifaire annulé, majorité de cinq sièges à la Chambre des représentants — viennent des tribunaux et de l'arithmétique, non d'une défection interne."
