      "kind": "exécutif fédéral",
      "liveActorStatus": "current",
      "currentPosition": "L'exécutif est détenu par le président Donald Trump, républicain investi en janvier 2025, gouvernant avec un contrôle partisan unifié tandis que la jurisprudence de la Cour suprême de 2026 étend le contrôle présidentiel sur l'exécutif; l'administration a annulé les cibles de la Contribution déterminée au niveau national antérieure, priorisé la sécurité du territoire et de l'hémisphère, affirmé un « corollaire Trump » à la doctrine Monroe et déclaré terminé le cessez-le-feu avec l'Iran le 8 juillet 2026.",
