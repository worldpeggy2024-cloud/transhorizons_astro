      "rationale_fr": "Le contrôle civil est à la fois statutaire et démontré (aucun épisode de la période n'a vu des forces refuser des ordres légaux, et l'exécutif a démobilisé à Portland, Los Angeles et Chicago dès que les tribunaux ont tranché contre lui) avec une tension réelle, nommée et circonscrite : la question de savoir quelle autorité civile peut commander les unités fédéralisées de la Garde nationale était véritablement ouverte et a été tranchée par la cour suprême malgré l'opposition de trois gouverneurs, non réglée politiquement."
