      "rationale_en": "One party holds the presidency and both chambers, transitions are routine and uncontested and no faction contests the system itself, but the bloc shows real factional strain in operation — four discharge petitions crossed the 218-signature threshold in one session against two in the whole previous Congress, funding lapsed three times in eight months, and contests over the removal power and over command of federalised Guard units were settled by courts rather than inside the bloc; that is strain within a system nobody is trying to break, which resolves to Med rather than the Med-High reserved for a single contained strain.",
      "rationale_fr": "Un seul parti détient la présidence et les deux chambres, les transitions sont ordinaires et incontestées et aucune faction ne conteste le système lui-même, mais le bloc au pouvoir montre de véritables tensions factionnelles à l'usage : quatre pétitions de dessaisissement ont franchi le seuil des 218 signatures en une seule session, contre deux pour tout le Congrès précédent, le financement de l'État a fait défaut trois fois en huit mois, et les conflits sur le pouvoir de révocation et sur le commandement des unités de la Garde fédéralisées ont été tranchés par les tribunaux plutôt qu'au sein du bloc; il s'agit de tensions à l'intérieur d'un système que personne ne cherche à briser, ce qui situe l'axe à Med plutôt qu'au Med-High réservé à une tension unique et circonscrite."
    },
