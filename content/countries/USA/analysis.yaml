      "kind": "législature",
      "liveActorStatus": "current",
      "currentPosition": "Les deux chambres sont sous contrôle républicain — Sénat 53 contre 45 plus 2 indépendants, Chambre 217 contre 212 avec 1 indépendant et 5 sièges vacants — et le Congrès détient le pouvoir législatif, confirme les juges fédéraux, exerce l'autorité plénière sur les territoires et les terres indiennes, a produit les deux plus longues paralysies jamais enregistrées lors du cycle d'appropriations de l'exercice 2026, et doit agir avant le 24 juillet 2026 pour que la surtaxe tarifaire de la Section 122 se poursuive.",
