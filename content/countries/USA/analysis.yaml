      ],
      "rationale_en": "Armed forces and federal law enforcement answer to civilian command through the President as commander-in-chief, the state holds its monopoly on force across the whole territory, and the Venezuela raid and the Iran campaign were executed on order; control is concentrated in the executive, and the immigration and border agencies now draw reconciliation money rather than annual appropriations.",
      "rationale_fr": "Les forces armées et les forces fédérales de maintien de l'ordre relèvent du commandement civil via le président, chef des armées, l'État conserve le monopole de la force sur l'ensemble du territoire, et le raid au Venezuela comme la campagne contre l'Iran ont été exécutés sur ordre; le contrôle est concentré dans l'exécutif, et les agences d'immigration et des frontières sont désormais financées par la réconciliation budgétaire plutôt que par les crédits annuels."
