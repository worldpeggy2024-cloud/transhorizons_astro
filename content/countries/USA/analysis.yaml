      "rationale_en": "Interpersonal trust fell from 46% in 1972 to 34% by the 2020s across every political grouping and stands at 35% among those born in the 2000s against 77% among those born before 1960, trust in the federal government is near its lowest in about seventy years and sorts by party, and firearms were present at more than double the number of demonstrations — clearly on the weak side of the global range, held above Low by one real functioning element: the cleavages are cross-cutting rather than communal, and about 97% of a record volume of demonstrations passed without violence or police intervention.",
      "rationale_fr": "La confiance interpersonnelle est passée de 46 % en 1972 à 34 % dans les années 2020 dans tous les groupes politiques et s'établit à 35 % chez les personnes nées dans les années 2000 contre 77 % chez celles nées avant 1960. La confiance envers le gouvernement fédéral avoisine son plus bas niveau en quelque soixante-dix ans et se répartit selon l'appartenance partisane, et des armes à feu étaient présentes à plus du double de manifestations — nettement du côté faible de l'échelle mondiale, maintenu au-dessus de Low par un élément réellement fonctionnel : les clivages se recoupent au lieu de se superposer et environ 97 % d'un volume record de manifestations se sont déroulées sans violence ni intervention policière."
