        "gap": "Reaching a state of good repair across the eighteen infrastructure categories graded in 2025 requires $9.1 trillion, against $5.4 trillion of forecast public and private investment over 2024–2033, leaving a $3.7 trillion shortfall; the grading body is a professional engineering society with a known advocacy orientation toward higher infrastructure spending.",
