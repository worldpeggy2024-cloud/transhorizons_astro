political_powerStructure_en: >-
  The President controls foreign policy, defense, and nuclear weapons [1]. The
  PM manages domestic policy but depends on parliamentary confidence [1].
  Macron's inner circle has narrowed — he has deliberately blocked the emergence
  of a successor figure [2]. The security services (DGSE, DGSI) report to the
  executive and remain loyal [8]. The judiciary is independent but under
  political pressure — the conviction of Marine Le Pen for EU Parliament fund
  misuse in 2024 was upheld, potentially barring her from the 2027 race [6]. The
  Constitutional Council and Council of State remain functional checks [1].
  Media is pluralistic but concentrated: Bolloré group (CNews, Europe 1, JDD)
  leans right; public broadcasters (France Télévisions, Radio France) maintain
  editorial independence under pressure [10].
political_powerStructure_fr: >-
  Le Président contrôle la politique étrangère, la défense et l'arme nucléaire
  [1]. Le PM gère la politique intérieure mais dépend de la confiance
  parlementaire [1]. Le cercle rapproché de Macron s'est rétréci — il a
  délibérément bloqué l'émergence d'un successeur [2]. Les services de sécurité
  (DGSE, DGSI) rendent compte à l'exécutif et restent loyaux [8]. Le pouvoir
  judiciaire est indépendant mais sous pression politique — la condamnation de
  Marine Le Pen pour détournement de fonds du Parlement européen en 2024 a été
  confirmée, pouvant potentiellement l'empêcher de se présenter en 2027 [6]. Le
  Conseil constitutionnel et le Conseil d'État restent des contre-pouvoirs
  fonctionnels [1]. Les médias sont pluralistes mais concentrés : le groupe
  Bolloré (CNews, Europe 1, JDD) penche à droite; les diffuseurs publics
  (France Télévisions, Radio France) maintiennent leur indépendance éditoriale
  sous pression [10].
political_stabilityDrivers_en: >-
  Legitimacy rests on democratic elections [1] and the welfare state's
  performance — when purchasing power erodes, legitimacy drops fast (as seen in
  the Gilets Jaunes crisis of 2018-19) [11]. The armed forces and police are
  loyal to the constitutional order, not to any political faction [8]. The
  ruling centrist coalition is held together by the absence of alternatives
  rather than genuine cohesion — Renaissance, Horizons (Philippe), and Modem
  (Bayrou) are already positioning for 2027 as rivals [2]. The opposition is
  divided: the National Rally is electorally dominant on the right but
  judicially constrained [6]; the left is split between a moderate Socialist
  party rebuilding locally and LFI (Mélenchon), whose maximalist style alienates
  potential allies [2]. Institutional strength is real but strained — the Fifth
  Republic's constitutional architecture concentrates power in ways that amplify
  executive weakness when the president lacks a majority [1].
political_stabilityDrivers_fr: >-
  La légitimité repose sur les élections démocratiques [1] et la performance de
  l'État-providence — quand le pouvoir d'achat s'érode, la légitimité chute
  rapidement (comme lors de la crise des Gilets Jaunes en 2018-19) [11]. Les
  forces armées et la police sont loyales à l'ordre constitutionnel, pas à une
  faction politique [8]. La coalition centriste au pouvoir tient par l'absence
  d'alternatives plutôt que par une cohésion réelle — Renaissance, Horizons
  (Philippe) et Modem (Bayrou) se positionnent déjà comme rivaux pour 2027 [2].
  L'opposition est divisée : le RN domine électoralement à droite mais est
  contraint judiciairement [6]; la gauche est scindée entre un PS modéré en
  reconstruction locale et LFI (Mélenchon), dont le style maximaliste repousse
  les alliés potentiels [2]. La force institutionnelle est réelle mais tendue —
  l'architecture constitutionnelle de la Ve République concentre le pouvoir
  d'une manière qui amplifie la faiblesse exécutive quand le président n'a pas
  de majorité [1].
political_shockAbsorbers_en: >-
  Absorbers: Deep capital markets and AAA-adjacent sovereign credit (rated AA-
  by S&P) [3]. Banque de France as part of the Eurosystem [3]. Extensive social
  safety nets (unemployment insurance, healthcare, pensions) [3]. Nuclear energy
  base providing electricity independence [4]. Strong civil service continuity
  [1]. Accelerants: Inflation spikes from oil prices eroding purchasing power
  [5]. Contested 2027 presidential election with potential for street
  mobilization [2]. Deficit trajectory that could trigger EU fiscal rules
  enforcement or bond market repricing [3]. Elite fragmentation as Macron's
  coalition dissolves ahead of succession [2]. Growing cultural polarization
  around immigration, Islam, and national identity [10].
political_shockAbsorbers_fr: >-
  Amortisseurs : Marchés de capitaux profonds et crédit souverain proche du AAA
  (noté AA- par S&P) [3]. Banque de France au sein de l'Eurosystème [3]. Filets
  de sécurité sociale étendus (assurance chômage, santé, retraites) [3]. Base
  nucléaire assurant l'indépendance électrique [4]. Forte continuité de la
  fonction publique [1]. Accélérateurs : Pics d'inflation liés aux prix du
  pétrole érodant le pouvoir d'achat [5]. Élection présidentielle 2027 contestée
  avec potentiel de mobilisation de rue [2]. Trajectoire du déficit pouvant
  déclencher l'application des règles budgétaires européennes ou une
  réévaluation des marchés obligataires [3]. Fragmentation des élites à mesure
  que la coalition de Macron se dissout avant la succession [2]. Polarisation
  culturelle croissante autour de l'immigration, de l'islam et de l'identité
  nationale [10].
economy_macroReality_en: >-
  GDP growth is forecast below 1% for 2025-2026 (IMF) [3]. The 2025 public
  deficit came in at 5.1% of GDP — better than the 5.4% target but still well
  above the EU's 3% ceiling [3]. Public debt reached a record €3,460.5 billion
  (115.6% of GDP) at end-2025 [3]. Tax receipts grew faster than expected in
  2025, and spending growth slowed, providing some fiscal relief [3]. However,
  inflation is set to rise sharply in spring 2026 as soaring oil prices linked
  to the Iran conflict feed through to energy and transport costs [5]. The
  Banque de France governor has warned that budget constraints severely limit
  any fiscal response to the energy crisis [3]. The government has rejected tax
  cuts, saying they would worsen the deficit [3]. The 2026 budget was adopted
  after prolonged political crisis, but further consolidation will be
  politically painful [2].
economy_macroReality_fr: >-
  La croissance du PIB est prévue sous 1 % pour 2025-2026 (FMI) [3]. Le déficit
  public 2025 s'est établi à 5,1 % du PIB — mieux que l'objectif de 5,4 % mais
  toujours bien au-dessus du plafond de 3 % de l'UE [3]. La dette publique a
  atteint un record de 3 460,5 milliards d'euros (115,6 % du PIB) fin 2025 [3].
  Les recettes fiscales ont augmenté plus rapidement que prévu en 2025, et la
  croissance des dépenses a ralenti, fournissant un allègement budgétaire [3].
  Cependant, l'inflation devrait augmenter fortement au printemps 2026 à mesure
  que les prix du pétrole en hausse liés au conflit iranien se répercutent sur
  les coûts énergétiques et de transport [5]. Le gouverneur de la Banque de
  France a averti que les contraintes budgétaires limitent gravement toute
  réponse budgétaire à la crise énergétique [3]. Le gouvernement a rejeté les
  réductions d'impôts, affirmant qu'elles aggraveraient le déficit [3]. Le
  budget 2026 a été adopté après une crise politique prolongée, mais une
  consolidation supplémentaire sera politiquement douloureuse [2].
economy_externalVulnerability_en: >-
  France runs a persistent current account deficit [3]. Exports are concentrated
  in aerospace (Airbus) [12], luxury goods (LVMH, Hermès), agriculture (wine,
  cereals), and defense equipment [4]. Import dependency is acute for
  hydrocarbons — the Iran-related oil crisis directly threatens the trade
  balance and consumer prices [5]. Public debt is largely held by international
  investors (~50% non-resident), making France sensitive to bond market
  sentiment [3]. There is no IMF program, but EU fiscal surveillance under the
  revised Stability and Growth Pact creates external pressure to reduce the
  deficit to 3% by 2029 [3]. Exposure to global shipping disruptions (Strait of
  Hormuz) is significant given energy import dependency [5].
economy_externalVulnerability_fr: >-
  La France enregistre un déficit persistant du compte courant [3]. Les
  exportations sont concentrées dans l'aéronautique (Airbus) [12], les biens de
  luxe (LVMH, Hermès), l'agriculture (vin, céréales) et l'équipement de défense
  [4]. La dépendance aux importations est aiguë pour les hydrocarbures — la
  crise pétrolière liée à l'Iran menace directement la balance commerciale et
  les prix à la consommation [5]. La dette publique est largement détenue par
  des investisseurs internationaux (~50 % non-résidents), rendant la France
  sensible aux sentiments des marchés obligataires [3]. Il n'y a pas de
  programme du FMI, mais la surveillance budgétaire de l'UE en vertu du Pacte de
  stabilité et de croissance révisé crée une pression externe pour réduire le
  déficit à 3 % d'ici 2029 [3]. L'exposition aux perturbations du transport
  maritime mondial (détroit d'Ormuz) est importante compte tenu de la dépendance
  aux importations énergétiques [5].
economy_politicalEconomy_en: >-
  The economic model benefits the metropolitan professional class, the
  luxury/tech sectors, and large exporters [3]. Rural and peri-urban France —
  the "France périphérique" — bears the brunt of deindustrialization, rising
  energy costs, and reduced public services [11]. This geographic divide maps
  directly onto the political divide: RN strength is concentrated in small towns
  and rural areas [2]. Reforms that are technically needed (pension age, public
  spending reduction, labor market flexibility) are politically explosive — the
  2023 pension reform triggered months of strikes and protests despite
  eventually passing [11]. The social contract rests on subsidized energy,
  generous pensions, and universal healthcare — all under fiscal pressure [3].
  Any attempt to cut subsidies or raise retirement age further risks mass
  mobilization [11].
economy_politicalEconomy_fr: >-
  Le modèle économique bénéficie à la classe professionnelle métropolitaine, aux
  secteurs du luxe/tech et aux grands exportateurs [3]. La France rurale et
  périurbaine — la « France périphérique » — subit le poids de la
  désindustrialisation, de la hausse des coûts énergétiques et de la réduction
  des services publics [11]. Cette division géographique correspond directement
  à la division politique : la force du RN est concentrée dans les petites
  villes et les zones rurales [2]. Les réformes techniquement nécessaires (âge
  de la retraite, réduction des dépenses publiques, flexibilité du marché du
  travail) sont politiquement explosives — la réforme des retraites de 2023 a
  déclenché des mois de grèves et de protestations malgré son adoption finale
  [11]. Le contrat social repose sur l'énergie subventionnée, les retraites
  généreuses et l'assurance maladie universelle — tous sous pression budgétaire
  [3]. Toute tentative de réduire les subventions ou de relever davantage l'âge
  de la retraite risque de déclencher une mobilisation massive [11].
security_internal_en: >-
  France faces no active insurgency but maintains an elevated terrorism threat
  level (Vigipirate "enhanced security" posture) since the 2015 attacks [8]. The
  domestic intelligence service (DGSI) has disrupted multiple plots [8].
  Criminal networks operate primarily in overseas territories (Guadeloupe,
  Martinique, Mayotte) and in some banlieues, but do not threaten state
  stability [8]. Communal tensions around immigration and Islam periodically
  flare — the 2023 Nahel shooting triggered nationwide riots [11]. The police
  and gendarmerie are well-resourced but face morale issues and accusations of
  excessive force [8]. The military (Armée de Terre, Marine Nationale, Armée de
  l'Air) is the largest in the EU with ~205,000 active personnel and a fully
  independent nuclear deterrent (290+ warheads, with Macron announcing an
  increase in March 2026) [7].
security_internal_fr: >-
  La France ne fait face à aucune insurrection active mais maintient un niveau
  de menace terroriste élevé (posture « sécurité renforcée » de Vigipirate)
  depuis les attaques de 2015 [8]. Le service de renseignement intérieur (DGSI)
  a déjoué plusieurs complots [8]. Les réseaux criminels opèrent principalement
  dans les territoires d'outre-mer (Guadeloupe, Martinique, Mayotte) et dans
  certaines banlieues, mais ne menacent pas la stabilité de l'État [8]. Les
  tensions communautaires autour de l'immigration et de l'islam s'enflamment
  périodiquement — le meurtre de Nahel en 2023 a déclenché des émeutes
  nationales [11]. La police et la gendarmerie sont bien dotées en ressources
  mais font face à des problèmes de moral et à des accusations de recours
  excessif à la force [8]. L'armée (Armée de Terre, Marine Nationale, Armée de
  l'Air) est la plus importante de l'UE avec ~205 000 personnels actifs et une
  dissuasion nucléaire entièrement indépendante (290+ têtes nucléaires, Macron
  annonçant une augmentation en mars 2026) [7].
security_diplomacy_en: >-
  France is a founding EU member [1], UN Security Council permanent member (P5)
  [1], and NATO ally — but maintains a Gaullist tradition of strategic autonomy
  [7]. Macron's March 2026 "advanced deterrence" doctrine marks a historic
  shift: France will increase its nuclear arsenal and potentially allow European
  allies to host French nuclear-capable aircraft, creating a deterrence
  relationship distinct from NATO arrangements [7]. France has distanced itself
  from the US on the Iran conflict — refusing overflight rights for US military
  flights to Israel and pushing for an independent European coalition to secure
  the Strait of Hormuz [9]. Relations with the Trump administration are tense
  (Trump publicly criticized France in March 2026) [9]. France remains the key
  military partner for several African states (Sahel, Djibouti) despite the
  forced withdrawal from Mali, Burkina Faso, and Niger in 2022-2024 [9]. Red
  lines: territorial integrity (including overseas territories), nuclear
  sovereignty, EU institutional architecture, and the principle of strategic
  autonomy from the US [7].
security_diplomacy_fr: >-
  La France est un membre fondateur de l'UE [1], membre permanent du Conseil de
  sécurité de l'ONU (P5) [1], et allié de l'OTAN — mais maintient une tradition
  gaulliste d'autonomie stratégique [7]. La doctrine de « dissuasion avancée »
  de Macron en mars 2026 marque un tournant historique : la France augmentera
  son arsenal nucléaire et pourrait potentiellement permettre aux alliés
  européens d'accueillir des aéronefs nucléaires français, créant une relation
  de dissuasion distincte des arrangements de l'OTAN [7]. La France s'est
  distanciée des États-Unis sur le conflit iranien — refusant les droits de
  survol pour les vols militaires américains vers Israël et promouvant une
  coalition européenne indépendante pour sécuriser le détroit d'Ormuz [9]. Les
  relations avec l'administration Trump sont tendues (Trump a critiqué
  publiquement la France en mars 2026) [9]. La France reste le principal
  partenaire militaire de plusieurs États africains (Sahel, Djibouti) malgré le
  retrait forcé du Mali, du Burkina Faso et du Niger en 2022-2024 [9]. Lignes
  rouges : intégrité territoriale (y compris les territoires d'outre-mer),
  souveraineté nucléaire, architecture institutionnelle de l'UE, et le principe
  d'autonomie stratégique vis-à-vis des États-Unis [7].
