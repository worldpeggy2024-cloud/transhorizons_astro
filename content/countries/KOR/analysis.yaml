political_powerStructure_en: >-
  President Yoon Suk-yeol (conservative, 2023–2028) holds executive authority;
  Prime Minister appointed by President; Cabinet of ~20 ministers; Presidential
  Secretariat controls policy agenda [1] [2]. Yoon's authority derives from 2022
  election victory (48.6% of vote); conservative coalition includes People Power
  Party, minor conservative parties [2]. National Assembly (300 seats):
  Democratic Party 172, People Power Party 108, minor parties 20; opposition
  controls legislative agenda [2]. Constitutional Court (9 justices)
  independent; recent decisions on impeachment, electoral law demonstrate
  autonomy [21]. Supreme Court (Chief Justice appointed by President, confirmed
  by National Assembly) generally aligned with executive but maintains
  independence [21]. National Election Commission operates independently; 2024
  parliamentary elections conducted fairly; no evidence of electoral fraud [22].
  Media: public broadcaster (KBS, MBC) operates with editorial independence but
  faces political pressure; private media (Chosun Ilbo, JoongAng Ilbo, Dong-A
  Ilbo) lean conservative; progressive media (Hankyoreh, Kyunghyang Shinmun)
  lean left [23]. Digital media highly fragmented; social media (Naver, Kakao)
  dominant; no state censorship but government pressure on media coverage [23].
  Press freedom rated MEDIUM by Reporters Without Borders; concerns over
  political pressure and defamation suits [23].
political_powerStructure_fr: >-
  Le Président Yoon Suk-yeol (conservateur, 2023–2028) détient l'autorité
  exécutive; le Premier ministre est nommé par le Président; Cabinet d'environ
  20 ministres; le Secrétariat présidentiel contrôle l'agenda politique [1]
  [2]. L'autorité de Yoon découle de sa victoire électorale de 2022 (48,6 % des
  votes); la coalition conservatrice comprend le Parti du pouvoir populaire,
  les petits partis conservateurs [2]. Assemblée nationale (300 sièges) : Parti
  démocratique 172, Parti du pouvoir populaire 108, petits partis 20;
  l'opposition contrôle l'agenda législatif [2]. Cour constitutionnelle (9
  juges) indépendante; les décisions récentes sur l'impeachment, la loi
  électorale démontrent l'autonomie [21]. Cour suprême (le juge en chef est
  nommé par le Président, confirmé par l'Assemblée nationale) généralement
  alignée sur l'exécutif mais maintient l'indépendance [21]. Commission
  électorale nationale fonctionne indépendamment; les élections parlementaires
  de 2024 ont été menées équitablement; pas de preuve de fraude électorale
  [22]. Médias : radiodiffuseur public (KBS, MBC) fonctionne avec indépendance
  éditoriale mais fait face à des pressions politiques; médias privés (Chosun
  Ilbo, JoongAng Ilbo, Dong-A Ilbo) penchent conservateur; médias progressistes
  (Hankyoreh, Kyunghyang Shinmun) penchent à gauche [23]. Les médias numériques
  sont hautement fragmentés; les médias sociaux (Naver, Kakao) sont dominants;
  pas de censure d'État mais pression gouvernementale sur la couverture
  médiatique [23]. La liberté de la presse est évaluée comme MOYENNE par
  Reporters sans frontières; préoccupations concernant la pression politique et
  les poursuites en diffamation [23].
political_stabilityDrivers_en: >-
  Legitimacy rests on democratic elections and economic performance [1] [2].
  Economic growth averaging 2–3% annually; unemployment low (~3%); public
  services (healthcare, education) functional but under fiscal pressure [5] [6].
  Korean national identity strong; no significant separatist movements;
  unification sentiment declining, especially among younger generations [24].
  Regional divisions (Honam vs. Yeongnam) create political polarization; voting
  patterns highly regionalized [3]. Armed Forces loyalty: South Korean military
  (600,000 active personnel) demonstrates loyalty to civilian authority; no
  evidence of military factionalism or coup risk [15]. Police loyalty: National
  Police Agency responds to civilian authority; no evidence of security force
  capture [18]. Ruling coalition: People Power Party + minor conservative
  parties; insufficient for legislative majority; dependent on opposition
  cooperation for major legislation [2]. Business elites generally support
  conservative economic policies; chaebol leadership influential in policy
  formation [6]. Provincial governors (elected) exercise significant influence;
  federal-provincial coordination mechanisms functional [2].
political_stabilityDrivers_fr: >-
  La légitimité repose sur les élections démocratiques et la performance
  économique [1] [2]. La croissance économique moyenne de 2–3 % annuellement; le
  chômage faible (~3 %); les services publics (santé, éducation) fonctionnent
  mais sous pression fiscale [5] [6]. L'identité nationale coréenne est forte;
  pas de mouvements séparatistes importants; le sentiment d'unification
  décline, en particulier chez les jeunes générations [24]. Les divisions
  régionales (Honam vs. Yeongnam) créent une polarisation politique; les
  modèles de vote sont hautement régionalisés [3]. Loyauté des forces armées :
  l'armée sud-coréenne (600 000 personnels actifs) démontre la loyauté envers
  l'autorité civile; pas de preuve de factionnalisme militaire ou de risque de
  coup d'État [15]. Loyauté de la police : l'Agence nationale de police répond à
  l'autorité civile; pas de preuve de capture des forces de sécurité [18].
  Coalition au pouvoir : Parti du pouvoir populaire + petits partis
  conservateurs; insuffisant pour la majorité législative; dépendant de la
  coopération de l'opposition pour la législation majeure [2]. Les élites
  commerciales soutiennent généralement les politiques économiques
  conservatrices; la direction des chaebol est influente dans la formation des
  politiques [6]. Les gouverneurs provinciaux (élus) exercent une influence
  significative; les mécanismes de coordination fédérale-provinciale
  fonctionnent [2].
political_shockAbsorbers_en: >-
  Absorbers: Foreign exchange reserves substantial (~$430 billion); Bank of
  Korea credible and independent; inflation-targeting framework functional [14].
  Employment Insurance and National Pension System provide shock absorption;
  coverage extensive but sustainability concerns [7]. Fiscal buffers moderate;
  government debt-to-GDP ~50%; manageable but rising [14]. Elite consensus on
  democratic governance strong; no evidence of authoritarian reversion [1].
  Accelerants: Inflation spikes from energy price volatility could trigger
  subsidy demands and fiscal pressure [13]. Contested elections: 2028
  presidential election could produce unexpected result; succession struggle
  within ruling party creates uncertainty [2]. Corruption scandals: chaebol
  leadership faces periodic corruption allegations; any major scandal could
  undermine business confidence [25]. Elite splits: potential split within
  People Power Party over economic policy (chaebol reform vs. business-friendly
  policies) or North Korea strategy [2]. North Korea military escalation could
  trigger security crisis and economic disruption [9].
political_shockAbsorbers_fr: >-
  Amortisseurs : Les réserves de change sont substantielles (~430 milliards de
  dollars); la Banque de Corée est crédible et indépendante; le cadre de
  ciblage de l'inflation fonctionne [14]. L'assurance-emploi et le Système
  national de retraite fournissent une absorption des chocs; la couverture est
  étendue mais les préoccupations de durabilité [7]. Les tampons fiscaux sont
  modérés; la dette publique-PIB ~50 %; gérable mais en hausse [14]. Le
  consensus des élites sur la gouvernance démocratique est fort; pas de preuve
  de réversion autoritaire [1]. Accélérateurs : Les pics d'inflation dus à la
  volatilité des prix de l'énergie pourraient déclencher des demandes de
  subventions et une pression fiscale [13]. Élections contestées : l'élection
  présidentielle de 2028 pourrait produire un résultat inattendu; la lutte de
  succession au sein du parti au pouvoir crée de l'incertitude [2]. Scandales de
  corruption : la direction des chaebol fait face à des allégations de
  corruption périodiques; tout grand scandale pourrait saper la confiance des
  entreprises [25]. Divisions des élites : division potentielle au sein du Parti
  du pouvoir populaire sur la politique économique (réforme des chaebol vs.
  politiques favorables aux entreprises) ou la stratégie envers la Corée du Nord
  [2]. Escalade militaire de la Corée du Nord pourrait déclencher une crise de
  sécurité et une perturbation économique [9].
economy_macroReality_en: >-
  GDP growth forecast at 2–3% annually for 2026–2027; below historical average
  due to weak consumption and export volatility [5]. Manufacturing sector
  (semiconductors, automotive, petrochemicals) growing 1–2% annually; services
  sector growing 2–3% [5] [6]. Semiconductor sector critical: Samsung and SK
  Hynix represent ~15% of GDP; global chip oversupply threatens profitability
  [11]. Automotive sector stable; Hyundai and Kia expanding EV production;
  exports growing 2–3% [5]. Construction sector weak; real estate prices
  volatile; housing starts declining [7]. Fiscal consolidation underway;
  government deficit ~1–2% of GDP [14]. Government debt-to-GDP ~50%; manageable
  but rising; debt servicing costs increasing [14]. Domestic capital markets
  (bonds, deposits) primary financing source; no reliance on external borrowing;
  credit rating stable (AA-/Aa2) [14]. Government committed to fiscal
  discipline; spending restraint and revenue measures underway [14]. Food price
  inflation moderating from 2023–2024 peaks; supply chains normalized; no acute
  food security risk [26]. Oil and natural gas prices volatile; geopolitical
  risks (Middle East, Russia) create upside pressure; energy import costs rising
  [13]. Korean won weakness (vs. U.S. dollar) increases import costs; energy and
  commodity imports affected; pass-through to consumer prices moderate [27].
  Headline inflation currently ~2.8% (target: 2%); within Bank of Korea comfort
  zone; no acute inflation crisis [27].
economy_macroReality_fr: >-
  La croissance du PIB est prévue à 2–3 % annuellement pour 2026–2027; en
  dessous de la moyenne historique en raison de la faible consommation et de la
  volatilité des exportations [5]. Le secteur manufacturier (semi-conducteurs,
  automobile, pétrochimiques) croît de 1–2 % annuellement; le secteur des
  services croît de 2–3 % [5] [6]. Le secteur des semi-conducteurs est critique :
  Samsung et SK Hynix représentent ~15 % du PIB; la suroffre mondiale de puces
  menace la rentabilité [11]. Le secteur automobile est stable; Hyundai et Kia
  élargissent la production de véhicules électriques; les exportations
  croissent de 2–3 % [5]. Le secteur de la construction est faible; les prix de
  l'immobilier sont volatiles; les mises en chantier déclinent [7]. La
  consolidation fiscale est en cours; le déficit gouvernemental ~1–2 % du PIB
  [14]. La dette publique-PIB ~50 %; gérable mais en hausse; les coûts de
  service de la dette augmentent [14]. Les marchés de capitaux domestiques
  (obligations, dépôts) sont la source de financement principale; pas de
  dépendance aux emprunts externes; la notation de crédit est stable (AA-/Aa2)
  [14]. Le gouvernement s'engage à la discipline fiscale; la retenue des
  dépenses et les mesures de revenus sont en cours [14]. L'inflation des prix
  alimentaires se modère des pics de 2023–2024; les chaînes d'approvisionnement
  sont normalisées; pas de risque aigu de sécurité alimentaire [26]. Les prix
  du pétrole et du gaz naturel sont volatiles; les risques géopolitiques
  (Moyen-Orient, Russie) créent une pression à la hausse; les coûts
  d'importation d'énergie augmentent [13]. La faiblesse du won coréen (vs.
  dollar américain) augmente les coûts d'importation; les importations
  d'énergie et de matières premières sont affectées; le passage aux prix des
  consommateurs est modéré [27]. L'inflation globale actuelle ~2,8 % (cible : 2 %);
  dans la zone de confort de la Banque de Corée; pas de crise d'inflation
  aiguë [27].
economy_externalVulnerability_en: >-
  Exports: $680 billion annually (2025); concentrated in semiconductors (20%),
  automotive (12%), petrochemicals (8%), steel (6%), machinery (10%),
  electronics (15%), other (29%) [5]. Imports: $630 billion annually (2025);
  concentrated in energy (20%), machinery/equipment (25%), chemicals (10%),
  metals (8%), food (5%), other (32%) [5]. Trade balance: slight surplus; energy
  imports offset by semiconductor and automotive exports [5]. Export
  concentration: heavy dependence on China (19%), U.S. (16%), Vietnam (8%);
  semiconductor demand volatile [5] [11]. Debt holders: ~60% of government debt
  held domestically (Korean pension funds, insurance companies, banks); ~40%
  held by foreign investors [14]. Maturity wall: government debt maturity
  profile well-distributed; no acute refinancing crisis; average maturity ~4–5
  years [14]. South Korea not under IMF program; no external financing
  constraints; IMF rates South Korea as stable [28]. Rising interest rates
  increase debt servicing costs; fiscal consolidation necessary to stabilize
  debt trajectory [14]. South Korea aligned with Western sanctions on Russia;
  limited direct economic impact (trade with Russia <2% of total) [5]. Oil and
  natural gas price volatility affects fiscal revenue and trade balance; energy
  sector represents ~5% of GDP; commodity price shock could trigger fiscal
  stress [13]. Strait of Malacca and South China Sea critical for trade; ~90% of
  oil imports transit these routes; geopolitical risk present [5].
economy_externalVulnerability_fr: >-
  Exportations : 680 milliards de dollars annuellement (2025); concentrées dans
  les semi-conducteurs (20 %), l'automobile (12 %), les pétrochimiques (8 %),
  l'acier (6 %), les machines (10 %), l'électronique (15 %), autre (29 %) [5].
  Importations : 630 milliards de dollars annuellement (2025); concentrées dans
  l'énergie (20 %), les machines/équipements (25 %), les produits chimiques (10 %),
  les métaux (8 %), les aliments (5 %), autre (32 %) [5]. Solde commercial : léger
  excédent; les importations d'énergie sont compensées par les exportations de
  semi-conducteurs et automobiles [5]. Concentration des exportations :
  dépendance lourde à la Chine (19 %), États-Unis (16 %), Vietnam (8 %); la
  demande de semi-conducteurs est volatile [5] [11]. Détenteurs de dettes : ~60 %
  de la dette publique détenue en interne (fonds de pension coréens, compagnies
  d'assurance, banques); ~40 % détenue par des investisseurs étrangers [14]. Mur
  d'échéance : le profil d'échéance de la dette publique est bien distribué;
  pas de crise de refinancement aiguë; l'échéance moyenne ~4–5 ans [14]. La
  Corée du Sud n'est pas sous programme du FMI; pas de contraintes de
  financement externe; le FMI évalue la Corée du Sud comme stable [28]. Les
  taux d'intérêt en hausse augmentent les coûts de service de la dette; la
  consolidation fiscale est nécessaire pour stabiliser la trajectoire de la
  dette [14]. La Corée du Sud s'aligne sur les sanctions occidentales sur la
  Russie; impact économique direct limité (commerce avec la Russie <2 % du
  total) [5]. La volatilité des prix du pétrole et du gaz naturel affecte les
  revenus fiscaux et le solde commercial; le secteur énergétique représente ~5 %
  du PIB; un choc des prix des matières premières pourrait déclencher un stress
  fiscal [13]. Le détroit de Malacca et la mer de Chine méridionale sont
  critiques pour le commerce; ~90 % des importations de pétrole transitent par
  ces routes; le risque géopolitique est présent [5].
economy_politicalEconomy_en: >-
  Who benefits: Seoul metropolitan area (finance, technology, entertainment)
  benefits from current model; manufacturing regions (Gyeonggi, Busan) benefit
  from exports; agricultural regions dependent on subsidies [6]. Semiconductors,
  automotive, technology, entertainment benefit from current model; agriculture
  faces competitive pressure; SMEs struggle against chaebol dominance [6].
  Chaebol structure dominant: Samsung, Hyundai, LG, SK control ~40% of GDP;
  family ownership concentrated; no significant oligarchic competition [6].
  Technical needs: Chaebol reform (reduce family control, improve governance);
  fiscal consolidation; labor market reforms; SME support; energy transition
  acceleration [5] [6]. Political possibility: Chaebol reform difficult;
  conservative government supports business-friendly policies; labor market
  reforms blocked by strong unions; SME support popular but limited funding [2].
  Energy transition reforms possible with business support; fiscal consolidation
  requires cross-party consensus; no major reforms likely with
  opposition-controlled legislature [2]. Energy subsidies limited; agricultural
  subsidies significant (~$10 billion annually); no major fuel/food subsidies
  [6]. Public sector wages competitive; no acute wage pressure; pension
  obligations significant (~$500 billion liability) [7]. National Pension System
  (NPS) and Old Age Security provide retirement income; sustainability concerns
  as population ages; NPS actuarially sound but facing pressure [29]. No price
  controls; market-based pricing; government provides targeted income support
  (child allowances, earned income tax credit) [6].
economy_politicalEconomy_fr: >-
  Qui bénéficie : la région métropolitaine de Séoul (finance, technologie,
  divertissement) bénéficie du modèle actuel; les régions manufacturières
  (Gyeonggi, Busan) bénéficient des exportations; les régions agricoles
  dépendent des subventions [6]. Les semi-conducteurs, l'automobile, la
  technologie, le divertissement bénéficient du modèle actuel; l'agriculture
  fait face à une pression concurrentielle; les PME luttent contre la
  domination des chaebol [6]. La structure des chaebol est dominante : Samsung,
  Hyundai, LG, SK contrôlent ~40 % du PIB; la propriété familiale est concentrée;
  pas de concurrence oligarchique significative [6]. Besoins techniques :
  réforme des chaebol (réduire le contrôle familial, améliorer la gouvernance);
  consolidation fiscale; réformes du marché du travail; soutien aux PME;
  accélération de la transition énergétique [5] [6]. Possibilité politique : la
  réforme des chaebol est difficile; le gouvernement conservateur soutient les
  politiques favorables aux entreprises; les réformes du marché du travail sont
  bloquées par les syndicats puissants; le soutien aux PME est populaire mais
  le financement est limité [2]. Les réformes de la transition énergétique sont
  possibles avec le soutien des entreprises; la consolidation fiscale nécessite
  un consensus multipartite; pas de réformes majeures probables avec la
  législature contrôlée par l'opposition [2]. Les subventions énergétiques sont
  limitées; les subventions agricoles sont importantes (~10 milliards de
  dollars annuellement); pas de subventions majeures de carburant/aliments [6].
  Les salaires du secteur public sont compétitifs; pas de pression salariale
  aiguë; les obligations de retraite sont importantes (~500 milliards de
  dollars de responsabilité) [7]. Le Système national de retraite (NPS) et la
  Sécurité sociale pour les personnes âgées fournissent un revenu de retraite;
  les préoccupations de durabilité à mesure que la population vieillit; le NPS
  est actuariellement sain mais fait face à une pression [29]. Pas de contrôles
  de prix; tarification basée sur le marché; le gouvernement fournit un
  soutien au revenu ciblé (allocations pour enfants, crédit d'impôt sur le
  revenu gagné) [6].
security_internal_en: >-
  North Korea remains primary threat; 1.2 million-strong military faces
  600,000-strong South Korean military [15]. Demilitarized Zone (DMZ) remains
  world's most militarized border; periodic provocations (artillery fire,
  infiltration attempts); no active large-scale conflict [9]. Nuclear weapons:
  North Korea possesses 30–40 warheads; South Korea non-nuclear but under U.S.
  nuclear umbrella; Extended Deterrence (U.S. nuclear guarantee) provides
  security assurance [16]. Conventional military balance: South Korea
  technologically superior; North Korea numerically superior; stalemate
  maintained [15]. No active insurgency; no armed groups challenging state
  authority [18]. Organized crime present (drug trafficking, human trafficking)
  but not destabilizing; law enforcement maintains control [18]. Minimal
  communal violence; no active ethnic or religious conflict [18]. Low terrorism
  risk; occasional North Korean-linked incidents; threat level assessed as
  MEDIUM by National Intelligence Service [18]. Cybersecurity threats
  significant; North Korean state-sponsored hacking (Lazarus Group) targets
  financial institutions, technology companies, government agencies [17]. South
  Korean military (600,000 active, 3 million reserve) operationally capable;
  equipment modern; recruitment and retention challenges due to mandatory
  service [15]. National Intelligence Service (NIS) operates domestically and
  internationally; Defense Security Command operates within military; Five
  Eyes-adjacent intelligence sharing with U.S., Japan, Australia [18]. Low
  corruption in security forces; professional military and police culture; no
  evidence of security force capture [18]. U.S. (stable, integrated); North
  Korea (militarized border); China (border, espionage); no militarized border
  disputes with allies [15]. North Korean infiltration attempts periodic;
  defector flows manageable; no mass refugee influx [9]. No active cross-border
  militia activity; North Korean special forces pose persistent threat [15].
security_internal_fr: >-
  La Corée du Nord reste la menace principale; l'armée de 1,2 million de
  personnes fait face à l'armée sud-coréenne de 600 000 personnes [15]. La Zone
  démilitarisée (DMZ) reste la frontière la plus militarisée du monde; les
  provocations périodiques (tirs d'artillerie, tentatives d'infiltration); pas
  de conflit actif à grande échelle [9]. Armes nucléaires : la Corée du Nord
  possède 30–40 ogives; la Corée du Sud est non-nucléaire mais sous le
  parapluie nucléaire américain; la Dissuasion étendue (garantie nucléaire
  américaine) fournit l'assurance de sécurité [16]. Équilibre militaire
  conventionnel : la Corée du Sud est technologiquement supérieure; la Corée du
  Nord est numériquement supérieure; l'impasse est maintenue [15]. Pas
  d'insurrection active; pas de groupes armés contestant l'autorité d'État
  [18]. Crime organisé présent (trafic de drogue, trafic d'êtres humains) mais
  pas déstabilisant; l'application de la loi maintient le contrôle [18].
  Violence communautaire minimale; pas de conflit ethnique ou religieux actif
  [18]. Risque de terrorisme faible; incidents occasionnels liés à la Corée du
  Nord; le niveau de menace est évalué comme MOYEN par le Service national de
  renseignement [18]. Les menaces de cybersécurité sont importantes; le
  piratage parrainé par l'État nord-coréen (Lazarus Group) cible les
  institutions financières, les entreprises technologiques, les agences
  gouvernementales [17]. L'armée sud-coréenne (600 000 personnels actifs, 3
  millions de réserve) est opérationnellement capable; l'équipement est moderne;
  les défis de recrutement et de rétention dus au service obligatoire [15].
  Service national de renseignement (NIS) fonctionne en interne et à
  l'international; le Commandement de la sécurité de la défense fonctionne au
  sein de l'armée; le partage de renseignement adjacent aux Five Eyes avec les
  États-Unis, le Japon, l'Australie [18]. Faible corruption dans les forces de
  sécurité; culture militaire et policière professionnelle; pas de preuve de
  capture des forces de sécurité [18]. États-Unis (stable, intégré); Corée du
  Nord (frontière militarisée); Chine (frontière, espionnage); pas de
  différends frontaliers militarisés avec les alliés [15]. Les tentatives
  d'infiltration nord-coréenne sont périodiques; les flux de transfuges sont
  gérables; pas d'afflux massif de réfugiés [9]. Pas d'activité de milice
  transfrontalière active; les forces spéciales nord-coréennes posent une
  menace persistante [15].
security_diplomacy_en: >-
  Treaty allies: U.S. (mutual defense treaty, 28,500 troops stationed); Japan
  (security cooperation, trilateral coordination); Australia (Five Eyes-adjacent
  intelligence sharing) [15] [19]. Transactional partners: OECD member; G20
  member; active in regional organizations (ASEAN+3, East Asia Summit, APEC)
  [20]. U.S. alignment: Deep integration (trade, defense, intelligence); South
  Korea dependent on U.S. market and security umbrella; no strategic divergence
  [15]. China relationship complex: economic dependence (trade, FDI) vs.
  strategic competition (THAAD missile system, technology competition, North
  Korea policy); no military confrontation [19]. Russia relationship:
  sanctions-aligned with Western coalition; limited trade; no direct military
  confrontation; Arctic policy coordination minimal [20]. Japan relationship:
  historical tensions (comfort women, territorial disputes) persist but security
  cooperation deepening on North Korea [15]. North Korea policy: deterrence and
  sanctions (Yoon era); denuclearization negotiations stalled; military
  exercises with U.S. ongoing [9]. Regional security: Korean Peninsula tensions
  high; Taiwan Strait developments monitored; South China Sea shipping routes
  critical [5]. Unification sentiment declining; younger generations favor
  status quo; no active reunification movements [24]. OECD and G20 participation
  reflects developed-country status; regional leadership aspirations [20].
security_diplomacy_fr: >-
  Alliés du traité : États-Unis (traité de défense mutuelle, 28 500 soldats
  stationnés); Japon (coopération en matière de sécurité, coordination
  trilatérale); Australie (partage de renseignement adjacent aux Five Eyes)
  [15] [19]. Partenaires transactionnels : membre de l'OCDE; membre du G20;
  actif dans les organisations régionales (ASEAN+3, Sommet d'Asie de l'Est,
  APEC) [20]. Alignement américain : intégration profonde (commerce, défense,
  renseignement); la Corée du Sud dépend du marché américain et du parapluie de
  sécurité américain; pas de divergence stratégique [15]. La relation avec la
  Chine est complexe : dépendance économique (commerce, IDE) vs. concurrence
  stratégique (système de missiles THAAD, concurrence technologique, politique
  envers la Corée du Nord); pas de confrontation militaire [19]. Relation avec
  la Russie : alignement des sanctions avec la coalition occidentale; commerce
  limité; pas de confrontation militaire directe; coordination minimale de la
  politique arctique [20]. Relation avec le Japon : les tensions historiques
  (femmes de réconfort, différends territoriaux) persistent mais la coopération
  en matière de sécurité s'approfondit sur la Corée du Nord [15]. Politique
  envers la Corée du Nord : dissuasion et sanctions (ère Yoon); les
  négociations de dénucléarisation sont bloquées; les exercices militaires avec
  les États-Unis sont en cours [9]. Sécurité régionale : les tensions de la
  Péninsule coréenne sont élevées; les développements du détroit de Taïwan sont
  surveillés; les routes commerciales de la mer de Chine méridionale sont
  critiques [5]. Le sentiment d'unification décline; les jeunes générations
  favorisent le statu quo; pas de mouvements d'unification actifs [24]. La
  participation à l'OCDE et au G20 reflète le statut de pays développé; les
  aspirations de leadership régional [20].
