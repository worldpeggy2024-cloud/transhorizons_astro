    },
    {
      "name": "Royaume-Uni",
      "interests": "Maintenir le partenariat de renseignement Five Eyes (Groupe des cinq); alignement commercial et diplomatique du Commonwealth post-Brexit; coordination dans le PTPGP",
      "resources": "Infrastructure de renseignement partagée; liens historiques du Commonwealth; co-adhésion au PTPGP [gac-trade-diversification]",
      "constraints": "L'ajustement post-Brexit limite la capacité d'un engagement canadien majeur; l'éloignement géographique restreint la profondeur de la coopération en matière de défense; transition à la tête du gouvernement en cours : Keir Starmer a démissionné de la direction du Parti travailliste en juin 2026 et assure l'intérim au poste de premier ministre en attendant l'élection d'un successeur, ce qui introduit un risque de continuité à court terme.",
      "likelyMoves": "Approfondir la coopération canado-britannique en matière industrielle de défense, dans le prolongement de la déclaration conjointe de juillet 2026 sur le financement de la défense (Banque de défense, de sécurité et de résilience; Mécanisme multilatéral de défense) [pmo-carney-starmer-defence-2026]; coordination au sein du Groupe des cinq sur la Chine et la Russie; coopération dans le cadre du PTPGP. La continuité dépendra de la nouvelle direction travailliste.",
      "dealability": "High"
    }
  ]
