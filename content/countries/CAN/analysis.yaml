executiveSnapshot_en: >-
  1. REGIME TYPE: Canada is a Westminster parliamentary democracy and
  constitutional monarchy; executive power derives from electoral competition in
  first-past-the-post (FPTP) single-member-constituency elections, with the
  Prime Minister holding power by commanding the confidence of the House of
  Commons [freedom-house-canada-2026][vdem-democracy-report-2026].

  2. POLITICAL EQUILIBRIUM: The Liberal government under Prime Minister Mark
  Carney holds a working parliamentary majority as of 28 June 2026 (173 of 343
  seats), reached after the April 2025 election minority via five floor
  crossings and a sweep of three April 2026 by-elections — a route the
  Conservative Official Opposition under Pierre Poilievre contests as
  illegitimate. The majority lets the government pass legislation without
  opposition support, shifting the operative constraint from inter-party
  bargaining to caucus discipline, though the margin is thin and narrowing (see
  Power Structure)
  [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026].

  3. ECONOMIC MODEL: Canada is a high-income, trade-dependent mixed economy;
  dominant sectors are energy (oil & gas, hydroelectric), financial services,
  real estate, and manufacturing; total exports of goods and services reached
  $997B and imports exceeded $1T in 2024, with 75%+ of merchandise exports
  destined for the United States [gac-state-of-trade-2025][imf-can-2025-art4].

  4. TOP 3 RISKS (6–18 months): (a) Permanent US tariff shock suppressing export
  revenue and investment; (b) Fiscal deterioration — The Parliamentary Budget
  Officer projects a $72B deficit (2.2% of GDP) in 2025-26 with US tariffs
  treated as permanent; (c) Inflationary resurgence — headline CPI rose to 3.2%
  y/y in May 2026 driven by gasoline (+33.2% y/y)
  [pbo-efo-jun2026][statcan-cpi-may2026][boc-mpr-apr2026].

  5. TOP 3 WATCH ITEMS (4–12 weeks): (a) Bank of Canada July 2026 rate decision
  — policy rate held at 2.25% with inflation breaching the target band; (b)
  Canada–US tariff negotiation track and any CUSMA renegotiation signal; (c)
  Parliamentary confidence dynamics heading into a fall sitting
  [boc-mpr-apr2026][cgai-diplomats-guide-2026].

  6. EXTERNAL DEPENDENCIES: The United States absorbs about 68% of Canadian
  merchandise exports as of early 2026, down from 75.9% in 2024
  [statcan-12100011-ptp-exports]; much of that decline reflects volatile
  unwrought-gold shipments to the United Kingdom rather than durable
  diversification, and excluding gold the share remains in the low-70s (see
  Economy) [statcan-daily-imt-april-2026]. Canada's energy sector is
  export-critical with minimal pipeline diversification to tidewater; federal
  debt is largely domestically held but sensitive to global rate shifts; no
  International Monetary Fund program; no sanctions exposure
  [imf-can-2025-art4].

  7. SECURITY POSTURE: Internal stability is high; no active insurgency. The
  Royal Canadian Mounted Police and the Canadian Security Intelligence Service
  actively police organized crime and terrorism at levels that don't threaten
  institutional stability, while foreign interference ( targeting diaspora
  communities and elections) is an escalating concern rather than a contained
  one; NORAD modernization ($38.6B over 20 years) is underway and Arctic
  sovereignty is a declared priority.
  [dnd-departmental-results-2024-25][freedom-house-canada-2026].

  8. DIPLOMATIC ORIENTATION: Canada is a founding NATO member, Five Eyes
  partner, G7 participant, and OECD member; the EU Security and Defence
  Partnership was established at the June 2025 Canada–EU summit
  [gac-eu-security-defence-partnership]; CPTPP and CETA provide Indo-Pacific and
  European trade frameworks; the Canada Strong sovereign wealth fund ($25B)
  signals a turn toward strategic economic diplomacy
  [cgai-diplomats-guide-2026][gac-trade-diversification][pmo-canada-strong-fund-2026][seu-2026].

  9. DATA CONFIDENCE: Economic and demographic sections are HIGH confidence:
  sourced from Statistics Canada, Bank of Canada, and IMF; political section is
  HIGH confidence: sourced from Freedom House and V-Dem; society cohesion
  section is MEDIUM confidence: self-report surveys have known undercount biases
  for marginalized communities; security section is MEDIUM confidence: DND
  operational data is partially disclosed
  [imf-can-2025-art4][statcan-gdp-q1-2026][freedom-house-canada-2026][dnd-departmental-results-2024-25].

  10. BASELINE OUTLOOK: Canada enters H2 2026 with stagnant output, rising
  inflation, a majority government managing a tariff-induced fiscal squeeze, and
  strong institutional buffers that cap downside risk — the most likely path is
  slow-growth muddling through rather than crisis or acceleration
  [boc-mpr-apr2026][pbo-efo-jun2026][oecd-eo-june2026].
executiveSnapshot_fr: >-
  1. TYPE DE RÉGIME : Le Canada est une démocratie parlementaire de type
  Westminster et une monarchie constitutionnelle. Le pouvoir exécutif est acquis
  par la compétition électorale dans des circonscriptions uninominales à scrutin
  majoritaire à un tour; le premier ministre détenant le pouvoir dès lors qu'il
  dispose de la confiance de la Chambre des communes
  [freedom-house-canada-2026][vdem-democracy-report-2026].

  2. ÉQUILIBRE POLITIQUE : Le gouvernement libéral dirigé par le premier
  ministre Mark Carney détient une majorité parlementaire fonctionnelle au 28
  juin 2026 (173 sièges sur 343), atteinte après la minorité issue de l'élection
  d'avril 2025 grâce à cinq changements d'allégeance et aux trois élections
  partielles remportées en avril 2026; voie que l'Opposition officielle
  conservatrice dirigée par Pierre Poilievre dénonce comme illégitime. Cette
  majorité permet au gouvernement d'adopter des lois sans l'appui de
  l'opposition, déplaçant la contrainte opérationnelle de la négociation
  interpartis vers la discipline de caucus, bien que la marge soit mince et
  s'amenuise (voir Structure du pouvoir)
  [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026].

  3. MODÈLE ÉCONOMIQUE : Le Canada est une économie mixte à revenu élevé et
  fortement tributaire du commerce extérieur; les secteurs dominants sont
  l'énergie (pétrole, gaz, hydroélectricité), les services financiers,
  l'immobilier et la fabrication; les exportations totales de biens et de
  services ont atteint 997 milliards de dollars (G$) et les importations ont
  dépassé 1 000 G$ en 2024, avec plus de 75 % des exportations de marchandises à
  destination des États-Unis [gac-state-of-trade-2025][imf-can-2025-art4].

  4. TOP 3 DES RISQUES (6–18 mois) : (a) Choc tarifaire états-uniens permanent
  comprimant les recettes d'exportation et l'investissement; (b) Détérioration
  budgétaire : la directrice parlementaire du budget projette un déficit de
  72 G$ (2,2 % du PIB) en 2025-2026 en supposant que les droits de douane
  imposés par les États-Unis sont permanents; (c) Résurgence inflationniste :
  l'IPC global a atteint 3,2 % en glissement annuel en mai 2026, porté par
  l'essence (+33,2 % en g.a.)
  [pbo-efo-jun2026][statcan-cpi-may2026][boc-mpr-apr2026].

  5. TOP 3 À SURVEILLER (4–12 semaines) : (a) Décision de taux de la Banque du
  Canada en juillet 2026 : taux directeur maintenu à 2,25 % avec une inflation
  dépassant la cible; (b) Piste de négociation Canada–États-Unis sur les droits
  de douane et tout signal de renégociation de l'ACEUM; (c) Dynamique de
  confiance parlementaire à l'approche de la session d'automne
  [boc-mpr-apr2026][cgai-diplomats-guide-2026].

  6. DÉPENDANCES EXTÉRIEURES : Les États-Unis ont absorbé environ 68 % des
  exportations de marchandises canadiennes au début de 2026, en recul par
  rapport à 75,9 % en 2024 [statcan-12100011-ptp-exports]; cette baisse reflète
  surtout des expéditions volatiles d'or brut vers le Royaume-Uni plutôt qu'une
  diversification durable, en excluant l'or la part se maintient dans le bas de
  la fourchette des 70 % (voir Économie) [statcan-daily-imt-april-2026]. Le
  secteur énergétique demeure central pour les exportations, avec une
  diversification limitée vers les ports en eaux profondes; la dette fédérale
  est essentiellement détenue au pays, mais sensible aux variations des taux
  mondiaux; aucun programme du Fonds monétaire international ni exposition à des
  sanctions [imf-can-2025-art4].

  7. POSTURE DE SÉCURITÉ : La stabilité intérieure est élevée; aucune
  insurrection active. La Gendarmerie royale du Canada et le Service canadien du
  renseignement de sécurité (SCRS) contiennent le crime organisé et le
  terrorisme à des niveaux qui ne menacent pas la stabilité institutionnelle,
  tandis que l'ingérence étrangère (visant les communautés diasporiques et les
  élections) constitue une préoccupation croissante plutôt que contenue; la
  modernisation du NORAD (Commandement de la défense aérospatiale de l'Amérique
  du Nord) (38,6 G$ sur 20 ans) est en cours et la souveraineté dans l'Arctique
  est une priorité déclarée.
  [dnd-departmental-results-2024-25][freedom-house-canada-2026].

  8. ORIENTATION DIPLOMATIQUE : Le Canada est membre fondateur de l'OTAN
  (Organisation du traité de l'Atlantique nord), partenaire des Five Eyes (ou
  Groupe des cinq), participant au G7 et membre de l'OCDE (Organisation de
  coopération et de développement économiques); le Partenariat de sécurité et de
  défense entre l’Union européenne et le Canada a été établi lors du sommet
  Canada‑UE de juin 2025 [gac-eu-security-defence-partnership]; l’Accord de
  partenariat transpacifique global et progressiste (PTPGP) et l'Accord
  économique et commercial global (AECG) entre le Canada et l’Union européenne
  constituent des cadres commerciaux pour l'Indo-Pacifique et l'Europe; le fonds
  souverain Canada Fort (25 G$) marque un tournant vers une diplomatie
  économique stratégique
  [cgai-diplomats-guide-2026][gac-trade-diversification][pmo-canada-strong-fund-2026][seu-2026].

  9. CONFIANCE DANS LES DONNÉES : Les sections économiques et démographiques
  sont de HAUTE fiabilité : tirées de Statistique Canada, de la Banque du Canada
  et du FMI; la section politique est de HAUTE fiabilité : tirée de Freedom
  House et de V-Dem; la section sur la cohésion sociale est de FIABILITÉ
  MOYENNE : les sondages déclaratifs présentent des biais de sous-dénombrement
  pour les communautés marginalisées; la section sécuritaire est de FIABILITÉ
  MOYENNE : les données opérationnelles du ministère de la Défense nationale
  sont partiellement divulguées
  [imf-can-2025-art4][statcan-gdp-q1-2026][freedom-house-canada-2026][dnd-departmental-results-2024-25].

  10. PERSPECTIVES DE RÉFÉRENCE : Le Canada aborde le second semestre de 2026
  avec une production stagnante, une inflation en hausse, un gouvernement
  majoritaire composant avec une contrainte budgétaire induite par les droits de
  douane imposés par les États-Unis, et de solides amortisseurs institutionnels
  qui limitent le risque de dégradation; le scénario le plus probable est une
  navigation à vue à croissance lente plutôt qu'une crise ou une accélération
  [boc-mpr-apr2026][pbo-efo-jun2026][oecd-eo-june2026].
political_powerStructure_en: >-
  Executive power formally rests with the Crown, exercised by the Prime Minister
  and Cabinet through the Privy Council. Prime Minister Mark Carney leads a
  Liberal majority government: the Liberals were returned with a minority at the
  28 April 2025 general election (169 seats) and subsequently reached a majority
  through five floor crossings and a sweep of three by-elections on 13 April
  2026 (their first majority since 2015) [ourcommons-membership-changes]. The
  route to that majority — the first time a Canadian prime minister has crossed
  the threshold partly through floor crossings rather than at an election — is
  contested by the Conservative Official Opposition as illegitimate; it
  nonetheless gives the government effective control of the Commons agenda.

  The majority is real but thin and in motion. The Liberal count peaked at 174
  seats in April [cbc-carney-majority-byelections-2026] and stood at 172 of 343
  as of 7 July 2026 — a figure that includes the Speaker, who by convention
  votes only to break ties, leaving an operative voting bloc of 171 against 167
  for the combined opposition, with four seats vacant. The slip from 174
  followed two Liberal resignations [ourcommons-party-standings-2026]; at 172
  the government sits at the bare majority threshold. By-elections in the
  vacated seats are now the pivot: recovering the Liberal-held ridings would
  restore a cushion, while further losses on its own benches would leave the
  government's ability to legislate without opposition support resting on the
  Speaker's tie-breaking vote — a materially weaker position than a majority
  normally implies. The bicameral Parliament consists of an elected House of
  Commons (343 seats since the 2025 redistribution) and an appointed Senate; the
  Supreme Court of Canada exercises judicial review with full independence and
  serves as the final court of appeal
  [freedom-house-canada-2026][wjp-canada-2025]. The Royal Canadian Mounted
  Police (RCMP) is civilian-directed under the Minister of Public Safety; the
  Canadian Armed Forces (CAF) are under civilian ministerial control via the
  Department of National Defence [dnd-departmental-results-2024-25]. Media
  independence is robust — Freedom House classifies Canada Free in 2026, noting
  independent broadcasters and print outlets with no direct state ownership of
  major private media [freedom-house-canada-2026]. Canada ranked 13th of 143
  countries on the WJP Rule of Law Index 2025, reflecting strong scores on
  constraints on government powers and absence of corruption [wjp-canada-2025].
  V-Dem classifies Canada as a Liberal Democracy ranked 23rd globally on the
  Liberal Democracy Index in the 2026 report [vdem-democracy-report-2026].
political_powerStructure_fr: >-
  Le pouvoir exécutif appartient formellement à la Couronne et s'exerce par
  l'entremise du premier ministre et du Cabinet au sein du Conseil privé. Le
  premier ministre Mark Carney dirige un gouvernement libéral majoritaire : les
  libéraux ont été reportés au pouvoir avec une minorité lors de l'élection
  générale du 28 avril 2025 (169 sièges), puis ont atteint la majorité grâce à
  cinq changements d'allégeance et à la victoire dans les trois élections
  partielles du 13 avril 2026 (leur première majorité depuis 2015)
  [ourcommons-membership-changes]. La voie empruntée pour y parvenir — première
  fois qu'un premier ministre canadien franchit le seuil de la majorité en
  partie par des changements d'allégeance plutôt qu'au terme d'un scrutin — est
  dénoncée comme illégitime par l'Opposition officielle conservatrice; elle
  donne néanmoins au gouvernement le contrôle effectif de l'ordre du jour aux
  Communes. La majorité est réelle, mais fragile et mouvante. Le nombre de
  sièges libéraux a culminé à 174 en avril
  [cbc-carney-majority-byelections-2026], pour s'établir à 172 sur 343 au 7
  juillet 2026 (chiffre qui inclut le président de la Chambre, lequel, par
  convention, ne vote qu'en cas d'égalité pour la départager; ce qui laisse un
  bloc votant effectif de 171 voix contre 167 pour l'opposition réunie, avec
  quatre sièges vacants. Le recul de 174 à 172 fait suite à deux démissions de
  députés libéraux [ourcommons-party-standings-2026]; à 172, le gouvernement se
  situe au seuil même de la majorité. Les élections partielles dans les
  circonscriptions devenues vacantes constituent désormais le point de bascule :
  reprendre les sièges libéraux rétablirait une marge de manœuvre, tandis que de
  nouvelles pertes dans ses propres rangs feraient reposer sa capacité de
  légiférer sans l'appui de l'opposition sur la voix prépondérante du président;
  position nettement plus faible que ne le laisse entendre une majorité. Le
  Parlement bicaméral comprend une Chambre des communes élue (343 sièges depuis
  le redécoupage de 2025) et un Sénat nommé; la Cour suprême du Canada exerce un
  contrôle judiciaire en toute indépendance et est le tribunal d'appel de
  dernier ressort [freedom-house-canada-2026][wjp-canada-2025]. La Gendarmerie
  royale du Canada (GRC) est sous direction civile et relève du ministre de la
  Sécurité publique; les Forces armées canadiennes (FAC) sont sous contrôle
  ministériel civil par l'intermédiaire du ministère de la Défense nationale
  [dnd-departmental-results-2024-25]. L'indépendance des médias est robuste :
  Freedom House classe le Canada comme Libre en 2026, notant des diffuseurs
  indépendants et des imprimés sans propriété d'État directe des grands médias
  privés [freedom-house-canada-2026]. Le Canada se classe 13e sur 143 pays dans
  l'Indice d'état de droit du WJP 2025, reflétant de bons résultats sur les
  contraintes aux pouvoirs gouvernementaux et l'absence de corruption
  [wjp-canada-2025]. V-Dem classe le Canada comme Démocratie libérale, 23e
  mondial sur l'Indice de démocratie libérale dans son rapport 2026
  [vdem-democracy-report-2026].
political_stabilityDrivers_en: >-
  Legitimacy rests on procedural democratic foundations: regular, competitive,
  monitored elections; an independent judiciary; and constitutional protection
  of rights under the Charter
  [freedom-house-canada-2026][vdem-democracy-report-2026]. The Canadian Armed
  Forces maintain strong institutional loyalty to civilian control with no
  history of coup attempts; RCMP loyalty to constitutional order is embedded
  [dnd-departmental-results-2024-25]. The governing Liberal party now commands a
  working majority, removing the confidence-vote fragility that defined its
  first year and allowing it to pass legislation without opposition support; the
  binding constraint shifts from inter-party bargaining to internal discipline
  across an enlarged, ideologically broad caucus that now includes recent
  floor-crossers
  [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026].
  Business elite alignment is conditional: the energy sector, financial
  services, and export manufacturers support macroeconomic stability but
  increasingly pressure the government on trade diversification, regulatory
  competitiveness, and US tariff response
  [imf-can-2025-art4][gac-trade-diversification]. Transparency International's
  Corruption Perceptions Index 2025 ranks Canada 16th of 182, score 75/100 — its
  lowest-ever ranking, with the score unchanged from 2024 [ti-cpi-2025].
political_stabilityDrivers_fr: >-
  La légitimité repose sur des fondements démocratiques procéduraux : des
  élections régulières, compétitives et surveillées; un pouvoir judiciaire
  indépendant; et la protection constitutionnelle des droits par la Charte
  [freedom-house-canada-2026][vdem-democracy-report-2026]. Les Forces armées
  canadiennes maintiennent une solide loyauté institutionnelle envers le
  contrôle civil, sans antécédent de tentative de coup d'État; la loyauté de la
  GRC envers l'ordre constitutionnel est ancrée
  [dnd-departmental-results-2024-25]. Le Parti libéral au pouvoir dispose
  désormais d'une majorité fonctionnelle, ce qui élimine la fragilité des votes
  de confiance qui a marqué sa première année et lui permet d'adopter des lois
  sans l'appui de l'opposition; la contrainte déterminante passe de la
  négociation interpartis à la discipline interne de caucus élargi et
  idéologiquement hétérogène, qui compte désormais des élus ayant récemment
  changé d'allégeance
  [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026].
  L'alignement des élites économiques est conditionnel : le secteur énergétique,
  les services financiers et les fabricants exportateurs soutiennent la
  stabilité macroéconomique, mais font pression de plus en plus sur le
  gouvernement concernant la diversification commerciale, la compétitivité
  réglementaire et la réponse aux droits de douane imposés par les États-Unis
  [imf-can-2025-art4][gac-trade-diversification]. L'indice de perception de la
  corruption 2025 de Transparency International classe le Canada au 16ᵉ rang sur
  182, avec un score de 75/100 : son plus mauvais classement à ce jour, le score
  étant resté stable depuis 2024 [ti-cpi-2025].
political_shockAbsorbers_en: >-
  Canada's institutional shock absorbers are substantial: federal transfers and
  employment insurance automatically cushion regional economic downturns; the
  Bank of Canada retains rate flexibility with the policy rate at 2.25% and room
  to cut if activity deteriorates further [boc-mpr-apr2026]; fiscal capacity
  exists to run elevated deficits (PBO projects $72B / 2.2% of GDP in 2025-26)
  without triggering a sovereign debt crisis given Canada's AAA/AA+ credit
  profile and domestically held debt structure
  [pbo-efo-jun2026][imf-can-2025-art4]. On the acceleration side, the principal
  political vulnerability is no longer a confidence-vote collapse but the
  durability and legitimacy of the majority itself: it rests on a thin margin
  (173 of 343) and on floor crossings the opposition frames as illegitimate, so
  defections, further vacancies, or sustained legitimacy attacks could narrow
  the government's freedom of action; and the TI CPI score of 75/100, in gradual
  decline since 2012, signals public-trust erosion that, if it accelerates,
  could compound that legitimacy strain
  [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026][ti-cpi-2025].
  The combination of rising inflation (3.2% y/y in May 2026) and stagnant output
  — GDP flat in Q1 2026 after a Q4 2025 contraction — creates a stagflationary
  corridor where monetary policy tightening to fight inflation worsens fiscal
  and output stress simultaneously
  [statcan-gdp-q1-2026][statcan-cpi-may2026][boc-mpr-apr2026].
political_shockAbsorbers_fr: >-
  Les amortisseurs institutionnels du Canada sont substantiels : les transferts
  fédéraux et l'assurance-emploi atténuent automatiquement les ralentissements
  économiques régionaux; la Banque du Canada conserve une marge de manœuvre sur
  les taux avec un taux directeur à 2,25 % et la possibilité de le réduire si
  l'activité se dégrade davantage [boc-mpr-apr2026]; la capacité budgétaire
  permet de creuser des déficits élevés (la directrice parlementaire du budget
  projette 72 G$ / 2,2 % du PIB en 2025-2026) sans déclencher de crise de la
  dette souveraine, compte tenu du profil de crédit AAA/AA+ du Canada et de sa
  structure de dette à détention nationale [pbo-efo-jun2026][imf-can-2025-art4].
  Du côté des accélérateurs d'instabilité, la principale vulnérabilité politique
  n'est plus l'effondrement d'un vote de confiance, mais la durabilité et la
  légitimité de la majorité elle-même : elle repose sur une marge mince (173 sur
  343) et sur des changements d'allégeance que l'opposition qualifie
  d'illégitimes, de sorte que des défections, de nouvelles vacances ou des
  attaques soutenues contre sa légitimité pourraient restreindre la marge de
  manœuvre du gouvernement; et le score IPC de 75/100 de Transparency
  International, en recul graduel depuis 2012, indique une érosion de la
  confiance publique qui, si elle s'accélère, pourrait aggraver cette tension de
  légitimité
  [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026][ti-cpi-2025].
  La combinaison d'une inflation en hausse (3,2 % en g.a. en mai 2026) et d'une
  production stagnante  (PIB stable au T1 2026 après une contraction au T4 2025)
  crée un corridor stagflationniste où un resserrement de la politique monétaire
  pour combattre l'inflation aggraverait simultanément le stress budgétaire et
  la pression sur la production
  [statcan-gdp-q1-2026][statcan-cpi-may2026][boc-mpr-apr2026].
political_constitutionalSubstrate_en: >-
  Beneath current politics sits a plural constitutional-legal substrate that
  shapes what any government can do on land, resource, and private-law
  questions. Because the legal foundations differ substantially between Canada's
  constituent parts, each has to be described on its own terms rather than
  merged into a single account. Indeed, two distinct pluralities coexist.



  The first is bijuridicalism : the coexistence of two private-law traditions
  within one federation. Quebec operates under civil law, codified in the Civil
  Code of Québec (S.Q. 1991, c. 64, in force 1 January 1994), which governs
  persons, family, succession, property, obligations, and civil liability, and
  which lays down the jus commune of the province in harmony with the Charter of
  the French language and the Charter of human rights and freedoms; the Code
  replaced the 1866 Civil Code of Lower Canada [legisquebec-ccq-1991]. The other
  nine provinces and three territories operate under English common law,
  continued in force at Confederation by section 129 of the Constitution Act,
  1867, which maintained all pre-Union laws and courts of civil and criminal
  jurisdiction "as if the Union had not been made," subject to alteration by
  Parliament or the respective provincial legislature
  [canlii-constitution-act-1867]. Federal law is officially bijural: the Federal
  Law–Civil Law Harmonization Act, No. 1 (S.C. 2001, c. 4), assented to 10 May
  2001, repealed the pre-Confederation provisions of the Civil Code of Lower
  Canada that fell within federal jurisdiction, harmonised several federal
  statutes with the Civil Code of Québec, and added sections 8.1 and 8.2 to the
  Interpretation Act, recognising bijuralism as an interpretive principle for
  all federal statutes and providing that provincial private law completes
  federal legislation on a suppletive basis when the two touch
  [justice-harmonization-act-2001]. The Department of Justice defines this as
  legislative bijuralism : the requirement that each language version of a
  federal enactment take both common-law and civil-law traditions into account
  when it contacts provincial private law [justice-bijuralism-terminology]. The
  practical consequence is that questions of property, contract, and civil
  liability behave differently in Quebec than in the rest of Canada, and every
  federal statute touching those matters must be drafted to work in both
  traditions simultaneously.



  The second plurality is Indigenous constitutional rights and title, held
  distinct across substrates because the legal foundations themselves are
  distinct. In Quebec, the James Bay and Northern Quebec Agreement (11 November
  1975) is the country's first modern comprehensive land-claim treaty, covering
  roughly 1 million km² (about 65% of Quebec) and signed by Canada, Quebec,
  Hydro-Québec, the Grand Council of the Crees, and the Northern Quebec Inuit
  Association; it has since been amended by 24 complementary agreements and
  extended by the Paix des Braves (7 February 2002) between Quebec and the Cree
  Nation, the Federal New Relationship Agreement (2008) with Canada, and the
  Agreement on Cree Nation Governance (2017) with its companion Cree
  Constitution [cngov-agreements]. In much of British Columbia, by contrast,
  most First Nations never signed a treaty with the Crown, and Aboriginal title
  is established territorially rather than by settlement: in Tsilhqot'in Nation
  v. British Columbia, 2014 SCC 44, the Supreme Court of Canada issued the first
  declaration of Aboriginal title in Canadian history over 1,750 km², holding
  that title is grounded in sufficient, continuous, and exclusive
  pre-sovereignty occupation extending to territory and not merely site-specific
  use, that Crown incursions on title land require consent or must meet the
  section 35 justification framework, and that the province had breached its
  duty to consult [canlii-tsilhqotin-2014][tsilhqotin-ng-rights-title]. These
  two substrates (historic-treaty / modern-agreement lineage in Quebec, unceded
  / title-litigated in much of British Columbia) are constitutional bedrock,
  distinct from current political contest, and gate what any resource, land-use,
  or infrastructure decision can lawfully do. A third mechanism operates on the
  prairies, where provincial control of resources rests on the 1930 Natural
  Resources Transfer Agreement, which First Nations hold cannot lawfully
  alienate what the numbered Treaties never surrendered — a tension the Assembly
  of First Nations invoked against Alberta's 2025 separation proposal
  [afn-nrta-2025]. Canada's Indigenous population was 1.8 million or 5.0% of the
  total at the 2021 Census, comprising First Nations, Métis, and Inuit
  [statcan-2021-indigenous-profile].
political_constitutionalSubstrate_fr: >-
  Sous la politique courante repose un substrat constitutionnel et juridique
  pluriel qui définit la marge de manœuvre de tout gouvernement sur les
  questions relatives au territoire, aux terres, aux ressources et au droit
  privé. Parce que les fondements juridiques diffèrent substantiellement entre
  les composantes du Canada, chacun doit être décrit selon ses propres termes
  plutôt que fusionné en un récit unique. En effet, deux pluralités distinctes
  coexistent.


  La première est le bijuridisme : la coexistence de deux traditions de droit
  privé au sein d'une même fédération. Le Québec relève du droit civil, codifié
  dans le Code civil du Québec (L.Q. 1991, ch. 64, en vigueur le 1er janvier
  1994), qui régit les personnes, la famille, les successions, les biens, les
  obligations et la responsabilité civile, et qui établit le droit commun de la
  province conformément à la Charte de la langue française et la Charte des
  droits et libertés de la personne; il a remplacé le Code civil du Bas-Canada
  de 1866 [legisquebec-ccq-1991]. Les neuf autres provinces et les trois
  territoires relèvent de la common law d'origine anglaise, maintenue en vigueur
  à la Confédération par l'article 129 de la Loi constitutionnelle de 1867, qui
  a conservé l'ensemble des lois et tribunaux de juridiction civile et
  criminelle antérieurs à l'Union « comme si l'Union n'avait pas été faite »,
  sous réserve de modification par le Parlement ou la législature provinciale
  concernée [canlii-constitution-act-1867]. Le droit fédéral est officiellement
  bijural : la Loi d'harmonisation n° 1 du droit fédéral avec le droit civil
  (L.C. 2001, ch. 4), sanctionnée le 10 mai 2001, a abrogé les dispositions du
  Code civil du Bas-Canada relevant de la compétence fédérale, harmonisé
  plusieurs lois fédérales avec le Code civil du Québec et ajouté à la Loi
  d'interprétation les articles 8.1 et 8.2, qui reconnaissent le bijuridisme
  comme principe d'interprétation applicable à l'ensemble des lois fédérales et
  prévoient que le droit privé provincial complète à titre supplétif la
  législation fédérale lorsque le droit fédéral fait appel à des concepts de
  droit privé [justice-harmonization-act-2001]. Le ministère de la Justice
  définit ce principe comme le bijuridisme législatif : l'obligation, pour
  chaque version linguistique d'une loi fédérale, de prendre en compte à la fois
  la common law et le droit civil lorsqu'elle touche au droit privé provincial
  [justice-bijuralism-terminology]. La conséquence pratique est que les
  questions de biens, de contrats et de responsabilité civile ne se comportent
  pas de la même façon au Québec qu'ailleurs au Canada, et que toute loi
  fédérale touchant ces matières doit être rédigée pour fonctionner
  simultanément dans les deux traditions.


  La seconde pluralité concerne les droits et titres constitutionnels
  autochtones, tenus distincts d'un substrat à l'autre parce que les fondements
  juridiques eux-mêmes sont distincts. Au Québec, la Convention de la Baie-James
  et du Nord québécois (11 novembre 1975) est le premier traité moderne de
  revendication territoriale globale du pays, couvrant environ 1 million de
  km² (soit près de 65 % du Québec) et signé par le Canada, le Québec,
  Hydro-Québec, le Grand Conseil des Cris et l'Association des Inuits du Nord
  québécois; elle a depuis été modifiée par 24 conventions complémentaires et
  prolongée par la Paix des Braves (7 février 2002) entre le Québec et la Nation
  crie, l'Entente concernant une nouvelle relation (2008) avec le Canada, ainsi
  que l'Entente sur la gouvernance de la Nation crie (2017) et sa Constitution
  crie [cngov-agreements]. En Colombie-Britannique, à l'inverse, la plupart des
  Premières Nations n'ont jamais signé de traité avec la Couronne, et le titre
  ancestral s'établit territorialement plutôt que par entente : dans Nation
  Tsilhqot'in c. Colombie-Britannique, 2014 CSC 44, la Cour suprême du Canada a
  rendu la première déclaration de titre ancestral de l'histoire canadienne, sur
  1 750 km², jugeant que le titre reposait sur une occupation suffisante,
  continue et exclusive au moment de la souveraineté, qu'il s'étendait au
  territoire et non seulement aux sites précis d'usage, que toute atteinte de la
  Couronne au titre requérait le consentement ou devait satisfaire au cadre de
  justification de l'article 35, et que la province avait manqué à son
  obligation de consultation
  [canlii-tsilhqotin-2014][tsilhqotin-ng-rights-title]. Ces deux
  substrats (filiation historique-traité / entente moderne au Québec, non cédé /
  titre en litige dans une grande partie de la Colombie-Britannique) sont des
  socles constitutionnels distincts de la lutte politique courante et encadrent
  ce que toute décision de ressources, d'aménagement ou d'infrastructure peut
  légalement faire. Un troisième mécanisme opère dans les Prairies, où le
  contrôle provincial des ressources repose sur la Convention sur le transfert
  des ressources naturelles de 1930, dont les Premières Nations soutiennent
  qu'elle ne peut pas légalement aliéner ce que les traités numérotés n'ont
  jamais cédé; tension que l'Assemblée des Premières Nations a invoquée contre
  le projet de séparation de l'Alberta en 2025 [afn-nrta-2025]. Au recensement
  de 2021, la population autochtone du Canada atteignait 1,8 million de
  personnes, soit 5,0 % du total, comprenant les Premières Nations, les Métis et
  les Inuits [statcan-2021-indigenous-profile].
