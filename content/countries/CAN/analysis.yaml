      "mitigants": "Agenda d'offre de logements du budget 2025 [budget-2025-canada-strong][seu-2026]; réduction de la population des résdients non permanents atténuant la pression de la demande [pbo-ircc-immigration-demographic]; futur assouplissement de la politique de taux de la Banque du Canada [boc-mpr-apr2026]"
    },
    {
      "title": "Défi à la souveraineté arctique et à la crédibilité défensive",
