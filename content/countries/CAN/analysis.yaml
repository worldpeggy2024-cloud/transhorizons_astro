      "name": "Chine",
      "interests": "Importations canadiennes de ressources (énergie, minéraux, agro-alimentaire); influence diasporique; réduction de l'alignement canadien sur la politique des États-Unis de confinement dans l'Indo-Pacifique",
      "resources": "Ampleur de la relation commerciale canadienne; importante communauté diasporique; présence d'investissements dans les secteurs miniers et technologiques canadiens",
      "constraints": "Les allégations d'ingérence étrangère ont accru le contrôle du Service canadien du renseignement de sécurité; l'ACEUM limite la marge de manœuvre du Canada pour élargir ses liens économiques avec la Chine; règles du PTPGP [cgai-diplomats-guide-2026][gac-trade-diversification]",
      "likelyMoves": "Maintenir la relation commerciale à son niveau actuel; user d'un levier économique sur l'accès agricole; mener des activités d'ingérence et d'intimidation visant les communautés diasporiques (que la Commission Hogue qualifie de « particulièrement vulnérables »), principalement dans le but d'étouffer les critiques et de contrôler l'image de la RPC, le plus souvent par des pressions exercées sur des proches restés en Chine [hogue-final-report-2025].",
