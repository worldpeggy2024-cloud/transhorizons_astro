executiveSnapshot_en: |-
  1. REGIME TYPE: Canada is a Westminster parliamentary democracy and constitutional monarchy; executive power derives from electoral competition in first-past-the-post (FPTP) single-member-constituency elections, with the Prime Minister holding power by commanding the confidence of the House of Commons [freedom-house-canada-2026][vdem-democracy-report-2026].
  2. POLITICAL EQUILIBRIUM: The Liberal government under Prime Minister Mark Carney holds a parliamentary majority as of June 2026 (173 of 343 seats), reached after the April 2025 election minority via five floor crossings and a sweep of three April 2026 by-elections — a route the Conservative Official Opposition under Pierre Poilievre contests as illegitimate; the government can now pass legislation without opposition support, shifting the operative constraint from inter-party bargaining to caucus discipline [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026].
  3. ECONOMIC MODEL: Canada is a high-income, trade-dependent mixed economy; dominant sectors are energy (oil & gas, hydroelectric), financial services, real estate, and manufacturing; total exports reached $997B and imports exceeded $1T in 2024, with 75%+ of merchandise exports destined for the United States [gac-state-of-trade-2025][imf-can-2025-art4].
  4. TOP 3 RISKS (6–18 months): (a) Permanent US tariff shock suppressing export revenue and investment; (b) Fiscal deterioration — PBO projects a $72B deficit (2.2% of GDP) in 2025-26 with US tariffs treated as permanent; (c) Inflationary resurgence — headline CPI rose to 3.2% y/y in May 2026 driven by gasoline (+33.2% y/y) [pbo-efo-jun2026][statcan-cpi-may2026][boc-mpr-apr2026].
  5. TOP 3 WATCH ITEMS (4–12 weeks): (a) Bank of Canada July 2026 rate decision — policy rate held at 2.25% with inflation breaching the target band; (b) Canada–US tariff negotiation track and any CUSMA renegotiation signal; (c) Parliamentary confidence dynamics heading into a fall sitting [boc-mpr-apr2026][cgai-diplomats-guide-2026].
  6. EXTERNAL DEPENDENCIES: The US absorbs ~75% of Canadian goods exports; Canada's energy sector is export-critical with minimal pipeline diversification to tidewater; federal debt is largely domestically held but sensitive to global rate shifts; no IMF program; no sanctions exposure [gac-state-of-trade-2025][imf-can-2025-art4][un-comtrade-canada].
  7. SECURITY POSTURE: Internal stability is high; no active insurgency; RCMP and CSIS manage organized crime, foreign interference, and terrorism threats at manageable levels; NORAD modernization investment of $38.6B over 20 years is underway; Arctic sovereignty is a declared priority [dnd-departmental-results-2024-25][freedom-house-canada-2026].
  8. DIPLOMATIC ORIENTATION: Canada is a founding NATO member, Five Eyes partner, G7 participant, and OECD member; the EU Security and Defence Partnership was activated in early 2026; CPTPP and CETA provide Indo-Pacific and European trade frameworks; the Canada Strong sovereign wealth fund ($25B) signals a turn toward strategic economic diplomacy [cgai-diplomats-guide-2026][gac-trade-diversification][budget-2025-canada-strong].
  9. DATA CONFIDENCE: Economic and demographic sections are HIGH confidence — sourced from Statistics Canada, Bank of Canada, and IMF; political section is HIGH confidence — sourced from Freedom House and V-Dem; society cohesion section is MEDIUM confidence — self-report surveys have known undercount biases for marginalized communities; security section is MEDIUM confidence — DND operational data is partially disclosed [imf-can-2025-art4][statcan-gdp-q1-2026][freedom-house-canada-2026][dnd-departmental-results-2024-25].
  10. BASELINE OUTLOOK: Canada enters H2 2026 with stagnant output, rising inflation, a minority government managing a tariff-induced fiscal squeeze, and strong institutional buffers that cap downside risk — the most likely path is slow-growth muddling through rather than crisis or acceleration [boc-mpr-apr2026][pbo-efo-jun2026][oecd-eo-june2026].
executiveSnapshot_fr: |-
  1. TYPE DE RÉGIME : Le Canada est une démocratie parlementaire de type Westminster et une monarchie constitutionnelle ; le pouvoir exécutif est acquis par la compétition électorale dans des circonscriptions uninominales à scrutin majoritaire à un tour, le Premier ministre détenant le pouvoir dès lors qu'il dispose de la confiance de la Chambre des communes [freedom-house-canada-2026][vdem-democracy-report-2026].
  2. ÉQUILIBRE POLITIQUE : Le gouvernement libéral de Mark Carney détient une majorité parlementaire en juin 2026 (173 sièges sur 343), atteinte après la minorité de l'élection d'avril 2025 grâce à cinq changements d'allégeance et au balayage de trois élections partielles en avril 2026 — une voie que l'opposition officielle conservatrice de Pierre Poilievre conteste comme illégitime ; le gouvernement peut désormais adopter des lois sans l'appui de l'opposition, déplaçant la contrainte opérationnelle du marchandage interpartis vers la discipline du caucus [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026].
  3. MODÈLE ÉCONOMIQUE : Le Canada est une économie mixte à revenu élevé et fortement tributaire du commerce extérieur ; les secteurs dominants sont l'énergie (pétrole, gaz, hydroélectricité), les services financiers, l'immobilier et la fabrication ; les exportations totales ont atteint 997 G$ et les importations ont dépassé 1 000 G$ en 2024, avec plus de 75 % des exportations de marchandises à destination des États-Unis [gac-state-of-trade-2025][imf-can-2025-art4].
  4. TOP 3 DES RISQUES (6–18 mois) : (a) Choc tarifaire américain permanent comprimant les recettes d'exportation et l'investissement ; (b) Détérioration budgétaire — le DPB projette un déficit de 72 G$ (2,2 % du PIB) en 2025-2026 en supposant que les tarifs américains sont permanents ; (c) Résurgence inflationniste — l'IPC global a atteint 3,2 % en glissement annuel en mai 2026, porté par l'essence (+33,2 % en g.a.) [pbo-efo-jun2026][statcan-cpi-may2026][boc-mpr-apr2026].
  5. TOP 3 À SURVEILLER (4–12 semaines) : (a) Décision de taux de la Banque du Canada en juillet 2026 — taux directeur maintenu à 2,25 % avec une inflation dépassant la cible ; (b) Piste de négociation Canada–États-Unis sur les tarifs et tout signal de renégociation de l'ACEUM ; (c) Dynamique de confiance parlementaire à l'approche de la session d'automne [boc-mpr-apr2026][cgai-diplomats-guide-2026].
  6. DÉPENDANCES EXTÉRIEURES : Les États-Unis absorbent environ 75 % des exportations de marchandises canadiennes ; le secteur énergétique est crucial pour les exportations, avec une diversification limitée vers les ports en eaux profondes ; la dette fédérale est principalement détenue au pays, mais sensible aux variations des taux mondiaux ; aucun programme du FMI ni exposition aux sanctions [gac-state-of-trade-2025][imf-can-2025-art4][un-comtrade-canada].
  7. POSTURE DE SÉCURITÉ : La stabilité interne est élevée ; aucune insurrection active ; la GRC et le SCRS gèrent la criminalité organisée, l'ingérence étrangère et les menaces terroristes à des niveaux maîtrisables ; la modernisation de NORAD fait l'objet d'un investissement de 38,6 G$ sur 20 ans ; la souveraineté arctique est une priorité déclarée [dnd-departmental-results-2024-25][freedom-house-canada-2026].
  8. ORIENTATION DIPLOMATIQUE : Le Canada est membre fondateur de l'OTAN, partenaire des Five Eyes, participant au G7 et membre de l'OCDE ; le Partenariat de sécurité et de défense avec l'UE a été activé début 2026 ; le PTPGP et le CETA constituent des cadres commerciaux pour l'Indo-Pacifique et l'Europe ; le fonds souverain Canada Fort (25 G$) marque un tournant vers une diplomatie économique stratégique [cgai-diplomats-guide-2026][gac-trade-diversification][budget-2025-canada-strong].
  9. CONFIANCE DANS LES DONNÉES : Les sections économiques et démographiques sont de HAUTE fiabilité — tirées de Statistique Canada, de la Banque du Canada et du FMI ; la section politique est de HAUTE fiabilité — tirée de Freedom House et de V-Dem ; la section sur la cohésion sociale est de FIABILITÉ MOYENNE — les sondages déclaratifs présentent des biais de sous-dénombrement pour les communautés marginalisées ; la section sécuritaire est de FIABILITÉ MOYENNE — les données opérationnelles du MDN sont partiellement divulguées [imf-can-2025-art4][statcan-gdp-q1-2026][freedom-house-canada-2026][dnd-departmental-results-2024-25].
  10. PERSPECTIVES DE RÉFÉRENCE : Le Canada aborde le second semestre de 2026 avec une production stagnante, une inflation en hausse, un gouvernement minoritaire gérant une contrainte budgétaire induite par les tarifs, et de solides amortisseurs institutionnels qui limitent le risque baissier — le scénario le plus probable est une navigation à vue à croissance lente plutôt qu'une crise ou une accélération [boc-mpr-apr2026][pbo-efo-jun2026][oecd-eo-june2026].
political_powerStructure_en: 'Executive power formally rests with the Crown, exercised by the Prime Minister and Cabinet through the Privy Council. Prime Minister Mark Carney leads a Liberal majority government: the Liberals were returned with a minority at the 28 April 2025 general election (169 seats) and subsequently reached a majority through five floor crossings and a sweep of three by-elections on 13 April 2026, holding 173 of the 343 House of Commons seats as of June 2026 — their first majority since 2019 [ourcommons-party-standings-2026]. The route to that majority — the first time a Canadian prime minister has crossed the threshold partly through floor crossings rather than at an election — is contested by the Conservative Official Opposition as illegitimate; it nonetheless gives the government effective control of the Commons agenda [cbc-carney-majority-byelections-2026]. The bicameral Parliament consists of an elected House of Commons (343 seats since the 2025 redistribution) and an appointed Senate; the Supreme Court of Canada exercises judicial review with full independence and serves as the final court of appeal [freedom-house-canada-2026][wjp-canada-2025]. The Royal Canadian Mounted Police (RCMP) is civilian-directed under the Minister of Public Safety; the Canadian Armed Forces (CAF) are under civilian ministerial control via the Department of National Defence [dnd-departmental-results-2024-25]. Media independence is robust — Freedom House classifies Canada Free in 2026, noting independent broadcasters and print outlets with no direct state ownership of major private media [freedom-house-canada-2026]. Canada ranked 13th of 143 countries on the WJP Rule of Law Index 2025, reflecting strong scores on constraints on government powers and absence of corruption [wjp-canada-2025]. V-Dem classifies Canada as a Liberal Democracy ranked 23rd globally on the Liberal Democracy Index in the 2026 report [vdem-democracy-report-2026].'
political_powerStructure_fr: 'Le pouvoir exécutif réside formellement dans la Couronne, exercé par le Premier ministre et le Cabinet par l''intermédiaire du Conseil privé. Le Premier ministre Mark Carney dirige un gouvernement libéral majoritaire : les libéraux ont été reportés au pouvoir avec une minorité à l''élection générale du 28 avril 2025 (169 sièges), puis ont atteint la majorité grâce à cinq changements d''allégeance et au balayage de trois élections partielles le 13 avril 2026, détenant 173 des 343 sièges de la Chambre des communes en juin 2026 — leur première majorité depuis 2019 [ourcommons-party-standings-2026]. La voie vers cette majorité — la première fois qu''un premier ministre canadien franchit le seuil en partie par des changements d''allégeance plutôt qu''au scrutin — est contestée comme illégitime par l''opposition officielle conservatrice ; elle confère néanmoins au gouvernement un contrôle effectif de l''ordre du jour des Communes [cbc-carney-majority-byelections-2026]. Le Parlement bicaméral comprend une Chambre des communes élue (343 sièges depuis le redécoupage de 2025) et un Sénat nommé ; la Cour suprême du Canada exerce un contrôle judiciaire en toute indépendance et est le tribunal d''appel de dernier ressort [freedom-house-canada-2026][wjp-canada-2025]. La Gendarmerie royale du Canada (GRC) est sous direction civile et relève du ministre de la Sécurité publique ; les Forces armées canadiennes (FAC) sont sous contrôle ministériel civil par l''intermédiaire du ministère de la Défense nationale [dnd-departmental-results-2024-25]. L''indépendance des médias est robuste — Freedom House classe le Canada comme Libre en 2026, notant des diffuseurs indépendants et des imprimés sans propriété d''État directe des grands médias privés [freedom-house-canada-2026]. Le Canada se classe 13e sur 143 pays dans l''Indice d''état de droit du WJP 2025, reflétant de bons résultats sur les contraintes aux pouvoirs gouvernementaux et l''absence de corruption [wjp-canada-2025]. V-Dem classe le Canada comme Démocratie libérale, 23e mondial sur l''Indice de démocratie libérale dans son rapport 2026 [vdem-democracy-report-2026].'
political_stabilityDrivers_en: 'Legitimacy rests on procedural democratic foundations: regular, competitive, monitored elections; an independent judiciary; and constitutional protection of rights under the Charter [freedom-house-canada-2026][vdem-democracy-report-2026]. The Canadian Armed Forces maintain strong institutional loyalty to civilian control with no history of coup attempts; RCMP loyalty to constitutional order is embedded [dnd-departmental-results-2024-25]. The governing Liberal party now commands a working majority, removing the confidence-vote fragility that defined its first year and allowing it to pass legislation without opposition support; the binding constraint shifts from inter-party bargaining to internal discipline across an enlarged, ideologically broad caucus that now includes recent floor-crossers [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026]. Business elite alignment is conditional: the energy sector, financial services, and export manufacturers support macroeconomic stability but increasingly pressure the government on trade diversification, regulatory competitiveness, and US tariff response [imf-can-2025-art4][gac-trade-diversification]. Transparency International''s CPI 2025 places Canada 16th of 182 with a score of 75/100 — an all-time low — flagging perceived erosion in public sector integrity as a soft legitimacy risk [ti-cpi-2025].'
political_stabilityDrivers_fr: 'La légitimité repose sur des fondements démocratiques procéduraux : des élections régulières, compétitives et surveillées ; un pouvoir judiciaire indépendant ; et la protection constitutionnelle des droits par la Charte [freedom-house-canada-2026][vdem-democracy-report-2026]. Les Forces armées canadiennes maintiennent une solide loyauté institutionnelle envers le contrôle civil, sans antécédent de tentative de coup d''État ; la loyauté de la GRC envers l''ordre constitutionnel est ancrée [dnd-departmental-results-2024-25]. Le Parti libéral au pouvoir dispose désormais d''une majorité fonctionnelle, ce qui élimine la fragilité des votes de confiance qui a marqué sa première année et lui permet d''adopter des lois sans l''appui de l''opposition ; la contrainte déterminante passe du marchandage interpartis à la discipline interne d''un caucus élargi et idéologiquement hétérogène, qui compte désormais des transfuges récents [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026]. L''alignement des élites économiques est conditionnel : le secteur énergétique, les services financiers et les fabricants exportateurs soutiennent la stabilité macroéconomique, mais font pression de plus en plus sur le gouvernement concernant la diversification commerciale, la compétitivité réglementaire et la réponse aux tarifs américains [imf-can-2025-art4][gac-trade-diversification]. L''IPC 2025 de Transparency International place le Canada au 16e rang sur 182, avec un score de 75/100 — un creux historique — signalant une érosion perçue de l''intégrité du secteur public comme risque de légitimité douce [ti-cpi-2025].'
political_shockAbsorbers_en: 'Canada''s institutional shock absorbers are substantial: federal transfers and employment insurance automatically cushion regional economic downturns; the Bank of Canada retains rate flexibility with the policy rate at 2.25% and room to cut if activity deteriorates further [boc-mpr-apr2026]; fiscal capacity exists to run elevated deficits (PBO projects $72B / 2.2% of GDP in 2025-26) without triggering a sovereign debt crisis given Canada''s AAA/AA+ credit profile and domestically held debt structure [pbo-efo-jun2026][imf-can-2025-art4]. On the acceleration side, the principal political vulnerability is no longer a confidence-vote collapse but the durability and legitimacy of the majority itself: it rests on a thin margin (173 of 343) and on floor crossings the opposition frames as illegitimate, so defections, further vacancies, or sustained legitimacy attacks could narrow the government''s freedom of action; and the TI CPI all-time-low score of 75/100 signals public-trust erosion that, if it accelerates, could compound that legitimacy strain [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026][ti-cpi-2025]. The combination of rising inflation (3.2% y/y in May 2026) and stagnant output — GDP flat in Q1 2026 after a Q4 2025 contraction — creates a stagflationary corridor where monetary policy tightening to fight inflation worsens fiscal and output stress simultaneously [statcan-gdp-q1-2026][statcan-cpi-may2026][boc-mpr-apr2026].'
political_shockAbsorbers_fr: 'Les amortisseurs institutionnels du Canada sont substantiels : les transferts fédéraux et l''assurance-emploi atténuent automatiquement les ralentissements économiques régionaux ; la Banque du Canada conserve une marge de manœuvre sur les taux avec un taux directeur à 2,25 % et la possibilité de le réduire si l''activité se dégrade davantage [boc-mpr-apr2026] ; la capacité budgétaire permet de creuser des déficits élevés (le DPB projette 72 G$ / 2,2 % du PIB en 2025-2026) sans déclencher de crise de la dette souveraine, compte tenu du profil de crédit AAA/AA+ du Canada et de sa structure de dette à détention nationale [pbo-efo-jun2026][imf-can-2025-art4]. Du côté des accélérateurs d''instabilité, la principale vulnérabilité politique n''est plus l''effondrement d''un vote de confiance mais la durabilité et la légitimité de la majorité elle-même : elle repose sur une marge mince (173 sur 343) et sur des changements d''allégeance que l''opposition qualifie d''illégitimes, de sorte que des défections, de nouvelles vacances ou des attaques soutenues contre sa légitimité pourraient restreindre la marge de manœuvre du gouvernement ; et le score CPI historiquement bas de 75/100 de TI indique une érosion de la confiance publique qui, si elle s''accélère, pourrait aggraver cette tension de légitimité [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026][ti-cpi-2025]. La combinaison d''une inflation en hausse (3,2 % en g.a. en mai 2026) et d''une production stagnante — PIB stable au T1 2026 après une contraction au T4 2025 — crée un corridor stagflationniste où un resserrement de la politique monétaire pour combattre l''inflation aggraverait simultanément le stress budgétaire et la pression sur la production [statcan-gdp-q1-2026][statcan-cpi-may2026][boc-mpr-apr2026].'
economy_macroReality_en: 'Real GDP grew 1.7% in full-year 2025, before decelerating sharply: Q4 2025 contracted 0.6% (annualized) and Q1 2026 was flat (0.0% change) [gac-quarterly-trade-spring2026][statcan-gdp-q1-2026]. The Bank of Canada projects 1.2% growth for full-year 2026; the PBO''s independent projection is 1.1% treating US tariffs as permanent; the OECD''s June 2026 forecast is also 1.2% in 2026 rising to 1.7% in 2027 [boc-mpr-apr2026][pbo-efo-jun2026][oecd-eo-june2026]. Inflation rose to 3.2% y/y in May 2026 — above the Bank of Canada''s 2% target — driven primarily by gasoline prices (+33.2% y/y) and food price acceleration; the BoC projects inflation easing back to 2% in 2027 [statcan-cpi-may2026][boc-mpr-apr2026]. The policy rate is held at 2.25% as of the April 2026 Monetary Policy Report, reflecting the tension between fighting above-target inflation and not exacerbating growth weakness [boc-mpr-apr2026]. The federal fiscal deficit is contested between government and watchdog: the Spring Economic Update 2026 projects $65.3B (1.9% of GDP) in FY2026-27; the PBO''s June 2026 figure for FY2025-26 is $72B (2.2% of GDP) [seu-2026][pbo-efo-jun2026]. Budget 2025 introduced an $81.8B defence spending commitment over five years and a $25B Canada Strong sovereign wealth fund [budget-2025-canada-strong]. Labour market conditions improved in May 2026: employment rose 88,000 (+0.4%), unemployment rate fell to 6.6%, and the employment rate reached 60.7% [statcan-lfs-may2026]. The IMF''s January 2026 Article IV report assessed Canada''s medium-term fiscal and monetary fundamentals as sound, flagging US trade exposure as the primary structural vulnerability [imf-can-2025-art4].'
economy_macroReality_fr: 'Le PIB réel a progressé de 1,7 % pour l''ensemble de l''année 2025, avant de ralentir fortement : le T4 2025 s''est contracté de 0,6 % (annualisé) et le T1 2026 est resté stable (variation de 0,0 %) [gac-quarterly-trade-spring2026][statcan-gdp-q1-2026]. La Banque du Canada projette une croissance de 1,2 % pour l''année complète 2026 ; la projection indépendante du DPB est de 1,1 % en supposant que les tarifs américains sont permanents ; les prévisions de l''OCDE de juin 2026 sont également de 1,2 % en 2026, avec une progression à 1,7 % en 2027 [boc-mpr-apr2026][pbo-efo-jun2026][oecd-eo-june2026]. L''inflation a atteint 3,2 % en g.a. en mai 2026 — au-dessus de la cible de 2 % de la Banque du Canada — portée principalement par les prix de l''essence (+33,2 % en g.a.) et l''accélération des prix alimentaires ; la BdC projette un retour de l''inflation à 2 % en 2027 [statcan-cpi-may2026][boc-mpr-apr2026]. Le taux directeur est maintenu à 2,25 % au Rapport sur la politique monétaire d''avril 2026, reflétant la tension entre la lutte contre une inflation supérieure à la cible et le fait de ne pas aggraver la faiblesse de la croissance [boc-mpr-apr2026]. Le déficit budgétaire fédéral est contesté entre le gouvernement et le chien de garde : la Mise à jour économique du printemps 2026 projette 65,3 G$ (1,9 % du PIB) pour l''exercice 2026-2027 ; le chiffre du DPB pour l''exercice 2025-2026 est de 72 G$ (2,2 % du PIB) [seu-2026][pbo-efo-jun2026]. Le budget 2025 a engagé 81,8 G$ en dépenses de défense sur cinq ans et un fonds souverain Canada Fort de 25 G$ [budget-2025-canada-strong]. Les conditions du marché du travail se sont améliorées en mai 2026 : l''emploi a progressé de 88 000 (+0,4 %), le taux de chômage a reculé à 6,6 % et le taux d''emploi a atteint 60,7 % [statcan-lfs-may2026]. Le rapport Article IV du FMI de janvier 2026 a évalué comme sains les fondamentaux budgétaires et monétaires à moyen terme du Canada, signalant l''exposition commerciale aux États-Unis comme la principale vulnérabilité structurelle [imf-can-2025-art4].'
economy_externalVulnerability_en: 'Canada''s export base is resource-intensive and geographically concentrated. Total goods exports reached $997B and imports exceeded $1T in 2024 [gac-state-of-trade-2025]. The United States is the dominant trade partner, absorbing approximately 75% of Canadian merchandise exports — energy, vehicles, machinery, and forest products are the top commodity groups [gac-state-of-trade-2025][un-comtrade-canada][statcan-international-trade]. April 2026 monthly total trade stood at $92.9B [statcan-international-trade]. This concentration creates acute tariff vulnerability: US tariff measures imposed in 2025-26 are treated by the PBO as permanent, directly driving the 2.2% of GDP deficit projection and 1.1% growth ceiling for 2026 [pbo-efo-jun2026]. Canada is pursuing trade diversification through 15 free trade agreements covering 51 countries, with the CPTPP (Indo-Pacific) and CETA (Europe) as the primary diversification levers [gac-trade-diversification]. No IMF program is in place; Canada is not subject to international sanctions. Sovereign debt is held predominantly by domestic institutional investors, limiting foreign creditor exposure, though global interest rate movements affect rollover costs [imf-can-2025-art4].'
economy_externalVulnerability_fr: 'La base exportatrice du Canada est à forte intensité de ressources et géographiquement concentrée. Les exportations totales de marchandises ont atteint 997 G$ et les importations ont dépassé 1 000 G$ en 2024 [gac-state-of-trade-2025]. Les États-Unis sont le principal partenaire commercial, absorbant environ 75 % des exportations canadiennes de marchandises — énergie, véhicules, machines et produits forestiers constituent les principaux groupes de produits [gac-state-of-trade-2025][un-comtrade-canada][statcan-international-trade]. Le commerce mensuel total d''avril 2026 s''élevait à 92,9 G$ [statcan-international-trade]. Cette concentration crée une vulnérabilité tarifaire aiguë : les mesures tarifaires américaines imposées en 2025-2026 sont traitées par le DPB comme permanentes, pesant directement sur la projection de déficit à 2,2 % du PIB et le plafond de croissance de 1,1 % pour 2026 [pbo-efo-jun2026]. Le Canada poursuit la diversification de ses échanges grâce à 15 accords de libre-échange couvrant 51 pays, avec le PTPGP (Indo-Pacifique) et le CETA (Europe) comme principaux leviers de diversification [gac-trade-diversification]. Aucun programme du FMI n''est en vigueur ; le Canada n''est pas soumis à des sanctions internationales. La dette souveraine est principalement détenue par des investisseurs institutionnels nationaux, ce qui limite l''exposition aux créanciers étrangers, bien que les mouvements des taux d''intérêt mondiaux affectent les coûts de refinancement [imf-can-2025-art4].'
economy_politicalEconomy_en: 'The current economic model primarily benefits large energy producers, the financial services sector, and the real estate industry, all of which operate in markets with high barriers to entry and are aligned with macroeconomic stability. Resource-export rents are politically distributed through provincial equalization, sustaining regional elite coalitions in Alberta and Saskatchewan alongside the federal government [imf-can-2025-art4][gac-state-of-trade-2025]. Reforms that are technically necessary — productivity enhancement via business investment tax reform, labour market flexibility, housing supply deregulation, and pipeline-to-tidewater capacity — face political resistance from environmental, labour, and urban housing-price constituencies respectively [imf-can-2025-art4][oecd-eo-june2026]. Budget 2025 signalled a productivity agenda via a super-deduction and the Canada Strong sovereign wealth fund ($25B), but implementation depends on minority Parliament survival [budget-2025-canada-strong]. Immigration-driven demand has sustained housing prices and consumer spending but is now contracting: the PBO''s February 2026 analysis projects that the 2026-2028 immigration levels plan — targeting 380,000 annual permanent residents — and reduction of the non-permanent resident (NPR) population to under 5% of the population by end-2027 will materially reduce population-driven demand [pbo-ircc-immigration-demographic].'
economy_politicalEconomy_fr: 'Le modèle économique actuel profite principalement aux grands producteurs d''énergie, au secteur des services financiers et au secteur immobilier, qui opèrent tous dans des marchés à fortes barrières à l''entrée et sont alignés sur la stabilité macroéconomique. Les rentes d''exportation des ressources sont redistribuées politiquement par la péréquation provinciale, soutenant des coalitions d''élites régionales en Alberta et en Saskatchewan parallèlement au gouvernement fédéral [imf-can-2025-art4][gac-state-of-trade-2025]. Les réformes techniquement nécessaires — amélioration de la productivité par la réforme fiscale de l''investissement des entreprises, flexibilité du marché du travail, déréglementation de l''offre de logements et capacité de pipelines vers les eaux profondes — se heurtent à des résistances politiques de la part de groupes environnementaux, syndicaux et de défenseurs des prix immobiliers urbains respectivement [imf-can-2025-art4][oecd-eo-june2026]. Le budget 2025 a signalé un programme de productivité via une super-déduction et le fonds souverain Canada Fort (25 G$), mais la mise en œuvre dépend de la survie du Parlement minoritaire [budget-2025-canada-strong]. La demande portée par l''immigration a soutenu les prix immobiliers et la consommation, mais se contracte désormais : l''analyse du DPB de février 2026 projette que le plan des niveaux d''immigration 2026-2028 — ciblant 380 000 résidents permanents annuels — et la réduction de la population de résidents non permanents (RNP) à moins de 5 % de la population d''ici fin 2027 réduiront matériellement la demande portée par la population [pbo-ircc-immigration-demographic].'
society_demographics_en: 'Canada''s population stood at 41,651,653 on July 1, 2025 [statcan-pop-age-jul2025], declining to 41,472,081 by Q1 2026 — the first annual population decline in Canadian history, driven by the government''s policy-driven reduction of non-permanent residents [statcan-pop-quarterly][pbo-ircc-immigration-demographic]. This reversal follows a decade of immigration-fuelled growth and signals a structural demographic inflection point. Long-range projections show Canada reaching 57.4M under a moderate scenario by 2075, but outcomes depend heavily on immigration policy continuity [statcan-pop-projections-2026]. Canada is an aging society: the median age trend is upward and dependency ratios are increasing as Baby Boomers exit the labour force, placing pressure on pension and health-care systems [statcan-pop-age-jul2025]. Urban concentration is high — the majority of the population is concentrated in the Greater Toronto Area, Montréal, Vancouver, and Calgary census metropolitan areas. Internal migration flows toward energy-producing provinces (Alberta) and away from high-cost cities remain a structural dynamic. The NPR population reduction plan targets fewer than 5% of total population as non-permanent residents by end-2027 [pbo-ircc-immigration-demographic].'
society_demographics_fr: 'La population du Canada s''élevait à 41 651 653 personnes le 1er juillet 2025 [statcan-pop-age-jul2025], pour diminuer à 41 472 081 au T1 2026 — première baisse annuelle de la population dans l''histoire canadienne, liée à la réduction des résidents non permanents par la politique gouvernementale [statcan-pop-quarterly][pbo-ircc-immigration-demographic]. Ce renversement fait suite à une décennie de croissance alimentée par l''immigration et signale un point d''inflexion démographique structurel. Les projections à long terme montrent que le Canada pourrait atteindre 57,4 M d''habitants dans un scénario modéré d''ici 2075, mais les résultats dépendent fortement de la continuité de la politique d''immigration [statcan-pop-projections-2026]. Le Canada est une société vieillissante : la tendance à la hausse de l''âge médian et l''augmentation des ratios de dépendance, à mesure que les baby-boomers quittent le marché du travail, exercent des pressions sur les systèmes de retraite et de soins de santé [statcan-pop-age-jul2025]. La concentration urbaine est élevée — la majorité de la population est concentrée dans les régions métropolitaines de recensement du Grand Toronto, de Montréal, de Vancouver et de Calgary. Les flux de migration interne vers les provinces productrices d''énergie (Alberta) et au départ des grandes villes à coût élevé restent une dynamique structurelle. Le plan de réduction de la population des RNP vise moins de 5 % de la population totale comme résidents non permanents d''ici fin 2027 [pbo-ircc-immigration-demographic].'
society_composition_en: 'Canada''s society is ethnically diverse and officially bilingual. The 2021 Census shows English as the first official language spoken by 75.5% of the population and French by 21.4% [statcan-2021-census-language]. The census recorded 5.0% of the population identifying as Indigenous (First Nations, Métis, and Inuit) — approximately 1.8 million persons [statcan-2021-indigenous-profile]. Ethnocultural diversity is accelerating through immigration, with visible minority populations concentrated in major metropolitan areas [statcan-2021-census-ethno-religion]. The principal fault-line geometry is as follows: the English/French linguistic cleavage runs roughly along provincial lines (Quebec vs. rest-of-Canada) and is reinforced by distinct legal traditions (civil law in Quebec, common law elsewhere), distinct cultural institutions, and periodic sovereignty debates. The Indigenous/non-Indigenous cleavage is separate in geography (reserve communities vs. urban centres), governance demands (inherent rights, treaties), and socioeconomic outcomes. These two major cleavages are CROSS-CUTTING with respect to each other — Francophone Quebecers and Anglophone Canadians do not line up predictably on Indigenous issues; nor does the Indigenous population align with either linguistic bloc — which structurally diffuses rather than compounds inter-group tension. Ethnocultural immigrant communities add further cross-cutting diversity within both linguistic groups [statcan-2021-census-language][statcan-2021-indigenous-profile][statcan-2021-census-ethno-religion].'
society_composition_fr: 'La société canadienne est ethniquement diversifiée et officiellement bilingue. Le recensement de 2021 montre que l''anglais est la première langue officielle parlée par 75,5 % de la population et le français par 21,4 % [statcan-2021-census-language]. Le recensement a recensé 5,0 % de la population s''identifiant comme autochtone (Premières Nations, Métis et Inuit) — environ 1,8 million de personnes [statcan-2021-indigenous-profile]. La diversité ethnoculturelle s''accélère grâce à l''immigration, avec des populations de minorités visibles concentrées dans les grandes zones métropolitaines [statcan-2021-census-ethno-religion]. La géométrie des principales lignes de fracture est la suivante : le clivage linguistique anglais/français s''étend approximativement le long des frontières provinciales (Québec contre reste du Canada) et est renforcé par des traditions juridiques distinctes (droit civil au Québec, common law ailleurs), des institutions culturelles distinctes et des débats périodiques sur la souveraineté. Le clivage autochtone/non-autochtone est distinct sur le plan géographique (communautés de réserves vs. centres urbains), des revendications de gouvernance (droits inhérents, traités) et des résultats socioéconomiques. Ces deux principaux clivages sont ENTRECROISÉS l''un par rapport à l''autre — les Québécois francophones et les Canadiens anglophones ne s''alignent pas de manière prévisible sur les questions autochtones ; la population autochtone ne s''aligne non plus avec l''un ou l''autre des blocs linguistiques — ce qui diffuse structurellement plutôt qu''amplifie les tensions intergroupes. Les communautés d''immigrants ethnoculturels ajoutent une diversité entrecroisée supplémentaire au sein des deux groupes linguistiques [statcan-2021-census-language][statcan-2021-indigenous-profile][statcan-2021-census-ethno-religion].'
society_religion_en: 'SOURCE AND BIAS NOTE: The primary source for Canadian religious composition is the 2021 Census ethnocultural and religious diversity hub (Statistics Canada) [statcan-2021-census-ethno-religion]. Pew Research Center''s 2020 modelled estimates provide a cross-check [pew-religious-composition-2020]. Both sources converge on approximately 53% Christian and 35% non-affiliated. The census is self-declared and voluntary for religion; it is known to undercount practising believers in some non-Christian traditions who may not recognize Western religious category labels, and to overcount ''Christian'' among cultural but non-practising adherents. Pew models are modelled estimates with their own confidence intervals. (a) COMPOSITION: ~53% Christian (Catholic approximately 38%, Protestant and other Christian ~15%); ~35% no religious affiliation; ~5% Muslim; ~1.5% Hindu; remaining ~5% includes Sikh, Buddhist, Jewish, and Indigenous spiritual traditions — all figures approximate to 2020-2021 [statcan-2021-census-ethno-religion][pew-religious-composition-2020]. The Catholic/Protestant fault line within Christianity is historically significant (French Catholic Quebec vs. British Protestant English Canada) but has materially faded as a political cleavage since the Quiet Revolution. The growing Muslim and Hindu communities are metropolitan and generationally young, with no political organisation along religious lines. (b) LIVED TEXTURE: Indigenous spiritual traditions (sweats, ceremonies, sacred sites) are practised alongside or instead of Catholic/Christian affiliations formally recorded in census data — the 2021 Indigenous profile records formal affiliation but does not capture syncretic practice [statcan-2021-indigenous-profile]. (c) POLITICAL SALIENCE: Low. Canada is a secular state; no parallel religious authority structures political life; faith-based mobilisation is marginal in federal electoral politics; religious observance is high in immigrant communities but does not translate into bloc political mobilisation at scale [freedom-house-canada-2026][statcan-2021-census-ethno-religion].'
society_religion_fr: 'NOTE SUR LES SOURCES ET BIAIS : La principale source pour la composition religieuse du Canada est le carrefour thématique du recensement de 2021 sur la diversité ethnoculturelle et religieuse (Statistique Canada) [statcan-2021-census-ethno-religion]. Les estimations modélisées du Pew Research Center pour 2020 fournissent une vérification croisée [pew-religious-composition-2020]. Les deux sources convergent vers environ 53 % de chrétiens et 35 % de sans appartenance. Le recensement est autodéclaré et volontaire pour la religion ; il est connu pour sous-dénombrer les croyants pratiquants dans certaines traditions non chrétiennes qui peuvent ne pas reconnaître les étiquettes de catégories religieuses occidentales, et pour surestimer les « chrétiens » parmi les adhérents culturels non pratiquants. Les modèles Pew sont des estimations avec leurs propres intervalles de confiance. (a) COMPOSITION : ~53 % chrétiens (catholiques environ 38 %, protestants et autres chrétiens ~15 %) ; ~35 % sans affiliation religieuse ; ~5 % musulmans ; ~1,5 % hindous ; les ~5 % restants comprennent les sikhs, bouddhistes, juifs et traditions spirituelles autochtones — tous les chiffres sont approximatifs pour 2020-2021 [statcan-2021-census-ethno-religion][pew-religious-composition-2020]. La ligne de fracture catholique/protestante au sein du christianisme est historiquement significative (Québec catholique français vs. Canada anglais protestant britannique), mais a matériellement diminué en tant que clivage politique depuis la Révolution tranquille. Les communautés musulmane et hindoue en croissance sont métropolitaines et jeunes, sans organisation politique sur des bases religieuses. (b) TEXTURE VÉCUE : Les traditions spirituelles autochtones (cérémonies, sudatoires, sites sacrés) sont pratiquées parallèlement ou à la place des affiliations catholiques/chrétiennes formellement enregistrées dans les données du recensement — le profil autochtone de 2021 enregistre l''affiliation formelle mais ne saisit pas la pratique syncrétique [statcan-2021-indigenous-profile]. (c) SAILLANCE POLITIQUE : Faible. Le Canada est un État laïc ; aucune structure d''autorité religieuse parallèle ne structure la vie politique ; la mobilisation confessionnelle est marginale dans la politique électorale fédérale ; la pratique religieuse est élevée dans les communautés immigrantes mais ne se traduit pas par une mobilisation politique en bloc à grande échelle [freedom-house-canada-2026][statcan-2021-census-ethno-religion].'
society_cohesion_en: 'Citizen self-report data is the primary instrument here. Statistics Canada''s Canadian Social Survey Q4 2024 (November–December 2024) shows measurable erosion in institutional confidence — confidence in the federal government, courts, police, and media all recorded negative trends [statcan-css-trust-institutions-q4-2024]. Interpersonal trust data from the same survey cycle shows 43.5% of Canadians reported that most people can be trusted in Q4 2024 [statcan-css-trust-others] — a moderate figure by international standards that places Canada in the mid-range among OECD liberal democracies. World Values Survey Wave 7 (Canada, fieldwork 2017-2022) provides the underlying self-report microdata on trust, national identity, and political values, confirming persistent social capital at the population level but widening values polarisation between metropolitan and non-metropolitan populations and between different generational cohorts [wvs-canada-wave7]. Canada scores 75/100 on Transparency International''s CPI 2025 — an all-time low — signalling that perceived institutional integrity is softening, which reinforces the institutional trust erosion story [ti-cpi-2025]. The society''s self-conception remains strongly identified with pluralism, bilingualism, and multicultural civic identity, but housing affordability stress, cost-of-living pressures, and immigration-volume debates are introducing new strain on the normative consensus [statcan-css-trust-institutions-q4-2024][wvs-canada-wave7].'
society_cohesion_fr: 'Les données autodéclarées des citoyens constituent ici l''instrument principal. L''Enquête sociale canadienne (ESC) du T4 2024 de Statistique Canada (novembre–décembre 2024) montre une érosion mesurable de la confiance institutionnelle — la confiance envers le gouvernement fédéral, les tribunaux, la police et les médias ont toutes enregistré des tendances négatives [statcan-css-trust-institutions-q4-2024]. Les données sur la confiance interpersonnelle du même cycle d''enquête montrent que 43,5 % des Canadiens estimaient que la plupart des gens peuvent être fiables au T4 2024 [statcan-css-trust-others] — un chiffre modéré par rapport aux normes internationales, qui place le Canada dans la moyenne des démocraties libérales de l''OCDE. L''enquête mondiale sur les valeurs Vague 7 (Canada, terrain 2017-2022) fournit les microdonnées autodéclarées sur la confiance, l''identité nationale et les valeurs politiques, confirmant un capital social persistant au niveau de la population mais une polarisation croissante des valeurs entre populations métropolitaines et non métropolitaines, et entre différentes cohortes générationnelles [wvs-canada-wave7]. Le Canada obtient 75/100 à l''IPC 2025 de Transparency International — un creux historique — signalant que l''intégrité institutionnelle perçue s''affaiblit, ce qui renforce le récit d''érosion de la confiance institutionnelle [ti-cpi-2025]. L''auto-conception de la société reste fortement identifiée au pluralisme, au bilinguisme et à l''identité civique multiculturelle, mais le stress lié à l''abordabilité du logement, les pressions liées au coût de la vie et les débats sur le volume d''immigration introduisent de nouvelles tensions dans le consensus normatif [statcan-css-trust-institutions-q4-2024][wvs-canada-wave7].'
security_internal_en: 'Canada faces no active insurgency and no conventional armed threat to territorial control. Organized crime — particularly transnational drug trafficking (fentanyl supply chains), money laundering through real estate, and gang activity in urban centres — is the primary public safety concern managed by the RCMP and provincial police services [freedom-house-canada-2026][dnd-departmental-results-2024-25]. Foreign interference, particularly from China, India, and Russia, targeting diaspora communities and electoral processes, has been a declared national security concern as documented in parliamentary testimony and public CSIS annual reports; Freedom House notes this as a challenge to political rights in its 2026 assessment [freedom-house-canada-2026]. Terrorism threat levels are assessed as medium — no major attack in the assessed period; lone-actor and ideologically motivated violence remain latent threats [freedom-house-canada-2026]. The Canadian Armed Forces (CAF) number approximately 68,000 regular force members; loyalty to civilian control is unquestioned and institutionally embedded [dnd-departmental-results-2024-25]. NORAD modernization investment totals $38.6B over 20 years and Arctic surveillance capacity is being expanded, with new radar networks and icebreaker procurement as declared priorities [dnd-departmental-results-2024-25]. The US–Canada border is the world''s longest undefended border; it remains operationally open with periodic irregular migration pressure points, managed through bilateral law enforcement cooperation rather than militarization [freedom-house-canada-2026].'
security_internal_fr: 'Le Canada ne fait face à aucune insurrection active ni à aucune menace armée conventionnelle contre son intégrité territoriale. La criminalité organisée — notamment le trafic transnational de drogues (chaînes d''approvisionnement en fentanyl), le blanchiment d''argent par l''immobilier et les activités de gangs dans les centres urbains — est la principale préoccupation de sécurité publique gérée par la GRC et les services de police provinciaux [freedom-house-canada-2026][dnd-departmental-results-2024-25]. L''ingérence étrangère, notamment de la Chine, de l''Inde et de la Russie, ciblant les communautés diasporiques et les processus électoraux, a été une préoccupation de sécurité nationale déclarée, documentée dans des témoignages parlementaires et les rapports annuels publics du SCRS ; Freedom House note ce défi aux droits politiques dans son évaluation 2026 [freedom-house-canada-2026]. Les niveaux de menace terroriste sont évalués comme moyens — aucune attaque majeure dans la période évaluée ; la violence perpétrée par des acteurs isolés et idéologiquement motivés reste une menace latente [freedom-house-canada-2026]. Les Forces armées canadiennes (FAC) comptent environ 68 000 membres de la force régulière ; la loyauté envers le contrôle civil est incontestée et institutionnellement ancrée [dnd-departmental-results-2024-25]. L''investissement dans la modernisation de NORAD totalise 38,6 G$ sur 20 ans et la capacité de surveillance dans l''Arctique est en cours d''expansion, avec de nouveaux réseaux radar et l''acquisition de brise-glaces comme priorités déclarées [dnd-departmental-results-2024-25]. La frontière entre les États-Unis et le Canada est la plus longue frontière non fortifiée du monde ; elle reste opérationnellement ouverte avec des points de pression périodiques liés à la migration irrégulière, gérés par une coopération bilatérale des forces de l''ordre plutôt que par une militarisation [freedom-house-canada-2026].'
security_diplomacy_en: 'Canada''s treaty alliance architecture centres on NATO (founding member), NORAD (bilateral defence with the US), and the Five Eyes intelligence-sharing network [cgai-diplomats-guide-2026][dnd-departmental-results-2024-25]. Canada activated an EU Security and Defence Partnership in early 2026, representing a structural diversification of its security relationships beyond the US bilateral frame [cgai-diplomats-guide-2026]. Key bilateral relationships: (1) United States — the dominant partner on trade, defence, and border management, currently under structural stress due to tariff disputes; (2) United Kingdom — Five Eyes and Commonwealth partner; (3) European Union — CETA trade framework and new security partnership; (4) China — transactional trade relationship with elevated foreign interference and human rights tension; (5) Indo-Pacific partners — CPTPP engagement with Japan, Australia, and others [cgai-diplomats-guide-2026][gac-trade-diversification]. Regional flashpoints relevant to Canada: Arctic sovereignty and resource access, where Canada competes diplomatically with Russia and Denmark/Kingdom of Denmark (Greenland) and increasingly with China''s Arctic ambitions; and the Canada–US trade dispute, which is the primary bilateral flashpoint in 2026 [cgai-diplomats-guide-2026][dnd-departmental-results-2024-25]. Canada holds G7, G20, OECD, Commonwealth, and La Francophonie memberships, providing multilateral influence beyond its military weight [cgai-diplomats-guide-2026]. The PBO''s defence capital analysis confirms Canada''s NATO 2% GDP commitment pathway requires $322.9B in total DND capital spending over 20 years [pbo-defence-capital-2025].'
security_diplomacy_fr: 'L''architecture d''alliances conventionnelles du Canada est centrée sur l''OTAN (membre fondateur), NORAD (défense bilatérale avec les États-Unis) et le réseau de partage de renseignements Five Eyes [cgai-diplomats-guide-2026][dnd-departmental-results-2024-25]. Le Canada a activé un Partenariat de sécurité et de défense avec l''UE début 2026, représentant une diversification structurelle de ses relations de sécurité au-delà du cadre bilatéral américain [cgai-diplomats-guide-2026]. Principales relations bilatérales : (1) États-Unis — partenaire dominant en matière de commerce, de défense et de gestion des frontières, actuellement sous pression structurelle en raison des différends tarifaires ; (2) Royaume-Uni — partenaire Five Eyes et du Commonwealth ; (3) Union européenne — cadre commercial du CETA et nouveau partenariat de sécurité ; (4) Chine — relation commerciale transactionnelle avec des tensions élevées concernant l''ingérence étrangère et les droits de la personne ; (5) Partenaires indo-pacifiques — engagement dans le PTPGP avec le Japon, l''Australie et d''autres [cgai-diplomats-guide-2026][gac-trade-diversification]. Points de friction régionaux pertinents pour le Canada : la souveraineté arctique et l''accès aux ressources, où le Canada rivalise diplomatiquement avec la Russie et le Danemark/Royaume du Danemark (Groenland) et de plus en plus avec les ambitions arctiques de la Chine ; et le différend commercial Canada–États-Unis, qui est le principal point de friction bilatéral en 2026 [cgai-diplomats-guide-2026][dnd-departmental-results-2024-25]. Le Canada est membre du G7, du G20, de l''OCDE, du Commonwealth et de la Francophonie, ce qui lui confère une influence multilatérale au-delà de son poids militaire [cgai-diplomats-guide-2026]. L''analyse des dépenses en capital de défense du DPB confirme que la trajectoire d''engagement de 2 % du PIB du Canada envers l''OTAN nécessite 322,9 G$ de dépenses en capital totales du MDN sur 20 ans [pbo-defence-capital-2025].'
