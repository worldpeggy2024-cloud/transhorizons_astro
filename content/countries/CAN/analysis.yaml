      "rationale_en": "A single-party government with working control of the House and no faction contesting the federal order, carrying two contained strains : a vertical fracture with Alberta, whose 19 October 2026 referendum puts a separation-process question on the ballot (though the result is not binding, the Premier campaigns for remaining, and the courts have twice halted the citizen-petition route on Indigenous treaty grounds), and a thin route to majority, crossed between elections and rejected as illegitimate by the Official Opposition.",
