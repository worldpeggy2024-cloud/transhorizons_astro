      "mitigants": "La majorité élimine la fragilité liée à un vote de confiance unique et donne davantage de latitude législative pour la durée de la législature actuelle, sous réserve du maintien de cette majorité; le caucus élargi offre un coussin numérique; stabilité institutionnelle du Parlement lui-même [ourcommons-party-standings-2026][freedom-house-canada-2026]"
    },
    {
      "title": "Fracture de la cohésion sociale liée à l'accessibilité au logement",
      "trigger": "Les prix immobiliers restent structurellement inabordables dans les grandes villes malgré les corrections côté demande; le grief d'équité intergénérationnelle s'intensifie; le stress lié au coût de la vie accélère l'érosion de la confiance institutionnelle",
