risks_en: |-
  [
    {
      "title": "Permanent US Tariff Lock-In and CUSMA Erosion",
      "trigger": "US administration maintains or expands tariff regime; CUSMA 2026 review produces no relief or precipitates renegotiation on terms unfavourable to Canada",
      "probability": "High",
      "impact": "High",
      "timeHorizon": "6–18 months",
      "leadingIndicators": "CUSMA review negotiation signals; US Congressional trade statements; Canadian export volume data from Statistics Canada International Trade portal [statcan-international-trade]; PBO quarterly fiscal updates showing tariff-driven deficit expansion [pbo-efo-jun2026]",
      "mitigants": "Trade diversification through CPTPP and CETA [gac-trade-diversification]; Canada Strong sovereign wealth fund ($25B) for strategic investment [budget-2025-canada-strong][pmo-canada-strong-fund-2026][seu-2026]; diplomatic engagement through G7 and bilateral channels [cgai-diplomats-guide-2026]"
    },
    {
      "title": "Stagflationary Monetary Policy Trap",
      "trigger": "CPI remains above 3% while GDP growth stalls below 1%; Bank of Canada forced to choose between fighting inflation and avoiding recession",
      "probability": "Med",
      "impact": "High",
      "timeHorizon": "3–12 months",
      "leadingIndicators": "Monthly CPI releases (currently 3.2% in May 2026) [statcan-cpi-may2026]; quarterly GDP accounts (Q1 2026 flat) [statcan-gdp-q1-2026]; BoC rate decisions and forward guidance [boc-mpr-apr2026]",
      "mitigants": "BoC credible inflation-targeting framework; fiscal automatic stabilizers; employment resilience (unemployment 6.6%, employment rate 60.7% in May 2026) [statcan-lfs-may2026]"
    },
    {
      "title": "Thin Majority Erosion and Legitimacy Contestation",
      "trigger": "Liberal defections, by-election losses, or further vacancies erode the narrow majority (173 of 343); sustained opposition and provincial framing of the floor-crossing majority as illegitimate constrains the government's effective mandate",
      "probability": "Med",
      "impact": "Med",
      "timeHorizon": "6–24 months",
      "leadingIndicators": "House standings and vacancy count; pace and outcomes of by-elections; cohesion of the enlarged Liberal caucus including recent floor-crossers; opposition and provincial messaging on the majority's legitimacy [ourcommons-party-standings-2026][ourcommons-membership-changes]",
      "mitigants": "Majority removes single-vote confidence fragility and gives a freer legislative hand through the current Parliament, conditional on holding the majority; broad caucus provides a numerical cushion; institutional stability of Parliament itself [ourcommons-party-standings-2026][freedom-house-canada-2026]"
    },
    {
      "title": "Housing Affordability and Social Cohesion Fracture",
      "trigger": "Housing prices remain structurally unaffordable in major metros despite demand-side corrections; generational equity grievance intensifies; cost-of-living stress accelerates institutional trust erosion",
      "probability": "High",
      "impact": "Med",
      "timeHorizon": "6–24 months",
      "leadingIndicators": "Statistics Canada CSS institutional confidence data [statcan-css-trust-institutions-q4-2024]; interpersonal trust indicators (43.5% most people trusted in Q4 2024) [statcan-css-trust-others]; CPI food and shelter components [statcan-cpi-may2026]; population decline trend [statcan-pop-quarterly]",
      "mitigants": "Budget 2025 housing supply agenda [budget-2025-canada-strong][seu-2026]; NPR population reduction dampening demand pressure [pbo-ircc-immigration-demographic]; Bank of Canada rate policy eventual easing [boc-mpr-apr2026]"
    },
    {
      "title": "Arctic Sovereignty and Defence Credibility Challenge",
      "trigger": "Accelerated Russian or Chinese Arctic activity tests NORAD response; NATO partners raise formal burden-sharing concerns; delayed delivery of NORAD modernization milestones",
      "probability": "Med",
      "impact": "Med",
      "timeHorizon": "12–36 months",
      "leadingIndicators": "DND Departmental Results milestones on NORAD modernization [dnd-departmental-results-2024-25]; whether the government actually spends its defence-capital budget on schedule, measured against the Parliamentary Budget Officer's $322.9 billion 20-year estimate [pbo-defence-capital-2025]; NATO annual burden-sharing assessments; SIPRI military expenditure data against 2% GDP benchmark [sipri-milex-2025]",
      "mitigants": "$38.6B NORAD modernization investment commitment [dnd-departmental-results-2024-25]; $81.8B Budget 2025 defence package [budget-2025-canada-strong]; EU Security and Defence Partnership activation [cgai-diplomats-guide-2026]"
    },
    {
      "title": "Fiscal Deficit Overshoot and Debt Sustainability Pressure",
      "trigger": "PBO's $72B deficit forecast (2.2% of GDP) proves conservative if tariff headwinds deepen; defence and social spending commitments crowd out fiscal consolidation",
      "probability": "Med",
      "impact": "Med",
      "timeHorizon": "12–24 months",
      "leadingIndicators": "PBO quarterly fiscal monitoring [pbo-efo-jun2026]; Spring Economic Update vs. Autumn Statement divergence [seu-2026]; credit rating agency reviews; debt/GDP trajectory from IMF Article IV [imf-can-2025-art4]",
      "mitigants": "Canada's domestically held debt structure limits external creditor vulnerability [imf-can-2025-art4]; BoC policy flexibility; AAA/AA+ credit profile provides buffer; automatic fiscal stabilizers"
    },
    {
      "title": "Institutional Trust Erosion and Democratic Backsliding Risk",
      "trigger": "Transparency International's corruption ranking continues to slip (16th of 182, its lowest to date, score in gradual decline since 2012); foreign-interference concerns escalate; the floor-crossing majority's legitimacy remains contested; re-partisanization of Senate appointments (July 2026 removal of the non-partisan criterion) [pmo-senate-2026]",
      "probability": "Low",
      "impact": "Med",
      "timeHorizon": "12–36 months",
      "leadingIndicators": "TI CPI annual releases [ti-cpi-2025]; Freedom House annual assessments [freedom-house-canada-2026]; V-Dem Liberal Democracy Index score [vdem-democracy-report-2026]; WJP Rule of Law Index sub-scores [wjp-canada-2025]; CSS institutional confidence survey waves [statcan-css-trust-institutions-q4-2024]",
      "mitigants": "Canada ranked 13th of 143 on WJP Rule of Law Index 2025 [wjp-canada-2025]; V-Dem classifies Canada as Liberal Democracy ranked 23rd globally [vdem-democracy-report-2026]; Freedom House 2026 classification as Free [freedom-house-canada-2026]; independent judiciary and Charter protections"
    }
  ]
risks_fr: |-
  [
