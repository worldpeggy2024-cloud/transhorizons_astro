      "interests": "Faire avancer les intérêts du Québec (langue, culture, autonomie de compétences, autonomie en matière de pensions) à l'échelon fédéral",
      "resources": "Base électorale québécoise concentrée (~30 sièges et plus en conditions favorables; 21 à l'heure actuelle [ourcommons-party-standings-2026])",
      "constraints": "Une majorité libérale retire au Bloc le rapport de force qu'il détenait sous la minorité précédente : il ne peut plus défaire le gouvernement ni trancher les dossiers québécois par ses voix [ourcommons-party-standings-2026]; l'électorat québécois sanctionne le Bloc lorsqu'il soutient des gouvernements perçus comme menaçant les intérêts provinciaux; les conditions de déclenchement d'un référendum sur la souveraineté demeurent dormantes [freedom-house-canada-2026]",
      "likelyMoves": "Vote au cas par cas sans levier décisif; défense et positionnement sur les dossiers québécois; pression là où les décisions fédérales touchent la compétence provinciale",
