baseline_en: "Canada is the world's second-largest country by area and one of its most thinly settled: close to 10\_million square kilometres holding roughly 41.5\_million people, two in three of them living within 100\_kilometres of a single land border, strung along an east-west rail, transmission and telecommunications spine that is costlier to hold together than the shorter and more natural north-south routes; the cost of distance and cold climate making every kilometre of infrastructure and every unit of service expensive to deliver.\n\nIts endowment is exceptional — about a fifth of the world's freshwater reserves, forests covering close to a tenth of the global total, potash reserves second only to Russia's, the third-largest uranium and fourth-largest proven oil reserves, and thirty-four listed critical minerals (several of which it already produces at world scale), without, however, having built the capacity to process them. The economy is high-income and service-dominated, with four in five jobs outside the goods sector, but it rests on a resource-export base and a manufacturing belt in the Ontario–Quebec corridor; the productivity record has however trailed comparable economies for two decades and roughly three quarters of merchandise exports going to one neighbour.\n\nSociety is plural (despite an immigration consensus that has recently broken while support for pluralism has held), urban, high-trust by international standards and officially bilingual: francophone-majority Quebec operates under civil law, the other provinces under common law, and Indigenous constitutional rights run to the Crown rather than to the provinces. The sharpest inequality is a life-expectancy gap of nearly eight years between Indigenous and non-Indigenous people, and it is widening. The state is a Westminster parliamentary federation under a constitutional monarchy in which sovereignty is divided: ten provinces, which own the resources and run health and education, and three territories, whose jurisdiction is delegated by federal statute.\n\nIt is wealthy, top-rated and constitutionally constrained, with an independent judiciary and deep, largely automatic fiscal buffers; its recurring weakness is neither intent nor money but follow-through — its own audit office reports programmes funded and risks known while implementation and monitoring lag. Security is defensive and alliance-dependent, and defence is continentally integrated with the same neighbour whose tariffs have, since 2025, turned the trading asymmetry from a background condition into open rupture and the source of most of the country's economic and strategic uncertainty."
baseline_fr: "Le Canada est le deuxième pays du monde par la superficie et l'un des plus faiblement peuplés : près de 10\_millions de kilomètres carrés pour environ 41,5\_millions d'habitants, dont deux sur trois vivent à moins de 100\_kilomètres d'une seule frontière terrestre, égrenés le long d'une épine dorsale est-ouest (ferroviaire, électrique et de télécommunications), dont le maintien coûte plus cher que celui des tracés nord-sud, plus courts et plus naturels; le coût de la distance et du climat rigoureux rendant coûteux chaque kilomètre d'infrastructure et chaque unité de service à livrer.\n\nSes ressources naturelles sont exceptionnelles : environ le cinquième des réserves mondiales d'eau douce, des forêts couvrant près du dixième du total mondial, des réserves de potasse au deuxième rang derrière celles de la Russie, les troisièmes réserves d'uranium et les quatrièmes réserves prouvées de pétrole, ainsi que trente-quatre minéraux critiques répertoriés, dont plusieurs classés parmi les productions mondiales de premier plan, sans avoir cependant bâti la capacité de les transformer. L'économie est à revenu élevé et dominée par les services, quatre emplois sur cinq se situant hors du secteur des biens, reposant sur une base d'exportation de ressources et sur une ceinture manufacturière dans le corridor Ontario-Québec; cependant le bilan de productivité est inférieur à celui d'économies comparables depuis deux décennies et environ les trois quarts des exportations de marchandises destinées à un seul voisin.\n\nLa société canadienne est urbaine et plurielle, même si le consensus sur l'immigration s'est récemment rompu tout en maintenant l'appui au pluralisme. Elle est marquée par un niveau de confiance élevé selon les normes internationales et est officiellement bilingue : le Québec, à majorité francophone, relevant du droit civil, les autres provinces relevant de la common law, et les droits constitutionnels autochtones s'exerçant à l'égard de la Couronne plutôt que des provinces. L'inégalité la plus vive est un écart d'espérance de vie de près de huit ans, et qui se creuse, entre les personnes autochtones et non autochtones. L'État est une fédération démocratique et parlementaire de type Westminster, sous monarchie constitutionnelle, où la souveraineté est partagée : dix provinces, détenant les ressources et administrant la santé et l'éducation, et trois territoires, aux compétences déléguées par loi fédérale.\n\nL'État est riche, doté des meilleures cotes de crédit et encadré par la Constitution, avec un pouvoir judiciaire indépendant et des mécanismes budgétaires d'atténuation profonds et en grande partie automatiques; sa faiblesse récurrente ne tient ni à l'intention ni aux moyens, mais au suivi : son propre bureau de vérification signale des programmes financés et des risques connus, alors que la mise en œuvre et la surveillance accusent un retard. La sécurité est défensive et tributaire des alliances; la défense est intégrée à l'échelle continentale avec ce même voisin dont les droits de douane ont, depuis 2025, transformé l'asymétrie commerciale d'une caractéristique de fond en une rupture ouverte et la source principale de l'incertitude économique et stratégique du pays."
territory_geography_en: "The world's second-largest country by area, Canada spans a continent from the Atlantic to the Pacific and north to the Arctic Ocean — coastal on three oceans yet functionally landlocked in its resource heartland, mountainous in the west, flat across the interior plains, shield and boreal forest across the north, with a single land neighbour (the United States) along the world's longest undefended border.\n\nCanada occupies close to 10\_million km² inhabited by roughly 41.5\_million people, a density near 4\_per km² [statcan-pop-quarterly][statcan-2016-census-geography]; the country spans six time zones [nrcan-atlas-timezones]. The population is not distributed across that territory: two of every three Canadians live within 100\_km of the Canada–United States border, an area covering about 4% of the national land mass [statcan-2016-census-geography]; the border itself runs 8,891\_km. Population and economic activity concentrate in a narrow east–west band running from Windsor through Toronto, Montréal, and Québec City, with detached major centres in Winnipeg, Calgary, Edmonton, and Vancouver, while the North (Yukon, Northwest Territories, Nunavut, and northern Quebec and Labrador) is home to a small fraction of the population across roughly 40% of the land. Maritime access is structured by four distinct systems rather than one: of over 550\_port facilities [tc-port-system-backgrounder], seventeen are federally designated Canada Port Authorities established under the Canada Marine Act of 1998 [tc-cpa-policy], grouped in Pacific, Great Lakes, St. Lawrence and Atlantic regions — none on the Arctic coast [acpa-cpa-list]. The Great Lakes–St. Lawrence system carries ocean-going traffic inland as far as Thunder Bay on Lake Superior, the country's furthest-inland port [acpa-cpa-list]."
territory_geography_fr: "Deuxième pays du monde en superficie, le Canada s'étend d'un océan à l'autre, de l'Atlantique au Pacifique, et jusqu'à l'océan Arctique au nord; bordé par trois océans, mais dont les régions productrices sont enclavées. Son relief associe des chaînes montagneuses à l'ouest, de vastes plaines intérieures, le Bouclier canadien à l'est et au centre, et la forêt boréale qui traverse le pays sur toute sa largeur au nord. Il ne partage de frontière terrestre qu'avec les États-Unis; plus longue frontière commune entre deux pays au monde.\n\nLe Canada occupe près de 10\_millions de km² habités par environ 41,5\_millions de personnes, soit une densité de près de 4\_habitants au km² [statcan-pop-quarterly][statcan-2016-census-geography]; le pays s'étend sur six fuseaux horaires [nrcan-atlas-timezones]. La population n'est pas répartie de manière uniforme sur ce territoire : deux Canadiens sur trois vivent à moins de 100 km de la frontière canado-états-unienne, zone couvrant environ 4 % de la superficie nationale [statcan-2016-census-geography]; la frontière elle-même s'étire sur 8 891 km. La population et l'activité économique se concentrent dans une bande étroite orientée d'est en ouest, allant de Windsor à Québec en passant par Toronto et Montréal, avec de grands centres détachés à Winnipeg, Calgary, Edmonton et Vancouver, tandis que le Nord (Yukon, Territoires du Nord-Ouest, Nunavut, ainsi que le nord du Québec et le Labrador) n'abrite qu'une petite fraction de la population sur environ 40 % du territoire. L'accès maritime est structuré par quatre systèmes distincts plutôt qu'un seul : sur plus de 550\_installations portuaires [tc-port-system-backgrounder], dix-sept sont désignées par le gouvernement fédéral comme Administrations portuaires canadiennes établies sous le régime de la Loi maritime du Canada de 1998 [tc-cpa-policy], regroupées dans les régions du Pacifique, des Grands Lacs, du Saint-Laurent et de l'Atlantique, aucune sur la côte arctique [acpa-cpa-list]. Le réseau des Grands Lacs et du Saint-Laurent achemine le trafic océanique jusqu'à l'intérieur des terres, jusqu'à Thunder Bay sur le lac Supérieur, port le plus intérieur du pays [acpa-cpa-list]."
territory_biosphere_en: "Canada's biological base is among the largest national endowments in the world, and its condition varies sharply by component.\n\nForests cover 369\_million hectares, close to 9% of the world's total forest area, of which 225\_million hectares are classified as managed forest, as reported in 2025 [nrcan-sof-2025]. Permanent conversion of forest to other land uses is negligible — deforestation over the last 34\_years has affected less than half of one percent of the national forest area [nrcan-sof-2025] — but the disturbance regime is not. Over 6,800\_wildland fires burned more than 14.6\_million hectares of forest in 2023, against a long-term annual average above 2.1\_million hectares [nrcan-forest-fires], and 11.6\_million hectares were affected by insects the same year, an 11.4% decrease from 2022 [nrcan-sof-2025]. Forest land and harvested wood products swung from a net carbon source of 90\_megatonnes of carbon dioxide equivalent in 2005\_to a net sink of 1.0\_megatonnes in 2024, as harvest rates declined and the managed forest aged [eccc-nir-2026-summary].\n\nCanada holds roughly 20% of the world's freshwater reserves [cwa-freshwater-statement-2025]; its rivers discharge close to 7% of the world's renewable water supply [energy-factbook-spring-2026].\n\nArable land is the scarce component of the endowment and it is contracting: the 2021\_Census of Agriculture counted about 190,000\_farms, with total farm area 3.2% smaller than in 2016 [statcan-census-agriculture-2021].\n\nFisheries are in the weakest condition. Of 199\_key stocks assessed in 2023, 70 (35%) were in the healthy zone, 23 (12%) cautious, 31 (16%) critical, and 75 (38%) could not be classified [eccc-fish-stocks]. The critical share is the highest on record, above the previous peak of 14% in 2019, and 47% of key stocks sit in the healthy or cautious zones against a federal target of 55% by 2026 [eccc-fish-stocks]. Salmonids hold the highest proportion of critical stocks, and most of those lack rebuilding plans; in the Atlantic, groundfish carry the most critical stocks, including cod populations that collapsed by the 1990s [eccc-fish-stocks]."
territory_biosphere_fr: "La base biologique du Canada figure parmi les plus vastes richesses nationales au monde, et son état varie fortement selon la composante.\n\nLes forêts couvrent 369\_millions d'hectares, soit près de 9 % de la superficie forestière mondiale, dont 225\_millions d'hectares sont classés forêt aménagée, selon les données rapportées en 2025 [nrcan-sof-2025]. La conversion permanente de la forêt vers d'autres usages est négligeable : la déforestation cumulée sur les 34\_dernières années a touché moins d'un demi pour cent de la superficie forestière nationale [nrcan-sof-2025]. Le régime des perturbations, en revanche, ne l'est pas. Plus de 6 800\_feux de forêt ont brûlé plus de 14,6\_millions d'hectares en 2023, contre une moyenne annuelle de long terme supérieure à 2,1\_millions d'hectares [nrcan-forest-fires]; la même année, 11,6\_millions d'hectares ont été touchés par les insectes, en baisse de 11,4 % par rapport à 2022 [nrcan-sof-2025]. Les terres forestières et les produits ligneux récoltés sont passés d'une source nette de carbone de 90\_mégatonnes d'équivalent CO₂ en 2005\_à un puits net de 1,0\_mégatonne en 2024, à mesure que les taux de récolte ont baissé et que la forêt aménagée a vieilli [eccc-nir-2026-summary].\n\nLe Canada détient environ 20 % des réserves mondiales d'eau douce [cwa-freshwater-statement-2025]; ses rivières déchargent près de 7 % des apports mondiaux en eau renouvelable [energy-factbook-spring-2026].\n\nLes terres arables sont la composante rare de cette base de ressources, et elles se réduisent : le Recensement de l'agriculture de 2021\_a dénombré environ 190 000\_exploitations, avec une superficie agricole totale inférieure de 3,2 % à celle de 2016 [statcan-census-agriculture-2021].\n\nLes pêches sont dans l'état le plus fragile. Sur 199\_stocks clés évalués en 2023, 70 (35 %) se situaient dans la zone saine, 23 (12 %) dans la zone de prudence, 31 (16 %) dans la zone critique, et 75 (38 %) n'ont pu être classés [eccc-fish-stocks]. La part critique est la plus élevée jamais enregistrée, au-dessus du sommet précédent de 14 % en 2019, et 47 % des stocks clés se trouvent dans les zones saine ou de prudence, contre une cible fédérale de 55 % d'ici 2026 [eccc-fish-stocks]. Les salmonidés présentent la plus forte proportion de stocks critiques, et la plupart de ces stocks ne disposent pas de plan de rétablissement; dans l'Atlantique, les poissons de fond concentrent le plus grand nombre de stocks critiques, notamment les populations de morue qui se sont effondrées dans les années 1990 [eccc-fish-stocks]."
territory_minerals_en: "Canada's subsurface endowment is broad rather than specialized. The federal Critical Minerals List, first released in 2021\_and updated in 2024, identifies 34\_minerals and metals, the revision adding high-purity iron ore, phosphorus, and silicon metal to the original 31 [nrcan-critical-minerals-list]; Canada has the geological potential to produce all 34 [nrcan-cm-strategy-annual-2024].\n\nReserves are concentrated in a few commodities. Potash is the largest: 1.1\_billion tonnes of potassium oxide equivalent recoverable from 4.5\_billion tonnes of ore, against a world total above 5.9\_billion tonnes — the second-largest national holding after Russia [usgs-mcs-2026]. Nickel reserves stand at 2.2\_million tonnes against a world total above 140\_million, and cobalt at 220,000\_tonnes against a world total of 12\_million [usgs-mcs-2026]. Canada also holds the world's third-largest uranium reserves and fourth-largest proven oil reserves [energy-factbook-spring-2026].\nCanada's battery-mineral reserves (graphite, lithium and rare earth elements) are individually modest against world totals but strategically located for North American supply chains, concentrated in Quebec, Ontario and the West [usgs-mcs-2026]. Much of the critical-mineral endowment is not yet developed: Natural Resources Canada counts 171\_advanced critical-mineral projects — those with measured or indicated resources supported by a feasibility or pre-feasibility study — alongside the country's operating mines and 31\_processing facilities [nrcan-cm-progress-update].\n\nThe endowment is regionally distributed: British Columbia holds copper, molybdenum, zinc and magnesium, with 13\_further critical minerals at the development stage; the Prairies hold potash and uranium; Quebec and Ontario hold nickel and iron; the North holds diamonds and largely unassessed potential [nrcan-cm-strategy-annual-2024]."
territory_minerals_fr: "Les ressources du sous-sol canadien sont vastes plutôt que spécialisées. La Liste canadienne des minéraux critiques, publiée pour la première fois en 2021\_et mise à jour en 2024, recense 34\_minéraux et métaux; la révision ayant ajouté le minerai de fer de haute pureté, le phosphore et le silicium métallique aux 31\_initiaux [nrcan-critical-minerals-list]. Le Canada dispose du potentiel géologique pour produire ces 34\_minéraux et métaux [nrcan-cm-strategy-annual-2024].\n\nLes réserves sont concentrées sur quelques matières premières. La potasse est la plus importante : 1,1\_milliard de tonnes d'équivalent oxyde de potassium récupérable à partir de 4,5\_milliards de tonnes de minerai, contre un total mondial supérieur à 5,9\_milliards de tonnes, soit le deuxième stock national après celui de la Russie [usgs-mcs-2026]. Les réserves de nickel s'établissent à 2,2\_millions de tonnes contre un total mondial supérieur à 140\_millions, et celles de cobalt à 220 000\_tonnes contre un total mondial de 12\_millions [usgs-mcs-2026]. Le Canada détient également les troisièmes réserves mondiales d'uranium et les quatrièmes réserves prouvées de pétrole [energy-factbook-spring-2026].\nLes réserves canadiennes en minéraux pour batteries (graphite, lithium et terres rares) sont individuellement modestes par rapport aux totaux mondiaux, mais stratégiquement situées pour les chaînes d'approvisionnement nord-américaines, concentrées au Québec, en Ontario et dans l'Ouest [usgs-mcs-2026]. Une grande partie du potentiel canadien en minéraux critiques n'est pas encore développée : Ressources naturelles Canada dénombre 171\_projets avancés en minéraux critiques (ceux dont les ressources mesurées ou indiquées sont étayées par une étude de faisabilité ou de préfaisabilité), en plus des mines en exploitation au pays et de 31\_installations de traitement [nrcan-cm-progress-update].\n\nCette dotation est répartie par région : la Colombie-Britannique concentre le cuivre, le molybdène, le zinc et le magnésium, avec 13\_autres minéraux critiques au stade du développement; les Prairies concentrent la potasse et l'uranium; le Québec et l'Ontario concentrent le nickel et le fer; le Nord recèle des diamants et un potentiel largement inexploré [nrcan-cm-strategy-annual-2024]."
territory_climate_en: "Canada's baseline climate is cold and strongly continental across most of the landmass, running from the St. Lawrence and Great Lakes belt, where most Canadians live (cold snowy winters, hot humid summers), through the drier, sharper cold of the Prairies to Arctic tundra in the far north; both coasts break the pattern, the Pacific mild and wet year-round, the Atlantic maritime and storm-exposed.\n\nCanada is warming at roughly twice the global average rate, and northern Canada at more than double; the national climate assessment finds this differential virtually certain and effectively irreversible, with the ultimate magnitude determined by cumulative global emissions [cccr-2019-headline]. Mean annual temperature rose about 1.7\_°C over 1948–2016 [cccr-2019-headline], and 2024\_tied 2010\_as the warmest year on record at 3.1\_°C above the 1961–1990\_reference, with seven of the ten warmest years falling in the last two decades [eccc-temperature-indicator].\n\nExposure is unevenly distributed. Warming is already producing more extreme heat, shorter snow and ice seasons, thinning glaciers, thawing permafrost, and rising sea level, and these trends will continue [cccr-2019-headline]. Permafrost underlies roughly half of Canada's land area (continuous in the far north, discontinuous and sporadic further south) and its thaw destabilizes infrastructure and community access across the northern territories and Nunavik [cccr-2019-headline]. Higher temperatures increase drought and wildfire risk: over 6,800\_fires burned more than 14.6\_million hectares in 2023, against a long-term annual average above 2.1\_million [nrcan-forest-fires]. More intense rainfall raises urban flood risk, while the effect of warming and smaller snowpacks on snowmelt flooding remains uncertain [cccr-2019-headline]. Coastal flooding is projected to increase along most of the Atlantic and Pacific coasts and the Beaufort coast, where land is subsiding or only slowly uplifting, with sea-ice loss in Arctic and Atlantic waters adding storm-surge and wave damage [cccr-2019-headline]. Summer water availability is projected to fall in the glacier-fed river systems of the West and across the Prairies, as smaller snowpacks and glacier loss reduce summer streamflow and warmer summers increase evaporation, despite more precipitation in some places [cccr-2019-headline].\n\nThe Canadian Climate Institute estimates annual climate-related damages of $25\_billion in 2025, rising by 2050\_to $78\_billion under a low-emission pathway and $101\_billion under a high-emission pathway [nrcan-sof-2025].\n\nAdaptive capacity does not match that exposure. Most public infrastructure is owned by municipal, provincial, territorial and Indigenous governments, and municipalities — which own the largest share — rely on property taxes and user fees never designed to finance large-scale climate adaptation, while Indigenous governments face additional constraints rooted in federal funding frameworks [cci-infrastructure-2026]. The exposure and the fiscal capacity sit in different hands: the impacts fall hardest on smaller, rural, northern and Indigenous communities, which face higher climate exposure alongside existing gaps in the quality, safety and access of essential infrastructure, while the fiscal room to fund resilience sits disproportionately at the federal level [cci-infrastructure-2026]."
territory_climate_fr: "Le climat de fond du Canada est froid et nettement continental sur la majeure partie du territoire. Il s'étend de la ceinture du Saint-Laurent et des Grands Lacs, où vit la majorité de la population canadienne (hivers froids et neigeux, étés chauds et humides), au froid plus sec et plus vif des Prairies, jusqu'à la toundra arctique du Grand Nord. Les deux côtes rompent ce schéma : le Pacifique, doux et pluvieux toute l'année; l'Atlantique, maritime et exposé aux tempêtes.\n\nLe Canada se réchauffe à environ deux fois le rythme moyen mondial, le nord du pays à plus du double. L'évaluation climatique nationale considère cet écart comme quasi certain et pour l'essentiel irréversible; son ampleur ultime étant déterminée par le cumul des émissions mondiales [cccr-2019-headline]. La température annuelle moyenne a augmenté d'environ 1,7 °C entre 1948\_et 2016 [cccr-2019-headline]. L'année 2024\_est à égalité avec 2010\_en tant qu'année la plus chaude enregistrée, à 3,1 °C au-dessus de la période de référence 1961-1990; sept des dix années les plus chaudes se situant dans les deux dernières décennies [eccc-temperature-indicator].\n\nL'exposition est inégalement répartie. Le réchauffement produit déjà davantage de chaleur extrême, des saisons de neige et de glace plus courtes, un amincissement des glaciers, un dégel du pergélisol et une élévation du niveau de la mer, et ces tendances se poursuivront [cccr-2019-headline]. Le pergélisol couvre environ la moitié de la superficie du Canada (continu dans le Grand Nord, discontinu et sporadique plus au sud), et son dégel déstabilise les infrastructures et l'accès aux communautés dans les territoires du Nord et au Nunavik [cccr-2019-headline]. La hausse des températures accroît le risque de sécheresse et de feux de forêt : plus de 6 800\_feux ont brûlé plus de 14,6\_millions d'hectares en 2023, contre une moyenne annuelle de long terme supérieure à 2,1\_millions [nrcan-forest-fires]. L'intensification des précipitations accroît le risque d'inondation urbaine, tandis que l'effet du réchauffement et de la réduction du manteau neigeux sur les crues de fonte reste incertain [cccr-2019-headline]. Les inondations côtières devraient s'aggraver sur la majeure partie des côtes atlantique et pacifique ainsi que sur la côte de la mer de Beaufort, où le sol s'affaisse ou se soulève lentement; la fonte de la glace de mer dans les eaux arctiques et atlantiques accentuant les dommages liés aux ondes de tempête et aux vagues [cccr-2019-headline]. La disponibilité de l'eau en été devrait diminuer dans les bassins fluviaux alimentés par les glaciers de l'Ouest et à travers les Prairies : la réduction des manteaux neigeux et le recul des glaciers entraînent une baisse des débits estivaux, et le réchauffement des étés accroît l'évaporation, malgré une hausse des précipitations dans certaines régions [cccr-2019-headline].\n\nL'Institut climatique du Canada estime les dommages annuels liés au climat à 25\_milliards de dollars en 2025, pour s'établir en 2050\_entre 78\_milliards selon une trajectoire à faibles émissions et 101\_milliards selon une trajectoire à fortes émissions [nrcan-sof-2025].\n\nLa capacité d'adaptation n'est pas à la hauteur de cette exposition. La majeure partie des infrastructures publiques appartient aux gouvernements municipaux, provinciaux, territoriaux et autochtones. Les municipalités, qui en détiennent la plus grande part, comptent sur les taxes foncières et les redevances des usagers, des sources de revenus qui n'ont jamais été conçues pour financer une adaptation climatique à grande échelle. Les gouvernements autochtones font quant à eux face à des contraintes supplémentaires liées aux cadres de financement fédéraux [cci-infrastructure-2026]. L'exposition et la capacité budgétaire ne sont pas entre les mêmes mains : les impacts frappent le plus durement les communautés plus petites, rurales, nordiques et autochtones, qui subissent une exposition climatique plus forte en même temps que des lacunes existantes dans la qualité, la sécurité et l'accès aux infrastructures essentielles, alors que la marge budgétaire pour financer la résilience se concentre de manière disproportionnée au niveau fédéral [cci-infrastructure-2026]."
territory_metabolism_en: "Canada's metabolism is dominated by energy: a small population dispersed across a vast, resource-rich landmass, circulating energy, food, water, goods and information over continental distances on networks that run more readily north–south than east–west.\n\nWater throughput mirrors the same north–south tension: roughly 60% of Canada's fresh water drains north, away from the roughly 85% of the population living within 300\_kilometres of the southern border, so the country's water is largely not where its people are [eccc-hydrology]. Canada withdraws only about 1% of its renewable supply annually, but the mismatch between where water flows and where it is used creates regional and seasonal shortages rather than national scarcity [eccc-hydrology].\n\nThe country produced 623\_terawatt-hours of electricity in 2024, 65% from renewable sources and 78% from non-emitting sources (hydro, nuclear, wind, solar); it is the world's third-largest producer of hydroelectricity [energy-factbook-generation-2024]. Provincial generation mixes are highly differentiated: British Columbia, Manitoba, Quebec, and Newfoundland and Labrador generate over 85% of their electricity from hydro, Yukon over 70%, and Prince Edward Island 99% from wind; Ontario and New Brunswick run mixed portfolios that include nuclear; Alberta, Saskatchewan, Nova Scotia and Nunavut generate most of theirs from natural gas, coal or petroleum [cer-canada-energy-profile]. Crude oil production was 5.1\_million barrels per day in 2023, up 41% since 2013\_with almost all the growth from the oil sands, and natural gas production reached 17.9\_billion cubic feet per day [cer-canada-energy-profile].\n\nDistance shapes every network. A single east–west transportation, transmission and telecommunications spine must cover thousands of kilometres to link the country's dispersed population clusters, while north–south flows to the United States are shorter than most inter-provincial ones. The east–west grid is fragmented, with inter-provincial transmission limited compared to the north–south lines connecting Canadian generation to United States markets [cer-canada-energy-profile].\nThat spine is physical: some 43,000\_route-kilometres of track, of which two Class 1\_freight railways, Canadian National and Canadian Pacific Kansas City, operate roughly 80%, moving heavy bulk commodities — grain, potash, coal, containers — over transcontinental distances, with passenger service a thin overlay run by the Crown corporation VIA Rail largely over freight-owned track [tc-rail-network].\n\nFood supply is largely self-sufficient in staples — grains, oilseeds, meat — with imports concentrated in fresh fruit and vegetables through winter."
territory_metabolism_fr: "Le métabolisme du Canada est dominé par l'énergie : une population réduite dispersée sur un vaste territoire riche en ressources, qui fait circuler énergie, aliments, eau, marchandises et information sur des distances continentales, à travers des réseaux mieux orientés nord-sud qu'est-ouest.\n\nL'écoulement des eaux reflète la même tension nord-sud : environ 60 % de l'eau douce du Canada s'écoule vers le nord, à l'opposé des quelque 85 % de la population qui vivent à moins de 300\_kilomètres de la frontière sud. L'eau du pays n'est donc pas là où sont ses habitants [eccc-hydrology]. Le Canada ne prélève annuellement qu'environ 1 % de ses ressources renouvelables, mais le décalage entre les lieux d'écoulement et les lieux de consommation crée des pénuries régionales et saisonnières plutôt qu'une rareté nationale [eccc-hydrology].\n\nLe pays a produit 623\_térawattheures d'électricité en 2024, dont 65 % à partir de sources renouvelables et 78 % à partir de sources non émettrices (hydroélectricité, nucléaire, éolien, solaire); il est le troisième producteur mondial d'hydroélectricité [energy-factbook-generation-2024]. Le bouquet électrique varie fortement d'une province à l'autre : la Colombie-Britannique, le Manitoba, le Québec ainsi que Terre-Neuve-et-Labrador produisent plus de 85 % de leur électricité à partir de l'hydroélectricité, le Yukon plus de 70 %, et l'Île-du-Prince-Édouard 99 % à partir de l'éolien; l'Ontario et le Nouveau-Brunswick exploitent des portefeuilles mixtes incluant le nucléaire; l'Alberta, la Saskatchewan, la Nouvelle-Écosse et le Nunavut produisent la majorité de leur électricité à partir de gaz naturel, de charbon ou de pétrole [cer-canada-energy-profile]. La production de pétrole brut s'établissait à 5,1\_millions de barils par jour en 2023, en hausse de 41 % depuis 2013, la quasi-totalité de cette croissance provenant des sables bitumineux; la production de gaz naturel a atteint 17,9\_milliards de pieds cubes par jour [cer-canada-energy-profile].\n\nLa géographie des réseaux découle de la distance. Une seule colonne vertébrale de transport, de transmission et de télécommunications, orientée est-ouest, doit couvrir des milliers de kilomètres pour relier les regroupements de population dispersés du pays, alors que les flux nord-sud vers les États-Unis sont plus courts que la plupart des liaisons interprovinciales. Le réseau électrique est-ouest est fragmenté; les capacités de transmission interprovinciale sont limitées comparativement aux lignes nord-sud qui relient la production canadienne aux marchés des États-Unis [cer-canada-energy-profile].\nCette colonne vertébrale est physique : quelque 43 000\_kilomètres de voie ferrée, dont environ 80 % sont exploités par deux transporteurs ferroviaires de marchandises de catégorie 1, le Canadien National et le Canadien Pacifique Kansas City. Ces réseaux acheminent des matières premières lourdes en vrac (céréales, potasse, charbon, conteneurs) sur des distances transcontinentales, tandis que le service voyageurs demeure marginal, assuré par la société d'État VIA Rail principalement sur les voies détenues par les transporteurs de marchandises [tc-rail-network].\n\nL'approvisionnement alimentaire est largement autosuffisant pour les denrées de base (céréales, oléagineux, viandes); les importations étant concentrées sur les fruits et légumes frais pendant l'hiver"
territory_transition_en: "Canada's greenhouse-gas emissions were 685\_megatonnes of carbon dioxide equivalent in 2024, excluding land use, land-use change and forestry — down 78\_megatonnes (−10%) from 2005\_and 2.2\_megatonnes (−0.3%) from revised 2023\_emissions [eccc-nir-2026-summary]. Canada accounts for about 1.4% of global emissions, the eleventh-largest emitter, and remains among the highest per capita, though per-capita emissions have fallen from 24\_to 17\_tonnes since 2005 [eccc-nir-2026-summary].\n\nBy economic sector in 2024: oil and gas 208\_megatonnes (30%), transport 151 (22%), buildings 81 (12%), heavy industry 77 (11%), agriculture 70 (10%), electricity 50 (7.2%), and waste and others, 47\_megatonnes (6.9%) [eccc-nir-2026-summary]. The two decisive movements since 2005\_run in opposite directions: electricity fell 66\_megatonnes (−57%) with the coal phase-out, while oil and gas rose 10\_megatonnes (+5.1%) — oil-sands production growth adding 59\_megatonnes, offset by 43\_megatonnes of methane reductions from conventional operations. Oil and gas emissions peaked at 230\_megatonnes in 2014. Methane reached its lowest recorded level in 2024\_at 105\_megatonnes of carbon dioxide equivalent, down 31% from 2005, with the oil and gas sector accounting for almost 80% of the decline [eccc-nir-2026-summary].\n\nTargets are legislated under the Canadian Net-Zero Emissions Accountability Act: 40–45% below 2005\_by 2030, 45–50% by 2035, and net zero by 2050 [eccc-nir-2026-summary].\n\nDelivered policy does not reach them. Climate Action Tracker rates Canada's policies and action \"Highly Insufficient,\" projecting 2030\_emissions of 645–647\_megatonnes — about 15% below 2005 — against a target range of 426–484\_megatonnes, a shortfall of roughly 160\_to 220\_megatonnes, and against the 381\_megatonnes it identifies as compatible with 1.5\_°C. It rates the domestic 2030\_target itself \"Almost Sufficient\" and Canada's fair-share contribution \"Insufficient\" [cat-canada-2026]. Two policy changes widen the gap: the final Clean Electricity Regulations moved the net-zero grid timeline from 2035\_to 2050, and the 2026\_zero-emission-vehicle sales target has been paused pending review [cat-canada-2026]."
territory_transition_fr: "Les émissions de gaz à effet de serre du Canada s'élevaient à 685\_mégatonnes d'équivalent CO₂ en 2024, hors affectation des terres, changement d'affectation des terres et foresterie, soit une baisse de 78\_mégatonnes (−10 %) par rapport à 2005\_et de 2,2\_mégatonnes (−0,3 %) par rapport aux émissions de 2023\_révisées [eccc-nir-2026-summary]. Le Canada représente environ 1,4 % des émissions mondiales; il est ainsi le onzième plus important émetteur et compte parmi les pays où les émissions par habitant sont les plus élevées, bien que celles-ci soient passées de 24\_à 17\_tonnes depuis 2005 [eccc-nir-2026-summary].\n\nPar secteur économique en 2024 : pétrole et gaz 208\_mégatonnes (30 %), transports 151 (22 %), bâtiments 81 (12 %), industrie lourde 77 (11 %), agriculture 70 (10 %), électricité 50 (7,2 %), déchets et autres 47 mégatonnes (6,9 %) [eccc-nir-2026-summary]. Les deux mouvements décisifs depuis 2005\_vont en sens opposés : l'électricité a baissé de 66\_mégatonnes (−57 %) avec l'abandon du charbon, tandis que le pétrole et le gaz ont augmenté de 10\_mégatonnes (+5,1 %); la croissance de la production des sables bitumineux ayant ajouté 59\_mégatonnes, compensées par 43\_mégatonnes de réductions de méthane provenant des opérations conventionnelles. Les émissions du secteur pétrolier et gazier ont culminé à 230\_mégatonnes en 2014. Le méthane a atteint son niveau le plus bas enregistré en 2024, à 105\_mégatonnes d'équivalent CO₂, en baisse de 31 % par rapport à 2005; le secteur pétrolier et gazier étant à l'origine de près de 80 % de cette baisse [eccc-nir-2026-summary].\n\nLes cibles sont inscrites dans la loi par la Loi canadienne sur la responsabilité en matière de carboneutralité : 40\_à 45 % sous le niveau de 2005\_d'ici 2030, 45\_à 50 % d'ici 2035, et carboneutralité d'ici 2050 [eccc-nir-2026-summary].\n\nLes politiques mises en œuvre ne permettent pas de les atteindre. Climate Action Tracker évalue les politiques et les mesures du Canada comme « hautement insuffisantes », projetant des émissions en 2030\_de 645\_à 647\_mégatonnes, soit environ 15 % sous le niveau de 2005, contre une fourchette cible de 426\_à 484\_mégatonnes. L'écart est d'environ 160\_à 220\_mégatonnes; le niveau que Climate Action Tracker considère comme compatible avec 1,5 °C serait de 381\_mégatonnes. L'organisme juge la cible nationale de 2030\_elle-même comme « presque suffisante », et la contribution du Canada en juste part comme « insuffisante » [cat-canada-2026]. Deux changements de politique creusent l'écart : le règlement final sur l'électricité propre a repoussé l'échéance d'un réseau carboneutre de 2035\_à 2050, et la cible de vente de véhicules zéro émission pour 2026\_a été suspendue en attente d'une révision [cat-canada-2026]."
society_demographics_en: "Canada is a settler-immigrant society built on Indigenous lands: apart from the First Nations, Métis and Inuit peoples whose presence long predates the state, essentially the whole population descends from successive waves of immigration. That dependency is now running in reverse, with intake cut by policy and the population contracting.\n\nThe population was 41.65\_million on 1\_July 2025 [statcan-pop-age-jul2025] and 41.42\_million on 1\_April 2026, a decrease of about 55,000\_over the quarter, in which natural increase was itself negative [statcan-pop-quarterly]. The total fertility rate was 1.25\_children per woman in 2024, a record low and within the range described as ultra-low fertility [statcan-fertility-2024]. Non-permanent residents peaked at 3.15\_million on 1\_October 2024, 7.6% of the population [statcan-pop-age-jul2025], and stood at 2.56\_million on 1\_April 2026, just over 6% [statcan-pop-quarterly]; the declared objective is below 5% by the end of 2027 [pbo-ircc-immigration-demographic]. Statistics Canada flags these estimates as subject to larger-than-usual upward revision [statcan-pop-quarterly].\n\nAgeing has resumed as younger temporary migrants leave: median age rose from 40.3\_to 40.6\_years over the year to 1\_July 2025, when 19.5% of the population was 65\_or older [statcan-pop-age-jul2025].\n\nThree in four people (74.8%) lived in one of the 41\_census metropolitan areas on 1\_July 2025 [statcan-subprovincial-2025]. The urbanization rate did not rise that year — the first time outside the pandemic since records began in 2001-2002 — and the form is deconcentration rather than core growth: Toronto recorded no net change and lost 64,794\_people to the rest of Ontario, Edmonton and Calgary grew fastest, and the share of immigrants to Ontario settling in Toronto fell from 76.1% to 60.5% over five years [statcan-subprovincial-2025]."
society_demographics_fr: "Le Canada est une société de peuplement issue de l'immigration, établie sur des terres autochtones : hormis les Premières Nations, les Métis et les Inuits, dont la présence est bien antérieure à l'État, la quasi-totalité de la population descend de vagues successives d'immigration. Cette dépendance joue désormais en sens inverse, l'admission étant réduite par voie politique et la population, en recul.\n\nLa population s'établissait à 41,65\_millions de personnes au 1er juillet 2025 [statcan-pop-age-jul2025] et à 41,42\_millions au 1er avril 2026, en recul au cours du trimestre, où l'accroissement naturel a lui-même été négatif [statcan-pop-quarterly]. L'indice synthétique de fécondité s'est établi à 1,25\_enfant par femme en 2024, creux historique se situant dans la fourchette qualifiée de fécondité ultra-basse [statcan-fertility-2024]. Les résidents non permanents ont atteint un sommet de 7,6 % de la population en octobre 2024 [statcan-pop-age-jul2025] et représentaient un peu plus de 6 % en avril 2026 [statcan-pop-quarterly]; l'objectif déclaré est de passer sous la barre des 5 % d'ici la fin de 2027 [pbo-ircc-immigration-demographic]. Statistique Canada signale que ces estimations sont susceptibles de faire l'objet de révisions à la hausse plus importantes que d'ordinaire [statcan-pop-quarterly].\n\nLe vieillissement a repris à mesure que les migrants temporaires, plus jeunes, quittent le pays : l'âge médian est passé de 40,3\_à 40,6\_ans entre le 1er juillet 2024\_et le 1er juillet 2025, date à laquelle 19,5 % de la population était âgée de 65\_ans ou plus [statcan-pop-age-jul2025].\n\nTrois personnes sur quatre (74,8 %) vivaient dans l'une des 41\_régions métropolitaines de recensement au 1er juillet 2025 [statcan-subprovincial-2025]. Le taux d'urbanisation n'a pas progressé cette année-là (une première hors pandémie depuis le début des relevés en 2001-2002) et la dynamique en est une de déconcentration plutôt que de croissance des noyaux urbains : Toronto n'a enregistré aucune variation nette et a perdu 64 794\_personnes au profit du reste de l'Ontario, Edmonton et Calgary ont connu la croissance la plus rapide, et la part des immigrants à destination de l'Ontario qui s'établissent à Toronto est passée de 76,1 % à 60,5 % en cinq ans [statcan-subprovincial-2025]."
society_composition_en: "Canada is ethnically plural, and the plurality is recent and urban. One in four people belongs to a racialized group, the largest being South Asian (7.1%), Chinese (4.7%) and Black (4.3%); close to 70% reported being White, and of more than 450\_reported origins, European origins account for 52.5% (2021) [statcan-2021-census-ethno-religion]. These shares cannot be read as a trend: the question changed in 2021\_and Statistics Canada states directly that the data cannot measure any group's growth or decline [statcan-2021-census-ethno-religion]. Indigenous identity was reported by 5.0% of the population, about 1.8\_million people [statcan-2021-indigenous-profile]. The racialized population is concentrated in large urban centres — 95.3% live in one, against 73.9% of the population overall [statcan-2021-census-ethno-religion].\n\nThe cleavages are cross-cutting nationally except Quebec, where language, French-descended origin and Catholic inheritance align along a provincial boundary, reinforced by a distinct legal tradition and periodic sovereignty debates. The Indigenous/non-Indigenous cleavage cuts across that line rather than stacking on it: Francophone and Anglophone Canadians do not align predictably on Indigenous questions, and Indigenous nations align with neither bloc, which tends to defuse rather than compound tension nationally [statcan-2021-census-ethno-religion][statcan-2021-indigenous-profile].\n\nThe exception is provincial self-determination. Where a province presses autonomy or secession, Indigenous nations assert treaty and title rights directly against it, since their constitutional relationship runs to the Crown rather than the province. Quebec's sovereignty movement collided with Cree self-determination on this ground in 1995; in 2025\_the Assembly of First Nations answered Alberta's separation-referendum proposal by invoking the numbered Treaties and calling for constitutional review of the 1930\_Natural Resources Transfer Agreement [afn-nrta-2025]."
society_composition_fr: "Le Canada est ethniquement pluriel, et cette pluralité est récente et urbaine. Une personne sur quatre appartient à un groupe racisé, les plus importants étant les Sud-Asiatiques (7,1 %), les Chinois (4,7 %) et les Noirs (4,3 %); près de 70 % se sont déclarés Blancs; sur plus de 450\_origines déclarées, les origines européennes représentent 52,5 % (2021) [statcan-2021-census-ethno-religion]. Ces proportions ne peuvent être lues comme une tendance : la question a été modifiée en 2021\_et Statistique Canada indique explicitement que les données ne permettent pas de mesurer la croissance ou le déclin d'un groupe [statcan-2021-census-ethno-religion]. L'identité autochtone a été déclarée par 5,0 % de la population, soit environ 1,8\_million de personnes [statcan-2021-indigenous-profile]. La population racisée est concentrée dans les grands centres urbains : 95,3 % y vivent, contre 73,9 % de la population dans son ensemble [statcan-2021-census-ethno-religion].\n\nLes clivages sont transversaux à l'échelle nationale, sauf au Québec où la langue, l'origine française et l'héritage catholique coïncident avec une frontière provinciale, renforcés par une tradition juridique distincte et des débats souverainistes récurrents. Le clivage autochtones/non-autochtones traverse ce clivage plutôt que de s'y superposer : les populations canadiennes francophones et anglophones n'adoptent pas de positions prévisibles sur les questions autochtones, et les nations autochtones ne s'alignent sur aucun des deux blocs; ce qui tend à désamorcer les tensions à l'échelle nationale plutôt qu'à les amplifier [statcan-2021-census-ethno-religion][statcan-2021-indigenous-profile].\n\nL'exception tient à l'autodétermination provinciale. Lorsqu'une province revendique l'autonomie ou la sécession, les nations autochtones font valoir directement contre elle leurs droits issus de traités et leurs titres ancestraux, puisque leur rapport constitutionnel est établi avec la Couronne et non avec la province. Le mouvement souverainiste québécois s'est heurté sur ce terrain à l'autodétermination crie en 1995; en 2025, l'Assemblée des Premières Nations a répondu au projet de référendum sur la séparation de l'Alberta en invoquant les Traités numérotés et en appelant à une révision constitutionnelle de la Convention de transfert des ressources naturelles de 1930 [afn-nrta-2025]."
society_language_en: "Canada has two official languages and a large third linguistic layer. English was the first official language spoken by 75.5% of the population and French by 21.4% in 2021, and 98.1% could hold a conversation in one or the other [statcan-2021-census-language]. One in four reported a mother tongue that is neither, which is a record, and 12.7% speak predominantly a non-official language at home, Mandarin and Punjabi the largest [statcan-2021-census-language]. More than 70\_Indigenous languages are spoken; about 189,000\_people reported an Indigenous mother tongue while 243,000\_could converse in one, the gap indicating acquisition as a second language [statcan-2021-census-language].\n\nThe census label hides a convergence and an asymmetry. Nearly seven in ten people whose mother tongue is neither official language speak English or French at home at least regularly [statcan-2021-census-language]. English–French bilingualism stood at 18.0% nationally but splits: 46.4% in Quebec and rising, 9.5% outside Quebec and falling, with close to six in ten bilingual Canadians living in Quebec [statcan-2021-census-language]. It is carried mainly by minorities: 85.3% of French-mother-tongue people outside Quebec are bilingual, against 9.0% of English-mother-tongue people [statcan-2021-census-language]. Minority-language schooling shows the same asymmetry: 897,000\_children were eligible for instruction in the minority official language in 2021 — 593,000\_in French outside Quebec, 304,000\_in English in Quebec; and take-up was 64.7% of eligible children outside Quebec against 76.2% inside it [statcan-minority-instruction-2021].\n\nBeneath these shares, the demographic movement runs one way: French grows in absolute numbers but falls in share, from 27.2% of the population in 1971\_to 21.4% in 2021, because speakers of other languages grow faster [statcan-2021-census-language]. In Quebec, the population whose first official language is English passed one million for the first time, rising to 13.0% [statcan-2021-census-language]. That divergence is what the federal official-languages regime [justice-official-languages-act] and Quebec's Charter of the French language [legisquebec-charte-langue-francaise] each respond to."
society_language_fr: "Le Canada compte deux langues officielles et une importante troisième strate linguistique. L'anglais était la première langue officielle parlée par 75,5 % de la population et le français par 21,4 % en 2021; 98,1 % des personnes pouvaient soutenir une conversation dans l'une ou l'autre [statcan-2021-census-language]. Une personne sur quatre a déclaré une autre langue maternelle, ce qui constitue un record, et 12,7 % parlent principalement une langue non officielle à la maison; le mandarin et le pendjabi arrivant en tête [statcan-2021-census-language]. Plus de 70\_langues autochtones sont parlées; environ 189 000\_personnes ont déclaré une langue autochtone comme langue maternelle, tandis que 243 000\_pouvaient converser dans une telle langue; l'écart témoignant d'une acquisition comme langue seconde [statcan-2021-census-language].\n\nL'étiquette du recensement masque une convergence et une asymétrie. Près de sept personnes sur dix dont la langue maternelle n'est ni l'anglais ni le français parlent l'une de ces deux langues à la maison au moins régulièrement [statcan-2021-census-language]. Le bilinguisme français-anglais s'établissait à 18,0 % à l'échelle nationale, mais avec un net contraste : 46,4 % au Québec, en progression, et 9,5 % hors Québec, en recul; près de six Canadiens bilingues sur dix vivant au Québec [statcan-2021-census-language]. Il est porté principalement par les minorités : 85,3 % des personnes de langue maternelle française hors Québec sont bilingues, contre 9,0 % des personnes de langue maternelle anglaise [statcan-2021-census-language]. La scolarisation dans la langue en situation minoritaire présente la même asymétrie : 897 000\_enfants étaient admissibles à l'enseignement dans la langue officielle minoritaire en 2021 (593 000\_en français hors Québec et 304 000\_en anglais au Québec); le taux de fréquentation s'établissait à 64,7 % des enfants admissibles hors Québec, contre 76,2 % au Québec [statcan-minority-instruction-2021].\n\nSous ces proportions, le mouvement démographique va dans un seul sens : le français progresse en nombre absolu, mais recule en proportion passant de 27,2 % de la population en 1971\_à 21,4 % en 2021, parce que les locuteurs d'autres langues progressent plus rapidement [statcan-2021-census-language]. Au Québec, la population dont la première langue officielle parlée est l'anglais a franchi pour la première fois le seuil du million, atteignant 13,0 % [statcan-2021-census-language]. C'est à cette divergence que répondent, chacune à sa manière, la Loi fédérale sur les langues officielles [justice-official-languages-act] et la Charte de la langue française du Québec [legisquebec-charte-langue-francaise]."
society_religion_en: "Religion is recorded by the census long-form questionnaire as self-declared affiliation, not belief or practice, so the figures describe identification and say nothing about observance; the question also takes one answer per person, so practice that coexists with a declared affiliation (Indigenous ceremonial practice in particular) does not appear in the count [statcan-2021-census-ethno-religion]. In 2021\_about 53% of the population reported a Christian affiliation, of which roughly 30% Catholic and 23% other Christian; 35% reported no religious affiliation; 5% Muslim; 2% Hindu; 2% Sikh; and the remaining 3% Buddhist, Jewish and Indigenous spiritual traditions [statcan-2021-census-ethno-religion].\n\nThe historic Catholic–Protestant fault line — Catholic French Quebec against Protestant British English Canada — has faded as a political cleavage since the Quiet Revolution [statcan-2021-census-ethno-religion]. Federal salience is low: the state is secular, faith-based mobilization is marginal, and the growing Muslim, Hindu and Sikh populations are metropolitan and young without organizing as voting blocs [freedom-house-canada-2026][statcan-2021-census-ethno-religion]. What replaced the confessional cleavage is a dispute over state secularism, active in Quebec and absent federally. Quebec's Act, respecting the laicity (or secularism) of the State, bars provincial public employees in positions of authority from wearing religious symbols on duty, including judges, police officers and teachers, and is shielded from Charter review by the notwithstanding clause, which lets a legislature override certain Charter rights [legisquebec-laicite-etat]; successive statutes have widened it in April 2026, when the reinforcement Act extended the reach of laicity beyond state employment into the public domain, restricting collective religious practice in publicly controlled spaces from September 2026 [quebec-loi-renforcement-laicite-2026][quebec-bulletin-laicite-municipal-2026]. Its constitutionality is before the Supreme Court of Canada [scc-41231-laicite]."
society_religion_fr: >-
  La religion est consignée par le questionnaire détaillé du recensement comme
  une affiliation autodéclarée, et non comme une croyance ou une pratique, de
  sorte que les chiffres décrivent l'identification et ne disent rien de
  l'observance; la question n'admet en outre qu'une seule réponse par personne,
  si bien que les pratiques qui coexistent avec une affiliation déclarée
  (pratiques cérémonielles autochtones en particulier) n'apparaissent pas dans
  le décompte [statcan-2021-census-ethno-religion]. En 2021, environ 53 % de la
  population a déclaré une affiliation chrétienne, dont environ 30 % de
  catholiques et 23 % de chrétiens d'autres confessions; 35 % ont déclaré
  n'avoir aucune affiliation religieuse; 5 % étaient musulmans; 2 % hindous; 2 %
  sikhs; et les 3 % restants se répartissaient entre les traditions bouddhistes,
  juives et spirituelles autochtones [statcan-2021-census-ethno-religion].


  La ligne de fracture historique catholiques–protestants (le Québec français et
  catholique face au Canada anglais britannique et protestant) s'est estompée
  comme clivage politique depuis la Révolution tranquille
  [statcan-2021-census-ethno-religion]. Sa saillance fédérale est faible :
  l'État est laïque, la mobilisation confessionnelle est marginale, et les
  populations musulmane, hindoue et sikhe, en croissance, sont métropolitaines
  et jeunes, sans s'organiser en blocs électoraux
  [freedom-house-canada-2026][statcan-2021-census-ethno-religion]. Un différend
  sur la laïcité de l'État, vif au Québec et absent à l'échelon fédéral, a
  remplacé le clivage confessionnel. La Loi sur la laïcité de l'État du Québec
  interdit le port de symboles religieux aux employés des services publics
  provinciaux en position d'autorité dans l'exercice de leurs fonctions (dont
  les juges, les policiers et les enseignants). Elle est soustraite au contrôle
  fondé sur la Charte par la disposition de dérogation
  [legisquebec-laicite-etat]. Des lois successives en ont élargi la portée. La
  loi de renforcement d'avril 2026, a étendu la laïcité au-delà de l'emploi
  étatique jusque dans le domaine public, restreignant la pratique religieuse
  collective dans les espaces sous contrôle public à compter de septembre 2026
  [quebec-loi-renforcement-laicite-2026][quebec-bulletin-laicite-municipal-2026].
  Sa constitutionnalité est actuellement examinée par la Cour suprême du Canada
  [scc-41231-laicite].
society_wellbeing_en: "Life expectancy at birth reached 82.16\_years in 2024, a second consecutive annual increase and effectively a return to the 2019\_level of 82.22\_years after the pandemic decline; it stands at 80.03\_years for men and 84.29\_years for women, and the strongest recovery was in the western provinces [statcan-deaths-2024]. Perceived health has moved the other way: the share of adults rating their health as very good or excellent fell from roughly six in ten over 2015\_to 2020\_to 52.2% in 2023, and to 40.5% among those aged 65\_and over; it splits by income, 60.9% in the highest household quintile against 42.8% in the lowest [statcan-health-of-canadians-2024].\n\nCancer has been the leading cause of death since the early 1990s and accounted for 26.2% of deaths in 2024, ahead of heart disease. Dementia, which the official ranking omits by classification convention, would place third if it was taken into account, with deaths rising 4.8% in a year and concentrated among those over 85 [statcan-deaths-2024]. The mortality profile is that of an old, chronically ill population rather than one exposed to infectious or violent death.\n\nThe sharpest health inequality falls between Indigenous and non-Indigenous people. Over 2016\_to 2021, life expectancy at birth was 77.2\_years for the Indigenous population against 85.0\_years for the non-Indigenous population, a gap of 7.8\_years, and it has widened since the 2006-to-2011\_period rather than closed [statcan-indigenous-life-expectancy]. The gap varies sharply by group: 80.5\_years for Métis, 74.0\_for First Nations with Registered or Treaty status, and 71.9\_for Inuit — thirteen years below the non-Indigenous figure. Among First Nations with status, those living on reserve reach 71.4\_years against 76.0\_off reserve [statcan-indigenous-life-expectancy]. These estimates exclude people living in institutions and collective dwellings, among whom Indigenous people are overrepresented, so the true gap is likely wider than the published one [statcan-indigenous-life-expectancy].\n\nEducation outcomes are strong by international comparison. Canadian adults scored 271\_in literacy, 271\_in numeracy and 259\_in adaptive problem solving in the 2022–23\_international adult skills assessment, above the respective averages of 259, 262\_and 250\_across the 27\_participating countries, placing Canada in the top ten in all three domains [statcan-piaac-2022]. The distribution is widening rather than the average falling: between the 2012\_and 2023\_cycles, literacy among adults with tertiary qualifications held roughly steady (290\_to 288) while literacy among adults without upper secondary qualifications fell from 221\_to 214 [oecd-eag-2025-canada]."
society_wellbeing_fr: "L'espérance de vie à la naissance a atteint 82,16\_ans en 2024, soit une deuxième hausse annuelle consécutive et un retour de fait au niveau de 2019, qui était de 82,22\_ans, après le recul enregistré durant la pandémie; elle s'établit à 80,03\_ans chez les hommes et à 84,29\_ans chez les femmes, la reprise la plus marquée s'observant dans les provinces de l'Ouest [statcan-deaths-2024]. La santé perçue a évolué en sens inverse : la proportion d'adultes qualifiant leur santé de très bonne ou d'excellente est passée d'environ six sur dix entre 2015\_et 2020\_à 52,2 % en 2023, et à 40,5 % chez les personnes de 65\_ans et plus; elle varie selon le revenu, s'établissant à 60,9 % dans le quintile de ménages le plus élevé, contre 42,8 % dans le plus bas [statcan-health-of-canadians-2024].\n\nLe cancer est la principale cause de décès depuis le début des années 1990\_et a représenté 26,2 % des décès en 2024, devant les maladies du cœur. La démence, que le classement officiel omet par convention de codification, occuperait la troisième place si elle était prise en compte, les décès augmentant de 4,8 % en un an et se concentrant chez les personnes de plus de 85\_ans [statcan-deaths-2024]. Le profil de mortalité est celui d'une population âgée et atteinte de maladies chroniques, plutôt que d'une population exposée à la mort infectieuse ou violente.\n\nL'inégalité de santé la plus marquée sépare la population autochtone et non autochtone. Entre 2016\_et 2021, l'espérance de vie à la naissance était de 77,2\_ans pour la population autochtone contre 85,0\_ans pour la population non autochtone, soit un écart de 7,8\_ans; cet écart s'est creusé depuis la période 2006-2011\_plutôt que réduit [statcan-indigenous-life-expectancy]. L'écart varie fortement d'un groupe à l'autre : 80,5\_ans chez les Métis, 74,0\_ans chez les membres des Premières Nations inscrits ou visés par un traité, et 71,9\_ans chez les Inuits; soit treize ans de moins que la population non autochtone. Parmi les membres inscrits des Premières Nations, ceux vivant dans une réserve atteignent 71,4\_ans, contre 76,0\_ans hors réserve [statcan-indigenous-life-expectancy]. Ces estimations excluent les personnes vivant en établissement et en logement collectif, parmi lesquelles les Autochtones sont surreprésentés, de sorte que l'écart réel est probablement plus important que celui qui est publié [statcan-indigenous-life-expectancy].\n\nLes résultats scolaires se comparent favorablement à l'international. Les adultes canadiens ont obtenu 271\_en littératie, 271\_en numératie et 259\_en résolution adaptative de problèmes lors de l'évaluation internationale des compétences des adultes de 2022-2023, soit au-dessus des moyennes respectives de 259, 262\_et 250\_des 27\_pays participants; ce qui place le Canada dans les dix premiers pour les trois domaines [statcan-piaac-2022]. L'élargissement se joue dans la distribution, non dans la moyenne : entre les cycles de 2012\_et de 2023, la littératie chez les adultes titulaires d'un diplôme d'études tertiaires est demeurée à peu près stable (de 290\_à 288), tandis que celle des adultes n'ayant pas terminé leurs études secondaires supérieures est passée de 221\_à 214 [oecd-eag-2025-canada]."
society_cohesion_en: "Institutional confidence is uneven rather than uniformly low. In the fourth quarter of 2024, 63.4% of Canadians reported high confidence in the police and 48.2% in the justice system and courts, against 45.0% in the school system, 36.2% in Canadian media and 28.3% in the federal Parliament — where 40.0% reported low confidence, the worst reading of any institution measured [statcan-css-trust-institutions-q4-2024]. The regional split runs counter to the usual assumption: Quebec records the highest confidence in the police (74.4%), the courts (59.8%) and Parliament (38.4%), while the Prairie provinces record the lowest confidence in Parliament (23.4%) and in the media (28.5%) [statcan-css-trust-institutions-q4-2024].\n\nInterpersonal trust is moderate and drifting down slowly: in the fourth quarter of 2024, 43.5% of the population said most people can be trusted, against 46.8% in the second quarter of 2022, with the series moving between 42.5% and 46.8% across that period [statcan-css-trust-others].\n\nComputed across the five World Values Survey waves Canada has fielded, from 1982\_to 2020, the longer record shows volatility and recent divergence rather than steady erosion. The share saying most people can be trusted ran 49% in 1982, 52% in 1990, 39% in 2000, 43% in 2006\_and 47% in 2020 — a trough around 2000\_and a gradual climb since that has not regained the 1990\_peak [wvs-canada]. The sharper development is generational: a trust gap between older and younger cohorts that had closed to near zero by 2000\_widened to roughly nine points by 2020, with younger Canadians the less trusting group [wvs-canada].\n\nTwo slower shifts run alongside it. Strong national pride, stable near 95% describing themselves as proud through 2006, softened markedly by 2020, with the share saying \"very proud\" falling from 70% to 52% [wvs-canada]. Left–right self-placement has been dispersing since 1990: the ideological centre thinned from 58% to 47% of respondents as the left flank grew — a widening but asymmetric spread of political values rather than symmetric polarization [wvs-canada].\n\nCanada scored 75\_out of 100\_on the Transparency International Corruption Perceptions Index for 2025, in gradual decline since 2012 [ti-cpi-2025]. That instrument measures expert and business assessments of public-sector corruption rather than citizen self-report, so it sits beside the trust data as a separate signal rather than confirming it.\n\nThe self-image has held while the immigration consensus has not. A majority now says there is too much immigration — 58% in 2024, more than double the 27% of 2022 — though that view stabilized through 2025, and those holding it increasingly attribute the problem to government management rather than to immigrants themselves [environics-focus-canada-immigration-2025]. It sorts sharply by party: 82% of Conservative supporters agree levels are too high, against 40% of Liberal supporters [environics-focus-canada-immigration-2025]. That concern does not carry over into rejection of diversity itself. A survey of 6,818\_adults in spring 2026\_found majorities agreeing multiculturalism has contributed positively to Canadian identity, with support spanning racialized and white respondents alike, and a four-to-one preference for selecting immigrants on skills regardless of origin over selecting by country [environics-multiculturalism-2026]. Support is narrower for differential treatment than for equal treatment: the principle of preventing discrimination draws broad agreement, separate institutions for ethnic or religious minorities much less [environics-multiculturalism-2026]."
society_cohesion_fr: "La confiance envers les institutions est inégale plutôt qu'uniformément faible. Au quatrième trimestre de 2024, 63,4 % de la population canadienne déclaraient une confiance élevée envers la police et 48,2 % envers le système de justice et les tribunaux, contre 45,0 % envers le système scolaire, 36,2 % envers les médias canadiens et 28,3 % envers le Parlement fédéral, envers lequel 40,0 % déclaraient une faible confiance, le résultat le plus bas parmi toutes les institutions mesurées [statcan-css-trust-institutions-q4-2024]. Le clivage régional va à l'encontre de l'idée reçue : le Québec enregistre la confiance la plus élevée envers la police (74,4 %), les tribunaux (59,8 %) et le Parlement (38,4 %), tandis que les provinces des Prairies enregistrent la confiance la plus faible envers le Parlement (23,4 %) et les médias (28,5 %) [statcan-css-trust-institutions-q4-2024].\n\nLa confiance interpersonnelle est modérée et s'effrite lentement : au quatrième trimestre de 2024, 43,5 % de la population estimaient qu'on pouvait faire confiance à la plupart des gens, contre 46,8 % au deuxième trimestre de 2022; la série ayant oscillé entre 42,5 % et 46,8 % sur cette période [statcan-css-trust-others].\n\nCalculé sur les cinq vagues de l'Enquête mondiale sur les valeurs auxquelles le Canada a participé, de 1982\_à 2020, l'historique plus long fait apparaître une volatilité et une divergence récente plutôt qu'une érosion continue. La proportion estimant qu'on peut faire confiance à la plupart des gens s'établissait à 49 % en 1982, 52 % en 1990, 39 % en 2000, 43 % en 2006\_et 47 % en 2020; creux autour de 2000\_et remontée progressive depuis, sans retour au sommet de 1990 [wvs-canada]. L'évolution la plus marquée est générationnelle : un écart de confiance entre les cohortes plus âgées et plus jeunes, qui s'était résorbé à près de zéro en 2000, s'est creusé à environ neuf points en 2020; les jeunes Canadiens et Canadiennes étant le groupe le moins confiant [wvs-canada].\n\nDeux évolutions plus lentes l'accompagnent. La fierté nationale, forte et stable (près de 95 % de personnes se déclarant fières jusqu'en 2006), s'est nettement atténuée en 2020; la proportion se déclarant « très fière » étant passée de 70 % à 52 % [wvs-canada]. Le positionnement gauche-droite se disperse depuis 1990 : le centre idéologique est passé de 58 % à 47 % des répondants à mesure que le flanc gauche s'élargissait; dispersion croissante mais asymétrique des valeurs politiques, plutôt qu'une polarisation symétrique [wvs-canada].\n\nLe Canada a obtenu 75\_sur 100\_à l'Indice de perception de la corruption de Transparency International pour 2025, en déclin graduel depuis 2012 [ti-cpi-2025]. Cet instrument mesure l'évaluation, par les experts et les milieux d'affaires, de la corruption dans le secteur public, plutôt que l'autoévaluation citoyenne, et vient donc compléter les données sur la confiance comme un signal distinct, sans les confirmer.\n\nL'image de soi a tenu, contrairement au consensus sur l'immigration. Une majorité estime désormais que l'immigration est trop élevée : 58 % en 2024, soit plus du double des 27 % de 2022. Ce point de vue s'est cependant stabilisé au cours de 2025; ceux qui l'expriment attribuant de plus en plus le problème à la gestion gouvernementale plutôt qu'aux immigrants eux-mêmes [environics-focus-canada-immigration-2025]. L'opinion se répartit nettement selon l'appartenance partisane : 82 % des partisans conservateurs estiment que les seuils sont trop élevés, contre 40 % des partisans libéraux [environics-focus-canada-immigration-2025]. Cette inquiétude ne se traduit pas par un rejet de la diversité elle-même. Une enquête menée auprès de 6 818\_adultes au printemps 2026\_a révélé qu'une majorité s'accorde à dire que le multiculturalisme a contribué positivement à l'identité canadienne (cet appui s'observant chez les répondants racisés comme chez les répondants blancs) et qu'une préférence de quatre contre un se dégage en faveur d'une sélection des immigrants fondée sur les compétences, indépendamment de l'origine, plutôt que sur le pays [environics-multiculturalism-2026]. L'appui est plus étroit pour un traitement différencié que pour un traitement égal : le principe de prévention de la discrimination fait largement consensus; celui d'institutions distinctes pour les minorités ethniques ou religieuses, beaucoup moins [environics-multiculturalism-2026]."
economy_realEconomy_en: "Canada is a high-income, advanced service economy (services dominate output and employment) resting on a large, geographically concentrated resource-export base (energy above all) and a manufacturing sector clustered in the Ontario–Quebec corridor, leaving it diversified at home but heavily exposed abroad through a narrow, resource-weighted export basket.\n\nServices account for four in five jobs: the goods-producing sector employed 4.2\_million people in 2025\_against 21.0\_million employed in total, so services carry 80% of employment, with health care and social assistance the single largest activity [statcan-employment-industry-2025]. Within the goods sector, manufacturing (1.8\_million) is more than five times the size of the entire forestry, fishing, mining, oil and gas group (339,000) by headcount, though the resource group's weight in output and exports far exceeds its share of jobs [statcan-employment-industry-2025]. The labour market firmed in mid-2026, with employment up 88,000\_in May and unemployment easing to 6.6% [statcan-lfs-may2026].\n\nThe information and communications technology sector is a growing but still modest part of this economy. It employed about 803,000\_people in 2024\_and generated a stronger five-year growth rate than the economy as a whole — a compound 5.0% a year against 1.7% — though in 2024\_its output growth slowed to 0.7% and, for the first time in a decade, failed to outpace the wider economy [ised-ict-profile-2024]. Statistics Canada's broader digital-economy measure, which captures digital activity across all industries rather than the technology sector alone, put the digital economy at 5.9% of gross domestic product in 2020, below finance and insurance [statcan-digital-economy-2020].\n\nGrowth is slowing and the outlook is unusually dispersed. Real gross domestic product grew 1.7% across 2025\_but then stalled: output contracted 0.6% at an annual rate in the fourth quarter of 2025\_and was flat in the first quarter of 2026 [statcan-gdp-q1-2026]. For 2026, growth forecasts cluster tightly. The private-sector consensus the government builds its projections on is 1.1%, and the Parliamentary Budget Officer also projects 1.1%, treating United States tariffs as permanent. The Bank of Canada and the Organisation for Economic Co-operation and Development both put it at 1.2%, and the International Monetary Fund at 1.5% — second-fastest in the Group of Seven [seu-2026][pbo-efo-jun2026][oecd-eo-june2026]. Recovery to between 1.7% and 1.9% is expected in 2027 [seu-2026][oecd-eo-june2026]. The spread between the highest and lowest private-sector forecasts reaches nearly 2% of output by the end of 2027, with risks weighted to the downside, and real output is projected to remain about 1.6% below its pre-tariff trajectory by 2029 [seu-2026]."
economy_realEconomy_fr: "L'économie canadienne, avancée et à revenu élevé, est dominée par les services. Elle repose sur une vaste base d'exportation de ressources géographiquement concentrée (l'énergie au premier chef) et sur un secteur manufacturier regroupé dans le corridor Ontario-Québec. Cette structure lui confère une diversification intérieure tout en l'exposant fortement aux chocs extérieurs, du fait d'une structure d'exportations étroite et à forte teneur en ressources.\n\nLes services représentent quatre emplois sur cinq : le secteur de la production de biens employait 4,2\_millions de personnes en 2025, sur un total de 21,0\_millions d'emplois, de sorte que les services concentrent 80 % de l'emploi; les soins de santé et l'assistance sociale constituant la première activité en nombre [statcan-employment-industry-2025]. Au sein du secteur des biens, la fabrication (1,8\_million) occupe plus de cinq fois plus de personnes que l'ensemble du groupe foresterie, pêche, mines, pétrole et gaz (339 000); toutefois le poids de ce groupe dans la production et les exportations dépasse largement sa contribution à l'emploi [statcan-employment-industry-2025]. Le marché du travail s'est raffermi au milieu de 2026; l'emploi progressant de 88 000\_postes en mai et le taux de chômage reculant à 6,6 % [statcan-lfs-may2026].\n\nLe secteur des technologies de l'information et des communications occupe une place croissante, mais encore modeste dans cette économie. Il employait environ 803 000\_personnes en 2024\_et a affiché sur cinq ans un taux de croissance supérieur à celui de l'économie dans son ensemble (5,0 % en rythme annuel composé contre 1,7 %). La croissance de son PIB en 2024\_a ralenti pour s'établir à 0,7 % et, pour la première fois en dix ans, n'a pas dépassé celle de l'économie dans son ensemble [ised-ict-profile-2024]. La mesure élargie de l'économie numérique de Statistique Canada, qui saisit l'activité numérique dans l'ensemble des industries plutôt que dans le seul secteur des technologies, situait l'économie numérique à 5,9 % du produit intérieur brut en 2020, en deçà du secteur de la finance et de l'assurance [statcan-digital-economy-2020].\n\nLa croissance ralentit et les perspectives affichent une dispersion inhabituelle. Le produit intérieur brut réel a progressé de 1,7 % sur l'ensemble de 2025, avant de s'essouffler : il s'est contracté de 0,6 % en rythme annualisé au quatrième trimestre de 2025, puis est demeuré stable au premier trimestre de 2026 [statcan-gdp-q1-2026]. Pour 2026, le consensus du secteur privé sur lequel le gouvernement fonde ses projections s'établit à 1,1 %, la directrice parlementaire du budget prévoit 1,1 % en tenant les droits de douane états-uniens pour permanents, la Banque du Canada et l'Organisation de coopération et de développement économiques tablent sur 1,2 %, et le Fonds monétaire international sur 1,5 %; le deuxième rythme le plus rapide au sein du Groupe des Sept [seu-2026][pbo-efo-jun2026][oecd-eo-june2026]. Une reprise entre 1,7 % et 1,9 % est attendue en 2027 [seu-2026][oecd-eo-june2026]. L'écart entre les prévisions les plus élevées et les plus basses du secteur privé atteint près de 2 % du PIB d'ici la fin de 2027, les risques étant orientés à la baisse, et le PIB réel devrait demeurer environ 1,6 % sous sa trajectoire d'avant les droits de douane d'ici 2029 [seu-2026]."
economy_publicFinances_en: "The federal deficit was $66.9\_billion in 2025-26, or 2.1% of gross domestic product — $11.5\_billion below the Budget 2025\_projection, as stronger nominal output and year-to-date results improved the position [seu-2026]. The government projects it declining to $53.2\_billion, or 1.4%, by 2030-31 [seu-2026]; the Parliamentary Budget Officer's independent projection is slightly higher, putting 2025-26\_at 2.2% and the deficit averaging around $64\_billion a year over the following five years [pbo-efo-jun2026]. Two fiscal anchors govern the plan: a declining deficit-to-output ratio, and balancing day-to-day operating spending with revenues by 2028-29 [seu-2026]. The second is the structurally significant one; capital investment accounted for 61% of the 2025-26\_deficit and is projected to account for all of it by 2028-29, as the operating deficit falls from $26\_billion to zero [seu-2026].\n\nFederal debt was 41.1% of gross domestic product in 2025-26\_on the government's own accounting, projected to rise to about 41.9% by 2028-29\_before easing to 41.6% by 2030-31; more than a full percentage point below the Budget 2025\_track [seu-2026]. The Parliamentary Budget Officer projects a slightly higher path, 41.3% rising to 42.5% by 2030-31 [pbo-efo-jun2026]. Both remain well above the pre-pandemic level of about 31% [pbo-efo-jun2026]. The cost of carrying the debt is the sharper pressure: public debt charges rise from $54.0\_billion in 2025-26\_toward $81\_billion by 2030-31, lifting the share of federal revenue absorbed by interest from around 10.6% to over 13% [seu-2026]. This is a federal figure; the combined federal-provincial debt burden is far larger, which independent analysts put above 75% of output [fraser-debt-2026].\n\nThe Bank of Canada held its policy rate at 2.25% on 15\_July 2026, a sixth consecutive hold, judging the current setting appropriate to sustain recovery and return inflation to its 2% target [boc-mpr-jul2026]. That rate reflects a cumulative 275\_basis points of cuts since early 2024, a deeper easing than the United States Federal Reserve delivered over the same period. Inflation eased to 2.8% year-over-year in June 2026, down from a two-and-a-half-year high of 3.2% in May, as a brief Middle East ceasefire pulled gasoline prices back from their peak; stripping out gasoline, inflation was steady at 2.2%, and the Bank's preferred core measures also cooled [statcan-cpi-jun2026]. The underlying driver is external and unresolved: gasoline had risen 33.2% year-over-year in May after the closure of the Strait of Hormuz restricted roughly a fifth of globally traded crude, and with that ceasefire since broken, the Bank continues to frame Middle East oil prices, feeding through supply chains, as a material pressure on the inflation outlook [statcan-cpi-jun2026][boc-mpr-jul2026].\n\nCanada holds among the strongest sovereign credit ratings available. Moody's and S&P Global both rate it at their highest grade (Aaa and AAA respectively) and Morningstar DBRS confirmed its AAA rating with a stable trend in February 2025; Fitch rates Canada one notch lower at AA+, having downgraded it from the top grade in 2020\_over pandemic borrowing [dbrs-canada-2025][sp-canada-2025][fitch-canada-2025]. All three top ratings were held after the November 2025\_federal budget, but Fitch, maintaining AA+/stable, warned that persistent fiscal expansion and a rising debt burden have weakened Canada's credit profile and could increase rating pressure over the medium term [fitch-canada-2025]."
economy_publicFinances_fr: "Le déficit fédéral s'est établi à 66,9\_milliards de dollars en 2025-2026, soit 2,1 % du produit intérieur brut : 11,5\_milliards de dollars en deçà de la projection du Budget 2025; la vigueur du PIB nominal et les résultats cumulés depuis le début de l'exercice ayant amélioré la situation [seu-2026]. Le gouvernement prévoit un recul à 53,2\_milliards de dollars, ou 1,4 %, d'ici 2030-2031 [seu-2026]; la projection indépendante de la directrice parlementaire du budget est légèrement plus élevée, portant l'exercice 2025-2026\_à 2,2 % et le déficit à environ 64\_milliards de dollars par année en moyenne sur les cinq exercices suivants [pbo-efo-jun2026]. Deux ancrages budgétaires encadrent le plan : un ratio du déficit au produit intérieur brut en baisse, et l'équilibre des dépenses de fonctionnement courantes avec les revenus d'ici 2028-2029 [seu-2026]. Le second est celui qui revêt une portée structurelle : les investissements en capital ont représenté 61 % du déficit de 2025-2026\_et devraient en constituer la totalité d'ici 2028-2029, à mesure que le déficit de fonctionnement passe de 26\_milliards de dollars à zéro [seu-2026].\n\nLa dette fédérale s'établissait à 41,1 % du produit intérieur brut en 2025-2026\_selon la comptabilité du gouvernement, et devrait augmenter à environ 41,9 % d'ici 2028-2029\_avant de fléchir à 41,6 % d'ici 2030-2031; soit plus d'un point de pourcentage en deçà de la trajectoire du Budget 2025 [seu-2026]. La directrice parlementaire du budget projette une trajectoire légèrement plus élevée, passant de 41,3 % à 42,5 % d'ici 2030-2031 [pbo-efo-jun2026]. Dans les deux cas, le ratio demeure nettement au-dessus du niveau prépandémique d'environ 31 % [pbo-efo-jun2026]. Le coût du service de la dette exerce une pression plus vive : les frais de la dette publique passent de 54,0\_milliards de dollars en 2025-2026\_à environ 81\_milliards de dollars d'ici 2030-2031, faisant grimper la part des revenus fédéraux absorbée par les intérêts d'environ 10,6 % à plus de 13 % [seu-2026]. Il s'agit ici d'un chiffre fédéral; le fardeau combiné de la dette des administrations fédérale et provinciales est nettement plus lourd, des analystes indépendants l'estimant à plus de 75 % du PIB [fraser-debt-2026].\n\nLa Banque du Canada a maintenu son taux directeur à 2,25 % le 15\_juillet 2026, sixième pause consécutive, jugeant le niveau actuel approprié pour soutenir la reprise et ramener l'inflation à sa cible de 2 % [boc-mpr-jul2026]. Ce taux reflète des baisses cumulatives de 275\_points de base depuis le début de 2024; assouplissement plus marqué que celui opéré par la Réserve fédérale états-unienne sur la même période. L'inflation s'est modérée à 2,8 % d'une année à l'autre en juin 2026, en recul par rapport au sommet de 3,2 % atteint en mai (le plus élevé en deux ans et demi); un cessez-le-feu de courte durée au Moyen-Orient ayant fait redescendre les prix de l'essence par rapport à leur pic. Hors essence, l'inflation est demeurée stable à 2,2 %, et les mesures de l'inflation fondamentale privilégiées par la Banque se sont également apaisées [statcan-cpi-jun2026]. Le facteur sous-jacent demeure externe et non résolu : les prix de l'essence avaient bondi de 33,2 % d'une année à l'autre en mai à la suite de la fermeture du détroit d'Ormuz, qui a restreint environ le cinquième du pétrole brut échangé à l'échelle mondiale. Ce cessez-le-feu ayant depuis été rompu, la Banque continue de considérer les prix du pétrole du Moyen-Orient (qui se répercutent dans les chaînes d'approvisionnement) comme une pression importante sur les perspectives d'inflation [statcan-cpi-jun2026][boc-mpr-jul2026].\n\nLe Canada figure parmi les États bénéficiant des meilleures cotes de crédit souveraines disponibles. Moody's et S&P Global lui attribuent toutes deux leur cote la plus élevée (respectivement Aaa et AAA) et Morningstar DBRS a confirmé sa cote AAA assortie d'une tendance stable en février 2025; Fitch classe le Canada un cran plus bas, à AA+, après l'avoir abaissé depuis la cote maximale en 2020\_en raison des emprunts liés à la pandémie [dbrs-canada-2025][sp-canada-2025][fitch-canada-2025]. Les trois cotes supérieures ont été maintenues à la suite du budget fédéral de novembre 2025, mais Fitch, tout en reconduisant sa cote AA+ à perspective stable, a prévenu qu'une expansion budgétaire persistante et un fardeau de la dette en hausse ont affaibli le profil de crédit du Canada et pourraient accroître les pressions sur la cote à moyen terme [fitch-canada-2025]."
economy_externalVulnerability_en: "Canada's export base is resource-intensive and heavily concentrated on the United States, but the familiar \"75\_percent\" dependence needs unpacking. That share describes merchandise exports — physical goods — which flow overwhelmingly south: 75.9% went to the United States on average in 2024 [statcan-international-trade]. Services exports — a separate basket, roughly a fifth of the total — are far more diversified and much less United-States-dependent, so the headline figure overstates Canada's overall dependence on the American market [statcan-international-trade].\n\nThe United States goods share fell sharply through 2025\_as tariffs bit, reaching one of the lowest readings on record, but part of that shift is not durable diversification: it reflects a surge of unwrought-gold shipments to the United Kingdom and Switzerland — a financial flow to vaults rather than new industrial markets [statcan-merch-trade-may2026]. Through the first half of 2026\_the pattern turned again: exports to the United States rose for four consecutive months to May, non-United-States exports eased as the gold flow reversed, and Canada ran a merchandise trade surplus for three straight months, reaching a four-year high in May on a widening surplus with the United States [statcan-merch-trade-may2026]. Energy, vehicles, machinery and forest products are the top commodity groups [gac-state-of-trade-2025].\n\nThis concentration creates acute tariff vulnerability, and the framework that contained it is giving way in two steps. The Canada–United States–Mexico Agreement passed its 1\_July 2026\_review deadline without renewal, shifting to rolling annual reviews with steel, aluminum, autos, lumber and procurement unresolved [statcan-merch-trade-may2026]. Three weeks later the United States invoked Section 338\_of the Tariff Act of 1930\_for the first time in its history, imposing an additional 50% duty on named Canadian sectors from 19\_August with no exemption for goods qualifying under the agreement — so compliance, which had been the reliable shelter throughout the dispute, no longer guarantees duty-free entry [whitehouse-section338-2026]. The Parliamentary Budget Officer treats the 2025-26\_tariff measures as permanent, a central driver of its deficit and growth projections [pbo-efo-jun2026].\n\nTotal goods exports reached about $778\_billion in 2024, or $997\_billion including services, and imports of goods and services surpassed $1\_trillion [gac-state-of-trade-2025]. Canada is pursuing diversification through 15\_free trade agreements covering 51\_countries, with the Comprehensive and Progressive Agreement for Trans-Pacific Partnership across the Indo-Pacific and the Comprehensive Economic and Trade Agreement with Europe as the primary levers [gac-trade-diversification].\n\nNo International Monetary Fund program is in place and Canada is not subject to international sanctions. Sovereign debt is held predominantly by domestic institutional investors, limiting foreign-creditor exposure, though global interest-rate movements affect rollover costs [imf-can-2025-art4]."
economy_externalVulnerability_fr: "La base d'exportation du Canada est à forte intensité de ressources et fortement concentrée sur les États-Unis, mais la dépendance familière de « 75\_pour cent » mérite d'être nuancée. Cette part décrit les exportations de marchandises (les biens physiques) qui s'écoulent massivement vers le sud : 75,9 % ont pris la direction des États-Unis en moyenne en 2024 [statcan-international-trade]. Les exportations de services (catégorie distincte, représentant environ un cinquième du total) sont beaucoup plus diversifiées et nettement moins tributaires des États-Unis, de sorte que le chiffre affiché surestime la dépendance globale du Canada à l'égard de ce marché [statcan-international-trade].\n\nLa part des États-Unis dans les exportations de marchandises a fortement reculé au cours de 2025\_sous l'effet des droits de douane, atteignant l'un des plus bas niveaux enregistrés. Toutefois, une partie de ce repli ne constitue pas une diversification durable : il reflète une flambée des expéditions d'or non ouvré vers le Royaume-Uni et la Suisse; flux financier vers des chambres fortes plutôt que vers de nouveaux marchés industriels [statcan-merch-trade-may2026]. Ce cadre a cessé de faire écran en juillet 2026, lorsque les États-Unis ont invoqué pour la première fois l'article 338\_de la loi douanière de 1930\_afin d'imposer des droits supplémentaires de 50 % sur des secteurs canadiens nommément désignés à compter du 19\_août, explicitement sans exemption pour les marchandises admissibles au titre de l'accord [whitehouse-section338-2026]. Au premier semestre de 2026, la tendance s'est de nouveau inversée : les exportations vers les États-Unis ont progressé pendant quatre mois consécutifs jusqu'en mai. Les exportations hors États-Unis se sont repliées à mesure que le flux d'or s'inversait. Le Canada a dégagé un excédent commercial des marchandises pendant trois mois consécutifs, atteignant un sommet en quatre ans en mai à la faveur d'un élargissement de l'excédent avec les États-Unis [statcan-merch-trade-may2026]. L'énergie, les véhicules, la machinerie et les produits forestiers constituent les principaux groupes de produits exportés [gac-state-of-trade-2025].\n\nCette concentration engendre une vulnérabilité aiguë aux droits de douane, et le cadre qui la contenait cède en deux temps. L'Accord Canada–États-Unis–Mexique a franchi son échéance d'examen du 1er juillet 2026\_sans être reconduit, passant à des examens annuels successifs, alors que les dossiers de l'acier, de l'aluminium, de l'automobile, du bois d'œuvre et des marchés publics demeurent en suspens [statcan-merch-trade-may2026]. Trois semaines plus tard, les États-Unis invoquaient pour la première fois de leur histoire l'article 338\_de la loi douanière de 1930, imposant des droits supplémentaires de 50 % sur des secteurs canadiens nommément désignés à compter du 19\_août, sans exemption pour les marchandises admissibles au titre de l'accord; de sorte que la conformité, qui avait constitué l'abri sûr tout au long du différend, ne garantit plus l'entrée en franchise de droits [whitehouse-section338-2026]. La directrice parlementaire du budget considère les mesures douanières de 2025-2026\_comme permanentes, un moteur central de ses projections de déficit et de croissance [pbo-efo-jun2026].\n\nLes exportations totales de biens ont atteint environ 778\_milliards de dollars en 2024, ou 997\_milliards en incluant les services, et les importations de biens et de services ont franchi le seuil de 1 000\_milliards de dollars [gac-state-of-trade-2025]. Le Canada poursuit sa diversification au moyen de 15\_accords de libre-échange couvrant 51\_pays, l'Accord de Partenariat transpacifique global et progressiste dans la région indopacifique et l'Accord économique et commercial global avec l'Europe en constituant les principaux leviers [gac-trade-diversification].\n\nAucun programme du Fonds monétaire international n'est en place et le Canada ne fait l'objet d'aucune sanction internationale. La dette souveraine est détenue majoritairement par des investisseurs institutionnels canadiens; ce qui limite l'exposition aux créanciers étrangers, bien que les mouvements des taux d'intérêt mondiaux influent sur les coûts de refinancement [imf-can-2025-art4]."
economy_politicalEconomy_en: "Canada runs a mixed economy that sits toward the market-led end: private ownership dominates, but the state is a large and active presence through Crown corporations, a substantial public sector, and — since April 2026 — a sovereign fund. Federal Crown corporations already carry significant economic weight, among them the Business Development Bank of Canada, Export Development Canada and the Canada Infrastructure Bank, while at provincial level Hydro-Québec is the country's largest electricity producer and a pillar of Quebec's economy [gac-state-of-trade-2025][pmo-canada-strong-fund-2026]. The newest and most contested addition to this configuration is the Canada Strong Fund, announced 27\_April 2026\_as Canada's first federal sovereign wealth fund, seeded with $25\_billion over three years and structured as an arm's-length Crown corporation that takes minority equity positions alongside private capital in energy, critical minerals, agriculture, infrastructure and advanced manufacturing [pmo-canada-strong-fund-2026]. The contested boundary is precisely there: the fund is designed to co-invest rather than to displace private capital or nationalize assets, and critics have questioned whether a debt-financed fund taking equity in favoured projects is investment or industrial policy by another name [csf-thedeepdive-2026].\n\nUnder the current model the principal beneficiaries are the large integrated energy producers, the chartered banks, and the real-estate sector, all operating in concentrated markets with high barriers to entry. In energy the load-bearing firms are the oil sands and pipeline majors (Canadian Natural Resources, Suncor Energy, Cenovus and Imperial Oil in production, Enbridge and TC Energy in transport) clustered in Alberta [companydata-energy-2026]. In finance the market is dominated by a handful of chartered banks: Royal Bank of Canada, Toronto-Dominion, Bank of Nova Scotia, Bank of Montreal and Canadian Imperial Bank of Commerce [disfold-canada-2026]. Resource-export rents are politically distributed through the federal equalization system, sustaining regional elite coalitions in Alberta and Saskatchewan alongside the federal government [imf-can-2025-art4][gac-state-of-trade-2025].\n\nOrganized labour is a smaller but real counterweight, concentrated in the public sector and heavy industry. The Canadian Labour Congress is the peak federation, representing roughly three million workers across its affiliates; Unifor, which left the Congress in 2024, is the largest private-sector union at over 315,000\_members in autos, energy, media and manufacturing; and in Quebec the Confédération des syndicats nationaux organizes a distinct labour bloc of around 300,000 [clc-unifor-2025].\n\nThe reforms most analysts call technically necessary — raising business investment and productivity, loosening labour-market and interprovincial-trade barriers, deregulating housing supply, and building pipeline-to-tidewater capacity — each run into an organized constituency: environmental and some Indigenous opposition to new pipelines, labour resistance to flexibility measures, and urban homeowners with an interest in high prices [imf-can-2025-art4][oecd-eo-june2026]. Budget 2025\_signalled a productivity agenda through a Productivity Super-Deduction for business investment, and the Canada Strong Fund followed in April 2026; whether either shifts the productivity trajectory depends on sustained delivery rather than announcement [budget-2025-canada-strong][seu-2026][pmo-canada-strong-fund-2026]. Housing and consumer demand, long sustained by immigration-driven population growth, now face the reverse: the reduction of permanent-resident admissions toward 380,000\_a year and of non-permanent residents below 5% of the population by end-2027\_is projected to materially cut population-driven demand [pbo-ircc-immigration-demographic]."
economy_politicalEconomy_fr: "Le Canada exploite une économie mixte qui penche vers le pôle axé sur le marché : la propriété privée domine, mais l'État occupe une place importante et active par l'intermédiaire des sociétés d'État, d'un secteur public substantiel et (depuis avril 2026) d'un fonds souverain. Les sociétés d'État fédérales pèsent déjà d'un poids économique significatif, notamment la Banque de développement du Canada, Exportation et développement Canada et la Banque de l'infrastructure du Canada, tandis qu'à l'échelon provincial, Hydro-Québec est le plus grand producteur d'électricité au pays et un pilier de l'économie québécoise [gac-state-of-trade-2025][pmo-canada-strong-fund-2026]. Le plus récent ajout à cette configuration, et le plus contesté, est le Fonds Canada fort, annoncé le 27\_avril 2026\_à titre de premier fonds souverain fédéral canadien, doté de 25\_milliards de dollars sur trois ans et constitué en société d'État sans lien de dépendance qui prend des participations minoritaires aux côtés du capital privé dans les secteurs de l'énergie, des minéraux critiques, de l'agriculture, des infrastructures et de la fabrication de pointe [pmo-canada-strong-fund-2026]. La frontière contestée se situe précisément là : le fonds est conçu pour co-investir plutôt que pour évincer le capital privé ou nationaliser des actifs, et les critiques ont soulevé la question de savoir si un fonds financé par emprunt prenant des participations dans des projets privilégiés relève de l'investissement ou d'une politique industrielle sous un autre nom [csf-thedeepdive-2026].\n\nDans le modèle actuel, les principaux bénéficiaires sont les grands producteurs énergétiques intégrés, les banques à charte et le secteur immobilier, tous évoluant dans des marchés concentrés dotés d'importantes barrières à l'entrée. Dans l'énergie, les entreprises porteuses sont les grands acteurs des sables bitumineux et des pipelines (Canadian Natural Resources, Suncor Énergie, Cenovus et Imperial Oil dans la production, Enbridge et TC Énergie dans le transport), regroupées en Alberta [companydata-energy-2026]. Dans la finance, le marché est dominé par une poignée de banques à charte : la Banque Royale du Canada, la Banque Toronto-Dominion, la Banque de Nouvelle-Écosse, la Banque de Montréal et la Banque Canadienne Impériale de Commerce (CIBC) [disfold-canada-2026]. Les rentes tirées des exportations de ressources sont politiquement redistribuées par le régime fédéral de péréquation; ce qui soutient des coalitions d'élites régionales en Alberta et en Saskatchewan aux côtés du gouvernement fédéral [imf-can-2025-art4][gac-state-of-trade-2025].\n\nLe mouvement syndical constitue un contrepoids plus modeste, mais bien réel, concentré dans le secteur public et l'industrie lourde. Le Congrès du travail du Canada est la fédération faîtière, représentant environ trois millions de travailleurs et travailleuses au sein de ses syndicats affiliés. Unifor, qui a quitté le Congrès en 2024, est le plus grand syndicat du secteur privé, avec plus de 315 000\_membres dans l'automobile, l'énergie, les médias et la fabrication. Au Québec, la Confédération des syndicats nationaux regroupe un bloc syndical distinct d'environ 300 000\_membres [clc-unifor-2025].\n\nLes réformes que la plupart des analystes jugent techniquement nécessaires (rehausser l'investissement des entreprises et la productivité, assouplir les barrières du marché du travail et du commerce interprovincial, déréglementer l'offre de logements et bâtir une capacité d'exportation par pipeline vers les côtes) se heurtent chacune à un groupe d'intérêts organisé : l'opposition environnementale et celle d'une partie des communautés autochtones aux nouveaux pipelines, la résistance syndicale aux mesures d'assouplissement, et les propriétaires urbains ayant intérêt au maintien de prix élevés [imf-can-2025-art4][oecd-eo-june2026]. Le Budget 2025\_a annoncé un programme de productivité au moyen d'une Superdéduction pour la productivité applicable à l'investissement des entreprises, suivi par le Fonds pour un Canada fort en avril 2026; la question de savoir si l'une ou l'autre modifiera la trajectoire de productivité dépendra d'une exécution soutenue plutôt que de la seule annonce [budget-2025-canada-strong][seu-2026][pmo-canada-strong-fund-2026]. Le logement et la demande de consommation, longtemps soutenus par la croissance démographique portée par l'immigration, connaissent maintenant la tendance inverse : la réduction des admissions de résidents permanents vers 380 000\_par année et celle des résidents non permanents sous les 5 % de la population d'ici la fin de 2027\_devraient réduire de manière substantielle la demande liée à la population [pbo-ircc-immigration-demographic]."
political_powerStructure_en: "Canada is a Westminster parliamentary democracy under a constitutional monarchy. Power is won by commanding the confidence of the elected House of Commons: the party able to hold a majority of votes in the House forms the government, and the executive sits inside the legislature rather than apart from it, so executive and legislative control are fused rather than divided. Formal executive authority rests with the Crown, represented by the Governor General, and is exercised in practice by the Prime Minister and Cabinet through the Privy Council.\n\nMark Carney is Prime Minister, leading a Liberal government [pmo-swearing-in-2025]. The Liberals were returned with a minority at the general election of 28\_April 2025, winning 169\_of 343\_seats [elections-canada-2025], and reached a majority through five floor crossings — four Conservative, one New Democrat — and a sweep of three by-elections on 13\_April 2026, their first parliamentary majority since 2015 [ourcommons-membership-changes][cbc-carney-majority-byelections-2026]. That route, the first time a Canadian government has crossed the threshold partly through floor crossings rather than at an election, is rejected as illegitimate by the Conservative Official Opposition; it nonetheless gives the government working control of the House agenda [cbc-carney-majority-byelections-2026].\n\nThe majority is real but thin and in motion. As of 25\_July 2026\_the House stands at 172\_Liberals, 139\_Conservatives, 21\_Bloc Québécois, 5\_New Democrats, 1\_Green and 1\_Independent, with 4\_seats vacant — 339\_members in office of 343 [ourcommons-party-standings-2026]. The Liberal count peaked at 174\_in April before two resignations brought it to 172, exactly the number a majority of the full House requires [ourcommons-membership-changes]. One of those 172\_is the Speaker, who by convention votes only to break ties, leaving an operative government bloc of 171\_against 167\_for the combined opposition. By-elections in the vacant seats are therefore the pivot: recovering Liberal-held ridings would restore a cushion, while further losses on the government benches would leave the government's ability to legislate resting on the Speaker's casting vote — a materially weaker position than a majority normally implies.\n\nParliament is bicameral. The House of Commons has 343\_seats filled by first-past-the-post election on the boundaries set by the 2025\_redistribution. The Senate has 105\_seats filled by appointment, and as of 25\_July 2026\_stands at 40\_Independent Senators Group, 18\_Canadian Senators Group, 17\_Progressive Senate Group, 12\_Conservative Party of Canada — the only group tied to a federal party — 5\_in the Government Representative's Office, and 4\_non-affiliated, with 9\_seats vacant, five of them in Quebec [sencanada-standings-2026]. The upper chamber's character is itself in motion: on 7\_July 2026\_the Prime Minister announced changes to the appointment process, dropping the nonpartisan criterion that had governed appointments since 2016\_and reworking the independent advisory board, alongside his first four appointments — one of which, a sitting Conservative member of Parliament, accounts for one of the Commons vacancies [pmo-senate-2026]."
political_powerStructure_fr: "Le Canada est une démocratie parlementaire de type Westminster sous monarchie constitutionnelle. Le pouvoir s'y remporte en obtenant la confiance de la Chambre des communes, élue au suffrage universel : le parti en mesure de réunir la majorité des voix à la Chambre forme le gouvernement; le pouvoir exécutif siège au sein du pouvoir législatif plutôt que d'en être distinct, de sorte que la maîtrise de l'exécutif et celle du législatif sont fusionnées plutôt que séparées. L'autorité exécutive formelle revient à la Couronne, représentée par le gouverneur général, et s'exerce en pratique par le premier ministre et le Cabinet par l'intermédiaire du Conseil privé.\n\nMark Carney est premier ministre à la tête d'un gouvernement libéral [pmo-swearing-in-2025]. Les libéraux ont été reportés au pouvoir avec un gouvernement minoritaire aux élections générales du 28\_avril 2025, remportant 169\_des 343\_sièges [elections-canada-2025]; ils ont atteint la majorité à la faveur de cinq changements d'allégeance (quatre conservateurs, un néo-démocrate) et de la victoire dans les trois élections partielles le 13\_avril 2026 (leur première majorité parlementaire depuis 2015) [ourcommons-membership-changes][cbc-carney-majority-byelections-2026]. Cette voie, la première fois qu'un gouvernement canadien franchit le seuil en partie par des changements d'allégeance plutôt qu'à l'occasion d'un scrutin, est rejetée comme illégitime par l'opposition officielle conservatrice; elle donne néanmoins au gouvernement une maîtrise effective de l'ordre du jour de la Chambre [cbc-carney-majority-byelections-2026].\n\nLa majorité est réelle, mais mince et mouvante. Au 25\_juillet 2026, la Chambre compte 172\_libéraux, 139\_conservateurs, 21\_bloquistes, 5\_néo-démocrates, 1\_vert et 1\_indépendant, avec 4\_sièges vacants; 339\_députés en fonction sur 343 [ourcommons-party-standings-2026]. Le total libéral a culminé à 174\_en avril avant que deux démissions ne le ramènent à 172, soit exactement le nombre requis pour la majorité de la Chambre au complet [ourcommons-membership-changes]. L'un de ces 172\_députés est le Président de la Chambre, qui, par convention, ne vote que pour départager les voix; ce qui laisse un bloc gouvernemental opérationnel de 171\_contre 167\_pour l'opposition combinée. Les élections partielles dans les sièges vacants constituent donc le pivot : la reconquête des circonscriptions détenues par les libéraux rétablirait une marge de manœuvre, tandis que d'autres pertes du côté ministériel feraient reposer la capacité du gouvernement de légiférer sur la voix prépondérante du Président; position sensiblement plus faible que ce que suppose habituellement une majorité.\n\nLe Parlement est bicaméral. La Chambre des communes compte 343\_sièges pourvus au scrutin majoritaire uninominal à un tour selon les délimitations établies par le redécoupage électoral de 2025. Le Sénat compte 105\_sièges pourvus par nomination et, au 25\_juillet 2026, il se répartit comme suit : 40\_membres du Groupe des sénateurs indépendants, 18\_du Groupe des sénateurs canadiens, 17\_du Groupe progressiste du Sénat, 12\_du Parti conservateur du Canada (seul groupe rattaché à un parti fédéral), 5\_au Bureau du représentant du gouvernement et 4\_non affiliés, avec 9\_sièges vacants, dont cinq au Québec [sencanada-standings-2026]. Le caractère même de la chambre haute est en mouvement : le 7\_juillet 2026, le premier ministre a annoncé des modifications au processus de nomination, abandonnant le critère non partisan qui régissait les nominations depuis 2016\_et remaniant le Comité consultatif indépendant, en même temps que ses quatre premières nominations, dont l'une, un député conservateur en poste, explique l'un des sièges vacants aux Communes [pmo-senate-2026]."
political_rightsAndChecks_en: "The judiciary is independent and exercises full judicial review, with the Supreme Court of Canada as final court of appeal [freedom-house-canada-2026]. Its nine judges are appointed by the Governor in Council from a shortlist of three to five candidates prepared by a nonpartisan Independent Advisory Board, which assesses applicants against published criteria including functional bilingualism and regional representation, and publishes a report on each process; the nominee then appears at a moderated public question-and-answer session with parliamentarians from both chambers [fja-scc-process]. The mechanism was used in full this year: the Prime Minister launched the process on 30\_March 2026\_to fill the seat vacated by Justice Sheilah Martin, named the advisory board on 19\_May, and appointed Justice Glenn Joyal on 30\_June [pm-scc-appointment-2026]. Notably, the nonpartisan criterion was retained here at the same moment it was dropped for Senate appointments [pm-scc-appointment-2026][pmo-senate-2026]. Provincial superior court judges are appointed separately, by the federal government on the advice of independent judicial advisory committees in each province. That mechanism is now contested in one province: in January 2026\_Alberta's Premier proposed a four-person committee requiring both federal and provincial ministerial approval before appointments to Alberta's superior courts proceed, which the Canadian Bar Association and its Alberta branch opposed as incompatible with section 96\_of the Constitution Act, 1867, which vests that appointment power in the federal government alone [cba-alberta-appointments-2026].\n\nMedia are independent of the state, with no direct government ownership of major private outlets [freedom-house-canada-2026]. Press freedom is nonetheless eroding on the economic rather than the political axis. Canada's score on the Reporters Without Borders index fell from 81.7\_in 2024\_to about 78.8\_in 2025\_and held flat in 2026, leaving it the highest-scoring country in the Americas but roughly eight points below its 2013\_level [rsf-index-2026]. The organisation attributes the decline to ownership concentration — more than 80% of Canadian media controlled by five corporations — and to financial fragility, alongside inconsistent access to information and harassment of journalists covering polarising subjects [rsf-index-2026]. Reporters Without Borders is a French press-freedom advocacy organisation, and its index measures the conditions for journalism rather than the quality of it.\n\nOn the civil liberties and human-rights record, Canada's own national human rights institution reports rising pressure. The Canadian Human Rights Commission received over 4,600\_inquiries and potential complaints in 2025\_and accepted more than 960, both five-year highs, with its Chief Commissioner describing the country as at a historic crossroads amid rising hate, record income inequality and cost-of-living strain [chrc-annual-report-2025]. Race-based complaints are the persistent structural finding: since 2020\_the Commission has referred them to the Canadian Human Rights Tribunal at a higher rate than other complaints and dismissed them at an equal or lower rate, and it reports that use of force by law enforcement falls disproportionately on Indigenous, Black and racialized people [chrc-annual-report-2025]. The Commission has also called for an independent Indigenous human rights system distinct from its own [chrc-annual-report-2025]. Its standing is itself qualified: the Global Alliance of National Human Rights Institutions upheld the Commission's A-status accreditation after a review prompted by civil-society concerns about systemic racial discrimination within the Commission, while urging it to keep addressing that discrimination internally as well as externally [chrc-anti-racism-2025].\n\nExternal assessments place Canada in the upper tier while recording slippage. Freedom House classifies Canada as Free in 2026 [freedom-house-canada-2026]; the Varieties of Democracy Institute classifies it as a Liberal Democracy, ranked 23rd globally in its 2026\_report [vdem-democracy-report-2026]; and the World Justice Project ranked it 13th of 143\_countries in its 2025\_index, on strong scores for constraints on government powers and absence of corruption, but recorded a weakening in civil justice (longer delays, less effective alternatives to court) in Canada as in most countries measured [wjp-canada-2025]. These instruments carry their own standpoints: Freedom House is a United States–based organisation funded largely by the United States government; the Varieties of Democracy Institute is an academic project at the University of Gothenburg working from expert coding; the World Justice Project builds its index from household and legal-practitioner surveys rather than institutional review."
political_rightsAndChecks_fr: "Le pouvoir judiciaire est indépendant et exerce un contrôle judiciaire complet, la Cour suprême du Canada agissant comme tribunal de dernier ressort [freedom-house-canada-2026]. Ses neuf juges sont nommés par le gouverneur en conseil à partir d'une liste restreinte de trois à cinq candidatures dressée par un comité consultatif indépendant non partisan, qui évalue les candidatures au regard de critères publiés (dont le bilinguisme fonctionnel et la représentation régionale) et publie un rapport sur chaque processus. La personne dont la candidature est retenue participe ensuite à une séance publique de questions et réponses animée par un modérateur, avec des parlementaires des deux chambres [fja-scc-process]. Le mécanisme a été utilisé intégralement cette année : le premier ministre a lancé le processus le 30\_mars 2026\_pour pourvoir le siège laissé vacant par la juge Sheilah Martin, a nommé les membres du comité consultatif le 19\_mai et a nommé le juge Glenn Joyal le 30\_juin [pm-scc-appointment-2026]. Fait notable, le critère non partisan a été maintenu ici au moment même où il était abandonné pour les nominations au Sénat [pm-scc-appointment-2026][pmo-senate-2026]. Les juges des cours supérieures provinciales sont nommés séparément, par le gouvernement fédéral sur l'avis de comités consultatifs indépendants sur les nominations à la magistrature établis dans chaque province. Ce mécanisme est aujourd'hui contesté dans une province : en janvier 2026, la première ministre de l'Alberta a proposé un comité de quatre personnes exigeant l'approbation ministérielle tant fédérale que provinciale avant que les nominations aux cours supérieures de l'Alberta puissent aller de l'avant; ce à quoi l'Association du Barreau canadien et sa section albertaine se sont opposées comme étant incompatible avec l'article 96\_de la Loi constitutionnelle de 1867, qui confère ce pouvoir de nomination au seul gouvernement fédéral [cba-alberta-appointments-2026].\n\nLes médias sont indépendants de l'État; aucun grand organe de presse privé n'appartenant directement au gouvernement [freedom-house-canada-2026]. La liberté de la presse s'érode néanmoins sur l'axe économique plutôt que politique. Le score du Canada à l'indice de Reporters sans frontières est passé de 81,7\_en 2024\_à environ 78,8\_en 2025, puis s'est maintenu en 2026; ce qui lui laisse le meilleur score des Amériques, mais quelque huit points sous son niveau de 2013 [rsf-index-2026]. L'organisation attribue ce recul à la concentration de la propriété (plus de 80 % des médias canadiens étant contrôlés par cinq entreprises) et à la fragilité financière, auxquelles s'ajoutent un accès à l'information inégal et le harcèlement des journalistes couvrant des sujets polarisants [rsf-index-2026]. Reporters sans frontières est une organisation française de défense de la liberté de la presse; son indice mesure les conditions d'exercice du journalisme plutôt que sa qualité.\n\nEn ce qui concerne les libertés civiles et les droits de la personne, l'institution nationale canadienne des droits de la personne fait état de pressions croissantes. La Commission canadienne des droits de la personne a reçu plus de 4 600\_demandes de renseignements et plaintes potentielles en 2025\_et en a accepté plus de 960 (deux sommets sur cinq ans); sa présidence décrivant le pays comme se trouvant à un carrefour historique, sur fond de haine croissante, d'inégalités de revenus records et de tensions liées au coût de la vie [chrc-annual-report-2025]. Les plaintes fondées sur la race constituent le constat structurel persistant : depuis 2020, la Commission les renvoie au Tribunal canadien des droits de la personne à un taux plus élevé que les autres plaintes et les rejette à un taux égal ou inférieur; elle rapporte que le recours à la force par les forces de l'ordre frappe de manière disproportionnée les personnes autochtones, noires et racisées [chrc-annual-report-2025]. La Commission a également réclamé la création d'un système autochtone indépendant de protection des droits de la personne, distinct du sien [chrc-annual-report-2025]. Sa propre position est elle-même nuancée : l'Alliance globale des institutions nationales des droits de l'homme a confirmé l'accréditation de statut A de la Commission au terme d'un examen déclenché par les préoccupations de la société civile concernant la discrimination raciale systémique au sein même de la Commission, tout en l'exhortant à continuer de s'attaquer à cette discrimination à l'interne comme à l'externe [chrc-anti-racism-2025].\n\nLes évaluations externes situent le Canada parmi les pays les mieux classés, tout en enregistrant un glissement. Freedom House classe le Canada comme libre en 2026 [freedom-house-canada-2026]; l'institut Varieties of Democracy le classe comme démocratie libérale, au 23e rang mondial dans son rapport de 2026 [vdem-democracy-report-2026]; et le World Justice Project l'a classé 13e sur 143\_pays dans son indice de 2025, grâce à de solides résultats quant aux contraintes exercées sur les pouvoirs gouvernementaux et à l'absence de corruption, mais y a constaté un affaiblissement de la justice civile (délais plus longs, modes de règlement extrajudiciaire moins efficaces) au Canada comme dans la plupart des pays mesurés [wjp-canada-2025]. Ces instruments ont leurs propres points de vue : Freedom House est une organisation établie aux États-Unis et financée en grande partie par le gouvernement états-unien; l'institut Varieties of Democracy est un projet universitaire de l'Université de Göteborg reposant sur le codage d'experts; le World Justice Project construit son indice à partir de sondages menés auprès des ménages et des praticiens du droit plutôt qu'à partir d'un examen institutionnel."
political_stabilityDrivers_en: "Legitimacy rests on procedural democratic foundations: regular, competitive, monitored elections; an independent judiciary; and constitutional protection of rights under the Canadian Charter of Rights and Freedoms [freedom-house-canada-2026][vdem-democracy-report-2026].\n\nCivilian control of the security forces is statutory and unambiguous. Under the National Defence Act, the Minister of National Defence has the management and direction of the Canadian Armed Forces; the Chief of the Defence Staff is appointed by the Governor in Council and is charged with their control and administration under the direction of the Minister, and all orders giving effect to government decisions issue by or through that office [justice-national-defence-act]. Under the Royal Canadian Mounted Police Act, the Commissioner of the Royal Canadian Mounted Police is likewise appointed by the Governor in Council and has control and management of the force under the direction of the Minister of Public Safety [justice-rcmp-act]. The force's own doctrine draws the line precisely: the Commissioner is accountable to the Minister but operationally independent, and free from the direction of elected officials in core law-enforcement functions [rcmp-transition-binder]. Institutional loyalty to civilian authority is not in question, and Canada has no history of military intervention in politics.\n\nGovernment composition is single-party rather than coalition. The governing Liberal party holds a majority in its own right, which removes the confidence-vote fragility that defined its first year; the binding constraint shifts from inter-party bargaining to internal discipline across an enlarged and ideologically broad caucus that now includes five recent floor-crossers [ourcommons-membership-changes][cbc-carney-majority-byelections-2026].\n\nBusiness-elite alignment is conditional rather than automatic. The energy producers, the chartered banks and export manufacturers support macroeconomic stability but press the government on trade diversification, regulatory competitiveness and the response to United States tariffs [imf-can-2025-art4][gac-state-of-trade-2025].\n\nThe consequential fracture in the governing bloc is vertical, between the federal government and one province, not horizontal within the caucus. Alberta has set a provincial referendum for 19\_October 2026\_carrying ten questions, four of them constitutional and directed at the province's relationship with the federal government, under Orders in Council 109/2026, 110/2026\_and 160/2026 [elections-alberta-referendum-2026]. The tenth question asks whether Alberta should remain a province of Canada or whether its government should commence the legal process required to hold a binding referendum on separation; the Order in Council states the result is not binding, and the Premier has said she supports remaining in Canada and will campaign for that option [elections-alberta-referendum-2026][alberta-premier-address-2026]. The same province has separately proposed a joint federal–provincial committee to approve appointments to its superior courts, which the legal profession opposed as constitutionally impermissible [cba-alberta-appointments-2026]. \nIndigenous treaty rights have twice halted the citizen-petition route to such a vote. In December 2025\_the Court of King's Bench of Alberta found a proposed separation question contravened the Canadian Charter of Rights and Freedoms and historic treaties; on 13\_May 2026, in a case brought by four First Nations, Athabasca Chipewyan, Piikani, Siksika and Blood Tribe (Kainai), the same court set aside approval of a petition on substantially the same question, holding that Alberta had breached its duty to consult and that secession would necessarily affect Treaties 7\_and 8 [fasken-alberta-secession-2026][aptn-alberta-petition-2026]. The province had by then amended its Citizen Initiative Act to remove the requirement that proposed questions be constitutional and the chief electoral officer's power to refer them to the courts, and the government subsequently placed its own separation-process question on the October ballot by Order in Council, a route that requires no citizen petition [aptn-alberta-petition-2026][elections-alberta-referendum-2026]. The Premier has said the ruling is wrong in law and is being appealed [aptn-alberta-petition-2026]. The Assembly of First Nations has separately invoked the numbered Treaties and called for federal review of the 1930\_Natural Resources Transfer Agreement [afn-nrta-2025]."
political_stabilityDrivers_fr: "La légitimité repose sur des fondements démocratiques procéduraux : des élections régulières, concurrentielles et observées; un pouvoir judiciaire indépendant; et la protection constitutionnelle des droits garantie par la Charte canadienne des droits et libertés [freedom-house-canada-2026][vdem-democracy-report-2026].\n\nLe contrôle civil des forces de sécurité est de nature législative et sans ambiguïté. En vertu de la Loi sur la défense nationale, le ministre de la Défense nationale assure la gestion et la direction des Forces armées canadiennes; le chef d'état-major de la défense est nommé par le gouverneur en conseil et est chargé de leur contrôle et de leur administration sous la direction du ministre, et tous les ordres donnant effet aux décisions du gouvernement émanent de ce poste ou transitent par lui [justice-national-defence-act]. En vertu de la Loi sur la Gendarmerie royale du Canada, le commissaire de la Gendarmerie royale du Canada est de même nommé par le gouverneur en conseil et assure le contrôle et la gestion du corps policier sous la direction du ministre de la Sécurité publique [justice-rcmp-act]. Les politiques internes de la Gendarmerie tracent la ligne avec précision : le commissaire répond de son action devant le ministre, mais demeure indépendant sur le plan opérationnel et soustrait à la direction des élus dans l'exercice des fonctions policières fondamentales [rcmp-transition-binder]. La loyauté institutionnelle envers l'autorité civile n'est pas en cause, et le Canada ne connaît aucun antécédent d'intervention militaire dans la vie politique.\n\nLa composition du gouvernement est monopartisane plutôt que de coalition. Le Parti libéral au pouvoir détient une majorité à lui seul; ce qui écarte la fragilité liée aux votes de confiance qui avait marqué sa première année. La contrainte déterminante se déplace de la négociation entre les partis vers la discipline interne au sein d'un caucus élargi et idéologiquement hétérogène, qui compte désormais cinq députés ayant récemment changé d'allégeance [ourcommons-membership-changes][cbc-carney-majority-byelections-2026].\n\nL'adhésion des élites économiques est conditionnelle plutôt qu'automatique. Les producteurs énergétiques, les banques à charte et les manufacturiers exportateurs appuient la stabilité macroéconomique, mais pressent le gouvernement sur la diversification commerciale, la compétitivité réglementaire et la riposte aux droits de douane imposés par les États-Unis [imf-can-2025-art4][gac-state-of-trade-2025].\n\nLa fracture lourde de conséquences au sein du bloc gouvernant est verticale, entre le gouvernement fédéral et une province, et non horizontale à l'intérieur du caucus. L'Alberta a fixé au 19\_octobre 2026\_un référendum provincial portant dix questions, dont quatre de nature constitutionnelle et visant les rapports de la province avec le gouvernement fédéral, en vertu des décrets 109/2026, 110/2026\_et 160/2026 [elections-alberta-referendum-2026]. La dixième question demande si l'Alberta devrait demeurer une province du Canada ou si son gouvernement devrait entamer le processus juridique requis pour tenir un référendum exécutoire sur la séparation; le décret précise que le résultat n'est pas exécutoire, et la première ministre a déclaré qu'elle est favorable au maintien au sein du Canada et qu'elle fera campagne en ce sens [elections-alberta-referendum-2026][alberta-premier-address-2026]. La même province a par ailleurs proposé un comité mixte fédéral-provincial chargé d'approuver les nominations à ses cours supérieures; ce à quoi la profession juridique s'est opposée comme étant constitutionnellement inadmissible [cba-alberta-appointments-2026]. \nLes droits issus de traités des peuples autochtones ont bloqué à deux reprises la voie de la pétition citoyenne menant à un tel scrutin. En décembre 2025, la Cour du Banc du Roi de l'Alberta a jugé qu'une question de séparation proposée contrevenait à la Charte canadienne des droits et libertés ainsi qu'à des traités historiques; le 13\_mai 2026, dans une affaire intentée par quatre Premières Nations (les Chipewyans d'Athabasca, les Piikani, les Siksika et la Tribu des Blood [Kainai]), le même tribunal a annulé l'approbation d'une pétition portant sur une question substantiellement identique, statuant que l'Alberta avait manqué à son obligation de consulter et que la sécession toucherait nécessairement les Traités nos 7\_et 8 [fasken-alberta-secession-2026][aptn-alberta-petition-2026]. La province avait entre-temps modifié sa loi sur les initiatives citoyennes pour supprimer l'exigence voulant que les questions proposées soient constitutionnelles ainsi que le pouvoir du directeur général des élections de les soumettre aux tribunaux. Le gouvernement a par la suite inscrit sa propre question sur le processus de séparation au bulletin de vote d'octobre par décret; voie qui ne requiert aucune pétition citoyenne [aptn-alberta-petition-2026][elections-alberta-referendum-2026]. La première ministre a déclaré que la décision est erronée en droit et qu'elle est portée en appel [aptn-alberta-petition-2026]. L'Assemblée des Premières Nations a par ailleurs invoqué les traités numérotés et réclamé un réexamen fédéral de la Convention sur le transfert des ressources naturelles de 1930 [afn-nrta-2025]."
political_shockAbsorbers_en: "The buffers are substantial and mostly fiscal. Major federal transfers to the provinces and territories reach $108.4\_billion in 2026-27, including $27.2\_billion in unconditional equalization payments to less prosperous provinces, which cushions regional downturns automatically rather than by discretionary decision [finance-major-transfers-2026]. Federal fiscal capacity is real: the deficit sits at 2.1% of output on a declining track and federal debt at 41.1% is projected to stay broadly flat rather than climb, three of the four major rating agencies place Canada at their highest grade and the fourth one notch below, and sovereign debt is held predominantly by domestic institutional investors, so the government can borrow at low cost without foreign-creditor or currency exposure [seu-2026][pbo-efo-jun2026][imf-can-2025-art4]. Monetary room is thinner than it was: the Bank of Canada has already cut its policy rate from 5.00% to 2.25% since early 2024\_and has held it there for six consecutive decisions, so far less room remains to cut in a fresh downturn than was available two years ago [boc-mpr-jul2026][seu-2026].\n\nThe political accelerants concern the durability of the majority rather than its survival. The government holds 172\_of 343\_seats (the bare majority threshold, one of which is the Speaker's) with four seats vacant, and it crossed that threshold between elections rather than at one, which the Official Opposition argues gives the majority no democratic mandate [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026]. Defections, further vacancies or by-election losses would leave its ability to legislate resting on the Speaker's casting vote. Confidence in the institution is the weakest link: only 28.3% of Canadians reported high confidence in the federal Parliament in the fourth quarter of 2024, and 40.0% reported low confidence, the worst reading of any institution measured [statcan-css-trust-institutions-q4-2024].\n\nThe sharper accelerant is constitutional and dated. Alberta holds a referendum on 19\_October 2026\_whose tenth question asks whether the province should remain in Canada or commence the legal process toward a binding separation vote; the result is not binding and the Premier campaigns for remaining, but a majority for the second option would open a constitutional process with no agreed procedure and against active Indigenous treaty litigation, which the province is appealing [elections-alberta-referendum-2026][aptn-alberta-petition-2026].\n\nTwo external shocks are live and unresolved. The Canada–United States–Mexico Agreement passed its review deadline on 1\_July 2026\_without renewal, moving to rolling annual reviews with steel, aluminum, autos, lumber and procurement unsettled, while the Parliamentary Budget Officer treats existing United States tariffs as permanent [statcan-merch-trade-may2026][pbo-efo-jun2026]. The Middle East oil shock cuts both ways: as a net energy exporter with little exposure to the Strait of Hormuz, Canada gains on its terms of trade and in government revenue while households and businesses absorb higher costs [seu-2026]. The scale of the damage if it worsens has been quantified : in the government's own adverse scenario, a prolonged supply disruption pushing crude toward US$115\_a barrel with broader supply-chain spillovers would leave real output 1.3% below baseline at peak impact in 2028 [seu-2026]. Inflation is easing from its peak, at 2.8% in June 2026\_after 3.2% in May, and output was flat in the first quarter of 2026\_after a fourth-quarter contraction, so the stress is a stalled recovery exposed to an unresolved external shock rather than an inflationary spiral [statcan-cpi-jun2026][statcan-gdp-q1-2026]."
political_shockAbsorbers_fr: "Les facteurs d'atténuation sont substantiels et pour l'essentiel budgétaires. Les principaux transferts fédéraux aux provinces et aux territoires atteignent 108,4\_milliards de dollars en 2026-2027, dont 27,2\_milliards en paiements de péréquation sans condition versés aux provinces moins prospères; ce qui atténue les replis régionaux de façon automatique plutôt que par décision discrétionnaire [finance-major-transfers-2026]. La capacité budgétaire fédérale est bien réelle : le déficit s'établit à 2,1 % du produit intérieur brut sur une trajectoire descendante, la dette fédérale à 41,1 % devrait demeurer globalement stable plutôt que de progresser, trois des quatre grandes agences de notation accordent au Canada leur cote la plus élevée et la quatrième la situe un cran en dessous, et la dette souveraine est détenue majoritairement par des investisseurs institutionnels canadiens, de sorte que le gouvernement peut emprunter à faible coût sans exposition aux créanciers étrangers ni au risque de change [seu-2026][pbo-efo-jun2026][imf-can-2025-art4]. La marge de manœuvre monétaire est plus étroite qu'auparavant : la Banque du Canada a déjà abaissé son taux directeur de 5,00 % à 2,25 % depuis le début de 2024\_et le maintient à ce niveau depuis six décisions consécutives, de sorte qu'il lui reste bien moins de marge pour réduire ce taux advenant un nouveau repli qu'elle n'en avait deux ans plus tôt [boc-mpr-jul2026][seu-2026].\n\nLes facteurs d'aggravation politiques concernent la durabilité de la majorité plutôt que sa survie. Le gouvernement détient 172\_des 343\_sièges (le seuil strict de la majorité, dont l'un est celui du Président de la Chambre), avec quatre sièges vacants, et il a franchi ce seuil entre deux élections plutôt qu'à l'occasion d'un scrutin; ce qui, selon l'opposition officielle, prive cette majorité de tout mandat démocratique [ourcommons-party-standings-2026][cbc-carney-majority-byelections-2026]. Des défections, de nouvelles vacances ou des défaites aux élections partielles feraient reposer sa capacité de légiférer sur la voix prépondérante du Président. La confiance envers l'institution constitue le maillon faible : seulement 28,3 % de la population canadienne déclaraient une confiance élevée envers le Parlement fédéral au quatrième trimestre de 2024, et 40,0 % une faible confiance; plus mauvais résultat parmi toutes les institutions mesurées [statcan-css-trust-institutions-q4-2024].\n\nLe facteur d'aggravation le plus aigu est de nature constitutionnelle et porte une date. L'Alberta tient un référendum le 19\_octobre 2026\_dont la dixième question demande si la province devrait demeurer au sein du Canada ou entamer le processus juridique menant à un vote exécutoire sur la séparation. Le résultat n'est pas exécutoire et la première ministre fait campagne pour le maintien, mais une majorité en faveur de la seconde option ouvrirait un processus constitutionnel dépourvu de procédure convenue, et ce, dans un contexte de litiges autochtones actifs fondés sur les traités, que la province porte en appel [elections-alberta-referendum-2026][aptn-alberta-petition-2026].\n\nDeux chocs externes sont en cours et non résolus. L'Accord Canada–États-Unis–Mexique a franchi son échéance d'examen le 1er juillet 2026\_sans être reconduit, passant à des examens annuels successifs, alors que les dossiers de l'acier, de l'aluminium, de l'automobile, du bois d'œuvre et des marchés publics demeurent en suspens, tandis que la directrice parlementaire du budget considère les droits de douane états-uniens en vigueur comme permanents [statcan-merch-trade-may2026][pbo-efo-jun2026]. Le choc pétrolier au Moyen-Orient joue dans les deux sens : exportateur net d'énergie et peu exposé au détroit d'Ormuz, le Canada y gagne sur le plan de ses termes de l'échange et des revenus de l'État, tandis que les ménages et les entreprises en absorbent les coûts accrus [seu-2026]. L'ampleur des dommages en cas d'aggravation a été chiffrée : dans le scénario défavorable établi par le gouvernement lui-même, une perturbation prolongée de l'approvisionnement portant le brut vers 115\_dollars américains le baril, assortie de répercussions plus larges sur les chaînes d'approvisionnement, se traduirait par un PIB inférieur de 1,3 % au scénario de référence en 2028, année où l'écart atteindrait son maximum [seu-2026]. L'inflation reflue depuis son sommet, à 2,8 % en juin 2026\_après 3,2 % en mai, et le PIB est demeuré stable au premier trimestre de 2026\_après une contraction au quatrième trimestre : la tension tient donc à une reprise en panne exposée à un choc externe non résolu, et non à une spirale inflationniste [statcan-cpi-jun2026][statcan-gdp-q1-2026]."
political_constitutionalSubstrate_en: "Canada is a federal parliamentary democracy under a constitutional monarchy, founded by the Constitution Act, 1867, which distributed sovereignty between a federal Parliament and the provincial legislatures and continued the pre-Union legal systems in force [canlii-constitution-act-1867]. That founding was completed only in 1982: the Canada Act 1982\_ended the British Parliament's power to legislate for Canada, and the Constitution Act, 1982\_enacted as its schedule brought home a domestic amending formula, entrenched the Canadian Charter of Rights and Freedoms, and recognized and affirmed existing Aboriginal and treaty rights at section 35 [justice-constitution-acts]. Beneath that architecture sit two distinct pluralities — two private-law traditions within one federation, and Indigenous legal orders whose foundations predate the state — which have to be described on their own terms rather than merged. The substrate is stable in its bijural dimension and in motion in its federal and Indigenous dimensions, where apex-court and superior-court doctrine is actively determining what the vertical allocation permits.\n\nThe first plurality is bijuralism. Quebec operates under civil law, codified in the Civil Code of Québec (in force 1\_January 1994), which governs persons, family, succession, property, obligations and civil liability, and which lays down the general private law of the province in harmony with the Charter of the French language and the Charter of human rights and freedoms; the Code replaced the 1866\_Civil Code of Lower Canada [legisquebec-ccq-1991]. The other nine provinces and three territories operate under English common law, continued in force at Confederation by section 129\_of the Constitution Act, 1867, which maintained all pre-Union laws and courts subject to alteration by Parliament or the respective legislature [canlii-constitution-act-1867]. Federal law is officially bijural: the Federal Law–Civil Law Harmonization Act, assented to 10\_May 2001, repealed the pre-Confederation provisions of the Civil Code of Lower Canada falling within federal jurisdiction, harmonized several federal statutes with the Civil Code of Québec, and added sections 8.1\_and 8.2\_to the Interpretation Act, making bijuralism an interpretive principle for all federal statutes and providing that provincial private law completes federal legislation on a suppletive basis [justice-harmonization-act-2001]. The Department of Justice defines this as legislative bijuralism: the requirement that each language version of a federal enactment take both traditions into account where it touches provincial private law [justice-bijuralism-terminology]. The practical consequence is that property, contract and civil liability behave differently in Quebec than elsewhere, and every federal statute touching those matters must work in both traditions at once.\n\nThe second plurality is Indigenous constitutional rights and title, held distinct across substrates because the legal foundations themselves differ. In Quebec, the James Bay and Northern Quebec Agreement of 11\_November 1975\_is the country's first modern comprehensive land-claim treaty, covering roughly one million square kilometres and signed by Canada, Quebec, Hydro-Québec, the Grand Council of the Crees and the Northern Quebec Inuit Association; it has since been amended by 24\_complementary agreements and extended by the Paix des Braves of 7\_February 2002\_between Quebec and the Cree Nation, the Federal New Relationship Agreement of 2008, and the Agreement on Cree Nation Governance of 2017\_with its companion Cree Constitution [cngov-agreements]. \nIn much of British Columbia, by contrast, most First Nations never signed a treaty with the Crown and Aboriginal title is established territorially rather than by settlement. In Tsilhqot'in Nation v. British Columbia, the Supreme Court issued the first declaration of Aboriginal title in Canadian history over 1,750\_square kilometres, holding that title rests on sufficient, continuous and exclusive pre-sovereignty occupation extending to territory rather than merely site-specific use, that Crown incursions on title land require consent or must satisfy the section 35\_justification framework, and that the province had breached its duty to consult [canlii-tsilhqotin-2014][tsilhqotin-ng-rights-title]. \nA third mechanism operates on the prairies, where provincial control of natural resources rests on the transfer of 1930, given constitutional force among the enactments comprised in the Constitution Acts, 1867\_to 1982; an instrument First Nations hold cannot lawfully alienate what the numbered Treaties never surrendered [justice-constitution-acts].\n\nThe vertical allocation is under active judicial determination, and this is where the substrate is in motion. The governing authority is the Supreme Court's unanimous opinion in the Quebec Secession Reference: no province may secede unilaterally, secession would require a constitutional amendment, and a clear majority on a clear question would confer democratic legitimacy creating a reciprocal constitutional duty on the other participants in Confederation to negotiate — with the content of \"clear majority\" and \"clear question\" left to the political actors, and the negotiation obliged to address the rights of minorities and of Indigenous peoples [canlii-secession-reference-1998]. Parliament codified its own side of that relationship in the Clarity Act, which reserves to the House of Commons the determination of whether a referendum question is clear and whether a clear majority has been expressed, and bars the Government of Canada from entering secession negotiations otherwise [justice-clarity-act]. That framework is now being applied against a live provincial initiative. In Athabasca Chipewyan First Nation v Alberta (Chief Electoral Officer), the Court of King's Bench of Alberta set aside the Chief Electoral Officer's approval of an initiative petition for a referendum on Alberta independence, holding that the Crown owed and had breached a duty to consult the applicant First Nations (Athabasca Chipewyan, Piikani, Siksika and Blood Tribe [Kainai]) and that Alberta's secession would necessarily affect Treaties 7\_and 8; the court also relied on its own earlier decision in Chief Electoral Officer of Alberta v Sylvestre, which had held that the proposed question contravened treaty rights protected by section 35 [canlii-acfn-2026]. The province is appealing. The operative doctrine is therefore that Indigenous treaty rights are not a consideration within a secession process but a constitutional precondition to initiating one."
political_constitutionalSubstrate_fr: "Le Canada est une démocratie parlementaire fédérale sous monarchie constitutionnelle, fondée par la Loi constitutionnelle de 1867, qui a réparti la souveraineté entre un parlement fédéral et les législatures provinciales et maintenu en vigueur les systèmes juridiques antérieurs à l'Union [canlii-constitution-act-1867]. Cette fondation ne s'est achevée qu'en 1982 : la Loi de 1982\_sur le Canada a mis fin au pouvoir du Parlement britannique de légiférer pour le Canada, et la Loi constitutionnelle de 1982, adoptée à titre d'annexe de celle-ci, a rapatrié une formule de modification constitutionnelle, enchâssé la Charte canadienne des droits et libertés et reconnu et confirmé les droits existants (ancestraux ou issus de traités) à son article 35 [justice-constitution-acts]. Sous cette architecture reposent deux pluralités distinctes (deux traditions de droit privé au sein d'une même fédération, et des ordres juridiques autochtones dont les fondements précèdent l'État), qui doivent être décrites selon leurs propres termes plutôt que fusionnées. Le substrat est stable dans sa dimension bijuridique et en mouvement dans ses dimensions fédérale et autochtone, où la jurisprudence de la juridiction suprême et des cours supérieures détermine activement ce que le partage vertical des compétences autorise.\n\nLa première pluralité est le bijuridisme. Le Québec relève du droit civil, codifié dans le Code civil du Québec (en vigueur le 1er janvier 1994), qui régit les personnes, la famille, les successions, les biens, les obligations et la responsabilité civile, et qui établit le droit commun de la province en harmonie avec la Charte de la langue française et la Charte des droits et libertés de la personne; le Code a remplacé le Code civil du Bas-Canada de 1866 [legisquebec-ccq-1991]. Les neuf autres provinces et les trois territoires relèvent de la common law anglaise, maintenue en vigueur au moment de la Confédération par l'article 129\_de la Loi constitutionnelle de 1867, qui a préservé l'ensemble des lois et des tribunaux antérieurs à l'Union, sous réserve de modification par le Parlement ou par la législature concernée [canlii-constitution-act-1867]. Le droit fédéral est officiellement bijuridique : la Loi d'harmonisation no 1\_du droit fédéral avec le droit civil, sanctionnée le 10\_mai 2001, a abrogé les dispositions préconfédératives du Code civil du Bas-Canada relevant de la compétence fédérale, harmonisé plusieurs lois fédérales avec le Code civil du Québec et ajouté les articles 8.1\_et 8.2\_à la Loi d'interprétation, faisant du bijuridisme un principe d'interprétation applicable à toutes les lois fédérales et prévoyant que le droit privé provincial complète la législation fédérale à titre supplétif [justice-harmonization-act-2001]. Le ministère de la Justice qualifie cette réalité de bijuridisme législatif : l'exigence voulant que chaque version linguistique d'un texte fédéral tienne compte des deux traditions lorsqu'elle touche au droit privé provincial [justice-bijuralism-terminology]. La conséquence pratique est que les biens, les contrats et la responsabilité civile ne se comportent pas de la même manière au Québec qu'ailleurs, et que chaque loi fédérale touchant ces matières doit fonctionner simultanément dans les deux traditions.\n\nLa seconde pluralité tient aux droits et au titre constitutionnels autochtones, maintenus distincts d'un substrat à l'autre parce que les fondements juridiques eux-mêmes diffèrent. Au Québec, la Convention de la Baie-James et du Nord québécois du 11\_novembre 1975\_est le premier traité moderne global de revendication territoriale au pays. Elle couvre environ un million de kilomètres carrés et a été signée par le Canada, le Québec, Hydro-Québec, le Grand Conseil des Cris et l'Association des Inuit du Nouveau-Québec. Elle a depuis été modifiée par 24\_conventions complémentaires et prolongée par la Paix des Braves du 7\_février 2002\_entre le Québec et la Nation crie; l'Entente concernant une nouvelle relation avec le gouvernement du Canada de 2008\_et l'Entente sur la gouvernance de la nation crie de 2017, assortie de la Constitution crie qui l'accompagne [cngov-agreements]. \nDans une grande partie de la Colombie-Britannique, en revanche, la plupart des Premières Nations n'ont jamais signé de traité avec la Couronne et le titre ancestral s'établit sur une base territoriale plutôt que par règlement : dans Nation Tsilhqot'in contre la Colombie-Britannique, la Cour suprême a rendu la première déclaration de titre ancestral de l'histoire canadienne, portant sur 1 750\_kilomètres carrés, statuant que le titre repose sur une occupation suffisante, continue et exclusive antérieure à l'affirmation de souveraineté et s'étendant au territoire plutôt qu'à un usage limité à des sites précis, que les atteintes de la Couronne aux terres visées par un titre exigent le consentement ou doivent satisfaire au cadre de justification de l'article 35, et que la province avait manqué à son obligation de consulter [canlii-tsilhqotin-2014][tsilhqotin-ng-rights-title]. \nUn troisième mécanisme s'applique dans les Prairies, où le contrôle provincial des ressources naturelles repose sur le transfert de 1930, qui figure parmi les textes constitutionnels énumérés dans les Lois constitutionnelles de 1867\_à 1982; instrument qui, selon les Premières Nations, ne peut légalement aliéner ce que les traités numérotés n'ont jamais cédé [justice-constitution-acts].\n\nLe partage vertical des compétences fait l'objet d'une détermination judiciaire active; c'est là que le substrat est en mouvement. La règle applicable découle de l'avis unanime de la Cour suprême dans le Renvoi relatif à la sécession du Québec : aucune province ne peut faire sécession unilatéralement, la sécession exigerait une modification constitutionnelle, et une majorité claire à une question claire conférerait une légitimité démocratique donnant naissance à une obligation constitutionnelle réciproque de négocier pour les autres participants à la Confédération; le contenu de la « majorité claire » et de la « question claire » étant laissé aux acteurs politiques, et la négociation devant nécessairement porter sur les droits des minorités et sur ceux des peuples autochtones [canlii-secession-reference-1998]. Le Parlement a codifié sa propre part de cette relation dans la Loi sur la clarté référendaire, qui réserve à la Chambre des communes le soin de déterminer si une question référendaire est claire et si une majorité claire s'est exprimée, et qui interdit au gouvernement du Canada d'engager des négociations sur la sécession à défaut de ces conditions [justice-clarity-act]. Ce cadre est maintenant appliqué à une initiative provinciale en cours. Dans l'affaire Première Nation Athabasca Chipewyan contre l'Alberta (directeur général des élections), la Cour du Banc du Roi de l'Alberta a annulé l'approbation, par le directeur général des élections, d'une pétition d'initiative visant la tenue d'un référendum sur l'indépendance de l'Alberta, statuant que la Couronne était tenue à une obligation de consulter les Premières Nations requérantes (les Chipewyans d'Athabasca, les Piikani, les Siksika et la Tribu des Blood [Kainai]) et qu'elle y avait manqué, et que la sécession de l'Alberta toucherait nécessairement les Traités nos 7\_et 8; le tribunal s'est également appuyé sur sa propre décision antérieure dans l'affaire du directeur général des élections de l'Alberta contre Sylvestre, où il avait jugé que la question proposée contrevenait à des droits issus de traités protégés par l'article 35 [canlii-acfn-2026]. La province porte l'affaire en appel. L'état du droit veut donc que les droits issus de traités des peuples autochtones ne constituent pas un élément à considérer au sein d'un processus de sécession, mais une condition constitutionnelle préalable à son déclenchement."
political_stateStructure_en: "Canada is a federation of ten provinces and three territories. The provinces are Alberta, British Columbia, Manitoba, New Brunswick, Newfoundland and Labrador, Nova Scotia, Ontario, Prince Edward Island, Quebec and Saskatchewan; the territories are the Northwest Territories, Nunavut and Yukon [ourcommons-party-standings-2026]. Sovereignty is divided between one federal Parliament and ten provincial legislatures, each drawing its authority directly from the Constitution rather than by delegation from the other [canlii-constitution-act-1867].\n\nThe division of powers is set out in Part VI of the Constitution Act, 1867. Section 91\_assigns Parliament an enumerated list — trade and commerce, banking and currency, criminal law, navigation and shipping, defence, the postal service, and \"Indians, and Lands reserved for the Indians\" — together with a residual power to legislate for the peace, order and good government of Canada. Section 92\_assigns the provinces exclusive jurisdiction over direct taxation within the province, property and civil rights, the administration of justice, hospitals, municipal institutions and local works and undertakings; section 92A, added at patriation in 1982, confirms provincial jurisdiction over exploration, development, conservation and management of non-renewable natural resources, forestry and electrical generation, with a power to tax them; and section 93\_assigns education exclusively to the provinces [canlii-constitution-act-1867]. Two heads are concurrent, and they run in opposite directions: under section 95\_agriculture and immigration are shared with federal paramountcy, so provincial law operates only so far as it is not repugnant to a federal Act, while under section 94A, Parliament may legislate on old age pensions and supplementary benefits but no such law may affect the operation of a provincial law — the one place where provincial legislation is paramount [canlii-constitution-act-1867][lop-distribution-powers].\n\nThe sharpest asymmetry is between provinces and territories. Provincial jurisdiction is constitutionally entrenched; territorial jurisdiction is delegated by federal statute (the Yukon Act, the Northwest Territories Act and the Nunavut Act) so the territories have no inherent authority beyond what Parliament confers, even though those statutes now grant them powers largely equivalent to provincial ones, including property and civil rights [justice-territories-jurisdiction]. The consequences are structural rather than nominal: a territory's constitution is a federal statute amendable by Parliament alone, the territories are not parties to the constitutional amending formula, and a territory seeking provincial status would require a constitutional amendment carrying the consent of Parliament and seven provinces representing half the national population [ntassembly-differences]. Devolution has narrowed the practical gap — Yukon took control of its public lands and resources in 2003\_and the Northwest Territories in 2014 — without altering the legal footing [justice-territories-jurisdiction].\n\nQuebec holds the most extensive asymmetric arrangements. It operates under civil law rather than common law, and it is the only province to have exercised the option under section 94A to run its own contributory pension plan instead of the federal one [lop-distribution-powers]. Under the section 95\_concurrency it has turned shared jurisdiction into a distinct selection regime: the Canada–Québec Accord relating to Immigration and Temporary Admission of Aliens, signed 5\_February 1991\_and in force since 1\_April that year, gives Quebec sole authority to select economic immigrants and refugees resettled from abroad, an explicit veto over resettled refugees destined for Quebec who do not meet its criteria, exclusive responsibility for settlement and integration services, and an annual federal grant no other province receives; Canada retains admissibility screening, permanent-resident visa issuance, and selection in the family and protected-person classes [ircc-canada-quebec-accord][ircc-accord-briefing]. Tax administration is asymmetric on the same pattern: under tax collection agreements the Canada Revenue Agency collects and administers income taxes for every province and territory except Quebec's personal and corporate income taxes and Alberta's corporate income tax, so Quebec taxpayers file separate federal and provincial returns where taxpayers elsewhere file one [cra-tax-collection-agreements].\n\nFiscal asymmetry is formalized in the transfer system. Equalization pays $27.2\_billion in 2026-27\_to provinces with below-average fiscal capacity, an unconditional payment that some provinces receive and others do not, while the territories are funded through a separate instrument, Territorial Formula Financing, worth $5.8\_billion, which reflects the higher cost of delivering services in the North [finance-major-transfers-2026]. One structural consequence of section 92\_runs the other way: because property, civil rights and local undertakings are provincial, regulatory requirements differ across provincial borders, and internal barriers to the movement of goods, services and labour persist within the federation despite repeated efforts to reduce them [imf-country-focus-internal-trade-2026]."
political_stateStructure_fr: "Le Canada est une fédération composée de dix provinces et de trois territoires. Les provinces sont l'Alberta, la Colombie-Britannique, le Manitoba, le Nouveau-Brunswick, Terre-Neuve-et-Labrador, la Nouvelle-Écosse, l'Ontario, l'Île-du-Prince-Édouard, le Québec et la Saskatchewan; les territoires sont les Territoires du Nord-Ouest, le Nunavut et le Yukon [ourcommons-party-standings-2026]. La souveraineté est partagée entre un parlement fédéral et dix législatures provinciales, chacune tirant son autorité directement de la Constitution plutôt que par délégation de l'autre ordre de gouvernement [canlii-constitution-act-1867].\n\nLe partage des compétences est énoncé à la partie VI de la Loi constitutionnelle de 1867. L'article 91\_attribue au Parlement une liste énumérée (les échanges et le commerce, les banques et la monnaie, le droit criminel, la navigation et les expéditions par eau, la défense, le service postal, ainsi que « les Indiens et les terres réservées pour les Indiens »), assortie d'un pouvoir résiduel de légiférer pour la paix, l'ordre et le bon gouvernement du Canada. L'article 92\_confère aux provinces une compétence exclusive sur la taxation directe dans les limites de la province, la propriété et les droits civils, l'administration de la justice, les hôpitaux, les institutions municipales et les travaux et entreprises d'une nature locale. L'article 92A, ajouté lors du rapatriement de 1982, confirme la compétence provinciale sur l'exploration, l'exploitation, la conservation et la gestion des ressources naturelles non renouvelables, des ressources forestières et de la production d'électricité, avec un pouvoir de taxation à leur égard. L'article 93\_attribue l'éducation exclusivement aux provinces [canlii-constitution-act-1867]. Deux chefs de compétence sont concurrents, et ils jouent en sens inverse : en vertu de l'article 95, l'agriculture et l'immigration sont partagées avec prépondérance fédérale, de sorte que la loi provinciale n'a d'effet que dans la mesure où elle n'est pas incompatible avec une loi fédérale; alors qu'en vertu de l'article 94A, le Parlement peut légiférer en matière de pensions de vieillesse et de prestations additionnelles, mais aucune loi de ce type ne peut porter atteinte à l'application d'une loi provinciale, le seul cas où la législation provinciale est prépondérante [canlii-constitution-act-1867][lop-distribution-powers].\n\nL'asymétrie la plus marquée sépare les provinces des territoires. La compétence provinciale est enchâssée dans la Constitution. La compétence territoriale est déléguée par une loi fédérale (la Loi sur le Yukon, la Loi sur les Territoires du Nord-Ouest et la Loi sur le Nunavut), de sorte que les territoires ne disposent d'aucune autorité inhérente au-delà de ce que le Parlement leur confère, même si ces lois leur accordent aujourd'hui des pouvoirs largement équivalents à ceux des provinces, y compris sur la propriété et les droits civils [justice-territories-jurisdiction]. Les conséquences sont structurelles plutôt que nominales : la constitution d'un territoire est une loi fédérale que le Parlement peut modifier seul; les territoires ne sont pas partis à la formule de modification constitutionnelle, et un territoire qui chercherait à accéder au statut de province devrait obtenir une modification constitutionnelle appuyée par le Parlement et par sept provinces représentant la moitié de la population du pays [ntassembly-differences]. Le transfert de responsabilités a réduit l'écart en pratique (le Yukon a pris le contrôle de ses terres publiques et de ses ressources en 2003, et les Territoires du Nord-Ouest en 2014), sans modifier le fondement juridique [justice-territories-jurisdiction].\n\nLe Québec détient les arrangements asymétriques les plus étendus. Il relève du droit civil plutôt que de la common law, et il est la seule province à avoir exercé l'option prévue à l'article 94A pour administrer son propre régime de rentes contributif au lieu du régime fédéral [lop-distribution-powers]. Dans le cadre de la compétence concurrente de l'article 95, il a converti une compétence partagée en un régime de sélection distinct : l'Accord Canada-Québec relatif à l'immigration et à l'admission temporaire des aubains (ressortissants étrangers), signé le 5\_février 1991\_et en vigueur depuis le 1er avril de la même année, confère au Québec l'autorité exclusive de sélectionner les immigrants économiques et les réfugiés réinstallés depuis l'étranger, un droit de veto explicite sur les réfugiés réinstallés à destination du Québec qui ne satisfont pas à ses critères, la responsabilité exclusive des services d'accueil et d'intégration, ainsi qu'une subvention fédérale annuelle qu'aucune autre province ne reçoit; le Canada conserve le contrôle de l'admissibilité, la délivrance des visas de résidence permanente et la sélection dans les catégories du regroupement familial et des personnes protégées [ircc-canada-quebec-accord][ircc-accord-briefing]. L'administration fiscale est asymétrique suivant le même schéma : en vertu des accords de perception fiscale, l'Agence du revenu du Canada perçoit et administre les impôts sur le revenu de toutes les provinces et de tous les territoires, à l'exception des impôts québécois sur le revenu des particuliers et des sociétés et de l'impôt albertain sur le revenu des sociétés, de sorte que les contribuables québécois produisent des déclarations fédérale et provinciale distinctes, là où les contribuables des autres provinces n'en produisent qu'une [cra-tax-collection-agreements].\n\nL'asymétrie budgétaire est formalisée dans le régime de transferts. La péréquation verse 27,2\_milliards de dollars en 2026-2027\_aux provinces dont la capacité fiscale est inférieure à la moyenne (paiement sans condition que certaines provinces reçoivent et d'autres non). Les territoires sont financés par un instrument distinct : la formule de financement des territoires, dotée de 5,8\_milliards de dollars, qui tient compte du coût plus élevé de la prestation des services dans le Nord [finance-major-transfers-2026]. Une conséquence structurelle de l'article 92\_joue en sens inverse : puisque la propriété, les droits civils et les entreprises d'une nature locale relèvent des provinces, les exigences réglementaires diffèrent d'une province à l'autre, et des obstacles internes à la circulation des biens, des services et de la main-d'œuvre subsistent au sein de la fédération, malgré les efforts répétés pour les réduire [imf-country-focus-internal-trade-2026]."
capacity_inheritedTerrain_en: "The terrain Canada's state works against is an unusually favourable endowment crossed by an unusually punishing geography. Almost everything the country has to work with (the mineral and freshwater endowment, the forest and farmland base, adjacency to the largest consumer market on earth, an inherited public administration and a high education base) is a matter of geology, latitude and historical accident rather than achievement. What that endowment does not remove is the cost of distance, cold and sparse population, which raises the price of every kilometre of infrastructure and every unit of service delivered, and which no policy choice can retire.\n\nScale is the first constraint. The country spans multiple time zones and three ocean basins, with port systems on each [territory.geography], but its circulation depends on a single east–west rail, transmission and telecommunications spine [territory.metabolism], so a disruption at one point on that corridor has no redundant alternative. The population is small relative to the territory, is now contracting, and is concentrated: three in four people live in one of the 41\_census metropolitan areas, and growth is moving outward from the largest of them rather than into them [society.demographics]. Fertility is at a record low and the median age is rising again now that the younger temporary residents who briefly held it down are leaving, so the labour force that has to build and staff everything is shrinking in relative terms and depends on immigration that policy has just cut [society.demographics]. Climate hazards are not evenly distributed but are locatable and quantified — permafrost degradation in the North, fire, and summer water constraint in the West and Prairies [territory.climate] — and they fall hardest on exactly the infrastructure that is hardest to reach.\n\nCanada inherited both its resources and the pattern of trade it sells them into. Reserves are substantial and the project pipeline is large [territory.minerals], the freshwater and forest base is among the world's deepest [territory.biosphere], and services now carry four in five jobs while the resource sector's weight in output and exports far exceeds its share of employment [economy.realEconomy]. But the shape of the trade is not chosen either: the economy was built as a resource-supply hinterland, and it still exports raw material and imports finished goods, with roughly three-quarters of merchandise exports going to a single neighbour [economy.externalVulnerability]. That configuration is the accumulated result of a century of investment decisions made when the continental market was the only market, and it constrains what any government can attempt on processing, diversification or price-setting.\n\nThe colonial legacy runs in a specific direction and must be stated plainly. The Canadian state was built by settlement on Indigenous lands, and the aggregate figures it reports — life expectancy above 82\_years, adult literacy and numeracy in the top tier of countries measured, a strong inherited health and education base [society.wellbeing] — coexist with a life-expectancy gap of nearly eight years between the Indigenous and non-Indigenous populations, widening rather than closing, and lower still on First Nations reserves [society.wellbeing]. That gap is not a difference in the capacity of the peoples concerned; it is the inherited cost of the dispossession on which the state's own capacity was built, and it sits inside the denominator against which every delivery claim in this section has to be read. Canada has never fought a war on its own soil in the modern era and faces no internal armed conflict, which spares it a category of constraint most states carry; again an inheritance rather than an accomplishment. Fiscal room, top-tier credit and debt held at home [economy.publicFinances] are likewise structural advantages, not evidence of superior administration: they set the ceiling on what the state could do, and say nothing about what it does."
capacity_inheritedTerrain_fr: "Le terrain sur lequel l'État canadien agit conjugue une dotation exceptionnellement favorable et une géographie exceptionnellement punitive. Presque tout ce dont le pays dispose (la dotation minérale et en eau douce, la base forestière et agricole, la contiguïté avec le plus grand marché de consommation de la planète, une administration publique héritée et un niveau de scolarité élevé) relève de la géologie, de la latitude et du hasard historique plutôt que de l'accomplissement. Cette dotation n'efface pas le coût de la distance, du froid et de la faible densité de population, qui renchérit chaque kilomètre d'infrastructure et chaque unité de service livrée, et qu'aucun choix de politique publique ne peut supprimer.\n\nL'étendue est la première contrainte. Le pays s'étend sur plusieurs fuseaux horaires et trois bassins océaniques, avec des réseaux portuaires sur chacun [territory.geography], mais sa circulation repose sur une seule épine dorsale est-ouest (ferroviaire, électrique et de télécommunications [territory.metabolism]), de sorte qu'une rupture en un point de ce corridor ne dispose d'aucune solution de remplacement redondante. La population est faible par rapport au territoire, elle se contracte désormais et elle est concentrée : trois personnes sur quatre vivent dans l'une des 41\_régions métropolitaines de recensement, et la croissance se déplace vers la périphérie des plus grandes plutôt que vers leur centre [society.demographics]. La fécondité atteint un creux historique et l'âge médian remonte, maintenant que s'en vont les résidents non permanents, plus jeunes, qui l'avaient brièvement tiré vers le bas, de sorte que la main-d'œuvre appelée à tout construire et à tout doter en personnel diminue en termes relatifs et dépend d'une immigration que la politique vient de réduire [society.demographics]. Les aléas climatiques ne sont pas répartis uniformément, mais ils sont localisables et chiffrés (dégradation du pergélisol dans le Nord, incendies, et contrainte hydrique estivale dans l'Ouest et les Prairies [territory.climate]) et ils frappent le plus durement précisément les infrastructures les plus difficiles d'accès.\n\nLe Canada a hérité à la fois de ses ressources et du schéma commercial dans lequel il les vend. Les réserves sont substantielles et le portefeuille de projets est important [territory.minerals], la base en eau douce et en forêts figure parmi les plus abondantes au monde [territory.biosphere], et les services portent maintenant quatre emplois sur cinq, alors que le poids du secteur des ressources dans la production et les exportations excède largement sa part de l'emploi [economy.realEconomy]. La configuration des échanges n'est pas choisie davantage : l'économie a été bâtie comme arrière-pays fournisseur de ressources, et elle exporte encore de la matière première tout en important des produits finis; environ les trois quarts des exportations de marchandises prenant la direction d'un seul voisin [economy.externalVulnerability]. Cette configuration est le résultat accumulé d'un siècle de décisions d'investissement prises à une époque où le marché continental était le seul marché; elle limite ce que tout gouvernement peut entreprendre en matière de transformation, de diversification ou de fixation des prix.\n\nL'héritage colonial va dans une direction précise et doit être énoncé sans détour. L'État canadien a été bâti par la colonisation de peuplement sur des terres autochtones, et les chiffres globaux qu'il déclare (une espérance de vie supérieure à 82\_ans, une littératie et une numératie adultes se situant dans le tiers supérieur des pays mesurés, une solide base héritée en santé et en éducation [society.wellbeing]) coexistent avec un écart d'espérance de vie de près de huit ans entre les populations autochtones et non autochtones; écart qui se creuse plutôt qu'il ne se resserre, et plus prononcé encore dans les réserves [society.wellbeing]. Cet écart ne traduit pas une différence de capacité entre les peuples concernés; il constitue le coût hérité de la dépossession sur laquelle s'est édifiée la capacité même de l'État, et il se situe dans le dénominateur au regard duquel doit se lire chacune des affirmations de la présente section sur la prestation des services. Le Canada n'a jamais mené de guerre sur son propre sol à l'époque moderne et ne connaît aucun conflit armé interne, ce qui lui épargne une catégorie de contraintes que portent la plupart des États; là encore un héritage plutôt qu'une réalisation. La marge budgétaire, une cote de crédit de premier rang et une dette détenue au pays [economy.publicFinances] constituent de même des avantages structurels, et non la preuve d'une administration supérieure : ils fixent le plafond de ce que l'État pourrait faire, sans rien dire de ce qu'il fait."
capacity_steering_en: "Canada's own audit office describes a consistent steering pattern, and it is not one of intent but of follow-through. Reporting to Parliament in May 2026, the Auditor General found that programmes are in place, funding is being delivered and risks are known, but that weaknesses in implementation and monitoring hold back results — adding that this is not a new pattern and repeats concerns she raised the previous year [oag-may-2026]. The specific instances span the domains this report documents. On staffing, the March 2026\_audit of Royal Canadian Mounted Police recruitment found the force had made recruitment a top priority yet set targets below its actual needs and then missed them: a shortfall of at least 3,400\_officers as of September 2025, vacancy rates above the force's own critical threshold in nine of the eleven provinces and territories it serves, and target processing times missed on 97% of applications, cancelling training classes [oag-spring-2026]. On administrative delivery, the audit of the federal pay-system replacement found that the central lesson of the Phoenix failure (simplify pay rules before installing a new system) had produced little progress a decade later, leaving a backlog of more than 233,000\_pay transactions affecting over 133,000\_employees and forcing roughly $4\_million a year in avoidable customization [oag-spring-2026]. On implementation of announced policy, the international student permit cap overshot its own target in the opposite direction — just under 150,000\_permits issued in 2024\_against a forecast of about 350,000, with Newfoundland and Labrador and Saskatchewan recording declines of at least 59% where increases of 10% had been projected — while the department investigated roughly 4,000\_of some 153,000\_flagged compliance cases and did not pursue 800\_identified fraud cases [oag-spring-2026]. On commitments to Indigenous peoples, Indigenous Services Canada was found not to have effectively implemented, monitored or assessed the initiatives it had committed to under the New Fiscal Relationship [oag-may-2026]. On public-health preparedness, the avian influenza audit found gaps in planning, data and decision-making that the experience of the pandemic had not closed [oag-may-2026]. There is evidence of learning in one place: the flexible posting plan introduced in 2023\_attracted thousands more police applicants but worsened chronic vacancies in some regions, and the force began phasing it out in July 2025 [oag-spring-2026].\n\nOn the government's flagship agenda the record is early and mostly unrealized. The approvals machinery exists: the Building Canada Act created a Major Projects Office in August 2025\_with a stated maximum approval timeline of two years and a \"one project, one review\" objective with willing provinces, and the first five projects were referred in September 2025 [pm-mpo-first-projects-2025]. But the designation mechanism the two-year clock depends on had still not been applied to any project ten months later. Listing requires an Order of the Governor in Council on the responsible minister's recommendation, after a notice is published in the Canada Gazette for thirty days, and only then are the federal approvals in Schedule 2\_granted automatically subject to a single conditions document [oce-building-canada-act]. As of late June 2026,\_the government was still initiating consultations toward listing decisions, targeted for the autumn of 2026 [mpo-listing-process-2026]. On fiscal delivery, the Spring Economic Update of April 2026\_enacted a subset of what Budget 2025\_proposed, with new measures costing $37.5\_billion over six years against a budget that had announced considerably more [seu-2026][budget-2025-canada-strong]. On defence, the Parliamentary Budget Officer records that no pathway projection to the declared spending commitment has been published, so the commitment stands without a costed route to it [pbo-nato-5-percent-2026].\n\nConsensus building with strategic actors runs in two directions at once. The Act requires consultation with Indigenous rights holders at three separate points — before the national-interest determination, before the conditions document is issued, and before any amendment to it — and the Indigenous Loan Guarantee Program was doubled from $5\_billion to $10\_billion to enable equity participation [oce-building-canada-act]. Federal memoranda of understanding with provinces have advanced individual projects, while First Nations political territorial organizations have opposed the Act on rights and procedural grounds [pco-bill-c5-implementation]."
capacity_steering_fr: "Le bureau de vérification du Canada lui-même décrit un mode de gouvernance constant, qui ne tient pas à l'intention, mais au suivi. Dans son rapport au Parlement de mai 2026, la vérificatrice générale a constaté que les programmes sont en place, que les fonds sont versés et que les risques sont connus, mais que des faiblesses dans la mise en œuvre et la surveillance freinent les résultats, ajoutant que ce schéma n'est pas nouveau et reprend des préoccupations qu'elle avait soulevées l'année précédente [oag-may-2026]. Les cas précis recoupent les domaines que documente le présent rapport. Du côté des effectifs, l'audit de mars 2026\_sur le recrutement à la Gendarmerie royale du Canada a révélé que le corps policier avait fait du recrutement une priorité de premier plan, tout en fixant des cibles inférieures à ses besoins réels, puis en les manquant : un déficit d'au moins 3 400\_agents en septembre 2025, des taux de vacance supérieurs au seuil critique établi par la Gendarmerie elle-même dans neuf des onze provinces et territoires qu'elle desservait, et des délais de traitement cibles non respectés pour 97 % des candidatures; ce qui a entraîné l'annulation de cohortes de formation [oag-spring-2026]. Du côté de la prestation administrative, l'audit du remplacement du système de paye fédéral a révélé que la leçon centrale de l'échec de Phénix (simplifier les règles de rémunération avant d'installer un nouveau système) avait produit peu de progrès une décennie plus tard, laissant un arriéré de plus de 233 000\_opérations de paye touchant plus de 133 000\_employés et imposant quelque 4\_millions de dollars par année en adaptations logicielles évitables [oag-spring-2026]. Du côté de la mise en œuvre des politiques annoncées, le plafond imposé aux permis d'études internationaux a dépassé sa propre cible en sens inverse : un peu moins de 150 000\_permis délivrés en 2024\_contre une prévision d'environ 350 000 (Terre-Neuve-et-Labrador et la Saskatchewan enregistrant des baisses d'au moins 59 % là où des hausses de 10 % avaient été projetées), tandis que le ministère a enquêté sur environ 4 000\_des quelque 153 000\_cas de non-conformité signalés et n'a pas donné suite à 800\_cas de fraude relevés [oag-spring-2026]. Du côté des engagements envers les peuples autochtones, il a été constaté que Services aux Autochtones Canada n'avait pas mis en œuvre, surveillé ni évalué efficacement les initiatives auxquelles il s'était engagé dans le cadre de la nouvelle relation financière [oag-may-2026]. Du côté de la préparation en santé publique, l'audit sur la grippe aviaire a relevé des lacunes en matière de planification, de données et de prise de décisions que l'expérience de la pandémie n'avait pas comblées [oag-may-2026]. Un apprentissage est néanmoins attesté sur un point : le plan d'affectation souple instauré en 2023\_a attiré des milliers de candidats policiers supplémentaires, mais il a aggravé les vacances chroniques dans certaines régions, et la Gendarmerie a commencé à l'abandonner progressivement en juillet 2025 [oag-spring-2026].\n\nSur le programme phare du gouvernement, le bilan est précoce et pour l'essentiel inabouti. Le dispositif d'autorisation existe : la Loi visant à bâtir le Canada a créé un Bureau des grands projets en août 2025, assorti d'un délai d'approbation maximal déclaré de deux ans et d'un objectif de « un projet, un examen » avec les provinces qui y consentent; les cinq premiers projets y ont été renvoyés en septembre 2025 [pm-mpo-first-projects-2025]. Or le mécanisme de désignation dont dépend ce délai de deux ans n'avait toujours été appliqué à aucun projet dix mois plus tard. L'inscription exige un décret du gouverneur en conseil sur recommandation du ministre responsable, après publication d'un avis dans la Gazette du Canada pendant trente jours; ce n'est qu'ensuite que les autorisations fédérales énumérées à l'annexe 2\_sont accordées automatiquement, sous réserve d'un document de conditions unique [oce-building-canada-act]. À la fin de juin 2026, le gouvernement en était encore à amorcer des consultations en vue des décisions d'inscription, prévues pour l'automne 2026 [mpo-listing-process-2026]. Du côté de l'exécution budgétaire, la mise à jour économique du printemps d'avril 2026\_a mis en vigueur un sous-ensemble de ce que proposait le Budget 2025, avec de nouvelles mesures coûtant 37,5\_milliards de dollars sur six ans, alors que le budget en avait annoncé considérablement davantage [seu-2026][budget-2025-canada-strong]. Du côté de la défense, la directrice parlementaire du budget signale qu'aucune projection de trajectoire vers l'engagement de dépenses déclaré n'a été publiée, de sorte que cet engagement subsiste sans voie chiffrée pour y parvenir [pbo-nato-5-percent-2026].\n\nLa recherche de consensus auprès des acteurs stratégiques va dans deux directions à la fois. La Loi impose la consultation des titulaires de droits autochtones à trois moments distincts (avant la détermination de l'intérêt national, avant la délivrance du document de conditions et avant toute modification de celui-ci) et le Programme de garantie de prêts pour les Autochtones a été porté de 5\_à 10\_milliards de dollars afin de permettre la participation au capital [oce-building-canada-act]. Des protocoles d'entente fédéraux conclus avec des provinces ont fait avancer des projets pris isolément, tandis que des organisations politiques territoriales des Premières Nations se sont opposées à la Loi, invoquant des motifs liés aux droits et à la procédure [pco-bill-c5-implementation]."
capacity_approvals_en: "Canada's federal permitting and impact-assessment regime has been the acknowledged binding constraint on major project delivery, and the government's own assessment identifies the impact-assessment phase — not the regulatory-permitting phase — as the key gating step [dwpv-bill-c5-analysis]. The Building Canada Act, enacted as Part 2\_of the One Canadian Economy Act and given royal assent on 26\_June 2025, is designed to consolidate approvals for designated national-interest projects into a single ministerial conditions document and to cut federal decision timelines from a baseline of roughly five years to a target of two [pco-bill-c5-implementation][dwpv-bill-c5-analysis]. A Major Projects Office, launched on 29\_August 2025\_with an Indigenous Advisory Council, coordinates the process on a \"one project, one review\" basis with willing provinces [pm-mpo-first-projects-2025].\n\nThe mechanism is precise, and it is the reason the record matters. Designation is not automatic on referral: the government must first consult provinces, territories and Indigenous rights holders on whether a project is in the national interest, publish a notice in the Canada Gazette for thirty days, and then list the project by Order of the Governor in Council on the responsible minister's recommendation. Only then are the federal approvals in Schedule 2\_of the Act granted automatically, subject to a single binding conditions document that is deemed to constitute a permit under every applicable statute and is enforceable as though issued under each. The government states explicitly that not all projects referred to the Major Projects Office will be designated [oce-building-canada-act].\n\nOn the record to date, projects are being handed to the office for assessment but none has been designated. Referral is the first step and carries no legal effect; designation is the step that grants the approvals. Fifteen projects had been referred as of 21\_May 2026, spanning mining (Crawford, McIlvenna Bay, Sisson, Matawinie, Red Chris), energy (LNG Canada Phase 2, Ksi Lisims, Darlington New Nuclear), electricity (North Coast Transmission Line, Taltson, Iqaluit Nukkiksautiit) and transport (Arctic Economic and Security Corridor, Grays Bay Road and Port, Mackenzie Valley Highway, Contrecoeur Container Terminal) [mpo-referred-projects]. Four of the fifteen have Indigenous or territorial-government proponents or co-proponents, which complicates any simple account of Indigenous opposition to the regime [mpo-referred-projects]. But no project has been designated under the Act. The listing process was only initiated on 24\_June 2026, for Grays Bay, the Mackenzie Valley Highway and a deep geologic repository for used nuclear fuel, with consultations beginning over the following weeks and listing decisions targeted for autumn 2026 [mpo-listing-process-2026]. The two-year clock has therefore not started running on any project, and the target remains untested more than a year after royal assent. A parallel stream handles what the office calls transformative strategies rather than individual projects; under one of these, Pathways Plus, the proposed West Coast Oil Pipeline was handed to the office on 2\_July 2026, following a memorandum of understanding among Canada, Alberta and the Oil Sands Alliance in which the federal government committed in advance to declaring the pipeline a project of national interest [mpo-pathways-plus].\n\nTwo constraints on predictability sit outside the federal timeline. The Act carries a five-year sunset on new designations and requires the responsible minister to consult Indigenous peoples whose section 35\_rights may be adversely affected at three separate points — before the national-interest determination, before the conditions document is issued, and before any amendment to it [oce-building-canada-act]. It has drawn sustained opposition from First Nations political territorial organizations on rights and procedural grounds [chiefs-of-ontario-c5-response], and in Parliament it passed at third reading on 20\_June 2025\_with Liberal and Conservative support over the recorded opposition of the New Democratic Party and the Bloc Québécois [openparliament-c5-45-1]. Whether the delivery bottleneck moves from federal impact assessment to provincial regulatory processes or to the consultation duty — which the Alberta courts have twice enforced against a provincial initiative — will be observable only once the first designations are made."
capacity_approvals_fr: "Le régime fédéral de délivrance de permis et d'évaluation d'impact a été reconnu comme la contrainte déterminante pesant sur la réalisation des grands projets, et l'évaluation du gouvernement lui-même désigne la phase d'évaluation d'impact (et non celle de la délivrance des permis réglementaires) comme l'étape charnière qui commande la suite [dwpv-bill-c5-analysis]. La Loi visant à bâtir le Canada, édictée comme partie 2\_de la Loi sur l’unité de l’économie canadienne et sanctionnée le 26\_juin 2025, vise à regrouper les autorisations relatives aux projets désignés d'intérêt national dans un document de conditions ministériel unique et à ramener les délais décisionnels fédéraux d'un niveau de référence d'environ cinq ans à une cible de deux ans [pco-bill-c5-implementation][dwpv-bill-c5-analysis]. Un Bureau des grands projets, mis sur pied le 29\_août 2025\_et doté d'un Conseil consultatif autochtone, coordonne le processus selon le principe « un projet, un examen » avec les provinces qui y consentent [pm-mpo-first-projects-2025].\n\nLe mécanisme est précis, et c'est ce qui donne au bilan son importance. La désignation ne découle pas automatiquement du renvoi : le gouvernement doit d'abord consulter les provinces, les territoires et les titulaires de droits autochtones sur la question de savoir si un projet est d'intérêt national, publier un avis dans la Gazette du Canada pendant trente jours, puis inscrire le projet par décret du gouverneur en conseil sur recommandation du ministre responsable. Ce n'est qu'ensuite que les autorisations fédérales énumérées à l'annexe 2\_de la Loi sont accordées automatiquement, sous réserve d'un document de conditions contraignant unique, réputé constituer un permis au sens de chacune des lois applicables et exécutoire comme s'il avait été délivré sous le régime de chacune d'elles. Le gouvernement précise explicitement que les projets renvoyés au Bureau des grands projets ne seront pas tous désignés [oce-building-canada-act].\n\nAu vu du bilan jusqu'ici, des projets sont confiés au Bureau pour évaluation, mais aucun n'a été désigné. Le renvoi constitue la première étape et n'a aucun effet juridique; c'est la désignation qui accorde les autorisations. Quinze projets avaient été renvoyés au 21\_mai 2026, touchant les mines (Crawford, McIlvenna Bay, Sisson, Matawinie, Red Chris), l'énergie (LNG Canada phase 2, Ksi Lisims, nouvelle centrale nucléaire de Darlington), l'électricité (ligne de transport de la Côte-Nord, Taltson, Iqaluit Nukkiksautiit) et le transport (corridor économique et de sécurité de l'Arctique, route et port de Grays Bay, route de la vallée du Mackenzie, terminal à conteneurs de Contrecœur) [mpo-referred-projects]. Quatre des quinze ont pour promoteurs ou copromoteurs des entités autochtones ou des gouvernements territoriaux; ce qui complique toute lecture simple de l'opposition autochtone au régime [mpo-referred-projects]. Cependant, aucun projet n'a été désigné en vertu de la Loi. Le processus d'inscription n'a été amorcé que le 24\_juin 2026, pour Grays Bay, la route de la vallée du Mackenzie et un dépôt géologique en profondeur pour le combustible nucléaire irradié; les consultations devant débuter au cours des semaines suivantes et les décisions d'inscription étant prévues pour l'automne 2026 [mpo-listing-process-2026]. Le délai de deux ans n'a donc commencé à courir pour aucun projet, et la cible demeure inéprouvée plus d'un an après la sanction royale. Un volet parallèle traite de ce que le Bureau appelle des stratégies transformatrices plutôt que des projets pris isolément; dans le cadre de l'une d'elles, Pathways Plus, l'oléoduc proposé vers la côte Ouest a été confié au Bureau le 2\_juillet 2026, à la suite d'un protocole d'entente entre le Canada, l'Alberta et l'Oil Sands Alliance dans lequel le gouvernement fédéral s'engageait par avance à déclarer l'oléoduc projet d'intérêt national [mpo-pathways-plus].\n\nDeux contraintes pesant sur la prévisibilité se situent en dehors du calendrier fédéral. La Loi comporte une clause de caducité de cinq ans applicable aux nouvelles désignations et oblige le ministre responsable à consulter les peuples autochtones dont les droits reconnus à l'article 35\_pourraient subir un effet préjudiciable, et ce à trois moments distincts (avant la détermination de l'intérêt national, avant la délivrance du document de conditions et avant toute modification de celui-ci [oce-building-canada-act]). Elle a suscité une opposition soutenue de la part d'organisations politiques territoriales des Premières Nations, invoquant des motifs liés aux droits et à la procédure [chiefs-of-ontario-c5-response]; au Parlement, elle a été adoptée en troisième lecture le 20\_juin 2025\_avec l'appui des libéraux et des conservateurs, contre l'opposition consignée du Nouveau Parti démocratique et du Bloc québécois [openparliament-c5-45-1]. Reste à voir si le goulot d'étranglement de la réalisation se déplacera de l'évaluation d'impact fédérale vers les processus réglementaires provinciaux ou vers l'obligation de consulter (que les tribunaux albertains ont fait respecter à deux reprises contre une initiative provinciale); ce qui ne sera observable qu'une fois les premières désignations prononcées."
capacity_delivery_en: "Delivery capacity is the state's realized record of executing infrastructure at scale, distinct from its stated intent; on that measure Canada's problem is not intent or money announced but a maintenance gap that is widening. Owners of core public infrastructure estimated at the end of 2022\_that $294.4\_billion was required to rehabilitate or replace existing assets to bring or keep them in good condition; $31.3\_billion was actually invested in renewal that year, or 11% of the identified requirement, but the share of assets rated in good or very good condition fell from 59% in 2020\_to 55% in 2022 [statcan-ccpi-renewal-2022]. Transportation accounts for the largest single share of the requirement at $160.8\_billion, and the burden is heavier in rural municipalities, where it is 61% of the required renewal budget against 48% in urban ones [statcan-ccpi-renewal-2022]. The scale of what has to be maintained is $2.6\_trillion in transportation and water assets alone, and 72% of it belongs to local and regional governments rather than to the federal or provincial state : municipalities own 64% of the replacement value of roads, 76% of public transit and 82% of active transportation [statcan-ccpi-replacement-2022]. Most of the deficit therefore sits with the level of government least able to finance it, and climate adaptation adds a further unfunded layer on the same assets [cci-infrastructure-2026].\n\nOn cost and schedule performance the federal record on its own megaproject is poor and fully documented. The Trans Mountain Expansion was priced at $5.4\_billion in 2013\_and at $7.4\_billion when the federal government bought it in 2018; the estimate reached $12.6\_billion in 2020, $21.4\_billion in 2022, $30.9\_billion in 2023\_and $34.2\_billion on completion, and commercial operation began on 1\_May 2024, years after the schedules successively announced [pbo-trans-mountain-2024]. The Parliamentary Budget Officer records a $12.8\_billion increase between its own June 2022\_report and 2024\_alone [pbo-trans-mountain-2024]. The state proved able to finish the project; it did not prove able to forecast or contain what finishing it would cost.\n\nWhere delivery is visibly happening, it is concentrated and uneven. Total capital spending on infrastructure assets rose 3.8% to $141.0\_billion in 2024, with public transit the fastest-growing function at 36.3% growth to $17.1\_billion, led by Ontario and British Columbia [statcan-capex-2026]. The same release shows the mechanical effect of completion rather than expansion: the finishing of major air, rail, water and pipeline projects produced a $9.0\_billion drop in capital outlays and pulled down infrastructure investment in Alberta and British Columbia in 2024, offsetting a 12.6% increase across all other functions [statcan-capex-2026]. Utilities capital spending is expected to rise $4.5\_billion, or 9.7%, in 2026\_as grid reliability and forecast demand growth are addressed [statcan-capex-2026]. The pattern is a state that can execute individual large projects, at costs it does not control, while the accumulated renewal requirement across the stock it already owns goes largely unmet."
capacity_delivery_fr: "La capacité de réalisation correspond au bilan effectif de l'État en matière d'exécution d'infrastructures à grande échelle, distinct de ses intentions déclarées; à cet égard, le problème du Canada ne tient pas à l'intention ni aux sommes annoncées, mais à un déficit d'entretien qui se creuse. Les propriétaires d'infrastructures publiques essentielles estimaient à la fin de 2022\_qu'il fallait 294,4\_milliards de dollars pour remettre en état ou remplacer les actifs existants afin de les amener ou de les maintenir en bon état; 31,3\_milliards de dollars ont effectivement été investis dans le renouvellement cette année-là, soit 11 % du besoin recensé, mais la proportion d'actifs jugés en bon ou en très bon état est passée de 59 % en 2020\_à 55 % en 2022 [statcan-ccpi-renewal-2022]. Le transport représente à lui seul la plus grande part du besoin, à 160,8\_milliards de dollars, et le fardeau est plus lourd dans les municipalités rurales, où il correspond à 61 % du budget de renouvellement requis, contre 48 % dans les municipalités urbaines [statcan-ccpi-renewal-2022]. L'ampleur de ce qui doit être entretenu atteint 2 600\_milliards de dollars pour les seuls actifs de transport et d'aqueduc, et 72 % de cette valeur appartient aux administrations locales et régionales plutôt qu'à l'État fédéral ou provincial; les municipalités détiennent 64 % de la valeur de remplacement des routes, 76 % de celle du transport en commun et 82 % de celle du transport actif [statcan-ccpi-replacement-2022]. L'essentiel du déficit incombe donc à l'ordre de gouvernement le moins en mesure de le financer, et l'adaptation aux changements climatiques ajoute une charge supplémentaire non financée sur ces mêmes actifs [cci-infrastructure-2026].\n\nEn matière de respect des coûts et des échéanciers, le bilan fédéral à l'égard de son propre mégaprojet est médiocre et entièrement documenté. Le projet d'agrandissement du réseau de Trans Mountain était chiffré à 5,4\_milliards de dollars en 2013, et à 7,4\_milliards lorsque le gouvernement fédéral en a fait l'acquisition en 2018; l'estimation a atteint 12,6\_milliards en 2020, 21,4\_milliards en 2022, 30,9\_milliards en 2023\_et 34,2\_milliards à l'achèvement; l'exploitation commerciale a débuté le 1er mai 2024, des années après les échéanciers successivement annoncés [pbo-trans-mountain-2024]. La directrice parlementaire du budget relève une hausse de 12,8\_milliards de dollars entre son propre rapport de juin 2022\_et 2024\_seulement [pbo-trans-mountain-2024]. L'État s'est révélé capable de mener le projet à terme; il ne s'est pas révélé capable de prévoir ni de contenir ce que cet achèvement coûterait.\n\nLà où la réalisation est visible, elle est concentrée et inégale. Les dépenses en immobilisations totales consacrées aux actifs d'infrastructure ont progressé de 3,8 % pour atteindre 141,0\_milliards de dollars en 2024; le transport en commun affichant la croissance la plus rapide, à 36,3 %, pour s'établir à 17,1\_milliards de dollars, sous l'impulsion de l'Ontario et de la Colombie-Britannique [statcan-capex-2026]. La même publication met en évidence l'effet mécanique de l'achèvement plutôt que de l'expansion : la fin de grands projets aériens, ferroviaires, hydrauliques et pipeliniers a entraîné une baisse de 9,0\_milliards de dollars des dépenses en immobilisations et fait reculer l'investissement en infrastructures en Alberta et en Colombie-Britannique en 2024, annulant une hausse de 12,6 % dans toutes les autres fonctions [statcan-capex-2026]. Les dépenses en immobilisations du secteur des services publics devraient augmenter de 4,5\_milliards de dollars, soit 9,7 %, en 2026, à mesure que sont abordées la fiabilité du réseau et la croissance prévue de la demande [statcan-capex-2026]. Le schéma est celui d'un État capable d'exécuter de grands projets pris isolément, à des coûts qu'il ne maîtrise pas, tandis que le besoin de renouvellement accumulé sur le parc qu'il possède déjà demeure largement non satisfait."
capacity_publicServices_en: "Health care is delivered by the provinces and the binding constraint is primary-care coverage. Some 5.7\_million adults had no regular primary care provider in 2024, and the Canadian Institute for Health Information estimates that meeting current demand would require 49% more family physicians [cihi-health-workforce-2024]. Physician supply is not collapsing but it is losing ground: 99,555\_physicians in 2024, or 241\_per 100,000\_population, down from 243\_the year before, with specialist numbers growing faster (2.5%) than family medicine (1.9%) [cihi-physicians-2024]. Family physician supply per capita has fallen over five years, from 11.8\_to 11.5\_per 10,000\_population [cihi-health-workforce-2024]. Headcount is only part of it: family physicians saw an average of 1,353\_patients a year in 2021\_against 1,746\_in 2013, close to 30% now practise primarily outside primary care, and some family medicine training places go unfilled each year [cihi-primary-care-access][cihi-health-workforce-2024]. On international comparison Canada ranks last among ten high-income countries on having a regular provider, and lowest on same- or next-day appointments, at 26% [cihi-primary-care-access].\n\nWaiting times show a system doing more work and still moving more slowly. In 2024\_Canadian hospitals performed 26% more hip replacements, 21% more knee replacements, 11% more cataract surgeries, 7% more cancer surgeries and 16% more magnetic resonance and computed tomography scans than in 2019, yet only 68% of hip replacements and 61% of knee replacements were completed within the 26-week benchmark, against 75% and 70% respectively in 2019 [cihi-wait-times-priority-2025]. Radiation therapy within 28\_days and hip fracture repair within 48\_hours each fell three percentage points over the same period, to 94% and 83% [cihi-wait-times-priority-2025]. By 2026\_joint replacements were approaching pre-pandemic levels and cataract and urgent treatments had largely returned to them, but most cancer surgeries remained slower than before the pandemic and diagnostic imaging delays persisted [cihi-wait-times-2026]. The institute's own diagnosis locates the constraint in flow rather than in any single setting: between 2018-19\_and 2024-25, emergency department waits grew longer and arriving patients arrived in more serious condition; limited inpatient bed availability keeps admitted patients in emergency departments and consumes the capacity to treat new arrivals, and shortages of long-term care beds and community supports delay discharge from acute care, backing the whole chain up [cihi-wait-times-2026].\n\nEducation is also provincial, better resourced in aggregate, and carries two specific fragilities. Elementary and secondary education spending reached $95.9\_billion in 2022-23, of which provincial and territorial governments provided $72.5\_billion, or 73.3%; 5.8\_million students were enrolled, 91.3% of them in public schools, with public enrolment at its highest level since 2002-2003\_on the largest population aged 4\_to 17\_since 1977 [statcan-elem-sec-2022-23]. Aggregate spending growth has not translated into much per-student gain: on one independent compilation of the same data, inflation-adjusted operational spending per student rose 2.9% in total across the nine years to 2022-23 [fraser-education-spending-2025]. The private-school share has risen for two consecutive years, to 7.7% [statcan-elem-sec-2022-23]. The first fragility is minority-language provision: French immersion enrolment fell to 11.7% of the total from a 12.3% peak, ending a twenty-one year upward trend, and many provinces and territories report educator shortages for minority-language programmes [statcan-elem-sec-2022-23]. The second is the funding structure of post-secondary education, which has come to depend on differential fees: international undergraduates are expected to pay more than five times what Canadian students pay in 2025-26, against 3.6\_times a decade earlier, and international graduate students more than three times, against 2.2 [statcan-tuition-2025-26]. That revenue base is precisely what the international student permit cap has cut."
capacity_publicServices_fr: "Les soins de santé relèvent des provinces; la contrainte déterminante est l'accès aux soins primaires. Quelque 5,7\_millions d'adultes n'avaient aucun fournisseur régulier de soins primaires en 2024, et l'Institut canadien d'information sur la santé estime qu'il faudrait 49 % de médecins de famille en plus pour répondre à la demande actuelle [cihi-health-workforce-2024]. L'offre médicale ne s'effondre pas, mais elle perd du terrain : 99 555\_médecins en 2024, soit 241\_pour 100 000\_habitants, en baisse par rapport à 243\_l'année précédente; le nombre de spécialistes progressant plus vite (2,5 %) que celui des médecins de famille (1,9 %) [cihi-physicians-2024]. L'offre de médecins de famille par habitant a reculé sur cinq ans, de 11,8\_à 11,5\_pour 10 000\_habitants [cihi-health-workforce-2024]. Le nombre de praticiens n'explique qu'une partie du phénomène : les médecins de famille voyaient en moyenne 1 353\_patients par année en 2021, contre 1 746\_en 2013, près de 30 % exercent aujourd'hui principalement en dehors des soins primaires, et certaines places de formation en médecine familiale demeurent vacantes chaque année [cihi-primary-care-access][cihi-health-workforce-2024]. À l'échelle internationale, le Canada se classe au dernier rang de dix pays à revenu élevé pour ce qui est de disposer d'un fournisseur régulier, et au plus bas rang pour l'obtention d'un rendez-vous le jour même ou le lendemain, à 26 % [cihi-primary-care-access].\n\nLes temps d'attente révèlent un système qui accomplit plus de travail tout en avançant plus lentement. En 2024, les hôpitaux canadiens ont pratiqué 26 % plus d'arthroplasties de la hanche, 21 % plus d'arthroplasties du genou, 11 % plus de chirurgies de la cataracte, 7 % plus de chirurgies oncologiques et 16 % plus d'examens d'imagerie par résonance magnétique et de tomodensitométrie qu'en 2019; pourtant, seulement 68 % des arthroplasties de la hanche et 61 % de celles du genou ont été réalisées dans le délai repère de 26\_semaines, contre respectivement 75 % et 70 % en 2019 [cihi-wait-times-priority-2025]. La radiothérapie dans les 28\_jours et la réparation d'une fracture de la hanche dans les 48\_heures ont chacune reculé de trois points de pourcentage sur la même période, pour s'établir à 94 % et à 83 % [cihi-wait-times-priority-2025]. En 2026, les arthroplasties s'approchaient des niveaux d'avant la pandémie, et les interventions pour cataracte ainsi que les traitements urgents avaient largement renoué avec les niveaux antérieurs, mais la plupart des chirurgies oncologiques demeuraient plus lentes qu'avant la pandémie et les retards en imagerie diagnostique persistaient [cihi-wait-times-2026]. Le diagnostic posé par l'Institut lui-même situe la contrainte dans la circulation des patients plutôt que dans un milieu de soins en particulier : entre 2018-2019\_et 2024-2025, les attentes aux urgences et la gravité des cas ont augmenté de concert, le nombre limité de lits d'hospitalisation retient aux urgences des patients déjà admis et consomme la capacité de traiter les nouvelles arrivées, alors que la pénurie de places en soins de longue durée et de soutiens communautaires retarde les congés des soins aigus; ce qui engorge toute la chaîne [cihi-wait-times-2026].\n\nL'éducation relève également des provinces, dispose globalement de meilleures ressources et porte deux fragilités précises. Les dépenses au titre de l'enseignement primaire et secondaire ont atteint 95,9\_milliards de dollars en 2022-2023, dont 72,5\_milliards, soit 73,3 %, provenaient des gouvernements provinciaux et territoriaux.; 5,8\_millions d'élèves étaient inscrits, dont 91,3 % dans des écoles publiques; l'effectif du réseau public atteignant son plus haut niveau depuis 2002-2003, portant sur la population de 4\_à 17\_ans la plus nombreuse depuis 1977 [statcan-elem-sec-2022-23]. La croissance des dépenses globales ne s'est guère traduite en gains par élève : selon une compilation indépendante des mêmes données, les dépenses de fonctionnement par élève, corrigées de l'inflation, ont augmenté de 2,9 % au total sur les neuf années précédant 2022-2023 [fraser-education-spending-2025]. La part des écoles privées progresse pour une deuxième année consécutive, à 7,7 % [statcan-elem-sec-2022-23]. La première fragilité concerne l'offre en langue en situation minoritaire : les inscriptions en immersion française ont reculé à 11,7 % du total, après un sommet de 12,3 % (ce qui met fin à une tendance haussière de vingt et un ans) et de nombreuses provinces et territoires signalent une pénurie d'enseignants pour les programmes en langue en situation minoritaire [statcan-elem-sec-2022-23]. La seconde tient à la structure de financement de l'enseignement postsecondaire, qui en est venue à dépendre de droits de scolarité différenciés : les étudiants internationaux de premier cycle devraient payer plus de cinq fois ce que paient les étudiants canadiens en 2025-2026, contre 3,6\_fois une décennie plus tôt, et les étudiants internationaux des cycles supérieurs plus de trois fois, contre 2,2 [statcan-tuition-2025-26]. Or cette assiette de revenus est précisément celle qu'a amputée le plafond imposé aux permis d'études internationaux."
capacity_productivity_en: "Productivity has been Canada's central medium-term economic challenge for a decade, and it is the mechanism that converts into living standards: since the early 1980s, labour productivity growth has accounted for over 90% of the increase in real gross domestic product per person [statcan-productivity-us-2026]. Since 2000, Canadian labour productivity has grown 0.8% a year against 1.9% in the United States — less than half the pace — and the slowdown since 2015\_is attributable largely to weak capital investment, pervasive across industries, with investment per worker falling nearly 20% between 2014\_and 2022 [statcan-productivity-us-2026]. Statistics Canada's May 2026\_review adds a specific exposure: the industries dependent on United States export demand concentrate the country's most productive jobs, so the tariff shock falls hardest on the most productive part of the economy [statcan-productivity-us-2026]. The International Monetary Fund identifies the same weakness as structural — weak business dynamism, slow capital deepening, lagging innovation, high concentration in key service sectors and barriers to firm scaling — and calls the reform bundle addressing it Canada's highest-return set of policies [imf-can-2025-art4].\n\nInnovation and research capacity is the clearest single gap. Canada's gross domestic expenditure on research and development was about 1.8% of gross domestic product in 2023, against an average of 2.7% across countries in the Organisation for Economic Co-operation and Development, 3.3% in the United States and 4.9% in South Korea; Canadian research intensity has been flat since 2010\_while it rose in most member countries, and the business share of that spending is particularly low [oecd-canada-survey-2025]. The capacity that does exist is substantially foreign-owned: foreign multinationals accounted for over 40% of business research and development spending in 2022\_and 30% of corporate intellectual property expenditure in 2023 [oecd-canada-survey-2025].\n\nInterprovincial barriers are the quantified drag. The International Monetary Fund puts non-geographic, policy-related internal trade barriers at the equivalent of about a 9% national tariff, rising to as much as 50% in health care, education and retail services, and estimates that eliminating them could raise real output by up to 7% over time — roughly $210\_billion in 2025\_dollars — with about 90% of that gain coming from services rather than goods [imf-country-focus-internal-trade-2026][imf-can-2025-art4]. The federal response is Part 1\_of the One Canadian Economy Act, the Free Trade and Labour Mobility in Canada Act, given royal assent on 26\_June 2025, alongside the elimination of all federal exceptions under the Canadian Free Trade Agreement. Implementation is partial and running behind its own timetable. The Canadian Mutual Recognition Agreement covers the sale of goods and a new financial services chapter has entered into force, but ministers only committed in March 2026\_to extend mutual recognition to services by the end of that year, labour mobility provisions were still under negotiation, and credential recognition for tradespersons through digital verification is targeted for spring 2027 [cit-communique-2026]. One deadline has already been missed: the framework for direct-to-consumer alcohol sales was due in May 2026\_and was not delivered, with the responsible federal minister noting publicly that much of the outstanding work lies in provincial and territorial jurisdiction [canada-leblanc-cit-2026]. At their meeting of 23\_July 2026 — their fourteenth since March 2025 — First Ministers agreed to work toward an agreement in principle by the end of 2026\_on model mutual recognition legislation, which is a commitment to negotiate rather than a completed instrument [pm-first-ministers-jul2026].\n\nValue-added processing is the structural sub-question inside productivity. Canada is among the top five global producers of 10\_of its 34\_critical minerals but has not built the corresponding domestic processing and refining capacity at scale — a gap the current critical minerals strategy explicitly targets [nrcan-cm-strategy-annual-2024]."
capacity_productivity_fr: "La productivité constitue le principal défi économique à moyen terme du Canada depuis une décennie, et c'est le mécanisme par lequel se traduit le niveau de vie : depuis le début des années 1980, la croissance de la productivité du travail représente plus de 90 % de la hausse du produit intérieur brut réel par habitant [statcan-productivity-us-2026]. Depuis 2000, la productivité du travail au Canada a progressé de 0,8 % par année, contre 1,9 % aux États-Unis (moins de la moitié de ce rythme), et le ralentissement observé depuis 2015\_s'explique en grande partie par la faiblesse de l'investissement en capital, généralisée dans l'ensemble des industries; l'investissement par travailleur ayant chuté de près de 20 % entre 2014\_et 2022 [statcan-productivity-us-2026]. L'examen de mai 2026\_de Statistique Canada ajoute une exposition particulière : les industries qui dépendent de la demande d'exportation états-unienne concentrent les emplois les plus productifs du pays, de sorte que le choc des droits de douane frappe le plus durement la partie la plus productive de l'économie [statcan-productivity-us-2026]. Le Fonds monétaire international qualifie cette même faiblesse de structurelle (dynamisme entrepreneurial anémique, intensification du capital lente, innovation à la traîne, forte concentration dans des secteurs de services clés et obstacles à la croissance des entreprises) et présente l'ensemble de réformes qui s'y attaque comme le train de politiques au plus fort rendement dont le Canada dispose [imf-can-2025-art4].\n\nLa capacité d'innovation et de recherche constitue l'écart le plus net. Les dépenses intérieures brutes de recherche et développement du Canada s'établissaient à environ 1,8 % du produit intérieur brut en 2023, contre une moyenne de 2,7 % dans les pays de l'Organisation de coopération et de développement économiques, 3,3 % aux États-Unis et 4,9 % en Corée du Sud; l'intensité de la recherche au Canada stagne depuis 2010, alors qu'elle a augmenté dans la plupart des pays membres, et la part des entreprises dans ces dépenses est particulièrement faible [oecd-canada-survey-2025]. La capacité qui existe bel et bien est en grande partie sous propriété étrangère : les multinationales étrangères comptaient pour plus de 40 % des dépenses de recherche et développement des entreprises en 2022\_et pour 30 % des dépenses des sociétés en propriété intellectuelle en 2023 [oecd-canada-survey-2025].\n\nLes obstacles interprovinciaux constituent le frein chiffré. Le Fonds monétaire international évalue les obstacles internes au commerce, non géographiques et liés aux politiques publiques, à l'équivalent de droits de douane nationaux d'environ 9 %, atteignant jusqu'à 50 % dans les soins de santé, l'éducation et les services de détail, et estime que leur élimination pourrait accroître le PIB de 7 % au fil du temps (soit environ 210\_milliards de dollars de 2025), dont environ 90 % proviendraient des services plutôt que des biens [imf-country-focus-internal-trade-2026][imf-can-2025-art4]. La réponse fédérale est la partie 1\_de la Loi sur l'unité de l'économie canadienne, soit la Loi sur le libre-échange et la mobilité de la main-d'œuvre au Canada, sanctionnée le 26\_juin 2025, assortie de l'élimination de toutes les exceptions fédérales prévues à l'Accord de libre-échange canadien. La mise en œuvre est partielle et accuse un retard sur son propre calendrier. L'Accord canadien de reconnaissance mutuelle couvre la vente de biens et un nouveau chapitre sur les services financiers est entré en vigueur, mais les ministres ne se sont engagés qu'en mars 2026\_à étendre la reconnaissance mutuelle aux services avant la fin de la même année; les dispositions sur la mobilité de la main-d'œuvre étaient toujours en négociation, et la reconnaissance des titres de compétence des gens de métier par vérification numérique est visée pour le printemps 2027 [cit-communique-2026]. Une échéance a déjà été manquée : le cadre régissant la vente directe d'alcool aux consommateurs était attendu en mai 2026\_et n'a pas été livré; le ministre fédéral responsable soulignant publiquement qu'une grande partie du travail restant relève de la compétence des provinces et des territoires [canada-leblanc-cit-2026]. À leur réunion du 23\_juillet 2026 (leur quatorzième depuis mars 2025), les premiers ministres ont convenu de travailler à une entente de principe avant la fin de 2026\_sur une loi type de reconnaissance mutuelle; ce qui constitue un engagement à négocier plutôt qu'un instrument achevé [pm-first-ministers-jul2026].\n\nLa transformation à valeur ajoutée constitue la sous-question structurelle au cœur de la productivité. Le Canada figure parmi les cinq premiers producteurs mondiaux de 10\_de ses 34\_minéraux critiques, mais il n'a pas bâti à grande échelle la capacité nationale correspondante de traitement et de raffinage; écart que la stratégie actuelle sur les minéraux critiques cible explicitement [nrcan-cm-strategy-annual-2024]."
capacity_knownAndUnbuilt_en: "{\n  \"opener\": \"Canada is a heavily self-documented case, and almost every shortfall below is one the state has measured and published against itself: the register rests on the Office of the Auditor General of Canada reporting to Parliament, the Parliamentary Budget Officer costing commitments the government has not costed, the Canadian Institute for Health Information measuring the provincial health systems, and Statistics Canada's own survey of core public infrastructure — a deep base, and the depth is why the register runs long rather than any sign of unusual deficiency. The centre of gravity is implementation rather than intent, which is the audit office's own repeated finding: programmes are in place, funding is delivered and risks are known while weaknesses in implementation and monitoring hold back results. Direction is mixed rather than uniform — the maintenance backlog is widening while the armed-force shortfall is closing — and depth here is substantial, twenty-four items, most of them commitments with a mechanism in place and no closing step taken.\",\n  \"items\": [\n    {\n      \"gap\": \"Delivered policy does not reach the targets legislated under the Canadian Net-Zero Emissions Accountability Act: projected 2030\_emissions of 645\_to 647\_megatonnes against a target range of 426\_to 484\_megatonnes leave a shortfall of roughly 160\_to 220\_megatonnes, and policies and action are rated highly insufficient [cat-canada-2026][eccc-nir-2026-summary].\",\n      \"anchor\": [\n        \"territory.transition\",\n        \"cat-canada-2026\",\n        \"eccc-nir-2026-summary\"\n      ],\n      \"since\": \"since 2021 — the Canadian Net-Zero Emissions Accountability Act received royal assent on 29\_June 2021, legislating the 2030\_target the delivered path falls short of [oag-cnzeaa-2023]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"Salmonids hold the highest proportion of critical fish stocks and most of those lack rebuilding plans, with 47% of 199\_key stocks in the healthy or cautious zones against a federal target of 55% by 2026\_and the critical share at its highest on record [eccc-fish-stocks].\",\n      \"anchor\": [\n        \"territory.biosphere\",\n        \"eccc-fish-stocks\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Durable diversification away from the United States market has not been built: the sharp 2025\_fall in the United States share of merchandise exports partly reflected a surge of unwrought-gold shipments to vaults rather than new industrial markets, and it reversed through the first half of 2026\_as exports to the United States rose for four consecutive months [statcan-merch-trade-may2026][gac-trade-diversification].\",\n      \"anchor\": [\n        \"economy.externalVulnerability\",\n        \"situation\",\n        \"statcan-merch-trade-may2026\",\n        \"gac-trade-diversification\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"The Canadian Human Rights Commission has called for the creation of an independent Indigenous human rights system distinct from its own [chrc-annual-report-2025].\",\n      \"anchor\": [\n        \"political.rightsAndChecks\",\n        \"chrc-annual-report-2025\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Owners of core public infrastructure identified $294.4\_billion required to rehabilitate or replace existing assets to bring or keep them in good condition, against $31.3\_billion actually invested in renewal that year — 11% of the identified requirement — while the share of assets rated in good or very good condition fell from 59% to 55% [statcan-ccpi-renewal-2022].\",\n      \"anchor\": [\n        \"capacity.delivery\",\n        \"statcan-ccpi-renewal-2022\"\n      ],\n      \"since\": \"since 2016, when the first Canadian Infrastructure Report Card documented the national renewal-investment gap — an engineering-and-municipal advocacy body, not an official audit [cci-infrastructure-2016]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Climate adaptation is an unfunded layer on the same assets: municipalities own 64% of the replacement value of roads, 76% of public transit and 82% of active transportation and rely on property taxes and user fees never designed to finance large-scale adaptation, while Indigenous governments face additional constraints rooted in federal funding frameworks [statcan-ccpi-replacement-2022][cci-infrastructure-2026].\",\n      \"anchor\": [\n        \"capacity.delivery\",\n        \"territory.climate\",\n        \"statcan-ccpi-replacement-2022\",\n        \"cci-infrastructure-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"The federal state finished the Trans Mountain Expansion but did not prove able to forecast or contain what finishing it would cost, the estimate running from $5.4\_billion in 2013\_to $34.2\_billion on completion, years after the schedules successively announced [pbo-trans-mountain-2024].\",\n      \"anchor\": [\n        \"capacity.delivery\",\n        \"pbo-trans-mountain-2024\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Some 5.7\_million adults had no regular primary care provider in 2024\_and meeting current demand would require 49% more family physicians, while family physician supply per capita fell from 11.8\_to 11.5\_per 10,000\_population over five years [cihi-health-workforce-2024][cihi-primary-care-access].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"cihi-health-workforce-2024\",\n        \"cihi-primary-care-access\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Hospitals performed more procedures than in 2019\_and still met fewer benchmarks: 68% of hip and 61% of knee replacements were completed within the 26-week benchmark against 75% and 70% in 2019, radiation therapy within 28\_days and hip fracture repair within 48\_hours each fell three percentage points, and most cancer surgeries and diagnostic imaging remained slower than before the pandemic [cihi-wait-times-priority-2025][cihi-wait-times-2026].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"cihi-wait-times-priority-2025\",\n        \"cihi-wait-times-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Limited inpatient bed availability keeps admitted patients in emergency departments and consumes the capacity to treat new arrivals, while shortages of long-term care beds and community supports delay discharge from acute care, backing the whole chain up [cihi-wait-times-2026].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"cihi-wait-times-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Many provinces and territories report educator shortages for minority official-language programmes [statcan-elem-sec-2022-23].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"statcan-elem-sec-2022-23\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"The Royal Canadian Mounted Police made recruitment a top priority yet set targets below its actual needs and then missed them, leaving a shortfall of at least 3,400\_officers as of September 2025, vacancy rates above the force's own critical threshold in nine of the eleven provinces and territories it serves, and target processing times missed on 97% of applications [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"since 2018, when the Royal Canadian Mounted Police itself identified recruitment as a top priority [oag-rcmp-recruiting-2026]\",\n      \"class\": \"attempted-and-failed\"\n    },\n    {\n      \"gap\": \"The central lesson of the Phoenix failure, simplify pay rules before installing a new system, had produced little progress a decade later, leaving a backlog of more than 233,000\_pay transactions affecting over 133,000\_employees and roughly $4\_million a year in avoidable customization [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"roughly a decade — the report dates the lesson to the Phoenix failure and finds little progress a decade later [oag-spring-2026]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"The international student permit cap overshot its own target in the opposite direction, with just under 150,000\_permits issued in 2024\_against a forecast of about 350,000, and Newfoundland and Labrador and Saskatchewan recording declines of at least 59% where increases of 10% had been projected [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"attempted-and-failed\"\n    },\n    {\n      \"gap\": \"The responsible department investigated roughly 4,000\_of some 153,000\_flagged compliance cases in the international student programme and did not pursue 800\_identified fraud cases [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"since 2018 — the earliest of the un-actioned flagged cases, the fraudulent permits dating from 2018, per the March 2026\_audit [oag-ircc-international-students-2026]\",\n      \"class\": \"attempted-and-failed\"\n    },\n    {\n      \"gap\": \"Indigenous Services Canada was found not to have effectively implemented, monitored or assessed the initiatives it had committed to under the New Fiscal Relationship [oag-may-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-may-2026\"\n      ],\n      \"since\": \"since 2016, when Canada and the Assembly of First Nations agreed to establish the New Fiscal Relationship initiatives the department did not effectively implement [oag-isc-new-fiscal-relationship-2026]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"The avian influenza audit found gaps in planning, data and decision-making that the experience of the pandemic had not closed [oag-may-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-may-2026\"\n      ],\n      \"since\": \"since the COVID-19\_pandemic — the 2026\_audit found planning, data and vaccine-inventory gaps that the pandemic experience had not closed [cesd-avian-influenza-2026]\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"The Spring Economic Update of April 2026\_enacted a subset of what Budget 2025\_proposed, with new measures costing $37.5\_billion over six years against a budget that had announced considerably more [seu-2026][budget-2025-canada-strong].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"seu-2026\",\n        \"budget-2025-canada-strong\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"Federal decision timelines have not been brought down from a baseline of roughly five years to the two-year target: fifteen projects had been referred to the Major Projects Office as of 21\_May 2026\_and none has been designated, the listing process was only initiated on 24\_June 2026, and the two-year clock has therefore not started running on any project [dwpv-bill-c5-analysis][mpo-referred-projects][mpo-listing-process-2026][oce-building-canada-act].\",\n      \"anchor\": [\n        \"capacity.approvals\",\n        \"capacity.steering\",\n        \"dwpv-bill-c5-analysis\",\n        \"mpo-referred-projects\",\n        \"mpo-listing-process-2026\",\n        \"oce-building-canada-act\"\n      ],\n      \"since\": \"royal assent on 26\_June 2025 — the report states the two-year target remains untested more than a year later, the designation mechanism unapplied to any project ten months after the first referrals [oce-building-canada-act][mpo-listing-process-2026]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Canada is among the top five global producers of 10\_of its 34\_critical minerals but has not built the corresponding domestic processing and refining capacity at scale, a gap the current critical minerals strategy explicitly targets [nrcan-cm-strategy-annual-2024].\",\n      \"anchor\": [\n        \"capacity.productivity\",\n        \"territory.minerals\",\n        \"nrcan-cm-strategy-annual-2024\"\n      ],\n      \"since\": \"since 2022, when Canada’s own Critical Minerals Strategy named building domestic processing as a target [cesd-critical-minerals-2024]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"Internal barriers to the movement of goods, services and labour persist at the equivalent of about a 9% national tariff, rising to as much as 50% in health care, education and retail services, and their removal is running behind its own timetable: mutual recognition for services was only committed to in March 2026, labour mobility provisions were still under negotiation, credential recognition for tradespersons is targeted for spring 2027, the direct-to-consumer alcohol framework due in May 2026\_was not delivered, and First Ministers agreed in July 2026\_to work toward an agreement in principle rather than a completed instrument [imf-country-focus-internal-trade-2026][cit-communique-2026][canada-leblanc-cit-2026][pm-first-ministers-jul2026].\",\n      \"anchor\": [\n        \"capacity.productivity\",\n        \"political.stateStructure\",\n        \"imf-country-focus-internal-trade-2026\",\n        \"cit-communique-2026\",\n        \"canada-leblanc-cit-2026\",\n        \"pm-first-ministers-jul2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"No government projection of the pathway to the declared 2035\_defence spending commitment has been published, so the commitment stands without a costed route to it, against an independent estimate that core defence spending would have to reach $159.1\_billion by 2035-36, some $33.5\_billion a year in additional expenditure [pbo-nato-5-percent-2026].\",\n      \"anchor\": [\n        \"security.military\",\n        \"capacity.steering\",\n        \"pbo-nato-5-percent-2026\"\n      ],\n      \"since\": \"since the Hague summit of June 2025, where Canada committed to 5% of output by 2035 — a commitment the Parliamentary Budget Officer records as standing without any published costed pathway [pbo-nato-5-percent-2026]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"Regular Force strength stood just under 68,000\_on 31\_March 2026, 3,673\_below the authorized 71,500, with the Primary Reserve some 5,000\_short of its own target of 30,000, against a commitment to reach 71,500\_Regular and 38,800\_Reserve members before 31\_March 2032 [dnd-state-of-caf][dnd-recruitment-2026].\",\n      \"anchor\": [\n        \"security.military\",\n        \"dnd-state-of-caf\",\n        \"dnd-recruitment-2026\"\n      ],\n      \"since\": \"since at least 2002 — the Auditor General found the Canadian Forces short of people in most military occupations, and noted that previous audits had already reported on military personnel management [oag-cf-recruitment-retention-2002]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"The registry of foreign influence activities enacted by the Countering Foreign Interference Act is not yet operating: a proposed commissioner was named in March 2026, the supporting regulations were registered in final form in mid-2026, and the commissioner's office and the registry open on 4\_August 2026 [ps-foreign-interference-laws][ps-commissioner-named-2026][nrf-fitaa-2026].\",\n      \"anchor\": [\n        \"security.transnationalExposure\",\n        \"ps-foreign-interference-laws\",\n        \"ps-commissioner-named-2026\",\n        \"nrf-fitaa-2026\"\n      ],\n      \"since\": \"more than two years — the report states the registry opens more than two years after the enabling legislation received royal assent [nrf-fitaa-2026]\",\n      \"class\": \"in-progress-unclosed\"\n    }\n  ],\n  \"denominator\": \"The capacity to close any of this is inherited rather than earned: the fiscal room, the top-tier credit and the debt held at home that make these gaps closable at all rest on geology, latitude and adjacency to the largest consumer market on earth, while the cost of distance, cold and a small population spread across a continent raises the price of every kilometre of infrastructure and every unit of service delivered, and no policy choice retires it. The state's own capacity was built by settlement on Indigenous lands, and the widest gap in this report is not on this list: the life-expectancy difference of nearly eight years between the Indigenous and non-Indigenous populations, widening rather than closing, is the inherited cost of that dispossession rather than a shortfall any register entry could close [statcan-indigenous-life-expectancy]. The length of this register reflects the transparency of the auditing, not the depth of the dysfunction.\"\n}"
capacity_knownAndUnbuilt_fr: "{\n  \"opener\": \"Le Canada est un cas fortement autodocumenté, et presque chacun des manques ci-dessous est un manque que l'État a mesuré et publié à son propre sujet : le registre repose sur le Bureau du vérificateur général du Canada qui fait rapport au Parlement, sur la directrice parlementaire du budget qui chiffre des engagements que le gouvernement n'a pas chiffrés, sur l'Institut canadien d'information sur la santé qui mesure les systèmes de santé provinciaux et sur l'enquête de Statistique Canada sur les infrastructures publiques essentielles; base profonde qui explique la longueur du registre, non un signe de carence inhabituelle. Le centre de gravité est la mise en œuvre plutôt que l'intention, qui est le constat répété du bureau du vérificateur lui-même : les programmes sont en place, les fonds sont versés et les risques sont connus, mais des faiblesses dans la mise en œuvre et la surveillance freinent les résultats. La direction est mixte plutôt qu'uniforme (le déficit d'entretien se creuse tandis que le déficit d'effectifs des forces armées se resserre) et la profondeur est ici substantielle, vingt-quatre entrées, dont la plupart sont des engagements assortis d'un mécanisme en place et sans étape de clôture franchie.\",\n  \"items\": [\n    {\n      \"gap\": \"Les politiques mises en œuvre ne permettent pas d'atteindre les cibles inscrites dans la Loi canadienne sur la responsabilité en matière de carboneutralité : des émissions projetées de 645\_à 647\_mégatonnes en 2030\_contre une fourchette cible de 426\_à 484\_mégatonnes laissent un écart d'environ 160\_à 220\_mégatonnes, et les politiques et mesures sont jugées hautement insuffisantes [cat-canada-2026][eccc-nir-2026-summary].\",\n      \"anchor\": [\n        \"territory.transition\",\n        \"cat-canada-2026\",\n        \"eccc-nir-2026-summary\"\n      ],\n      \"since\": \"2021; la Loi canadienne sur la responsabilité en matière de carboneutralité a reçu la sanction royale le 29\_juin 2021, fixant la cible de 2030\_que la trajectoire n’atteint pas [oag-cnzeaa-2023]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"Les salmonidés représentent la plus forte proportion de stocks de poissons critiques et la plupart de ces stocks ne disposent pas de plan de rétablissement, alors que 47 % des 199\_stocks clés se trouvent dans des zones saines ou de prudence contre une cible fédérale de 55 % d'ici 2026, et que la part des stocks critiques atteint son plus haut niveau enregistré [eccc-fish-stocks].\",\n      \"anchor\": [\n        \"territory.biosphere\",\n        \"eccc-fish-stocks\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Aucune diversification durable hors du marché états-unien n'a été bâtie : le fort recul de la part des États-Unis dans les exportations de marchandises en 2025\_reflétait en partie une flambée d'expéditions d'or non ouvré vers des chambres fortes plutôt que vers de nouveaux marchés industriels, et il s'est inversé au premier semestre de 2026, les exportations vers les États-Unis progressant quatre mois de suite [statcan-merch-trade-may2026][gac-trade-diversification].\",\n      \"anchor\": [\n        \"economy.externalVulnerability\",\n        \"situation\",\n        \"statcan-merch-trade-may2026\",\n        \"gac-trade-diversification\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"La Commission canadienne des droits de la personne a réclamé la création d'un système autochtone indépendant de protection des droits de la personne, distinct du sien [chrc-annual-report-2025].\",\n      \"anchor\": [\n        \"political.rightsAndChecks\",\n        \"chrc-annual-report-2025\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Les propriétaires d'infrastructures publiques essentielles ont recensé un besoin de 294,4\_milliards de dollars pour remettre en état ou remplacer les actifs existants afin de les amener ou de les maintenir en bon état, contre 31,3\_milliards effectivement investis dans le renouvellement cette année-là (soit 11 % du besoin recensé) tandis que la proportion d'actifs jugés en bon ou en très bon état passait de 59 % à 55 % [statcan-ccpi-renewal-2022].\",\n      \"anchor\": [\n        \"capacity.delivery\",\n        \"statcan-ccpi-renewal-2022\"\n      ],\n      \"since\": \"2016, année où le premier Bulletin de rendement des infrastructures canadiennes a documenté l’écart national d’investissement dans le renouvellement; organisme de plaidoyer du génie et des municipalités, non un audit officiel [cci-infrastructure-2016]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"L'adaptation aux changements climatiques constitue une charge non financée qui pèse sur ces mêmes actifs : les municipalités détiennent 64 % de la valeur de remplacement des routes, 76 % de celle du transport en commun et 82 % de celle du transport actif, et elles s'appuient sur l'impôt foncier et les tarifs d'utilisation, jamais conçus pour financer une adaptation à grande échelle, tandis que les gouvernements autochtones se heurtent à des contraintes supplémentaires ancrées dans les cadres de financement fédéraux [statcan-ccpi-replacement-2022][cci-infrastructure-2026].\",\n      \"anchor\": [\n        \"capacity.delivery\",\n        \"territory.climate\",\n        \"statcan-ccpi-replacement-2022\",\n        \"cci-infrastructure-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"L'État fédéral a mené à terme l'agrandissement du réseau de Trans Mountain, mais il ne s'est pas révélé capable de prévoir ni de contenir ce que cet achèvement coûterait, l'estimation passant de 5,4\_milliards de dollars en 2013\_à 34,2\_milliards à l'achèvement, des années après les échéanciers successivement annoncés [pbo-trans-mountain-2024].\",\n      \"anchor\": [\n        \"capacity.delivery\",\n        \"pbo-trans-mountain-2024\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Quelque 5,7\_millions d'adultes n'avaient aucun fournisseur régulier de soins de santé primaires en 2024; il faudrait 49 % de médecins de famille en plus pour répondre à la demande actuelle, alors que l'offre de médecins de famille par habitant a reculé de 11,8\_à 11,5\_pour 10 000\_habitants sur cinq ans [cihi-health-workforce-2024][cihi-primary-care-access].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"cihi-health-workforce-2024\",\n        \"cihi-primary-care-access\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"Les hôpitaux ont pratiqué plus d'interventions qu'en 2019\_tout en respectant moins de délais repères : 68 % des arthroplasties de la hanche et 61 % de celles du genou ont été réalisées dans le délai repère de 26\_semaines, contre 75 % et 70 % en 2019; la radiothérapie dans les 28\_jours et la réparation d'une fracture de la hanche dans les 48\_heures ont chacune reculé de trois points de pourcentage, et la plupart des chirurgies oncologiques ainsi que l'imagerie diagnostique demeuraient plus lentes qu'avant la pandémie [cihi-wait-times-priority-2025][cihi-wait-times-2026].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"cihi-wait-times-priority-2025\",\n        \"cihi-wait-times-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Le nombre limité de lits d'hospitalisation retient aux urgences des patients déjà admis et consomme la capacité de traiter les nouvelles arrivées, tandis que la pénurie de places en soins de longue durée et de soutiens communautaires retarde les congés des soins aigus; ce qui engorge toute la chaîne [cihi-wait-times-2026].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"cihi-wait-times-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"De nombreuses provinces et territoires signalent une pénurie d'enseignants pour les programmes en langue officielle en situation minoritaire [statcan-elem-sec-2022-23].\",\n      \"anchor\": [\n        \"capacity.publicServices\",\n        \"statcan-elem-sec-2022-23\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"La Gendarmerie royale du Canada a fait du recrutement une priorité tout en fixant des cibles inférieures à ses besoins réels, puis en les manquant; laissant un déficit d'au moins 3 400\_agents en septembre 2025, des taux de vacance supérieurs à son propre seuil critique dans neuf des onze provinces et territoires qu'elle dessert, et des délais de traitement cibles non respectés pour 97 % des candidatures [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"2018, année où la Gendarmerie royale du Canada a elle-même désigné le recrutement comme une priorité absolue [oag-rcmp-recruiting-2026]\",\n      \"class\": \"attempted-and-failed\"\n    },\n    {\n      \"gap\": \"La leçon centrale de l'échec de Phénix (système de paie du gouvernement fédéral), soit simplifier les règles de rémunération avant d'installer un nouveau système, avait produit peu de progrès une décennie plus tard, laissant un arriéré de plus de 233 000\_opérations de paye touchant plus de 133 000\_employés et quelque 4\_millions de dollars par année en adaptations logicielles évitables [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"environ une décennie; le rapport situe la leçon à l'échec de Phénix et constate peu de progrès une décennie plus tard [oag-spring-2026]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Le plafond imposé aux permis d'études internationaux a dépassé sa propre cible en sens inverse, un peu moins de 150 000\_permis ayant été délivrés en 2024\_contre une prévision d'environ 350 000; Terre-Neuve-et-Labrador et la Saskatchewan enregistrant des baisses d'au moins 59 % là où des hausses de 10 % avaient été projetées [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"attempted-and-failed\"\n    },\n    {\n      \"gap\": \"Le ministère responsable a enquêté sur environ 4 000\_des quelque 153 000\_cas de non-conformité signalés dans le programme des étudiants internationaux et n'a pas donné suite à 800\_cas de fraude relevés [oag-spring-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-spring-2026\"\n      ],\n      \"since\": \"2018\_pour les plus anciens des cas signalés non traités; les permis frauduleux remontant à 2018, selon l’audit de mars 2026 [oag-ircc-international-students-2026]\",\n      \"class\": \"attempted-and-failed\"\n    },\n    {\n      \"gap\": \"Il a été constaté que Services aux Autochtones Canada n'avait pas mis en œuvre, surveillé ni évalué efficacement les initiatives auxquelles il s'était engagé dans le cadre de la nouvelle relation financière [oag-may-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-may-2026\"\n      ],\n      \"since\": \"2016, année où le Canada et l’Assemblée des Premières Nations ont convenu d’établir les initiatives de la nouvelle relation financière que le ministère n’a pas mises en œuvre efficacement [oag-isc-new-fiscal-relationship-2026]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"L'audit sur la grippe aviaire a relevé des lacunes en matière de planification, de données et de prise de décisions que l'expérience de la pandémie n'avait pas comblées [oag-may-2026].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"oag-may-2026\"\n      ],\n      \"since\": \"la pandémie de COVID-19; l’audit de 2026\_a relevé des lacunes de planification, de données et de gestion des stocks de vaccins que l’expérience de la pandémie n’avait pas comblées [cesd-avian-influenza-2026]\",\n      \"class\": \"no-attempt-documented\"\n    },\n    {\n      \"gap\": \"La mise à jour économique du printemps d'avril 2026\_a mis en vigueur un sous-ensemble de ce que proposait le Budget 2025, avec de nouvelles mesures coûtant 37,5\_milliards de dollars sur six ans, alors que le budget en avait annoncé considérablement davantage [seu-2026][budget-2025-canada-strong].\",\n      \"anchor\": [\n        \"capacity.steering\",\n        \"seu-2026\",\n        \"budget-2025-canada-strong\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"Les délais décisionnels fédéraux n'ont pas été ramenés d'un niveau de référence d'environ cinq ans à la cible de deux ans : quinze projets avaient été renvoyés au Bureau des grands projets au 21\_mai 2026\_et aucun n'a été désigné; le processus d'inscription n'a été amorcé que le 24\_juin 2026, et le délai de deux ans n'a donc commencé à courir pour aucun projet [dwpv-bill-c5-analysis][mpo-referred-projects][mpo-listing-process-2026][oce-building-canada-act].\",\n      \"anchor\": [\n        \"capacity.approvals\",\n        \"capacity.steering\",\n        \"dwpv-bill-c5-analysis\",\n        \"mpo-referred-projects\",\n        \"mpo-listing-process-2026\",\n        \"oce-building-canada-act\"\n      ],\n      \"since\": \"sanction royale le 26\_juin 2025; le rapport indique que la cible de deux ans demeure inéprouvée plus d'un an plus tard, le mécanisme de désignation n'ayant été appliqué à aucun projet dix mois après les premiers renvois [oce-building-canada-act][mpo-listing-process-2026]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Le Canada figure parmi les cinq premiers producteurs mondiaux de 10\_de ses 34\_minéraux critiques, mais il n'a pas bâti à grande échelle la capacité nationale correspondante de traitement et de raffinage; écart que la stratégie actuelle sur les minéraux critiques cible explicitement [nrcan-cm-strategy-annual-2024].\",\n      \"anchor\": [\n        \"capacity.productivity\",\n        \"territory.minerals\",\n        \"nrcan-cm-strategy-annual-2024\"\n      ],\n      \"since\": \"2022, année où la Stratégie canadienne sur les minéraux critiques a désigné l'établissement d’une capacité de traitement nationale comme objectif [cesd-critical-minerals-2024]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"Les obstacles internes à la circulation des biens, des services et de la main-d'œuvre subsistent et équivalent à des droits de douane nationaux d'environ 9 %, atteignant jusqu'à 50 % dans les soins de santé, l'éducation et les services de détail, et leur élimination accuse un retard : la reconnaissance mutuelle des services n'a fait l'objet d'un engagement qu'en mars 2026, les dispositions sur la mobilité de la main-d'œuvre étaient toujours en négociation, la reconnaissance des titres de compétence des gens de métier est visée pour le printemps 2027, le cadre de vente directe d'alcool aux consommateurs attendu en mai 2026\_n'a pas été livré, et les premiers ministres ont convenu en juillet 2026\_de travailler à une entente de principe plutôt qu'à un instrument achevé [imf-country-focus-internal-trade-2026][cit-communique-2026][canada-leblanc-cit-2026][pm-first-ministers-jul2026].\",\n      \"anchor\": [\n        \"capacity.productivity\",\n        \"political.stateStructure\",\n        \"imf-country-focus-internal-trade-2026\",\n        \"cit-communique-2026\",\n        \"canada-leblanc-cit-2026\",\n        \"pm-first-ministers-jul2026\"\n      ],\n      \"since\": \"report-silent\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Aucune projection gouvernementale de la trajectoire vers l'engagement de dépenses de défense déclaré pour 2035\_n'a été publiée, de sorte que cet engagement subsiste sans voie chiffrée pour y parvenir, alors qu'une estimation indépendante situe à 159,1\_milliards de dollars d'ici 2035-2036\_les dépenses de défense de base requises, soit quelque 33,5\_milliards de dollars de dépenses additionnelles par année [pbo-nato-5-percent-2026].\",\n      \"anchor\": [\n        \"security.military\",\n        \"capacity.steering\",\n        \"pbo-nato-5-percent-2026\"\n      ],\n      \"since\": \"le sommet de La Haye de juin 2025, où le Canada s’est engagé à consacrer 5 % du produit intérieur brut d’ici 2035; engagement qui, selon la directrice parlementaire du budget, demeure sans aucune trajectoire chiffrée publiée [pbo-nato-5-percent-2026]\",\n      \"class\": \"announced-not-implemented\"\n    },\n    {\n      \"gap\": \"L'effectif de la Force régulière s'établissait à un peu moins de 68 000\_membres au 31\_mars 2026, soit 3 673\_de moins que les 71 500\_autorisés, la Première réserve accusant un manque de quelque 5 000\_membres par rapport à sa propre cible de 30 000, alors que l'engagement est d'atteindre 71 500\_membres de la Force régulière et 38 800\_réservistes avant le 31\_mars 2032 [dnd-state-of-caf][dnd-recruitment-2026].\",\n      \"anchor\": [\n        \"security.military\",\n        \"dnd-state-of-caf\",\n        \"dnd-recruitment-2026\"\n      ],\n      \"since\": \"au moins 2002; le vérificateur général a constaté que les Forces canadiennes manquaient de personnel dans la plupart des groupes professionnels militaires et a relevé que des audits antérieurs avaient déjà porté sur la gestion du personnel militaire [oag-cf-recruitment-retention-2002]\",\n      \"class\": \"in-progress-unclosed\"\n    },\n    {\n      \"gap\": \"Le registre des activités d'influence étrangère édicté par la Loi sur la lutte contre l'ingérence étrangère n'est pas encore en service : un candidat au poste de commissaire a été désigné en mars 2026, le règlement d'application a été enregistré dans sa forme définitive au milieu de 2026, et le bureau du commissaire ainsi que le registre doivent être mis en service le 4\_août 2026 [ps-foreign-interference-laws][ps-commissioner-named-2026][nrf-fitaa-2026].\",\n      \"anchor\": [\n        \"security.transnationalExposure\",\n        \"ps-foreign-interference-laws\",\n        \"ps-commissioner-named-2026\",\n        \"nrf-fitaa-2026\"\n      ],\n      \"since\": \"plus de deux ans; le rapport indique que le registre entrerait en vigueur plus de deux ans après la sanction royale de la loi habilitante [nrf-fitaa-2026]\",\n      \"class\": \"in-progress-unclosed\"\n    }\n  ],\n  \"denominator\": \"La capacité de combler ces lacunes est héritée plutôt qu'acquise : la marge budgétaire, les notations de crédit favorables et la dette détenue au pays, qui devraient permettre de combler ces lacunes, tiennent à la géologie, à la latitude et au voisinage du plus grand marché de consommation du monde, tandis que le coût de la distance, du climat froid et d'une population restreinte dispersée sur un continent renchérit chaque kilomètre d'infrastructure et chaque unité de service livrée, et aucun choix de politique ne l'abolit. La capacité même de l'État s'est édifiée par la colonisation de peuplement sur des terres autochtones, et le plus large écart du présent rapport ne figure pas dans cette liste : l'écart d'espérance de vie de près de huit ans entre les populations autochtones et non autochtones, qui se creuse plutôt qu'il ne se resserre, constitue le coût hérité de cette dépossession et non un manque qu'une entrée de registre pourrait combler [statcan-indigenous-life-expectancy]. La longueur de ce registre reflète la transparence de la vérification, et non l'ampleur des dysfonctionnements.\"\n}"
security_posture_en: "Canada's security posture is defensive and alliance-dependent, and its diplomatic orientation is aligned but increasingly hedging. It faces no armed threat to its territory and no challenge to its monopoly on force [security.internal]; it maintains a force too small to act alone beyond constabulary tasks and can project only at brigade scale within a coalition [security.military]; and it belongs to the core Western alliance structures while actively building a second set of security relationships in Europe and repairing damaged ones in Asia [security.diplomacy].\n\nThe dependency has a specific shape, and it is the defining feature. Continental defence is conducted binationally with the United States and has no alternative arrangement [security.military], while the same state is the source of the tariff pressure and the lapsed trade framework that dominate Canada's external economic position [security.diplomacy]. Canada is therefore structurally reliant for its physical security on the partner generating most of its strategic uncertainty. The hedge that has developed in response is real but thin: the European security partnership is explicitly non-binding, the defence procurement agreement is commercial access rather than a defence guarantee, and the trade resets with China and India address markets rather than security [security.diplomacy].\n\nCapability lags commitment across the board. Defence spending reached the alliance benchmark only in 2025-26, and partly by counting expenditure across several departments; the far larger 2035\_commitment has no published pathway; and the force remains below its own authorized strength [security.military]. The instrument created to counter the interference the state has formally identified as its principal external threat was not yet operating two years after the enabling legislation passed [security.transnationalExposure]. The picture is of a country that has recognized its exposures accurately and is early in acting on them — with the two relationships named as most damaging to its democratic institutions being the same two it has just moved to repair commercially [security.transnationalExposure][security.diplomacy]."
security_posture_fr: "La posture de sécurité du Canada est défensive et tributaire de ses alliances, et son orientation diplomatique demeure alignée, tout en cherchant de plus en plus à se prémunir. Le pays ne fait face à aucune menace armée contre son territoire ni à aucune contestation de son monopole de la force [security.internal]; il entretient une force trop réduite pour agir seul au-delà des tâches de maintien de l'ordre et ne peut projeter qu'à l'échelle de la brigade, au sein d'une coalition [security.military]. Il appartient aux structures d'alliance occidentales centrales tout en bâtissant activement un second réseau de relations de sécurité en Europe et en réparant celles qui s'étaient détériorées en Asie [security.diplomacy].\n\nLa dépendance prend une forme précise; c'est là son trait déterminant. La défense continentale s'exerce sur une base binationale avec les États-Unis et ne dispose d'aucun arrangement de rechange [security.military], alors que ce même État est la source de la pression tarifaire et du cadre commercial devenu caduc qui dominent la position économique extérieure du Canada [security.diplomacy]. Le Canada dépend donc structurellement, pour sa sécurité physique, du partenaire qui génère l'essentiel de son incertitude stratégique. La couverture qui s'est développée en réponse est réelle, mais mince : le partenariat européen de sécurité est explicitement non contraignant, l'entente sur les acquisitions de défense relève de l'accès commercial et non d'une garantie de défense, et les remises à niveau commerciales avec la Chine et l'Inde portent sur des marchés et non sur la sécurité [security.diplomacy].\n\nLa capacité accuse partout un retard sur l'engagement. Les dépenses de défense n'ont atteint la cible de l'Alliance qu'en 2025-2026, et en partie grâce à la comptabilisation de dépenses réparties entre plusieurs ministères; l'engagement bien plus considérable de 2035\_ne s'accompagne d'aucune trajectoire publiée; et les effectifs demeurent inférieurs à leur propre niveau autorisé [security.military]. L'instrument créé pour contrer l'ingérence que l'État a officiellement désignée comme sa principale menace extérieure n'était toujours pas opérant deux ans après l'adoption de la loi habilitante [security.transnationalExposure]. Le portrait est celui d'un pays qui a cerné ses vulnérabilités avec justesse et qui n'en est qu'aux premiers gestes pour y remédier; les deux relations désignées comme les plus dommageables pour ses institutions démocratiques étant précisément les deux qu'il vient de rétablir sur le plan commercial [security.transnationalExposure][security.diplomacy]."
security_internal_en: "Canada faces no armed groups, no insurgency and no challenge to its monopoly on force. Territorial control is uncontested throughout the country, though it is thinly exercised in the North, where the Criminal Intelligence Service identifies a shifting Arctic security landscape as an emerging risk to remote communities [cisc-organized-crime-2025]. Federal policing is exercised by the Royal Canadian Mounted Police under the direction of the Minister of Public Safety. The force also serves as the provincial or territorial police service under contract in every province except Ontario and Quebec (which maintain their own provincial forces) and in all three territories, as well as in many municipalities [rcmp-transition-binder][justice-rcmp-act].\n\nOrganized crime is the primary internal security problem, and it is largely transnational in character. The Criminal Intelligence Service assessed and rated 493\_organized crime groups in 2025 (eight as national high-level threats, 100\_as medium and 385\_as low) alongside more than 560\_street gangs, many expanding into new jurisdictions and readily using violence [cisc-organized-crime-2025]. Ninety-three percent of assessed groups are involved in drug manufacturing or distribution, and the most threatening maintain connections across some fifty countries, principally the United States, Mexico, Colombia and the United Arab Emirates [cisc-organized-crime-2025][fincan-ml-assessment-2025]. Indigenous communities face an escalating threat, driven by the opioid toxicity crisis and violent street gangs [cisc-organized-crime-2025]. Illicit finance is the enabling layer beneath organized crime. Money-laundering risk is moderate and below the global average: on the 2025\_Basel Anti-Money Laundering Index, which scores 177\_jurisdictions from 0\_to 10\_on the strength of their controls against financial crime, Canada scores 4.61, safer than the global average of 5.28\_and than the United States, but middling among wealthy democracies — behind the United Kingdom, France and Australia, and well behind the Nordic countries [basel-aml-index-2025]. Criminal Intelligence Service Canada estimates $45\_to $113\_billion laundered in the country each year — a range wide enough to signal how little is precisely known — with illegal drug trafficking the highest single money-laundering threat and crypto-asset channels rated a very high vulnerability [fincan-ml-assessment-2025]. The structural weakness is enforcement rather than detection: the federal financial-intelligence unit produces thousands of disclosures annually, but prosecutions and asset recovery run far behind the estimated flow, with the largest recent cases seizing tens of millions against an annual total measured in tens of billions. That enforcement gap is what keeps Canada out of the lowest-risk tier its institutions might otherwise reach.\n\nThe state's response escalated sharply in 2025\_and crossed a categorical line. On 20\_February 2025\_Canada listed seven transnational criminal organizations as terrorist entities under the Criminal Code — extending counterterrorism authorities to criminal cartels for the first time — alongside a $1.3\_billion border plan, the appointment of a commissioner for the fight against fentanyl, a joint operational intelligence cell and a partnership between the financial sector and law enforcement on laundering [ps-terrorist-entities-2025][cbsa-border-review-2025].\n\nThe terrorism threat level is Medium, meaning a violent act of terrorism could occur. It is set by the Director of the Canadian Security Intelligence Service on the advice of the Integrated Terrorism Assessment Centre, is reassessed at least every four months, and has remained at this level since October 2014 [canada-terrorism-threat-level]. Domestic attacks in recent years have been carried out predominantly by lone actors, often ideologically motivated, and terrorist financing activity in Canada is assessed as low in both volume and value [fincan-ml-assessment-2025].\n\nThe land border with the United States is undefended and managed through bilateral law enforcement cooperation rather than militarization, with operational control exercised at ports of entry. Enforcement data cuts against the direction commonly assumed: in a month-long cross-country interception operation in early 2025\_the Canada Border Services Agency made over 2,600\_narcotics seizures, of which about 67.5% involved drugs entering Canada from the United States and 17.5% drugs leaving for it [cbsa-border-review-2025]. \n\nNo systemic corruption in the security forces is recorded in the sources consulted."
security_internal_fr: "Le Canada ne fait face à aucun groupe armé, à aucune insurrection et à aucune contestation de son monopole de la force. Le contrôle territorial est incontesté dans l'ensemble du pays, bien qu'il s'exerce faiblement dans le Nord, où le Service canadien de renseignements criminels relève l'évolution du contexte de sécurité dans l'Arctique comme un risque émergent pour les collectivités éloignées [cisc-organized-crime-2025]. Les services de police fédéraux sont assurés par la Gendarmerie royale du Canada sous la direction du ministre de la Sécurité publique. La Gendarmerie agit également comme service de police provincial ou territorial, à contrat, dans toutes les provinces sauf l'Ontario et le Québec (qui maintiennent leurs propres corps policiers provinciaux) ainsi que dans les trois territoires et dans de nombreuses municipalités [rcmp-transition-binder][justice-rcmp-act].\n\nLe crime organisé constitue le principal problème de sécurité intérieure; il est en grande partie de nature transnationale. Le Service canadien de renseignements criminels a évalué et coté 493\_groupes du crime organisé en 2025 (huit comme menaces nationales de haut niveau, 100\_comme menaces moyennes et 385\_comme menaces faibles), en plus de plus de 560\_gangs de rue, dont beaucoup s'étendent à de nouveaux territoires et recourent sans hésiter à la violence [cisc-organized-crime-2025]. Quatre-vingt-treize pour cent des groupes évalués prennent part à la fabrication ou à la distribution de drogues; les plus menaçants entretiennent des liens dans une cinquantaine de pays, principalement les États-Unis, le Mexique, la Colombie et les Émirats arabes unis [cisc-organized-crime-2025][fincan-ml-assessment-2025]. Les collectivités autochtones font face à une menace grandissante, alimentée par la crise des surdoses d'opioïdes et par les gangs de rue violents [cisc-organized-crime-2025]. La finance illicite est le rouage qui rend possible le crime organisé. Le risque de blanchiment d'argent est modéré et inférieur à la moyenne mondiale : à l'Indice de Bâle sur le blanchiment d'argent de 2025, qui évalue 177 pays et territoires de 0 à 10 selon la solidité de leurs contrôles contre la criminalité financière, le Canada obtient 4,61; résultat plus sûr que la moyenne mondiale de 5,28 et que celui des États-Unis, mais qui demeure dans la moyenne des démocraties riches, derrière le Royaume-Uni, la France et l'Australie, et loin derrière les pays nordiques [basel-aml-index-2025]. Le Service canadien de renseignements criminels estime qu'entre 45 et 113 milliards de dollars sont blanchis au pays chaque année (fourchette assez large pour signaler à quel point l'ampleur réelle est mal connue); le trafic de drogues illégales constituant la principale menace de blanchiment et les canaux de cryptoactifs étant jugés très vulnérables [fincan-ml-assessment-2025]. La faiblesse est structurelle et tient à la répression plutôt qu'à la détection : l'unité fédérale du renseignement financier produit des milliers de communications par année, tandis que les poursuites et la récupération des avoirs restent bien en deçà des flux estimés; les plus importantes affaires récentes n'ayant permis de saisir que des dizaines de millions face à un total annuel qui se chiffre en dizaines de milliards. C'est cet écart en matière de répression qui empêche le Canada d'atteindre la catégorie de risque la plus faible que ses institutions pourraient autrement viser.\n\nLa riposte de l'État s'est nettement intensifiée en 2025\_et a franchi un seuil. Le 20\_février 2025, le Canada a inscrit sept organisations criminelles transnationales sur la liste des entités terroristes en vertu du Code criminel (étendant pour la première fois les pouvoirs antiterroristes aux cartels criminels), en même temps qu'un plan frontalier de 1,3\_milliard de dollars, la nomination d'un commissaire à la lutte contre le fentanyl, une cellule mixte de renseignement opérationnel et un partenariat entre le secteur financier et les forces de l'ordre en matière de blanchiment [ps-terrorist-entities-2025][cbsa-border-review-2025].\n\nLe niveau de menace terroriste est moyen; ce qui signifie qu'un acte de terrorisme violent pourrait se produire. Il est fixé par le directeur du Service canadien du renseignement de sécurité sur l'avis du Centre intégré d'évaluation du terrorisme; il est réévalué au moins tous les quatre mois et il demeure à ce niveau depuis octobre 2014 [canada-terrorism-threat-level]. Les attentats survenus au pays ces dernières années ont été commis en majorité par des acteurs solitaires, souvent mus par des motifs idéologiques, et l'activité de financement du terrorisme au Canada est évaluée comme faible tant en volume qu'en valeur [fincan-ml-assessment-2025].\n\nLa frontière terrestre avec les États-Unis n'est pas défendue militairement et est gérée par la coopération policière bilatérale plutôt que par la militarisation; le contrôle opérationnel s'exerçant aux points d'entrée. Les données d'application de la loi vont à l'encontre du sens communément supposé : lors d'une opération d'interception d'un mois menée à l'échelle du pays au début de 2025, l'Agence des services frontaliers du Canada a effectué plus de 2 600\_saisies de stupéfiants, dont environ 67,5 % portaient sur des drogues entrant au Canada depuis les États-Unis et 17,5 % sur des drogues quittant le Canada vers les États-Unis [cbsa-border-review-2025]. \n\nAucune corruption systémique au sein des forces de sécurité n'est consignée dans les sources consultées."
security_military_en: "The Canadian Armed Forces are an all-volunteer force. Regular Force strength stood at just under 68,000\_on 31\_March 2026, still 3,673\_below the authorized 71,500, with the Primary Reserve some 5,000\_short of its own target of 30,000 [dnd-state-of-caf]. That shortfall is now closing rather than widening: the force enrolled 7,310\_Regular Force members in 2025-26, beating its recruiting target for a second consecutive year and recording the highest intake in more than thirty years, and has raised the objective to 8,200\_for 2026-27 [dnd-recruitment-2026]. The defence policy commitment is to reach 71,500\_Regular and 38,800\_Reserve members before 31\_March 2032 [dnd-state-of-caf]. Personnel remains the binding constraint on capability rather than equipment or money.\n\nDefence spending crossed a long-missed threshold in 2025-26. Canada reached the North Atlantic Treaty Organization's benchmark of 2% of gross domestic product, spending more than $63\_billion — the first time in roughly thirty-five years and the largest year-over-year increase in generations [pm-nato-2-percent-2026]. The composition matters: that figure spans the Department of National Defence, the Canadian Armed Forces, the Canadian Coast Guard and other federal departments, counted according to alliance reporting practices, rather than the defence department alone [pm-nato-2-percent-2026]. A Defence Investment Agency was established in October 2025\_to accelerate procurement, and North American Aerospace Defense Command modernization carries $38.6\_billion over twenty years [pm-nato-2-percent-2026][dnd-departmental-results-2024-25]. The larger commitment is unfunded in any published plan: at the Hague summit in June 2025\_Canada agreed to invest 5% of output by 2035, 3.5% on core defence and 1.5% on defence-related infrastructure [pm-nato-2-percent-2026][nato-hague-declaration-2025]. The Parliamentary Budget Officer estimates that core defence spending would have to reach $159.1\_billion by 2035-36, some $33.5\_billion a year in additional expenditure, raising the deficit by $63\_billion and the debt-to-output ratio by 6.3\_percentage points — and records that no government projection of the pathway has been published [pbo-nato-5-percent-2026].\n\nThe force is organized as a single unified service under the Chief of the Defence Staff, with the Canadian Army, the Royal Canadian Navy and the Royal Canadian Air Force as its environmental commands. Cyber became a formal domain in September 2024\_with the establishment of Canadian Armed Forces Cyber Command as the single departmental authority for cyber operations, integrating signals intelligence and joint electronic warfare and operating in close partnership with the Communications Security Establishment [dnd-cyber-command-2024]. Space capability is developing chiefly through continental surveillance rather than as an independent domain, within the North American Aerospace Defense Command modernization programme [dnd-departmental-results-2024-25].\n\nCanada can project force, but only at brigade scale and only within a coalition. Operation REASSURANCE is its largest overseas mission, with approximately 2,000\_personnel in Latvia and over 3,000\_deployed across the operation through the year; Canada is the framework nation for the North Atlantic Treaty Organization's Multinational Brigade Latvia, a formation of roughly 3,000\_personnel from fourteen allies, and the mission was renewed in August 2025\_for a further three years to 2029 [dnd-op-reassurance][pm-latvia-renewal-2025]. The operation also deploys ships to standing alliance maritime groups and an air task force [dnd-op-reassurance]. Canada holds no overseas bases of its own and hosts no foreign bases; continental defence is conducted through the binational North American Aerospace Defense Command with the United States [dnd-departmental-results-2024-25]. Canada is a non-nuclear-weapon state party to the Treaty on the Non-Proliferation of Nuclear Weapons, holds no nuclear weapons, and bases its policy on that treaty while declining to join the Treaty on the Prohibition of Nuclear Weapons [gac-nuclear-nonproliferation]."
security_military_fr: "Les Forces armées canadiennes sont une force entièrement composée de volontaires. L'effectif de la Force régulière s'établissait à 67 827\_membres au 31\_mars 2026, soit 3 673\_de moins que les 71 500\_autorisés; la Première réserve accusant pour sa part un manque de quelque 5 000\_membres par rapport à sa propre cible de 30 000 [dnd-state-of-caf]. Ce déficit se resserre désormais plutôt qu'il ne se creuse : les Forces ont enrôlé 7 310\_membres de la Force régulière en 2025-2026, dépassant leur cible de recrutement pour une deuxième année consécutive et enregistrant le plus fort recrutement en plus de trente ans; elles ont porté l'objectif à 8 200\_pour 2026-2027 [dnd-recruitment-2026]. Le personnel demeure la contrainte déterminante sur la capacité militaire, plutôt que l'équipement ou les ressources financières.\n\nLes dépenses de défense ont franchi en 2025-2026\_un seuil longtemps manqué. Le Canada a atteint la cible de 2 % du produit intérieur brut fixée par l'Organisation du traité de l'Atlantique Nord, dépensant plus de 63\_milliards de dollars; première depuis une trentaine d'années et la plus forte hausse d'une année sur l'autre depuis des générations [pm-nato-2-percent-2026]. La composition de ce chiffre importe : il englobe le ministère de la Défense nationale, les Forces armées canadiennes, la Garde côtière canadienne et d'autres ministères fédéraux, selon les pratiques de déclaration de l'Alliance, plutôt que le seul ministère de la Défense [pm-nato-2-percent-2026]. Une Agence des investissements en défense a été créée en octobre 2025\_pour accélérer les acquisitions, et la modernisation du Commandement de la défense aérospatiale de l'Amérique du Nord représente 38,6\_milliards de dollars sur vingt ans [pm-nato-2-percent-2026][dnd-departmental-results-2024-25]. L'engagement plus vaste n'est financé dans aucun plan publié : au sommet de La Haye, en juin 2025, le Canada a convenu d'investir 5 % de son PIB d'ici 2035, dont 3,5 % en défense de base et 1,5 % en infrastructures liées à la défense [pm-nato-2-percent-2026][nato-hague-declaration-2025]. La directrice parlementaire du budget estime que les dépenses de défense de base devraient atteindre 159,1\_milliards de dollars d'ici 2035-2036, soit quelque 33,5\_milliards de dollars de dépenses additionnelles par année; ce qui accroîtrait le déficit de 63\_milliards de dollars et le ratio de la dette au produit intérieur brut de 6,3\_points de pourcentage. Elle signale qu'aucune projection gouvernementale de la trajectoire n'a été publiée [pbo-nato-5-percent-2026].\n\nLes Forces sont organisées en un service unifié unique sous l'autorité du chef d'état-major de la défense; l'Armée canadienne, la Marine royale canadienne et l'Aviation royale canadienne en constituant les commandements d'armée. Le cyberespace est devenu un domaine officiel en septembre 2024\_avec la création du Commandement des cyberopérations des Forces armées canadiennes : autorité ministérielle unique en matière de cyberopérations, qui intègre le renseignement d'origine électromagnétique et la guerre électronique interarmées et travaille en étroit partenariat avec le Centre de la sécurité des télécommunications [dnd-cyber-command-2024]. La capacité spatiale se développe principalement par la surveillance continentale plutôt que comme domaine autonome, dans le cadre du programme de modernisation du Commandement de la défense aérospatiale de l'Amérique du Nord [dnd-departmental-results-2024-25].\n\nLe Canada peut projeter sa force, mais seulement à l'échelle de la brigade et seulement au sein d'une coalition. L'opération REASSURANCE est sa plus importante mission à l'étranger, avec environ 2 000\_militaires en Lettonie et plus de 3 000\_déployés dans l'ensemble de l'opération au cours de l'année; le Canada est la nation-cadre de la Brigade multinationale de l'OTAN en Lettonie (formation d'environ 3 000\_militaires provenant de quatorze pays alliés), et la mission a été renouvelée en août 2025\_pour trois années supplémentaires, jusqu'en 2029 [dnd-op-reassurance][pm-latvia-renewal-2025]. L'opération déploie également des navires au sein des groupes maritimes permanents de l'Alliance ainsi qu'une force opérationnelle aérienne [dnd-op-reassurance]. Le Canada ne possède aucune base à l'étranger et n'accueille aucune base étrangère; la défense continentale s'exerce par l'intermédiaire du Commandement de la défense aérospatiale de l'Amérique du Nord, organisme binational partagé avec les États-Unis [dnd-departmental-results-2024-25]. Le Canada est un État non doté d'armes nucléaires, partie au Traité sur la non-prolifération des armes nucléaires; il ne détient aucune arme nucléaire et il fonde sa politique sur ce traité, tout en refusant d'adhérer au Traité sur l'interdiction des armes nucléaires [gac-nuclear-nonproliferation]."
security_transnationalExposure_en: "Foreign interference is Canada's largest non-state and state-adjacent exposure, and it has been formally adjudicated. The public inquiry led by Justice Marie-Josée Hogue concluded in its final report of January 2025\_that the People's Republic of China was the most active perpetrator of foreign interference targeting Canadian democratic institutions and India the second most active, and that transnational repression against diaspora communities in Canada was serious enough to warrant a warning beyond the inquiry's own mandate [hogue-final-report-2025]. The intelligence service reports counter-interference, transnational repression and prevention of cyber intrusion by foreign states among its principal operational lines [csis-public-report-2025]. The legislative response is in place but not yet operating. The Countering Foreign Interference Act of 2024\_created new offences for deceptive acts undermining democratic processes and for transnational repression, renamed the governing statute the Foreign Interference and Security of Information Act, and enacted a Foreign Influence Transparency and Accountability Act providing for a registry of foreign influence activities under an independent commissioner [ps-foreign-interference-laws]. The appointment procedure is deliberately insulated: it requires consultation with the parliamentary leaders of all recognized parties and approval by both the House of Commons and the Senate, and on that basis the Minister of Public Safety named Anton Boegman, formerly British Columbia's chief electoral officer, as proposed commissioner in March 2026 [ps-commissioner-named-2026]. The supporting regulations were published for comment in January 2026\_and registered in final form in mid-2026, with the commissioner's office and the registry to open on 4\_August 2026 — more than two years after the enabling legislation received royal assent [nrf-fitaa-2026].\n\nTrafficking and illicit finance run in both directions and are structurally transnational. The most threatening organized crime groups maintain connections across some fifty countries, sourcing illicit drugs and firearms and laundering proceeds abroad, with the United States, Mexico, Colombia and the United Arab Emirates the most frequented destinations for criminal purposes and China and Australia completing the principal list [cisc-organized-crime-2025]. Firearms enter the country from the United States: dozens of Canadian street gangs are assessed as involved in smuggling weapons across the border [cisc-organized-crime-2025]. Illicit value flows out through trade-based laundering and crypto-asset channels, both rated high vulnerabilities in the federal assessment, and the state's own analysis identifies foreign interference as an emerging threat vector that combines state sponsorship with organized crime [fincan-ml-assessment-2025]. A dedicated trade transparency unit was established within the border agency to detect illicit financial flows moving through international trade [cbsa-border-review-2025].\n\nMigration pressure has fallen sharply from its peak, by policy rather than by circumstances. Asylum claim volumes rose from over 92,000\_in 2022\_to over 144,000\_in 2023\_and over 173,000\_in 2024 [ircc-asylum-statistics]. Extending the Safe Third Country Agreement across the entire land border in March 2023\_cut claims made between ports of entry from an average of 165\_a day to 13, and irregular crossings fell from roughly 17,000\_in 2023\_to under 4,500\_in 2024 [ircc-asylum-statistics]. Further measures followed: a partial visa requirement for Mexican nationals, and new eligibility restrictions in force from 26\_March 2026\_under the Strengthening Canada's Immigration System and Borders Act, after which claims from temporary resident visa holders fell 84% year on year [ircc-asylum-statistics]. The residual pressure is concentrated rather than general, running mainly through the Lacolle port of entry in Quebec, and the federal government transferred $750\_million to Quebec in recognition of housing and asylum costs incurred between 2021\_and 2024 [ircc-asylum-statistics].\n\nShared-resource friction is concentrated on one instrument. Canada and the United States reached an agreement in principle in July 2024, after six years of negotiation, to modernize the Columbia River Treaty, which governs flood control, hydropower allocation, water supply and salmon restoration on a river whose headwaters are in British Columbia. In March 2025\_the United States paused negotiations pending a broad review of its international engagements, leaving the modernized agreement unratified and interim arrangements bridging the original treaty [bc-columbia-treaty-2025]."
security_transnationalExposure_fr: "L'ingérence étrangère constitue la plus grande vulnérabilité du Canada de source non étatique ou paraétatique, et elle a fait l'objet d'un jugement formel. L'enquête publique menée par la juge Marie-Josée Hogue a conclu, dans son rapport final de janvier 2025, que la République populaire de Chine était l'auteur le plus actif d'ingérence étrangère visant les institutions démocratiques canadiennes et l'Inde le deuxième plus actif, et que la répression transnationale exercée contre les communautés diasporiques au Canada était suffisamment grave pour justifier une mise en garde débordant le mandat même de la Commission [hogue-final-report-2025]. Le service de renseignement inscrit la lutte contre l'ingérence, la répression transnationale et la prévention des intrusions informatiques d'origine étatique étrangère parmi ses principaux axes opérationnels [csis-public-report-2025]. La réponse législative est en place, mais n'est pas encore opérante. La Loi sur la lutte contre l'ingérence étrangère de 2024\_a créé de nouvelles infractions visant les actes trompeurs qui minent les processus démocratiques ainsi que la répression transnationale, a renommé la loi habilitante Loi sur l'ingérence étrangère et la sécurité de l'information, et a édicté la Loi sur la transparence et la responsabilité en matière d'influence étrangère, laquelle prévoit un registre des activités d'influence étrangère relevant d'un commissaire indépendant [ps-foreign-interference-laws]. La procédure de nomination est délibérément soustraite à l'influence partisane : elle exige la consultation des chefs parlementaires de tous les partis reconnus et l'approbation de la Chambre des communes comme du Sénat; c'est à ce titre que le ministre de la Sécurité publique a désigné Anton Boegman, ancien directeur général des élections de la Colombie-Britannique, comme commissaire proposé en mars 2026 [ps-commissioner-named-2026]. Le règlement d'application a été publié pour commentaires en janvier 2026\_et enregistré dans sa forme définitive au milieu de 2026; le bureau du commissaire et le registre devant ouvrir le 4\_août 2026 (plus de deux ans après la sanction royale de la loi habilitante) [nrf-fitaa-2026].\n\nLe trafic et le financement illicite circulent dans les deux sens et sont structurellement transnationaux. Les groupes du crime organisé les plus menaçants entretiennent des liens dans une cinquantaine de pays, s'approvisionnant en drogues et en armes à feu illicites et blanchissant leurs produits à l'étranger; les États-Unis, le Mexique, la Colombie et les Émirats arabes unis constituant les destinations les plus fréquentées à des fins criminelles, la Chine et l'Australie complétant la liste principale [cisc-organized-crime-2025]. Les armes à feu entrent au pays depuis les États-Unis : des dizaines de gangs de rue canadiens sont considérés comme impliqués dans leur contrebande à travers la frontière [cisc-organized-crime-2025]. La valeur illicite sort du pays par le blanchiment fondé sur le commerce et par les circuits de cryptoactifs, tous deux cotés comme des vulnérabilités élevées dans l'évaluation fédérale; l'analyse de l'État lui-même désigne l'ingérence étrangère comme un vecteur de menace émergent, qui allie le parrainage étatique au crime organisé [fincan-ml-assessment-2025]. Une unité spécialisée en transparence commerciale a été créée au sein de l'agence frontalière pour détecter les flux financiers illicites qui transitent par le commerce international [cbsa-border-review-2025].\n\nLa pression migratoire a fortement diminué par rapport à son sommet, du fait des politiques et non des circonstances. Le volume des demandes d'asile est passé de plus de 92 000\_en 2022\_à plus de 144 000\_en 2023, puis à plus de 173 000\_en 2024 [ircc-asylum-statistics]. L'extension de l'Entente entre le Canada et les États-Unis sur les tiers pays sûrs à l'ensemble de la frontière terrestre, en mars 2023, a fait chuter les demandes présentées entre les points d'entrée d'une moyenne de 165\_par jour à 13, et les passages irréguliers ont reculé d'environ 17 000\_en 2023\_à moins de 4 500\_en 2024 [ircc-asylum-statistics]. D'autres mesures ont suivi : une obligation de visa partielle pour les ressortissants mexicains, et de nouvelles restrictions d'admissibilité en vigueur depuis le 26\_mars 2026\_en vertu de la Loi visant à renforcer le système d'immigration et les frontières du Canada, après quoi les demandes provenant de titulaires d'un visa de résident temporaire ont chuté de 84 % sur un an [ircc-asylum-statistics]. La pression résiduelle est concentrée plutôt que générale, passant principalement par le point d'entrée de Lacolle, au Québec, et le gouvernement fédéral a transféré 750\_millions de dollars au Québec en reconnaissance des coûts de logement et d'asile engagés entre 2021\_et 2024 [ircc-asylum-statistics].\n\nLes frictions liées aux ressources partagées se concentrent sur un seul instrument. Le Canada et les États-Unis sont parvenus à une entente de principe en juillet 2024, après six ans de négociations, pour moderniser le Traité du fleuve Columbia, qui régit la maîtrise des crues, la répartition de l'hydroélectricité, l'approvisionnement en eau et le rétablissement du saumon sur un fleuve dont les eaux d'amont se trouvent en Colombie-Britannique. En mars 2025, les États-Unis ont suspendu les négociations en attendant un vaste réexamen de leurs engagements internationaux, laissant l'entente modernisée non ratifiée et des arrangements provisoires assurant la transition depuis le traité original [bc-columbia-treaty-2025]."
security_diplomacy_en: "Canada's alliance architecture rests on three long-standing pillars and one recent addition. It is a founding member of the North Atlantic Treaty Organization and the sixth-largest contributor to its common funded budget; it shares the binational North American Aerospace Defense Command with the United States; and it belongs to the Five Eyes intelligence partnership with the United States, the United Kingdom, Australia and New Zealand [pm-nato-2-percent-2026][cgai-diplomats-guide-2026]. The newest addition is European. Canada and the European Union signed a Security and Defence Partnership at their summit of 23\_June 2025 — a non-legally binding political framework regrouping existing cooperation across crisis management, military mobility, defence procurement, maritime security, cyber and space [gac-canada-eu]. On 14\_February 2026\_the two signed a further agreement admitting Canadian firms to procurement under the European Union's Security Action for Europe instrument, making Canada the first non-European participant in that €150\_billion facility; it has applied provisionally since 13\_April 2026\_and was formally concluded by the Council on 15\_June 2026 [gac-canada-eu][consilium-safe-canada-2026]. Canada has also been a third-state participant in European Permanent Structured Cooperation since 2021, in the military mobility and logistics hub projects [gac-canada-eu]. Multilateral membership extends to the Group of Seven, the Group of Twenty, the Organisation for Economic Co-operation and Development, the Commonwealth and La Francophonie, giving Canada institutional reach beyond its military weight [cgai-diplomats-guide-2026].\n\nThe United States remains the dominant relationship on trade, defence and border management, and it is the one under structural stress. Roughly three quarters of merchandise exports go south, tariffs imposed in 2025-26\_are treated as permanent by the Parliamentary Budget Officer, and the Canada–United States–Mexico Agreement passed its review deadline on 1\_July 2026\_without renewal [statcan-merch-trade-may2026][pbo-efo-jun2026]. Defence integration continues regardless, through the North American Aerospace Defense Command and the modernization programme.\n\nThe two relationships the foreign interference inquiry identified as most damaging have both been reset, and that is the central tension in Canada's current diplomacy. China was named the most active perpetrator of interference against Canadian democratic institutions [hogue-final-report-2025]; in January 2026\_the Prime Minister made the first Canadian visit to Beijing since 2017, and the two governments issued an economic and trade cooperation roadmap under a declared strategic partnership. Canada cut its tariff on Chinese electric vehicles from 100% to the most-favoured-nation rate of 6.1% within an annual quota, while China reduced canola seed duties and suspended anti-discrimination tariffs on canola meal, peas, lobster and crab; Global Affairs Canada has set a target of increasing exports to China by 50% by 2030 [gac-china-market-access-2026]. India, the second-ranked source of interference in the same inquiry, followed a parallel path [hogue-final-report-2025]. After high commissioners were expelled by both sides in 2024, the two prime ministers met at the Group of Seven summit in Alberta in June 2025\_and again at the Group of Twenty in November; high commissioners were reinstated in August 2025, a shared roadmap was announced during the foreign minister's visit to New Delhi that October, and the Prime Minister led a delegation to India in February and March 2026 [gac-india-relations]. Two-way merchandise trade reached $10.9\_billion in 2025, though the flow is lopsided and moving further that way: Canadian exports of $3.9\_billion fell 26.5% from 2024\_while imports of $7.0\_billion rose 18.9%, and negotiations toward a comprehensive economic partnership agreement are under way [gac-india-relations]. In both cases commercial diversification away from the United States is proceeding alongside unresolved security findings about the same partners.\n\nTerritorial disputes are narrow and under active negotiation. In September 2024\_Canada launched negotiations with the United States to resolve the long-standing maritime boundary dispute in the Beaufort Sea, where the two states claim jurisdiction under differing legal interpretations of an 1825\_treaty between Russia and Great Britain; the negotiations involve the affected Inuit treaty organizations and close consultation with territorial and Indigenous governments [gac-arctic-foreign-policy-2024]. A second, smaller disagreement with the Kingdom of Denmark concerns two zones in the Lincoln Sea, and the boundary agreement settling Tartupaluk, or Hans Island, is being implemented [gac-arctic-foreign-policy-2024]. The larger disagreement is not about ownership but about control of navigation. Canada's stated position is that all waters of its Arctic archipelago, including the channels comprising the Northwest Passage, are internal waters by virtue of historic title, and that its Arctic sovereignty encompasses land, sea and ice [gac-arctic-foreign-policy-2024]. The United States and other maritime states hold the Passage to be a strait used for international navigation; the two sides have long agreed to disagree, and the dispute has been assessed as posing no acute sovereignty or security concern, with receding sea ice raising its salience rather than its temperature [belfer-nwp-2025]."
security_diplomacy_fr: "L'architecture d'alliances du Canada repose sur trois piliers de longue date et sur un ajout récent. Le Canada est membre fondateur de l'Organisation du traité de l'Atlantique Nord et le sixième contributeur à son budget commun; il partage avec les États-Unis le Commandement binational de la défense aérospatiale de l'Amérique du Nord; et il appartient au partenariat de renseignement du Groupe des cinq, avec les États-Unis, le Royaume-Uni, l'Australie et la Nouvelle-Zélande [pm-nato-2-percent-2026][cgai-diplomats-guide-2026]. Le plus récent ajout est européen. Le Canada et l'Union européenne ont signé un Partenariat de sécurité et de défense à leur sommet du 23\_juin 2025; cadre politique sans caractère juridiquement contraignant qui regroupe la coopération existante en matière de gestion de crise, de mobilité militaire, d'acquisitions de défense, de sécurité maritime, de cyberespace et d'espace [gac-canada-eu]. Le 14\_février 2026, les deux parties ont signé une entente supplémentaire admettant les entreprises canadiennes aux marchés publics ouverts par l'instrument européen d'action pour la sécurité en Europe, faisant du Canada le premier participant non européen à ce mécanisme de 150\_milliards d'euros; l'entente s'applique à titre provisoire depuis le 13\_avril 2026\_et a été formellement conclue par le Conseil le 15\_juin 2026 [gac-canada-eu][consilium-safe-canada-2026]. Le Canada participe également, à titre d'État tiers, à la coopération structurée permanente européenne depuis 2021, dans les projets de mobilité militaire et de pôle logistique [gac-canada-eu]. Ses appartenances multilatérales s'étendent au Groupe des Sept, au Groupe des Vingt, à l'Organisation de coopération et de développement économiques, au Commonwealth et à la Francophonie; ce qui lui confère une portée institutionnelle supérieure à son poids militaire [cgai-diplomats-guide-2026].\n\nLes États-Unis demeurent la relation dominante en matière de commerce, de défense et de gestion frontalière, et celle subissant une tension structurelle. Environ les trois quarts des exportations de marchandises prennent la direction du sud, les droits de douane imposés en 2025-2026\_sont tenus pour permanents par la directrice parlementaire du budget, et l'Accord Canada–États-Unis–Mexique a franchi son échéance d'examen le 1er juillet 2026\_sans être reconduit [statcan-merch-trade-may2026][pbo-efo-jun2026]. L'intégration en matière de défense se poursuit néanmoins, par l'intermédiaire du Commandement de la défense aérospatiale de l'Amérique du Nord et de son programme de modernisation.\n\nLes deux relations que l'enquête sur l'ingérence étrangère a désignées comme les plus dommageables ont l'une et l'autre été rétablies; il s'agit de la tension centrale de la diplomatie canadienne actuelle. La Chine a été nommée l'auteur le plus actif d'ingérence contre les institutions démocratiques canadiennes [hogue-final-report-2025]; en janvier 2026, le premier ministre a effectué la première visite canadienne à Pékin depuis 2017, et les deux gouvernements ont publié une feuille de route de coopération économique et commerciale dans le cadre d'un partenariat stratégique déclaré. Le Canada a ramené ses droits de douane sur les véhicules électriques chinois de 100 % au taux de la nation la plus favorisée de 6,1 % à l'intérieur d'un contingent annuel, tandis que la Chine réduisait ses droits sur les graines de canola et suspendait ses droits antidiscriminatoires sur le tourteau de canola, les pois, le homard et le crabe. Affaires mondiales Canada s'est fixé pour cible d'accroître de 50 % les exportations vers la Chine d'ici 2030 [gac-china-market-access-2026]. L'Inde, deuxième source d'ingérence en importance selon la même enquête, a suivi une voie parallèle [hogue-final-report-2025]. Après l'expulsion réciproque des hauts-commissaires en 2024, les deux premiers ministres se sont rencontrés au sommet du Groupe des Sept en Alberta en juin 2025, puis de nouveau au Groupe des Vingt en novembre. Les hauts-commissaires ont été rétablis dans leurs fonctions en août 2025, une feuille de route commune a été annoncée lors de la visite de la ministre des Affaires étrangères à New Delhi en octobre, et le premier ministre a conduit une délégation en Inde en février et en mars 2026 [gac-india-relations]. Les échanges bilatéraux de marchandises ont atteint 10,9\_milliards de dollars en 2025, mais le flux est déséquilibré et le devient davantage : les exportations canadiennes, à 3,9\_milliards de dollars, ont reculé de 26,5 % par rapport à 2024, tandis que les importations, à 7,0\_milliards, ont progressé de 18,9 %; des négociations en vue d'un accord de partenariat économique global sont en cours [gac-india-relations]. Dans les deux cas, la diversification commerciale au détriment des États-Unis progresse parallèlement à des constats de sécurité non résolus concernant ces mêmes partenaires.\n\nLes différends territoriaux sont circonscrits et font l'objet de négociations actives. En septembre 2024, le Canada a entamé des négociations avec les États-Unis en vue de régler le différend de longue date sur la délimitation maritime dans la mer de Beaufort, où les deux États revendiquent compétence en s'appuyant sur des interprétations juridiques divergentes d'un traité de 1825\_conclu entre la Russie et la Grande-Bretagne; les négociations associent les organisations inuites signataires de traités concernées et prévoient une consultation étroite des gouvernements territoriaux et autochtones [gac-arctic-foreign-policy-2024]. Un second désaccord, de moindre portée, avec le Royaume du Danemark porte sur deux zones de la mer de Lincoln, et l'accord de délimitation réglant le cas de Tartupaluk, ou île Hans, est en cours de mise en œuvre [gac-arctic-foreign-policy-2024]. Le désaccord le plus important ne porte pas sur la propriété, mais sur le contrôle de la navigation. La position déclarée du Canada est que toutes les eaux de son archipel arctique, y compris les chenaux qui composent le passage du Nord-Ouest, sont des eaux intérieures en vertu d'un titre historique, et que sa souveraineté dans l'Arctique s'étend aux terres, à la mer et aux glaces [gac-arctic-foreign-policy-2024]. Les États-Unis et d'autres États maritimes tiennent le passage pour un détroit servant à la navigation internationale; les deux camps s'accommodent depuis longtemps de leur désaccord, et il a été établi que ce différend ne soulevait aucune préoccupation aiguë de souveraineté ou de sécurité, le recul de la glace de mer en accroissant la visibilité plutôt que la virulence [belfer-nwp-2025]."
situation_en: "[\n  {\n    \"thread\": \"Trade rupture with the United States\",\n    \"status\": \"ongoing\",\n    \"events\": [\n      {\n        \"date\": \"From 4\_February to 4\_March 2025\",\n        \"what\": \"The United States imposed 25% tariffs on virtually all Canadian goods (10% on energy); Canada retaliated with 25% counter-tariffs on 30\_billion Canadian dollars in imports, later extended to 155\_billion Canadian dollars [fin-canada-counter-tariffs].\",\n        \"changed\": \"This ended the effectively tariff-free trading relationship in place since 1994, exposing roughly $500\_billion in annual bilateral trade to new costs.\"\n      },\n      {\n        \"date\": \"March to June 2025\",\n        \"what\": \"Sectoral tariffs were layered on under United States Section 232\_authority: 25% on steel and aluminum in March, raised to 50% in June, and 25% in April on vehicles not built in the United States [us-section-232].\",\n        \"changed\": \"This imposed durable, CUSMA-immune tariffs on precisely Canada's resource and manufacturing export base.\"\n      },\n      {\n        \"date\": \"1\_September 2025\",\n        \"what\": \"Canada unilaterally removed most counter-tariffs, retaining them only on steel, aluminum, and automobiles [fin-canada-counter-tariffs].\",\n        \"changed\": \"This ended the reciprocal-escalation phase. The government framed the move as protecting the roughly 85% of Canada–US trade that remained tariff-free and sustaining negotiations; opposition parties and affected industries characterized it as unilateral concession without corresponding US relief.\"\n      },\n      {\n        \"date\": \"October 2025\",\n        \"what\": \"The United States imposed a 10% Section 232\_tariffs on softwood lumber effective 14\_October, stacked on long-standing anti-dumping and countervailing duties whose combined rate reached more than 35% under the sixth administrative review [gac-softwood-recent]; trade negotiations were terminated.\",\n        \"changed\": \"This layered a new national-security tariff onto an existing trade-remedy regime, bringing the combined burden on Canadian softwood to roughly 45% under two separate legal authorities, neither shielded by CUSMA.\"\n      },\n      {\n        \"date\": \"24\_February 2026\",\n        \"what\": \"The 35% tariff on non-CUSMA-compliant goods was replaced by a 10% Section 122\_surcharge including Canada; the emergency-power tariffs were ruled unlawful, and refunds became available to affected Canadian importers from April 2026 [us-cbp-tariff-notice-2026].\",\n        \"changed\": \"This materially reduced the headline tariff rate while leaving sectoral tariffs untouched.\"\n      },\n      {\n        \"date\": \"1\_July 2026\",\n        \"what\": \"At the trilateral CUSMA joint review, the United States confirmed it was not currently willing to automatically extend the agreement to 2042 [gac-cusma-review][cusma-leblanc-statement-2026].\",\n        \"changed\": \"CUSMA remains in force but shifts to annual reviews until its scheduled 2036\_expiry, placing North American free trade in permanent renegotiation.\"\n      },\n      {\n        \"date\": \"20\_July 2026\",\n        \"what\": \"The United States invoked Section 338\_of the Tariff Act of 1930\_for the first time in its history, signing three proclamations imposing an additional 50% duty on Canadian motor vehicles, alcoholic beverages and dairy, with annexes extending to wine, cement, plywood, furniture, clothing, fishing rods and hockey equipment [whitehouse-section338-2026][pm-statement-tariffs-2026].\",\n        \"changed\": \"This brought roughly $20\_billion of Canadian exports, about 5% of goods sold to the United States, under an authority that carries no time limit and from which CUSMA origin gives no exemption — removing CUSMA compliance as a shield for the first time since the rupture began [ustr-section338-2026][whitehouse-section338-2026].\"\n      },\n      {\n        \"date\": \"24\_July 2026\",\n        \"what\": \"The Section 122\_surcharge lapsed at the end of its 150-day statutory window, no extension having been introduced in Congress [federalregister-section122-2026][cbp-csms-section122-2026].\",\n        \"changed\": \"This ended the across-the-board 10% surcharge without affecting any sectoral duty, the breadth it provided being replaced from 22\_August by depth on named Canadian sectors [whitehouse-section338-2026].\"\n      },\n      {\n        \"date\": \"18 to 22 August 2026\",\n        \"what\": \"Hours before the Section 338 duties were to take effect on 19 August, the United States suspended them for three days pending a broader deal. Negotiations in Washington then broke down; the Prime Minister suspended talks and recalled Canada's negotiating team, and the 50% duties took effect as scheduled at 12:01 a.m. on 22 August 2026 [fin-canada-countermeasures-2026]\",\n        \"changed\": \"This ended the negotiation track that had run since the July proclamations and made the sectoral tariff regime the settled state rather than a bargaining position, with CUSMA-compliant vehicles, alcohol, dairy and a long annex of consumer goods now dutied at 50% regardless of origin.\"\n      },\n      {\n        \"date\": \"25 August 2026\",\n        \"what\": \"Canada announced dollar-for-dollar counter-tariffs on $27.6 billion of United States imports, at rates of 15%, 25% or 50% matched to the corresponding United States rate, across some 874 tariff lines covering steel and aluminum, dairy, appliances, agricultural equipment, pulp and paper and electronics, effective 12:01 a.m. on 8 September 2026; existing counter-tariffs on United States steel and aluminum rise from 25% to 50% to match. The measures came with a $7.5 billion support package for affected workers and businesses [fin-canada-countermeasures-2026][fin-canada-counter-list-2026].\",\n        \"changed\": \"This restored the reciprocal-escalation phase that the September 2025 de-escalation had ended, on a larger base and under United States authorities that CUSMA does not shield.\"\n      }\n    ],\n    \"currentState\": \"CUSMA-compliant goods remain tariff-free on the original measures, but the Section 338 proclamations now reach a range of consumer and manufacturing goods regardless of origin. The durable damage is sectoral and stacked under multiple United States authorities: 50% on steel, aluminum and copper, 25% on vehicles, a combined Section 232 and anti-dumping/countervailing burden on softwood lumber near 45% (the trade-remedy component under review), and, from 22 August, a further 50% on vehicles, alcohol, dairy and a long annex of goods under Section 338, which carries no expiry and no CUSMA exemption. Negotiations collapsed in August after a last-minute United States revision of terms; Canada suspended talks, recalled its team, and imposed matching counter-tariffs on $27.6 billion of United States goods effective 8 September while removing its own duties on CUSMA-compliant United States imports. Across eighteen months the regime shifted repeatedly in rate, scope and legal basis; the instability, independent of any rate, has left exporters without a stable basis on which to plan.\"\n  }\n]"
situation_fr: "[\n  {\n    \"thread\": \"Rupture commerciale avec les États-Unis\",\n    \"status\": \"en cours\",\n    \"events\": [\n      {\n        \"date\": \"4\_février au 4\_mars 2025\",\n        \"what\": \"Les États-Unis imposent des droits de douane de 25 % sur la quasi-totalité des produits canadiens (10 % sur l'énergie); le Canada riposte par des contre-mesures tarifaires de 25 % sur 30 milliards de dollars canadiens d'importations, portées par la suite à 155  milliards de dollars canadiens [fin-canada-counter-tariffs].\",\n        \"changed\": \"Cela met fin à la relation commerciale essentiellement exempte de droits de douane en place depuis 1994, exposant à de nouveaux coûts environ 500\_milliards de dollars d'échanges bilatéraux annuels.\"\n      },\n      {\n        \"date\": \"mars à juin 2025\",\n        \"what\": \"Des droits sectoriels se superposent en vertu de l'article 232\_des États-Unis : 25 % sur l'acier et l'aluminium en mars, portés à 50 % en juin, et 25 % sur les véhicules non construits aux États-Unis en avril [us-section-232].\",\n        \"changed\": \"Cela impose des droits durables, insensibles à l'Accord Canada–États-Unis–Mexique, précisément sur la base d'exportation de ressources et de produits manufacturés du Canada.\"\n      },\n      {\n        \"date\": \"1er septembre 2025\",\n        \"what\": \"Le Canada retire unilatéralement la plupart de ses contre-mesures tarifaires, ne les maintenant que sur l'acier, l'aluminium et les automobiles [fin-canada-counter-tariffs].\",\n        \"changed\": \"Cela met fin à la phase d'escalade réciproque. Le gouvernement présente ce geste comme protégeant les quelque 85 % d'échanges entre le Canada et les États-Unis demeurés exempts de droits et comme un soutien aux négociations; les partis d'opposition et les industries touchées le qualifient de concession unilatérale sans allègement correspondant de la part des États-Unis.\"\n      },\n      {\n        \"date\": \"octobre 2025\",\n        \"what\": \"Les États-Unis imposent un droit de 10 % au titre de l'article 232\_sur le bois d'œuvre résineux à compter du 14\_octobre, ajouté à des droits antidumping et compensateurs de longue date dont le taux combiné atteint plus de 35 % au sixième examen administratif [gac-softwood-recent]; les négociations commerciales sont rompues.\",\n        \"changed\": \"Cela superpose un nouveau droit de sécurité nationale à un régime de recours commercial existant, portant la charge combinée sur le bois d'œuvre canadien à environ 45 % en vertu de deux fondements juridiques distincts, aucun protégé par l'Accord Canada–États-Unis–Mexique.\"\n      },\n      {\n        \"date\": \"24\_février 2026\",\n        \"what\": \"Le droit de 35 % sur les produits non conformes à l'Accord Canada–États-Unis–Mexique est remplacé par une surtaxe de 10 % au titre de l'article 122\_incluant le Canada; les droits imposés en vertu des pouvoirs d'urgence sont jugés illégaux, et des remboursements deviennent accessibles aux importateurs canadiens touchés à compter d'avril 2026 [us-cbp-tariff-notice-2026].\",\n        \"changed\": \"Cela réduit sensiblement le taux tarifaire global tout en laissant intacts les droits sectoriels.\"\n      },\n      {\n        \"date\": \"1er juillet 2026\",\n        \"what\": \"Lors de l'examen conjoint trilatéral de l'Accord Canada–États-Unis–Mexique, les États-Unis confirment ne pas être disposés pour l'instant à prolonger automatiquement l'accord jusqu'en 2042 [gac-cusma-review][cusma-leblanc-statement-2026].\",\n        \"changed\": \"L'Accord Canada–États-Unis–Mexique demeure en vigueur, mais passe à des examens annuels jusqu'à son expiration prévue en 2036, plaçant le libre-échange nord-américain en renégociation permanente.\"\n      },\n      {\n        \"date\": \"20\_juillet 2026\",\n        \"what\": \"Les États-Unis invoquent l'article 338\_de la Tariff Act de 1930\_pour la première fois de leur histoire, signant trois proclamations imposant un droit supplémentaire de 50 % sur les véhicules automobiles, les boissons alcoolisées et les produits laitiers canadiens, avec des annexes s'étendant au vin, au ciment, au contreplaqué, aux meubles, aux vêtements, aux cannes à pêche et à l'équipement de hockey [whitehouse-section338-2026][pm-statement-tariffs-2026].\",\n        \"changed\": \"Cela fait passer environ 20\_milliards de dollars d'exportations canadiennes, soit près de 5 % des produits vendus aux États-Unis, sous un pouvoir sans limite de durée, à l'égard duquel l'origine ACEUM ne confère aucune exemption; retirant pour la première fois la conformité à l'Accord Canada–États-Unis–Mexique comme bouclier depuis le début de la rupture [ustr-section338-2026][whitehouse-section338-2026].\"\n      },\n      {\n        \"date\": \"24\_juillet 2026\",\n        \"what\": \"La surtaxe au titre de l'article 122\_expire au terme de sa fenêtre légale de 150\_jours, aucune prolongation n'ayant été déposée au Congrès [federalregister-section122-2026][cbp-csms-section122-2026].\",\n        \"changed\": \"Cela met fin à la surtaxe générale de 10 % sans toucher aux droits sectoriels; l'ampleur qu'elle offrait étant remplacée à compter du 22\_août par une intensité ciblée sur des secteurs canadiens nommés [whitehouse-section338-2026].\"\n      },\n      {\n        \"date\": \"18 au 22 août 2026\",\n        \"what\": \"Quelques heures avant l'entrée en vigueur des droits de l'article 338 prévue le 19 août, les États-Unis les suspendent pour trois jours dans l'attente d'une entente plus large. Les négociations à Washington échouent ensuite; le premier ministre suspend les pourparlers et rappelle l'équipe de négociation canadienne, et les droits de 50 % entrent en vigueur comme prévu à 0 h 1 le 22 août 2026 [fin-canada-countermeasures-2026].\",\n        \"changed\": \"Cela a mis fin à la voie de négociation ouverte depuis les proclamations de juillet et a fait du régime tarifaire sectoriel l'état établi plutôt qu'une position de marchandage; les véhicules, l'alcool, les produits laitiers et une longue annexe de biens de consommation conformes à l'ACEUM étant désormais frappés de 50 % sans égard à l'origine.\"\n      },\n      {\n        \"date\": \"25 août 2026\",\n        \"what\": \"Le Canada annonce des contre-tarifs équivalents, dollar pour dollar, sur 27,6 milliards de dollars d'importations des États-Unis, à des taux de 15 %, 25 % ou 50 % appariés au taux états-unien correspondant, répartis sur quelque 874 lignes tarifaires couvrant l'acier et l'aluminium, les produits laitiers, les appareils électroménagers, la machinerie agricole, les pâtes et papiers et l'électronique, en vigueur à 0 h 1 le 8 septembre 2026; les contre-tarifs existants sur l'acier et l'aluminium des États-Unis passent de 25 % à 50 % pour s'aligner. Les mesures s'accompagnent d'un train de soutien de 7,5 milliards de dollars pour les travailleurs et les entreprises touchés [fin-canada-countermeasures-2026][fin-canada-counter-list-2026].\",\n        \"changed\": \"Cela a rétabli la phase d'escalade réciproque à laquelle la désescalade de septembre 2025 avait mis fin, sur une assiette plus large et en vertu d'autorités états-uniennes que l'Accord Canada–États-Unis–Mexique ne protège pas.\"\n      }\n    ],\n    \"currentState\": \"Les produits conformes à l'Accord Canada–États-Unis–Mexique demeurent exempts de droits au titre des mesures initiales, mais les proclamations de l'article 338 atteignent désormais un éventail de biens de consommation et de fabrication sans égard à l'origine. Les dommages durables sont sectoriels et empilés sous plusieurs autorités états-uniennes : 50 % sur l'acier, l'aluminium et le cuivre, 25 % sur les véhicules, un fardeau combiné de droits de l'article 232 et de droits antidumping et compensateurs sur le bois d'œuvre résineux avoisinant 45 % (la composante de recours commerciaux étant elle-même en cours de révision) et, à compter du 22 août, un droit supplémentaire de 50 % sur les véhicules, l'alcool, les produits laitiers et une longue annexe de biens en vertu de l'article 338, qui ne comporte aucune échéance ni exemption au titre de l'Accord Canada–États-Unis–Mexique. Les négociations ont échoué en août après une révision de dernière minute des conditions par les États-Unis; le Canada a suspendu les pourparlers, rappelé son équipe et imposé des contre-tarifs équivalents sur 27,6 milliards de dollars de biens états-uniens en vigueur le 8 septembre, tout en retirant ses propres droits sur les importations des États-Unis conformes à l'Accord Canada–États-Unis–Mexique. En dix-huit mois, le régime a changé à répétition de taux, de portée et de fondement juridique; cette instabilité, indépendamment de tout taux, prive les exportateurs de toute base stable de planification.\"\n  }\n]"
situation_lastUpdated: '2026-09-01'
actors_domestic_en: "[\n  {\n    \"name\": \"Prime Minister Mark Carney and the federal Cabinet\",\n    \"kind\": \"federal executive\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Mark Carney is Prime Minister leading a Liberal government that reached a majority between elections through five floor crossings and a sweep of three by-elections; it is running a project-approval, internal-trade and defence agenda the report describes as early and mostly unrealised, negotiating under United States tariffs, and resetting relations with China and India while the interference findings against both stand unresolved.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"economy.publicFinances\",\n      \"economy.politicalEconomy\",\n      \"political.powerStructure\",\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.steering\",\n      \"capacity.approvals\",\n      \"capacity.delivery\",\n      \"capacity.productivity\",\n      \"security.military\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"interests\": \"Converting announced agendas into delivered outcomes — first national-interest designations, the Canada Strong Fund, mutual recognition, the defence pathway — while containing tariff damage without conceding the sectoral duties [capacity.steering][situation].\",\n    \"resources\": \"Fused executive-legislative control of the House agenda, appointment power exercised through the Governor in Council, federal fiscal room (deficit at 2.1% of output, three top-tier ratings, debt held domestically), $108.4\_billion in transfers and a $25\_billion sovereign fund [political.powerStructure][political.shockAbsorbers][economy.politicalEconomy].\",\n    \"constraints\": \"A bare majority of 172\_of which one is the Speaker, with four seats vacant; the Auditor General's finding that programmes and funding are in place but implementation and monitoring are not; and a division of powers that leaves health, education, resources and most infrastructure outside federal control, with a duty to consult gating its own approvals machinery [political.shockAbsorbers][capacity.steering][political.stateStructure].\",\n    \"likelyMoves\": \"Complete the listing decisions targeted for autumn 2026, use the window before the 19\_August Section 338\_duties for negotiation having announced no counter-measures, and contest the four vacant seats on which the majority rests [capacity.approvals][situation][political.powerStructure].\",\n    \"engagementMode\": \"negotiable / dealable. Bargaining on every axis at once — with provinces through memoranda of understanding and First Ministers, with Indigenous rights holders through a statutory consultation duty, and with Washington through intensified talks [capacity.steering][situation].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"capacity.steering\",\n      \"capacity.approvals\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"group\": \"pm-executive\"\n  },\n  {\n    \"name\": \"Liberal Party of Canada (governing caucus)\",\n    \"kind\": \"governing party\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The governing party holds 172\_of 343\_seats after five floor crossings and three by-election wins, the exact number a majority of the full House requires, and the report locates the binding constraint in internal discipline across an enlarged and ideologically broad caucus rather than in inter-party bargaining.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Holding the caucus together at a seat count with no margin, and defending the legitimacy of a majority assembled between elections [political.powerStructure][political.shockAbsorbers].\",\n    \"resources\": \"Single-party government without coalition partners, control of the House agenda, and an enlarged caucus including five recent floor-crossers [political.stabilityDrivers].\",\n    \"constraints\": \"Every defection, resignation or by-election loss moves the government onto the Speaker's casting vote; the caucus is described as ideologically broad, which is the same fact read as a discipline problem [political.powerStructure][political.stabilityDrivers].\",\n    \"likelyMoves\": \"Contest the four vacant seats to restore a cushion; the report identifies by-elections as the pivot [political.powerStructure].\",\n    \"engagementMode\": \"negotiable / dealable. As governing caucus it is the government's own bargaining surface — the report says the constraint has shifted from between parties to inside one [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Conservative Party of Canada (Official Opposition)\",\n    \"kind\": \"opposition party\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"With 139\_seats the Official Opposition rejects as illegitimate the route by which the government crossed the majority threshold, arguing it carries no democratic mandate, while having supported the One Canadian Economy Act at third reading; it is also the only federal party with a named group in the Senate.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Denying the government the legitimacy of its majority while remaining aligned with it on major project delivery [political.shockAbsorbers][capacity.approvals].\",\n    \"resources\": \"139\_seats, the largest opposition bloc, twelve Senate seats, and — on the immigration question — the sharpest partisan sorting the report records [political.powerStructure][society.cohesion].\",\n    \"constraints\": \"It cannot defeat a government that holds the bare majority threshold, and its own support passed the flagship legislation it might otherwise contest [political.powerStructure][capacity.approvals].\",\n    \"likelyMoves\": \"Contest the vacant seats and keep pressing the mandate argument; the report treats by-election outcomes as the operative variable [political.powerStructure].\",\n    \"engagementMode\": \"negotiable / dealable. The report records it voting with the government on the Building Canada Act while denying its legitimacy — a counterpart on legislation and an opponent on standing [capacity.approvals][political.shockAbsorbers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Bloc Québécois\",\n    \"kind\": \"opposition party\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Holds 21\_seats and recorded its opposition to the One Canadian Economy Act at third reading on 20\_June 2025.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Contesting federal approvals legislation reaching into areas the report elsewhere describes as provincial jurisdiction [capacity.approvals][political.stateStructure].\",\n    \"resources\": \"21\_seats, the third-largest bloc in the House [political.powerStructure].\",\n    \"constraints\": \"Its opposition to the Act was recorded but not decisive, the bill passing with Liberal and Conservative support [capacity.approvals].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable. The report shows it as a recorded vote against, with no bargaining relationship described [capacity.approvals].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"New Democratic Party\",\n    \"kind\": \"opposition party\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Reduced to 5\_seats, one of its members having crossed the floor to the government, and recorded its opposition to the One Canadian Economy Act at third reading.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Opposing the approvals regime on the rights and procedural grounds the report attributes to the recorded opposition [capacity.approvals].\",\n    \"resources\": \"5\_seats [political.powerStructure].\",\n    \"constraints\": \"Below the bloc sizes of every other named party and having lost a member to the government benches [political.powerStructure].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable. No bargaining leverage is described; the government no longer requires its confidence [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Parliament of Canada (House of Commons and Senate)\",\n    \"kind\": \"legislature\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The bicameral legislature holds the enumerated powers of section 91\_and the residual power, is the body to which the Auditor General reports and the sole amender of territorial constitutions; it reserved to the House of Commons the determination of a clear question and clear majority under the Clarity Act, passed the One Canadian Economy Act at third reading on 20\_June 2025, and both chambers must approve the foreign influence transparency commissioner — while carrying the worst institutional confidence reading the report measures, 28.3% high and 40.0% low.\",\n    \"fieldsCitedIn\": [\n      \"society.cohesion\",\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.steering\",\n      \"capacity.approvals\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"The report attributes institutional rather than strategic interests: exercising the legislative and scrutiny functions the constitutional texts assign it [political.stateStructure][capacity.steering].\",\n    \"resources\": \"Enumerated and residual legislative power, the statutory determination of referendum clarity, exclusive amendment of territorial constitutions, and a confirmation role over the foreign influence commissioner [political.stateStructure][political.constitutionalSubstrate][security.transnationalExposure].\",\n    \"constraints\": \"Executive and legislative control are fused, so a government with the confidence of the House controls its agenda; and public confidence in the institution is the weakest of any measured [political.powerStructure][society.cohesion].\",\n    \"likelyMoves\": \"Process the by-elections in four vacant seats and the confirmation of the commissioner whose office opens 4\_August 2026 [political.powerStructure][security.transnationalExposure].\",\n    \"engagementMode\": \"statutorily-independent. Its powers come from the constitutional texts rather than from bargaining, though the fusion of executive and legislature means the government of the day directs its agenda [political.powerStructure][political.stateStructure].\",\n    \"anchors\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.approvals\",\n      \"society.cohesion\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Senate of Canada\",\n    \"kind\": \"legislature\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The 105-seat appointed chamber stands at 40\_Independent Senators Group, 18\_Canadian Senators Group, 17\_Progressive Senate Group, 12\_Conservative Party of Canada, 5\_Government Representative's Office and 4\_non-affiliated with 9\_vacancies; on 7\_July 2026\_the Prime Minister dropped the non-partisan criterion that had governed appointments since 2016\_and reworked the independent advisory board, alongside his first four appointments.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"A co-equal approval role over the foreign influence transparency commissioner, and a composition in which only one group of twelve is tied to a federal party [security.transnationalExposure][political.powerStructure].\",\n    \"constraints\": \"Every seat is filled by appointment on the Prime Minister's recommendation, and the criterion that insulated that process has just been removed; nine seats are vacant, five of them in Quebec [political.powerStructure].\",\n    \"likelyMoves\": \"Receive further appointments under the revised process [political.powerStructure].\",\n    \"engagementMode\": \"hijack-exposed. The report describes the removal of the non-partisan appointment criterion and the reworking of the advisory board as a change in the chamber's character, and notes that the same criterion was retained for Supreme Court appointments at the same moment [political.powerStructure][political.rightsAndChecks].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.rightsAndChecks\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Speaker of the House of Commons\",\n    \"kind\": \"legislature\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"One of the 172\_government members is the Speaker, who by convention votes only to break ties, leaving an operative government bloc of 171\_against 167 — so further losses would leave the government's ability to legislate resting on the Speaker's casting vote.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"A casting vote that becomes decisive at the seat counts the report describes [political.shockAbsorbers].\",\n    \"constraints\": \"Bound by a convention that restricts the vote to tie-breaking [political.powerStructure].\",\n    \"likelyMoves\": \"The report frames the Speaker's vote as a contingency that activates on further defections, vacancies or by-election losses rather than as an action taken [political.shockAbsorbers].\",\n    \"engagementMode\": \"statutorily-independent. The office operates by convention rather than by bargaining, and the report treats the casting vote as a rule, not a negotiable position [political.powerStructure].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"The Crown (Governor General; Governor in Council)\",\n    \"kind\": \"federal executive\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Formal executive authority rests with the Crown, represented by the Governor General and exercised in practice by the Prime Minister and Cabinet through the Privy Council; the Governor in Council appoints Supreme Court judges, the Chief of the Defence Staff and the Commissioner of the Royal Canadian Mounted Police and lists national-interest projects by Order — and the Crown is the party that owes the duty to consult, the constitutional relationship of Indigenous nations running to it rather than to the provinces.\",\n    \"fieldsCitedIn\": [\n      \"society.composition\",\n      \"political.powerStructure\",\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\",\n      \"capacity.steering\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Formal appointment and listing powers exercised on ministerial recommendation, and standing as the constitutional counterparty to treaty and title holders [political.rightsAndChecks][capacity.approvals][society.composition].\",\n    \"constraints\": \"Every power is exercised on advice, so the Crown acts as the formal channel of Cabinet decisions; and its own duty to consult has twice been enforced against a provincial initiative [political.powerStructure][political.constitutionalSubstrate].\",\n    \"likelyMoves\": \"Issue the listing Orders the government has targeted for autumn 2026 [capacity.approvals].\",\n    \"engagementMode\": \"veto-holder in one specific sense — the Tsilhqot'in framework requires consent or section 35\_justification for Crown incursions on title land, so the Crown is the address at which consent is sought and the party whose failure to consult voids provincial process [political.constitutionalSubstrate][political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.constitutionalSubstrate\",\n      \"society.composition\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"pm-executive\"\n  },\n  {\n    \"name\": \"Supreme Court of Canada (and its Independent Advisory Board for judicial appointments)\",\n    \"kind\": \"judicial\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The final court of appeal, nine judges appointed by the Governor in Council from a shortlist prepared by a non-partisan Independent Advisory Board — which assesses applicants against published criteria including functional bilingualism and regional representation, prepares a shortlist of three to five names and publishes a report on each process — used in full this year to appoint Justice Glenn Joyal on 30\_June 2026; its Secession Reference doctrine and its Tsilhqot’in title ruling govern the questions the report describes as in motion, and the constitutionality of Quebec’s laicity legislation is before it.\",\n    \"fieldsCitedIn\": [\n      \"society.religion\",\n      \"political.rightsAndChecks\",\n      \"political.constitutionalSubstrate\",\n      \"political.powerStructure\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Full judicial review as final court of appeal; an appointment process with published criteria, a public parliamentary hearing and an advisory board controlling the shortlist from which the appointment must be made; and standing doctrine on secession and Aboriginal title that lower courts are applying [political.rightsAndChecks][political.constitutionalSubstrate].\",\n    \"constraints\": \"It decides what reaches it: the laicity statute is shielded from Charter review by the notwithstanding clause, which sets the terms on which that case arrives; and the advisory board is constituted for each process by the government — the report notes the equivalent Senate board was reworked and its non-partisan criterion dropped [society.religion][political.rightsAndChecks][political.powerStructure].\",\n    \"likelyMoves\": \"Rule on the laicity reference now before it; the report gives no timetable [society.religion].\",\n    \"engagementMode\": \"judicial-deference. The report records the non-partisan appointment criterion being retained for this court — and its advisory board’s non-partisan character preserved — at the same moment both were dropped for the Senate [political.rightsAndChecks].\",\n    \"anchors\": [\n      \"political.rightsAndChecks\",\n      \"political.constitutionalSubstrate\",\n      \"society.religion\",\n      \"political.powerStructure\"\n    ],\n    \"group\": \"judiciary\"\n  },\n  {\n    \"name\": \"Auditor General of Canada\",\n    \"kind\": \"independent institution\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Reporting to Parliament in May 2026, the Auditor General found that programmes are in place, funding is being delivered and risks are known, but that weaknesses in implementation and monitoring hold back results — adding that this is not a new pattern and repeats concerns raised the previous year; the specific audits cover Royal Canadian Mounted Police recruitment, the federal pay-system replacement, the student permit cap, Indigenous Services Canada's New Fiscal Relationship commitments and avian influenza preparedness.\",\n    \"fieldsCitedIn\": [\n      \"capacity.steering\"\n    ],\n    \"interests\": \"Getting implementation and monitoring weaknesses closed rather than restated — the report records the finding being repeated year on year [capacity.steering].\",\n    \"resources\": \"A statutory audit mandate across departments, direct reporting to Parliament, and quantified findings that the report treats as the authoritative account of the state's own delivery [capacity.steering].\",\n    \"constraints\": \"It audits and reports; it does not implement, and the report shows the same pattern recurring after the previous year's findings [capacity.steering].\",\n    \"likelyMoves\": \"Continue auditing the domains named; the report records one instance of learning, the phasing out of the flexible posting plan from July 2025 [capacity.steering].\",\n    \"engagementMode\": \"statutorily-independent. It reports to Parliament by mandate and its findings are not negotiated with the departments audited [capacity.steering].\",\n    \"anchors\": [\n      \"capacity.steering\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Parliamentary Budget Officer\",\n    \"kind\": \"independent institution\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Publishes independent projections that run above the government's own — a 2025-26\_deficit of 2.2% against 2.1%, deficits averaging around $64\_billion a year, debt reaching 42.5% by 2030-31 — treats the 2025-26\_United States tariff measures as permanent in its growth and fiscal projections, records that no pathway projection to the 5% defence commitment has been published and prices that commitment at $159.1\_billion by 2035-36, and documents the Trans Mountain Expansion cost escalation.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"economy.publicFinances\",\n      \"economy.externalVulnerability\",\n      \"political.shockAbsorbers\",\n      \"capacity.steering\",\n      \"capacity.delivery\",\n      \"security.military\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Maintaining an independent costed account against which the government's own numbers can be read [economy.publicFinances][security.military].\",\n    \"resources\": \"A statutory costing mandate, published projections on deficit, debt, defence and megaproject costs, and the standing to treat a policy as permanent where the government does not [economy.externalVulnerability][security.military].\",\n    \"constraints\": \"It projects and prices; the report shows its defence pathway finding standing unanswered rather than acted on [security.military][capacity.steering].\",\n    \"likelyMoves\": \"Continue publishing projections that diverge modestly upward from the government's, and to price commitments that lack a published route [economy.publicFinances][security.military].\",\n    \"engagementMode\": \"statutorily-independent. The report uses its numbers as the counterweight to the government's own, with no bargaining relationship described [economy.publicFinances].\",\n    \"anchors\": [\n      \"economy.publicFinances\",\n      \"security.military\",\n      \"capacity.delivery\",\n      \"economy.externalVulnerability\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Bank of Canada\",\n    \"kind\": \"independent institution\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Held its policy rate at 2.25% on 15\_July 2026, a sixth consecutive hold, after a cumulative 275\_basis points of cuts since early 2024; it judges the setting appropriate to sustain recovery and return inflation to its 2% target, and continues to frame Middle East oil prices feeding through supply chains as a material pressure on the outlook.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"economy.publicFinances\",\n      \"political.shockAbsorbers\"\n    ],\n    \"interests\": \"Returning inflation to the 2% target while sustaining a recovery the report describes as stalled [economy.publicFinances][economy.realEconomy].\",\n    \"resources\": \"The policy rate, preferred core measures, and the credibility of a target the report treats as the reference point [economy.publicFinances].\",\n    \"constraints\": \"Monetary room is thinner than it was — the rate has already fallen from 5.00% to 2.25%, so far less room remains to cut in a fresh downturn — and the driver of the inflation it faces is external and unresolved [political.shockAbsorbers][economy.publicFinances].\",\n    \"likelyMoves\": \"Hold while the oil-price channel remains unresolved; the report records six consecutive holds and no signalled change [economy.publicFinances].\",\n    \"engagementMode\": \"statutorily-independent. The report describes it setting rates against a target, with no political interference or capture risk recorded [economy.publicFinances][political.shockAbsorbers].\",\n    \"anchors\": [\n      \"economy.publicFinances\",\n      \"political.shockAbsorbers\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Statistics Canada\",\n    \"kind\": \"independent institution\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The national statistical office supplies the population, composition, language, productivity and digital-economy measures the report rests on, and constrains their use directly — flagging population estimates as subject to larger-than-usual upward revision and stating that the 2021\_composition data cannot measure any group's growth or decline; its May 2026\_review adds that the industries dependent on United States export demand concentrate the country's most productive jobs.\",\n    \"fieldsCitedIn\": [\n      \"society.demographics\",\n      \"society.composition\",\n      \"economy.realEconomy\",\n      \"capacity.productivity\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"The census and the national accounts, and the standing to state what its own data cannot support [society.composition][society.demographics].\",\n    \"constraints\": \"Question changes break comparability, and its own estimates carry flagged revision risk [society.composition][society.demographics].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"statutorily-independent. The report shows it limiting the inferences others may draw from its series rather than negotiating over them [society.composition].\",\n    \"anchors\": [\n      \"society.demographics\",\n      \"society.composition\",\n      \"capacity.productivity\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Canada Revenue Agency\",\n    \"kind\": \"regulatory\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Collects and administers income taxes for every province and territory except Quebec's personal and corporate income taxes and Alberta's corporate income tax, so Quebec taxpayers file separate federal and provincial returns where taxpayers elsewhere file one.\",\n    \"fieldsCitedIn\": [\n      \"political.stateStructure\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Tax collection agreements covering all provinces and territories bar the two named exceptions [political.stateStructure].\",\n    \"constraints\": \"Its coverage is set by agreement, and two jurisdictions have opted out in part [political.stateStructure].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"executive-subordinate. The report presents it as the administrative expression of federal fiscal arrangements, not as an actor with a position [political.stateStructure].\",\n    \"anchors\": [\n      \"political.stateStructure\"\n    ],\n    \"group\": \"regulators\"\n  },\n  {\n    \"name\": \"Major Projects Office (with its Indigenous Advisory Council)\",\n    \"kind\": \"regulatory\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Created by the Building Canada Act and launched on 29\_August 2025\_with an Indigenous Advisory Council, it coordinates approvals on a one-project-one-review basis with willing provinces under a stated maximum two-year timeline; fifteen projects had been referred as of 21\_May 2026\_and none has been designated, the listing process having been initiated only on 24\_June 2026\_with decisions targeted for autumn — so the two-year clock has not started running on any project, and a parallel stream handles transformative strategies, under one of which the proposed West Coast Oil Pipeline was handed to the office on 2\_July 2026.\",\n    \"fieldsCitedIn\": [\n      \"capacity.steering\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Getting the first designations made so the mechanism it exists to run can be tested [capacity.approvals].\",\n    \"resources\": \"A statutory route by which listed projects receive the Schedule 2\_approvals automatically under a single binding conditions document deemed to be a permit under every applicable statute [capacity.approvals].\",\n    \"constraints\": \"Referral carries no legal effect; designation requires consultation with provinces, territories and Indigenous rights holders, a thirty-day Gazette notice and an Order of the Governor in Council, and the Act carries a five-year sunset on new designations [capacity.approvals].\",\n    \"likelyMoves\": \"Complete consultations on Grays Bay, the Mackenzie Valley Highway and the deep geologic repository toward listing decisions targeted for autumn 2026 [capacity.approvals].\",\n    \"engagementMode\": \"executive-subordinate. It coordinates but does not decide — listing rests with the Governor in Council on the responsible Minister's recommendation [capacity.approvals].\",\n    \"anchors\": [\n      \"capacity.approvals\",\n      \"capacity.steering\"\n    ],\n    \"group\": \"regulators\"\n  },\n  {\n    \"name\": \"Global Affairs Canada\",\n    \"kind\": \"federal executive\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Has set a target of increasing exports to China by 50% by 2030, alongside the economic and trade cooperation roadmap issued under the declared strategic partnership.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Commercial diversification away from a United States market that takes roughly three-quarters of merchandise exports [security.diplomacy][economy.externalVulnerability].\",\n    \"resources\": \"Fifteen free trade agreements covering 51\_countries, and the bilateral roadmaps with China and India [economy.externalVulnerability][security.diplomacy].\",\n    \"constraints\": \"Both diversification partners are the two states the interference inquiry named as most damaging to Canadian democratic institutions, and the report treats that as the central tension [security.diplomacy][security.posture].\",\n    \"likelyMoves\": \"Pursue the China export target and the comprehensive economic partnership negotiations with India [security.diplomacy].\",\n    \"engagementMode\": \"executive-subordinate. It executes the government's diversification policy; the report attributes the political decisions to the Prime Minister and Cabinet [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"economy.externalVulnerability\"\n    ],\n    \"group\": \"pm-executive\"\n  },\n  {\n    \"name\": \"Natural Resources Canada\",\n    \"kind\": \"federal executive\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Maintains the federal Critical Minerals List of 34\_minerals and metals, first released in 2021\_and updated in 2024, and counts 171\_advanced critical-mineral projects alongside operating mines and 31\_processing facilities.\",\n    \"fieldsCitedIn\": [\n      \"territory.minerals\"\n    ],\n    \"interests\": \"Converting a broad endowment into developed capacity — the critical minerals strategy explicitly targets the missing domestic processing and refining scale [territory.minerals][capacity.productivity].\",\n    \"resources\": \"The list itself, which defines what counts as critical, and the project inventory [territory.minerals].\",\n    \"constraints\": \"Canada is among the top five global producers of 10\_of the 34\_minerals but has not built the corresponding processing capacity, and much of the endowment is undeveloped [capacity.productivity][territory.minerals].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"executive-subordinate. It classifies and counts; the report locates the decisions elsewhere [territory.minerals].\",\n    \"anchors\": [\n      \"territory.minerals\",\n      \"capacity.productivity\"\n    ],\n    \"group\": \"pm-executive\"\n  },\n  {\n    \"name\": \"Department of National Defence and the Canadian Armed Forces\",\n    \"kind\": \"military\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"An all-volunteer single unified service under the Chief of the Defence Staff — Army, Navy, Air Force and, since September 2024, Cyber Command — at 67,827\_Regular Force against an authorised 71,500, with recruitment beating target for a second year; spending crossed the 2% alliance benchmark in 2025-26\_at more than $63\_billion counted across several departments, and the force is framework nation for Multinational Brigade Latvia with roughly 2,000\_personnel there under Operation REASSURANCE, renewed to 2029. Under the National Defence Act the Minister has management and direction of the force and the Chief of the Defence Staff its control and administration under that direction.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"security.military\"\n    ],\n    \"interests\": \"Closing the personnel gap the report identifies as the binding constraint on capability, and sustaining the alliance contribution that gives a mid-sized force standing [security.military].\",\n    \"resources\": \"A budget past the 2% benchmark, a Defence Investment Agency created to accelerate procurement, $38.6\_billion over twenty years for continental surveillance modernisation, and framework-nation status in Latvia [security.military].\",\n    \"constraints\": \"3,673\_below authorised Regular Force strength and the Reserve some 5,000\_short; projection limited to brigade scale within a coalition; no overseas bases; and the larger 2035\_commitment carries no published pathway [security.military][security.posture].\",\n    \"likelyMoves\": \"Enrol against a raised 8,200\_objective for 2026-27\_and continue Operation REASSURANCE to its 2029\_renewal horizon [security.military].\",\n    \"engagementMode\": \"executive-subordinate. Civilian control is statutory and unambiguous, all orders giving effect to government decisions issuing by or through the Chief of the Defence Staff, and the report records no history of military intervention in politics [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"security.military\",\n      \"political.stabilityDrivers\",\n      \"security.posture\"\n    ],\n    \"group\": \"military\"\n  },\n  {\n    \"name\": \"Defence Investment Agency\",\n    \"kind\": \"regulatory\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Established in October 2025\_to accelerate defence procurement.\",\n    \"fieldsCitedIn\": [\n      \"security.military\"\n    ],\n    \"interests\": \"Faster procurement, against a spending trajectory the report says has no published pathway [security.military].\",\n    \"resources\": \"report-silent\",\n    \"constraints\": \"report-silent\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"executive-subordinate. Created by government to execute procurement; no independent standing is described [security.military].\",\n    \"anchors\": [\n      \"security.military\"\n    ],\n    \"group\": \"military\"\n  },\n  {\n    \"name\": \"Intelligence and security services (Communications Security Establishment; Canadian Security Intelligence Service with the Integrated Terrorism Assessment Centre; Criminal Intelligence Service Canada; Foreign Influence Transparency Commissioner)\",\n    \"kind\": \"security or intelligence service\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Canada's intelligence and security apparatus: the Communications Security Establishment (signals intelligence, in close partnership with the Canadian Armed Forces Cyber Command that since September 2024\_is the single departmental authority for cyber operations); the Canadian Security Intelligence Service (counter-interference, transnational repression and cyber-intrusion prevention, its Director setting the terrorism threat level — at Medium since October 2014 — on the advice of the Integrated Terrorism Assessment Centre); Criminal Intelligence Service Canada (national threat assessment of organised crime groups and street gangs, flagging an escalating threat to Indigenous communities and an emerging Arctic risk); and the proposed Foreign Influence Transparency Commissioner (Anton Boegman), whose office and registry are to open on 4\_August 2026, more than two years after the enabling legislation received royal assent.\",\n    \"fieldsCitedIn\": [\n      \"security.military\",\n      \"security.internal\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Countering the foreign interference the public inquiry adjudicated as Canada’s largest state-adjacent exposure, and standing up the registry the report describes as the state’s answer to that finding [security.transnationalExposure].\",\n    \"resources\": \"Statutory signals-intelligence and security-intelligence collection integrated into the military cyber domain, the terrorism-threat-level determination, a national organised-crime threat-assessment function, and — from 4\_August 2026 — an independent foreign-influence registry insulated by cross-party consultation and bicameral appointment [security.internal][security.transnationalExposure][security.military].\",\n    \"constraints\": \"The legislative instrument built to counter interference — the registry and its commissioner — was still not operating more than two years after royal assent; and the assessing bodies advise within the state, enforcement and listing decisions being taken elsewhere [security.transnationalExposure][security.posture][security.internal].\",\n    \"likelyMoves\": \"Open the foreign-influence office and registry on 4\_August 2026 [security.transnationalExposure].\",\n    \"engagementMode\": \"executive-subordinate — the services assess, collect and advise within the state, enforcement and listing decisions taken elsewhere; the Foreign Influence Transparency Commissioner is the exception, statutorily-independent with an appointment deliberately insulated by cross-party consultation and bicameral approval [security.internal][security.transnationalExposure].\",\n    \"anchors\": [\n      \"security.military\",\n      \"security.internal\",\n      \"security.transnationalExposure\",\n      \"security.posture\"\n    ],\n    \"group\": \"security-intel\"\n  },\n  {\n    \"name\": \"Royal Canadian Mounted Police\",\n    \"kind\": \"security or intelligence service\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Federal police force under the direction of the Minister of Public Safety, also serving under contract as the provincial or territorial service in every province except Ontario and Quebec, in all three territories and in many municipalities; the March 2026\_audit found it had made recruitment a top priority yet set targets below its needs and missed them — a shortfall of at least 3,400\_officers as of September 2025, vacancy rates above its own critical threshold in nine of eleven jurisdictions and target processing times missed on 97% of applications. Its doctrine holds the Commissioner accountable to the Minister but operationally independent.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"capacity.steering\",\n      \"security.internal\"\n    ],\n    \"interests\": \"Closing a staffing shortfall that runs through contract policing obligations it cannot decline [capacity.steering][security.internal].\",\n    \"resources\": \"Federal, provincial, territorial and municipal policing mandates, and appointment of the Commissioner by the Governor in Council with statutory operational independence in core law-enforcement functions [security.internal][political.stabilityDrivers].\",\n    \"constraints\": \"3,400\_officers short with cancelled training classes, and one remedy — the 2023\_flexible posting plan — that attracted applicants while worsening chronic vacancies and began being phased out in July 2025 [capacity.steering].\",\n    \"likelyMoves\": \"Continue phasing out the flexible posting plan and recruiting against revised targets [capacity.steering].\",\n    \"engagementMode\": \"executive-subordinate on management and direction, statutorily-independent in core law-enforcement functions — the report draws that line precisely, the Commissioner accountable to the Minister but free from the direction of elected officials in policing decisions [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"security.internal\",\n      \"capacity.steering\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"security-intel\"\n  },\n  {\n    \"name\": \"Canada Border Services Agency\",\n    \"kind\": \"regulatory\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Made over 2,600\_narcotics seizures in a month-long cross-country interception operation in early 2025, of which about 67.5% involved drugs entering Canada from the United States and 17.5% leaving for it, and established a dedicated trade transparency unit to detect illicit financial flows moving through international trade.\",\n    \"fieldsCitedIn\": [\n      \"security.internal\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Interdiction at ports of entry on a border managed through bilateral law enforcement cooperation rather than militarisation [security.internal].\",\n    \"resources\": \"Operational control at ports of entry, a $1.3\_billion border plan, a joint operational intelligence cell and the trade transparency unit [security.internal][security.transnationalExposure].\",\n    \"constraints\": \"The enforcement data cuts against the direction commonly assumed, with most seized narcotics entering rather than leaving — the pressure it answers is framed abroad [security.internal].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"executive-subordinate. It executes border policy set by the government [security.internal].\",\n    \"anchors\": [\n      \"security.internal\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"security-intel\"\n  },\n  {\n    \"name\": \"Public Inquiry into Foreign Interference (Justice Marie-Josée Hogue)\",\n    \"kind\": \"commission of inquiry\",\n    \"liveActorStatus\": \"recently-live\",\n    \"currentPosition\": \"Concluded in its final report of January 2025\_that the People's Republic of China was the most active perpetrator of foreign interference targeting Canadian democratic institutions and India the second most active, and that transnational repression against diaspora communities in Canada was serious enough to warrant a warning beyond the inquiry's own mandate.\",\n    \"fieldsCitedIn\": [\n      \"security.transnationalExposure\",\n      \"security.diplomacy\",\n      \"security.posture\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"A concluded public adjudication that the report treats as the authoritative naming of the two states involved, and which it uses as the benchmark against which the subsequent commercial resets are read [security.diplomacy][security.posture].\",\n    \"constraints\": \"Its mandate has ended; the transnational repression warning was issued beyond that mandate [security.transnationalExposure].\",\n    \"likelyMoves\": \"Not applicable — the inquiry has reported; what remains live is the implementation of the legislative response [security.transnationalExposure].\",\n    \"engagementMode\": \"report-silent. A concluded inquiry is not a counterpart; the report uses its findings as a standing benchmark against current diplomacy [security.diplomacy].\",\n    \"anchors\": [\n      \"security.transnationalExposure\",\n      \"security.diplomacy\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Government of Alberta (the Premier)\",\n    \"kind\": \"subnational government\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Has set a provincial referendum for 19\_October 2026\_carrying ten questions under Orders in Council, the tenth asking whether Alberta should remain a province or commence the legal process toward a binding separation vote — non-binding, with the Premier saying she supports remaining and will campaign for that; it amended its Citizen Initiative Act to remove the constitutionality requirement and the chief electoral officer's referral power after courts twice halted the citizen-petition route, is appealing the ruling as wrong in law, proposed a joint federal-provincial committee to approve superior court appointments which the legal profession opposed as constitutionally impermissible, and is party to the memorandum of understanding committing the federal government in advance to declare the proposed West Coast Oil Pipeline a project of national interest.\",\n    \"fieldsCitedIn\": [\n      \"society.composition\",\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Enlarging provincial control at the federal boundary — over the constitutional relationship, over judicial appointments within the province, and over the route to tidewater for its energy sector [political.stabilityDrivers][political.rightsAndChecks][capacity.approvals].\",\n    \"resources\": \"Order-in-Council control of the ballot without a citizen petition, entrenched provincial jurisdiction over resources under section 92A, the energy cluster the report locates in the province, and a federal commitment made in advance on the pipeline [political.stabilityDrivers][political.stateStructure][economy.politicalEconomy][capacity.approvals].\",\n    \"constraints\": \"Two rulings of the Court of King's Bench hold the Crown owed and breached a duty to consult and that secession would necessarily affect Treaties 7\_and 8; the Secession Reference bars unilateral secession; and the Clarity Act reserves the clarity determination to the House of Commons [political.constitutionalSubstrate].\",\n    \"likelyMoves\": \"Run the 19\_October 2026\_referendum and pursue the appeal [political.shockAbsorbers][political.constitutionalSubstrate].\",\n    \"engagementMode\": \"negotiable / dealable on projects — the report records it signing a memorandum of understanding with the federal government — while on the constitutional question the report describes it working around rather than with federal and judicial process [capacity.approvals][political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\",\n      \"political.rightsAndChecks\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"Government of Quebec\",\n    \"kind\": \"subnational government\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Holds the most extensive asymmetric arrangements in the federation — civil law, its own pension plan under section 94A, sole authority to select economic immigrants and resettled refugees with an explicit veto over those destined for Quebec under the 1991\_Canada-Québec Accord, and its own personal and corporate income tax administration; it legislates on language through the Charter of the French language and on secularism through the Act respecting the laicity of the State, shielded from Charter review by the notwithstanding clause and widened in April 2026\_beyond state employment into the public domain, with its constitutionality now before the Supreme Court; it received a $750\_million federal transfer for asylum costs incurred between 2021\_and 2024.\",\n    \"fieldsCitedIn\": [\n      \"society.language\",\n      \"society.religion\",\n      \"economy.politicalEconomy\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Maintaining and extending a distinct jurisdictional space — language, secularism, immigration selection, civil law and tax administration — against a demographic movement in which French grows in number and falls in share [political.stateStructure][society.language].\",\n    \"resources\": \"Constitutionally entrenched jurisdiction, the notwithstanding clause, an immigration accord no other province holds with an annual federal grant attached, separate tax administration, and Hydro-Québec as a pillar of the provincial economy [political.stateStructure][society.religion][economy.politicalEconomy].\",\n    \"constraints\": \"The laicity statute is before the Supreme Court; the population whose first official language is English has passed one million in the province; and its own asylum costs required a federal transfer [society.religion][society.language][security.transnationalExposure].\",\n    \"likelyMoves\": \"Bring the reinforcement Act's restrictions on collective religious practice in publicly controlled spaces into force from September 2026\_while the reference proceeds [society.religion].\",\n    \"engagementMode\": \"veto-holder. The report describes an explicit veto over resettled refugees destined for the province, paramountcy of provincial law under section 94A, and the notwithstanding clause used to place a statute beyond Charter review [political.stateStructure][society.religion].\",\n    \"anchors\": [\n      \"political.stateStructure\",\n      \"society.religion\",\n      \"society.language\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"Territorial governments (Yukon, Northwest Territories, Nunavut)\",\n    \"kind\": \"subnational government\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Hold jurisdiction delegated by federal statute rather than entrenched, with no inherent authority beyond what Parliament confers, are not parties to the amending formula, and would require a constitutional amendment carrying Parliament and seven provinces to gain provincial status; devolution transferred public lands and resources to Yukon in 2003\_and the Northwest Territories in 2014\_without altering that footing, and territorial governments appear among the proponents or co-proponents of four of the fifteen projects referred to the Major Projects Office.\",\n    \"fieldsCitedIn\": [\n      \"political.stateStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Closing the gap between delegated and entrenched jurisdiction, and advancing northern infrastructure projects in which they are proponents [political.stateStructure][capacity.approvals].\",\n    \"resources\": \"Powers largely equivalent to provincial ones including property and civil rights, control of public lands where devolved, Territorial Formula Financing worth $5.8\_billion, and proponent status in the approvals process [political.stateStructure][capacity.approvals].\",\n    \"constraints\": \"Their constitutions are federal statutes amendable by Parliament alone; they are outside the amending formula; and permafrost thaw destabilises infrastructure and community access across the territories [political.stateStructure][territory.climate].\",\n    \"likelyMoves\": \"Advance the referred northern projects — Grays Bay and the Mackenzie Valley Highway are among those whose listing process was initiated on 24\_June 2026 [capacity.approvals].\",\n    \"engagementMode\": \"negotiable / dealable, but from a delegated position: the report is explicit that they hold no inherent authority and cannot alter their own constitutional footing [political.stateStructure].\",\n    \"anchors\": [\n      \"political.stateStructure\",\n      \"capacity.approvals\",\n      \"territory.climate\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"First Ministers (federal, provincial and territorial)\",\n    \"kind\": \"other\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"At their meeting of 23\_July 2026, their fourteenth since March 2025, First Ministers agreed to work toward an agreement in principle by the end of 2026\_on model mutual recognition legislation — a commitment to negotiate rather than a completed instrument.\",\n    \"fieldsCitedIn\": [\n      \"capacity.productivity\"\n    ],\n    \"interests\": \"Reducing internal trade barriers the International Monetary Fund prices at the equivalent of a 9% national tariff [capacity.productivity].\",\n    \"resources\": \"A standing forum meeting frequently — fourteen times in under eighteen months — and the combined jurisdiction required for mutual recognition to work [capacity.productivity].\",\n    \"constraints\": \"It can only commit to negotiate: much of the outstanding work lies in provincial and territorial jurisdiction, labour mobility provisions are still under negotiation, and the alcohol framework due in May 2026\_was not delivered [capacity.productivity].\",\n    \"likelyMoves\": \"Work toward the agreement in principle by end-2026 [capacity.productivity].\",\n    \"engagementMode\": \"negotiable / dealable. The forum is bargaining itself; the report is precise that what emerged is a commitment to negotiate [capacity.productivity].\",\n    \"anchors\": [\n      \"capacity.productivity\",\n      \"political.stateStructure\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"Chief Electoral Officer of Alberta\",\n    \"kind\": \"independent institution\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Approved an initiative petition for a referendum on Alberta independence, an approval the Court of King's Bench set aside; the province had by then amended its Citizen Initiative Act to remove both the requirement that proposed questions be constitutional and the chief electoral officer's power to refer them to the courts.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Statutory administration of the initiative petition process [political.stabilityDrivers].\",\n    \"constraints\": \"The referral power that let it send questions to the courts has been removed by provincial statute, and its approval decision was set aside judicially [political.stabilityDrivers][political.constitutionalSubstrate].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"hijack-exposed. The report records a provincial government legislating away this officer's power to refer proposed questions to the courts in the middle of a live dispute over those questions [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Court of King's Bench of Alberta\",\n    \"kind\": \"judicial\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Found in December 2025\_that a proposed separation question contravened the Charter and historic treaties, and on 13\_May 2026\_in Athabasca Chipewyan First Nation v Alberta (Chief Electoral Officer) set aside approval of a petition on substantially the same question, holding that the Crown owed and had breached a duty to consult and that secession would necessarily affect Treaties 7\_and 8; the province is appealing.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Superior court jurisdiction to set aside the administrative approval on which the citizen-petition route depended, twice [political.constitutionalSubstrate].\",\n    \"constraints\": \"Its rulings reached the petition route only; the province placed its own question on the ballot by Order in Council, which requires no petition [political.stabilityDrivers].\",\n    \"likelyMoves\": \"The report records the appeal as pending and gives no timetable [political.constitutionalSubstrate].\",\n    \"engagementMode\": \"judicial-deference. The report treats its holding as establishing the operative doctrine that Indigenous treaty rights are a precondition to initiating a secession process, not a consideration within one [political.constitutionalSubstrate].\",\n    \"anchors\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"judiciary\"\n  },\n  {\n    \"name\": \"Indigenous rights-holders (Assembly of First Nations; Athabasca Chipewyan, Piikani, Siksika and Blood Tribe; Cree Nation)\",\n    \"kind\": \"indigenous body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The Indigenous rights-holders whose treaty and title rights the report treats as a constitutional precondition both to any provincial secession and to major-project approval, acting through both litigation and negotiation. On secession the operative doctrine is that Indigenous treaty rights are not a consideration within a separation process but a precondition to initiating one: those rights have twice halted Alberta's citizen-petition route — the Athabasca Chipewyan, Piikani, Siksika and Blood Tribe (Kainai) First Nations bringing the case in which the Court of King's Bench of Alberta set aside the referendum petition on 13\_May 2026\_on Treaties 7\_and 8 — and the Assembly of First Nations answered the referendum proposal by invoking the numbered Treaties and calling for federal review of the 1930\_Natural Resources Transfer Agreement. The Cree Nation shows the negotiated alternative: a fifty-year lineage of agreements with Canada and Quebec from the James Bay and Northern Quebec Agreement (1975) to the Cree Nation Governance Agreement (2017) and its own constitution. On approvals they have opposed the Building Canada Act sustainedly on rights and procedural grounds, and under the Tsilhqot'in framework Crown incursions on declared title land require consent or section 35\_justification.\",\n    \"fieldsCitedIn\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stabilityDrivers\",\n      \"society.composition\",\n      \"capacity.approvals\",\n      \"capacity.steering\"\n    ],\n    \"interests\": \"Establishing that provincial autonomy or secession cannot proceed over treaty rights and reopening the 1930\_transfer by which prairie provinces hold resource control; and defending those rights against an approvals regime that consolidates federal permits into a single conditions document [political.constitutionalSubstrate][society.composition][capacity.approvals].\",\n    \"resources\": \"Section 35\_recognition of existing Aboriginal and treaty rights that run to the Crown rather than the province; the numbered Treaties (6, 7\_and 8) and two successful rulings halting Alberta's petition route; the Assembly of First Nations' apex national standing; the Cree Nation's modern comprehensive treaty over roughly one million square kilometres and its own constitution; a statutory consultation duty at three points under the Building Canada Act; the doubled $10\_billion Indigenous Loan Guarantee Program; and, under the Tsilhqot'in framework, a consent requirement on declared title land [political.constitutionalSubstrate][political.stabilityDrivers][capacity.approvals][capacity.steering].\",\n    \"constraints\": \"The Alberta litigation reached the petition route only, and the province amended the enabling statute, placed its own question on the ballot by Order in Council and appealed; the Building Canada Act passed with Liberal and Conservative support, and four of the fifteen referred projects have Indigenous or territorial proponents, complicating any simple account of Indigenous opposition; Alberta's non-binding separation referendum proceeds on 19\_October 2026\_regardless [political.stabilityDrivers][capacity.approvals][political.shockAbsorbers].\",\n    \"likelyMoves\": \"Defend the 13\_May 2026\_ruling on appeal, continue pressing the treaty argument against the Alberta process as the 19\_October referendum approaches, and engage the consultations initiated on 24\_June 2026\_toward the autumn project-listing decisions [political.constitutionalSubstrate][political.stabilityDrivers][capacity.approvals].\",\n    \"engagementMode\": \"veto-holder in the statutory and constitutional sense — Indigenous treaty rights are a precondition to initiating a provincial secession process, the courts having twice halted Alberta's petition route on that ground; consultation is a precondition the Building Canada Act imposes at three points; and Crown incursions on declared title land require consent or section 35\_justification. The Cree Nation demonstrates the parallel negotiable mode, a fifty-year sequence of agreements with both orders of government [political.constitutionalSubstrate][political.stabilityDrivers][capacity.approvals].\",\n    \"anchors\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stabilityDrivers\",\n      \"society.composition\",\n      \"capacity.approvals\",\n      \"capacity.steering\",\n      \"political.shockAbsorbers\"\n    ],\n    \"group\": \"indigenous-rightsholders\"\n  },\n  {\n    \"name\": \"Federal Crown financing corporations and the Canada Strong Fund (Business Development Bank of Canada, Export Development Canada, Canada Infrastructure Bank; Canada Strong Fund)\",\n    \"kind\": \"state-owned enterprise\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The federal Crown corporations carrying significant economic weight in a mixed economy that sits toward the market-led end — the Business Development Bank of Canada, Export Development Canada and the Canada Infrastructure Bank — now joined by the Canada Strong Fund, announced 27\_April 2026\_as Canada's first federal sovereign wealth fund, seeded with $25\_billion over three years and structured as an arm's-length Crown corporation taking minority equity positions alongside private capital in energy, critical minerals, agriculture, infrastructure and advanced manufacturing; the Fund is contested — critics question whether a debt-financed fund taking equity in favoured projects is investment or industrial policy by another name.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\"\n    ],\n    \"interests\": \"Mobilising private capital into the named sectors, the Canada Strong Fund serving as the equity instrument of a productivity agenda otherwise carried by a tax deduction [economy.politicalEconomy].\",\n    \"resources\": \"Federal financing capacity across business development, export credit and infrastructure, and the Fund's $25\_billion over three years under an arm's-length minority-equity mandate across five named sectors [economy.politicalEconomy].\",\n    \"constraints\": \"The Fund is debt-financed, and the contest is over whether taking equity in favoured projects is co-investment or industrial policy by another name, and the report is explicit that whether it shifts the productivity trajectory depends on sustained delivery rather than announcement [economy.politicalEconomy].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"executive-subordinate. Federal financing vehicles named for the weight they carry; the Canada Strong Fund's arm's-length design is asserted and contested, the report preserving both the co-investment framing and the industrial-policy objection [economy.politicalEconomy].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"capacity.productivity\"\n    ],\n    \"group\": \"crown-corporations\"\n  },\n  {\n    \"name\": \"Hydro-Québec\",\n    \"kind\": \"state-owned enterprise\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The country's largest electricity producer and a pillar of Quebec's economy; it is also one of the signatories of the James Bay and Northern Quebec Agreement of 1975.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Provincial generation dominated by hydro — Quebec is among the provinces generating over 85% of electricity from it — and treaty-party standing in the James Bay instruments [territory.metabolism][political.constitutionalSubstrate].\",\n    \"constraints\": \"The east-west grid is fragmented, with inter-provincial transmission limited compared with the north-south lines connecting Canadian generation to United States markets [territory.metabolism].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"executive-subordinate to the provincial government, which the report describes it as a pillar of rather than an independent actor within [economy.politicalEconomy].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"territory.metabolism\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"group\": \"crown-corporations\"\n  },\n  {\n    \"name\": \"Class 1\_freight railways (Canadian National; Canadian Pacific Kansas City)\",\n    \"kind\": \"private-sector\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The two Class 1\_freight railways operate roughly 80% of some 43,000\_route-kilometres of track, moving grain, potash, coal and containers over transcontinental distances.\",\n    \"fieldsCitedIn\": [\n      \"territory.metabolism\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Ownership and operation of roughly 80% of the national track network, and the bulk commodity traffic that moves on it [territory.metabolism].\",\n    \"constraints\": \"The network is a single east-west spine covering thousands of kilometres, with no redundant alternative at any point on the corridor [capacity.inheritedTerrain].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable. Private operators of infrastructure the state depends on; the report describes no regulatory contest [territory.metabolism].\",\n    \"anchors\": [\n      \"territory.metabolism\",\n      \"capacity.inheritedTerrain\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Oil-and-gas sector and the Oil Sands Alliance (Canadian Natural Resources, Suncor Energy, Cenovus, Imperial Oil; Enbridge, TC Energy)\",\n    \"kind\": \"private-sector\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The oil-sands and pipeline majors clustered in Alberta — among the principal beneficiaries of the current model, operating in concentrated markets with high barriers to entry — together with the Oil Sands Alliance, which with Canada and Alberta is party to the memorandum of understanding under which the federal government committed in advance to declaring the proposed West Coast Oil Pipeline a project of national interest, handed to the Major Projects Office on 2\_July 2026\_under the Pathways Plus strategy; with the chartered banks and export manufacturers they support macroeconomic stability but press the government on trade diversification, regulatory competitiveness and the response to United States tariffs.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Pipeline-to-tidewater capacity, regulatory competitiveness and tariff relief, and national-interest designation for the West Coast Oil Pipeline and the carbon-capture strategy it sits inside; the report lists building that capacity among the reforms most analysts call technically necessary [economy.politicalEconomy][political.stabilityDrivers][capacity.approvals].\",\n    \"resources\": \"Concentrated market position, the largest single share of national emissions at 208\_megatonnes, and a tripartite memorandum of understanding carrying an advance federal commitment through a parallel approvals stream for transformative strategies rather than individual projects [economy.politicalEconomy][territory.transition][capacity.approvals].\",\n    \"constraints\": \"Environmental and some Indigenous opposition to new pipelines is named as the organised constituency each such reform runs into; alignment with the government is conditional rather than automatic; and no project has yet been designated under the Act, which the government states explicitly will not cover all referred projects [economy.politicalEconomy][political.stabilityDrivers][capacity.approvals].\",\n    \"likelyMoves\": \"Advance the West Coast Oil Pipeline through the Pathways Plus stream handed to the Major Projects Office on 2\_July 2026, pressing for the designation the memorandum anticipates [capacity.approvals].\",\n    \"engagementMode\": \"negotiable / dealable. The report shows the sector obtaining an advance federal commitment through a memorandum of understanding rather than through the designation process itself [capacity.approvals].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\",\n      \"capacity.approvals\",\n      \"territory.transition\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Chartered banks (Royal Bank of Canada, Toronto-Dominion, Bank of Nova Scotia, Bank of Montreal, Canadian Imperial Bank of Commerce)\",\n    \"kind\": \"private-sector\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Dominate a concentrated financial market and are named among the principal beneficiaries of the current model; with the energy producers and export manufacturers they support macroeconomic stability while pressing the government on trade diversification, regulatory competitiveness and the tariff response.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\"\n    ],\n    \"interests\": \"Macroeconomic stability and the regulatory conditions of a concentrated market [political.stabilityDrivers][economy.politicalEconomy].\",\n    \"resources\": \"Market dominance among a handful of firms with high barriers to entry [economy.politicalEconomy].\",\n    \"constraints\": \"High concentration in key service sectors is named by the International Monetary Fund among the structural weaknesses behind the productivity gap [capacity.productivity].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable. Alignment with government is described as conditional and expressed as pressure on policy [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Organised labour (Canadian Labour Congress, Unifor, Confédération des syndicats nationaux)\",\n    \"kind\": \"labour\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Canadian organised labour, spanning the Canadian Labour Congress (the peak federation, roughly three million workers across affiliates, concentrated in the public sector and heavy industry), Unifor (the largest private-sector union at over 315,000\_members in autos, energy, media and manufacturing, which left the Congress in 2024) and Quebec's Confédération des syndicats nationaux (a distinct bloc of around 300,000\_members).\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"economy.externalVulnerability\"\n    ],\n    \"interests\": \"Resisting labour-market flexibility measures — the report names labour resistance among the organised constituencies the necessary reforms run into; Unifor’s membership sits in autos, energy and manufacturing — precisely the sectors carrying the 50% and 25% United States duties [economy.politicalEconomy][economy.externalVulnerability].\",\n    \"resources\": \"Roughly three million workers across the Congress’s affiliates, over 315,000\_in Unifor and around 300,000\_in the Confédération des syndicats nationaux, and peak-federation standing [economy.politicalEconomy].\",\n    \"constraints\": \"Fragmented rather than unified: Unifor, the largest private-sector union, left the Congress in 2024, and the Quebec bloc organises separately [economy.politicalEconomy].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable. Described as a counterweight within the political economy rather than a veto point [economy.politicalEconomy].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"economy.externalVulnerability\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Canadian Bar Association (and its Alberta branch)\",\n    \"kind\": \"civil-society\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Opposed Alberta's proposed four-person committee requiring both federal and provincial ministerial approval before superior court appointments proceed, as incompatible with section 96\_of the Constitution Act, 1867, which vests that power in the federal government alone.\",\n    \"fieldsCitedIn\": [\n      \"political.rightsAndChecks\"\n    ],\n    \"interests\": \"Keeping superior court appointments within the federal power section 96\_assigns [political.rightsAndChecks].\",\n    \"resources\": \"Professional standing and a constitutional argument the report records as the profession's position [political.rightsAndChecks][political.stabilityDrivers].\",\n    \"constraints\": \"It objects; the proposal sits with the province, and the report records no resolution [political.rightsAndChecks].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable. A professional body making a public constitutional objection, with no formal role in the appointment process described [political.rightsAndChecks].\",\n    \"anchors\": [\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  }\n]"
actors_domestic_fr: "[\n  {\n    \"name\": \"Le premier ministre Mark Carney et le Cabinet fédéral\",\n    \"kind\": \"exécutif fédéral\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Mark Carney est premier ministre à la tête d'un gouvernement libéral qui a atteint la majorité entre deux élections grâce à cinq changements d'allégeance et à trois victoires en élections partielles; il mène un programme d'approbation de projets, de commerce intérieur et de défense que le rapport décrit comme naissant et largement inachevé, négocie sous le régime des tarifs douaniers des États-Unis, et réinitialise ses relations avec la Chine et l'Inde alors que les conclusions d'ingérence visant les deux demeurent non résolues.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"economy.publicFinances\",\n      \"economy.politicalEconomy\",\n      \"political.powerStructure\",\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.steering\",\n      \"capacity.approvals\",\n      \"capacity.delivery\",\n      \"capacity.productivity\",\n      \"security.military\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"interests\": \"Convertir des programmes annoncés en résultats concrets (les premières désignations d'intérêt national, le Fonds Canada fort, la reconnaissance mutuelle, la voie vers la défense ) tout en limitant les dommages tarifaires sans concéder les droits sectoriels [capacity.steering][situation].\",\n    \"resources\": \"Contrôle exécutif-législatif fusionné sur le programme de la Chambre, pouvoir de nomination exercé par l'intermédiaire du gouverneur en conseil, marge budgétaire fédérale (déficit à 2,1 % du PIB, trois cotes de premier rang, dette détenue à l'intérieur du pays), 108,4\_milliards de dollars en transferts et un fonds souverain de 25\_milliards de dollars [political.powerStructure][political.shockAbsorbers][economy.politicalEconomy].\",\n    \"constraints\": \"Une majorité serrée de 172\_sièges dont un est occupé par le Président, avec quatre sièges vacants; la conclusion de la vérificatrice générale selon laquelle les programmes et le financement sont en place, mais la mise en œuvre et le suivi ne le sont pas; et un partage des compétences qui laisse la santé, l'éducation, les ressources et la majeure partie des infrastructures hors du contrôle fédéral, avec une obligation de consulter qui conditionne sa propre machinerie d'approbation [political.shockAbsorbers][capacity.steering][political.stateStructure].\",\n    \"likelyMoves\": \"Achever les décisions d'inscription visées pour l'automne 2026; n'ayant annoncé aucune contre-mesure, utiliser la fenêtre de négociation avant les droits imposés à partir du 19\_août; et disputer les quatre sièges vacants sur lesquels repose la majorité [capacity.approvals][situation][political.powerStructure].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Négociations sur tous les axes à la fois : avec les provinces au moyen de protocoles d'entente et des premiers ministres, avec les titulaires de droits autochtones au moyen d'une obligation légale de consultation, et avec Washington au moyen de pourparlers intensifiés. [capacity.steering][situation].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"capacity.steering\",\n      \"capacity.approvals\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"group\": \"pm-executive\"\n  },\n  {\n    \"name\": \"Parti libéral du Canada (caucus au pouvoir)\",\n    \"kind\": \"parti au pouvoir\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Le parti au pouvoir détient 172\_des 343\_sièges après cinq changements d'allégeance et trois victoires en élections partielles, soit le nombre exact que requiert une majorité de la Chambre au complet, et le rapport situe la contrainte déterminante dans la discipline interne d'un caucus élargi et idéologiquement large plutôt que dans la négociation interpartis.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Maintenir la cohésion du caucus à un nombre de sièges sans marge, et défendre la légitimité d'une majorité constituée entre deux élections [political.powerStructure][political.shockAbsorbers].\",\n    \"resources\": \"Gouvernement d'un seul parti sans partenaires de coalition, contrôle du programme de la Chambre, et un caucus élargi comprenant cinq récents changements d'allégeance [political.stabilityDrivers].\",\n    \"constraints\": \"Chaque défection, démission ou défaite en élection partielle fait basculer le gouvernement vers la voix prépondérante du Président; le caucus est décrit comme idéologiquement large, ce qui est le même fait interprété comme un problème de discipline [political.powerStructure][political.stabilityDrivers].\",\n    \"likelyMoves\": \"Disputer les quatre sièges vacants pour rétablir une marge; le rapport désigne les élections partielles comme le pivot [political.powerStructure].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. En tant que caucus au pouvoir, il constitue la propre surface de négociation du gouvernement; le rapport indique que la contrainte s'est déplacée de la négociation entre les partis vers celle au sein d'un seul [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Parti conservateur du Canada (Opposition officielle)\",\n    \"kind\": \"parti d'opposition\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Avec 139\_sièges, l'Opposition officielle juge illégitime la voie par laquelle le gouvernement a franchi le seuil de la majorité, faisant valoir qu'il ne détient aucun mandat démocratique, tout en ayant appuyé la Loi sur une économie canadienne unie en troisième lecture; il est aussi le seul parti fédéral doté d'un groupe désigné au Sénat.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Nier au gouvernement la légitimité de sa majorité tout en restant aligné avec lui sur la réalisation des grands projets [political.shockAbsorbers][capacity.approvals].\",\n    \"resources\": \"139\_sièges, le plus grand bloc d'opposition, douze sièges au Sénat, et, sur la question de l'immigration, le tri partisan le plus marqué que le rapport recense [political.powerStructure][society.cohesion].\",\n    \"constraints\": \"Ne peut pas défaire un gouvernement qui détient le seuil de la majorité serrée, et son propre appui a fait adopter la loi phare qu'il pourrait autrement contester [political.powerStructure][capacity.approvals].\",\n    \"likelyMoves\": \"Disputer les sièges vacants et continuer de marteler l'argument du mandat; le rapport considère les résultats des élections partielles comme la variable opérante [political.powerStructure].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Le rapport le recense votant avec le gouvernement sur la Loi visant à bâtir le Canada tout en niant sa légitimité; homologue sur le plan législatif et adversaire sur le plan du statut [capacity.approvals][political.shockAbsorbers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Bloc Québécois\",\n    \"kind\": \"parti d'opposition\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Détient 21\_sièges et a inscrit son opposition à la Loi sur une économie canadienne unie en troisième lecture le 20\_juin 2025.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Contester la loi fédérale d'approbation qui empiète sur des domaines que le rapport décrit ailleurs comme relevant de la compétence provinciale [capacity.approvals][political.stateStructure].\",\n    \"resources\": \"21\_sièges, le troisième bloc en importance à la Chambre [political.powerStructure].\",\n    \"constraints\": \"Son opposition à la loi a été consignée, mais n'a pas été décisive, le projet de loi ayant été adopté avec l'appui libéral et conservateur [capacity.approvals].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Le rapport le présente comme un vote consigné contre, sans qu'aucune relation de négociation ne soit décrite [capacity.approvals].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Nouveau Parti démocratique\",\n    \"kind\": \"parti d'opposition\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Réduit à 5\_sièges, l'un de ses membres ayant changé d'allégeance pour rejoindre le gouvernement, et a inscrit son opposition à la Loi sur une économie canadienne unie en troisième lecture.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"S'opposer au régime d'approbation pour les motifs relatifs aux droits et à la procédure que le rapport attribue à l'opposition consignée [capacity.approvals].\",\n    \"resources\": \"5\_sièges [political.powerStructure].\",\n    \"constraints\": \"En deçà de la taille des blocs de tous les autres partis nommés et ayant perdu un membre au profit des banquettes gouvernementales [political.powerStructure].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Aucun levier de négociation n'est décrit; le gouvernement n'a plus besoin de sa confiance [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Parlement du Canada (Chambre des communes et Sénat)\",\n    \"kind\": \"législature\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"La législature bicamérale détient les pouvoirs énumérés de l'article 91\_ainsi que le pouvoir résiduel, elle est l'organe auquel la vérificatrice générale fait rapport et le seul à pouvoir modifier les constitutions territoriales; elle a réservé à la Chambre des communes la détermination d'une question claire et d'une majorité claire en vertu de la Loi sur la clarté référendaire, a adopté la Loi sur une économie canadienne unie en troisième lecture le 20\_juin 2025, et les deux chambres doivent approuver le commissaire à la transparence en matière d'influence étrangère, tout en affichant le pire indice de confiance institutionnelle que le rapport mesure, 28,3 % de confiance élevée et 40,0 % de faible confiance.\",\n    \"fieldsCitedIn\": [\n      \"society.cohesion\",\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.steering\",\n      \"capacity.approvals\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Le rapport lui attribue des intérêts institutionnels plutôt que stratégiques : exercer les fonctions législatives et de contrôle que les textes constitutionnels lui attribuent [political.stateStructure][capacity.steering].\",\n    \"resources\": \"Pouvoir législatif énuméré et résiduel, la détermination légale de la clarté référendaire, la modification exclusive des constitutions territoriales, et un rôle de confirmation à l'égard du commissaire à l'influence étrangère [political.stateStructure][political.constitutionalSubstrate][security.transnationalExposure].\",\n    \"constraints\": \"Le contrôle exécutif et législatif est fusionné, de sorte qu'un gouvernement jouissant de la confiance de la Chambre contrôle son programme; et la confiance du public envers l'institution est la plus faible de toutes celles mesurées [political.powerStructure][society.cohesion].\",\n    \"likelyMoves\": \"Traiter les élections partielles dans quatre sièges vacants et la confirmation du commissaire dont le bureau ouvre le 4\_août 2026 [political.powerStructure][security.transnationalExposure].\",\n    \"engagementMode\": \"Indépendance de par la loi. Ses pouvoirs découlent des textes constitutionnels plutôt que de la négociation, bien que la fusion de l'exécutif et de la législature signifie que le gouvernement du jour dirige son programme [political.powerStructure][political.stateStructure].\",\n    \"anchors\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.approvals\",\n      \"society.cohesion\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Sénat du Canada\",\n    \"kind\": \"législature\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"La chambre nommée de 105\_sièges se compose de 40\_membres du Groupe des sénateurs indépendants, 18\_du Groupe des sénateurs canadiens, 17\_du Groupe progressiste du Sénat, 12\_du Parti conservateur du Canada, 5\_du Bureau du représentant du gouvernement et 4\_non affiliés, avec 9\_sièges vacants; le 7\_juillet 2026, le premier ministre a abandonné le critère non partisan qui régissait les nominations depuis 2016\_et a remanié le comité consultatif indépendant, en annonçant en même temps ses quatre premières nominations.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Rôle d'approbation à parts égales à l'égard du commissaire à la transparence en matière d'influence étrangère, et une composition dans laquelle un seul groupe de douze est lié à un parti fédéral [security.transnationalExposure][political.powerStructure].\",\n    \"constraints\": \"Chaque siège est pourvu par nomination sur recommandation du premier ministre, et le critère qui isolait ce processus vient d'être retiré; neuf sièges sont vacants, dont cinq au Québec [political.powerStructure].\",\n    \"likelyMoves\": \"Recevoir d'autres nominations dans le cadre du processus révisé [political.powerStructure].\",\n    \"engagementMode\": \"Exposition au détournement. Le rapport décrit le retrait du critère de nomination non partisan et le remaniement du comité consultatif comme un changement de caractère de la chambre, et note que le même critère a parallèlement été maintenu pour les nominations à la Cour suprême [political.powerStructure][political.rightsAndChecks].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.rightsAndChecks\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"Président de la Chambre des communes\",\n    \"kind\": \"législature\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"L'un des 172\_membres du gouvernement est le Président de la Chambre, qui par convention ne vote que pour départager les égalités, laissant un bloc gouvernemental opérant de 171\_contre 167; de sorte que de nouvelles pertes feraient reposer la capacité du gouvernement de légiférer sur la voix prépondérante du Président.\",\n    \"fieldsCitedIn\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Voix prépondérante qui devient décisive au nombre de sièges que le rapport décrit [political.shockAbsorbers].\",\n    \"constraints\": \"Lié par une convention qui restreint le vote au départage des égalités [political.powerStructure].\",\n    \"likelyMoves\": \"Le rapport présente le vote du Président comme une éventualité en cas de nouvelles défections, vacances ou défaites en élections partielles plutôt que comme une action entreprise [political.shockAbsorbers].\",\n    \"engagementMode\": \"Indépendance de par la loi. La charge fonctionne par convention plutôt que par négociation, et le rapport traite la voix prépondérante comme une règle, non comme une position négociable [political.powerStructure].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.shockAbsorbers\"\n    ],\n    \"group\": \"parliament-parties\"\n  },\n  {\n    \"name\": \"La Couronne (gouverneur général; gouverneur en conseil)\",\n    \"kind\": \"exécutif fédéral\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"L'autorité exécutive formelle appartient à la Couronne, représentée par le gouverneur général et exercée en pratique par le premier ministre et le Cabinet par l'intermédiaire du Conseil privé; le gouverneur en conseil nomme les juges de la Cour suprême, le chef d'état-major de la défense et le commissaire de la Gendarmerie royale du Canada et inscrit les projets d'intérêt national par décret. La Couronne est la partie qui a l'obligation de consulter; la relation constitutionnelle des nations autochtones se rattachant à elle plutôt qu'aux provinces.\",\n    \"fieldsCitedIn\": [\n      \"society.composition\",\n      \"political.powerStructure\",\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\",\n      \"capacity.steering\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Pouvoirs formels de nomination et d'inscription exercés sur recommandation ministérielle, et statut de contrepartie constitutionnelle des titulaires de droits issus de traités et de titre ancestral [political.rightsAndChecks][capacity.approvals][society.composition].\",\n    \"constraints\": \"Chaque pouvoir est exercé sur avis, de sorte que la Couronne agit comme le canal formel des décisions du Cabinet; sa propre obligation de consulter a été exécutée à deux reprises contre une initiative provinciale [political.powerStructure][political.constitutionalSubstrate].\",\n    \"likelyMoves\": \"Prendre les décrets d'inscription que le gouvernement a visés pour l'automne 2026 [capacity.approvals].\",\n    \"engagementMode\": \"Pouvoir de veto dans un sens précis : le cadre établi par l'arrêt Tsilhqot'in exige le consentement, ou la justification prévue à l'article 35, pour toute atteinte de la Couronne aux terres visées par un titre; la Couronne est donc l'instance à laquelle le consentement est demandé, et la partie dont le manquement à l'obligation de consulter invalide le processus provincial [political.constitutionalSubstrate][political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.powerStructure\",\n      \"political.constitutionalSubstrate\",\n      \"society.composition\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"pm-executive\"\n  },\n  {\n    \"name\": \"Cour suprême du Canada (et son comité consultatif indépendant sur les nominations judiciaires)\",\n    \"kind\": \"judiciaire\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"La juridiction d'appel de dernière instance, neuf juges nommés par le gouverneur en conseil à partir d'une liste restreinte préparée par un comité consultatif indépendant non partisan (qui évalue les candidats selon des critères publiés dont le bilinguisme fonctionnel et la représentation régionale, dresse une liste de trois à cinq noms et publie un rapport sur chaque processus) utilisé intégralement cette année pour nommer le juge Glenn Joyal le 3