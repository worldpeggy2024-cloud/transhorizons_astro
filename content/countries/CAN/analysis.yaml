N en Lettonie avec environ 2 000\_militaires sur place dans le cadre de l'opération REASSURANCE, reconduite jusqu'en 2029. En vertu de la Loi sur la défense nationale, le ministre assume la gestion et la direction de la force et le chef d'état-major de la défense assume le contrôle et l'administration sous cette direction.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"security.military\"\n    ],\n    \"interests\": \"Combler l'écart d'effectifs que le rapport désigne comme la contrainte déterminante sur la capacité, et soutenir la contribution à l'Alliance qui confère à une force de taille moyenne un certain statut [security.military].\",\n    \"resources\": \"Budget dépassant le seuil de 2 %, Agence des investissements en défense créée pour accélérer l'approvisionnement, 38,6\_milliards de dollars sur vingt ans pour la modernisation de la surveillance continentale, et statut de nation-cadre en Lettonie [security.military].\",\n    \"constraints\": \"3 673\_en deçà de l'effectif autorisé de la Force régulière et manque de quelque 5 000\_membres à la Réserve; projection limitée à l'échelle d'une brigade au sein d'une coalition; aucune base à l'étranger; et l'engagement plus important de 2035\_ne comporte aucun plan publié [security.military][security.posture].\",\n    \"likelyMoves\": \"Recruter en fonction d'un objectif rehaussé de 8 200\_pour 2026-2027\_et poursuivre l'opération REASSURANCE jusqu'à son horizon de reconduction de 2029 [security.military].\",\n    \"engagementMode\": \"Subordination à l'exécutif. Le contrôle civil est légal et sans ambiguïté, tous les ordres donnant effet aux décisions du gouvernement étant émis par le chef d'état-major de la défense ou par son intermédiaire, et le rapport ne recense aucun antécédent d'intervention militaire en politique [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"security.military\",\n      \"political.stabilityDrivers\",\n      \"security.posture\"\n    ],\n    \"group\": \"military\"\n  },\n  {\n    \"name\": \"Agence des investissements en défense\",\n    \"kind\": \"organisme de réglementation\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Établie en octobre 2025\_pour accélérer l'approvisionnement en matière de défense.\",\n    \"fieldsCitedIn\": [\n      \"security.military\"\n    ],\n    \"interests\": \"Approvisionnement plus rapide, face à une trajectoire de dépenses que le rapport dit dépourvue de plan publié [security.military].\",\n    \"resources\": \"Sans mention dans le rapport\",\n    \"constraints\": \"Sans mention dans le rapport\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Subordination à l'exécutif. Créée par le gouvernement pour exécuter l'approvisionnement; aucune autonomie indépendante n'est décrite [security.military].\",\n    \"anchors\": [\n      \"security.military\"\n    ],\n    \"group\": \"military\"\n  },\n  {\n    \"name\": \"Services de renseignement et de sécurité (Centre de la sécurité des télécommunications; Service canadien du renseignement de sécurité, avec le Centre intégré d’évaluation du terrorisme; Service canadien de renseignements criminels; commissaire à la transparence en matière d’influence étrangère)\",\n    \"kind\": \"service de sécurité ou de renseignement\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"L'appareil canadien de renseignement et de sécurité : le Centre de la sécurité des télécommunications (renseignement électromagnétique, en partenariat étroit avec le commandement des cyberopérations des Forces armées canadiennes, depuis septembre 2024\_l'autorité ministérielle unique pour les opérations cybernétiques); le Service canadien du renseignement de sécurité (contre-ingérence, répression transnationale et prévention des intrusions cybernétiques, son directeur fixant le niveau de menace terroriste — à « moyen » depuis octobre 2014 — sur l'avis du Centre intégré d'évaluation du terrorisme); le Service canadien de renseignements criminels (évaluation nationale de la menace des groupes du crime organisé et des gangs de rue, signalant une menace croissante pour les communautés autochtones et un risque arctique émergent); et le commissaire à la transparence en matière d'influence étrangère proposé (Anton Boegman), dont le bureau et le registre doivent ouvrir le 4\_août 2026, plus de deux ans après la sanction royale de la loi habilitante.\",\n    \"fieldsCitedIn\": [\n      \"security.military\",\n      \"security.internal\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Contrer l'ingérence étrangère que l'enquête publique a jugée la plus grande exposition para-étatique du Canada, et mettre sur pied le registre que le rapport décrit comme la réponse de l'État à ce constat [security.transnationalExposure].\",\n    \"resources\": \"Collecte statutaire de renseignement électromagnétique et de sécurité intégrée au domaine cybernétique militaire, détermination du niveau de menace terroriste, fonction nationale d'évaluation de la menace du crime organisé, et (à compter du 4\_août 2026) registre indépendant de l'influence étrangère protégé par une consultation multipartite et une nomination approuvée par les deux chambres [security.internal][security.transnationalExposure][security.military].\",\n    \"constraints\": \"Instrument législatif conçu pour contrer l'ingérence (registre et commissaire) n'était toujours pas opérationnel plus de deux ans après la sanction royale; les organismes d'évaluation conseillent au sein de l'État, les décisions d'application et d'inscription étant prises ailleurs [security.transnationalExposure][security.posture][security.internal].\",\n    \"likelyMoves\": \"Ouvrir le bureau et le registre de l'influence étrangère le 4\_août 2026 [security.transnationalExposure].\",\n    \"engagementMode\": \"Subordination à l'exécutif; les services évaluent, collectent et conseillent au sein de l’État, les décisions d’application et d’inscription étant prises ailleurs; le commissaire à la transparence en matière d’influence étrangère fait exception, indépendant de par la loi, sa nomination étant délibérément protégée par une consultation multipartite et l’approbation des deux chambres [security.internal][security.transnationalExposure].\",\n    \"anchors\": [\n      \"security.military\",\n      \"security.internal\",\n      \"security.transnationalExposure\",\n      \"security.posture\"\n    ],\n    \"group\": \"security-intel\"\n  },\n  {\n    \"name\": \"Gendarmerie royale du Canada\",\n    \"kind\": \"service de sécurité ou de renseignement\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Corps de police fédéral sous la direction du ministre de la Sécurité publique, servant aussi par contrat comme service provincial ou territorial dans les provinces (sauf l'Ontario et le Québec), dans les trois territoires et dans de nombreuses municipalités; la vérification de mars 2026\_a constaté qu'elle avait fait du recrutement une priorité absolue tout en fixant des cibles inférieures à ses besoins et en ne les atteignant pas; déficit d'au moins 3 400\_agents en date de septembre 2025, des taux de vacance supérieurs à son propre seuil critique dans neuf des onze administrations et des délais de traitement cibles manqués pour 97 % des demandes. Son principe directeur veut que le commissaire soit responsable devant le ministre, mais indépendant sur le plan opérationnel.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"capacity.steering\",\n      \"security.internal\"\n    ],\n    \"interests\": \"Combler un déficit d'effectifs qui touche des obligations de police contractuelle auxquelles elle ne peut se soustraire [capacity.steering][security.internal].\",\n    \"resources\": \"Mandats de police fédéraux, provinciaux, territoriaux et municipaux, et nomination du commissaire par le gouverneur en conseil assortie d'une indépendance opérationnelle légale dans les fonctions essentielles d'application de la loi [security.internal][political.stabilityDrivers].\",\n    \"constraints\": \"Manque de 3 400\_agents, avec des classes de formation annulées, et un remède (plan d'affectation flexible de 2023) qui a attiré des candidats tout en aggravant les vacances chroniques et a commencé à être éliminé progressivement en juillet 2025 [capacity.steering].\",\n    \"likelyMoves\": \"Poursuivre l'élimination progressive du plan d'affectation flexible et le recrutement en fonction de cibles révisées [capacity.steering].\",\n    \"engagementMode\": \"Subordination à l'exécutif sur la gestion et la direction, indépendant de par la loi dans les fonctions essentielles d'application de la loi; le rapport trace cette ligne avec précision, le commissaire étant responsable devant le ministre, mais soustrait à la direction des élus dans les décisions policières [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"security.internal\",\n      \"capacity.steering\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"security-intel\"\n  },\n  {\n    \"name\": \"Agence des services frontaliers du Canada\",\n    \"kind\": \"organisme de réglementation\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"A effectué plus de 2 600\_saisies de stupéfiants lors d'une opération d'interception pancanadienne d'un mois au début de 2025, dont environ 67,5 % concernaient des drogues entrant au Canada en provenance des États-Unis et 17,5 % en partance vers ceux-ci, et a établi une unité spécialisée de transparence commerciale pour détecter les flux financiers illicites transitant par le commerce international.\",\n    \"fieldsCitedIn\": [\n      \"security.internal\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Interception aux points d'entrée d'une frontière gérée par la coopération bilatérale en matière d'application de la loi plutôt que par la militarisation [security.internal].\",\n    \"resources\": \"Contrôle opérationnel aux points d'entrée, plan frontalier de 1,3\_milliard de dollars, cellule conjointe de renseignement opérationnel et unité de transparence commerciale [security.internal][security.transnationalExposure].\",\n    \"constraints\": \"Les données d'application vont à l'encontre de la direction communément supposée; la plupart des stupéfiants saisis entrant plutôt que sortant. Pression à laquelle elle répond est présentée comme venant de l'étranger [security.internal].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Subordination à l'exécutif. Exécute la politique frontalière établie par le gouvernement [security.internal].\",\n    \"anchors\": [\n      \"security.internal\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"security-intel\"\n  },\n  {\n    \"name\": \"Enquête publique sur l'ingérence étrangère (juge Marie-Josée Hogue)\",\n    \"kind\": \"commission d'enquête\",\n    \"liveActorStatus\": \"récemment en vigueur\",\n    \"currentPosition\": \"A conclu dans son rapport final de janvier 2025\_que la République populaire de Chine était l'auteur le plus actif d'ingérence étrangère visant les institutions démocratiques canadiennes et l'Inde le deuxième plus actif, et que la répression transnationale contre les communautés diasporiques au Canada était assez grave pour justifier un avertissement au-delà du mandat même de l'enquête.\",\n    \"fieldsCitedIn\": [\n      \"security.transnationalExposure\",\n      \"security.diplomacy\",\n      \"security.posture\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Adjudication publique conclue que le rapport considère comme la désignation faisant autorité des deux États en cause, et utilisée comme référence par rapport à laquelle les réinitialisations commerciales ultérieures sont lues [security.diplomacy][security.posture].\",\n    \"constraints\": \"Son mandat a pris fin; l'avertissement sur la répression transnationale a été émis au-delà de ce mandat [security.transnationalExposure].\",\n    \"likelyMoves\": \"Sans objet; l'enquête a fait rapport; ce qui demeure d'actualité est la mise en œuvre de la réponse législative [security.transnationalExposure].\",\n    \"engagementMode\": \"Sans mention dans le rapport. Une enquête conclue n'est pas un interlocuteur; le rapport utilise ses conclusions comme d'un point de repère permanent au regard de la diplomatie actuelle [security.diplomacy].\",\n    \"anchors\": [\n      \"security.transnationalExposure\",\n      \"security.diplomacy\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Gouvernement de l'Alberta (première ministre)\",\n    \"kind\": \"gouvernement infranational\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"A fixé un référendum provincial au 19\_octobre 2026\_comportant dix questions au titre de décrets, la dixième demandant si l'Alberta devrait demeurer une province ou entamer le processus juridique menant à un vote de séparation contraignant; non contraignant, la première ministre disant appuyer le maintien et vouloir faire campagne en ce sens; elle a modifié la loi Citizen Initiative Act pour supprimer l'exigence de constitutionnalité et le pouvoir de renvoi du directeur général des élections après que les tribunaux ont bloqué à deux reprises la voie de la pétition citoyenne, porte le jugement en appel comme erroné en droit, a proposé un comité mixte fédéral-provincial pour approuver les nominations aux cours supérieures, auquel la profession juridique s'est opposée comme constitutionnellement inadmissible, et est partie au protocole d'entente engageant à l'avance le gouvernement fédéral à déclarer le projet de pipeline pétrolier de la côte Ouest comme étant un projet d'intérêt national.\",\n    \"fieldsCitedIn\": [\n      \"society.composition\",\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\",\n      \"political.shockAbsorbers\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Élargir le contrôle provincial à la frontière fédérale : sur la relation constitutionnelle, sur les nominations judiciaires dans la province, et sur l'accès aux eaux littorales pour son secteur énergétique [political.stabilityDrivers][political.rightsAndChecks][capacity.approvals].\",\n    \"resources\": \"Contrôle par décret du scrutin sans pétition citoyenne, compétence provinciale enchâssée sur les ressources en vertu de l'article 92A, grappe énergétique que le rapport situe dans la province, et engagement fédéral pris à l'avance sur le pipeline [political.stabilityDrivers][political.stateStructure][economy.politicalEconomy][capacity.approvals].\",\n    \"constraints\": \"Deux jugements de la Cour du Banc du Roi tiennent que la Couronne n'a pas respecté son obligation de consultation et que la sécession affecterait nécessairement les traités 7\_et 8; le Renvoi relatif à la sécession interdit la sécession unilatérale; et la Loi sur la clarté référendaire réserve la détermination de la clarté à la Chambre des communes [political.constitutionalSubstrate].\",\n    \"likelyMoves\": \"Tenir le référendum du 19\_octobre 2026\_et poursuivre l'appel [political.shockAbsorbers][political.constitutionalSubstrate].\",\n    \"engagementMode\": \"Négociation sur les projets (le rapport la recense signant un protocole d'entente avec le gouvernement fédéral) tandis que sur la question constitutionnelle le rapport la décrit contournant le processus fédéral et judiciaire plutôt que collaborant avec lui [capacity.approvals][political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\",\n      \"political.rightsAndChecks\",\n      \"capacity.approvals\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"Gouvernement du Québec\",\n    \"kind\": \"gouvernement infranational\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Détient les arrangements asymétriques les plus étendus de la fédération : droit civil, propre régime de rentes en vertu de l'article 94A, autorité exclusive de sélectionner les immigrants économiques et les réfugiés réinstallés avec un veto explicite sur ceux destinés au Québec en vertu de l'Accord Canada-Québec de 1991, et propre administration de l'impôt sur le revenu des particuliers et des sociétés; légifère sur la langue au moyen de la Charte de la langue française et sur la laïcité au moyen de la Loi sur la laïcité de l'État, soustraite au contrôle fondé sur la Charte par la clause dérogatoire et élargie en avril 2026\_au-delà de l'emploi étatique jusqu'au domaine public, sa constitutionnalité étant maintenant devant la Cour suprême; a reçu un transfert fédéral de 750\_millions de dollars pour les coûts d'asile engagés entre 2021\_et 2024.\",\n    \"fieldsCitedIn\": [\n      \"society.language\",\n      \"society.religion\",\n      \"economy.politicalEconomy\",\n      \"political.constitutionalSubstrate\",\n      \"political.stateStructure\",\n      \"security.transnationalExposure\"\n    ],\n    \"interests\": \"Maintenir et étendre un espace juridictionnel distinct (langue, laïcité, sélection de l'immigration, droit civil et administration fiscale) face à un mouvement démographique dans lequel le français croît en nombre et décline en proportion [political.stateStructure][society.language].\",\n    \"resources\": \"Compétence constitutionnellement enchâssée, clause dérogatoire, accord d'immigration qu'aucune autre province ne détient assorti d'une subvention fédérale annuelle, administration fiscale distincte, et Hydro-Québec comme pilier de l'économie provinciale [political.stateStructure][society.religion][economy.politicalEconomy].\",\n    \"constraints\": \"Loi sur la laïcité devant la Cour suprême; la population dont la première langue officielle est l'anglais a dépassé le million dans la province; et ses propres coûts d'asile ont nécessité un transfert fédéral [society.religion][society.language][security.transnationalExposure].\",\n    \"likelyMoves\": \"Mettre en vigueur, à compter de septembre 2026, les restrictions de la loi de renforcement sur la pratique religieuse collective dans les espaces sous contrôle public pendant que le renvoi suit son cours [society.religion].\",\n    \"engagementMode\": \"Pouvoir de veto. Le rapport décrit un veto explicite sur les réfugiés réinstallés destinés à la province, la primauté du droit provincial en vertu de l'article 94A, et la clause dérogatoire utilisée pour placer une loi hors de portée du contrôle fondé sur la Charte [political.stateStructure][society.religion].\",\n    \"anchors\": [\n      \"political.stateStructure\",\n      \"society.religion\",\n      \"society.language\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"Gouvernements territoriaux (Yukon, Territoires du Nord-Ouest, Nunavut)\",\n    \"kind\": \"gouvernement infranational\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Détiennent une compétence déléguée par loi fédérale plutôt qu'enchâssée, sans autorité inhérente au-delà de ce que le Parlement leur confère, ne sont pas parties à la formule de modification, et nécessiteraient une modification constitutionnelle réunissant le Parlement et sept provinces pour accéder au statut de province; la dévolution a transféré les terres et ressources publiques au Yukon en 2003\_et aux Territoires du Nord-Ouest en 2014\_sans modifier cette assise, et les gouvernements territoriaux figurent parmi les promoteurs ou copromoteurs de quatre des quinze projets renvoyés au Bureau des grands projets.\",\n    \"fieldsCitedIn\": [\n      \"political.stateStructure\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Combler l'écart entre la compétence déléguée et enchâssée, et faire avancer les projets d'infrastructure nordiques dont ils sont promoteurs [political.stateStructure][capacity.approvals].\",\n    \"resources\": \"Pouvoirs largement équivalents à ceux des provinces, y compris la propriété et les droits civils, le contrôle des terres publiques là où elles ont été dévolues, la Formule de financement des territoires d'une valeur de 5,8\_milliards de dollars, et le statut de promoteur dans le processus d'approbation [political.stateStructure][capacity.approvals].\",\n    \"constraints\": \"Leurs constitutions sont des lois fédérales modifiables par le Parlement seul; sont hors de la formule de modification; le dégel du pergélisol déstabilise les infrastructures et l'accès aux communautés dans l'ensemble des territoires [political.stateStructure][territory.climate].\",\n    \"likelyMoves\": \"Faire avancer les projets nordiques renvoyés; Grays Bay et la route de la vallée du Mackenzie comptent parmi ceux dont le processus d'inscription a été amorcé le 24\_juin 2026 [capacity.approvals].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes, mais depuis une position déléguée : le rapport est explicite sur le fait qu'ils ne détiennent aucune autorité inhérente et ne peuvent modifier leur propre assise constitutionnelle [political.stateStructure].\",\n    \"anchors\": [\n      \"political.stateStructure\",\n      \"capacity.approvals\",\n      \"territory.climate\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"Premiers ministres (fédéral, provinciaux et territoriaux)\",\n    \"kind\": \"autre\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Lors de leur réunion du 23\_juillet 2026, la quatorzième depuis mars 2025, les premiers ministres ont convenu de travailler à une entente de principe d'ici la fin de 2026\_sur une loi modèle de reconnaissance mutuelle; engagement à négocier plutôt qu'un instrument achevé.\",\n    \"fieldsCitedIn\": [\n      \"capacity.productivity\"\n    ],\n    \"interests\": \"Réduire les barrières au commerce intérieur que le Fonds monétaire international chiffre à l'équivalent d'un droit de douane national de 9 % [capacity.productivity].\",\n    \"resources\": \"Forum permanent se réunissant fréquemment (quatorze fois en moins de dix-huit mois) et compétence combinée requise pour que la reconnaissance mutuelle fonctionne [capacity.productivity].\",\n    \"constraints\": \"Ne peut que s'engager à négocier : une grande partie du travail restant relève de la compétence provinciale et territoriale, les dispositions sur la mobilité de la main-d'œuvre sont encore en négociation, et le cadre sur l'alcool attendu en mai 2026\_n'a pas été livré [capacity.productivity].\",\n    \"likelyMoves\": \"Travailler à l'entente de principe d'ici la fin de 2026 [capacity.productivity].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Le forum est lui-même une négociation; le rapport précise que ce qui en est ressorti est un engagement à négocier [capacity.productivity].\",\n    \"anchors\": [\n      \"capacity.productivity\",\n      \"political.stateStructure\"\n    ],\n    \"group\": \"provinces-territories\"\n  },\n  {\n    \"name\": \"Directeur général des élections de l'Alberta\",\n    \"kind\": \"institution indépendante\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"A approuvé une pétition d'initiative en vue d'un référendum sur l'indépendance de l'Alberta, une approbation que la Cour du Banc du Roi a annulée; la province avait entre-temps modifié sa loi Citizen Initiative Act pour supprimer à la fois l'exigence que les questions proposées soient constitutionnelles et le pouvoir du directeur général des élections de les renvoyer aux tribunaux.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Administration légale du processus de pétition d'initiative [political.stabilityDrivers].\",\n    \"constraints\": \"Le pouvoir de renvoi qui lui permettait d'envoyer des questions aux tribunaux a été supprimé par une loi provinciale, et sa décision d'approbation a été annulée judiciairement [political.stabilityDrivers][political.constitutionalSubstrate].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Exposition au détournement. Le rapport recense un gouvernement provincial abolissant par voie législative le pouvoir de ce fonctionnaire de renvoyer les questions proposées aux tribunaux au milieu d'un litige en cours sur ces questions [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"group\": \"independent-institutions\"\n  },\n  {\n    \"name\": \"Cour du Banc du Roi de l'Alberta\",\n    \"kind\": \"judiciaire\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"A conclu en décembre 2025\_qu'une question de séparation proposée contrevenait à la Charte et aux traités historiques, et le 13\_mai 2026, dans l'affaire Athabasca Chipewyan First Nation c. Alberta (Chief Electoral Officer), a annulé l'approbation d'une pétition portant sur essentiellement la même question, jugeant que la Couronne avait une obligation de consulter et ne l'avait pas respecter et que la sécession affecterait nécessairement les traités 7\_et 8; la province porte le jugement en appel.\",\n    \"fieldsCitedIn\": [\n      \"political.stabilityDrivers\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Compétence de cour supérieure d'annuler l'approbation administrative dont dépendait la voie de la pétition citoyenne, à deux reprises [political.constitutionalSubstrate].\",\n    \"constraints\": \"Ses jugements n'ont touché que la voie de la pétition; la province a inscrit sa propre question au scrutin par décret, qui ne requiert aucune pétition [political.stabilityDrivers].\",\n    \"likelyMoves\": \"Le rapport recense l'appel comme pendant et ne donne aucun calendrier [political.constitutionalSubstrate].\",\n    \"engagementMode\": \"Déférence judiciaire. Le rapport considère que sa décision établit la règle en vigueur : les droits issus de traités des peuples autochtones constituent une condition préalable au déclenchement d'un processus de sécession, et non un élément à considérer une fois celui-ci engagé [political.constitutionalSubstrate].\",\n    \"anchors\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"judiciary\"\n  },\n  {\n    \"name\": \"Titulaires de droits autochtones (Assemblée des Premières Nations; Athabasca Chipewyan, Piikani, Siksika et Tribu des Blood; Nation crie)\",\n    \"kind\": \"organisation autochtone\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Les titulaires de droits autochtones dont le rapport traite les droits issus de traités et le titre comme une condition préalable constitutionnelle tant à toute sécession provinciale qu'à l'approbation de grands projets, agissant à la fois par la voie judiciaire et par la négociation. Sur la sécession, la doctrine opérante veut que les droits issus de traités ne soient pas une considération au sein d'un processus de séparation, mais une condition préalable à son engagement : ces droits ont deux fois stoppé la voie de la pétition citoyenne en Alberta (les Premières Nations Athabasca Chipewyan, Piikani, Siksika et la Tribu des Blood (Kainai) ayant intenté la cause dans laquelle la Cour du Banc du Roi de l'Alberta a annulé la pétition référendaire le 13\_mai 2026\_au regard des Traités 7\_et 8) et l'Assemblée des Premières Nations a répondu à la proposition référendaire en invoquant les traités numérotés et en réclamant une révision fédérale de l'Entente sur le transfert des ressources naturelles de 1930. La Nation crie illustre la voie négociée : une lignée d'ententes de cinquante ans avec le Canada et le Québec, de la Convention de la Baie-James et du Nord québécois (1975) à l'Accord sur la gouvernance de la nation crie (2017) et sa propre constitution. Sur les approbations, ils s'opposent de façon soutenue à la Loi visant à bâtir le Canada pour des motifs de droits et de procédure, et sous le cadre Tsilhqot'in, les atteintes de la Couronne aux terres visées par le titre exigent le consentement ou une justification au titre de l'article 35.\",\n    \"fieldsCitedIn\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stabilityDrivers\",\n      \"society.composition\",\n      \"capacity.approvals\",\n      \"capacity.steering\"\n    ],\n    \"interests\": \"Établir que l'autonomie ou la sécession provinciale ne peut passer outre les droits issus de traités et rouvrir l'Entente de 1930\_par laquelle les provinces des Prairies détiennent le contrôle des ressources; et défendre ces droits contre un régime d'approbation qui consolide les permis fédéraux en un document de conditions unique [political.constitutionalSubstrate][society.composition][capacity.approvals].\",\n    \"resources\": \"Reconnaissance en vertu de l'article 35\_des droits ancestraux et issus de traités existants, qui relèvent de la Couronne et non de la province; traités numérotés (6, 7\_et 8) et deux décisions favorables stoppant la voie de la pétition albertaine; position nationale de premier plan de l'Assemblée des Premières Nations; traité global moderne de la Nation crie sur environ un million de kilomètres carrés et sa propre constitution; obligation légale de consultation à trois moments selon la Loi visant à bâtir le Canada; Programme de garantie de prêts pour les Autochtones doublé à 10\_milliards de dollars; et, selon le cadre Tsilhqot'in, exigence de consentement sur les terres visées par un titre [political.constitutionalSubstrate][political.stabilityDrivers][capacity.approvals][capacity.steering].\",\n    \"constraints\": \"Le litige albertain n'a atteint que la voie de la pétition, et la province a modifié la loi habilitante, inscrit sa propre question au scrutin par décret et interjeté appel; la Loi visant à bâtir le Canada a été adoptée avec l'appui libéral et conservateur, et quatre des quinze projets soumis ont des promoteurs autochtones ou territoriaux, ce qui complique tout récit simple d'opposition autochtone; le référendum non exécutoire de l'Alberta sur la séparation a néanmoins lieu le 19\_octobre 2026 [political.stabilityDrivers][capacity.approvals][political.shockAbsorbers].\",\n    \"likelyMoves\": \"Défendre la décision du 13\_mai 2026\_en appel, continuer de faire valoir l'argument des traités contre le processus albertain à l'approche du référendum du 19\_octobre, et participer aux consultations lancées le 24\_juin 2026\_en vue des décisions d'inscription de l'automne [political.constitutionalSubstrate][political.stabilityDrivers][capacity.approvals].\",\n    \"engagementMode\": \"Pouvoir de veto au sens statutaire et constitutionnel; les droits issus de traités sont une condition préalable à l'engagement d'un processus de sécession provinciale, les tribunaux ayant deux fois stoppé la voie de la pétition albertaine sur ce fondement; la consultation est une condition préalable que la Loi visant à bâtir le Canada impose à trois étapes; et les atteintes de la Couronne aux terres visées par un titre exigent le consentement ou une justification au titre de l'article 35. La Nation crie illustre le mode négociable parallèle, une séquence d'ententes de cinquante ans avec les deux ordres de gouvernement [political.constitutionalSubstrate][political.stabilityDrivers][capacity.approvals].\",\n    \"anchors\": [\n      \"political.constitutionalSubstrate\",\n      \"political.stabilityDrivers\",\n      \"society.composition\",\n      \"capacity.approvals\",\n      \"capacity.steering\",\n      \"political.shockAbsorbers\"\n    ],\n    \"group\": \"indigenous-rightsholders\"\n  },\n  {\n    \"name\": \"Sociétés d’État fédérales de financement et Fonds pour un Canada fort (Banque de développement du Canada, Exportation et développement Canada, Banque de l’infrastructure du Canada; Fonds pour un Canada fort)\",\n    \"kind\": \"société d’État\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Les sociétés d'État fédérales qui portent un poids économique important dans une économie mixte penchant vers le pôle axé sur le marché (la Banque de développement du Canada, Exportation et développement Canada et la Banque de l'infrastructure du Canada) désormais rejointes par le Fonds pour un Canada fort, annoncé le 27\_avril 2026\_comme le premier fonds souverain fédéral du Canada, doté de 25\_milliards de dollars sur trois ans et constitué en société d'État sans lien de dépendance prenant des participations minoritaires aux côtés du capital privé dans l'énergie, les minéraux critiques, l'agriculture, les infrastructures et la fabrication de pointe; le Fonds est contesté; des critiques se demandent si un fonds financé par la dette prenant des participations dans des projets favorisés relève de l'investissement ou de la politique industrielle sous un autre nom.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\"\n    ],\n    \"interests\": \"Mobiliser le capital privé dans les secteurs nommés, le Fonds pour un Canada fort servant d'instrument de participation d'un programme de productivité par ailleurs porté par une déduction fiscale [economy.politicalEconomy].\",\n    \"resources\": \"Capacité de financement fédérale couvrant le développement des entreprises, le crédit à l'exportation et les infrastructures, et les 25\_milliards de dollars du Fonds sur trois ans sous un mandat de participation minoritaire sans lien de dépendance dans cinq secteurs nommés [economy.politicalEconomy].\",\n    \"constraints\": \"Fonds financé par emprunt et le débat porte sur la nature de ses prises de participation dans des projets privilégiés : coinvestissement ou politique industrielle sous un autre nom?; le rapport indique explicitement que sa capacité à infléchir la trajectoire de productivité dépendra d'une exécution soutenue plutôt que de l'annonce [economy.politicalEconomy].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Subordination à l'exécutif. Véhicules de financement fédéraux nommés pour le poids qu’ils portent; la conception sans lien de dépendance du Fonds pour un Canada fort est affirmée et contestée; le rapport préservant à la fois le cadrage de coinvestissement et l’objection de politique industrielle [economy.politicalEconomy].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"capacity.productivity\"\n    ],\n    \"group\": \"crown-corporations\"\n  },\n  {\n    \"name\": \"Hydro-Québec\",\n    \"kind\": \"société d'État\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Plus grand producteur d'électricité du pays et pilier de l'économie du Québec; en outre l'une des signataires de la Convention de la Baie-James et du Nord québécois de 1975.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Production provinciale dominée par l'hydroélectricité (le Québec figure parmi les provinces produisant plus de 85 % de leur électricité à partir de celle-ci) et statut de partie aux traités dans les instruments de la Baie-James [territory.metabolism][political.constitutionalSubstrate].\",\n    \"constraints\": \"Le réseau est-ouest est fragmenté, la transmission interprovinciale étant limitée comparativement aux lignes nord-sud reliant la production canadienne aux marchés états-uniens [territory.metabolism].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Subordination au gouvernement provincial, dont le rapport la décrit comme un pilier plutôt que comme un acteur indépendant en son sein [economy.politicalEconomy].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"territory.metabolism\",\n      \"political.constitutionalSubstrate\"\n    ],\n    \"group\": \"crown-corporations\"\n  },\n  {\n    \"name\": \"Chemins de fer de marchandises de catégorie 1 (Canadien National; Canadien Pacifique Kansas City)\",\n    \"kind\": \"secteur privé\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Les deux chemins de fer de marchandises de catégorie 1\_exploitent environ 80 % de quelque 43 000\_kilomètres-voies de voie ferrée, transportant du grain, de la potasse, du charbon et des conteneurs sur des distances transcontinentales.\",\n    \"fieldsCitedIn\": [\n      \"territory.metabolism\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Propriété et exploitation d'environ 80 % du réseau ferroviaire national, et des produits en vrac qui y circulent [territory.metabolism].\",\n    \"constraints\": \"Le réseau est une seule épine dorsale est-ouest s'étendant sur des milliers de kilomètres, sans d'autre option redondante en aucun point du corridor [capacity.inheritedTerrain].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Exploitants privés d'une infrastructure dont l'État dépend; le rapport ne décrit aucun litige réglementaire [territory.metabolism].\",\n    \"anchors\": [\n      \"territory.metabolism\",\n      \"capacity.inheritedTerrain\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Secteur pétrolier et gazier et l’Oil Sands Alliance (Canadian Natural Resources, Suncor Energy, Cenovus, Imperial Oil; Enbridge, TC Energy)\",\n    \"kind\": \"secteur privé\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Grandes sociétés des sables bitumineux et des pipelines regroupées en Alberta (parmi les principaux bénéficiaires du modèle actuel, évoluant dans des marchés concentrés à fortes barrières à l'entrée) avec l'Oil Sands Alliance, qui, avec le Canada et l'Alberta, est partie au protocole d'entente par lequel le gouvernement fédéral s'est engagé d'avance à déclarer que le projet d'oléoduc vers la côte Ouest était un projet d'intérêt national, soumis au Bureau des grands projets le 2\_juillet 2026\_dans le cadre de la stratégie Pathways Plus; avec les banques à charte et les exportateurs manufacturiers, elles soutiennent la stabilité macroéconomique, mais pressent le gouvernement en matière de diversification commerciale, de compétitivité réglementaire et de réponse aux droits de douane imposés par les États-Unis.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\",\n      \"capacity.approvals\"\n    ],\n    \"interests\": \"Capacité d'acheminement du pétrole jusqu'aux côtes, compétitivité réglementaire et allègement tarifaire, ainsi que la désignation d'intérêt national de l'oléoduc vers la côte Ouest et de la stratégie de captage du carbone qui l'englobe; le rapport classe la création de cette capacité parmi les réformes que la plupart des analystes jugent techniquement nécessaires [economy.politicalEconomy][political.stabilityDrivers][capacity.approvals].\",\n    \"resources\": \"Position de marché concentrée, plus grande part des émissions nationales à 208\_mégatonnes, et protocole d'entente tripartite porteur d'un engagement fédéral anticipé, par un volet d'approbation parallèle réservé aux stratégies transformatrices plutôt qu'aux projets individuels [economy.politicalEconomy][territory.transition][capacity.approvals].\",\n    \"constraints\": \"Opposition environnementale et, en partie, autochtone aux nouveaux pipelines nommée comme le groupe organisé que rencontre chacune de ces réformes; l'alignement sur le gouvernement est conditionnel plutôt qu'automatique; et aucun projet n'a encore été désigné en vertu de la Loi, dont le gouvernement affirme explicitement qu'elle ne couvrira pas tous les projets soumis [economy.politicalEconomy][political.stabilityDrivers][capacity.approvals].\",\n    \"likelyMoves\": \"Faire avancer l'oléoduc vers la côte Ouest par le volet Pathways Plus soumis au Bureau des grands projets le 2\_juillet 2026, en pressant pour la désignation que le protocole d'entente anticipe [capacity.approvals].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Le rapport montre le secteur obtenant un engagement fédéral anticipé par protocole d’entente plutôt que par le processus de désignation lui-même [capacity.approvals].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\",\n      \"capacity.approvals\",\n      \"territory.transition\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Banques à charte (Banque Royale du Canada, Banque Toronto-Dominion, Banque de Nouvelle-Écosse, Banque de Montréal, Banque Canadienne Impériale de Commerce)\",\n    \"kind\": \"secteur privé\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Dominent un marché financier concentré et nommées parmi les principaux bénéficiaires du modèle actuel; avec les producteurs d'énergie et les fabricants exportateurs, elles soutiennent la stabilité macroéconomique tout en faisant pression sur le gouvernement en matière de diversification commerciale, de compétitivité réglementaire et de réponse tarifaire.\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\"\n    ],\n    \"interests\": \"Stabilité macroéconomique et conditions réglementaires d'un marché concentré [political.stabilityDrivers][economy.politicalEconomy].\",\n    \"resources\": \"Domination du marché par une poignée de firmes à barrières d'entrée élevées [economy.politicalEconomy].\",\n    \"constraints\": \"La forte concentration dans des secteurs de services clés est nommée par le Fonds monétaire international parmi les faiblesses structurelles à l'origine de l'écart de productivité [capacity.productivity].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. L'alignement avec le gouvernement est décrit comme conditionnel et exprimé sous forme de pression sur les politiques [political.stabilityDrivers].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Mouvement syndical (Congrès du travail du Canada, Unifor, Confédération des syndicats nationaux)\",\n    \"kind\": \"mouvement syndical\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Mouvement syndical canadien, réunissant le Congrès du travail du Canada (la fédération faîtière, environ trois millions de membres affiliés, concentrés dans le secteur public et l'industrie lourde), Unifor (le plus grand syndicat du secteur privé avec plus de 315 000\_membres dans l'automobile, l'énergie, les médias et la fabrication, qui a quitté le Congrès en 2024) et la Confédération des syndicats nationaux du Québec (bloc distinct d'environ 300 000\_membres).\",\n    \"fieldsCitedIn\": [\n      \"economy.politicalEconomy\",\n      \"economy.externalVulnerability\"\n    ],\n    \"interests\": \"Résister aux mesures d'assouplissement du marché du travail, résistance que le rapport range parmi les groupes d'intérêts organisés auxquels se heurtent les réformes jugées nécessaires; les membres d'Unifor se trouvent dans l'automobile, l'énergie et la fabrication, précisément les secteurs frappés par les droits de douane de 50 % et de 25 % imposés par les États-Unis [economy.politicalEconomy][economy.externalVulnerability].\",\n    \"resources\": \"Environ trois millions de membres affiliés du Congrès, plus de 315 000\_dans Unifor et environ 300 000\_dans la Confédération des syndicats nationaux, ainsi qu'un statut de fédération faîtière [economy.politicalEconomy].\",\n    \"constraints\": \"Fragmenté plutôt qu'unifié : Unifor, le plus grand syndicat du secteur privé, a quitté le Congrès en 2024, et le bloc québécois s'organise séparément [economy.politicalEconomy].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Décrit comme un contrepoids au sein de l’économie politique plutôt que comme un point de veto [economy.politicalEconomy].\",\n    \"anchors\": [\n      \"economy.politicalEconomy\",\n      \"economy.externalVulnerability\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  },\n  {\n    \"name\": \"Association du Barreau canadien (et sa division de l'Alberta)\",\n    \"kind\": \"société civile\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"S'est opposée au comité de quatre personnes proposé par l'Alberta, qui exigerait l'approbation ministérielle tant fédérale que provinciale avant que les nominations aux cours supérieures puissent aller de l'avant, au motif qu'il est incompatible avec l'article 96\_de la Loi constitutionnelle de 1867, lequel confère ce pouvoir au seul gouvernement fédéral.\",\n    \"fieldsCitedIn\": [\n      \"political.rightsAndChecks\"\n    ],\n    \"interests\": \"Maintenir les nominations aux cours supérieures dans le cadre du pouvoir fédéral que l'article 96\_assigne [political.rightsAndChecks].\",\n    \"resources\": \"Statut professionnel et argument constitutionnel que le rapport recense comme la position de la profession [political.rightsAndChecks][political.stabilityDrivers].\",\n    \"constraints\": \"Formule une objection; la proposition relève de la province, et le rapport ne recense aucune résolution [political.rightsAndChecks].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Organisme professionnel formulant une objection constitutionnelle publique, sans aucun rôle formel dans le processus de nomination décrit [political.rightsAndChecks].\",\n    \"anchors\": [\n      \"political.rightsAndChecks\",\n      \"political.stabilityDrivers\"\n    ],\n    \"group\": \"corporate-labour-civil\"\n  }\n]"
actors_external_en: "[\n  {\n    \"name\": \"United States\",\n    \"kind\": \"foreign state\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Canada's single land neighbour and dominant relationship on trade, defence and border management, and the one under structural stress: it took 75.9% of merchandise exports in 2024, has imposed successive tariff regimes since February 2025\_that the Parliamentary Budget Officer treats as permanent, let the trilateral agreement pass its 1\_July 2026\_review without renewal, invoked Section 338\_of the Tariff Act of 1930\_for the first time in its history on 20\_July 2026\_to impose an additional 50% duty on named Canadian sectors from 19\_August with no exemption for agreement-compliant goods, and paused Columbia River Treaty negotiations in March 2025 — while continental defence continues to be conducted binationally with it and no alternative arrangement exists.\",\n    \"fieldsCitedIn\": [\n      \"territory.geography\",\n      \"territory.metabolism\",\n      \"economy.externalVulnerability\",\n      \"political.shockAbsorbers\",\n      \"capacity.productivity\",\n      \"security.posture\",\n      \"security.internal\",\n      \"security.military\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"interests\": \"Sectoral protection pursued through successively different legal authorities, and renegotiation of the continental trade framework on annual rather than long-term terms [situation][economy.externalVulnerability].\",\n    \"resources\": \"The destination of roughly three-quarters of Canadian merchandise exports, multiple unilateral tariff authorities including one carrying no time limit, and the position of indispensable partner in continental defence [economy.externalVulnerability][security.military].\",\n    \"constraints\": \"The report records limits reached in its own system rather than imposed by Canada: the emergency-powers tariffs ruled unlawful with refunds available from April 2026, and the Section 122\_surcharge lapsing at the end of its 150-day statutory window with no extension introduced in Congress [situation].\",\n    \"likelyMoves\": \"Bring the Section 338\_duties into effect on 19\_August 2026\_unless the intensified talks agreed on 21\_July produce an alternative [situation].\",\n    \"engagementMode\": \"negotiable / dealable, with the report recording the shelter removed: agreement compliance had been the reliable protection throughout the dispute and no longer guarantees duty-free entry. The structural point the report makes is that Canada is reliant for its physical security on the partner generating most of its strategic uncertainty [economy.externalVulnerability][security.posture].\",\n    \"anchors\": [\n      \"economy.externalVulnerability\",\n      \"security.posture\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"People's Republic of China\",\n    \"kind\": \"foreign state\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Named by the foreign interference inquiry as the most active perpetrator of interference targeting Canadian democratic institutions; also the counterpart of a January 2026\_reset — the first Canadian prime ministerial visit to Beijing since 2017, an economic and trade cooperation roadmap under a declared strategic partnership, Canada cutting its tariff on Chinese electric vehicles from 100% to 6.1% within a quota while China reduced canola seed duties and suspended tariffs on canola meal, peas, lobster and crab — and among the countries completing the principal list of destinations for organised crime connections.\",\n    \"fieldsCitedIn\": [\n      \"security.posture\",\n      \"security.internal\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Market access and tariff relief on agricultural and seafood exports, obtained alongside an interference finding that remains unresolved [security.diplomacy][security.transnationalExposure].\",\n    \"resources\": \"A market Global Affairs Canada targets for 50% export growth by 2030, and reciprocal tariff instruments it has already used and suspended [security.diplomacy].\",\n    \"constraints\": \"The inquiry's finding stands adjudicated and public, and the report treats the gap between that finding and the reset as the central tension in Canadian diplomacy [security.diplomacy][security.posture].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable on trade while unresolved on security — the report's own formulation is that commercial diversification is proceeding alongside unresolved security findings about the same partner [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"security.transnationalExposure\",\n      \"security.posture\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"India\",\n    \"kind\": \"foreign state\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Named by the inquiry as the second most active perpetrator of foreign interference; after high commissioners were expelled by both sides in 2024\_the two prime ministers met at the Group of Seven summit in Alberta in June 2025\_and at the Group of Twenty in November, high commissioners were reinstated in August 2025, a shared roadmap was announced in October and a Canadian delegation visited in February and March 2026, with two-way merchandise trade at $10.9\_billion in 2025 — Canadian exports down 26.5% and imports up 18.9% — and comprehensive economic partnership negotiations under way.\",\n    \"fieldsCitedIn\": [\n      \"security.posture\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"A comprehensive economic partnership on a trade flow already lopsided in its favour and moving further that way [security.diplomacy].\",\n    \"resources\": \"A restored diplomatic relationship, a shared roadmap, and an import position that grew 18.9% while Canadian exports fell [security.diplomacy].\",\n    \"constraints\": \"The interference finding against it is public and unresolved, and the report notes transnational repression against diaspora communities was serious enough to warrant a warning beyond the inquiry's mandate [security.transnationalExposure].\",\n    \"likelyMoves\": \"Continue the partnership negotiations under way [security.diplomacy].\",\n    \"engagementMode\": \"negotiable / dealable on trade while unresolved on security, on the same pattern the report identifies for the other named interference actor [security.diplomacy][security.posture].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"European Union\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Signed a Security and Defence Partnership with Canada at the summit of 23\_June 2025 — explicitly non-legally-binding, regrouping existing cooperation across crisis management, military mobility, defence procurement, maritime security, cyber and space — and on 14\_February 2026\_a further agreement admitting Canadian firms to procurement under the Security Action for Europe instrument, making Canada the first non-European participant in that €150\_billion facility, applied provisionally since 13\_April 2026\_and concluded by the Council on 15\_June 2026; Canada has also been a third-state participant in European Permanent Structured Cooperation since 2021.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Widening the industrial base of European defence procurement to a first non-European participant [security.diplomacy].\",\n    \"resources\": \"A €150\_billion procurement facility, an existing structured cooperation framework, and treaty machinery capable of concluding agreements at Council level [security.diplomacy].\",\n    \"constraints\": \"The partnership is explicitly non-binding and the procurement agreement is commercial access rather than a defence guarantee — the report calls the resulting hedge real but thin [security.posture].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable. The relationship is built from signed but non-binding instruments, which is the report's own characterisation of its limit [security.posture].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"security.posture\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"North Atlantic Treaty Organization\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Canada is a founding member and the sixth-largest contributor to its common funded budget, is framework nation for Multinational Brigade Latvia — roughly 3,000\_personnel from fourteen allies — and reached the 2% spending benchmark in 2025-26\_for the first time in roughly thirty-five years, having agreed at the Hague summit in June 2025\_to invest 5% of output by 2035, 3.5% on core defence and 1.5% on defence-related infrastructure.\",\n    \"fieldsCitedIn\": [\n      \"security.military\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Burden-sharing measured against benchmarks members have agreed collectively [security.military].\",\n    \"resources\": \"Agreed spending benchmarks, a common funded budget, and the multinational force structure in which Canada holds framework-nation status [security.military][security.diplomacy].\",\n    \"constraints\": \"Compliance rests with members: Canada met 2% partly by counting expenditure across several departments, and the 5% commitment has no published pathway [security.military].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"commitment-bound — a forged category. The report describes benchmarks agreed at summit level and then met or missed, not bargained: the alliance is not a counterpart Canada negotiates with but a standard it is measured against [security.military].\",\n    \"anchors\": [\n      \"security.military\",\n      \"security.diplomacy\",\n      \"security.posture\"\n    ],\n    \"group\": \"defence-alliances\"\n  },\n  {\n    \"name\": \"Five Eyes\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The intelligence partnership with the United States, the United Kingdom, Australia and New Zealand, named as one of the three long-standing pillars of Canada's alliance architecture.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Standing intelligence-sharing among five states [security.diplomacy].\",\n    \"constraints\": \"report-silent\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"report-silent. Named as a membership pillar with no activity attributed to it in the reporting period [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\"\n    ],\n    \"group\": \"defence-alliances\"\n  },\n  {\n    \"name\": \"International Monetary Fund\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Forecasts 1.5% Canadian growth for 2026, the highest of the projections the report assembles; identifies the productivity weakness as structural — weak business dynamism, slow capital deepening, lagging innovation, high concentration in key service sectors and barriers to firm scaling — and calls the reform bundle addressing it Canada's highest-return set of policies; prices internal trade barriers at the equivalent of a 9% national tariff, up to 50% in health care, education and retail services, with elimination worth up to 7% of real output. No Fund programme is in place.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"economy.externalVulnerability\",\n      \"capacity.productivity\"\n    ],\n    \"interests\": \"Article IV policy advice concentrated on productivity and internal trade [capacity.productivity][economy.externalVulnerability].\",\n    \"resources\": \"Surveillance standing over a member state, and quantified estimates the report uses as the reference figures for the internal-barrier question [capacity.productivity].\",\n    \"constraints\": \"No programme is in place, so its influence runs through advice rather than conditionality [economy.externalVulnerability].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable as a membership body — Canada is a member consulting with it, not a country under programme conditions [economy.externalVulnerability].\",\n    \"anchors\": [\n      \"capacity.productivity\",\n      \"economy.externalVulnerability\",\n      \"economy.realEconomy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Organisation for Economic Co-operation and Development\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"A body Canada belongs to and is measured against: it forecasts 1.2% growth for 2026, supplies the comparison showing Canadian research intensity at 1.8% of output against a 2.7% member average and flat since 2010\_with a particularly low business share, records that foreign multinationals account for over 40% of business research spending, and is named among the multilateral memberships giving Canada institutional reach beyond its military weight.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"capacity.productivity\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Peer review and comparative positioning across member economies [capacity.productivity].\",\n    \"resources\": \"Country surveys, comparative indicators, and membership standing [capacity.productivity][security.diplomacy].\",\n    \"constraints\": \"report-silent\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable as a membership body — Canada participates in it rather than being rated by it, which is the distinction the extraction rule turns on [security.diplomacy].\",\n    \"anchors\": [\n      \"capacity.productivity\",\n      \"security.diplomacy\",\n      \"economy.realEconomy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Group of Seven\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"A multilateral membership giving Canada institutional reach beyond its military weight; Canada hosted the June 2025\_summit in Alberta, at which the Canadian and Indian prime ministers met, and the report benchmarks 2026\_Canadian growth as second-fastest in the group.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"A summit format the report shows being used to restart a bilateral relationship [security.diplomacy].\",\n    \"constraints\": \"report-silent\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable as a membership body; the report shows Canada using the format rather than being acted on by it [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"economy.realEconomy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Group of Twenty\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"A multilateral membership named alongside the Group of Seven; the Canadian and Indian prime ministers met again at its November meeting.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"A second summit format in the same bilateral sequence [security.diplomacy].\",\n    \"constraints\": \"report-silent\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"negotiable / dealable as a membership body [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Kingdom of Denmark\",\n    \"kind\": \"foreign state\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"Counterpart in a small disagreement over two zones in the Lincoln Sea, and party to the boundary agreement settling Tartupaluk, or Hans Island, now being implemented.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"report-silent\",\n    \"resources\": \"Standing as a boundary counterpart with a settled agreement in implementation [security.diplomacy].\",\n    \"constraints\": \"report-silent\",\n    \"likelyMoves\": \"Continue implementing the Tartupaluk boundary agreement [security.diplomacy].\",\n    \"engagementMode\": \"negotiable / dealable. The report describes a settled agreement being implemented and a narrow residual disagreement [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"North American Aerospace Defense Command (NORAD)\",\n    \"kind\": \"international body\",\n    \"liveActorStatus\": \"current\",\n    \"currentPosition\": \"The binational Canada–United States command through which continental aerospace and maritime warning and defence are conducted; the report states there is no alternative arrangement, records its modernisation carried at $38.6\_billion over twenty years, and describes Canada's developing space capability as advancing chiefly through continental surveillance within the modernisation programme.\",\n    \"fieldsCitedIn\": [\n      \"security.military\",\n      \"security.posture\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Continental aerospace and maritime warning and defence, conducted jointly with the United States [security.military].\",\n    \"resources\": \"Binational command authority over North American aerospace defence and the modernisation programme funded across the twenty-year defence plan [security.military].\",\n    \"constraints\": \"Its warning-and-defence function is exercised jointly with the United States, and the report describes no Canadian alternative — making continental defence inseparable from the relationship with the state generating most of Canada's strategic uncertainty [security.military][security.posture].\",\n    \"likelyMoves\": \"report-silent\",\n    \"engagementMode\": \"structurally-bound — a binational command Canada operates inside rather than a counterpart it negotiates with: continental defence is conducted through it and the report describes no alternative [security.military][security.posture].\",\n    \"anchors\": [\n      \"security.military\",\n      \"security.posture\",\n      \"security.diplomacy\"\n    ],\n    \"group\": \"defence-alliances\"\n  }\n]"
actors_external_fr: "[\n  {\n    \"name\": \"États-Unis\",\n    \"kind\": \"État étranger\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Seul voisin terrestre du Canada et relation dominante en matière de commerce, de défense et de gestion frontalière, et celle qui est sous tension structurelle : ont absorbé 75,9 % des exportations de marchandises en 2024, ont imposé des régimes tarifaires successifs depuis février 2025\_que la directrice parlementaire du budget considère comme permanents, ont laissé l'accord trilatéral franchir son examen du 1er juillet 2026\_sans renouvellement, ont invoqué l'article 338\_de la Tariff Act of 1930\_pour la première fois de leur histoire le 20\_juillet 2026\_afin d'imposer un droit supplémentaire de 50 % sur des secteurs canadiens nommés à compter du 19\_août sans exemption pour les biens conformes à l'accord, et ont suspendu les négociations sur le Traité du fleuve Columbia en mars 2025, tandis que la défense continentale continue d'être menée de façon binationale et qu'aucun autre arrangement n'existe.\",\n    \"fieldsCitedIn\": [\n      \"territory.geography\",\n      \"territory.metabolism\",\n      \"economy.externalVulnerability\",\n      \"political.shockAbsorbers\",\n      \"capacity.productivity\",\n      \"security.posture\",\n      \"security.internal\",\n      \"security.military\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"interests\": \"Protection sectorielle poursuivie au moyen d'autorités juridiques successivement différentes, et la renégociation du cadre commercial continental sur une base annuelle plutôt qu'à long terme [situation][economy.externalVulnerability].\",\n    \"resources\": \"Destination d'environ les trois quarts des exportations de marchandises canadiennes, multiples pouvoirs unilatéraux en matière de droits de douane dont l'un sans limite de durée, et position de partenaire indispensable dans la défense continentale [economy.externalVulnerability][security.military].\",\n    \"constraints\": \"Le rapport recense des limites atteintes dans leur propre système plutôt qu'imposées par le Canada : les droits de douane fondés sur les pouvoirs d'urgence jugés illégaux avec remboursements disponibles à compter d'avril 2026, et la surtaxe de l'article 122\_arrivant à échéance à la fin de sa fenêtre légale de 150\_jours sans prolongation présentée au Congrès [situation].\",\n    \"likelyMoves\": \"Mettre en vigueur les droits de l'article 338\_le 19\_août 2026\_à moins que les pourparlers intensifiés convenus le 21\_juillet ne produisent une autre solution [situation].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes, le rapport recensant l'abri retiré : la conformité à l'accord avait été la protection fiable tout au long du différend et ne garantit plus l'entrée en franchise de droits. Le point structurel que soulève le rapport est que le Canada dépend pour sa sécurité physique du partenaire qui génère l'essentiel de son incertitude stratégique [economy.externalVulnerability][security.posture].\",\n    \"anchors\": [\n      \"economy.externalVulnerability\",\n      \"security.posture\",\n      \"security.diplomacy\",\n      \"situation\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"République populaire de Chine\",\n    \"kind\": \"État étranger\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Désignée par l'enquête sur l'ingérence étrangère comme l'auteur le plus actif d'ingérence visant les institutions démocratiques canadiennes; également la contrepartie d'un rétablissement des relations en janvier 2026 (première visite d'un premier ministre canadien à Pékin depuis 2017), une feuille de route de coopération économique et commerciale dans le cadre d'un partenariat stratégique déclaré, le Canada ramenant son droit de douane sur les véhicules électriques chinois de 100 % à 6,1 % dans le cadre d'un quota tandis que la Chine réduisait ses droits sur les graines de canola et suspendait ses droits sur le tourteau de canola, les pois, le homard et le crabe; et parmi les pays complétant la principale liste de destinations des liens du crime organisé.\",\n    \"fieldsCitedIn\": [\n      \"security.posture\",\n      \"security.internal\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Accès au marché et allègement tarifaire sur les exportations agricoles et de fruits de mer, obtenus parallèlement à une conclusion d'ingérence qui demeure non résolue [security.diplomacy][security.transnationalExposure].\",\n    \"resources\": \"Marché qu'Affaires mondiales Canada cible pour une croissance des exportations de 50 % d'ici 2030, et instruments tarifaires réciproques qu'elle a déjà utilisés et suspendus [security.diplomacy].\",\n    \"constraints\": \"La conclusion de l'enquête demeure adjugée et publique, et le rapport considère l'écart entre cette conclusion et le rétablissement comme la tension centrale de la diplomatie canadienne [security.diplomacy][security.posture].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes en matière de commerce tout en demeurant non résolue en matière de sécurité; la formulation même du rapport est que la diversification commerciale progresse parallèlement à des conclusions de sécurité non résolues concernant le même partenaire [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"security.transnationalExposure\",\n      \"security.posture\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"Inde\",\n    \"kind\": \"État étranger\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Désignée par l'enquête comme le deuxième auteur le plus actif d'ingérence étrangère; après l'expulsion de hauts-commissaires par les deux parties en 2024, les deux premiers ministres se sont rencontrés au sommet du Groupe des Sept en Alberta en juin 2025\_et au Groupe des Vingt en novembre, les hauts-commissaires ont été réintégrés en août 2025, une feuille de route commune a été annoncée en octobre et une délégation canadienne s'y est rendue en février et mars 2026; commerce bilatéral de marchandises de 10,9\_milliards de dollars en 2025 (exportations canadiennes en baisse de 26,5 % et importations en hausse de 18,9 %) et négociations en vue d'un partenariat économique global en cours.\",\n    \"fieldsCitedIn\": [\n      \"security.posture\",\n      \"security.transnationalExposure\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Partenariat économique global sur un flux commercial déjà déséquilibré en sa faveur et évoluant davantage en ce sens [security.diplomacy].\",\n    \"resources\": \"Relation diplomatique rétablie, feuille de route commune et position d'importateur croissant de 18,9 % parallèlement à la diminution des exportations canadiennes [security.diplomacy].\",\n    \"constraints\": \"La conclusion d'ingérence à son encontre est publique et non résolue, et le rapport note que la répression transnationale contre les communautés diasporiques était assez grave pour justifier un avertissement au-delà du mandat de l'enquête [security.transnationalExposure].\",\n    \"likelyMoves\": \"Poursuivre les négociations du partenariat en cours [security.diplomacy].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes sur le commerce tout en demeurant non résolue sur la sécurité, selon le même schéma que le rapport signale pour l'autre acteur d'ingérence nommé [security.diplomacy][security.posture].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"security.transnationalExposure\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"Union européenne\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"A signé un Partenariat de sécurité et de défense avec le Canada au sommet du 23\_juin 2025 (explicitement non juridiquement contraignant, regroupant la coopération existante en matière de gestion de crise, de mobilité militaire, d'approvisionnement en défense, de sécurité maritime, de cybersécurité et d'espace) et le 14\_février 2026\_un accord supplémentaire admettant les entreprises canadiennes à l'approvisionnement au titre de l'instrument Action de sécurité pour l'Europe, faisant du Canada le premier participant non européen à ce mécanisme d'acquisition de 150\_milliards d'euros, appliqué provisoirement depuis le 13\_avril 2026\_et conclu par le Conseil le 15\_juin 2026; le Canada est aussi un État tiers participant à la Coopération structurée permanente européenne depuis 2021.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Élargir la base industrielle de l'approvisionnement en défense européen à un premier participant non européen [security.diplomacy].\",\n    \"resources\": \"Mécanisme d'acquisition de 150\_milliards d'euros, cadre de coopération structurée existant, et appareil conventionnel capable de conclure des accords au niveau du Conseil [security.diplomacy].\",\n    \"constraints\": \"Le partenariat est explicitement non contraignant et l'accord d'approvisionnement est un accès commercial plutôt qu'une garantie de défense; le rapport qualifie la couverture qui en résulte de réelle, mais mince [security.posture].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. La relation est bâtie à partir d'instruments signés, mais non contraignants; ce qui est la caractérisation même que le rapport fait de sa limite [security.posture].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"security.posture\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Organisation du Traité de l'Atlantique Nord\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Le Canada est membre fondateur et sixième contributeur en importance à son budget financé en commun, est nation-cadre de la Brigade multinationale en Lettonie (environ 3 000\_militaires de quatorze alliés) et a atteint le seuil de dépenses de 2 % en 2025-2026\_pour la première fois en environ trente-cinq ans, ayant convenu au sommet de La Haye en juin 2025\_d'investir 5 % de son PIB d'ici 2035, 3,5 % dans la défense de base et 1,5 % dans l'infrastructure liée à la défense.\",\n    \"fieldsCitedIn\": [\n      \"security.military\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Partage du fardeau mesuré au regard de seuils que les membres ont convenus collectivement [security.military].\",\n    \"resources\": \"Seuils de dépenses convenus, budget financé en commun et structure de force multinationale dans laquelle le Canada détient le statut de nation-cadre [security.military][security.diplomacy].\",\n    \"constraints\": \"Conformité incombant aux membres : le Canada a atteint 2 % en partie en comptabilisant des dépenses réparties dans plusieurs ministères, et l'engagement de 5 % ne comporte aucun parcours publié [security.military].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Lien par engagement; catégorie forgée. Le rapport décrit des seuils convenus au niveau des sommets, puis atteints ou manqués, non négociés : l'Alliance n'est pas un homologue avec lequel le Canada négocie, mais une norme par rapport à laquelle il est mesuré [security.military].\",\n    \"anchors\": [\n      \"security.military\",\n      \"security.diplomacy\",\n      \"security.posture\"\n    ],\n    \"group\": \"defence-alliances\"\n  },\n  {\n    \"name\": \"Five Eyes\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Partenariat de renseignements avec les États-Unis, le Royaume-Uni, l'Australie et la Nouvelle-Zélande, nommé comme l'un des trois piliers de longue date de l'architecture d'alliance du Canada.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Partage permanent de renseignements entre cinq États [security.diplomacy].\",\n    \"constraints\": \"Sans mention dans le rapport\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Sans mention dans le rapport. Nommé comme pilier d'appartenance sans qu'aucune activité ne lui soit attribuée durant la période visée [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\"\n    ],\n    \"group\": \"defence-alliances\"\n  },\n  {\n    \"name\": \"Fonds monétaire international\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Prévoit une croissance canadienne de 1,5 % pour 2026, la plus élevée des projections que le rapport rassemble; qualifie la faiblesse de la productivité de structurelle (faible dynamisme des entreprises, approfondissement lent du capital, innovation à la traîne, forte concentration dans des secteurs de services clés et obstacles à la croissance des entreprises) et appelle l'ensemble de réformes qui y répond l'ensemble de politiques au rendement le plus élevé du Canada; chiffre les barrières au commerce intérieur à l'équivalent d'un tarif national de 9 %, allant jusqu'à 50 % dans les soins de santé, l'éducation et les services de détail, leur élimination valant jusqu'à 7 % du PIB réel. Aucun programme du Fonds n'est en place.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"economy.externalVulnerability\",\n      \"capacity.productivity\"\n    ],\n    \"interests\": \"Conseils de politique de l'article IV concentrés sur la productivité et le commerce intérieur [capacity.productivity][economy.externalVulnerability].\",\n    \"resources\": \"Statut de surveillance à l'égard d'un État membre, et estimations quantifiées que le rapport utilise comme chiffres de référence pour la question des barrières intérieures [capacity.productivity].\",\n    \"constraints\": \"Aucun programme n'est en place, de sorte que son influence passe par des conseils plutôt que par la conditionnalité [economy.externalVulnerability].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes en tant qu'organisme d'appartenance; le Canada est un membre qui le consulte, non un pays soumis à des conditions de programme [economy.externalVulnerability].\",\n    \"anchors\": [\n      \"capacity.productivity\",\n      \"economy.externalVulnerability\",\n      \"economy.realEconomy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Organisation de coopération et de développement économiques\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Organisme auquel le Canada appartient et par rapport auquel il est mesuré : prévoit une croissance de 1,2 % pour 2026, fournit la comparaison montrant l'intensité de recherche canadienne à 1,8 % du PIB contre une moyenne des membres de 2,7 % et stable depuis 2010\_avec une part des entreprises particulièrement faible, indique que les multinationales étrangères représentent plus de 40 % des dépenses de recherche des entreprises, et est nommée parmi les appartenances multilatérales conférant au Canada une portée institutionnelle au-delà de son poids militaire.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"capacity.productivity\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Examen par les pairs et positionnement comparatif entre économies membres [capacity.productivity].\",\n    \"resources\": \"Études par pays, indicateurs comparatifs, et statut d'appartenance [capacity.productivity][security.diplomacy].\",\n    \"constraints\": \"Sans mention dans le rapport\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes en tant qu'organisation à adhésion; le Canada y participe plutôt que d'y être évalué, distinction sur laquelle repose la règle d'extraction [security.diplomacy].\",\n    \"anchors\": [\n      \"capacity.productivity\",\n      \"security.diplomacy\",\n      \"economy.realEconomy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Groupe des Sept\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Appartenance multilatérale conférant au Canada une portée institutionnelle au-delà de son poids militaire; le Canada a accueilli le sommet de juin 2025\_en Alberta, où les premiers ministres canadien et indien se sont rencontrés; le rapport situe la croissance canadienne de 2026\_comme la deuxième plus rapide du groupe.\",\n    \"fieldsCitedIn\": [\n      \"economy.realEconomy\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Format de sommet que le rapport montre être utilisé pour relancer une relation bilatérale [security.diplomacy].\",\n    \"constraints\": \"Sans mention dans le rapport\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes en tant qu'organisme d'appartenance; le rapport montre le Canada utilisant le format plutôt que subissant son action [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\",\n      \"economy.realEconomy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Groupe des Vingt\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Appartenance multilatérale nommée aux côtés du Groupe des Sept; les premiers ministres canadien et indien se sont rencontrés de nouveau à sa réunion de novembre.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Deuxième format de sommet dans la même séquence bilatérale [security.diplomacy].\",\n    \"constraints\": \"Sans mention dans le rapport\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes en tant qu'organisme d'appartenance [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\"\n    ],\n    \"group\": \"intl-orgs\"\n  },\n  {\n    \"name\": \"Royaume du Danemark\",\n    \"kind\": \"État étranger\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Contrepartie dans un léger désaccord au sujet de deux zones dans la mer de Lincoln, et partie à l'accord frontalier réglant Tartupaluk, ou île Hans, en cours de mise en œuvre.\",\n    \"fieldsCitedIn\": [\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Sans mention dans le rapport\",\n    \"resources\": \"Statut de contrepartie frontalière avec un accord réglé en cours de mise en œuvre [security.diplomacy].\",\n    \"constraints\": \"Sans mention dans le rapport\",\n    \"likelyMoves\": \"Continuer de mettre en œuvre l'accord frontalier de Tartupaluk [security.diplomacy].\",\n    \"engagementMode\": \"Négociation / conclusion d'ententes. Le rapport décrit un accord réglé en cours de mise en œuvre et un désaccord résiduel étroit [security.diplomacy].\",\n    \"anchors\": [\n      \"security.diplomacy\"\n    ],\n    \"group\": \"bilateral-states\"\n  },\n  {\n    \"name\": \"Commandement de la défense aérospatiale de l'Amérique du Nord (NORAD)\",\n    \"kind\": \"organisation internationale\",\n    \"liveActorStatus\": \"En vigueur\",\n    \"currentPosition\": \"Commandement binational Canada–États-Unis par lequel sont menées l'alerte et la défense aérospatiales et maritimes continentales; le rapport affirme qu'il n'existe aucun autre arrangement, recense sa modernisation chiffrée à 38,6\_milliards de dollars sur vingt ans, et décrit la capacité spatiale en développement du Canada comme progressant principalement par la surveillance continentale dans le cadre du programme de modernisation.\",\n    \"fieldsCitedIn\": [\n      \"security.military\",\n      \"security.posture\",\n      \"security.diplomacy\"\n    ],\n    \"interests\": \"Alerte et défense aérospatiales et maritimes continentales, menées conjointement avec les États-Unis [security.military].\",\n    \"resources\": \"Autorité de commandement binationale sur la défense aérospatiale nord-américaine et le programme de modernisation financé dans le cadre du plan de défense sur vingt ans [security.military].\",\n    \"constraints\": \"Sa fonction d'alerte et de défense est exercée conjointement avec les États-Unis, et le rapport ne décrit aucune autre solution canadienne, rendant la défense continentale indissociable de la relation avec l'État qui génère l'essentiel de l'incertitude stratégique du Canada [security.military][security.posture].\",\n    \"likelyMoves\": \"Sans mention dans le rapport\",\n    \"engagementMode\": \"Lien structurel; commandement binational au sein duquel le Canada agit plutôt qu'un vis-à-vis avec lequel il négocie : la défense continentale s'exerce par son intermédiaire, et le rapport ne décrit aucune autre solution [security.military][security.posture].\",\n    \"anchors\": [\n      \"security.military\",\n      \"security.posture\",\n      \"security.diplomacy\"\n    ],\n    \"group\": \"defence-alliances\"\n  }\n]"
sources: "[\n  {\n    \"id\": \"imf-can-2025-art4\",\n    \"name\": \"IMF Canada: 2025 Article IV Consultation – Press Release and Staff Report\",\n    \"nameFr\": \"FMI — Canada : Consultation de 2025\_au titre de l'article IV — Communiqué et rapport des services\",\n    \"url\": \"https://www.imf.org/en/publications/cr/issues/2026/01/21/canada-2025-article-iv-consultation-press-release-and-staff-report-5733\",\n    \"desc\": \"IMF staff country report providing macro assessment, GDP trajectory, fiscal balance, monetary policy, trade exposure, and structural reform analysis for Canada as of January 2026.\",\n    \"descFr\": \"Rapport-pays des services du FMI présentant l'évaluation macroéconomique, la trajectoire du PIB, le solde budgétaire, la politique monétaire, l'exposition commerciale et l'analyse des réformes structurelles du Canada en date de janvier 2026.\",\n    \"publicationDate\": \"2026-01-20\",\n    \"accessDate\": \"2026-06-28\",\n    \"confidence\": \"High\",\n    \"citationType\": \"Fact\"\n  },\n  {\n    \"id\": \"boc-mpr-apr2026\",\n    \"name\": \"Bank of Canada Monetary Policy Report – April 2026\",\n    \"nameFr\": \"Banque du Canada — Rapport sur la politique monétaire, avril 2026\",\n    \"url\": \"https://www.bankofcanada.ca/publications/mpr/mpr-2026-04-29/\",\n    \"desc\": \"Bank of Canada quarterly Monetary Policy Report (April 2026) — the policy-rate decision and the base-case projection for growth and inflation, with trade-uncertainty risks.\",\n    \"descFr\": \"Rapport trimestriel sur la politique monétaire de la Banque du Canada (avril 2026) — la décision sur le taux directeur et la projection de référence pour la croissance et l'inflation, avec les risques liés à l'incertitude commerciale.\",\n    \"publicationDate\": \"2026-04-29\",\n    \"accessDate\": \"2026-06-28\",\n    \"confidence\": \"High\",\n    \"citationType\": \"Fact\"\n  },\n  {\n    \"id\": \"statcan-gdp-q1-2026\",\n    \"name\": \"Statistics Canada – The Daily: GDP, Income and Expenditure, Q1 2026\",\n    \"nameFr\": \"Statistique Canada — Le Quotidien : Produit intérieur brut, revenus et dépenses, premier trimestre de 2026\",\n    \"url\": \"https://www150.statcan.gc.ca/n1/daily-quotidien/260529/dq260529a-eng.htm\",\n    \"desc\": \"Statistics Canada quarterly national accounts release (GDP, income and expenditure) for the first quarter of 2026, giving the latest output performance.\",\n    \"descFr\": \"Communiqué des comptes nationaux trimestriels de Statistique Canada (PIB, revenus et dépenses) pour le premier trimestre 2026, donnant le PIB le plus récent.\",\n    \"publicationDate\": \"2026-05-28\",\n    \"accessDate\": \"2026-06-28\",\n    \"confidence\": \"High\",\n    \"citationType\": \"Fact\"\n  },\n  {\n    \"id\": \"gac-state-of-trade-2025\",\n    \"name\": \"Global Affairs Canada – Canada's State of Trade 2025\",\n    \"nameFr\": \"Affaires mondiales Canada — Le commerce international du Canada 2025\",\n    \"url\": \"https://international.canada.ca/en/global-affairs/corporate/reports/chief-economist/state-trade/2025\",\n    \"desc\": \"Global Affairs Canada annual trade report documenting Canada's 2024 export and import totals, sector performance and partner concentration, with a focus on small and medium enterprises.\",\n    \"descFr\": \"Rapport commercial annuel d'Affaires mondiales Canada documentant les totaux des exportations et importations du Canada en 2024, la performance sectorielle et la concentration des partenaires, avec un accent sur les petites et moyennes entreprises.\",\n    \"publicationDate\": \"2025-06-22\",\n    \"accessDate\": \"2026-06-28\",\n    \"confidence\": \"High\",\n    \"citationType\": \"Fact\"\n  },\n  {\n    \"id\": \"gac-quarterly-trade-spring2026\",\n    \"name\": \"Global Affairs Canada – Quarterly Economic and Trade Report: Spring 2026\",\n    \"nameFr\": \"Affaires mondiales Canada — Rapport économique et commercial trimestriel : printemps 2026\",\n    \"url\": \"https://international.canada.ca/en/global-affairs/corporate/reports/chief-economist/quarterly/spring-2026\",\n    \"desc\": \"Global Affairs Canada quarterly economic and trade report (Spring 2026) on Canadian output growth and the near-term outlook.\",\n    \"descFr\": \"Rapport économique et commercial trimestriel d'Affaires mondiales Canada (printemps 2026) sur la croissance du PIB canadien et les perspectives à court terme.\",\n    \"publicationDate\": \"2026-03-31\",\n    \"accessDate\": \"2026-06-28\",\n    \"confidence\": \"High\",\n    \"citationType\": \"Fact\"\n  },\n  {\n    \"id\": \"seu-2026\",\n    \"name\": \"Government of Canada – Spring Economic Update 2026: Economic and Fiscal Overview\",\n    \"nameFr\": \"Gouvernement du Canada — Mise à jour économique du printemps 2026 : aperçu de la situation économique et budgétaire\",\n    \"url\": \"https://budget.canada.ca/update-miseajour/2026/report-rapport/overview-apercu-en.html\",\n    \"desc\": \"Federal Spring Economic Update 2026 (\\\"Canada Strong for All\\\"): economic and fiscal overview setting out the budgetary balance and federal debt track to 2030-31, the two fiscal anchors, the capital-versus-operating deficit split, the private-sector economist survey underpinning the projections, and the announcement of the Canada Strong Fund.\",\n    \"descFr\": \"Mise à jour économique fédérale du printemps 2026 (« Un Canada fort pour tous ») : aperçu économique et budgétaire présentant le solde budgétaire et la trajectoire de la dette fédérale jusqu'en 2030-2031, les deux cibles budgétaires, la répartition du déficit entre investissements en capital et fonctionnement, l'enquête auprès des économistes du secteur privé qui sous-tend les projections, et l'annonce du Fonds pour un Canada fort.\",\n    \"publicationDate\": \"2026-04-27\",\n    \"accessDate\": \"2026-07-21\",\n    \"confidence\": \"High\",\n    \"citationType\": \"Fact\",\n    \"volatility\": \"High\"\n  },\n  {\n    \"id\": \"pbo-efo-jun2026\",\n    \"name\": \"Economic and Fiscal Outlook — June 2026 (Parliamentary Budget Officer)\",\n    \"nameFr\": \"Perspectives économiques et financières — juin 2026 (Directeur parlementaire du budget)\",\n    \"url\": \"https://www.pbo-dpb.ca/en/publications/RP-2627-002-S--economic-fiscal-outlook-june-2026--perspectives-economiques-financieres-juin-2026\",\n    \"desc\": \"Parliamentary Budget Officer's independent baseline projection of the federal budgetary balance, debt-to-GDP ratio and debt-service ratio, incorporating Budget 2025 and Spring Economic Update 2026 measures and treating United States tariffs as permanent.\",\n    \"descFr\": \"Projection de référence indépendante du Directeur parlementaire du budget sur le solde budgétaire fédéral, le ratio de la dette au PIB et le ratio du service de la dette, tenant compte des mesures du budget de 2025\_et de la mise à jour économique du printemps 2026\_et considérant les droits de douane imposés par les États-Unis comme permanents.\",\n    \"publicationDate\": \"2026-06-04\",\n    \"accessDate\": \"2026-07-21\",\n    \"confidence\": \"High\",\n    \"citationType\": \"Fact\",\n    \"volatility\": \"High\"\n  },\n  {\n    \"id\": \"oecd-eo-june2026\",\n    \"name\": \"OECD Economic Outlook, Volume 2026 Issue 1 (June 2026)\",\n    \"nameFr\": \"OCDE — Perspectives économiques, volume 2026\_numéro 1 (juin 2026)\",\n    \"url\": \"https://www.oecd.org/en/publications/2026/06/oecd-economic-outlook-volume-2026-issue-1_8be0dba6.html\",\n    \"desc\": \"OECD Economic Outlook (June 2026) forecasting Canadian GDP growth, with analysis of tariff headwinds, household consumption and the energy sector.\",\n    \"descFr\": \"Perspectives économiques de l'OCDE (juin 2026) prévoyant la croissance du PIB canadien, avec une analyse des pressions tarifaires, de la consommation des ménages et du secteur énergétique.\",\n    \"publicationDate\": \"2026-06-02\",\n    \"accessDate\": \"2026-06-28\",\n    \"confidence\": \"High\",\n    \"citationT