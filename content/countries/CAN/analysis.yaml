      "mitigants": "Engagement d'investissement de 38,6 G$ pour la modernisation de NORAD [dnd-departmental-results-2024-25]; enveloppe de défense de 81,8 G$ du budget 2025 [budget-2025-canada-strong]; activation du Partenariat de sécurité et de défense avec l'UE [cgai-diplomats-guide-2026]"
