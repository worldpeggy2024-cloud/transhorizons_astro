      "resources": "Grand marché unique; cadre institutionnel de l'AECG; nouveau Partenariat de sécurité et de défense UE-Canada [cgai-diplomats-guide-2026]; pouvoir normatif de définition des standards réglementaires",
      "constraints": "La cohésion interne de l'UE limite la vitesse de prise de décision bilatérale; sensibilités commerciales agricoles",
      "likelyMoves": "Approfondir le partenariat de sécurité après 2026; activer les dispositions de l'AECG sur les minéraux critiques; coordonner la gouvernance arctique",
      "dealability": "High"
    },
