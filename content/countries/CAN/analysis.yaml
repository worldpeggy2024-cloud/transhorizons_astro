situation_fr: |-
  [
  {
    "thread": "Rupture commerciale avec les États-Unis",
    "status": "en cours",
    "events": [
      {
        "date": "4 février – 4 mars 2025",
        "what": "Les États-Unis imposent des droits de douane de 25 % sur la quasi-totalité des produits canadiens (10 % sur l'énergie); le Canada riposte par des contre-mesures tarifaires de 25 % sur 30 G$ CA d'importations, portées par la suite à 155 G$ CA [fin-canada-counter-tariffs].",
        "changed": "Fin de la relation commerciale de fait sans droits de douane en place depuis 1994, exposant environ 500 G$ d'échanges bilatéraux annuels à de nouveaux coûts."
      },
      {
        "date": "mars – juin 2025",
        "what": "Des droits sectoriels s'ajoutent en vertu de l'article 232 de la loi états-unienne : 25 % sur l'acier et l'aluminium en mars, portés à 50 % en juin, et 25 % sur les véhicules non construits aux États-Unis en avril [us-section-232].",
        "changed": "Des droits durables, non couverts par l'ACEUM, frappent précisément la base d'exportation des ressources et de la fabrication canadiennes."
      },
      {
        "date": "1er septembre 2025",
        "what": "Le Canada retire unilatéralement la plupart de ses contre-mesures tarifaires, les maintenant uniquement sur l'acier, l'aluminium et les automobiles [fin-canada-counter-tariffs].",
        "changed": "Fin de la phase d'escalade réciproque. Le gouvernement présente la mesure comme un moyen de protéger la part de commerce Canada–États-Unis (environ 85 %) demeurée exempte de droits de douane et de préserver les négociations en cours; les partis d'opposition et les industries touchées la qualifie de concession unilatérale sans contrepartie."
      },
      {
        "date": "octobre 2025",
        "what": "Les États-Unis imposent un droit de 10 % en vertu de l'article 232 sur le bois d'œuvre résineux, en vigueur le 14 octobre, s'ajoutant aux droits antidumping et compensateurs de longue date dont le taux combiné atteint plus de 35 % au titre du sixième examen administratif [gac-softwood-recent]; les négociations commerciales sont rompues.",
        "changed": "Un nouveau droit de douane de « sécurité nationale » se superpose à un régime de recours commerciaux existant, portant le fardeau combiné sur le bois d'œuvre canadien à environ 45 % en vertu de deux pouvoirs juridiques distincts, ni l'un ni l'autre protégé par l'ACEUM."
      },
      {
        "date": "24 février 2026",
        "what": "Le droit de douane de 35 % sur les produits non conformes à l'ACEUM est remplacé par une surtaxe de 10 % en vertu de l'article 122 incluant le Canada; les droits imposés en vertu des pouvoirs d'urgence sont jugés illégaux et des remboursements deviennent accessibles aux importateurs canadiens à compter d'avril 2026 [us-cbp-tariff-notice-2026].",
        "changed": "Réduction marquée du taux tarifaire principal, sans toucher aux droits sectoriels."
      },
      {
        "date": "1er juillet 2026",
        "what": "Lors de l'examen conjoint trilatéral de l'ACEUM, les États-Unis confirment qu'ils ne sont pas actuellement disposés à prolonger automatiquement l'entente jusqu'en 2042 [gac-cusma-review][cusma-leblanc-statement-2026].",
        "changed": "L'ACEUM demeure en vigueur mais passe à des examens annuels jusqu'à son expiration prévue en 2036, plaçant le libre-échange nord-américain en renégociation permanente."
      }
    ],
    "currentState": "Les produits conformes à l'ACEUM demeurent exempts de droits; les produits non conformes sont assujettis à une surtaxe de 10 % en vertu de l'article 122, dont le fondement légal expire à la fin de juillet 2026 et qui fait elle-même l'objet d'une contestation judiciaire. Les dommages durables sont sectoriels: 50 % sur l'acier, l'aluminium et le cuivre, 25 % sur les véhicules, et un fardeau combiné de droits de douane de l'article 232 et de droits antidumping et compensateurs sur le bois d'œuvre atteignant environ 45 % (la composante de recours commerciaux étant elle-même en cours de révision); en vertu de pouvoirs que l'ACEUM ne protège pas. En dix-huit mois, le régime a changé à répétition de taux, de portée et de fondement juridique; cette instabilité, indépendamment de tout taux, prive les exportateurs de toute base stable de planification."
  },
  {
    "thread": "Engagement en matière de défense",
    "status": "juin 2025",
    "events": [
      {
        "date": "24-25 juin 2025",
        "what": "Au sommet de l'OTAN à La Haye, le Canada et l'ensemble des alliés s'engagent à consacrer 5 % du PIB à la défense d'ici 2035, soit 3,5 % pour la défense de base et 1,5 % pour les infrastructures connexes, remplaçant la cible de 2 % [nato-hague-declaration-2025].",
        "changed": "Le Canada s'engage dans sa plus importante trajectoire soutenue de dépenses de défense depuis la guerre froide; la directrice parlementaire du budget estime les dépenses supplémentaires à environ 33,5 G$ par année, aucune trajectoire gouvernementale vers la cible n'ayant été publiée [pbo-nato-5-percent-2026]."
      }
    ]
  },
  {
    "thread": "Changement de gouvernement",
    "status": "mars – avril 2025",
    "events": [
      {
        "date": "14 mars 2025",
        "what": "Mark Carney est assermenté premier ministre, succédant à Justin Trudeau [pmo-swearing-in-2025].",
        "changed": "Nouvelle direction et nouvelle posture de négociation au point le plus vif de la rupture commerciale."
      },
      {
        "date": "28 avril 2025",
        "what": "Les libéraux remportent 169 des 343 sièges et forment un gouvernement minoritaire, devenu majoritaire par la suite comme décrit dans Structure du pouvoir [elections-canada-2025].",
        "changed": "Mandat électoral conférant l'appui nécessaire à une posture commerciale de confrontation et à l'accélération des dépenses de défense."
      }
    ]
  }
  ]
situation_lastUpdated: '2026-07-15'
actors_domestic_en: |-
  [
    {
      "name": "Prime Minister Mark Carney / Liberal Government",
      "interests": "Advance the government's legislative and fiscal agenda without opposition dependence; hold caucus cohesion across an enlarged, ideologically broad caucus; negotiate US tariff relief; deliver housing and defence commitments",
      "resources": "Federal executive authority; a working Commons majority (172 of 343) giving control of the legislative agenda and the ability to pass bills without opposition votes [ourcommons-party-standings-2026]; the Budget 2025 defence mandate ($81.8B/5 yrs) and the April 2026 fiscal framework [budget-2025-canada-strong][seu-2026]; recent Senate appointments easing the path through the upper chamber [pmo-senate-2026]",
      "constraints": "A thin majority (172 of 343) reached partly through floor crossings, whose legitimacy the opposition contests; the binding constraint is now caucus discipline rather than inter-party bargaining; fiscal headroom is limited — the PBO projects a $72B deficit for 2025-26 and the government $65.3B for 2026-27, different fiscal years on a declining track [pbo-efo-jun2026][seu-2026]; inflation at 3.2% further limits fiscal room [statcan-cpi-may2026]",
      "likelyMoves": "Legislate the agenda without confidence-and-supply arrangements; manage caucus and by-election exposure; targeted tariff-response spending; autumn fiscal update; continued Senate appointments to smooth passage",
      "dealability": "High — bargaining from strength, with little need to concede to domestic opposition"
    },
    {
      "name": "Conservative Party of Canada (Pierre Poilievre, Official Opposition)",
      "interests": "Contest the floor-crossing majority's legitimacy; position for the next scheduled election on fiscal responsibility, energy development, and immigration reduction",
      "resources": "Official Opposition resources and parliamentary rights; alignment with Western Canada energy constituency",
      "constraints": "Under a majority, no opposition combination can force an election or defeat the government — the Conservatives are limited to rhetorical and procedural pressure until roughly 2029 [ourcommons-party-standings-2026]; cost-of-living positioning is complicated by inflation partly traceable to tariff pass-through [statcan-cpi-may2026]",
      "likelyMoves": "Sustained legitimacy attacks on the floor-crossing majority; procedural and public-accounts pressure; wedge issues on immigration and crime; contesting by-elections in vacated seats",
      "dealability": "Low"
    },
    {
      "name": "New Democratic Party (Avi Lewis)",
      "interests": "Rebuild after the April 2025 collapse; regain official-party status; secure a Commons seat for the leader; remain relevant with influence exercised through public pressure rather than confidence bargaining",
      "resources": "Organized-labour base; pharmacare and dental-care wins banked from the prior Parliament; a new leader in Avi Lewis, elected 29 March 2026 [npd-lewis-leadership-2026]",
      "constraints": "At 5 seats the party sits below the 12-seat threshold for official party status, sharply limiting its parliamentary resources; the leader currently holds no seat; a Liberal majority removes the balance-of-power leverage the party held under the prior minority; the Liberals continue to encroach on the progressive flank [ourcommons-party-standings-2026]",
      "likelyMoves": "Extra-parliamentary rebuilding — public campaigns, labour organizing, positioning on corporate taxation — with no confidence leverage to deploy",
      "dealability": "Low — willing but with little to trade under a majority"
    },
    {
      "name": "Bloc Québécois",
      "interests": "Advance Quebec provincial interests (language, culture, jurisdictional autonomy, pension independence) at federal level",
      "resources": "Quebec-specific electoral hold (~30+ seats in strong conditions; 21 at present [ourcommons-party-standings-2026])",
      "constraints": "A Liberal majority removes the confidence leverage the Bloc held under the prior minority — it can no longer defeat the government or decide Quebec-specific files by its votes [ourcommons-party-standings-2026]; Quebec voters punish the Bloc for enabling governments seen as threatening provincial interests; sovereignty referendum trigger conditions remain dormant [freedom-house-canada-2026]",
      "likelyMoves": "Case-by-case voting without decisive leverage; advocacy and positioning on Quebec files; pressure where federal decisions touch provincial jurisdiction",
      "dealability": "Low — reduced from prior-Parliament leverage"
    }
  ]
