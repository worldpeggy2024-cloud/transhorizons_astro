      "rationale_en": "The report records no political violence and no communal or sectarian division: cleavages run through courts, ballots and surveys, majorities affirm that multiculturalism has contributed positively to Canadian identity across racialized and white respondents alike, and the long values record shows an asymmetric spread of political values rather than symmetric polarization; the located erosions — interpersonal trust drifting inside a narrow band, a nine-point generational trust gap, confidence in the federal Parliament the weakest reading of any institution measured, and a reversed immigration consensus attributed to government management rather than to immigrants — qualify the reading without changing the structure.",
