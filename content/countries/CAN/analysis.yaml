    },
    {
      "name": "Nouveau Parti démocratique (Avi Lewis)",
      "interests": "Se reconstruire après l'effondrement d'avril 2025; retrouver le statut de parti reconnu; obtenir un siège aux Communes pour son chef; demeurer pertinent, son influence s'exerçant désormais par la pression publique plutôt que par la négociation de la confiance",
      "resources": "Base syndicale organisée; gains en assurance médicaments et en soins dentaires obtenus lors de la législature précédente; nouveau chef, Avi Lewis, élu le 29 mars 2026 [npd-lewis-leadership-2026]",
      "constraints": "Avec 5 sièges, le parti se situe sous le seuil de 12 sièges requis pour le statut de parti reconnu, ce qui limite fortement ses ressources parlementaires; son chef est actuellement extraparlementaire, sans siège; une majorité libérale lui retire le rapport de force qu'il détenait sous la minorité précédente; les libéraux continuent d'empiéter sur son flanc progressiste [ourcommons-party-standings-2026]",
      "likelyMoves": "Reconstruction extraparlementaire (campagnes publiques, mobilisation syndicale, positionnement sur la fiscalité des entreprises) sans levier de confiance à faire valoir",
