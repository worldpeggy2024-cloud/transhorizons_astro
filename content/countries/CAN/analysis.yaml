      "rationale_en": "Civilian control is both statutory and demonstrated: the Minister of National Defence has the management and direction of the Canadian Armed Forces and the Chief of the Defence Staff exercises control under that direction, the Commissioner of the Royal Canadian Mounted Police is likewise appointed by the Governor in Council and answerable to the Minister of Public Safety while operationally independent in core law-enforcement functions. Institutional loyalty to civilian authority is not in question, Canada has no history of military intervention in politics, and no systemic corruption in the security forces is recorded in the sources consulted.",
