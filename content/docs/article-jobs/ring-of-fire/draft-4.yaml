title_en: The Webequie Supply Road and the ground it crosses
introduction_en: >-
  In June 2026 Ontario approved the portion of the 107 km Webequie Supply Road, an all-season road, that lies
  off Webequie First Nation reserve land. A week later the Government of Canada issued its impact assessment
  decision statement, more than a year before the regional assessment of the Ring of Fire area is scheduled to
  report.
sections:
  - title_en: The project
    content_en: >-
      On 18 June 2026 Ontario approved the environmental assessment for the portion of the Webequie Supply
      Road not located on Webequie First Nation reserve land. The Government of Canada issued its impact
      assessment decision statement on 25 June 2026. The final environmental assessment report and impact
      statement had been submitted on 30 January 2026. Neskantaga First Nation, about 100 km southwest of the
      Eagle's Nest deposit, has been under a drinking water advisory since 1995, the longest-running in
      Canada. Five of the 15 communities covered by the regional assessment's cost-of-living report have
      boil-water advisories, four of them for more than ten years.


      The road is a 107-kilometre all-season road connecting the Webequie airport to the McFaulds Lake area.
      Ontario lists the all-season road projects it is helping advance as including the Webequie Supply Road,
      the Marten Falls Community Access Road, the Northern Road Link and the Anaconda and Painter Lake roads,
      along with upgrades to Highways 584 and 643. About 17 km of the Webequie road would sit on Webequie
      First Nation reserve land, which is federal land. The provincial assessment rests on a voluntary
      agreement: Ontario's Environmental Assessment Act allows a proponent to enter a written agreement with
      the Minister to have the Act apply, and Webequie First Nation agreed to subject the road to a
      comprehensive assessment under it. Chief Cornelius Wabasse of Webequie First Nation signed such an
      agreement on 3 May 2018. Federally, the road is subject to an impact assessment by the Impact Assessment
      Agency.


      The design is a 12 m road platform within a cleared right-of-way 35 m wide and 107 km long. The roadway
      is 11 m wide, made up of two 3.5 m lanes and two 2.0 m shoulders, with 0.5 m of rounding on each side.
      The design standard is Rural Collector Undivided 100. There are 31 permanent waterbody crossings, six of
      them bridges and 25 culverts. Two aggregate areas cover about 45.41 ha and 84.24 ha; the proponent gives
      an aggregate volume of 4,854,500 m³. Construction is planned over five to six years, with equipment
      brought in on the winter road that begins off Highway 808 about 100 km northeast of Pickle Lake. The
      operations phase is set at 75 years. The proponent states that traffic will not include ore or mine
      product, and the federal draft report records that it anticipates no more than 500 vehicles a day on the
      road.
  - title_en: The winter road as the baseline
    content_en: >-
      Webequie is accessible only by air or by winter road, so food, fuel and construction supplies must be
      flown in. More than 30 First Nations in Ontario are remote, with no year-round access to the urban
      centres where they obtain goods and services. Ten of the fifteen First Nation partners in the regional
      assessment have no all-season road to the provincial highway system; they rely on winter roads, which
      the interim report describes as costly to maintain and repair, and on a few community airports. Winter
      roads are built over land and over frozen rivers and lakes by the remote communities themselves. They
      carry fuel, food, building materials and people.


      The length of the season depends on who is measuring. The federal draft impact assessment report gives
      the Webequie winter road as open from around January to mid-March. Ontario's program page gives a season
      from around mid-January until spring thaw. A cost-of-living report prepared for the regional assessment
      working group in 2026 by Swift Creek Consulting states that winter roads are typically open for six to
      ten weeks a year, and some for less. The same report relays one community member's account that the road
      connecting Peawanuck to year-round roads in Manitoba has a window of about two weeks, so that the
      community must plan a year's needs in advance and faces heavy air-freight costs if winter traffic runs
      into complications. Nishnawbe Aski Nation states that the season has fallen from an average of 77 days
      to as few as 28. The trail between Webequie and McFaulds Lake can be travelled over its whole length
      only in the coldest winter months.


      The draft report records that the winter road's seasonal lifespan has been observed to shrink because of
      climate change. Nishnawbe Aski Nation describes how this happens: fewer consecutive freezing degree days
      at the start of the season to build the road, and earlier breakup at the end. Its Chiefs declared a
      state of emergency during a winter when unseasonably warm weather threatened the viability of the roads.
      In February 2024 the federal minister of Indigenous Services said the shortening of the winter road
      season poses important supply problems for many remote First Nations. In November 2024 the same
      department said the shortened window had led to shortages of food, fuel and medical supplies, and to
      more reliance on air transport. The Swift Creek report cites projections for Manitoba winter roads, used
      as a proxy for northern Ontario, that by the 2050s roads will open five days later and the season will
      be ten days shorter. One community member interviewed for that report called the changes in winter roads
      in recent years a source of havoc in communities. Staff at the Northern Policy Institute told the
      authors that winter roads are not a long-term solution because of climate change.


      As of November 2024, Indigenous Services Canada was providing over $7 million a year to 32 remote First
      Nations in Ontario for about 3,200 km of winter roads, and announced a further $20 million over four
      years, taking the contribution to $11 million a year. The Swift Creek report puts the grants at about
      $11 million a year from the federal government and about $13 million a year from Ontario. Ontario's
      program page says the roads lower the cost of transporting consumer goods, fuel and construction
      materials. They also let people drive south to stock up, but not everyone can afford the trip. When
      winter road conditions worsen, costs rise in two ways, through maintenance of the road and through a
      growing need for air freight. The draft report states that air transport is high in cost and limited in
      what it can carry, and that the winter road has been deemed insufficient for the community's needs.
  - title_en: Cost of living after a road
    content_en: >-
      The record does not settle whether an all-season road lowers the cost of living. The Swift Creek report
      states that all-season road access exists for a third of the fifteen communities and that two-thirds
      rely on expensive air service to move people and goods most of the year. Community members interviewed
      for the report agreed that freight cost is a major determinant of local prices. One member pointed to
      the one-way nature of freight, with goods brought in and often nothing carried out. A Northern Policy
      Institute study cited in the report found gasoline in Moosonee at about 148% of the Toronto price in
      2022; Moosonee is not one of the fifteen communities. Food in remote communities cost about 50% more
      than in southern communities from March 2024 through September 2025. Webequie's northern food basket
      rose 27.3% between September 2022 and September 2025, from $545 to $694. The average one-way airfare
      from the communities was $607 in February 2026, based on the least expensive online fares; from
      Nibinamik to Thunder Bay it was $1,290. The federal draft report notes that, given the high cost of fuel
      in remote communities, harvesting success is an important factor in whether people take part in
      land-based activities.


      Numerous community members told the Swift Creek authors that the Nutrition North Canada subsidy is not
      working, and some believe retailers pocket part or all of it; audit reports, one external expert and
      academic research suggest most of the subsidy is passed on to consumers, with the research estimating at
      least two-thirds. Several of those interviewed did not know the subsidy existed.


      The Swift Creek report says better road access can lower the cost of freight and travel between
      communities and larger centres, while it also opens communities and traditional lands to unwanted
      influences and pressures, which some community members are deeply concerned about. The regional
      assessment's interim report records an experience shared by a member of its working group, in which a
      road improved access and lowered the price of food but community members lost subsidies, and overall the
      cost of food increased. The Swift Creek report cites the Inuvik–Tuktoyaktuk Highway in the Northwest
      Territories, a 137 km two-lane gravel road completed in 2017 at about $299 million that replaced a
      winter-only ice road. The Northwest Territories estimates that it saves about $560,000 a year in winter
      road construction and maintenance. A study cited in the Swift Creek report found that food prices in
      Tuktoyaktuk increased after the road opened, mainly because the community lost Nutrition North freight
      subsidies.


      The Swift Creek report cites analysts who concluded that at Musselwhite, a mine served by an all-season
      road, food and housing costs continued to be affected by air freight dependency, short winter road
      seasons and retailer monopolies, and that food subsidies had not been found effective. For the northern
      diamond mines, the report says the more consequential effect on food costs was the disruption of the
      traditional food economy, which forced households to depend more on expensive imported food. No
      permanent all-season road was built to those mine sites, and the power infrastructure built for the
      mines was not extended to nearby communities. Benefits from projects flow only where there are
      geographic and commercial linkages between communities and projects.


      The report concludes that costs similar to those in the south are not likely, because some drivers of
      the cost of living cannot realistically be overcome. Cost of living is a cumulative-effect problem, in
      which factors compound one another and solutions can compound too. It is also a question of income, not
      only of costs. The regional assessment working group calls cost of living an urgent priority and
      commissioned the report.
  - title_en: Living on the muskeg
    content_en: >-
      Treaty 9 was first signed in 1905. The regional assessment's terms of reference record that the 1965
      Indian Welfare Services Agreement required families to live within the confines of the reserve. A
      working group member from a partner First Nation, quoted in the interim report, recalled stories of
      people trying to make a living in the muskeg and said: "we lost all these skills when we moved into the
      reserve." Traditional foods are generally healthier than what remote community stores sell. When
      traditional food sources are diminished, households must replace them with store-bought food at prices
      inflated by freight.


      The regional assessment's interim report records that some communities are exploring greenhouse projects
      and food distribution systems, and lists community-led studies on lake sturgeon. It states that
      community-driven monitoring and stewardship is essential to secure adequate baseline data. The Swift
      Creek report concludes that communities are making strides with community gardens and with cooperative
      and community-owned businesses.
  - title_en: The peatland and its water
    content_en: >-
      The Far North Science Advisory Panel estimated in 2010 that the region's wetlands hold as much water as
      Lake Erie; the interim report repeats the figure. The eastern 56 km of the Webequie road runs across
      peatland, and the peat along that half is 2 m to 4 m thick. The western 51 km is on mineral soil.


      The regional assessment lists the potential effect of development on mercury levels and other
      contaminants as a study priority. The Agency's analysis of the Eagle's Nest designation request
      describes the generation of methylmercury in peatland environments as an existing concern in the Ring of
      Fire region, a concern shared by Health Canada and Indigenous Services Canada. The Webequie assessment
      contains mercury and methylmercury analyses; one reviewer objected that the results are not presented in
      the main body of the draft assessment and sit in an appendix. Friends of the Attawapiskat River asked
      that the impact statement be updated to require a study of mercury on human health and the environment
      that accounts for the project and for legacy contamination. The federal draft report sets out the
      mechanism: on the floating section, changes to hydrology during construction or operation, especially
      after extreme rainfall, could cause groundwater impoundment or periodic surface flooding, and the
      resulting anoxic conditions could enhance methylmercury generation and increase its release into
      groundwater or surface water. Whether the regional assessment's own mercury work is complete is not
      established in the record. [NEEDS SOURCE: status of the regional assessment's mercury studies]


      The minimum Missisa caribou population was estimated at 745 from winter distribution surveys completed
      between 2009 and 2013, and was on a declining trend. Some First Nation Elders put habitat recovery after
      disturbance at more than 100 years. The proponent's own alternatives analysis notes that the chosen
      alignment, 2C, may allow the greatest ease of access for predators and hunters into undisturbed
      woodlands and peatlands.
  - title_en: The floating road design and its record
    content_en: >-
      Across the peatland the road is to be built without excavation. Geotextile or geogrid materials are
      placed on the surface of the peat and the embankment, typically 1.2 m high, is built on top. The
      proponent expects the peat to compress by about 40% of its thickness with the geosynthetics, against 50%
      or more, with greater instability, without them. No roadside ditches are proposed for the eastern
      portion. Instead, 900 mm equalisation culverts are to be set at intervals of 100 m to 250 m, the spacing
      to be confirmed in detailed design. The proponent says a permeable rock layer will support continuous
      movement of groundwater so that the hydrology of the peatlands continues to function. It lists, as work
      still to be done, soil, groundwater and ground surveys to further characterise the peat and groundwater
      flow, and confirmation of the culvert spacing.


      The proponent's position is that the floating road design, including the equalisation culverts, would
      not change the hydrological conditions of the peatlands. The federal draft report records that
      Environment and Climate Change Canada, Wildlife Conservation Society Canada, Constance Lake First Nation
      and Nibinamik First Nation expressed uncertainty that the design would maintain those conditions.


      Environment and Climate Change Canada answered the Agency's questions on the Marten Falls road's draft
      impact statement, having been asked to consider the Webequie road and the Northern Road Link as well.
      The department said it could not confidently assess likely and worst-case scenarios for maintaining
      long-term peatland function. It said road construction across peatland disrupts surface and subsurface
      water flows, which commonly creates flooded conditions upstream of a road and dry conditions downstream.
      It said the effectiveness of floating roads can diminish with subsidence over time, and that there was
      insufficient information on the criteria for culvert spacing, sizing and installation depth. It noted
      that the proponent's own assessment assigns high uncertainty to residual effects on hydrology. It also
      noted that an appendix anticipates peak traffic of 100 to 700 vehicles in 2046, a load that bears on how
      the road performs.


      Wildlife Conservation Society Canada wrote in February 2026 that there is only one outdated reference to
      support the claim that floating roads are logistically feasible, and that the road is not floating but
      supported by the compressed peat. A public comment on the registry asked whether floating roads and
      equalisation culverts have been tested in peatlands. Weenusk First Nation raised the lack of a hydrology
      study during the assessment and was not satisfied with the proponent's response. In its review of the
      draft report, Weenusk pointed to the section reporting uncertainty on whether the floating road design
      will maintain peatland hydrological conditions, and stated that no site-specific validation of the
      design methods was undertaken.


      Ontario's Ministry of Natural Resources stated that several of the final assessment's conclusions on
      peatland impacts and greenhouse gas emissions are not fully supported by the information provided. Given
      the anticipated peat compression of 40% to 50%, changes to water movement, vegetation loss and localised
      ditching, the ministry said it is reasonable to expect peatland impacts even with reduced-impact or
      floating road designs. It asked for a commitment to a peatland monitoring and mitigation program, given
      the sensitivity of the ecosystems and the scale of peat in the region. It asked for a commitment giving
      it the opportunity to review, at the detailed design stage, groundwater movement in peat under a
      floating road, the assessment of peatland compression under loading, and hydrological modelling related
      to climate change. The proponent replied that its predicted peatland impacts and emissions are robust
      and meet the requirements of the federal guidelines and the provincial terms of reference. It declined
      the ministry's request to measure carbon dioxide and methane emissions before, during and after
      construction.


      No study in the record validates a floating road with equalisation culverts in peatland of this kind;
      Weenusk states that no site-specific validation of the design methods was undertaken, and the natural
      resources ministry asked to review groundwater movement in peat under a floating road at the detailed
      design stage. The federal draft report's answer is monitoring: the Agency recommends that long-term
      water quality monitoring where country foods are harvested include methylmercury until a three-year
      trend analysis demonstrates that the project is unlikely to generate or transport methylmercury. The
      assessment assumes a 75-year operations phase.
  - title_en: The First Nations and their positions
    content_en: >-
      Ontario's ministry review lists 22 Indigenous communities that Webequie First Nation consulted: 16 on a
      rights basis, Webequie itself among them, and six on an interest basis. Nine First Nations and one
      council commented on the final provincial assessment: Aroland, Attawapiskat, Constance Lake,
      Eabametoong, Fort Albany, Kashechewan, Marten Falls, Nibinamik and Weenusk First Nations, and
      Mushkegowuk Council. The federal registry lists 297 results in its public comments for the project and,
      on the project page, a comments total of 157. In its request that the Eagle's Nest mine be designated
      for federal assessment, Neskantaga First Nation raised adverse effects on the Muketei River and
      ultimately the Attawapiskat River through changes in water quality; the Agency places the mine in the
      Muketei River watershed.


      The positions are not uniform. Nibinamik First Nation, in a letter of 22 May 2026, continues to support
      Webequie's desire to build an all-season road, has serious concerns with how Ontario and Canada have run
      the process, and is unable to give its free, prior and informed consent to the projects. Constance Lake
      First Nation remains broadly supportive of Webequie's wish to develop the road, and states that its
      review of the draft conditions identified concerns the proponent has not addressed. Ginoogaming First
      Nation insists that accommodation discussions commence immediately, and holds that by approving this
      road Canada and Ontario are implicitly approving the southernmost road segments. Kashechewan First
      Nation's review concentrates on impacts to water and flow patterns.


      Aroland First Nation states that the proponent characterises the road as a stand-alone right-of-way from
      the Webequie airport to Esker Camp, while the rationale for it is only logical if it connects to the
      provincial highway network. Aroland's position is that no approvals should be granted for resource roads
      until, at minimum, the regional assessment is completed; it recommends that any later connection to the
      Northern Road Link or the Marten Falls road, or any enabling of the Eagle's Nest mine, be treated as a
      change requiring formal review and amendment of the decision. Mushkegowuk Council wrote that the road is
      part of an immense project of roads leading to mines that must carry truckloads of concentrated ore to
      southern smelters; it called it spurious to assert that a road costing about $3.5 million a kilometre,
      about $500 million in total, is being built for the economic benefit of Webequie's small population. The
      proponent replied that it acknowledges the Council's concern about the wider context, including
      potential future mining projects.


      Fort Albany First Nation endorsed and adopted Attawapiskat's comments. It said it was unable to properly
      review all the materials, including more than 700 pages of additional addenda, that the comment period
      overlapped with its spring goose hunt, and that most of its members were evacuated at the time.
  - title_en: How the assessments were scoped
    content_en: >-
      On 8 October 2021 Ontario approved the road's terms of reference with amendments the Minister considered
      necessary. Two of those amendments require the proponent to consider other cumulative-effects
      assessments and the regional assessment. Each ends with the statement that this will not delay
      submission of the final environmental assessment, and the proponent determines how to use the
      information. Ontario's review noted that the final assessment had been submitted while the regional
      assessment information was not available. The proponent's alternatives analysis states that no regional
      or strategic assessment was applicable to it, and the comment-response tables state that there were no
      deliverable outputs from the regional assessment to consider. Ontario stated that it would not delay its
      decision on the road until the regional assessment is complete, and the Agency confirmed that the
      regional assessment creates no obligation on Ontario and does not affect project timelines.


      Aroland stated that many impacts are characterised as residual despite the likelihood that the road will
      function as part of a broader and interconnected regional road and industrial network. Friends of the
      Attawapiskat River cited the Supreme Court's 2010 decision in MiningWatch Canada v Canada on treating
      part of a project as the whole, and argued that the road cannot lawfully or credibly be assessed as an
      isolated road project. Wildlife Conservation Society Canada described the three roads as functionally
      interconnected as a single infrastructure corridor.


      The federal draft report states the Agency's view that the project, in combination with the proposed
      Marten Falls Community Access Road, the Northern Road Link and the Eagle's Nest project, is likely to
      reduce the availability of caribou within the project areas and alter movement patterns and range areas.
      Fort Albany states that the cumulative effects assessment does not include the Marten Falls road, and
      records that the proponent acknowledges the concern that effects on peatlands may be underestimated at a
      project scale. Ontario's environmental assessment branch wrote that it is not clear from the cumulative
      effects chapter how the Marten Falls findings were used. Some effects of the three roads and the mine
      were therefore considered together inside one project's assessment, while no assessment decided the
      corridor as a whole.


      According to Ontario's ministry review, the assessment submitted on 30 January 2026 did not include the
      complete assessment of effects on Indigenous communities, and sections 19 and 21 were missing
      information. The environment ministry made 58 comments on the 70-page draft human health risk assessment
      and reported that comments remained unresolved in the final submission.
  - title_en: The regional assessment
    content_en: >-
      In January 2023, fifteen First Nations and the Impact Assessment Agency agreed to co-lead a regional
      assessment in the Ring of Fire area, the first co-led with First Nations under the Impact Assessment
      Act. The signatory partners are Aroland, Attawapiskat, Constance Lake, Eabametoong, Fort Albany,
      Ginoogaming, Kashechewan Cree, Long Lake #58, Marten Falls, Missanabie Cree, Moose Cree, Neskantaga,
      Nibinamik, Webequie and Weenusk First Nations. Marten Falls approved the terms of reference in principle
      only, with community review ongoing. The terms of reference were finalised in January 2025; they provide
      that any other jurisdiction may ask in writing to become a party, and they list the province of Ontario
      as "TBD". No document in the record shows Ontario taking part. The Minister's letter of 15 February 2023
      set the arrangement under which the project assessments proceed according to their legislative time
      limits and separately from the regional assessment timeline.


      An interim report was submitted to the Chiefs and the Minister on 23 February 2026. It states that
      funding and capacity gaps in healthcare, especially mental health, need to be addressed urgently, before
      any additional development can be considered, and that comprehensive baseline monitoring must start
      immediately and before any development occurs. The regional assessment is not a decision-making process;
      it informs other decisions and does not determine whether a project can advance. The Ontario Rivers
      Alliance described it as having no binding authority over project approvals, and argued that the refusal
      to designate Eagle's Nest sets a precedent that undermines the regional assessment before it is
      complete. The 30-month conduct phase is scheduled to end with a final report to the Chiefs and the
      Minister on 20 July 2027; First Nation delegates on the working group have recommended requesting an
      extension.


      A science review for the regional assessment, published by Wyndham Research in March 2026 and drawing on
      interviews with 17 key informants, recommends a nested, watershed-based assessment framework and
      treating roads as regional infrastructure, to be assessed as access-enabling networks rather than
      standalone projects. It finds corridor proposals still largely proponent-driven, and network-level
      hydrologic and predator-access impacts under-assessed. The proponent's reply to Aroland was that
      relevant information from the regional assessment, if available, will be used to inform the project
      effects assessment.
  - title_en: The mine without a federal assessment
    content_en: >-
      Noront entered a voluntary agreement for a provincial assessment of the Eagle's Nest mine in September
      2011, and the terms of reference were approved in 2015. The federal assessment was terminated on 28
      August 2019 when the Impact Assessment Act came into force. Legislation effective 5 June 2025 terminated
      the voluntary agreement and revoked the terms-of-reference approval, and on 4 July 2025 the project was
      exempted under Schedule 3. Neskantaga First Nation asked the federal government to designate the mine
      for assessment. On 20 February 2026 the President of the Agency, exercising powers the Minister
      delegated on 5 December 2024, decided the project does not warrant designation. The Agency's analysis
      report prepared for that decision is of the view that there are means other than a federal impact
      assessment, such as existing federal and provincial mechanisms, that provide a framework to address the
      potential adverse effects. The analysis report places that decision within the amendments to the Act in
      force since 20 June 2024, which followed the Supreme Court of Canada's ruling of 13 October 2023 and
      which focus federal decision-making, including the authority to designate, on areas of clear federal
      jurisdiction.
  - title_en: Alternatives
    content_en: >-
      The provincial terms of reference focused the assessment to exclude a detailed assessment of
      alternatives to the project. Within the Webequie road's own analysis, three other modes were evaluated,
      a hoverbarge, a heavy-lift airship and a new rail corridor, and route 2C was preferred on cost, with the
      lowest preliminary cost, $91.45 million for 107 km; a separate preliminary estimate puts the capital
      cost of construction at about $700 million, plus or minus 40%. No assessment compared routes or
      transport modes for the corridor as a whole; the only comparison of modes is inside the Webequie road's
      own alternatives, and the science review calls network-level hydrologic and predator-access impacts
      under-assessed. That comparison deserves its own article.
  - title_en: The deposit at the end of the road
    content_en: >-
      The Ring of Fire lies more than 500 km northeast of Thunder Bay and contains chromite along with copper,
      nickel, platinum and titanium; Ontario projects over $22 billion for the province's economy over 30
      years. Eagle's Nest is planned as an underground mine producing about 3,000 tonnes of ore a day on a
      surface footprint of about 100 hectares. Cliffs sold its chromite claims to Noront in March 2015. The
      deposit and the mine deserve their own article.
