    kind: federal executive
    liveActorStatus: current
    fieldsCitedIn: [territory.transition, political.powerStructure, political.stabilityDrivers, capacity.steering, security.transnationalExposure, security.diplomacy, situation]
    currentPositionFromReport: >
      The executive is held by President Donald Trump, a Republican inaugurated in January 2025, governing with
      unified party control while 2026 apex-court doctrine expands presidential control of the executive branch;
      the administration voided the prior Nationally Determined Contribution targets, prioritised homeland and
      hemispheric security, asserted a "Trump corollary" to the Monroe Doctrine, and declared the Iran ceasefire
      over on 8 July 2026.
    layer2Draft:
      status: AI-drafted, unverified — collapsed by default
      citationType: Interpretation
      anchors: [political.powerStructure, capacity.steering, security.diplomacy, territory.transition, ndstrategy-2026, cnbc-iran-ceasefire-over]
      interests: >
        Consolidating executive control over the regulatory state rather than over ownership of production
        [economy.politicalEconomy], and converting that control into rapid action on a narrow priority set —
        homeland defence, border enforcement, counter-narcotics, hemispheric primacy and domestic mineral
        production [capacity.steering][security.transnationalExposure][capacity.approvals].
      resources: >
        Unified Republican control of the presidency and both chambers [political.powerStructure], command of the
        armed forces as commander-in-chief [political.stabilityDrivers], at-will removal of principal officers of
        independent agencies after Trump v. Slaughter [political.constitutionalSubstrate], executive orders that
        redirect agency priorities [capacity.approvals], and a demonstrated capacity for fast implementation where
        it has prioritised, as in the January 2026 Venezuela operation [capacity.steering][maduro-capture-wardept].
      constraints: >
        A five-seat working majority in the House with five vacancies [political.powerStructure], repeated inability
        to fund the government on time [capacity.steering], and an apex court that has cut against it as well as for
        it — striking the International Emergency Economic Powers Act tariffs, striking Executive Order 14160 on
        birthright citizenship, and signalling a central-bank carve-out from at-will removal
        [political.constitutionalSubstrate][crs-lsb11398-tariffs].
      likelyMoves: >
        Shift durable tariff authority toward Section 232 and Section 301 as the Section 122 surcharge expires by
        operation of law on 24 July 2026 absent congressional extension [crs-lsb11398-tariffs], and sustain strikes
        and the naval blockade against Iran alongside continued kinetic action against transnational criminal
        organisations in the hemisphere [cnn-iran-war-july18][security.internal].
      engagementMode: >
        negotiable / dealable. The report shows a counterpart that bargains — transactional burden-sharing with
        allies, a Pakistan-mediated ceasefire and an interim memorandum of understanding [security.diplomacy] — and
        one that exits deals unilaterally when it judges them unproductive [cnbc-iran-ceasefire-over].

