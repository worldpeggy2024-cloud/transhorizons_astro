      interests: >
        The report describes an institution whose revealed priority is holding the governing coalition together
        rather than reasserting institutional prerogative: it financed Immigration and Customs Enforcement and
        Customs and Border Protection through reconciliation rather than annual appropriations [house-approps-dhs-76day]
        and enacted a reconciliation act that raised projected deficits by $4.7 trillion while announced priorities
        were deficit reduction [capacity.steering].
      resources: >
        The appropriations power, the confirmation power over life-tenured judges [political.rightsAndChecks],
        plenary authority over the five inhabited territories and over tribal sovereignty
