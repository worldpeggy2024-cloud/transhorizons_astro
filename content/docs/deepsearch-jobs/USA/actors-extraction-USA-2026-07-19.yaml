        [house-approps-dhs-76day], and statutory tariff authorities that the executive must borrow
        [crs-lsb11398-tariffs].
      constraints: >
        Margins thin enough that a small bloc can withhold consent — the 76-day Homeland Security lapse followed
        Senate Democrats withdrawing support [crs-r48832-shutdowns] — and a fiscal baseline where mandatory spending
        and net interest, the fastest-growing outlay, crowd the discretionary space it actually controls
        [economy.politicalEconomy][economy.publicFinances].
      likelyMoves: >
        Face a forced decision on extending the Section 122 surcharge beyond 24 July 2026, and confront the
        unresolved refund exposure of more than $160 billion from the terminated tariffs [crs-lsb11398-tariffs].
      engagementMode: >
        veto-holder. Consent is required and has been withheld: appropriations lapses of 43 and 76 days show that
