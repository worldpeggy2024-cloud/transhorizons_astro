    currentPositionFromReport: |
      Dirige une force active de 1 298 099 militaires et au moins 128 bases outre-mer dans 51 pays avec des dépenses en baisse réelle, détient 15 % de MP Materials en actions convertibles à titre de premier actionnaire, et se voit orienté par la stratégie de défense nationale de 2026 vers la défense du territoire, l'appui à la frontière et les opérations dans l'hémisphère occidental, y compris des frappes sur des navires de trafiquants.
    layer2Draft:
      status: AI-drafted, unverified — collapsed by default
      citationType: Interpretation
      anchors:
        - security.military
        - economy.politicalEconomy
        - capacity.delivery
        - situation
      interests: |
        Maintenir une portée mondiale et la modernisation nucléaire tout en se réorientant vers l'hémisphère occidental, et sécuriser l'approvisionnement intérieur en minéraux critiques dont dépendent ses programmes [security.military][economy.politicalEconomy].
      resources: |
        954 milliards de dollars de dépenses en 2025 (33 % du total mondial), cinq armées et leurs composantes de réserve, le réseau de bases outre-mer, un portefeuille d'approvisionnement de plus de 750 milliards, et des instruments de participation et d'achat garanti utilisés auprès de fournisseurs nommés [security.military][economy.politicalEconomy][capacity.delivery].
      constraints: |
        Une baisse réelle de 7,5 % des dépenses en une seule année, un plafond d'effectifs autorisé fixé annuellement par le Congrès, un consentement des pays hôtes révocable, et un bilan vérifié de dépassements de coûts et de retards dans l'armement et les technologies de l'information [security.military][capacity.delivery].
      likelyMoves: |
        Poursuite d'opérations létales en régime permanent dans les Caraïbes et le Pacifique oriental, à un rythme de frappes croissant sur des engagements financiers décroissants; appui militaire continu aux opérations frontalières; nouveaux investissements directs dans des fournisseurs de minéraux [situation][security.transnationalExposure][economy.politicalEconomy].
      engagementMode: |
        Subordination à l'exécutif. Il relève du président à titre de commandant en chef et a exécuté les priorités que le rapport décrit comme rapidement mises en œuvre [political.stabilityDrivers][capacity.steering].
  - name: Le département de la Sécurité intérieure
    kind: federal executive
    liveActorStatus: En vigueur
    fieldsCitedIn:
      - political.stabilityDrivers
      - political.shockAbsorbers
      - capacity.steering
      - security.internal
    currentPositionFromReport: |
      A agi comme organisme fédéral responsable de la Federal Protection Mission sous laquelle des forces de la Garde en titre 10 ont été déployées dans trois villes, évalue la menace terroriste comme accrue et provenant d'auteurs isolés et de petits groupes, et a absorbé une interruption de crédits de 76 jours du 14 février au 30 avril 2026, la plus longue jamais enregistrée pour un seul département fédéral.
    layer2Draft:
      status: AI-drafted, unverified — collapsed by default
      citationType: Interpretation
      anchors:
        - security.internal
        - political.shockAbsorbers
        - capacity.steering
      interests: |
        Préserver les gains d'application des lois frontalières que consigne le rapport et maintenir les opérations de protection sur le territoire [security.internal].
      resources: |
        Le statut d'organisme responsable dans les missions interagences, le système national d'alerte terroriste, et un financement pluriannuel du personnel et des technologies frontalières adopté hors du cycle annuel par la Secure America Act [security.internal][capacity.steering].
      constraints: |
        Une exposition démontrée à l'échec budgétaire — une interruption départementale de 76 jours — et une dépendance à des forces de la Garde dont la Cour suprême a refusé d'autoriser la fédéralisation [political.shockAbsorbers][security.internal].
      likelyMoves: |
        Maintien d'une posture frontalière à forte interception et à faible remise en liberté, et poursuite des bulletins de menace liés au conflit au Moyen-Orient [security.internal].
      engagementMode: |
        Subordination à l'exécutif. Le rapport le place sous direction exécutive comme organisme responsable plutôt que comme organisme à mandat indépendant [political.stabilityDrivers].
  - name: Le service des douanes et de la protection des frontières (incluant le Border Patrol)
    kind: security or intelligence service
    liveActorStatus: En vigueur
    fieldsCitedIn:
      - economy.publicFinances
      - political.rightsAndChecks
      - capacity.steering
      - security.internal
      - security.transnationalExposure
    currentPositionFromReport: |
      Fait état d'un creux historique des interceptions frontalières et de quatorze mois consécutifs sans remise en liberté d'une personne appréhendée, a déclaré au Tribunal du commerce international avoir perçu environ 166 milliards de dollars au titre de l'autorité tarifaire invalidée auprès de quelque 330 000 importateurs, et est le service dans la garde duquel la Commission interaméricaine a tenu l'État responsable du décès d'Anastasio Hernández Rojas.
    layer2Draft:
      status: AI-drafted, unverified — collapsed by default
      citationType: Interpretation
      anchors:
        - security.internal
        - economy.publicFinances
        - political.rightsAndChecks
      interests: |
        Maintenir la posture d'application qui a produit l'effondrement des interceptions et la hausse des saisies, tout en traitant une exposition de remboursement sans précédent [security.internal][economy.publicFinances].
      resources: |
        Un financement pluriannuel du personnel au titre de la Secure America Act, l'appareil de perception des recettes, et l'appui militaire aux opérations frontalières interagences prévu par la stratégie de défense de 2026 [capacity.steering][security.internal].
      constraints: |
        Une obligation de remboursement d'environ 166 milliards de dollars sous ordonnance judiciaire, et un cadre d'emploi de la force que l'organe régional a jugé dépourvu des paramètres nécessaires à la protection des droits, sans réponse de l'État [economy.publicFinances][political.rightsAndChecks].
      likelyMoves: |
        Poursuite des opérations à fortes saisies et à faibles remises en liberté, et traitement continu des reliquidations pendant l'appel du gouvernement devant le Federal Circuit [security.internal][economy.publicFinances].
      engagementMode: |
        Subordination à l'exécutif. Il agit selon la priorité exécutive et est contrôlé principalement de l'intérieur de l'exécutif qui le commande; le constat défavorable marquant de la période est venu de l'extérieur de l'État [security.internal].
