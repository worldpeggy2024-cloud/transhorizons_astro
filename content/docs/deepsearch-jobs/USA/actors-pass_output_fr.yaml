domestic:
  - name: Le président Donald Trump et l'exécutif fédéral (l'administration)
    kind: federal executive
    liveActorStatus: En vigueur
    fieldsCitedIn:
      - territory.transition
      - society.language
      - economy.politicalEconomy
      - political.powerStructure
      - political.rightsAndChecks
      - political.stabilityDrivers
      - political.constitutionalSubstrate
      - capacity.approvals
      - capacity.steering
      - capacity.delivery
      - security.internal
      - security.military
      - security.transnationalExposure
      - security.diplomacy
      - situation
    currentPositionFromReport: |
      Détient la présidence avec une marge de 312 à 226 au collège électoral et un contrôle unifié des deux chambres, et élargit la discrétion exécutive par décret et par voie judiciaire plutôt que par la loi : annulation des cibles climatiques, prises de participation dans des entreprises nommées, fédéralisation de forces de police et de la Garde, retrait de 66 organisations internationales, guerre et opérations létales dans l'hémisphère sans autorisation du Congrès.
    layer2Draft:
      status: AI-drafted, unverified — collapsed by default
      citationType: Interpretation
      anchors:
        - political.powerStructure
        - political.constitutionalSubstrate
        - capacity.steering
        - security.diplomacy
        - situation
      interests: |
        Maximiser la discrétion exécutive unilatérale sur les nominations, les tarifs, l'emploi de la force et les engagements multilatéraux, et convertir cette discrétion en exécution rapide dans les domaines priorisés : sécurité intérieure et hémisphérique, application des lois frontalières et politique industrielle propre à chaque entreprise [capacity.steering][security.diplomacy].
      resources: |
        L'autorité de commandement de l'article II, le pouvoir de révocation tel qu'élargi dans les organismes collégiaux, les décrets et proclamations, des majorités de réconciliation dans les deux chambres, l'autorité issue du Home Rule Act pour le district de Columbia, et des lois de recours commercial sans plafond de taux [political.powerStructure][political.constitutionalSubstrate][situation].
      constraints: |
        Le seuil de 60 voix pour clore le débat sur une loi ordinaire, une majorité de 218 sièges à la Chambre avec quatre vacances, un contrôle judiciaire qui a tranché contre lui sur la Réserve fédérale, la citoyenneté par droit du sol et la fédéralisation de la Garde, et une trajectoire budgétaire où le service de la dette est la dépense qui croît le plus vite [political.powerStructure][political.constitutionalSubstrate][political.shockAbsorbers].
      likelyMoves: |
        Recours continu à la réconciliation, aux tarifs de recours commercial et à l'action exécutive plutôt qu'à la procédure ordinaire; nouveaux retraits au terme de la revue en cours; poursuite des opérations létales dans l'hémisphère occidental et du blocus de l'Iran [capacity.steering][security.diplomacy][situation].
      engagementMode: |
        Négociation / conclusion d'ententes, de façon transactionnelle. Le rapport décrit des mécanismes d'alignement établis entreprise par entreprise et un partage du fardeau transactionnel plutôt qu'institutionnel : les contreparties traitent directement avec l'exécutif plutôt que par des cadres permanents [political.stabilityDrivers][security.diplomacy].
  - name: Le département de la Défense (nommé département de la Guerre dans ses publications)
    kind: military
    liveActorStatus: En vigueur
    fieldsCitedIn:
      - economy.politicalEconomy
      - capacity.delivery
      - capacity.steering
      - political.stabilityDrivers
      - security.military
