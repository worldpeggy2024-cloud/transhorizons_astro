territory_geography_en: "The United States of America is a continental-scale country spanning the width of North America from the Atlantic to the Pacific, bordered by Canada to the north and Mexico to the south, with the non-contiguous state of Alaska in the continent's northwest and the Hawaiian archipelago in the central Pacific. The terrain is diversified: coastal plains to the east, interior lowlands, the Rocky Mountains and the western deserts. The periphery comprises five inhabited unincorporated territories — the Commonwealth of Puerto Rico, Guam, the United States Virgin Islands, the Commonwealth of the Northern Mariana Islands and American Samoa — plus uninhabited outlying possessions (Wake, Midway, Johnston, Palmyra, Howland, Baker, Jarvis, Navassa, Kingman Reef) [constitution-usa-1787][insular-cases-1901]. The physical arrangement is central to how the country functions as one country: large internal distances, densely settled coasts and a sparsely populated interior west."
territory_geography_fr: "Les États-Unis d'Amérique sont un pays à l'échelle continentale s'étendant sur toute la largeur de l'Amérique du Nord, de l'Atlantique au Pacifique, bordés par le Canada au nord et le Mexique au sud, auxquels s'ajoutent l'État non contigu de l'Alaska au nord-ouest du continent et l'archipel hawaïen au centre du Pacifique. Le relief est diversifié : plaines côtières à l'est, basses terres intérieures, montagnes Rocheuses et déserts de l'Ouest. La périphérie comprend cinq territoires non incorporés habités (le Commonwealth de Porto Rico, Guam, les îles Vierges américaines, le Commonwealth des îles Mariannes du Nord et les Samoa américaines) ainsi que des possessions périphériques inhabitées (Wake, Midway, Johnston, Palmyra, Howland, Baker, Jarvis, Navassa, récif Kingman) [constitution-usa-1787][insular-cases-1901]. L'agencement physique est déterminant pour le fonctionnement du pays comme entité unique : distances internes considérables, côtes densément peuplées et intérieur occidental faiblement peuplé."
territory_biosphere_en: |-
  The renewable base is vast, and its condition diverges by resource: forest area and managed fish stocks broadly hold, while groundwater and cropland do not [fao-forest-water-usa][noaa-status-of-stocks][usgs-water-use-united-states][usda-ers-major-land-uses].

  Forests hold. Forest area stood at about 310 million hectares in 2020 — roughly 8% of the world total, placing the United States among the five countries that together hold more than half of all forest — and North American forest area was broadly stable between 1990 and 2015, gains in the United States offsetting losses in Canada and Mexico [fao-forest-water-usa].

  Fisheries hold, but the constraint is knowledge as much as harvest. Of the 506 federally managed stocks in the 2023 report to Congress, 21 were subject to overfishing — an all-time low — and 47 were overfished; 50 stocks have been rebuilt since 2000 [noaa-status-of-stocks]. But only 364 of the 506 had a known overfishing status and only 263 a known overfished status: what is unmeasured is larger than what is depleted [noaa-status-of-stocks].

  Total water withdrawals are falling, but extraction is shifting from surface water, which refills each year, to groundwater, whose aquifers take decades to recharge. They reached 322 billion gallons per day in 2015 — 9% below 2010 and the lowest since before 1970 [usgs-water-use-united-states]. The aggregate decline masks a divergence within the resource: fresh surface-water withdrawals fell 14% to 198 billion gallons per day, while fresh groundwater withdrawals rose about 8% to 82.3 billion gallons per day [usgs-water-use-united-states]. Irrigation and thermoelectric power remained the two largest uses; crop irrigation alone withdrew an average of 105,497 million gallons per day over 2010–2020, of which 75,698 million was consumed rather than returned [usgs-water-use-united-states].

  Cropland is contracting. Agricultural land totalled 1.19 billion acres in 2017 — 52.5% of the land base, down from 59% in 1959 — with cropland down 15% and grazed forestland down 46% across that period [usda-ers-major-land-uses]. Against a total 2.26 billion acres in 2017: grassland pasture and range 659 million (29%), forest-use land 622 million (28%), cropland 390 million (17%), special uses such as parks and wildlife areas 318 million (14%), miscellaneous including wetlands and tundra 197 million (9%), and urban land 74 million (3%) [usda-ers-major-land-uses].
territory_biosphere_fr: |-
  La base renouvelable est vaste, et son état diverge selon la ressource : la superficie forestière et les stocks halieutiques gérés se maintiennent globalement; ce n'est pas le cas pour les eaux souterraines et les terres cultivées [fao-forest-water-usa][noaa-status-of-stocks][usgs-water-use-united-states][usda-ers-major-land-uses].

  Les forêts se maintiennent : la superficie forestière s'établissait à environ 310 millions d'hectares en 2020 (soit près de 8 % du total mondial; ce qui place les États-Unis parmi les cinq pays qui détiennent ensemble plus de la moitié des forêts de la planète) et la superficie forestière nord-américaine est demeurée globalement stable entre 1990 et 2015; les gains états-uniens compensant les pertes du Canada et du Mexique [fao-forest-water-usa].

  Les pêcheries se maintiennent, mais la contrainte tient autant à la connaissance qu'à la capture. Le suivi fédéral distingue deux mesures : le rythme de prélèvement (y a-t-il surpêche en cours) et l'état de la population (le stock est-il déjà trop bas). Sur les 506 stocks du rapport de 2023 au Congrès, 21 seulement faisaient l'objet d'une surpêche active (un creux historique) et 47 étaient à un niveau trop bas, tandis que 50 stocks ont été reconstitués depuis 2000 [noaa-status-of-stocks]. Toutefois, l'état de la plupart des stocks reste inconnu : le rythme de prélèvement n'était établi que pour 364 des 506 stocks, et le niveau de population pour seulement 263. Autrement dit, ce qui n'est pas mesuré dépasse ce qui est épuisé [noaa-status-of-stocks].

  Les prélèvements d'eau totaux diminuent, mais l'extraction se reporte des eaux de surface, qui se rechargent chaque année, vers les eaux souterraines, dont les nappes se reconstituent sur des décennies. Ils atteignaient 322 milliards de gallons par jour en 2015; 9 % de moins qu'en 2010 et le niveau le plus bas depuis avant 1970 [usgs-water-use-united-states]. Ce recul agrégé masque une divergence interne : les prélèvements d'eau douce de surface ont chuté de 14 % pour s'établir à 198 milliards de gallons par jour, tandis que les prélèvements d'eau douce souterraine ont augmenté d'environ 8 % pour atteindre 82,3 milliards (déplaçant l'extraction vers la ressource la moins renouvelable) [usgs-water-use-united-states]. L'irrigation et la production thermoélectrique sont demeurées les deux principaux usages; l'irrigation des cultures à elle seule a prélevé en moyenne 105 497 millions de gallons par jour sur la période 2010-2020, dont 75 698 millions ont été consommés plutôt que restitués au système [usgs-water-use-united-states].

  Les terres cultivées se contractent : les terres agricoles totalisaient 1,19 milliard d'acres en 2017 (soit 52,5 % de la base foncière, contre 59 % en 1959); les terres cultivées ayant reculé de 15 % et les terres forestières pâturées de 46 % sur cette période [usda-ers-major-land-uses]. Sur un total de 2,26 milliards d'acres en 2017 : prairies de pâturage et pâturages naturels 659 millions (29 %), terres à usage forestier 622 millions (28 %), terres cultivées 390 millions (17 %), usages spéciaux tels que parcs et aires de faune 318 millions (14 %), usages divers dont zones humides et toundra 197 millions (9 %), et terres urbaines 74 millions (3 %) [usda-ers-major-land-uses].
territory_minerals_en: "The United States holds a large mineral endowment but is heavily dependent on imports for the critical minerals that matter most, and that dependence deepened in 2025. The country was 100% net import-reliant on 16 nonfuel mineral commodities in 2025, up from 15 in 2024, and more than 50% import-reliant on 54 [usgs-mcs-2026]. The concentration is the vulnerability: China was the primary source for 14 of the most import-dependent critical minerals, supplying roughly 70% of rare earths and 55% of antimony [usgs-mcs-2026]. Total nonfuel mineral production was valued at $112 billion in 2025 — crushed stone the largest single commodity at $26.8 billion — a figure weighted toward construction aggregates rather than the battery-and-defence minerals driving the import reliance [usgs-mcs-2026]. The scope of concern is widening: the Geological Survey expanded its critical-minerals list from 50 commodities in 2022 to 60 in 2025, adding copper and silver for the first time [usgs-mcs-2026]. Reserve figures throughout are compiled by the Geological Survey as the estimating body [usgs-mcs-2026]."
territory_minerals_fr: "Les États-Unis disposent d'un vaste patrimoine minier, mais dépendent lourdement des importations pour les minéraux critiques les plus importants; cette dépendance s'est accentuée en 2025. Le pays était tributaire des importations à 100 % net pour 16 produits minéraux non énergétiques en 2025, contre 15 en 2024, et à plus de 50 % pour 54 d'entre eux [usgs-mcs-2026]. La concentration est la vulnérabilité : la Chine était la principale source de 14 des minéraux critiques les plus dépendants des importations, fournissant environ 70 % des terres rares et 55 % de l'antimoine [usgs-mcs-2026]. La production minérale non énergétique totale était évaluée à 112 milliards de dollars en 2025 (la pierre concassée constituant le principal produit à elle seule, à 26,8 milliards); chiffre qui penche vers les granulats de construction plutôt que vers les minéraux pour les batteries et la défense qui sont à l'origine de la dépendance aux importations [usgs-mcs-2026]. Le champ de préoccupation s'élargit : le United States Geological Survey a étendu sa liste de minéraux critiques de 50 produits en 2022 à 60 en 2025, y ajoutant le cuivre et l'argent pour la première fois [usgs-mcs-2026]. Les chiffres des réserves sont partout compilés par le Geological Survey, qui en est l'organisme estimateur [usgs-mcs-2026]."
territory_climate_en: |-
  The climate of the United States is dramatically regional — from Arctic and subarctic Alaska through the temperate continental interior and humid east to the arid Southwest and tropical Hawaii and territories — so any warming signal sits atop a highly varied baseline. 

  Observed warming is faster than the global mean: temperatures in the contiguous United States have risen 2.5°F and in Alaska 4.2°F since 1970, against roughly 1.7°F globally over the same period, with the continental United States including Alaska warming about 60% faster than the planet as a whole [nca5-fifth-national-climate-assessment]. Precipitation has diverged regionally: annual precipitation over 2002–2021 was 5%–15% above the 1901–1960 average across the central and eastern United States, while Hawaii and parts of the Southwest recorded decreases of 10%–15% over the same period [nca5-fifth-national-climate-assessment]. Sea level along the continental coastline has risen about 11 inches over the past century against 7 inches globally, and rose at 1.8 inches per decade over 1993–2020 against 1.3 inches globally, with the highest rates on the Gulf and Mid-Atlantic coasts (above 2.4 inches per decade), the lowest in the Pacific Northwest (0–1 inch per decade), and relative sea level fall in Southeast Alaska [nca5-fifth-national-climate-assessment]. The Southwest experienced the driest soil moisture of any equivalent period in at least 1,200 years over 2000–2021, and is the only region where the total area of unusually dry soil moisture is increasing [nca5-fifth-national-climate-assessment]. Extreme heat is concentrated in the West, which has seen the largest increase in days above 95°F since the 1980s, while across 50 large cities the average number of heatwaves has doubled since the 1980s and the heatwave season has lengthened from about 40 to about 70 days [nca5-fifth-national-climate-assessment]. Heavy precipitation has increased most in the Northeast (around 60% more extreme precipitation days) and Midwest (around 45%) [nca5-fifth-national-climate-assessment]. Billion-dollar weather and climate disasters arrived roughly every four months in the 1980s and now arrive roughly every three weeks, with 18 such events in 2022 [nca5-fifth-national-climate-assessment].

  Projections, each bound to its scenario and horizon: at a global warming level of 2°C relative to 1851–1900, average United States temperature is very likely to rise 4.4°F–5.6°F, with each further 1°C of global warming adding about 2.5°F and the largest increases in the north and west [nca5-fifth-national-climate-assessment]. Average sea level along United States coastlines is likely to stand 12–20 inches above 2000 levels by 2050 across the range of global warming levels, 4–12 inches in the Pacific Northwest but 20–27 inches in the western Gulf of Mexico, and at a 2°C global warming level 2–3 feet by 2100 and 2.5–5 feet by 2150; rises of 3–6 feet by 2100 and 5–12 feet by 2150 cannot be ruled out [nca5-fifth-national-climate-assessment]. Coastal flooding events that are currently damaging are projected to become more than ten times more frequent over the next 30 years [nca5-fifth-national-climate-assessment]. In the Southwest, the risk of a single dry year as severe as 2002 rises 8% at a 2°C warming level and 24% at 4°C; but the decades-long megadroughts, in which the soil stays dry year after year, are projected to worsen regardless of how far warming is limited [nca5-fifth-national-climate-assessment]. Under a very high emissions scenario (Shared Socioeconomic Pathway 5-8.5) the world is very likely to pass 2°C between 2033 and 2054; under a low scenario (Shared Socioeconomic Pathway 1-2.6) it is very likely not to cross that threshold at all [nca5-fifth-national-climate-assessment].

  Exposure and the capacity to meet it are unevenly distributed within the country, and the gap is measurable: low-income neighbourhoods, including those historically affected by redlining, can be as much as 12°F hotter during heatwaves than wealthier neighbourhoods in the same city and face substantially higher flood risk [nca5-fifth-national-climate-assessment]; Americans over 65 are several times more likely than younger people to die of heat-related cardiovascular disease [nca5-fifth-national-climate-assessment]. The country ranks among the high-readiness economies on adaptive capacity at national scale [ndgain-country-index] — which is precisely what conceals the problem: the binding constraint is not aggregate national capacity but its distribution across the exposed populations named above [nca5-fifth-national-climate-assessment].
territory_climate_fr: |-
  Le climat des États-Unis est fortement régionalisé : de l'Alaska arctique et subarctique à l'intérieur continental tempéré et à l'est humide, jusqu'au Sud-Ouest aride et aux tropiques d'Hawaï et des territoires; de sorte que tout signal de réchauffement s'inscrit sur une base de référence très variée. 

  Le réchauffement observé est plus rapide que la moyenne mondiale : les températures ont augmenté de 1.4 °C dans les États-Unis contigus et de 2.3 °C en Alaska depuis 1970, contre environ 0.9 °C à l'échelle mondiale sur la même période; les États-Unis continentaux, Alaska compris, se réchauffant environ 60 % plus vite que la planète dans son ensemble [nca5-fifth-national-climate-assessment]. Les précipitations ont divergé selon les régions : les précipitations annuelles sur 2002-2021 dépassaient de 5 à 15 % la moyenne de 1901-1960 dans le centre et l'est du pays, tandis qu'Hawaï et certaines parties du Sud-Ouest enregistraient des baisses de 10 à 15 % sur la même période [nca5-fifth-national-climate-assessment]. Le niveau de la mer le long du littoral continental s'est élevé d'environ 28 cm (11 pouces) au cours du dernier siècle, contre 18 cm (7 po) à l'échelle mondiale, et progressait de 4.6 cm (1,8 po) par décennie entre 1993 et 2020 contre 3.3 cm (1,3 po) à l'échelle mondiale; les taux les plus élevés se situant sur les côtes du Golfe et de l'Atlantique central (plus de 6 cm [2,4 po] par décennie), les plus faibles dans le Nord-Ouest pacifique (0 à 2.5 cm [1 po] par décennie), avec une baisse relative du niveau de la mer dans le sud-est de l'Alaska [nca5-fifth-national-climate-assessment]. Le Sud-Ouest a connu l'humidité des sols la plus faible de toute période équivalente depuis au moins 1 200 ans sur 2000-2021; c'est la seule région où la superficie totale de sols anormalement secs augmente [nca5-fifth-national-climate-assessment]. La chaleur extrême se concentre dans l'Ouest, qui a connu la plus forte hausse du nombre de jours au-dessus de 35 °C depuis les années 1980, tandis que, dans 50 grandes villes, le nombre moyen de vagues de chaleur a doublé depuis les années 1980 et que la saison des vagues de chaleur s'est allongée d'environ 40 à environ 70 jours [nca5-fifth-national-climate-assessment]. Les précipitations intenses ont le plus augmenté dans le Nord-Est (environ 60 % de jours de précipitations extrêmes en plus) et le Midwest (environ 45 %) [nca5-fifth-national-climate-assessment]. Les catastrophes météorologiques et climatiques à plus d'un milliard de dollars survenaient environ tous les quatre mois dans les années 1980 et surviennent désormais environ toutes les trois semaines, avec 18 événements de ce type en 2022 [nca5-fifth-national-climate-assessment].

  Projections, chacune liée à son scénario et à son horizon : à un niveau de réchauffement mondial de 2 °C par rapport à 1851-1900, la température moyenne des États-Unis augmentera très probablement de 2,4 à 3,1 °C, chaque degré Celsius supplémentaire de réchauffement mondial ajoutant environ 1,4 °C; les hausses les plus fortes touchant le nord et l'ouest [nca5-fifth-national-climate-assessment]. Le niveau moyen de la mer le long des côtes des États-Unis se situera probablement de 30 à 50 cm (12 à 20 p) au-dessus des niveaux de 2000 d'ici 2050, sur l'ensemble des niveaux de réchauffement (de 10 à 30 cm [4 à 12 po] dans le Nord-Ouest pacifique, mais de 50 à 70 cm [20 à 27 po] dans l'ouest du golfe du Mexique; à un niveau de réchauffement de 2 °C, de 0,6 à 0,9 m [2 à 3 pieds] d'ici 2100 et de 0,8 à 1,5 m [2,5 à 5 pi] d'ici 2150; des hausses de 0,9 à 1,8 m [3 à 6 pi] d'ici 2100 et de 1,5 à 3,7 [5 à 12 pi] d'ici 2150 ne peuvent être exclues [nca5-fifth-national-climate-assessment]. Les inondations côtières aujourd'hui dommageables deviendront, selon les projections, plus de dix fois plus fréquentes au cours des 30 prochaines années [nca5-fifth-national-climate-assessment]. Dans le Sud-Ouest, le risque d'une seule année aussi sèche que 2002 augmente de 8 % à un niveau de réchauffement de 2 °C et de 24 % à 4 °C; mais les mégasécheresses pluridécennales, lorsque le sol demeure sec année après année, devraient s'aggraver quel que soit le degré de limitation du réchauffement [nca5-fifth-national-climate-assessment]. Selon un scénario d'émissions très élevées (Shared Socioeconomic Pathway 5-8.5), le monde franchira très probablement les 2 °C entre 2033 et 2054; selon un scénario d'émissions faibles (Shared Socioeconomic Pathway 1-2.6), il ne franchira très probablement pas du tout ce seuil [nca5-fifth-national-climate-assessment].

  L'exposition et la capacité d'y faire face sont inégalement réparties à l'intérieur du pays, et l'écart est mesurable : les quartiers à faible revenu, y compris ceux historiquement touchés par le « redlining » (discrimination hypothécaire par quartier), peuvent être jusqu'à 6,5 °C plus chauds pendant les vagues de chaleur que les quartiers plus aisés de la même ville et sont exposés à un risque d'inondation nettement plus élevé [nca5-fifth-national-climate-assessment]; les personnes de plus de 65 ans sont plusieurs fois plus susceptibles que les plus jeunes de mourir d'une maladie cardiovasculaire liée à la chaleur [nca5-fifth-national-climate-assessment]. Le pays se classe parmi les économies à forte capacité d'adaptation à l'échelle nationale [ndgain-country-index]; ce qui masque précisément le problème : la contrainte déterminante n'est pas la capacité nationale globale, mais sa répartition entre les populations exposées nommées ci-dessus [nca5-fifth-national-climate-assessment].
territory_metabolism_en: |-
  The United States runs on high and rising energy throughput, a dense continental freight system, and physical distribution networks (water, broadband) that are extensive but ageing, and its self-sufficiency varies sharply by system. 

  Energy is abundant and domestically produced: after fifteen years of near-flat demand, electricity consumption has risen 2.1% annually over the past five years, driven by data centres and artificial intelligence, and is projected to keep growing 0.9%–1.6% per year through 2050 [eia-aeo-2026][eia-power-outlook-2026]. 

  Production is at record levels — natural gas reached 107 billion cubic feet per day and crude oil 13.6 million barrels per day in 2025 — with natural gas supplying about 40% of electricity generation, coal about 16%, and natural gas, solar and wind together roughly 60% [eia-aeo-2026][eia-power-outlook-2026]. Goods move at continental scale: the freight system carried about 20.2 billion tons in 2023, a daily average of 55.5 million tons, projected to grow about 1.2% per year through 2050, with trucks in the supply chain of all ten leading commodities [bts-freight-analysis-framework]. 

  Food self-sufficiency has quietly reversed: the country ran an agricultural trade surplus for nearly sixty years until 2019, but by 2025 imports exceeded exports by about $41 billion (a record deficit driven by high-value consumer imports) even as it remains the world's largest exporter of bulk grains and oilseeds [usda-ers-ag-trade-2026]. 

  The physical distribution networks are extensive but under strain: about 95% of homes and small businesses had access to fixed 100/20 megabit-per-second broadband by December 2024, but rural access lagged at 72% and more than 23% of people on Tribal lands lacked it [fcc-broadband-map-2024]; and the drinking-water system faces a $625 billion twenty-year investment need, two-thirds of it for ageing transmission and distribution pipes, with 9.2 million lead service lines still to replace [epa-dwinsa-2023].
territory_metabolism_fr: |-
  Les États-Unis fonctionnent sur un débit énergétique élevé et croissant, un système de fret continental dense et des réseaux de distribution physique (eau, télécommunications) vastes mais vieillissants; leur autosuffisance variant fortement d'un système à l'autre. L'énergie est abondante et produite sur le territoire : après quinze ans de demande quasi stable, la consommation d'électricité a augmenté de 2,1 % par an au cours des cinq dernières années, sous l'effet des centres de données et de l'intelligence artificielle, et devrait continuer de croître de 0,9 à 1,6 % par an jusqu'en 2050 [eia-aeo-2026][eia-power-outlook-2026]. 

  La production atteint des niveaux record (le gaz naturel a atteint 107 milliards de pieds cubes par jour et le pétrole brut 13,6 millions de barils par jour en 2025); le gaz naturel fournissant environ 40 % de la production d'électricité, le charbon environ 16 %, et le gaz naturel, le solaire et l'éolien ensemble environ 60 % [eia-aeo-2026][eia-power-outlook-2026]. 

  Les marchandises circulent à l'échelle continentale : le système de fret a transporté environ 20,2 milliards de tonnes en 2023, soit une moyenne quotidienne de 55,5 millions de tonnes, avec une croissance prévue d'environ 1,2 % par an jusqu'en 2050; les camions intervenant dans la chaîne d'approvisionnement des dix principales marchandises [bts-freight-analysis-framework]. 

  L'autosuffisance alimentaire s'est discrètement inversée : le pays a enregistré un excédent commercial agricole pendant près de soixante ans jusqu'en 2019; toutefois, en 2025 les importations dépassaient les exportations d'environ 41 milliards de dollars (déficit record tiré par des importations de produits de consommation à forte valeur) tout en demeurant le premier exportateur mondial de céréales et d'oléagineux en vrac [usda-ers-ag-trade-2026]. 

  Les réseaux de distribution physique sont vastes mais sous tension : environ 95 % des ménages et petites entreprises avaient accès à un service fixe à large bande de 100/20 mégabits par seconde à la fin de 2024, mais l'accès rural n'atteignait que 72 % et plus de 23 % des personnes vivant sur des terres autochtones en étaient privées [fcc-broadband-map-2024]; le système d'eau potable fait face à un besoin d'investissement de 625 milliards de dollars sur vingt ans, dont les deux tiers pour des conduites de transport et de distribution vieillissantes, avec 9,2 millions de branchements en plomb encore à remplacer [epa-dwinsa-2023].
territory_transition_en: "The United States has a widening gap between what it has pledged on climate and what its policies will deliver, and its emissions have begun to rise again. The Climate Action Tracker rates United States climate targets, action and finance as \"Critically Insufficient\" overall, with policies and action \"Highly Insufficient\" [climateactiontracker-usa]. The current administration voided the 2030 and 2035 Nationally Determined Contribution (NDC) targets set under the prior administration, and the Climate Action Tracker considers the United States to no longer hold a net-zero target [climateactiontracker-usa]. Under current policy, United States emissions are projected to fall 19%–30% below 2005 levels by 2030, excluding land use, land-use change and forestry (LULUCF), against the 29%–39% the prior administration was on track to deliver — roughly 600–800 million tonnes of carbon dioxide equivalent higher in 2030 [climateactiontracker-usa]. The delivered path is already turning the wrong way: after two decades of decline that left emissions about 20% below 2005 levels, energy-related carbon dioxide emissions rose 2% in 2025 (about 115 million tonnes) increasing across every sector, driven largely by a 13% rise in coal-fired electricity generation [eia-co2-emissions-2025]."
territory_transition_fr: "Les États-Unis présentent un écart croissant entre leurs engagements climatiques et ce que leurs politiques permettront de réaliser, et leurs émissions ont recommencé à augmenter. Le Climate Action Tracker juge les cibles, l'action et le financement climatiques des États-Unis « gravement insuffisants » dans l'ensemble; les politiques et l'action étant « très insuffisantes » [climateactiontracker-usa]. L'administration actuelle a annulé les cibles de contribution déterminée au niveau national (CDN) pour 2030 et 2035 fixées sous l'administration précédente, et le Climate Action Tracker considère que les États-Unis n'ont plus de cible de carboneutralité [climateactiontracker-usa]. Selon les politiques actuelles, les émissions des États-Unis devraient diminuer de 19 à 30 % sous les niveaux de 2005 d'ici 2030, hors utilisation des terres, changement d'affectation des terres et foresterie (UTCATF), contre les 29 à 39 % que l'administration précédente était en voie de réaliser; soit environ 600 à 800 millions de tonnes d'équivalent dioxyde de carbone de plus en 2030 [climateactiontracker-usa]. La trajectoire réelle s'inverse déjà : après deux décennies de baisse qui avaient ramené les émissions à environ 20 % sous les niveaux de 2005, les émissions de dioxyde de carbone liées à l'énergie ont augmenté de 2 % en 2025 (environ 115 millions de tonnes), en hausse dans tous les secteurs, sous l'effet surtout d'une progression de 13 % de la production d'électricité au charbon [eia-co2-emissions-2025]."
society_demographics_en: "The United States is a settler-and-immigrant society whose population growth has always depended on migration; and that growth has just slowed sharply. The population reached 341.8 million as of 1 July 2025, growing only 0.5% (about 1.8 million) over the year, the slowest pace since 2021 [census-poprelease-2026]. The slowdown was driven by a historic fall in net international migration, from 2.7 million the prior year to 1.3 million in July 2024–June 2025, projected to fall further to about 321,000 by July 2026 [census-poprelease-2026]. Natural change (births minus deaths) was about 519,000, roughly flat year-on-year but far below prior-decade levels [census-poprelease-2026]. The country is ageing: median age reached a record 39.1 in 2024, the population aged 65 and over rose to 61.2 million (18.0%, up from 12.4% in 2004) while children fell to 21.5%, and by 2024 nearly 45% of counties held more older adults than children [census-median-age-2025]. The growth that remains has shifted decisively south and west: the South grew 6.0% between 2020 and 2025 against 3.1% nationally, while the Northeast and Midwest lost population — and within the growing regions, gains concentrated not in the city cores, which grew sluggishly or declined, but in the exurban outlying counties on the fringes of metros such as Dallas, Atlanta, Charlotte and Nashville [census-poprelease-2026]."
society_demographics_fr: "Les États-Unis sont une société de colons et d'immigrants dont la croissance démographique a toujours reposé sur la migration; cette croissance vient de ralentir fortement. La population a atteint 341,8 millions au 1er juillet 2025, ne croissant que de 0,5 % (environ 1,8 million) sur l'année; le rythme le plus lent depuis 2021 [census-poprelease-2026]. Ce ralentissement découle d'une baisse historique de la migration internationale nette, passée de 2,7 millions l'année précédente à 1,3 million de juillet 2024 à juin 2025, et qui devrait encore diminuer jusqu'à environ 321 000 d'ici juillet 2026 [census-poprelease-2026]. L'accroissement naturel (naissances moins décès) s'est établi à environ 519 000, à peu près stable d'une année à l'autre, mais bien en deçà des niveaux de la décennie précédente [census-poprelease-2026]. Le pays vieillit : l'âge médian a atteint un record de 39,1 ans en 2024; la population de 65 ans et plus a atteint 61,2 millions (18,0 %, contre 12,4 % en 2004) tandis que la part des enfants tombait à 21,5 %, et en 2024 près de 45 % des comtés comptaient plus d'aînés que d'enfants [census-median-age-2025]. La croissance qui subsiste s'est déplacée nettement vers le sud et l'ouest : le Sud a crû de 6,0 % entre 2020 et 2025 contre 3,1 % à l'échelle nationale, tandis que le Nord-Est et le Midwest perdaient de la population; à l'intérieur des régions en croissance, les gains se sont concentrés non pas dans les cœurs urbains, en croissance faible ou en déclin, mais dans les comtés exurbains périphériques des agglomérations comme Dallas, Atlanta, Charlotte et Nashville [census-poprelease-2026]."
society_composition_en: "The United States population was about 340 million in 2024, of whom, counting those who reported a single race, roughly 56% were non-Hispanic White, 12% Black or African American, 6% Asian, and 1% American Indian or Alaska Native, alongside 20% Hispanic or Latino of any race [census-acs-dp05]. The Hispanic or Latino category is an ethnicity recorded independently of race, so its members are distributed across every racial category rather than forming a separate one [census-acs-dp05]. Cleavage geometry (Interpretation): across ethnicity, language and religion the fault lines are largely cross-cutting; the ethnicity category cuts across the racial categories by construction [census-acs-dp05], home language does not partition access to the national lingua franca [census-acs-language], and religious observance is not coextensive with either [pewresearch-religious-landscape]. The reinforcing line is partisan rather than ethnic: institutional trust splits sharply by party — 26% of Republicans versus 9% of Democrats expressed trust in the federal government in 2025, and responses track which party holds power rather than a stable underlying level [pew-trust-in-government] — and religious observance is increasingly aligned with partisan identity [pewresearch-religious-landscape]. The principal fault line therefore runs along partisan identity, which absorbs and organises the demographic differences rather than being produced by them."
society_composition_fr: "La population des États-Unis s'élevait à environ 340 millions en 2024, dont, parmi les personnes ayant déclaré une seule race, environ 56 % de Blancs non hispaniques, 12 % de Noirs ou Afro-Américains, 6 % d'Asiatiques et 1 % d'Amérindiens ou d'Autochtones de l'Alaska, auxquels s'ajoutent 20 % d'Hispaniques ou de Latino-Américains de toute race [census-acs-dp05]. La catégorie hispanique ou latino-américaine est une appartenance ethnique consignée indépendamment de la race; ses membres se répartissent donc dans toutes les catégories raciales plutôt que d'en former une distincte [census-acs-dp05]. Géométrie des clivages (interprétation) : entre l'ethnicité, la langue et la religion, les lignes de fracture sont largement transversales; la catégorie ethnique recoupe les catégories raciales par construction [census-acs-dp05], la langue parlée à la maison ne conditionne pas l'accès à la langue véhiculaire nationale [census-acs-language], et la pratique religieuse ne coïncide avec ni l'une ni l'autre [pewresearch-religious-landscape]. La ligne qui se renforce est partisane plutôt qu'ethnique : la confiance envers les institutions se divise fortement selon le parti : 26 % des Républicains contre 9 % des Démocrates déclaraient faire confiance au gouvernement fédéral en 2025, et les réponses suivent le parti au pouvoir plutôt qu'un niveau de fond stable [pew-trust-in-government]; et la pratique religieuse s'aligne de plus en plus sur l'identité partisane [pewresearch-religious-landscape]. La principale ligne de fracture court donc le long de l'identité partisane, qui absorbe et organise les différences démographiques au lieu d'en être le produit."
society_language_en: "English is the universal lingua franca and language of instruction, and language does not partition the country the way it does in many plural societies. About 78% of the population aged five and over speaks only English at home; roughly 22% speaks another language, overwhelmingly Spanish, which accounts for around 61% of non-English home languages and about 14% of the total population, followed at a distance by Chinese and Tagalog [census-acs-language]. The lived pattern is convergence, not division: among Spanish-speaking children aged five to seventeen, about 80% also speak English \"very well,\" so minority home languages rarely survive as barriers past the second generation [census-acs-language]. Language became politically salient in 2025: Executive Order 14224 (1 March 2025) designated English the official language of the United States for the first time in the country's history, revoking a 2000 mandate that had required federal agencies to provide assistance to people with limited English proficiency [eo-14224-english-2025]. The order is largely declaratory — it creates no enforceable right and requires no agency to change services — but it reframes a de facto lingua franca as a matter of official national identity, consistent with the administration's broader immigration posture [eo-14224-english-2025]."
society_language_fr: "L'anglais est la langue véhiculaire universelle et la langue d'enseignement; la langue ne divise pas le pays comme elle le fait dans bien des sociétés plurielles. Environ 78 % de la population de cinq ans et plus ne parle que l'anglais à la maison; à peu près 22 % parle une autre langue, très majoritairement l'espagnol, qui représente environ 61 % des langues parlées à la maison autres que l'anglais et à peu près 14 % de la population totale, suivi de loin par le chinois et le tagalog [census-acs-language]. La tendance vécue est la convergence, non la division : chez les enfants hispanophones de cinq à dix-sept ans, environ 80 % parlent aussi l'anglais « très bien », de sorte que les langues d'origine survivent rarement comme obstacles au-delà de la deuxième génération [census-acs-language]. La langue est devenue un enjeu politique en 2025 : le décret 14224 (1er mars 2025) a désigné l'anglais comme langue officielle des États-Unis pour la première fois de l'histoire du pays, révoquant un mandat de 2000 qui obligeait les organismes fédéraux à offrir de l'aide aux personnes ayant une maîtrise limitée de l'anglais [eo-14224-english-2025]. Le décret est largement déclaratoire (il ne crée aucun droit exécutoire et n'oblige aucun organisme à modifier ses services), mais il fait d'une langue véhiculaire de fait une question d'identité nationale officielle, en cohérence avec la posture migratoire plus large de l'administration [eo-14224-english-2025]."
society_religion_en: "The United States is a predominantly Christian country with a large and no-longer-growing religiously unaffiliated share. In the Pew Research Center's 2023–24 Religious Landscape Study, 62% of adults identify as Christian — 40% Protestant, 19% Catholic, 3% other Christian — 29% are religiously unaffiliated (5% atheist, 6% agnostic, 19% \"nothing in particular\"), and 7% belong to non-Christian religions, the largest being Judaism (2%), Islam, Buddhism and Hinduism (about 1% each) [pewresearch-religious-landscape]. The long trend is decline levelling off: the Christian share fell from 78% in 2007 to 62%, but has held between 62% and 64% since 2019, and the unaffiliated share has plateaued after decades of rapid growth [pewresearch-religious-landscape]. These are self-reported figures from a survey subject to social-desirability and sampling bias; the United States conducts no official religious census, so all national religion data comes from private surveys [pewresearch-religious-landscape]. The salient fault line is not between faiths but between the observant and the secular — and it is increasingly partisan: Pew finds the decline of Christian identity far more pronounced among political liberals than conservatives, so religious observance now tracks partisan alignment more closely than it tracks ethnicity or region [pewresearch-religious-landscape]."
society_religion_fr: "Les États-Unis sont un pays majoritairement chrétien où la part des personnes sans affiliation religieuse est importante et a cessé de croître. Dans l'étude Religious Landscape 2023-2024 du Pew Research Center, 62 % des adultes se déclarent chrétiens (40 % protestants, 19 % catholiques, 3 % autres chrétiens), 29 % sont sans affiliation religieuse (5 % athées, 6 % agnostiques, 19 % « rien en particulier ») et 7 % appartiennent à des religions non chrétiennes; les plus importantes étant étant le judaïsme (2 %), l'islam, le bouddhisme et l'hindouisme (environ 1 % chacun) [pewresearch-religious-landscape]. La tendance de fond est un déclin qui se stabilise : la part chrétienne est passée de 78 % en 2007 à 62 %, mais se maintient entre 62 et 64 % depuis 2019, et la part des personnes sans affiliation plafonne après des décennies de croissance rapide [pewresearch-religious-landscape]. Ces chiffres sont autodéclarés et proviennent d'une enquête sujette au biais de désirabilité sociale et d'échantillonnage; les États-Unis ne mènent aucun recensement religieux officiel, de sorte que toutes les données nationales sur la religion proviennent d'enquêtes privées [pewresearch-religious-landscape]. La ligne de fracture marquante n'oppose pas les confessions entre elles, mais les pratiquants aux laïques, et elle est de plus en plus partisane : le Pew constate que le déclin de l'identité chrétienne est bien plus prononcé chez les libéraux que chez les conservateurs, de sorte que la pratique religieuse suit désormais l'appartenance partisane de plus près que l'ethnicité ou la région [pewresearch-religious-landscape]."
society_wellbeing_en: |-
  The defining feature of United States health outcomes is that they are poor for the country's wealth. Life expectancy at birth reached a record 79.0 years in 2024 — up 0.6 year from 2023, 81.4 for females and 76.5 for males — yet remained 3.7 years below the comparable-country average of 82.7, even as the United States spent an estimated $14,775 per person on health care in 2024, more than any peer nation [nchs-mortality-2024][kff-life-expectancy-peers]. The gap has widened over decades: American life expectancy matched wealthy peers in 1980, then plateaued as theirs kept rising [kff-life-expectancy-peers]. Mortality is nonetheless improving at the margin: the age-adjusted death rate fell 3.8% to 722.1 per 100,000 in 2024, with 3.07 million registered deaths; heart disease (157.6 per 100,000), cancer (139.4) and unintentional injuries (53.3) led, while COVID-19 fell out of the top ten and suicide entered it at tenth [nchs-mortality-2024]. Infant mortality was 5.5 per 1,000 live births in 2024, statistically unchanged from 2023 [nchs-mortality-2024]. The mortality gradient by race is steep and understated in raw data: among males in 2024, age-adjusted death rates corrected for death-certificate misclassification ran from 1,213.0 per 100,000 for American Indian and Alaska Native men and 1,094.9 for Black men down to 454.2 for Asian men; and uncorrected series understate American Indian and Alaska Native deaths by 34%, systematically flattering the gradient [nchs-mortality-2024].

  Educational attainment is high and rising, and the racial gaps are narrow at high-school level but widen sharply at each degree above it. Among 25-to-29-year-olds in 2022, 95% had completed at least high school (up from 89% in 2010), 40% held a bachelor's degree or higher (up from 32%), and 10% a master's or higher [nces-condition-of-education]. The gaps widen at every level up: the bachelor's-or-higher rate ran 72% for Asian, 45% for White, 28% for Black and 25% for Hispanic 25-to-29-year-olds, while the associate's-or-higher rate ranged from 78% for Asian down to 19% for American Indian and Alaska Native [nces-condition-of-education]. The gradients are moving in opposite directions at different levels: the White–Hispanic high-school-completion gap narrowed from 25 to 9 points between 2010 and 2022, while the Asian–White gap at bachelor's level widened by 9 points [nces-condition-of-education]. Attainment is higher for females at every level, an 11-point sex gap among White 25-to-29-year-olds at bachelor's or higher [nces-condition-of-education].
society_wellbeing_fr: |-
  Le trait déterminant des résultats de santé aux États-Unis est qu'ils sont médiocres au regard de la richesse du pays. L'espérance de vie à la naissance a atteint un record de 79,0 ans en 2024 (en hausse de 0,6 an par rapport à 2023, soit 81,4 ans pour les femmes et 76,5 pour les hommes), mais demeurait inférieure de 3,7 ans à la moyenne des pays comparables (82,7 ans), alors même que les États-Unis dépensaient environ 14 775 $ par personne en soins de santé en 2024, plus que tout autre pays pair [nchs-mortality-2024][kff-life-expectancy-peers]. L'écart s'est creusé au fil des décennies : l'espérance de vie aux États-Unis égalait celle des pays riches comparables en 1980, puis a plafonné tandis qu'elle continuait de croître dans ces autres pays [kff-life-expectancy-peers]. La mortalité s'améliore néanmoins à la marge : le taux de mortalité normalisé selon l'âge a reculé de 3,8 % pour s'établir à 722,1 pour 100 000 en 2024, avec 3,07 millions de décès enregistrés; les cardiopathies (157,6 pour 100 000), le cancer (139,4) et les blessures non intentionnelles (53,3) venaient en tête, tandis que l'épidémie de COVID-19 sortait du top dix et que le suicide y entrait au dixième rang [nchs-mortality-2024]. La mortalité infantile s'établissait à 5,5 pour 1 000 naissances vivantes en 2024, statistiquement inchangée par rapport à 2023 [nchs-mortality-2024]. Le gradient de mortalité selon l'origine ethnique est marqué et sous-estimé dans les données brutes : chez les hommes en 2024, les taux de mortalité normalisés selon l'âge et corrigés pour tenir compte des erreurs de classification sur les certificats de décès allaient de 1 213,0 pour 100 000 chez les Amérindiens et Autochtones de l'Alaska et 1 094,9 chez les Noirs jusqu'à 454,2 chez les Asiatiques. Les séries non corrigées sous-estiment de 34 % les décès chez les Amérindiens et Autochtones de l'Alaska; ce qui atténue artificiellement le gradient [nchs-mortality-2024].

  Le niveau de scolarité est élevé et en hausse, et les écarts raciaux, étroits au secondaire, se creusent nettement à chaque diplôme supérieur. Chez les 25 à 29 ans en 2022, 95 % avaient terminé au moins le secondaire (contre 89 % en 2010), 40 % détenaient un diplôme universitaire de premier cycle ou plus (contre 32 %) et 10 % une maîtrise ou plus [nces-condition-of-education]. Ces écarts se creusent à chaque palier : le taux de baccalauréat ou plus atteignait 72 % chez les Asiatiques, 45 % chez les Blancs, 28 % chez les Noirs et 25 % chez les Hispaniques de 25 à 29 ans, tandis que le taux de diplôme d'associé ou plus allait de 78 % chez les Asiatiques à 19 % chez les Amérindiens et Autochtones de l'Alaska [nces-condition-of-education]. Les gradients évoluent en sens contraire selon le palier : l'écart Blancs–Hispaniques pour l'achèvement du secondaire s'est resserré de 25 à 9 points entre 2010 et 2022, tandis que l'écart Asiatiques–Blancs au baccalauréat se creusait de 9 points [nces-condition-of-education]. Le niveau de scolarité est plus élevé chez les femmes à chaque palier, avec un écart de 11 points entre les sexes chez les étudiants blancs de 25 à 29 ans au delà du premier cycle universitaire [nces-condition-of-education].
society_cohesion_en: "Cohesion in the United States is under strain along two different axes that behave oppositely. Institutional trust is low and partisan-sorted: just 17% of Americans said in 2025 they trust the federal government to do what is right most of the time, near the lowest in about 70 years, and the figure swings with power rather than measuring a stable underlying level — 26% of Republicans against 9% of Democrats in 2025, with Gallup's parallel series showing Republican confidence in the executive rising and Democratic confidence falling by comparable margins after the 2024 change of administration [pew-trust-in-government][gallup-confidence-institutions]. Interpersonal trust is the deeper problem, and it is not partisan: the share of Americans saying most people can be trusted fell from 46% in 1972 to 34% by the 2020s, and the decline runs across liberals, conservatives and moderates alike [pew-interpersonal-trust]. The erosion is generational — in 2026 polling, 77% of those born before 1960 said most people can be trusted, against 35% of those born in the 2000s — so it deepens as older cohorts are replaced [marquette-trust-2026]. The society's institutional trust divides it by party; its social trust is thinning across the whole population regardless of party, and each cohort enters adulthood trusting others less than the last."
society_cohesion_fr: "La cohésion aux États-Unis subit des tensions selon deux axes distincts qui évoluent en sens contraire. La confiance envers les institutions est faible et clivée selon le parti : seuls 17 % des États-Uniens déclaraient en 2025 faire confiance au gouvernement fédéral pour agir correctement la plupart du temps (niveau proche du plus bas en une soixantaine d'années). Ce chiffre varie selon le parti au pouvoir plutôt que de mesurer un niveau de fond stable : 26 % chez les Républicains contre 9 % chez les Démocrates en 2025; la série parallèle de Gallup montrant la confiance républicaine envers l'exécutif en hausse et la confiance démocrate en baisse dans des proportions comparables après le changement d'administration de 2024 [pew-trust-in-government][gallup-confidence-institutions]. La confiance interpersonnelle constitue le problème plus profond, et elle n'est pas partisane : la part des États-Uniens estimant qu'on peut faire confiance à la plupart des gens est passée de 46 % en 1972 à 34 % dans les années 2020,; recul qui touche autant les libéraux que les conservateurs et les modérés [pew-interpersonal-trust]. L'érosion est générationnelle (dans les sondages de 2026, 77 % des personnes nées avant 1960 estimaient qu'on peut faire confiance à la plupart des gens, contre 35 % de celles nées dans les années 2000), de sorte qu'elle s'accentue à mesure que les cohortes âgées sont remplacées [marquette-trust-2026]. La confiance institutionnelle divise la société selon le parti; sa confiance sociale s'amincit dans l'ensemble de la population sans égard au parti; chaque cohorte entrant dans l'âge adulte en se fiant aux autres moins que la précédente."
economy_realEconomy_en: |-
  The United States is a diversified economy in which services dominate both production and employment, and the country lives on domestic consumption, finance, technology and health care. Growth is moderate and set to firm in 2026, with the generative artificial intelligence (AI) and data-centre buildout the leading impulse behind business investment. 

  Of 159.0 million nonfarm payroll jobs in June 2026, private service-providing industries account for 114.1 million (71.8%), goods-producing industries for 21.5 million (13.5%) and government for 23.4 million (14.7%) [bls-empsit-june2026]. Within services, trade, transportation and utilities employ 28.7 million, health care and social assistance 23.9 million — more than the entire goods-producing sector — professional and business services 22.5 million, and financial activities 9.1 million; manufacturing employs 12.6 million, or 7.9% of nonfarm payrolls [bls-empsit-june2026]. Nonfarm employment rose 57,000 in June 2026, a pace in line with the average monthly gain of 36,000 over the prior twelve months, and the April and May figures were revised down by a combined 74,000 [bls-empsit-june2026]. The unemployment rate was 4.2% in June 2026, with 7.1 million people unemployed and a labour-force participation rate of 61.5%, both rate and level little changed over the year; the number of people jobless for 27 weeks or longer rose by 286,000 over that year to 1.9 million, 27.3% of all unemployed [bls-empsit-june2026]. 

  Real gross domestic product (GDP) grew 2.1% in 2025; by industry that year, real value added rose 2.7% in private services-producing industries, 1.2% in private goods-producing industries and less than 0.1% in government [bea-gdp-q4-2025-third]. The Congressional Budget Office (CBO) projects 2.2% growth in 2026, an acceleration it attributes to the 2025 reconciliation act and to the rebound following the late-2025 lapse in discretionary appropriations [cbo-budget-outlook-2026]. Real business fixed investment is projected to grow 3.9% in 2026, driven by generative AI and data-centre investment [cbo-budget-outlook-2026][eia-aeo-2026]. Employment in the information sector stood at 2.8 million in June 2026, about 89,000 below its level a year earlier, while computer systems design and related services employed 2.4 million [bls-empsit-june2026]. Nonfuel mineral production was valued at $112 billion in 2025, up 5.6% [usgs-mcs-2026].
economy_realEconomy_fr: |-
  Les États-Unis ont une économie diversifiée où les services dominent tant la production que l'emploi; le pays vit de la consommation intérieure, de la finance, de la technologie et de la santé. La croissance est modérée et devrait se raffermir en 2026, l'essor de l'intelligence artificielle (IA) générative et des centres de données constituant le principal ressort de l'investissement des entreprises. 

  Sur 159,0 millions d'emplois salariés non agricoles en juin 2026, les services privés en comptent 114,1 millions (71,8 %), les industries productrices de biens 21,5 millions (13,5 %) et les administrations publiques 23,4 millions (14,7 %) [bls-empsit-june2026]. Au sein des services, le commerce, le transport et les services d'utilité publique emploient 28,7 millions de personnes, les soins de santé et l'aide sociale 23,9 millions (davantage que l'ensemble du secteur des biens), les services professionnels et aux entreprises 22,5 millions et les activités financières 9,1 millions; la fabrication en emploie 12,6 millions, soit 7,9 % des emplois non agricoles [bls-empsit-june2026]. L'emploi non agricole total a progressé de 57 000 en juin 2026, rythme comparable au gain mensuel moyen de 36 000 enregistré au cours des douze mois précédents, et les données d'avril et de mai ont été révisées à la baisse de 74 000 au total [bls-empsit-june2026]. Le taux de chômage s'établissait à 4,2 % en juin 2026, avec 7,1 millions de personnes au chômage et un taux d'activité de 61,5 %, taux et effectif ayant peu varié sur un an. Le nombre de personnes sans emploi depuis 27 semaines ou plus a augmenté de 286 000 sur cette même année pour atteindre 1,9 million, soit 27,3 % de l'ensemble des chômeurs [bls-empsit-june2026]. 

  Le produit intérieur brut (PIB) réel a progressé de 2,1 % en 2025; par industrie cette année-là, la valeur ajoutée réelle a augmenté de 2,7 % dans les services privés, de 1,2 % dans les industries privées productrices de biens et de moins de 0,1 % dans les administrations publiques [bea-gdp-q4-2025-third]. Le Congressional Budget Office (CBO) prévoit une croissance de 2,2 % en 2026, accélération qu'il attribue à la loi de réconciliation de 2025 et au rebond consécutif à l'interruption des crédits discrétionnaires de la fin de 2025 [cbo-budget-outlook-2026]. L'investissement fixe des entreprises devrait progresser de 3,9 % en 2026, tiré par l'IA générative et l'investissement dans les centres de données [cbo-budget-outlook-2026][eia-aeo-2026]. L'emploi dans le secteur de l'information s'établissait à 2,8 millions en juin 2026, soit environ 89 000 de moins qu'un an plus tôt, tandis que la conception de systèmes informatiques et les services connexes employaient 2,4 millions de personnes [bls-empsit-june2026]. La production minière non combustible a été évaluée à 112 milliards de dollars en 2025, en hausse de 5,6 % [usgs-mcs-2026].
economy_publicFinances_en: |-
  The federal government runs large structural deficits and rising debt. The Congressional Budget Office (CBO) projects a fiscal-year 2026 deficit of $1.9 trillion, equal to 5.8% of gross domestic product (GDP) against a 50-year average of 3.8%, on outlays of 23.3% of GDP and revenues 17.5% [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. Federal debt held by the public (that is, excluding securities held by the federal government's own trust funds) rises from 101% of GDP in 2026 to a projected 120% by 2036, above any level in the country's history and past the prior 1946 peak of 106% [cbo-budget-outlook-2026]. Net interest outlays reach $1.0 trillion in 2026 and are projected to double to $2.1 trillion, or 4.6% of GDP, by 2036 [cbo-budget-outlook-2026]. 

  Monetary policy is on hold with inflation above target: the Federal Open Market Committee held the federal funds target range at 3.50–3.75% in July 2026, judging inflation still elevated relative to its 2% goal and attributing that in part to supply shocks raising prices in sectors including energy [fomc-statement-july-2026]. Consumer Price Index (CPI) inflation ran at 3.5% over the twelve months to June 2026, with the index excluding food and energy up 2.6% and the energy index up 15.7% [bls-cpi-june2026]. 
  The country no longer holds a top rating from either agency that has published a recent sovereign action: Moody's downgraded its long-term issuer and senior unsecured ratings to Aa1 from Aaa in May 2025 [moodys-us-rating], and Standard & Poor's rates the country AA+, with a stable outlook resting on the economy's resilience and on deficits it judges high but not rising [sp-us-rating-2025].
economy_publicFinances_fr: |-
  Le gouvernement fédéral accuse d'importants déficits structurels et une dette croissante. Le Congressional Budget Office (CBO) prévoit pour l'exercice 2026 un déficit de 1 900 milliards de dollars, soit 5,8 % du produit intérieur brut (PIB) contre une moyenne de 3,8 % sur cinquante ans : les dépenses représentant 23,3 % du PIB et les recettes 17,5 % [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. La dette fédérale détenue par le public (c'est-à-dire hors titres détenus par les fonds fiduciaires fédéraux eux-mêmes) passe de 101 % du PIB en 2026 à 120 % projetés en 2036, au-delà de tout niveau atteint dans l'histoire du pays et du pic antérieur de 106 % de 1946 [cbo-budget-outlook-2026]. Les intérêts nets atteignent 1 000 milliards de dollars en 2026 et devraient doubler pour atteindre 2 100 milliards, soit 4,6 % du PIB, d'ici 2036 [cbo-budget-outlook-2026]. 

  La politique monétaire est en pause, l'inflation demeurant supérieure à la cible : le Federal Open Market Committee a maintenu en juillet 2026 la fourchette cible du taux des fonds fédéraux à 3,50-3,75 %, jugeant l'inflation encore élevée par rapport à sa cible de 2 % (que le Comité mesure sur l'indice des dépenses de consommation personnelle [personal consumption expenditures, PCE]), distinct de l'indice des prix à la consommation [IPC]) et l'attribuant en partie à des chocs d'offre ayant fait monter les prix dans certains secteurs, dont l'énergie [fomc-statement-july-2026]. Sur l'IPC, les prix ont progressé de 3,5 % sur les douze mois clos en juin 2026; l'indice hors alimentation et énergie augmentant de 2,6 % et celui de l'énergie, de 15,7 % [bls-cpi-june2026]. 
  Le pays ne détient plus la note maximale d'aucune des agences ayant publié une décision souveraine récente : Moody's a abaissé en mai 2025 sa note d'émetteur à long terme et celle de sa dette non garantie de premier rang de Aaa à Aa1 [moodys-us-rating], et Standard & Poor's attribue au pays la note AA+, assortie d'une perspective stable fondée sur la résilience de l'économie et sur des déficits qu'elle juge élevés, mais non croissants [sp-us-rating-2025].
economy_externalVulnerability_en: |-
  The United States runs a large and persistent deficit in goods, partly offset by a services surplus, and finances the gap by borrowing abroad on terms no other borrower obtains. Exports of goods and services were $3,432.3 billion in 2025 against imports of $4,333.8 billion, a deficit of $901.5 billion — $2.1 billion narrower than 2024, but composed of a goods deficit that widened $25.5 billion to $1,240.9 billion and a services surplus that grew 8.9% to $339.5 billion [bea-census-trade-annual-2025]. The composition is asymmetric: goods imports rose $143.2 billion, led by capital goods at $165.9 billion, within which computers rose $101.4 billion, computer accessories $42.7 billion and telecommunications equipment $30.3 billion, while services exports rose $82.1 billion, led by other business services, charges for the use of intellectual property, and financial services [bea-census-trade-annual-2025]. Goods-partner concentration is broad rather than narrow, and it shifted sharply in 2025: the largest bilateral goods deficits were with the European Union ($218.8 billion), mainland China ($202.1 billion), Mexico ($196.9 billion), Vietnam ($178.2 billion) and Taiwan ($146.8 billion), against surpluses with the Netherlands ($60.7 billion), South and Central America ($52.4 billion) and the United Kingdom ($32.2 billion) [bea-census-trade-annual-2025]. The deficit with China fell $93.4 billion as imports from China dropped $130.4 billion to $308.4 billion, while the deficits with Taiwan and Vietnam rose $73.0 billion and $54.7 billion [bea-census-trade-annual-2025]. Measured at end-2025 rather than as a full-year average, China's share of United States goods imports had fallen to 7.7% from 13.2% in 2024, which the International Monetary Fund reads as substitution across suppliers rather than a reduction in import demand [imf-art-iv-usa-2026].

  Energy and food run in opposite directions. Total energy exports reached a record 31 quadrillion British thermal units (quads) in 2025 against imports of 21 quads, giving record net exports of 11 quads, 20% above the previous record; petroleum supplied 63% of exports and natural gas a record 9 quads, or 29% [eia-energy-trade-2025]. Petroleum is simultaneously the largest single import at 83% of the total, and natural gas imports from Canada remain important for balancing seasonal demand [eia-energy-trade-2025]. Agriculture has reversed within five years: fiscal 2021 and fiscal 2022 closed in surplus ($8.5 billion and $1.9 billion), followed by deficits of $17.3 billion in fiscal 2023, $31.9 billion in fiscal 2024 and $43.7 billion in fiscal 2025, when exports of $175.6 billion met imports of $219.4 billion; the fiscal 2026 deficit is forecast at $29.0 billion [usda-aes-136].

  Foreign holdings of federal debt totalled approximately $9.2 trillion in December 2025, equal to 31% of publicly held debt of $30.1 trillion — a share down from 34% in December 2021 because total debt grew faster than foreign holdings [crs-rs22331-foreign-holdings]. Governmental sources hold 41.9% of that ($3.9 trillion) and private investors 58.1% ($5.4 trillion) [crs-rs22331-foreign-holdings]. The largest country holdings in December 2025 were Japan at $1,185.5 billion (12.8% of foreign holdings), the United Kingdom at $866.0 billion (9.3%) and mainland China at $683.5 billion (7.4%) [treasury-tic-debt-holders]. China's holdings have fallen in both nominal terms and share, from 13.4% of all foreign holdings in December 2021 [crs-rs22331-foreign-holdings]. Country attribution is weaker than it appears: the Treasury records the location of a holding, not the nationality of its holder, so securities held for third-country clients in Belgium, Luxembourg, the Cayman Islands or Switzerland are attributed to those jurisdictions [crs-rs22331-foreign-holdings].

  The reserve-currency position removes the financing constraint smaller economies face, but not the accumulating claim. The current-account deficit was 3.7% of gross domestic product (GDP) in 2025, against roughly 2% in 2013–19, and the net international investment position now exceeds −80% of GDP, widened by government external borrowing and by non-resident inflows into United States equities and corporate debt [imf-art-iv-usa-2026]. The composition of that funding has shifted from official-sector holders toward non-bank private investors whose behaviour is more price- and risk-sensitive, which the International Monetary Fund (IMF) names as the principal external vulnerability: an abrupt shift in portfolio preferences could force a disorderly rebalancing [imf-art-iv-usa-2026]. The Fund judged the 2025 external position moderately weaker than medium-term fundamentals and appropriate policies imply, attributing the misalignment largely to the chronic federal deficit, which weakens the current account and appreciates the dollar — the external finding restates the fiscal one rather than adding a second [imf-art-iv-usa-2026]. The country holds no IMF program; the Fund's engagement is annual Article IV surveillance, last concluded on 1 April 2026 [imf-art-iv-usa-2026]. On physical supply the exposure inverts: the country was 100% net import reliant on 16 nonfuel mineral commodities in 2025, with China the primary source for 14 of the most import-dependent critical minerals [usgs-mcs-2026].
economy_externalVulnerability_fr: |-
  Les États-Unis accusent un déficit important et persistant sur les biens, partiellement compensé par un excédent sur les services, et financent l'écart en empruntant à l'étranger à des conditions qu'aucun autre emprunteur n'obtient. Les exportations de biens et services se sont établies à 3 432,3 milliards de dollars en 2025 contre 4 333,8 milliards d'importations, soit un déficit de 901,5 milliards; 2,1 milliards de moins qu'en 2024, mais composé d'un déficit sur les biens qui s'est creusé de 25,5 milliards pour atteindre 1 240,9 milliards et d'un excédent sur les services en hausse de 8,9 % à 339,5 milliards [bea-census-trade-annual-2025]. La composition est asymétrique : les importations de biens ont augmenté de 143,2 milliards, tirées par les biens d'équipement à hauteur de 165,9 milliards, dont les ordinateurs pour 101,4 milliards, les accessoires informatiques pour 42,7 milliards et le matériel de télécommunication pour 30,3 milliards, tandis que les exportations de services progressaient de 82,1 milliards, portées par les autres services aux entreprises, les redevances d'utilisation de la propriété intellectuelle et les services financiers [bea-census-trade-annual-2025]. La concentration des partenaires sur les biens est large plutôt qu'étroite, et elle s'est nettement déplacée en 2025 : les principaux déficits bilatéraux visaient l'Union européenne (218,8 milliards), la Chine continentale (202,1 milliards), le Mexique (196,9 milliards), le Vietnam (178,2 milliards) et Taïwan (146,8 milliards), contre des excédents avec les Pays-Bas (60,7 milliards), l'Amérique du Sud et centrale (52,4 milliards) et le Royaume-Uni (32,2 milliards) [bea-census-trade-annual-2025]. Le déficit avec la Chine a reculé de 93,4 milliards, les importations chinoises chutant de 130,4 milliards à 308,4 milliards, tandis que les déficits avec Taïwan et le Vietnam augmentaient de 73,0 et 54,7 milliards [bea-census-trade-annual-2025]. Mesurée en fin d'année 2025 plutôt qu'en moyenne annuelle, la part de la Chine dans les importations de biens des États-Unis était tombée à 7,7 %, contre 13,2 % en 2024; ce que le Fonds monétaire international interprète comme une substitution entre fournisseurs plutôt que comme une réduction de la demande d'importation [imf-art-iv-usa-2026].

  L'énergie et l'alimentation évoluent en sens inverse. Les exportations totales d'énergie ont atteint un record de 31 quadrillions d'unités thermiques britanniques (quads) en 2025, contre 21 quads d'importations, soit des exportations nettes record de 11 quads, en hausse de 20 % par rapport au record précédent; le pétrole a fourni 63 % des exportations et le gaz naturel un record de 9 quads, soit 29 % [eia-energy-trade-2025]. Le pétrole constitue simultanément la première importation, à 83 % du total, et les importations de gaz naturel en provenance du Canada demeurent importantes pour équilibrer la demande saisonnière [eia-energy-trade-2025]. L'agriculture s'est renversée en cinq ans : les exercices 2021 et 2022 se sont soldés par des excédents (8,5 et 1,9 milliards), suivis de déficits de 17,3 milliards à l'exercice 2023, de 31,9 milliards à l'exercice 2024 et de 43,7 milliards à l'exercice 2025, où 175,6 milliards d'exportations ont fait face à 219,4 milliards d'importations; le déficit de l'exercice 2026 est prévu à 29,0 milliards [usda-aes-136].

  Les avoirs étrangers en dette fédérale s'élevaient à environ 9 200 milliards de dollars en décembre 2025, soit 31 % de la dette détenue par le public, qui atteignait 30 100 milliards; part en recul par rapport aux 34 % de décembre 2021, la dette totale ayant crû plus vite que les avoirs étrangers [crs-rs22331-foreign-holdings]. Les sources gouvernementales en détiennent 41,9 % (3 900 milliards) et les investisseurs privés 58,1 % (5 400 milliards) [crs-rs22331-foreign-holdings]. Les principaux avoirs par pays en décembre 2025 étaient ceux du Japon, à 1 185,5 milliards (12,8 % des avoirs étrangers), du Royaume-Uni, à 866,0 milliards (9,3 %), et de la Chine continentale, à 683,5 milliards (7,4 %) [treasury-tic-debt-holders]. Les avoirs chinois ont diminué tant en valeur nominale qu'en part, contre 13,4 % de l'ensemble des avoirs étrangers en décembre 2021 [crs-rs22331-foreign-holdings]. L'attribution par pays est plus fragile qu'il n'y paraît : le Trésor enregistre le lieu de détention et non la nationalité du détenteur, de sorte que les titres détenus pour des clients de pays tiers en Belgique, au Luxembourg, aux îles Caïmans ou en Suisse sont attribués à ces territoires [crs-rs22331-foreign-holdings].

  La position de monnaie de réserve lève la contrainte de financement que subissent les petites économies, mais non la créance qui s'accumule. Le déficit du compte courant s'élevait à 3,7 % du produit intérieur brut (PIB) en 2025, contre environ 2 % en 2013-2019, et la position extérieure globale nette dépasse désormais −80 % du PIB, creusée par l'emprunt extérieur des administrations publiques et par les entrées non résidentes dans les actions et la dette d'entreprise des États-Unis [imf-art-iv-usa-2026]. La composition de ce financement s'est déplacée des détenteurs du secteur officiel vers des investisseurs privés non bancaires, dont le comportement est plus sensible aux prix et au risque; ce que le Fonds monétaire international (FMI) désigne comme la principale vulnérabilité extérieure : un revirement brutal des préférences de portefeuille pourrait imposer un rééquilibrage désordonné [imf-art-iv-usa-2026]. Le Fonds a jugé la position extérieure de 2025 modérément plus faible que ne l'indiquent les fondamentaux à moyen terme et des politiques appropriées, attribuant ce désalignement en grande partie au déficit fédéral chronique, qui affaiblit le compte courant et apprécie le dollar; le constat extérieur reformule le constat budgétaire plutôt qu'il n'en ajoute un second [imf-art-iv-usa-2026]. Le pays ne fait l'objet d'aucun programme du FMI; l'engagement du Fonds se limite à la surveillance annuelle au titre de l'article IV, dont la dernière conclusion date du 1er avril 2026 [imf-art-iv-usa-2026]. Sur l'approvisionnement physique, l'exposition s'inverse : le pays dépendait à 100 % des importations nettes pour 16 produits minéraux non combustibles en 2025, la Chine étant la source principale de 14 des minéraux critiques les plus dépendants des importations [usgs-mcs-2026].
economy_politicalEconomy_en: |-
  The United States is a market-led economy in which direct state ownership has historically been minimal, and both edges of the state–market boundary are now being redrawn at once — the executive taking equity in named firms, and the courts removing the insulation of independent regulators. The movement is toward executive discretion over both ownership and enforcement, and it is happening largely outside legislation.

  On ownership, the federal government announced investments worth $27.6 billion across thirty-seven deals involving direct ownership between January 2025 and July 2026 — the Department of Commerce leading at twenty-four deals, the Department of Defense at seven, the Development Finance Corporation at six and the Department of Energy at two — a portfolio for which the only consolidated record is a think-tank compilation assembled from open sources [cfr-equity-tracker-2026]. The two largest positions are documented by the companies themselves. The government purchased 433.3 million Intel shares at $20.47, a 9.9% stake worth $8.9 billion, funded by the $5.7 billion in Creating Helpful Incentives to Produce Semiconductors (CHIPS) and Science Act grants awarded but not yet paid and $3.2 billion from the Secure Enclave program; the holding is passive, carrying no board seat or governance rights, the government agreed to vote with the board on shareholder matters, and it took a five-year warrant for a further 5% exercisable only if Intel ceases to own a majority of its foundry business [intel-usg-agreement-2025]. The Department of Defense committed $400 million to convertible preferred stock and a warrant in MP Materials at a $30.03 conversion price, representing 15% of shares outstanding as of 9 July 2025 and positioning the department as the company's largest shareholder, alongside a ten-year floor price of $110 per kilogram for its neodymium-praseodymium products and a ten-year commitment to purchase the entire output of its planned second magnet plant [mp-materials-dod-2025].

  The private structure is concentrated and health-weighted. The 2026 Fortune 500, in its seventy-second year, accounted for $21.0 trillion in revenue and $2.1 trillion in profits and employed 30.5 million people worldwide [fortune-500-2026]. Amazon took first place, ending Walmart's thirteen-year run, and four of the top ten are health-care companies — UnitedHealth Group third, CVS Health sixth, McKesson eighth and Cencora tenth — alongside Apple, Alphabet, Berkshire Hathaway and ExxonMobil [fortune-500-2026]. Amazon took first place with revenue above $700 billion in 2025, up 12%, ending Walmart's thirteen-year run; UnitedHealth Group held third as the largest health-care company; and Alphabet, at fifth, was the most profitable company on the list with record earnings of $132 billion [fortune-500-2026]. Financial companies were the largest sector bloc at ninety-five firms, $4.1 trillion in revenue and over $474 billion in profits, while health care generated $3.6 trillion and placed eight companies in the top twenty-five [fortune-500-2026]. Four technology firms — Meta, Microsoft, Amazon and Alphabet — carry the artificial-intelligence data-centre buildout, with combined capital expenditure of about $410 billion in 2025 and announced plans of roughly $725 billion for 2026 [goldman-hyperscaler-capex-2026]. The defence industrial base runs through the Department of Defense's top-100 contractor list, naming the long-standing prime contractors Lockheed Martin, RTX, Boeing, General Dynamics and Northrop Grumman among them [dod-top100-contractors-list][crs-dod-contractors-primer].

  Organised labour is the weak counterparty. The union membership rate was 10.0% in 2025 with 14.7 million members, against 20.1% and 17.7 million in 1983, the first year of comparable data; a further 1.8 million workers are covered by a union contract without membership, putting union representation at 11.2% [bls-union-members-2025]. The remaining density is public: 32.9% in the public sector against 5.9% in the private sector, and 1.5% in financial activities and 2.1% in professional and business services — the sectors the Fortune 500 is concentrated in [bls-union-members-2025]. Union members' median usual weekly earnings were $1,404 in 2025 against $1,174 for non-union workers [bls-union-members-2025].

  Distribution under the 2025 reconciliation act (Public Law 119-21, the One Big Beautiful Bill Act) runs against the bottom decile. The act permanently extended 2017 tax provisions and raised projected deficits by $4.7 trillion over 2026–2035 [obbba-hr1][cbo-budget-outlook-2026]. CBO estimates households on average will gain resources over 2026–2034, but the gradient runs against the bottom: the lowest decile loses about $1,200 a year, or 3.1% of income, driven by reduced Medicaid and Supplemental Nutrition Assistance Program (SNAP) benefits; the fifth and sixth deciles gain $800 and $1,200 (0.8% and 1.0%); and the highest decile gains about $13,600, or 2.7%, driven by reductions in the taxes it owes [cbo-distributional-pl119-21]. The technically necessary reform — closing the primary and interest-driven fiscal gap — is politically constrained, with mandatory spending rising and net interest the fastest-growing outlay [cbo-budget-outlook-2026][crfb-cbo-outlook-2026].
economy_politicalEconomy_fr: |-
  Les États-Unis constituent une économie de marché où la propriété publique directe est historiquement minime, et les deux bords de la frontière État-marché sont désormais redessinés simultanément : l'exécutif prenant des participations dans des entreprises nommées, et les tribunaux retirant leur protection aux régulateurs indépendants. Le mouvement va vers une discrétion accrue de l'exécutif sur la propriété comme sur l'application des règles, et il s'opère largement hors du champ législatif.

  Du côté de la propriété, le gouvernement fédéral a annoncé des investissements de 27,6 milliards de dollars répartis sur trente-sept opérations comportant une participation directe entre janvier 2025 et juillet 2026 (le département du Commerce en menant vingt-quatre, celui de la Défense sept, la Development Finance Corporation six et celui de l'Énergie deux), portefeuille dont le seul relevé consolidé est une compilation de groupe de réflexion établie à partir de sources ouvertes [cfr-equity-tracker-2026]. Les deux plus importantes positions sont documentées par les entreprises elles-mêmes. Le gouvernement a acheté 433,3 millions d'actions d'Intel à 20,47 dollars, soit une participation de 9,9 % valant 8,9 milliards, financée par les 5,7 milliards de subventions du Creating Helpful Incentives to Produce Semiconductors (CHIPS) and Science Act attribuées, mais non versées et par 3,2 milliards du programme Secure Enclave. Cette participation est passive, sans siège au conseil ni droits de gouvernance; le gouvernement s'engageant à voter avec le conseil sur les questions soumises aux actionnaires, et assortie d'un bon de souscription de cinq ans portant sur 5 % supplémentaires, exerçable seulement si Intel cesse de détenir la majorité de son activité de fonderie [intel-usg-agreement-2025]. Le département de la Défense a engagé 400 millions de dollars en actions privilégiées convertibles et bons de souscription dans MP Materials, au prix de conversion de 30,03 dollars, représentant 15 % des actions en circulation au 9 juillet 2025 et faisant du département le premier actionnaire de l'entreprise, avec un prix plancher sur dix ans de 110 dollars le kilogramme pour ses produits de néodyme-praséodyme et un engagement d'achat sur dix ans de toute la production de sa deuxième usine d'aimants prévue [mp-materials-dod-2025].

  La structure privée est concentrée et pondérée par la santé. Le Fortune 500 de 2026, dans sa soixante-douzième année, représentait 21 000 milliards de dollars de chiffre d'affaires et 2 100 milliards de profits, et employait 30,5 millions de personnes dans le monde [fortune-500-2026]. Amazon a pris la première place, mettant fin à treize ans de règne de Walmart, et quatre des dix premières sont des entreprises de santé (UnitedHealth Group en troisième, CVS Health en sixième, McKesson en huitième et Cencora en dixième), aux côtés d'Apple, Alphabet, Berkshire Hathaway et ExxonMobil [fortune-500-2026]. Les sociétés financières formaient le premier bloc sectoriel avec quatre-vingt-quinze entreprises, 4 100 milliards de chiffre d'affaires et plus de 474 milliards de profits, tandis que la santé générait 3 600 milliards et plaçait huit entreprises dans les vingt-cinq premières [fortune-500-2026]. Quatre entreprises technologiques (Meta, Microsoft, Amazon et Alphabet) portent l'expansion des centres de données d'intelligence artificielle, avec des dépenses d'investissement combinées d'environ 410 milliards en 2025 et des plans annoncés d'environ 725 milliards pour 2026 [goldman-hyperscaler-capex-2026]. La base industrielle de défense passe par la liste des cent premiers entrepreneurs du département de la Défense, qui nomme les maîtres d'œuvre historiques, dont Lockheed Martin, RTX, Boeing, General Dynamics et Northrop Grumman [dod-top100-contractors-list][crs-dod-contractors-primer].

  Le travail organisé est la contrepartie faible. Le taux de syndicalisation s'établissait à 10,0 % en 2025, pour 14,7 millions de membres, contre 20,1 % et 17,7 millions en 1983, première année de données comparables; 1,8 million de travailleurs supplémentaires sont couverts par une convention collective sans être membres, portant la représentation syndicale à 11,2 % [bls-union-members-2025]. La densité résiduelle est publique : 32,9 % dans le secteur public contre 5,9 % dans le privé, et 1,5 % dans les activités financières et 2,1 % dans les services professionnels et aux entreprises (soit les secteurs où se concentre le Fortune 500) [bls-union-members-2025]. Le salaire hebdomadaire médian habituel des syndiqués atteignait 1 404 dollars en 2025, contre 1 174 dollars pour les non-syndiqués [bls-union-members-2025].

  La répartition sous la loi de réconciliation de 2025 (loi publique 119-21, la One Big Beautiful Bill Act) joue contre le décile inférieur. La loi a pérennisé les dispositions fiscales de 2017 et relevé les déficits projetés de 4 700 milliards de dollars sur 2026-2035 [obbba-hr1][cbo-budget-outlook-2026]. Le CBO estime que les ménages gagneront en moyenne des ressources sur 2026-2034, mais le gradient joue contre le bas de la distribution : le décile inférieur perd environ 1 200 dollars par an, soit 3,1 % de son revenu, en raison de la réduction des prestations de Medicaid et du Supplemental Nutrition Assistance Program (SNAP); les cinquième et sixième déciles gagnent 800 et 1 200 dollars (0,8 % et 1,0 %); et le décile supérieur gagne environ 13 600 dollars, soit 2,7 %, grâce à la baisse des impôts qu'il doit [cbo-distributional-pl119-21]. La réforme techniquement nécessaire (résorber le déficit primaire et celui tiré par les intérêts) est politiquement contrainte; les dépenses obligatoires augmentant et les intérêts nets étant le poste à la croissance la plus rapide [cbo-budget-outlook-2026][crfb-cbo-outlook-2026].
political_powerStructure_en: |-
  The United States is a federal presidential republic in which the executive and the legislature are elected separately and for different terms, so that control of one does not follow from control of the other [calibration-executive-source]. Since January 2025 the same party has held both, and the operative boundary between them is being redrawn — not by legislation but by judicial doctrine on the President's power to remove officials.

  The executive is held by President Donald Trump, a Republican, who won 312 electoral votes to Kamala Harris's 226 of 538 in November 2024, above the 270 required, and was inaugurated in January 2025 [nara-electoral-college-2024]. Legislative control is stated separately because the system permits divergence. In the Senate (100 seats) Republicans hold 53 and Democrats 45, with two independents — Angus King and Bernie Sanders — caucusing with the Democrats [senate-partydiv]. That division survived a change of membership in July 2026: following the death of Senator Lindsey Graham of South Carolina, Governor Henry McMaster appointed Darline Graham Nordone to complete the term on 13 July, and she was sworn in the following day [scott-senate-nordone-appointment]. In the House of Representatives (435 seats) the chamber's own party-breakdown page, accessed 2 August 2026, records 218 Republicans, 212 Democrats, one independent and four vacancies, the page having last been revised on 10 June 2026 [house-partybreakdown]. Government is unified rather than divided.

  Vacancies are repaired at different speeds in the two chambers, which affects what each margin means in practice. A Senate seat can be filled by gubernatorial appointment within days, as South Carolina's was. A House seat cannot: Georgia's thirteenth district has been vacant since the death of Representative David Scott on 22 April 2026, its 28 July special election produced no majority, and a runoff is scheduled for 25 August [gasos-ga13-special]. The House adjourned into a district work period on 23 July 2026, with votes not expected until 31 August [house-partybreakdown].

  The margins are thin in both chambers and they bind differently. In the House, 218 Republicans is exactly the number required for a majority of the full chamber, against 212 Democrats and four vacant seats [house-partybreakdown]. In the Senate, 53 seats is a governing majority but not the three-fifths of all senators duly chosen and sworn — normally 60 votes — that Rule XXII requires to close debate on ordinary legislation; a numerical majority suffices for nominations, and budget reconciliation is exempt [crs-rl30360-cloture]. That threshold, not the seat count, determines what unified control can enact, and it is why the majority's principal 2025 enactment moved through reconciliation rather than regular order [obbba-hr1].

  Opposition strength follows from the same thresholds rather than from seat counts. In the Senate, Democrats and the two independents caucusing with them hold 47 — six more than the 41 needed to deny cloture — so the minority can block ordinary legislation indefinitely, though not nominations or reconciliation [senate-partydiv][crs-rl30360-cloture]. In the House there is no equivalent, and the minority's only route around the committee of referral, the majority leadership and the Rules Committee is the discharge petition under clause 2 of Rule XV, which requires 218 signatures — a majority of the full chamber, and six more than the Democrats hold [house-partybreakdown][crs-r45920-discharge]. That route has been unusually active: two discharge petitions reached the threshold across the entire 118th Congress, and four did so in the first session of the 119th alone, each necessarily carrying majority-party signatures [crs-r45920-discharge]. The opposition is led by Hakeem Jeffries of New York's eighth district in the House and Chuck Schumer of New York in the Senate [house-democratic-leader]. Its institutional standing is not in question — the minority holds ranking positions, contests scheduled elections, and faces no legal impediment to organising — so the operative question is procedural rather than one of legitimacy. Structurally, this is a system in which a party holding the presidency and both chambers still cannot legislate alone: the binding constraints are the sixty-vote threshold, the 218-signature threshold, and judicial review, none of which track the partisan division of the legislature.

  Whether operative power tracks the constitutional allocation is contested, and the contest ran in both directions on a single day. Article II vests executive power in a separately elected President who does not depend on the confidence of Congress [calibration-executive-source]. On 29 June 2026 the Supreme Court held by six votes to three that statutory provisions permitting the President to remove Federal Trade Commission commissioners only for cause violate the Constitution; the decision overruled Humphrey's Executor and invalidated removal protections for those commissioners and, in the Congressional Research Service's reading, likely for officials of other commission-style agencies that wield executive power [crs-lsb11448-slaughter]. The same day, in a case arising from the attempted removal of Governor Lisa Cook — the first Federal Reserve governor a president has moved to fire in the institution's 111-year history — the Court held by five votes to four that the President's asserted cause for removing a Federal Reserve governor is subject to judicial review, that any definition of cause must reflect the institution's particular history and role, and that the governor was entitled to notice and an opportunity to respond before removal; it declined to stay the injunction keeping Cook in office [crs-lsb11449-cook][scotus-trump-v-cook-2026]. Chief Justice Roberts wrote both opinions, with different majorities. Presidential control over the commission-style agencies expanded; the central bank was carved out of it.
political_powerStructure_fr: |-
  Les États-Unis sont une république présidentielle fédérale où l'exécutif et le législatif sont élus séparément et pour des mandats de durées différentes, de sorte que le contrôle de l'un ne découle pas du contrôle de l'autre [calibration-executive-source]. Depuis janvier 2025, le même parti détient les deux; la frontière opérationnelle entre eux se redessine, non par voie législative, mais par la jurisprudence relative au pouvoir présidentiel de révocation des titulaires de charge.

  L'exécutif est détenu par le président Donald Trump, républicain, qui a obtenu 312 voix du collège électoral contre 226 à Kamala Harris sur 538, au-delà des 270 requises, et a été investi en janvier 2025 [nara-electoral-college-2024]. Le contrôle du législatif est énoncé séparément parce que le système permet la divergence. Au Sénat (100 sièges), les républicains en détiennent 53 et les démocrates 45, deux indépendants (Angus King et Bernie Sanders) siégeant avec le caucus démocrate [senate-partydiv]. Cette répartition a survécu à un changement de composition en juillet 2026 : à la suite du décès du sénateur Lindsey Graham, de la Caroline du Sud, le gouverneur Henry McMaster a nommé Darline Graham Nordone pour achever le mandat le 13 juillet; elle a prêté serment le lendemain [scott-senate-nordone-appointment]. À la Chambre des représentants (435 sièges), la page de répartition partisane de la chambre elle-même, consultée le 2 août 2026, fait état de 218 républicains, 212 démocrates, un indépendant et quatre sièges vacants, la page n'ayant pas été révisée depuis le 10 juin 2026 [house-partybreakdown]. Le gouvernement est donc unifié plutôt que divisé.

  Les sièges vacants se comblent à des vitesses différentes dans les deux chambres; ce qui modifie le sens pratique de chaque majorité. Un siège de sénateur peut être pourvu par nomination du gouverneur en quelques jours, comme ce fut le cas en Caroline du Sud. Un siège de représentant ne le peut pas : le treizième district de la Géorgie est vacant depuis le décès du représentant David Scott, le 22 avril 2026; son élection spéciale du 28 juillet n'a dégagé aucune majorité, et un second tour est prévu le 25 août [gasos-ga13-special]. La Chambre s'est ajournée le 23 juillet 2026 pour une période de travail en circonscription; les votes n'étant pas attendus avant le 31 août [house-partybreakdown].

  Les marges sont minces dans les deux chambres et elles contraignent différemment. À la Chambre, 218 républicains correspondent exactement au nombre requis pour une majorité de l'ensemble de la chambre, contre 212 démocrates et quatre sièges vacants [house-partybreakdown]. Au Sénat, 53 sièges constituent une majorité de gouvernement, mais non les trois cinquièmes des sénateurs dûment élus et assermentés (normalement 60 voix) qu'exige la règle XXII pour clore le débat sur une loi ordinaire; une majorité simple suffit pour les nominations, et la réconciliation budgétaire y échappe [crs-rl30360-cloture]. C'est ce seuil, et non le nombre de sièges, qui détermine ce qu'un contrôle unifié peut faire adopter; c'est pourquoi la principale loi de la majorité en 2025 est passée par la réconciliation plutôt que par la procédure ordinaire [obbba-hr1].

  La force de l'opposition découle des mêmes seuils plutôt que du nombre de sièges. Au Sénat, les démocrates et les deux indépendants qui siègent avec eux en détiennent 47 (six de plus que les 41 nécessaires pour refuser la clôture), de sorte que la minorité peut bloquer indéfiniment une loi ordinaire, mais non les nominations ni la réconciliation [senate-partydiv][crs-rl30360-cloture]. À la Chambre, il n'existe pas d'équivalent. La seule voie dont dispose la minorité pour contourner le comité saisi, la direction de la majorité et le comité du Règlement est la pétition de dessaisissement prévue à l'alinéa 2 de la règle XV, qui exige 218 signatures; majorité de l'ensemble de la chambre, soit six de plus que n'en détiennent les démocrates [house-partybreakdown][crs-r45920-discharge]. Cette voie a été inhabituellement active : deux pétitions de dessaisissement ont atteint le seuil pendant tout le 118e Congrès, et quatre l'ont fait durant la seule première session du 119e; chacune portant nécessairement des signatures de la majorité [crs-r45920-discharge]. L'opposition est dirigée par Hakeem Jeffries, du huitième district de New York, à la Chambre, et par Chuck Schumer, de New York, au Sénat [house-democratic-leader]. Sa légitimité institutionnelle n'est pas en cause (la minorité occupe les postes de chef de file en comité, se présente aux élections prévues et ne rencontre aucun obstacle juridique à s'organiser), de sorte que la question opérante est procédurale et non pas une question de légitimité. Structurellement, il s'agit d'un système où un parti détenant la présidence et les deux chambres ne peut pas légiférer seul : les contraintes qui lient sont le seuil de soixante voix, le seuil de 218 signatures et le contrôle judiciaire, dont aucun ne suit la division partisane du législatif.

  La question de savoir si le pouvoir opérant suit la répartition constitutionnelle est contestée, et la contestation s'est jouée dans les deux sens le même jour. L'article II confère le pouvoir exécutif à un président élu séparément, qui ne dépend pas de la confiance du Congrès [calibration-executive-source]. Le 29 juin 2026, la Cour suprême a jugé, par six voix contre trois, que les dispositions législatives ne permettant au président de révoquer les commissaires de la Federal Trade Commission que pour motif valable violent la Constitution; la décision a renversé l'arrêt Humphrey's Executor et invalidé les protections contre la révocation applicables à ces commissaires et, selon la lecture du Congressional Research Service, vraisemblablement à ceux d'autres organismes collégiaux exerçant un pouvoir exécutif [crs-lsb11448-slaughter]. Le même jour, dans une affaire née de la tentative de révocation de la gouverneure Lisa Cook (première gouverneure de la Réserve fédérale qu'un président ait cherché à démettre en 111 ans d'existence de l'institution), la Cour a jugé, par cinq voix contre quatre, que le motif invoqué par le président pour révoquer une gouverneure de la Réserve fédérale était susceptible de contrôle judiciaire, que toute définition du motif valable devait tenir compte de l'histoire et du rôle particuliers de l'institution, et que la gouverneure avait droit à un préavis et à la possibilité de se faire entendre avant sa révocation; elle a refusé de suspendre l'injonction maintenant Lisa Cook en fonction [crs-lsb11449-cook][scotus-trump-v-cook-2026]. Le juge en chef Roberts a rédigé les deux opinions, avec des majorités différentes. Le contrôle présidentiel sur les organismes collégiaux s'est étendu; la banque centrale en a été soustraite.
political_rightsAndChecks_en: |-
  Federal judges are nominated by the President and confirmed by the Senate, hold office during good behaviour rather than for fixed terms, and cannot have their salaries reduced while in office; the power of judicial review has been exercised since Marbury v. Madison in 1803 [constitution-usa-1787][marbury-v-madison-1803]. Independence is observable in outcome rather than asserted: on 29 June 2026 the Supreme Court ruled for the President on removal of Federal Trade Commission commissioners and against him on removal of a Federal Reserve governor, declining to disturb the injunction that kept his removal target in office, with the Chief Justice writing both opinions [crs-lsb11448-slaughter][crs-lsb11449-cook]. The court that expanded executive control over the commission-style agencies is the same court that refused to extend it to the central bank, holding that the President's asserted cause for removing a Federal Reserve governor is subject to judicial review. Chief Justice Roberts wrote both opinions, joined by two almost entirely different sets of justices; only one member of the Court was in both majorities. The Inter-American Commission on Human Rights, reviewing federal measures adopted in 2025, recorded that many had been challenged before United States courts and read this as the continued operation of the country's system of checks and balances, while expressing concern at public statements by senior officials that could undermine the credibility and independence of the judiciary [iachr-usa-2025].

  Press freedom is constitutionally protected and materially declining. Reporters Without Borders placed the United States 64th of 180 countries in its 2026 World Press Freedom Index, a fall of seven places, attributing the slide to growing political pressure [rsf-index-2026]. The Inter-American Commission identified changes and exclusions to the accreditation of journalists covering the federal government, Federal Communications Commission investigations into broadcasters over content deemed critical of the administration, and funding cuts to national and international media outlets, assessing that these weaken public access to plural and independent information [iachr-usa-2025]. Freedom House records a free and diverse press under strong constitutional protection, eroded by government pressure, market concentration and partisan polarisation; Freedom House is a United States-based advocacy-oriented scorer and its ratings are interpretive [freedomhouse-usa-2026].

  On civil liberties and human rights, the regional treaty body has moved from concern to adjudication, and the state has not answered. The Inter-American Commission on Human Rights — the Organization of American States organ before which the United States answers under the American Declaration of the Rights and Duties of Man — published Merits Report No. 60/25 in Case 14.042 on 28 April 2025, holding the country responsible for violating the rights to life, personal integrity, health, justice and humane treatment during arrest in the death of Anastasio Hernández Rojas in Customs and Border Protection custody [iachr-merits-60-25]. The finding reaches past the individual case to the legal framework: the Commission concluded that federal and state rules condition the use of force, including lethal force, on an officer's "reasonable belief", require no assessment of proportionality, and do not clearly distinguish general from lethal force — one state expressly invokes proportionality, three urge officers to seek alternatives before deploying force, and three generally require a warning before deadly force [iachr-merits-60-25]. It also recorded that of thousands of police-related deaths between 2005 and 2015, 54 officers were charged and most were released or acquitted [iachr-merits-60-25]. The Commission transmitted its findings in December 2024 requesting a response within two months, and again in March 2025 allowing three further weeks; no response was received either time, and it published the report under Article 47.3 of its Rules of Procedure [iachr-pr-85-25]. Separately, in March 2025 the Commission recorded the detention and deportation of foreign-born scholars lawfully resident in the country in response to their political speech, entry denials based on private messages critical of the administration, the cancellation of federal university funding conditioned on disciplinary action against student protesters, and the deportation of more than 200 Venezuelan nationals to a third-country prison under the Alien Enemies Act of 1798 [iachr-usa-2025]. There is no accredited national human-rights institution: the United States appears nowhere on the accreditation chart of the Global Alliance of National Human Rights Institutions, which as of 4 June 2025 listed 118 reviewed institutions worldwide — 91 fully compliant with the Paris Principles and 27 partially compliant — including eighteen in the Americas, among them Canada and Mexico [ganhri-accreditation-chart].

  Composite scorers, which measure different things and should not be read as one instrument, register decline across all of them. Freedom House rated the United States 81 of 100 in Freedom in the World 2026, a three-point fall [freedomhouse-usa-2026]. The Varieties of Democracy project, an academic measurement programme based at the University of Gothenburg, reclassified the United States from liberal democracy to electoral democracy in its 2026 Democracy Report, the first such downgrade in more than five decades, and characterises the decline as unprecedented in modern history [vdem-democracy-report-2026]. The World Justice Project, an independent civil-society organisation measuring rule of law through household and expert surveys, ranked the country 27th of 143 overall and 112th of 143 on access to civil justice in its 2025 index [wjp-rule-of-law-2025]. Transparency International, an anti-corruption advocacy organisation whose index measures perceived rather than measured corruption, scored the United States 64 of 100 in its 2025 Corruption Perceptions Index, its lowest score since the index began, down from 65 in 2024 [transparency-cpi-2025].
political_rightsAndChecks_fr: |-
  Les juges fédéraux sont nommés par le président et confirmés par le Sénat, occupent leur charge tant qu'ils en sont dignes plutôt que pour un mandat déterminé, et leur traitement ne peut être réduit pendant qu'ils sont en fonction; le pouvoir de contrôle judiciaire s'exerce depuis l'arrêt Marbury v. Madison de 1803 [constitution-usa-1787][marbury-v-madison-1803]. L'indépendance s'observe dans les résultats plutôt qu'elle ne s'affirme : le 29 juin 2026, la Cour suprême a tranché en faveur du président sur la révocation des commissaires de la Federal Trade Commission et contre lui sur celle d'une gouverneure de la Réserve fédérale, refusant de lever l'injonction qui maintenait en fonction la personne visée; le juge en chef rédigeant les deux opinions [crs-lsb11448-slaughter][crs-lsb11449-cook]. La cour qui a étendu le contrôle de l'exécutif sur les organismes collégiaux est la même que celle qui a refusé de l'étendre à la banque centrale, jugeant que le motif invoqué pour révoquer un gouverneur de la Réserve fédérale est susceptible de contrôle judiciaire. Le juge en chef Roberts a rédigé les deux opinions, entouré de deux ensembles de juges presque entièrement différents; un seul membre de la Cour figurait dans les deux majorités. La Commission interaméricaine des droits de l'homme (l'organe de l'Organisation des États américains devant lequel les États-Unis répondent au titre de la Déclaration américaine des droits et devoirs de l'homme), examinant les mesures fédérales adoptées en 2025, a constaté que plusieurs d'entre elles avaient été contestées devant les tribunaux des États-Unis et y a vu le fonctionnement continu du système national de freins et contrepoids, tout en s'inquiétant de déclarations publiques de hauts responsables susceptibles de miner la crédibilité et l'indépendance de la magistrature [iachr-usa-2025].

  La liberté de la presse est protégée par la Constitution et se dégrade concrètement. Reporters sans frontières a classé les États-Unis au 64e rang sur 180 pays dans son Classement mondial de la liberté de la presse 2026, en recul de sept places; attribuant ce glissement à une pression politique croissante [rsf-index-2026]. La Commission interaméricaine a relevé des modifications et des exclusions dans l'accréditation des journalistes couvrant le gouvernement fédéral, des enquêtes de la Federal Communications Commission visant des diffuseurs pour des contenus jugés critiques envers l'administration, ainsi que des coupes de financement touchant des médias nationaux et internationaux; estimant que ces mesures affaiblissent l'accès du public à une information plurielle et indépendante [iachr-usa-2025]. Freedom House fait état d'une presse libre et diversifiée, fortement protégée par la Constitution, mais érodée par la pression gouvernementale, la concentration du marché et la polarisation partisane (Freedom House est un organisme de notation établi aux États-Unis, à vocation militante, et ses évaluations relèvent de l'interprétation) [freedomhouse-usa-2026].

  Sur les libertés civiles et les droits de la personne, l'organe régional est passé de la préoccupation à la décision, et l'État n'a pas répondu. La Commission interaméricaine des droits de l'homme a publié le 28 avril 2025 le rapport sur le fond no 60/25 dans l'affaire 14.042, tenant le pays responsable de la violation des droits à la vie, à l'intégrité de la personne, à la santé, à la justice et à un traitement humain pendant l'arrestation, dans le décès d'Anastasio Hernández Rojas sous la garde du service des douanes et de la protection des frontières [iachr-merits-60-25]. La conclusion dépasse le cas individuel pour viser le cadre juridique : la Commission a établi que les règles fédérales et étatiques subordonnent l'usage de la force, y compris létale, à la « conviction raisonnable » de l'agent, n'exigent aucune évaluation de la proportionnalité et ne distinguent pas clairement la force générale de la force létale; un seul État invoque expressément la proportionnalité, trois incitent les agents à chercher des solutions de rechange avant de recourir à la force, et trois exigent généralement un avertissement avant l'usage de la force meurtrière [iachr-merits-60-25]. Elle a également relevé que, sur des milliers de décès liés à des interventions policières entre 2005 et 2015, 54 agents ont été inculpés et la plupart ont été libérés ou acquittés [iachr-merits-60-25]. La Commission a transmis ses conclusions en décembre 2024 en demandant une réponse dans un délai de deux mois, puis de nouveau en mars 2025 en accordant trois semaines supplémentaires; aucune réponse n'a été reçue dans l'un ni l'autre cas, et elle a publié le rapport en vertu de l'article 47.3 de son Règlement [iachr-pr-85-25]. Par ailleurs, en mars 2025, la Commission a fait état de la détention et de l'expulsion d'universitaires nés à l'étranger et résidant légalement au pays en réaction à leurs prises de position politiques, de refus d'entrée fondés sur des messages privés critiques envers l'administration, de l'annulation de financements universitaires fédéraux conditionnée à des sanctions disciplinaires contre des étudiants manifestants, et de l'expulsion de plus de 200 ressortissants vénézuéliens vers une prison d'un pays tiers en vertu de l'Alien Enemies Act de 1798 [iachr-usa-2025]. Il n'existe aucune institution nationale des droits de la personne accréditée : les États-Unis ne figurent nulle part sur le tableau d'accréditation de l'Alliance mondiale des institutions nationales des droits de l'homme, qui recensait au 4 juin 2025 118 institutions examinées dans le monde (91 pleinement conformes aux Principes de Paris et 27 partiellement conformes), dont dix-huit dans les Amériques [ganhri-accreditation-chart].

  Les organismes de notation composite, qui mesurent des réalités différentes et ne doivent pas être lus comme un instrument unique, enregistrent tous un recul. Freedom House a attribué aux États-Unis 81 points sur 100 dans son rapport Freedom in the World 2026, soit une baisse de trois points [freedomhouse-usa-2026]. Le projet Varieties of Democracy, programme universitaire de mesure établi à l'Université de Göteborg, a reclassé les États-Unis de démocratie libérale à démocratie électorale dans son rapport 2026 sur la démocratie, premier déclassement de ce type en plus de cinq décennies, et qualifie ce recul de sans précédent dans l'histoire moderne [vdem-democracy-report-2026]. Le World Justice Project, organisation indépendante de la société civile qui mesure la primauté du droit au moyen d'enquêtes auprès des ménages et d'experts, a classé le pays au 27e rang sur 143 au classement général et au 112e rang sur 143 pour l'accès à la justice civile dans son indice de 2025 [wjp-rule-of-law-2025]. Transparency International, organisation militante de lutte contre la corruption dont l'indice mesure la corruption perçue et non mesurée, a attribué aux États-Unis 64 points sur 100 dans son Indice de perception de la corruption 2025 (son plus faible résultat depuis la création de l'indice), contre 65 en 2024 [transparency-cpi-2025].
political_stabilityDrivers_en: |-
  Legitimation rests on regular competitive elections and a written constitution in continuous operation since 1789; the Inter-American Commission on Human Rights, reviewing the country in 2025, described its constitutional framework, independent judiciary, free press and active civil society as the pillars of that tradition [constitution-usa-1787][iachr-usa-2025]. The current executive holds office by an electoral-college margin of 312 to 226 [nara-electoral-college-2024].

  Control of the coercive apparatus runs along three separate lines, and conflating them misstates the structure. The President is commander-in-chief of the armed forces under Article II [constitution-usa-1787]. Federal law-enforcement agencies answer to the President not through that clause but through the statutory power to appoint and remove their heads — the power the Supreme Court expanded in June 2026 by voiding for-cause removal protections at the Federal Trade Commission and, in the Congressional Research Service's reading, likely at other commission-style agencies that wield executive power [crs-lsb11448-slaughter]. The National Guard answers to whoever has called it: under state active duty the governor commands and the state pays; under Title 32 the state retains command with federal funding; under Title 10 the President federalises the force, which then falls under the Posse Comitatus Act of 1878, barring the armed forces from executing the laws except where the Constitution or an Act of Congress expressly authorises it [crs-r42659-posse-comitatus]. Congress reaffirmed that statute's continued applicability in 6 U.S.C. § 466, while acknowledging it is not a complete barrier where the President determines the armed forces are required to respond to war, insurrection or other serious emergency [uscode-6-466].

  That third line was contested and judicially settled during the period. On 4 October 2025 the Secretary invoked 10 U.S.C. § 12406 to federalise up to 300 members of the Illinois National Guard over the governor's objection, after the governor declined to mobilise them under Title 32, and the following day federalised up to 400 Texas Guard members for deployment to Chicago [scotus-trump-v-illinois-2025]. On 23 December 2025 the Supreme Court denied the government's emergency application by six votes to three, reading "regular forces" in § 12406(3) to mean the regular forces of the United States military — so that the President must be unable to execute federal law with the professional military before federalising a state's Guard [scotus-trump-v-illinois-2025]. Governors in California and Oregon had obtained parallel injunctions [scotus-trump-v-illinois-2025]. Under the Federal Protection Mission, National Guard soldiers in Title 10 status served under the command of United States Army North with the Department of Homeland Security as lead federal agency [northcom-federal-protection-mission]. Demobilisation in Portland, Los Angeles and Chicago was completed on 21 January 2026, and Texas National Guard personnel were released from stand-by on 11 March 2026 [northcom-federal-protection-mission]. 
  The 2026 National Defense Strategy directs the military toward homeland defence and Western Hemisphere operations, including border security and counter-narcotics support [ndstrategy-2026].

  Loyalty in the narrow sense is not the variable in question: no episode in the period involved forces declining lawful orders. What was contested was who is entitled to issue them, and the answer was supplied by courts rather than by the security forces themselves.

  There is no governing coalition in the parliamentary sense; the system produces single-party control of each institution rather than negotiated coalitions, and one party currently holds the presidency, the Senate at 53 seats and the House at 218 [senate-partydiv][house-partybreakdown]. Elite cohesion within that bloc is high in formal terms and measurably imperfect in operation: four discharge petitions reached the 218-signature threshold during the first session of the 119th Congress, against two across the whole of the 118th, and since the minority holds 212 seats each necessarily carried majority-party signatures [crs-r45920-discharge]. The apex court divided differently on each of the three 2026 questions concerning executive power, ruling for the President on removal at the Federal Trade Commission, against him on removal at the Federal Reserve, where it held his asserted cause subject to judicial review [crs-lsb11448-slaughter][crs-lsb11449-cook][scotus-trump-v-illinois-2025].

  Business-elite alignment is being restructured by firm-specific policy rather than by sectoral rule. Between January 2025 and July 2026 the federal government announced thirty-seven deals involving direct ownership worth $27.6 billion [cfr-equity-tracker-2026]. The International Monetary Fund records that the administration has taken ownership stakes in named companies, loosened semiconductor export restrictions for certain firms in return for a 25% levy on the revenues from those sales, and imposed a 25% import tariff on semiconductor producers viewed as not supporting expansion of the domestic technology supply chain; the Fund assesses such firm-specific policies as distortionary and likely to misallocate resources [imf-art-iv-usa-2026]. The operative alignment mechanism is therefore transactional and company-by-company, which makes it responsive to the executive but weakly institutionalised.
political_stabilityDrivers_fr: |-
  La légitimation repose sur des élections régulières et concurrentielles et sur une constitution écrite en vigueur sans interruption depuis 1789; la Commission interaméricaine des droits de l'homme, examinant le pays en 2025, a décrit son cadre constitutionnel, sa magistrature indépendante, sa presse libre et sa société civile active comme les piliers de cette tradition [constitution-usa-1787][iachr-usa-2025]. L'exécutif en place détient sa charge grâce à une marge de 312 voix contre 226 au collège électoral [nara-electoral-college-2024].

  Le contrôle de l'appareil coercitif suit trois lignes distinctes, et les confondre revient à décrire faussement la structure. Le président est commandant en chef des forces armées en vertu de l'article II [constitution-usa-1787]. Les organismes fédéraux d'application de la loi relèvent du président non par cette clause, mais par le pouvoir législatif de nommer et de révoquer leurs dirigeants; pouvoir que la Cour suprême a élargi en juin 2026 en invalidant les protections contre la révocation pour motif valable à la Federal Trade Commission et, selon la lecture du Congressional Research Service, vraisemblablement dans d'autres organismes collégiaux exerçant un pouvoir exécutif [crs-lsb11448-slaughter]. La Garde nationale relève de qui l'a appelée : en service actif d'État, le gouverneur commande et l'État paie; sous le titre 32, l'État conserve le commandement avec un financement fédéral; sous le titre 10, le président fédéralise la force, qui tombe alors sous le coup du Posse Comitatus Act de 1878, lequel interdit aux forces armées d'appliquer les lois sauf autorisation expresse de la Constitution ou d'une loi du Congrès [crs-r42659-posse-comitatus]. Le Congrès a réaffirmé la validité continue de cette loi au 6 U.S.C. § 466, tout en reconnaissant qu'elle ne constitue pas un obstacle absolu lorsque le président estime que les forces armées sont nécessaires pour répondre à une guerre, à une insurrection ou à une autre urgence grave [uscode-6-466].

  Cette troisième ligne a été contestée et tranchée par les tribunaux au cours de la période. Le 4 octobre 2025, le secrétaire a invoqué le 10 U.S.C. § 12406 pour fédéraliser jusqu'à 300 membres de la Garde nationale de l'Illinois malgré l'opposition du gouverneur, après que celui-ci eut refusé de les mobiliser sous le titre 32, puis a fédéralisé le lendemain jusqu'à 400 membres de la Garde du Texas en vue d'un déploiement à Chicago [scotus-trump-v-illinois-2025]. Le 23 décembre 2025, la Cour suprême a rejeté la demande d'urgence du gouvernement par six voix contre trois, interprétant l'expression « regular forces » du § 12406(3) comme désignant les forces régulières de l'armée des États-Unis; de sorte que le président doit être dans l'incapacité d'appliquer la loi fédérale avec l'armée professionnelle avant de fédéraliser la Garde d'un État [scotus-trump-v-illinois-2025]. Les gouverneurs de la Californie et de l'Oregon avaient obtenu des injonctions parallèles [scotus-trump-v-illinois-2025]. Dans le cadre de la Federal Protection Mission, les soldats de la Garde nationale placés sous le titre 10 relevaient du commandement de l'United States Army North, département de la Sécurité intérieure agissant comme organisme fédéral responsable [northcom-federal-protection-mission]. La démobilisation à Portland, à Los Angeles et à Chicago s'est achevée le 21 janvier 2026, et les militaires de la Garde nationale du Texas ont été libérés de l'état d'alerte le 11 mars 2026 [northcom-federal-protection-mission]. 
  La Stratégie de défense nationale de 2026 oriente l'armée vers la défense du territoire et les opérations dans l'hémisphère occidental, y compris la sécurité frontalière et l'appui à la lutte antidrogue [ndstrategy-2026].

  La loyauté au sens étroit n'est pas la variable en cause : aucun épisode de la période n'a vu des forces refuser des ordres légaux. La contestation portait sur savoir qui avait le droit de les donner; la réponse est venue des tribunaux plutôt que des forces de sécurité elles-mêmes.

  Il n'existe pas de coalition gouvernementale au sens parlementaire; le système produit le contrôle de chaque institution par un seul parti plutôt que des coalitions négociées; un même parti détient actuellement la présidence, le Sénat avec 53 sièges et la Chambre avec 218 [senate-partydiv][house-partybreakdown]. La cohésion des élites au sein de ce bloc est élevée sur le plan formel et mesurablement imparfaite dans les faits : quatre pétitions de dessaisissement ont atteint le seuil de 218 signatures durant la première session du 119e Congrès, contre deux pendant tout le 118e, et comme la minorité ne détient que 212 sièges, chacune portait nécessairement des signatures de la majorité [crs-r45920-discharge]. La plus haute cour s'est divisée différemment sur chacune des trois questions de 2026 touchant le pouvoir exécutif, tranchant en faveur du président sur la révocation à la Federal Trade Commission, contre lui sur la révocation à la Réserve fédérale, et contre lui sur la révocation à la Réserve fédérale, où elle a jugé le motif invoqué susceptible de contrôle judiciaire [crs-lsb11448-slaughter][crs-lsb11449-cook][scotus-trump-v-illinois-2025].

  L'alignement des élites d'affaires se restructure par des politiques visant des entreprises précises plutôt que par des règles sectorielles. Entre janvier 2025 et juillet 2026, le gouvernement fédéral a annoncé trente-sept opérations comportant une participation directe, d'une valeur de 27,6 milliards de dollars [cfr-equity-tracker-2026]. Le Fonds monétaire international relève que l'administration a pris des participations dans des entreprises nommées, assoupli les restrictions à l'exportation de semiconducteurs pour certaines d'entre elles en échange d'un prélèvement de 25 % sur les revenus tirés de ces ventes, et imposé un tarif d'importation de 25 % aux producteurs de semiconducteurs jugés ne pas soutenir l'expansion de la chaîne d'approvisionnement technologique nationale; le Fonds estime que de telles politiques ciblant des entreprises précises créent des distorsions et risquent de mal répartir les ressources [imf-art-iv-usa-2026]. Le mécanisme d'alignement opérant est donc transactionnel, entreprise par entreprise; ce qui le rend sensible à l'exécutif, mais faiblement institutionnalisé.
political_shockAbsorbers_en: |-
  Four buffers carry most of the absorptive capacity, and one of them is currently degraded. The dollar's reserve role and the depth of the Treasury market sustain government borrowing at scale: foreign holdings stood at roughly $9.2 trillion in December 2025, equal to 31% of publicly held debt [crs-rs22331-foreign-holdings]. That cushion has changed composition, however — the International Monetary Fund records a shift in the non-resident investor base from official-sector holders toward non-bank financial institutions whose behaviour is more price- and risk-sensitive, and names this as the principal external vulnerability [imf-art-iv-usa-2026]. Energy self-sufficiency buffers precisely the shock now in play: total energy exports reached a record 31 quadrillion British thermal units in 2025 against 21 quads of imports, for record net exports of 11 quads [eia-energy-trade-2025]. The productive base is broad, with private service-providing industries accounting for 114.1 million of 159.0 million nonfarm payroll jobs [bls-empsit-june2026].

  Monetary policy is the buffer under strain. The central bank's operational independence was judicially affirmed in June 2026, when the Supreme Court held that the President's asserted cause for removing a Federal Reserve governor is subject to judicial review and that removal requires notice and an opportunity to respond [crs-lsb11449-cook]. But its room to ease is narrow: the Federal Open Market Committee held the target range at 3½ to 3¾ percent on 29 July 2026, where it has stood since December 2025, by a vote of nine to three with all three dissents favouring a quarter-point increase; the Committee reports inflation elevated relative to its 2 percent goal, attributing this in part to supply shocks driving price increases in sectors including energy, and describes activity as expanding despite elevated uncertainty owing in part to the conflict in the Middle East [fomc-statement-july-2026]. Ample reserves are being maintained in the banking system [fomc-statement-july-2026].

  The accelerants are fiscal, procedural and structural. Fiscal room is narrowing: debt held by the public stands at about 101% of gross domestic product, with net interest the fastest-growing outlay [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. Legislative response to a shock is slow by construction — 218 Republican seats is exactly the number required for a majority of the full House, and 53 Senate seats is a governing majority but not the sixty needed to close debate on ordinary legislation [house-partybreakdown][senate-partydiv][crs-rl30360-cloture]. Authority over the domestic deployment of force is unsettled rather than resolved: the Supreme Court blocked federalisation of a state National Guard in December 2025 on a reading of the statutory trigger, without deciding whether protecting federal property and personnel constitutes executing the law [scotus-trump-v-illinois-2025]. And physical supply is concentrated: the country was 100% net import reliant on 16 nonfuel mineral commodities in 2025, with China the primary source for 14 of the most import-dependent critical minerals [usgs-mcs-2026].

  The procedural accelerant is demonstrated rather than hypothetical, though its macroeconomic bite is modest. The fiscal 2026 funding lapse ran 43 days, from 1 October to 12 November 2025, the longest full-government shutdown on record, and a further lapse in Homeland Security funding beginning 14 February 2026 ran 76 days to 30 April 2026, the longest shutdown of a single federal department on record [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations]. The Congressional Budget Office estimated during the lapse that it would reduce annualised real growth in the fourth quarter of 2025 by one to two percentage points, and that between $7 billion and $14 billion of output in 2025 dollars would not be recovered — $11 billion under the six-week scenario closest to the eventual duration [cbo-shutdown-61823]. The Congressional Research Service reads the combined direct and indirect effects as unlikely to have a large long-term impact, consistent with the three previous long shutdowns, none of which led to recession [crs-r48832-shutdowns]. The accelerant is therefore institutional rather than macroeconomic: what recurs is a demonstrated inability to fund the state on schedule.
political_shockAbsorbers_fr: |-
  Quatre facteurs d'atténuation assurent l'essentiel de la capacité d'absorption, et l'un d'eux est actuellement affaibli. Le rôle du dollar comme monnaie de réserve et la profondeur du marché des titres du Trésor soutiennent l'emprunt public à grande échelle : les avoirs étrangers s'élevaient à environ 9 200 milliards de dollars en décembre 2025, soit 31 % de la dette détenue par le public [crs-rs22331-foreign-holdings]. Ce coussin a toutefois changé de composition : le Fonds monétaire international constate un déplacement de la base d'investisseurs non résidents (des détenteurs du secteur officiel vers des institutions financières non bancaires dont le comportement est plus sensible aux prix et au risque), et y voit la principale vulnérabilité extérieure [imf-art-iv-usa-2026]. L'autosuffisance énergétique atténue précisément le choc en cours : les exportations totales d'énergie ont atteint un record de 31 quadrillions d'unités thermiques britanniques (quads) en 2025, contre 21 quads d'importations, soit des exportations nettes record de 11 quads [eia-energy-trade-2025]. La base productive est large, les services privés comptant pour 114,1 des 159,0 millions d'emplois salariés non agricoles [bls-empsit-june2026].

  La politique monétaire est le facteur d'atténuation sous tension. L'indépendance opérationnelle de la banque centrale a été confirmée par les tribunaux en juin 2026, lorsque la Cour suprême a jugé que le motif invoqué pour révoquer un gouverneur de la Réserve fédérale était susceptible de contrôle judiciaire et qu'une révocation exigeait un préavis et la possibilité de se faire entendre [crs-lsb11449-cook]. Toutefois, sa marge d'assouplissement est étroite : le Federal Open Market Committee a maintenu la fourchette cible de 3,5 % à 3,75 % le 29 juillet 2026 (niveau inchangé depuis décembre 2025) par neuf voix contre trois, les trois dissidences réclamant toutes une hausse d'un quart de point; le comité signale une inflation élevée par rapport à sa cible de 2 %, qu'il attribue en partie à des chocs d'offre entraînant des hausses de prix dans certains secteurs, dont l'énergie, et décrit une activité en expansion malgré une forte incertitude tenant en partie au conflit au Moyen-Orient [fomc-statement-july-2026]. Des réserves abondantes sont maintenues dans le système bancaire [fomc-statement-july-2026].

  Les facteurs d'aggravation sont budgétaires, procéduraux et structurels. La marge budgétaire se resserre : la dette détenue par le public s'établit à environ 101 % du produit intérieur brut; les intérêts nets constituant le poste de dépense à la croissance la plus rapide [cbo-budget-outlook-2026][crfb-cbo-outlook-2026]. La réponse législative à un choc est lente par construction : 218 sièges républicains correspondent exactement au nombre requis pour une majorité de l'ensemble de la Chambre, et 53 sièges au Sénat constituent une majorité de gouvernement, mais non les soixante nécessaires pour clore le débat sur une loi ordinaire [house-partybreakdown][senate-partydiv][crs-rl30360-cloture]. L'autorité sur le déploiement intérieur de la force demeure indécise plutôt que réglée : la Cour suprême a bloqué la fédéralisation de la Garde nationale d'un État en décembre 2025 en interprétant le seuil prévu par la loi, sans trancher la question de savoir si protéger des biens et du personnel fédéraux revient à appliquer la loi [scotus-trump-v-illinois-2025]. Et l'approvisionnement physique est concentré : le pays dépendait à 100 % des importations nettes pour 16 produits minéraux non combustibles en 2025; la Chine étant la source principale de 14 des minéraux critiques les plus dépendants des importations [usgs-mcs-2026].

  Le facteur d'aggravation procédural est avéré plutôt qu'hypothétique, même si sa portée macroéconomique reste modeste. L'interruption des crédits de l'exercice 2026 a duré 43 jours (du 1er octobre au 12 novembre 2025), soit la plus longue fermeture de l'ensemble de l'administration jamais enregistrée, et une nouvelle interruption des crédits de la Sécurité intérieure, entamée le 14 février 2026, a duré 76 jours jusqu'au 30 avril 2026; soit la plus longue fermeture d'un seul département fédéral jamais enregistrée [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations]. Le Congressional Budget Office a estimé, pendant l'interruption, qu'elle réduirait la croissance réelle annualisée du quatrième trimestre de 2025 de un à deux points de pourcentage et qu'entre 7 et 14 milliards de dollars de production, en dollars de 2025, ne seraient pas récupérés; 11 milliards selon le scénario de six semaines, le plus proche de la durée effective [cbo-shutdown-61823]. Le Congressional Research Service juge que les effets directs et indirects combinés ne devraient pas avoir d'incidence importante à long terme; ce qui concorde avec les trois longues fermetures antérieures, dont aucune n'a provoqué de récession [crs-r48832-shutdowns]. Le facteur d'aggravation est donc institutionnel plutôt que macroéconomique : ce qui se répète, c'est l'incapacité démontrée à financer l'État dans les délais.
political_constitutionalSubstrate_en: |-
  The constitutional form is a federal presidential republic resting on a single written founding instrument, the Constitution of the United States (1787, in force 4 March 1789), which allocates sovereignty between a national government and the states and separates legislative, executive and judicial power [constitution-usa-1787]. Beneath it sit four legal orders that are not reducible to one another. The substrate is in motion rather than stable: during 2026 apex-court doctrine reallocated power on both the horizontal and the vertical axis.

  The founding instrument was re-founded once. The Reconstruction Amendments reset the terms of membership in the polity — the Thirteenth (1865) abolishing slavery, the Fourteenth (1868) establishing birthright citizenship and equal protection, the Fifteenth (1870) barring racial denial of the franchise [reconstruction-amendments]. Judicial review has anchored the order since Marbury v. Madison (1803) [marbury-v-madison-1803].

  Four orders coexist and each governs a different thing. Federal statutory law is supreme over state law under the Supremacy Clause of Article VI [constitution-usa-1787]. State law operates under powers reserved by the Tenth Amendment, each of the fifty states maintaining its own constitution, legislature, courts and code [constitution-usa-1787]. Tribal law is derived from neither: federally recognised tribes exercise inherent pre-constitutional sovereignty over their members and over Indian country, subject to congressional plenary power — a relationship established in the Marshall Trilogy and reaffirmed in McGirt v. Oklahoma (2020), qualified as to state concurrent jurisdiction in Oklahoma v. Castro-Huerta (2022), and upheld against constitutional challenge in Haaland v. Brackeen (2023) [marshall-trilogy][mcgirt-v-oklahoma-2020][oklahoma-v-castro-huerta-2022][haaland-v-brackeen-2023][usc-title25]. Five hundred and seventy-five tribal entities were federally recognised as of 30 January 2026 under a list published annually pursuant to the Federally Recognized Indian Tribe List Act of 1994; recognition may be conferred administratively, by act of Congress, or by court decision, and the most recent addition (the Lumbee Tribe of North Carolina) came by statute in December 2025 [bia-tribal-entities-2026]. The insular order governs the five inhabited unincorporated territories under the regime of the Insular Cases (from 1901), Congress holding plenary authority, the Constitution applying only selectively, and residents holding neither a presidential vote nor voting congressional representation [insular-cases-1901].

  Two populations hold membership in diminished form, and they are diminished differently. Persons born in American Samoa and Swains Island (defined by statute as outlying possessions) are nationals but not citizens of the United States at birth under 8 U.S.C. § 1408 [uscode-8-1408]; the Department of State's Foreign Affairs Manual states that these are not incorporated territories and that the citizenship acquisition provisions of the Fourteenth Amendment do not apply to persons born there [state-fam-308-2]. Residents of the District of Columbia hold citizenship and, since the Twenty-third Amendment (1961), vote in presidential elections through electors allotted to the District, but they have no voting representation in either chamber of Congress [constitution-usa-1787].

  On the horizontal axis, two rulings issued the same day reallocated power between the President, Congress and the agencies, and a third the following day held a boundary. In Trump v. Slaughter (No. 25-332, decided 29 June 2026, six to three) the Court held the Federal Trade Commission's statutory for-cause removal protection contrary to the separation of powers, overruling Humphrey's Executor v. United States (1935) on the reasoning that subordinates exercising the President's power are removable by him; the Congressional Research Service reads the decision as likely reaching officials of other commission-style agencies that wield executive power [trump-v-slaughter-2026][crs-lsb11448-slaughter]. In Trump v. Cook (No. 25A312, five to four) the Court held that a President's asserted for-cause basis for removing a Federal Reserve governor is judicially reviewable, that any definition of cause must reflect the Federal Reserve's particular history and role, and that the governor was entitled to notice and an opportunity to respond before removal — so the reallocation stops at the central bank [trump-v-cook-2026][crs-lsb11449-cook]. Chief Justice Roberts wrote both opinions, joined by two almost entirely different sets of justices; only one member of the Court was in both majorities [trump-v-slaughter-2026][trump-v-cook-2026]. The following day, in Trump v. Barbara (No. 25-365, decided 30 June 2026, six to three), the Court held that children born in the United States to parents unlawfully or temporarily present are subject to its jurisdiction and are citizens at birth, striking Executive Order 14160 and reaffirming United States v. Wong Kim Ark (1898) [trump-v-barbara-2026].

  On the vertical axis, the Court restricted federal reach into state institutions twice. In Trump v. Illinois (No. 25A443, decided 23 December 2025, six to three) it read the statutory trigger for federalising a state National Guard to require that the President be unable to execute federal law with the regular forces of the United States military [scotus-trump-v-illinois-2025]. In Watson v. Republican National Committee (No. 24-1260, decided 29 June 2026, five to four) the Court held that the federal election-day statutes do not preempt a state law counting absentee ballots postmarked by election day and received up to five business days later, reversing the Fifth Circuit; the Court noted that roughly thirty states count at least some ballots mailed by election day and received afterward [watson-v-rnc-2026].

  This follows a decade of doctrinal movement. Shelby County v. Holder (2013) disabled the coverage formula subjecting certain states to federal preclearance of election-law changes [shelby-county-2013]; West Virginia v. Environmental Protection Agency (2022) established the major questions doctrine as a clear-statement rule constraining agency authority [wv-v-epa-2022]; Loper Bright Enterprises v. Raimondo (2024) ended judicial deference to agency statutory interpretation [loper-bright-2024]; Trump v. United States (2024) recognised presidential immunity for official acts [trump-v-usa-2024]; and Trump v. CASA (2025) restricted universal injunctions as a remedy [trump-v-casa-2025].
political_constitutionalSubstrate_fr: |-
  La forme constitutionnelle est celle d'une république présidentielle fédérale reposant sur un instrument fondateur écrit unique : la Constitution des États-Unis (1787, en vigueur le 4 mars 1789), qui répartit la souveraineté entre un gouvernement national et les États et sépare les pouvoirs législatif, exécutif et judiciaire [constitution-usa-1787]. Sous cet instrument coexistent quatre ordres juridiques irréductibles les uns aux autres. Le substrat est en mouvement plutôt que stable : au cours de 2026, la jurisprudence de la plus haute cour a redistribué le pouvoir sur l'axe horizontal comme sur l'axe vertical.

  L'instrument fondateur a été refondé une fois. Les amendements de la Reconstruction ont redéfini les conditions d'appartenance à la communauté politique : le Treizième (1865) abolissant l'esclavage, le Quatorzième (1868) établissant la citoyenneté par droit du sol et l'égale protection des lois, le Quinzième (1870) interdisant le refus du droit de vote fondé sur la race [reconstruction-amendments]. Le contrôle judiciaire ancre l'ordre juridique depuis l'arrêt Marbury v. Madison (1803) [marbury-v-madison-1803].

  Quatre ordres coexistent, chacun régissant un objet distinct. Le droit fédéral prime sur le droit des États en vertu de la clause de suprématie de l'article VI [constitution-usa-1787]. Le droit des États s'exerce en vertu des pouvoirs réservés par le Dixième amendement; chacun des cinquante États maintenant sa propre constitution, sa législature, ses tribunaux et son code [constitution-usa-1787]. Le droit tribal ne découle ni de l'un ni de l'autre : les tribus reconnues par le gouvernement fédéral exercent une souveraineté inhérente et préconstitutionnelle sur leurs membres et sur le territoire indien, sous réserve du pouvoir plénier du Congrès; relation établie par la trilogie Marshall et réaffirmée dans McGirt v. Oklahoma (2020), nuancée quant à la compétence concurrente des États dans Oklahoma v. Castro-Huerta (2022), et confirmée face à une contestation constitutionnelle dans Haaland v. Brackeen (2023) [marshall-trilogy][mcgirt-v-oklahoma-2020][oklahoma-v-castro-huerta-2022][haaland-v-brackeen-2023][usc-title25]. Au 30 janvier 2026, 575 entités tribales étaient reconnues par le gouvernement fédéral, selon la liste publiée annuellement en application du Federally Recognized Indian Tribe List Act de 1994; la reconnaissance peut être conférée par voie administrative, par loi du Congrès ou par décision judiciaire, et le dernier ajout (Lumbee Tribe of North Carolina) s'est fait par voie législative en décembre 2025 [bia-tribal-entities-2026]. L'ordre insulaire régit les cinq territoires non incorporés habités selon le régime issu des arrêts insulaires (Insular Cases, à partir de 1901) : le Congrès y détient un pouvoir plénier, la Constitution ne s'y applique que de façon sélective, et les résidents ne disposent ni du droit de vote à l'élection présidentielle ni d'une représentation votante au Congrès [insular-cases-1901].

  Deux populations détiennent une appartenance diminuée, et elles le sont différemment. Les personnes nées aux Samoa américaines et à l'île Swains (définies par la loi comme des possessions éloignées) sont des ressortissants et non des citoyens des États-Unis à la naissance, en vertu du 8 U.S.C. § 1408 [uscode-8-1408]; le Foreign Affairs Manual du département d'État précise que ces territoires ne sont pas incorporés et que les dispositions du Quatorzième amendement relatives à l'acquisition de la citoyenneté ne s'appliquent pas aux personnes qui y naissent [state-fam-308-2]. Les résidents du district de Columbia détiennent la citoyenneté et, depuis le Vingt-troisième amendement (1961), votent à l'élection présidentielle (le district disposant de grands électeurs), mais ils n'ont aucune représentation votante dans l'une ou l'autre chambre du Congrès [constitution-usa-1787].

  Sur l'axe horizontal, deux arrêts rendus le même jour ont redistribué le pouvoir entre le président, le Congrès et les organismes fédéraux, et un troisième, le lendemain, a fixé une limite. Dans Trump v. Slaughter (no 25-332, rendu le 29 juin 2026, par six voix contre trois), la Cour a jugé que la protection légale contre la révocation pour motif valable dont bénéficiaient les commissaires de la Federal Trade Commission contrevient à la séparation des pouvoirs, renversant l'arrêt Humphrey's Executor v. United States (1935) au motif que les subordonnés qui exercent le pouvoir du président sont révocables par lui; le Congressional Research Service estime que la décision atteint vraisemblablement les titulaires de charge d'autres organismes collégiaux exerçant un pouvoir exécutif [trump-v-slaughter-2026][crs-lsb11448-slaughter]. Dans Trump v. Cook (no 25A312, par cinq voix contre quatre), la Cour a jugé que le motif invoqué par un président pour révoquer une gouverneure de la Réserve fédérale était susceptible de contrôle judiciaire, que toute définition du motif valable devait tenir compte de l'histoire et du rôle particuliers de la Réserve fédérale, et que la gouverneure avait droit à un préavis et à la possibilité de se faire entendre avant sa révocation; la redistribution s'arrête donc à la banque centrale [trump-v-cook-2026][crs-lsb11449-cook]. Le juge en chef Roberts a rédigé les deux opinions, entouré de deux ensembles de juges presque entièrement différents; un seul membre de la Cour figurait dans les deux majorités [trump-v-slaughter-2026][trump-v-cook-2026]. Le lendemain, dans Trump v. Barbara (no 25-365, rendu le 30 juin 2026, par six voix contre trois), la Cour a jugé que les enfants nés aux États-Unis de parents en situation irrégulière ou de séjour temporaire relevaient de la juridiction du pays et étaient citoyens dès la naissance, invalidant le décret présidentiel 14160 et réaffirmant l'arrêt United States v. Wong Kim Ark (1898) [trump-v-barbara-2026].

  Sur l'axe vertical, la Cour a restreint à deux reprises la portée fédérale sur les institutions des États. Dans Trump v. Illinois (no 25A443, rendu le 23 décembre 2025, par six voix contre trois), elle a interprété le seuil légal permettant de fédéraliser la Garde nationale d'un État comme exigeant que le président soit dans l'incapacité d'appliquer la loi fédérale avec les forces régulières de l'armée des États-Unis [scotus-trump-v-illinois-2025]. Dans Watson v. Republican National Committee (no 24-1260, rendu le 29 juin 2026, par cinq voix contre quatre), elle a jugé que les lois fédérales fixant le jour du scrutin n'écartaient pas une loi d'État permettant de compter les bulletins postaux oblitérés au plus tard le jour du scrutin et reçus dans les cinq jours ouvrables suivants, infirmant l'arrêt du cinquième circuit et relevant qu'une trentaine d'États comptaient au moins certains bulletins postés le jour du scrutin et reçus après [watson-v-rnc-2026].

  Ce mouvement s'inscrit dans une décennie d'évolution jurisprudentielle. Shelby County v. Holder (2013) a neutralisé la formule de couverture soumettant certains États à l'autorisation fédérale préalable de leurs modifications au droit électoral [shelby-county-2013]; West Virginia v. Environmental Protection Agency (2022) a établi la règle dite des questions majeures, qui exige du législateur un énoncé explicite pour habiliter une agence à trancher des questions d'importance majeure [wv-v-epa-2022]; Loper Bright Enterprises v. Raimondo (2024) a mis fin à la déférence judiciaire envers l'interprétation des lois par les agences [loper-bright-2024]; Trump v. United States (2024) a reconnu l'immunité présidentielle pour les actes officiels [trump-v-usa-2024]; et Trump v. CASA (2025) a restreint le recours aux injonctions universelles [trump-v-casa-2025].
political_stateStructure_en: |-
  The United States is a federal republic comprising fifty states, the federal District of Columbia, and five inhabited unincorporated territories [constitution-usa-1787][insular-cases-1901]. Beneath the states sits a dense administrative layer created under state rather than federal law: the 2022 Census of Governments enumerated 3,031 county governments, 35,705 municipal and township governments, 12,546 independent school districts and 39,555 special district governments — 90,837 local governments in all, counted every five years as required by 13 U.S.C. § 161 [census-governments-2022]. Special districts are single- or limited-purpose bodies operating independently of counties and municipalities, with their own authority to levy taxes for functions such as irrigation, water treatment, and soil and water conservation; they are the largest category and they are growing — 39,555 in 2022 against 38,542 in 2017 — with 16,020 of them, or 41%, serving natural-resource functions [census-governments-2022][census-cog-story-2023].

  The vertical allocation runs in both directions. Federal powers are enumerated in Article I, Section 8, and federal law made in pursuance of the Constitution is supreme under Article VI; powers not delegated to the federal government nor prohibited to the states are reserved to the states under the Tenth Amendment [constitution-usa-1787]. States accordingly maintain their own constitutions, legislatures, courts and codes operating concurrently with federal law [constitution-usa-1787]. Below that, the structure of local government — what units exist, what they may do, and how they are financed — is set by each state's own law and varies substantially between them [census-governments-2022].

  Asymmetries between units are pronounced and of two distinct kinds. The five inhabited territories — Puerto Rico, Guam, the United States Virgin Islands, the Northern Mariana Islands and American Samoa — have no vote in presidential elections and no voting representation in Congress [insular-cases-1901]. The District of Columbia is different: its residents vote in presidential elections through electors allotted to the District under the Twenty-third Amendment (1961), capped at the number held by the least populous state, but the District has no voting representation in either chamber, and Congress retains legislative authority over it under Article I, Section 8, Clause 17 [constitution-usa-1787].
political_stateStructure_fr: |-
  Les États-Unis forment une république fédérale composée de cinquante États, du district fédéral de Columbia et de cinq territoires non incorporés habités [constitution-usa-1787][insular-cases-1901]. Sous les États s'étend une couche administrative dense, créée par le droit des États et non par le droit fédéral : le Census of Governments de 2022 a recensé 3 031 administrations de comté, 35 705 administrations municipales et de canton (townships), 12 546 districts scolaires indépendants et 39 555 districts spéciaux; soit 90 837 administrations locales au total, dénombrées tous les cinq ans comme l'exige le 13 U.S.C. § 161 [census-governments-2022]. Les districts spéciaux sont des entités à vocation unique ou limitée, fonctionnant indépendamment des comtés et des municipalités et disposant de leur propre pouvoir de taxation pour des fonctions telles que l'irrigation, le traitement de l'eau et la conservation des sols et de l'eau; ils constituent la catégorie la plus nombreuse et ils progressent (39 555 en 2022 contre 38 542 en 2017), dont 16 020, soit 41 %, remplissent des fonctions liées aux ressources naturelles [census-governments-2022][census-cog-story-2023].

  La répartition verticale joue dans les deux sens. Les pouvoirs fédéraux sont énumérés à l'article I, section 8, et le droit fédéral adopté en conformité avec la Constitution prime en vertu de l'article VI; les pouvoirs qui ne sont ni délégués au gouvernement fédéral ni interdits aux États sont réservés à ces derniers par le Dixième amendement [constitution-usa-1787]. Les États maintiennent en conséquence leur propre constitution, leur législature, leurs tribunaux et leur code, qui s'appliquent concurremment avec le droit fédéral [constitution-usa-1787]. En dessous, la structure des administrations locales (quelles entités existent, ce qu'elles peuvent faire et comment elles sont financées) relève du droit de chaque État et varie sensiblement de l'un à l'autre [census-governments-2022].

  Les asymétries entre unités sont marquées et de deux ordres distincts. Les cinq territoires habités (Porto Rico, Guam, les îles Vierges américaines, les îles Mariannes du Nord et les Samoa américaines) ne votent pas à l'élection présidentielle et n'ont aucune représentation votante au Congrès [insular-cases-1901]. Le district de Columbia se trouve dans une autre situation : ses résidents votent à l'élection présidentielle grâce aux grands électeurs attribués au district par le Vingt-troisième amendement (1961), dont le nombre est plafonné à celui de l'État le moins peuplé, mais le district n'a aucune représentation votante dans l'une ou l'autre chambre, et le Congrès conserve à son égard l'autorité législative en vertu de l'article I, section 8, clause 17 [constitution-usa-1787].
capacity_inheritedTerrain_en: |-
  The state works against a continental-scale terrain whose defining feature is internal distance — densely settled coasts, a sparsely populated interior west, two non-contiguous states, and a Pacific and Caribbean periphery of five inhabited territories [territory.geography]. The population it serves is large, ageing and immigration-built, and its growth has just slowed sharply [society.demographics].

  The resource base is unusually favourable and unevenly so: an extensive energy and food endowment paired with total import dependence on a set of critical minerals concentrated in a single supplier [territory.metabolism][territory.minerals]. The productive base is the world's largest and most services-weighted [economy.realEconomy], and the fiscal base carries historically high public debt [economy.publicFinances].

  The colonial legacy runs inward and is live rather than historical. The country is a settler-and-immigrant society by construction [society.demographics], its present composition carries the demographic residue of dispossession and enslavement [society.composition], and it holds five inhabited territories whose residents do not vote for the government that legislates for them [territory.geography]. Terms of trade run the opposite way from the usual extractive case: the state issues the principal reserve currency and sets trade terms rather than taking them, which lifts the external financing constraint that binds most states of comparable ambition [economy.externalVulnerability]. No armed conflict has been fought on the continental territory since 1865, and it carries no reconstruction burden nor conflict contamination; the Pacific and Caribbean periphery is not covered by this statement.

  The country inherits an educated population and an expensive health system, but the national averages conceal very large differences between groups. Educational attainment is rising — 95% of 25-to-29-year-olds had completed at least high school by 2022 and 40% held a bachelor's degree or higher — but the gaps widen at every level above secondary, the associate's-or-higher rate running from 78% among Asian young adults down to 19% among American Indian and Alaska Native [society.wellbeing]. Health outcomes are poor for the country's wealth, life expectancy sitting below the comparable-country average despite the highest per-person health spending of any peer nation, and the mortality gradient runs in the same direction: age-adjusted death rates among American Indian and Alaska Native men reach more than twice those among Asian men [society.wellbeing]. The same populations sit at the bottom of both rankings, in attainment and in mortality.

  All of this is inherited. Continental scale, energy and mineral endowment, reserve-currency issuance, and attainment and mortality gradients laid down over generations are distributed by history, geography, colonisation and luck — never earned, never deserved, and never a measure of merit. They are the denominator against which every performance claim below must be read.
capacity_inheritedTerrain_fr: |-
  L'État compose avec un territoire d'échelle continentale dont la caractéristique déterminante est la distance interne : des littoraux densément peuplés, un intérieur occidental clairsemé, deux États non contigus et une périphérie pacifique et caraïbe formée de cinq territoires habités [territory.geography]. La population qu'il dessert est nombreuse, vieillissante et bâtie par l'immigration, et sa croissance vient de ralentir brusquement [society.demographics].

  La base de ressources est exceptionnellement favorable, mais inégalement : une dotation énergétique et alimentaire étendue, doublée d'une dépendance totale aux importations pour une série de minéraux critiques concentrés chez un seul fournisseur [territory.metabolism][territory.minerals]. La base productive est la plus vaste au monde et la plus orientée vers les services [economy.realEconomy], et la base budgétaire porte une dette publique historiquement élevée [economy.publicFinances].

  L'héritage colonial est tourné vers l'intérieur et demeure actuel plutôt qu'historique. Le pays est par construction une société de peuplement et d'immigration [society.demographics], sa composition actuelle porte la trace démographique de la dépossession et de l'esclavage [society.composition], et il détient cinq territoires habités dont les résidents ne votent pas pour le gouvernement qui légifère à leur égard [territory.geography]. Les termes de l'échange jouent à l'inverse du cas extractif habituel : l'État émet la principale monnaie de réserve et fixe les conditions du commerce plutôt que de les subir; ce qui lève la contrainte de financement extérieur qui pèse sur la plupart des États d'ambition comparable [economy.externalVulnerability]. Aucun conflit armé ne s'est déroulé sur le territoire continental depuis 1865, et celui-ci ne porte aucun fardeau de reconstruction ni aucune contamination héritée de la guerre; la périphérie pacifique et caraïbe n'est pas visée par ce constat.

  Le pays hérite d'une population instruite et d'un système de santé coûteux, mais les moyennes nationales masquent des écarts considérables entre groupes. La scolarisation progresse (95 % des 25 à 29 ans avaient terminé au moins le secondaire en 2022 et 40 % détenaient un un diplôme de premier cycle universitaire ou supérieur), mais les écarts se creusent à chaque échelon au-dessus du secondaire; le taux de diplomation collégiale ou supérieure passant de 78 % chez les jeunes adultes asiatiques à 19 % chez les Amérindiens et les autochtones d'Alaska [society.wellbeing]. Les résultats de santé sont médiocres au regard de la richesse du pays; l'espérance de vie se situant sous la moyenne des pays comparables malgré la dépense de santé par personne la plus élevée de tous ses pairs. Le gradient de mortalité joue dans le même sens : la mortalité normalisée selon l'âge chez les hommes amérindiens et autochtones d'Alaska atteint plus du double de celle des hommes asiatiques [society.wellbeing]. Les mêmes populations occupent le bas des deux classements, en scolarisation comme en mortalité.

  Tout cela est hérité. L'échelle continentale, la dotation énergétique et minérale, l'émission de la monnaie de réserve et les gradients de scolarisation et de mortalité constitués sur des générations sont distribués par l'histoire, la géographie, la colonisation et le hasard; jamais acquis, jamais mérités, et jamais une mesure de valeur. Ils forment le dénominateur au regard duquel toute affirmation de performance ci-dessous doit être lue.
capacity_steering_en: |-
  The federal state retains formidable analytic and implementation capacity, and its steering is degraded not by ignorance of its own failures but by an inability to convert diagnosis into sustained action. Prioritisation through the ordinary budget process repeatedly failed: the fiscal 2026 appropriations cycle produced the longest full-government shutdown on record — 43 days, 1 October to 12 November 2025 — and a Homeland Security funding lapse from 14 February 2026 that ran 76 days to 30 April 2026, the longest for a single department, resolved only through consolidated and continuing appropriations [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations]. Announced priorities diverge from implemented ones: deficit reduction was declared while the 2025 reconciliation act raised projected deficits by $4.7 trillion over 2026–2035 [obbba-hr1][cbo-budget-outlook-2026]. Where the executive has prioritised — homeland and hemispheric security — implementation has been rapid [ndstrategy-2026][maduro-capture-wardept].

  The response record across the domains where this report documents shortfalls is mixed, and in one case inverted. On approvals, an announced reform produced measured effect: the median time to complete an environmental impact statement fell from 3.2 years before reform to 2.2 years for statements issued in 2024, and the Permitting Dashboard established under Title 41 of the Fixing America's Surface Transportation Act now publishes target dates for covered projects [ceq-eis-timelines-2010-2024][permits-performance-gov-dashboard]. On delivery, the state's own audit body records both response and its limits: since 2023 ten high-risk areas improved, yielding some $84 billion in financial benefits, while three regressed — and those three, Department of Defense weapon systems acquisition, information-technology acquisition and management, and management of federal real property, are precisely the delivery domains this report documents as failing [gao-high-risk-list]. On staffing, the response runs against the diagnosis: twenty of the thirty-eight high-risk areas are listed in part because of skills gaps or inadequate staffing, while federal employment excluding the postal service was cut by around 13%, to levels last seen in 2009 [gao-high-risk-cost-schedule-2025][imf-art-iv-usa-2026]. On public services, the approved sources record no response to the two sharpest measured gaps — foreign food-safety inspections running at about 5% of target, and a teacher-preparation pipeline down a fifth over seven years. The audit machinery is itself unusually strong: thirty-eight areas rated every two years against five criteria, with nearly $759 billion in benefits recorded since 2006; what it lacks is the sustained legislative and executive attention the audit body identifies as the condition for progress [gao-high-risk-list].
capacity_steering_fr: |-
  L'État fédéral conserve des capacités d'analyse et de mise en œuvre considérables, et son pilotage est dégradé non par l'ignorance de ses propres défaillances, mais par l'incapacité de convertir le diagnostic en action soutenue. L'établissement des priorités par le processus budgétaire ordinaire a échoué à répétition : le cycle des crédits de l'exercice 2026 a produit la plus longue fermeture de l'ensemble de l'administration jamais enregistrée (43 jours, du 1er octobre au 12 novembre 2025) et une interruption des crédits de la Sécurité intérieure, à partir du 14 février 2026, qui a duré 76 jours jusqu'au 30 avril 2026, la plus longue pour un seul département, résolue uniquement par des crédits consolidés et provisoires [crs-r48832-shutdowns][house-approps-dhs-76day][hr7148-appropriations]. Les priorités annoncées divergent des priorités mises en œuvre : la réduction du déficit a été proclamée alors que la loi de réconciliation de 2025 relevait les déficits projetés de 4 700 milliards de dollars sur 2026-2035 [obbba-hr1][cbo-budget-outlook-2026]. Là où l'exécutif a établi une priorité (la sécurité du territoire et de l'hémisphère), la mise en œuvre a été rapide [ndstrategy-2026][maduro-capture-wardept].

  Le bilan des réponses, dans les domaines où le présent rapport documente des défaillances, est contrasté et, dans un cas, inversé. Du côté des autorisations, une réforme annoncée a produit un effet mesurable : le délai médian d'achèvement d'une étude d'impact environnemental est passé de 3,2 ans avant la réforme à 2,2 ans pour les études publiées en 2024, et le tableau de bord des autorisations établi par le titre 41 du Fixing America's Surface Transportation Act publie désormais les dates cibles des projets visés [ceq-eis-timelines-2010-2024][permits-performance-gov-dashboard]. Du côté de la livraison, l'organisme de vérification de l'État consigne à la fois la réponse et ses limites : depuis 2023, dix domaines à haut risque se sont améliorés, pour quelque 84 milliards de dollars de retombées financières, tandis que trois ont régressé; ces trois-là (l'acquisition des systèmes d'armes du département de la Défense, l'acquisition et la gestion des technologies de l'information et la gestion des biens immobiliers fédéraux) sont précisément les domaines de livraison que ce rapport documente comme défaillants [gao-high-risk-list]. Du côté des effectifs, la réponse joue contre le diagnostic : vingt des trente-huit domaines à haut risque y figurent en partie en raison de lacunes de compétences ou d'effectifs insuffisants, alors que l'emploi fédéral hors service postal a été réduit d'environ 13 %, à des niveaux inédits depuis 2009 [gao-high-risk-cost-schedule-2025][imf-art-iv-usa-2026]. Du côté des services publics, les sources retenues ne consignent aucune réponse aux deux écarts mesurés les plus marqués : les inspections de salubrité des aliments importés, réalisées à environ 5 % de la cible, et une filière de formation des enseignants en recul d'un cinquième en sept ans. Le dispositif est lui-même remarquablement solide : trente-huit domaines évalués tous les deux ans selon cinq critères, pour près de 759 milliards de dollars de retombées consignées depuis 2006; ce qui lui manque, c'est l'attention législative et exécutive soutenue que l'organisme de vérification désigne comme la condition du progrès [gao-high-risk-list].
capacity_approvals_en: |-
  The federal state can say yes or no to a major project, but the decision is slow, only partially measured, and the framework governing it was dismantled in 2025. Across all federal agencies, the median time to complete an environmental impact statement under the National Environmental Policy Act — from notice of intent to final statement — was 2.8 years for statements finalized between January 2019 and December 2024, and 2.2 years for those issued in 2024, when about 41% were completed in two years or less against 24% in 2019; the figures come from the Council on Environmental Quality's January 2025 timeline update covering 1,903 statements finalized 2010–2024, which puts the pre-reform 2010–2018 median at 3.2 years [ceq-eis-timelines-2010-2024]. The pre-reform record measured to the record of decision was slower still: a 4.5-year average across the 1,276 statements whose final version was published between 1 January 2010 and 31 December 2018, half taking longer than 3.5 years and one quarter more than 6.0 years [ceq-eis-timeline-factsheet-2020]. The delay sits upstream of the draft document: notice of intent to draft statement consumed on average 58.4% of elapsed time, draft to final 32.2%, and final to record of decision 9.4% [ceq-eis-timeline-factsheet-2020]. Documents ran well past the 150-page limit then recommended by the Council, or 300 pages for proposals of unusual scope: across 761 actions with a final statement published between 1 January 2013 and 31 December 2018, draft statements averaged 575 pages, with appendices averaging a further 584 pages at draft stage and 1,042 at final [ceq-eis-timeline-factsheet-2020].

  Regulatory predictability was reduced twice in 2025, from opposite directions. Executive Order 14154 rescinded the executive order on which the Council on Environmental Quality had based its rulemaking authority for five decades, and the Council rescinded all government-wide regulations implementing the Act by interim final rule effective April 2025; agencies have since issued their own procedures, so no uniform federal framework now governs review [crs-lsb11333-seven-county]. In May 2025 the Supreme Court, in Seven County Infrastructure Coalition v. Eagle County, constrained the analysis of separate but related projects, expanded agency discretion over the scope of review, and limited judicial review of the result [crs-lsb11333-seven-county]. Both changes shorten reviews and make them harder to challenge; both also remove the common standard against which a developer could previously predict what a review would require. The earlier deficiency compounds this: the Government Accountability Office found in April 2014 that data on the number and type of most reviews were not readily available and that agencies did not routinely track environmental assessments or categorical exclusions, with the Council estimating that about 95% of reviews are categorical exclusions, under 5% environmental assessments and under 1% environmental impact statements [gao-nepa-review-2014]. Statements are therefore the best-measured and rarest category, and the 99% of reviews below them remain unmeasured government-wide.

  A published approvals regime survives the rescission because it rests on statute rather than regulation. Title 41 of the Fixing America's Surface Transportation Act, enacted 4 December 2015 and codified at 42 United States Code § 4370m, requires the lead federal agency for every covered project to post target completion dates for environmental review and authorization on the Permitting Dashboard, which tracks each project through eight status values — planned, in progress, paused, complete, cancelled, class of action changed, financing withdrawn, and no longer required to be tracked — across covered projects, transparency projects, Department of Transportation projects and others [permits-performance-gov-dashboard]. The dashboard states that inclusion implies no federal endorsement and creates no presumption that a covered project will be approved [permits-performance-gov-dashboard]. That status field is where the proposed-versus-consented-versus-built record becomes visible, and the sectoral skew is legible in it: among the first twenty covered projects listed alphabetically on 3 August 2026, all three mining projects carried in-progress status, while of six federal offshore wind projects two were cancelled, two paused, one complete and one planned, and of three solar projects two were cancelled [permits-performance-gov-dashboard]. Covered projects run to seven pages of twenty and the dashboard publishes no status breakdown for the full set; the complete project and timeline dataset is downloadable by lead agency from the data portal [permits-performance-gov-data-portal]. The skew tracks policy — an executive order of 20 March 2025 on immediate measures to increase American mineral production directed the Permitting Council's executive director to publish designated mineral production projects on the dashboard as transparency projects [permits-performance-gov-dashboard].
capacity_approvals_fr: |-
  L'État fédéral détient le pouvoir d'autoriser ou de refuser un grand projet, mais la décision est lente, mesurée en partie seulement, et le cadre qui la régissait a été démantelé en 2025. Tous organismes fédéraux confondus, le délai médian d'achèvement d'une étude d'impact environnemental au titre du National Environmental Policy Act (de l'avis d'intention à l'étude finale) s'établissait à 2,8 ans pour les études finalisées entre janvier 2019 et décembre 2024, et à 2,2 ans pour celles publiées en 2024, année où environ 41 % ont été achevées en deux ans ou moins contre 24 % en 2019; les chiffres proviennent de la mise à jour de janvier 2025 du Council on Environmental Quality, portant sur 1 903 études finalisées de 2010 à 2024, qui situe la médiane d'avant la réforme, de 2010 à 2018, à 3,2 ans [ceq-eis-timelines-2010-2024]. Le bilan d'avant la réforme, mesuré jusqu'au registre de décision, était plus lent encore : une moyenne de 4,5 ans pour les 1 276 études dont la version finale a été publiée entre le 1er janvier 2010 et le 31 décembre 2018; la moitié dépassant 3,5 ans et le quart plus de 6,0 ans [ceq-eis-timeline-factsheet-2020]. Le retard se situe en amont du document provisoire : le passage de l'avis d'intention à l'étude provisoire a consommé en moyenne 58,4 % du temps écoulé, celui de l'étude provisoire à l'étude finale 32,2 %, et celui de l'étude finale au registre de décision 9,4 % [ceq-eis-timeline-factsheet-2020]. Les documents dépassaient largement la limite de 150 pages alors recommandée par le Council, ou de 300 pages pour les propositions d'ampleur inhabituelle : pour 761 interventions dont l'étude finale a été publiée entre le 1er janvier 2013 et le 31 décembre 2018, les études provisoires comptaient en moyenne 575 pages; les annexes ajoutant en moyenne 584 pages au stade provisoire et 1 042 au stade final [ceq-eis-timeline-factsheet-2020].

  La prévisibilité réglementaire a été réduite deux fois en 2025, dans des directions opposées. Le décret présidentiel 14154 a abrogé le décret sur lequel le Council on Environmental Quality fondait depuis cinq décennies son pouvoir réglementaire, et le Council a abrogé l'ensemble des règlements fédéraux d'application de la loi par règle provisoire définitive entrée en vigueur en avril 2025. Les organismes ont depuis adopté leurs propres procédures, de sorte qu'aucun cadre fédéral uniforme ne régit plus l'examen [crs-lsb11333-seven-county]. En mai 2025, la Cour suprême, dans Seven County Infrastructure Coalition v. Eagle County, a restreint l'analyse des projets distincts mais connexes, élargi le pouvoir d'appréciation des organismes quant à la portée de l'examen, et limité le contrôle judiciaire du résultat [crs-lsb11333-seven-county]. Les deux changements raccourcissent les examens et les rendent plus difficiles à contester; tous deux suppriment aussi la norme commune qui permettait auparavant à un promoteur de prévoir ce qu'un examen exigerait. La lacune antérieure aggrave cet effet : le Government Accountability Office a constaté en avril 2014 que les données sur le nombre et la nature de la plupart des examens n'étaient pas aisément accessibles et que les organismes ne suivaient pas systématiquement les évaluations environnementales ni les exclusions catégorielles; le Council estimant qu'environ 95 % des examens sont des exclusions catégorielles, moins de 5 % des évaluations environnementales et moins de 1 % des études d'impact [gao-nepa-review-2014]. Les études d'impact constituent donc la catégorie la mieux mesurée et la plus rare, et les 99 % d'examens qui se situent en dessous demeurent non mesurés à l'échelle fédérale.

  Un régime d'autorisation publié survit à l'abrogation parce qu'il repose sur la loi et non sur le règlement. Le titre 41 du Fixing America's Surface Transportation Act, adopté le 4 décembre 2015 et codifié au 42 United States Code § 4370m, oblige l'organisme fédéral responsable de chaque projet visé à publier les dates cibles d'achèvement de l'examen environnemental et de l'autorisation sur le tableau de bord des autorisations, qui suit chaque projet selon huit états (prévu, en cours, suspendu, terminé, annulé, catégorie d'intervention modifiée, financement retiré, et suivi non requis) pour les projets visés, les projets de transparence, les projets du département des Transports et d'autres [permits-performance-gov-dashboard]. Le tableau de bord précise que l'inscription ne fait intervenir aucun appui fédéral et ne crée aucune présomption d'approbation [permits-performance-gov-dashboard]. C'est dans ces états que devient visible le bilan des projets proposés, autorisés et construits, et l'asymétrie sectorielle s'y lit : parmi les vingt premiers projets visés inscrits par ordre alphabétique le 3 août 2026, les trois projets miniers étaient tous en cours, tandis que sur six projets éoliens en mer fédéraux, deux étaient annulés, deux suspendus, un terminé et un prévu, et sur trois projets solaires, deux étaient annulés [permits-performance-gov-dashboard]. Les projets visés s'étalent sur sept pages de vingt et le tableau de bord ne publie aucune ventilation par état pour l'ensemble; le jeu de données complet des projets et des échéanciers est téléchargeable par organisme responsable depuis le portail de données [permits-performance-gov-data-portal]. L'asymétrie suit la politique : un décret présidentiel du 20 mars 2025 sur les mesures immédiates visant à accroître la production minérale a chargé le directeur exécutif du Permitting Council de publier certains projets de production minérale sur le tableau de bord à titre de projets de transparence [permits-performance-gov-dashboard].
capacity_delivery_en: |-
  The realised record on infrastructure at scale is best read against the money the state itself appropriated for it. The American Society of Civil Engineers graded United States infrastructure a C overall in its 2025 quadrennial assessment of 18 categories — the first C in the series, up from C- in 2021 and D+ in 2017 — and estimates that $9.1 trillion is needed to reach a state of good repair against $5.4 trillion in forecast public and private investment over 2024–2033, leaving a $3.7 trillion gap; the Society is a professional engineering body with a known advocacy orientation toward higher infrastructure spending [asce-infrastructure-report-card-2025]. Against that deficit, the Infrastructure Investment and Jobs Act made $711.8 billion available in grants to tribes, states, localities and territories across fifteen federal agencies, the Department of Transportation receiving 74% [gao-iija-grants-status-2025]. As of 31 December 2024, agencies had obligated $275.1 billion of that total, or 39%, and outlayed $119.4 billion, or 17%; measured against the $580.6 billion actually available between fiscal 2022 and fiscal 2025 rather than the full authorisation, the rates were 47% obligated and 21% outlayed [gao-iija-grants-status-2025].

  What moves is the money nobody has to decide about. At the Department of Transportation, at least 76% of obligated funding and roughly 91% of outlayed funding was formula grant money distributed to states by statutory formula rather than by award decision, and two formula programmes alone accounted for at least 68% of the department's outlayed formula funding [gao-iija-dot-2025]. Discretionary money moved far more slowly: about 23% of surveyed awardees of fiscal 2022 discretionary grants still had no signed grant agreement when they responded between December 2024 and March 2025, citing inflation cost increases, difficulty defining project budget and schedule, environmental review, and domestic-content requirements [gao-iija-dot-2025]. From January 2025, executive orders directed agencies to pause disbursement pending review of consistency with administration priorities; across four agencies holding about $574.7 billion, roughly 76% had been obligated, and the reviews approved about 9,500 awards worth $128 billion, cancelled about 800 worth $17.8 billion, and left more than 2,500 worth $33.6 billion pending decision [gao-funding-status-2026].

  On its own operations rather than the national estate, the execution record is weaker and in places deteriorating. The Government Accountability Office reports great difficulty controlling costs across a procurement portfolio of more than $750 billion, with major acquisitions at the Departments of Defense, Energy and Veterans Affairs and at the National Aeronautics and Space Administration experiencing cost growth, schedule delays or both [gao-high-risk-cost-schedule-2025]. Three areas regressed between the 2023 and 2025 high-risk assessments — Department of Defense weapon systems acquisition, information-technology acquisition and management, and management of federal real property [gao-high-risk-list][gao-high-risk-cost-schedule-2025]. The federal real-property estate comprises 277,000 buildings whose annual maintenance and operating costs exceeded $10.3 billion in fiscal 2023, while reported deferred maintenance and repairs rose from $170 billion in 2017 to $370 billion in 2024 [gao-high-risk-cost-schedule-2025]. Two projects illustrate the schedule record: the Veterans Affairs electronic health record modernisation, costed in 2022 at $49.8 billion over its life cycle, had reached six locations as of December 2024 with more than 160 remaining; and a 2023 assessment found 51 of the Federal Aviation Administration's 138 air traffic control systems unsustainable and a further 54 potentially so [gao-high-risk-cost-schedule-2025]. Delivery of federal disaster assistance was added to the high-risk list as a new area in 2025, fragmented across more than 30 entities, against appropriations of at least $448 billion over fiscal years 2015–2024 plus $110 billion supplemental in December 2024 [gao-high-risk-list][gao-high-risk-cost-schedule-2025].
capacity_delivery_fr: |-
  Le bilan réel en matière d'infrastructures à grande échelle se lit d'abord au regard des fonds que l'État lui-même y a affectés. L'American Society of Civil Engineers a attribué la note globale de C aux infrastructures des États-Unis dans son évaluation quadriennale de 2025 portant sur 18 catégories (première note C de la série, après C- en 2021 et D+ en 2017) et estime qu'il faudrait 9 100 milliards de dollars pour les ramener en bon état, contre 5 400 milliards d'investissements publics et privés prévus de 2024 à 2033, soit un écart de 3 700 milliards (la Society est un organisme professionnel d'ingénierie dont l'orientation militante en faveur d'une hausse des dépenses d'infrastructure est connue) [asce-infrastructure-report-card-2025]. Face à ce déficit, l'Infrastructure Investment and Jobs Act a rendu disponibles 711,8 milliards de dollars en subventions aux tribus, aux États, aux administrations locales et aux territoires, répartis entre quinze organismes fédéraux, le département des Transports en recevant 74 % [gao-iija-grants-status-2025]. Au 31 décembre 2024, les organismes en avaient engagé 275,1 milliards, soit 39 %, et déboursé 119,4 milliards, soit 17 %; rapportés aux 580,6 milliards effectivement disponibles entre les exercices 2022 et 2025 plutôt qu'à l'autorisation totale, les taux atteignaient 47 % d'engagement et 21 % de décaissement [gao-iija-grants-status-2025].

  Ce qui circule, c'est l'argent sur lequel personne n'a à décider. Au département des Transports, au moins 76 % des fonds engagés et environ 91 % des fonds décaissés relevaient de subventions par formule, réparties entre les États selon une formule légale plutôt que par décision d'attribution, et deux programmes par formule représentaient à eux seuls au moins 68 % des fonds par formule décaissés par le département [gao-iija-dot-2025]. Les fonds discrétionnaires ont circulé bien plus lentement : environ 23 % des bénéficiaires interrogés de subventions discrétionnaires de l'exercice 2022 n'avaient toujours pas d'entente signée au moment de répondre (entre décembre 2024 et mars 2025); invoquant la hausse des coûts liée à l'inflation, la difficulté de définir le budget et l'échéancier des projets, l'examen environnemental et les exigences de contenu national [gao-iija-dot-2025]. À compter de janvier 2025, des décrets présidentiels ont ordonné aux organismes de suspendre les décaissements en attendant un examen de conformité aux priorités de l'administration; pour quatre organismes détenant environ 574,7 milliards de dollars, quelque 76 % avaient été engagés, et les examens ont approuvé environ 9 500 attributions valant 128 milliards, annulé environ 800 valant 17,8 milliards, et laissé plus de 2 500 attributions valant 33,6 milliards en attente de décision [gao-funding-status-2026].

  Pour ses propres opérations plutôt que pour le patrimoine national, le bilan d'exécution est plus faible et, par endroits, se dégrade. Le Government Accountability Office fait état de grandes difficultés à maîtriser les coûts d'un portefeuille d'approvisionnement de plus de 750 milliards de dollars; les grandes acquisitions des départements de la Défense, de l'Énergie et des Anciens Combattants ainsi que de la National Aeronautics and Space Administration connaissant des dépassements de coûts, des retards, ou les deux [gao-high-risk-cost-schedule-2025]. Trois domaines ont régressé entre les évaluations à haut risque de 2023 et de 2025 : l'acquisition des systèmes d'armes du département de la Défense, l'acquisition et la gestion des technologies de l'information, et la gestion des biens immobiliers fédéraux [gao-high-risk-list][gao-high-risk-cost-schedule-2025]. Le parc immobilier fédéral compte 277 000 bâtiments dont les coûts annuels d'entretien et d'exploitation ont dépassé 10,3 milliards de dollars à l'exercice 2023, tandis que l'entretien différé déclaré est passé de 170 milliards en 2017 à 370 milliards en 2024 [gao-high-risk-cost-schedule-2025]. Deux projets illustrent le bilan des échéanciers : la modernisation du dossier de santé électronique des Anciens Combattants (chiffrée en 2022 à 49,8 milliards sur son cycle de vie) avait atteint six sites en décembre 2024, plus de 160 restant à déployer; et une évaluation de 2023 a jugé 51 des 138 systèmes de contrôle du trafic aérien de la Federal Aviation Administration non viables, et 54 autres potentiellement non viables [gao-high-risk-cost-schedule-2025]. La prestation de l'aide fédérale en cas de catastrophe a été ajoutée à la liste des domaines à haut risque en 2025, répartie entre plus de 30 entités, face à des crédits d'au moins 448 milliards de dollars sur les exercices 2015 à 2024, auxquels s'ajoutent 110 milliards de crédits supplémentaires en décembre 2024 [gao-high-risk-list][gao-high-risk-cost-schedule-2025].
capacity_publicServices_en: |-
  Health care is the largest continuous system the state runs and the only universal service it does not universally provide. Health consumption expenditure reached about $5.0 trillion in 2024, or 17.2% of gross domestic product [crs-if10830-health-coverage]. Coverage is near-universal above 65 and incomplete below it: 8.3% of the population, 28.0 million people, had no health insurance in 2025, against 9.2% and 30.0 million in 2021, while 11.6% of working-age adults were uninsured, unchanged from 2024 [nchs-insurance-2025]. Coverage depends materially on which state a person lives in — adults aged 18 to 64 in states that had not expanded Medicaid were almost twice as likely to be uninsured, at 18.1%, as those in expansion states, at 9.0% [nchs-insurance-2025]. The public programme is contracting: Medicaid and the Children's Health Insurance Program covered 73.9 million people in April 2026, down 5 million or 6% over the year, with enrolment falling in every state; work requirements enacted in the 2025 reconciliation act take effect from January 2027 and eligibility restrictions for certain immigrant populations from October 2026 [kff-medicaid-enrollment-tracker].

  The administrative systems running those programmes sit on the state's own high-risk register. The Government Accountability Office's February 2025 list contains 38 areas, of which a substantial block covers continuous public-service systems: Veterans Affairs health care, Medicare and improper payments, Medicaid programme integrity, oversight of medical products, leadership and coordination of public health emergencies, and federal programmes serving tribes and their members [gao-high-risk-list]. Waiting times are published facility by facility on the department's Access to Care website rather than as a national series [va-access-to-care], and independent readings of those figures have diverged sharply from departmental summaries: minority staff of the Senate Committee on Veterans' Affairs, tracking the published data weekly from January 2025, reported Connecticut clinics where new-patient mental health waits exceeded 100 days in most weeks from May 2025, against an agencywide average the department put at about fifteen days [senate-vac-wait-times-2025]. The committee minority is the opposition party's staff and its facilities are not a national sample; what the divergence establishes is that the department's own published data sustains readings its summary figures do not. Twenty of the 38 are listed in part because of skills gaps or inadequate staffing [gao-high-risk-cost-schedule-2025]. Programme-integrity losses are large and persistent: federal agencies have reported about $2.8 trillion in estimated improper payments since 2003, including more than $150 billion government-wide in each of the last seven years, and high-risk-list programmes — Medicare and Medicaid among the fastest-growing — accounted for about 80% of the government-wide estimate for fiscal 2023 [gao-high-risk-cost-schedule-2025]. Inspection capacity is a binding constraint in food and drug oversight: the Food and Drug Administration conducted an average of 917 foreign food safety inspections a year over fiscal years 2018–2023, about 5% of its 19,200 annual target [gao-high-risk-cost-schedule-2025].

  In education the binding constraint is staffing, and it is worsening on both sides of the ledger: vacancies are rising while the supply of new teachers falls. Fifty-three per cent of public schools reported being understaffed entering the 2022–23 school year, among them 65% in special education and 45% in general elementary teaching, and 44% reported at least one vacant teaching position in October 2022 after the year had started [nces-condition-of-education]. The share of public schools hiring for at least one open teaching position rose from 66% in 2011–12 to 80% in 2020–21, and difficulty filling those positions rose across all twelve reported subject fields — in special education, from 17% of hiring schools to 40% [nces-condition-of-education]. The supply pipeline contracted over the same period: completions of teacher preparation programmes fell 20%, from 189,200 in 2012–13 to 151,100 in 2019–20, traditional-route completions down 28% and the alternative-route share of completers rising from 15% to 23% [nces-condition-of-education]. Staffing difficulty is distributed unevenly by place and poverty: among public schools hiring in mathematics in 2020–21, 24% of low-poverty schools reported difficulty filling the position against 31% to 34% of higher-poverty schools, and 27% of suburban schools against 35% of rural schools and 41% of schools in towns [nces-condition-of-education].
capacity_publicServices_fr: |-
  Les soins de santé constituent le plus vaste système continu géré par l'État et le seul service universel qu'il n'assure pas universellement. Les dépenses de consommation en santé ont atteint environ 5 000 milliards de dollars en 2024, soit 17,2 % du produit intérieur brut [crs-if10830-health-coverage]. La couverture est quasi universelle au-delà de 65 ans et incomplète en deçà : 8,3 % de la population, soit 28,0 millions de personnes, n'avaient aucune assurance maladie en 2025, contre 9,2 % et 30,0 millions en 2021, tandis que 11,6 % des adultes en âge de travailler n'étaient pas assurés, proportion inchangée depuis 2024 [nchs-insurance-2025]. La couverture dépend sensiblement de l'État de résidence : les adultes de 18 à 64 ans vivant dans un État n'ayant pas étendu Medicaid étaient presque deux fois plus susceptibles d'être sans assurance (à 18,1 %) que ceux des États l'ayant étendu (à 9,0 %) [nchs-insurance-2025]. Le programme public se contracte : Medicaid et le Children's Health Insurance Program couvraient 73,9 millions de personnes en avril 2026, en baisse de 5 millions ou 6 % sur un an, les inscriptions reculant dans tous les États; les exigences de travail adoptées dans la loi de réconciliation de 2025 entrent en vigueur en janvier 2027 et les restrictions d'admissibilité visant certaines populations immigrantes en octobre 2026 [kff-medicaid-enrollment-tracker].

  Les systèmes administratifs qui gèrent ces programmes figurent au registre des secteurs à risque élevé (High-Risk List) établi par l'État lui-même. La liste de février 2025 du Government Accountability Office compte 38 domaines, dont un bloc important couvre des systèmes de services publics continus : les soins de santé aux anciens combattants, Medicare et les paiements irréguliers, l'intégrité du programme Medicaid, la surveillance des produits médicaux, la direction et la coordination des urgences de santé publique, et les programmes fédéraux au service des tribus et de leurs membres [gao-high-risk-list]. Les délais d'attente sont publiés établissement par établissement sur le site Access to Care du département plutôt que sous forme de série nationale [va-access-to-care], et les lectures indépendantes de ces chiffres divergent fortement des synthèses ministérielles. Les services du parti d'opposition au sein du comité sénatorial des Anciens Combattants, qui suivent les données publiées chaque semaine depuis janvier 2025, ont relevé des cliniques du Connecticut où l'attente d'un premier rendez-vous en santé mentale dépassait 100 jours la plupart des semaines depuis mai 2025, contre une moyenne nationale que le département situait à une quinzaine de jours [senate-vac-wait-times-2025]. Ces établissements ne constituent pas un échantillon national; la divergence établit que les données publiées par le département lui-même autorisent des lectures que ses chiffres de synthèse n'autorisent pas. Vingt des 38 y figurent en partie en raison de lacunes de compétences ou d'effectifs insuffisants [gao-high-risk-cost-schedule-2025]. Les pertes d'intégrité des programmes sont importantes et persistantes : les organismes fédéraux ont déclaré environ 2 800 milliards de dollars de paiements irréguliers estimés depuis 2003, dont plus de 150 milliards à l'échelle fédérale chacune des sept dernières années; les programmes inscrits au registre (Medicare et Medicaid parmi ceux qui progressent le plus vite) représentant environ 80 % de l'estimation fédérale pour l'exercice 2023 [gao-high-risk-cost-schedule-2025]. La capacité d'inspection est une contrainte déterminante dans la surveillance des aliments et des médicaments : la Food and Drug Administration a mené en moyenne 917 inspections de salubrité des aliments importés par an de l'exercice 2018 à l'exercice 2023, soit environ 5 % de sa cible annuelle de 19 200 [gao-high-risk-cost-schedule-2025].

  En éducation, la contrainte déterminante est celle des effectifs, et elle s'aggrave des deux côtés du bilan : les postes vacants augmentent pendant que la relève diminue. Cinquante-trois pour cent des écoles publiques se déclaraient en sous-effectif à l'entrée de l'année scolaire 2022-2023, dont 65 % en adaptation scolaire et 45 % en enseignement primaire général, et 44 % signalaient au moins un poste d'enseignant vacant en octobre 2022, l'année déjà commencée [nces-condition-of-education]. La proportion d'écoles publiques recrutant pour au moins un poste d'enseignant est passée de 66 % en 2011-2012 à 80 % en 2020-2021, et la difficulté à pourvoir ces postes a augmenté dans les douze champs disciplinaires recensés; en adaptation scolaire, de 17 % des écoles recruteuses à 40 % [nces-condition-of-education]. La filière d'alimentation s'est contractée sur la même période : les diplomations des programmes de formation à l'enseignement ont reculé de 20 %, de 189 200 en 2012-2013 à 151 100 en 2019-2020; celles de la voie traditionnelle chutant de 28 % et la part des voies parallèles passant de 15 % à 23 % [nces-condition-of-education]. La difficulté de recrutement se répartit inégalement selon le lieu et la pauvreté : parmi les écoles publiques recrutant en mathématiques en 2020-2021, 24 % des écoles à faible taux de pauvreté déclaraient de la difficulté, contre 31 % à 34 % des écoles à taux plus élevé, et 27 % des écoles de banlieue contre 35 % des écoles rurales et 41 % des écoles de petites villes [nces-condition-of-education].
capacity_productivity_en: |-
  Productivity is growing but decelerating, and the recent gains come as much from shedding hours as from producing more. Nonfarm business sector labour productivity rose 0.3% at an annual rate in the first quarter of 2026 — output up 1.0%, hours up 0.7% — the smallest quarterly increase since the first quarter of 2025, when productivity fell 0.9%; measured against the same quarter a year earlier the increase was 2.8%, and across the current business cycle the annualised rate is 2.1% [bls-productivity-2026]. Total factor productivity in the private nonfarm business sector rose 0.8% in 2025, output up 2.6% against combined inputs up 1.7% [bls-productivity-2026]. The industry detail qualifies the headline: labour productivity rose in 41 of 85 manufacturing and mining industries in 2025, but output fell in 66 of the 85 and hours worked fell in 52 — productivity improving in much of the sector because hours contracted faster than output [bls-productivity-2026]. By state the pattern was broader: productivity rose in 42 states and the District of Columbia in 2025, with output rising in all fifty states and the District [bls-productivity-2026]. The Congressional Budget Office incorporates generative artificial intelligence as adding about 10 basis points a year to average productivity growth [cbo-budget-outlook-2026].

  Research capacity is large, and the share of it funded by the state has fallen by two thirds over six decades. The ratio of research and development to gross domestic product reached 3.40% in 2021, having passed 3% for the first time in 2019; at the previous peak in 1964 federal expenditure alone accounted for 1.86% of gross domestic product and 67% of all domestic research, against business funding of 0.86% and 31% [ncses-federally-funded-rd]. By 2020 businesses accounted for 73% of domestic research at 2.47% of gross domestic product, and the federally funded share had fallen to 21% and 0.70% [ncses-federally-funded-rd]. The shift now reaches the long-horizon work: businesses funded 75% of total research performed in 2023 against 18% from the federal government, and the business share of basic research funding grew from 21% in 2012 to an estimated 35% in 2023 while the federal share fell from 52% to 41% [ncses-indicators-2025]. Federal research obligations in fiscal 2023 were weighted toward the near term — 25% basic research at $47 billion, 29% applied at $54 billion, 46% experimental development at $85 billion [ncses-indicators-2025].

  On value added, the country builds high-value services and imports the goods. Services exports produced a surplus of $339.5 billion in 2025 against a goods deficit of $1,240.9 billion [bea-census-trade-annual-2025], and manufacturing employs 12.6 million people, 7.9% of nonfarm payrolls [bls-empsit-june2026]. In minerals the extraction-versus-processing gap is the binding one: nonfuel mineral production was valued at $112 billion in 2025, yet the country was 100% net import reliant on 16 nonfuel mineral commodities, with China the primary source for 14 of the most import-dependent critical minerals [usgs-mcs-2026]. The approved sources measure production and import reliance but not domestic processing capacity separately, so the share of domestically mined material processed domestically cannot be stated. On internal barriers to the movement of goods, labour and capital between the fifty states — interstate barriers, in the country's own term — the largest measurable one is occupational licensing. In 2024, 21.6% of employed persons aged 16 and over held a state licence to work in their occupation and a further 2.4% held a certification without a licence, out of 161.3 million employed; among management, professional and related occupations the licensed share was 30.5% [bls-cps-licensing-2024]. Licences are issued under each state's own regulatory structure [census-governments-2022], so a licensed worker moving between states generally faces re-licensing. The approved sources do not measure how much movement this forecloses.
capacity_productivity_fr: |-
  La productivité progresse mais décélère, et les gains récents proviennent autant de la réduction des heures que d'une hausse de la production. La productivité du travail dans le secteur des entreprises non agricoles a augmenté de 0,3 % en rythme annualisé au premier trimestre de 2026 (production en hausse de 1,0 %, heures travaillées de 0,7 %), soit la plus faible hausse trimestrielle depuis le premier trimestre de 2025, où la productivité avait reculé de 0,9 %. Mesurée par rapport au même trimestre un an plus tôt, la hausse atteignait 2,8 %, et sur le cycle économique en cours, le rythme annualisé s'établit à 2,1 % [bls-productivity-2026]. La productivité globale des facteurs dans le secteur privé non agricole a progressé de 0,8 % en 2025, la production augmentant de 2,6 % contre 1,7 % pour l'ensemble des intrants [bls-productivity-2026]. Le détail sectoriel nuance le résultat global : la productivité du travail a augmenté dans 41 des 85 industries manufacturières et minières en 2025, mais la production a reculé dans 66 d'entre elles et les heures travaillées dans 52; la productivité s'améliorant dans une grande partie du secteur parce que les heures se contractaient plus vite que la production [bls-productivity-2026]. Par État, la tendance était plus large : la productivité a augmenté dans 42 États et le district de Columbia en 2025, la production progressant dans les cinquante États et le district [bls-productivity-2026]. Le Congressional Budget Office intègre l'intelligence artificielle générative comme ajoutant environ 10 points de base par an à la croissance moyenne de la productivité [cbo-budget-outlook-2026].

  La capacité de recherche est considérable, et la part financée par l'État a chuté des deux tiers en six décennies. Le rapport de la recherche-développement au produit intérieur brut atteignait 3,40 % en 2021, après avoir dépassé 3 % pour la première fois en 2019; au sommet précédent, en 1964, les dépenses fédérales représentaient à elles seules 1,86 % du produit intérieur brut et 67 % de toute la recherche intérieure, contre 0,86 % et 31 % pour le financement des entreprises [ncses-federally-funded-rd]. En 2020, les entreprises assuraient 73 % de la recherche intérieure, soit 2,47 % du produit intérieur brut, et la part financée par le fédéral était tombée à 21 % et 0,70 % [ncses-federally-funded-rd]. Le déplacement touche désormais les travaux à long horizon : les entreprises ont financé 75 % de la recherche totale réalisée en 2023, contre 18 % pour le gouvernement fédéral, et leur part du financement de la recherche fondamentale est passée de 21 % en 2012 à environ 35 % en 2023, tandis que la part fédérale reculait de 52 % à 41 % [ncses-indicators-2025]. Les engagements fédéraux de recherche de l'exercice 2023 penchaient vers le court terme : 25 % en recherche fondamentale (soit 47 milliards de dollars), 29 % en recherche appliquée (soit 54 milliards) et 46 % en développement expérimental (soit 85 milliards) [ncses-indicators-2025].

  Du côté de la valeur ajoutée, le pays fabrique des services à forte valeur et importe les biens. Les exportations de services ont dégagé un excédent de 339,5 milliards de dollars en 2025, contre un déficit de 1 240,9 milliards sur les biens [bea-census-trade-annual-2025], et la fabrication emploie 12,6 millions de personnes, soit 7,9 % des emplois salariés non agricoles [bls-empsit-june2026]. Dans les minéraux, l'écart déterminant se situe entre l'extraction et la transformation : la production minière non combustible a été évaluée à 112 milliards de dollars en 2025, alors que le pays dépendait à 100 % des importations nettes pour 16 produits minéraux non combustibles; la Chine étant la source principale de 14 des minéraux critiques les plus dépendants des importations [usgs-mcs-2026]. Les sources retenues mesurent la production et la dépendance aux importations, mais non la capacité de transformation intérieure prise séparément; la part du minerai extrait au pays qui y est aussi transformée ne peut donc être établie. Quant aux obstacles internes à la circulation des biens, de la main-d'œuvre et des capitaux entre les cinquante États (les obstacles interétatiques, selon le terme du pays), le plus important qui soit mesurable est la réglementation professionnelle. En 2024, 21,6 % des personnes occupées de 16 ans et plus détenaient un permis d'exercice délivré par un État, et 2,4 % supplémentaires une attestation sans permis, sur 161,3 millions de personnes occupées; dans les professions de gestion et les professions libérales et connexes, la part détenant un permis atteignait 30,5 % [bls-cps-licensing-2024]. Les permis sont délivrés selon la structure réglementaire propre à chaque État [census-governments-2022], de sorte qu'un travailleur titulaire d'un permis qui change d'État doit généralement le refaire valider. Les sources retenues ne mesurent pas l'ampleur des déplacements que cela empêche.
capacity_knownAndUnbuilt_en: ""
capacity_knownAndUnbuilt_fr: ""
security_posture_en: "The security posture is expeditionary and unmatched in reach; the diplomatic orientation is aligned, with the country at the centre of the bloc rather than attached to one, and disengaging from institutions. Both are narrowing rather than expanding: military spending is falling and its share of the world total shrinking while allies' rises, and the standing strategy reorients from global presence toward homeland defence and the Western Hemisphere [security.military]. Capability itself is intact — forces are permanently based across dozens of countries, only two locations without host-nation consent, and the treaty alliance system remains the largest in the world, with Japan meeting the majority of the identifiable costs of the presence on its territory and South Korea a substantial share [security.military][security.diplomacy]. The reorientation is visible inward as well, in military support to interagency border operations and in a contest over which level of government commands federalised forces that the courts settled against the executive [security.internal]. The assessment machinery is being reduced at both ends at once: the statutory body coordinating intelligence on foreign influence was dissolved in August 2025 along with the equivalent task force at the federal police, while withdrawal from 66 international organisations included the multilateral bodies for countering hybrid threats and for cyber expertise — all in the same period in which the intelligence services documented cartel networks, pre-positioned cyber intrusions and interference operations in detail [security.transnationalExposure][security.diplomacy]. The posture is therefore expeditionary in capability, hemispheric in emphasis, aligned but transactional in orientation, and increasingly unaccompanied by the institutional machinery through which that alignment was formerly exercised."
security_posture_fr: "La posture de sécurité est expéditionnaire et d'une portée sans égale; l'orientation diplomatique est alignée, le pays occupant le centre du bloc plutôt qu'y étant rattaché, et se désengage des institutions. Les deux se resserrent plutôt qu'elles ne s'étendent : les dépenses militaires reculent et leur part dans le total mondial diminue tandis que celle des alliés progresse, et la stratégie en vigueur réoriente la présence mondiale vers la défense du territoire et l'hémisphère occidental [security.military]. La capacité, elle, demeure intacte : des forces sont stationnées en permanence dans des dizaines de pays (deux emplacements seulement l'étant sans le consentement du pays hôte) et le système d'alliances par traité reste le plus vaste au monde; le Japon assumant la majorité des coûts identifiables de cette présence sur son territoire et la Corée du Sud une part substantielle [security.military][security.diplomacy]. La réorientation se lit aussi vers l'intérieur, dans l'appui militaire aux opérations frontalières interagences et dans un conflit sur le palier de gouvernement habilité à commander des forces fédéralisées, que les tribunaux ont tranché contre l'exécutif [security.internal]. L'appareil d'évaluation se réduit simultanément aux deux extrémités : l'organisme créé par la loi pour coordonner le renseignement sur l'influence étrangère a été dissous en août 2025, de même que le groupe de travail équivalent de la police fédérale, tandis que le retrait de 66 organisations internationales visait notamment les organismes multilatéraux de lutte contre les menaces hybrides et de cyberexpertise; le tout durant la période même où les services de renseignement documentaient en détail les réseaux de cartels, les intrusions informatiques pré-positionnées et les opérations d'ingérence [security.transnationalExposure][security.diplomacy]. La posture est donc expéditionnaire par la capacité, hémisphérique par l'accent, alignée mais transactionnelle par l'orientation, et de moins en moins accompagnée de l'appareil institutionnel par lequel cet alignement s'exerçait auparavant."
security_internal_en: |-
  The state's monopoly on force is uncontested by non-state actors and was contested during the period between levels of government. From October 2025 the executive federalised National Guard units under Title 10 for deployment to Chicago over the objection of Illinois's governor, having federalised units for Los Angeles and Portland earlier in the year; governors in three states obtained injunctions, and in December 2025 the Supreme Court declined to disturb them by six votes to three [scotus-trump-v-illinois-2025]. Under the Federal Protection Mission those forces served under United States Army North with the Department of Homeland Security as lead federal agency; demobilisation in all three cities completed on 21 January 2026, and Texas National Guard personnel were released from stand-by on 11 March 2026 [northcom-federal-protection-mission]. No episode involved forces declining lawful orders; what was disputed was which level of government was entitled to issue them.

  The border situation has changed by an order of magnitude. Nationwide encounters totalled 91,603 across October, November and December 2025, the lowest start to any fiscal year on record and 28% below the previous low set in fiscal 2012; the October figure of 30,561 was itself 29% below the previous record October [dhs-cbp-border-stats]. Southwest border apprehensions have averaged 258 a day, against a daily average of 5,110 between February 2021 and December 2024 [dhs-cbp-border-stats]. The Border Patrol recorded fourteen consecutive months without releasing an apprehended person into the country through June 2026 [dhs-border-releases-2026]. Interdiction has risen as crossings have fallen: nationwide seizures of cocaine, methamphetamine, heroin, fentanyl and cannabis by weight were 57% higher in fiscal 2026 through June than in the same period of fiscal 2024, with 1,072 pounds of fentanyl seized in June 2026 alone [dhs-border-releases-2026]. The 2026 National Defense Strategy elevates border security and counter-narcotics to top homeland priorities and directs military support to interagency border operations [ndstrategy-2026]. Domestic organised crime and illicit finance are not measured in consolidated form beyond these seizure weights. Illicit finance is assessed rather than counted, and enforced through a reporting regime of unusual scale. The Treasury's 2024 National Money Laundering Risk Assessment, issued with companion assessments of terrorist and proliferation financing, identifies the fentanyl trade, domestic and foreign terrorist financing, ransomware, professional money-laundering networks and the continued digitisation of payments as the principal threats, and a beneficial-ownership reporting requirement took effect on 1 January 2024 [treasury-nra-2024]. Roughly 324,000 registered financial institutions and other filers report to the Financial Crimes Enforcement Network, which received 4.7 million suspicious activity reports in fiscal 2024 against 4.3 million in fiscal 2022 [fincen-year-in-review]. In fiscal 2025 the Federal Bureau of Investigation arrested 5,957 investigative subjects tied to those filings, indicted 4,727 and obtained 2,795 convictions; the network's stated priority threats were cartels, Chinese money-laundering networks, fentanyl and terrorism financing [fincen-year-in-review].

  Conduct within the security forces is audited principally by bodies inside the executive that commands them, and the significant finding of the period came from outside it. The Inter-American Commission on Human Rights held the state responsible for the torture and death of a detainee in Customs and Border Protection custody, found that United States law governing the use of force lacked the parameters necessary to safeguard rights, identified serious flaws in the criminal investigation including destruction of evidence, and recorded that the state did not respond when the finding was transmitted to it twice [political.rightsAndChecks].

  Political mobilisation is very large and almost entirely peaceful. Demonstrations rose roughly 77% in 2025 over the previous year, the highest count since 2020, driven principally by opposition to the administration and its migration policy; approximately 97% saw no violence and no police intervention [acled-us-overview-2026]. Firearms were present at more than 50 demonstrations, more than double the 2024 figure. Over two-thirds of those demonstrations were explicitly about the President, and about 17% of them turned violent — more than five times the rate for demonstrations without firearms [acled-us-overview-2026].

  The terrorism threat level is assessed as heightened: the Department of Homeland Security judges that the primary threat of mass-casualty violence comes from lone offenders and small groups motivated by a mix of ideological belief and personal grievance, and issued a bulletin tying the elevated environment to direct United States involvement in the conflict between Israel and Iran [dhs-ntas].
security_internal_fr: |-
  Le monopole de l'État sur la force n'est contesté par aucun acteur non étatique, mais il l'a été durant la période entre paliers de gouvernement. À compter d'octobre 2025, l'exécutif a fédéralisé des unités de la Garde nationale en vertu du titre 10 pour un déploiement à Chicago malgré l'opposition du gouverneur de l'Illinois, après avoir fédéralisé des unités pour Los Angeles et Portland plus tôt dans l'année; les gouverneurs de trois États ont obtenu des injonctions et, en décembre 2025, la Cour suprême a refusé de les lever par six voix contre trois [scotus-trump-v-illinois-2025]. Dans le cadre de la Federal Protection Mission, ces forces relevaient de l'United States Army North, le département de la Sécurité intérieure agissant comme organisme fédéral responsable; la démobilisation s'est achevée dans les trois villes le 21 janvier 2026, et les militaires de la Garde nationale du Texas ont été libérés de l'état d'alerte le 11 mars 2026 [northcom-federal-protection-mission]. Aucun épisode n'a vu des forces refuser des ordres légaux; la contestation portait sur le palier de gouvernement habilité à les donner.

  La situation frontalière a changé d'un ordre de grandeur. Les interceptions de personnes à la frontière (que le service désigne par le terme « encounters » et qui regroupent les appréhensions entre les points d'entrée et les personnes jugées inadmissibles aux points d'entrée) ont totalisé 91 603 en octobre, novembre et décembre 2025, soit le plus faible début d'exercice jamais enregistré et 28 % en dessous du creux précédent de l'exercice 2012; le chiffre d'octobre, 30 561, se situait lui-même 29 % sous le record précédent pour ce mois [dhs-cbp-border-stats]. Les appréhensions à la frontière sud-ouest s'établissent en moyenne à 258 par jour, contre une moyenne quotidienne de 5 110 entre février 2021 et décembre 2024 [dhs-cbp-border-stats]. La Border Patrol a enregistré quatorze mois consécutifs sans remise en liberté sur le territoire d'une personne appréhendée, jusqu'en juin 2026 [dhs-border-releases-2026]. Les saisies progressent à mesure que les passages diminuent : les saisies nationales de cocaïne, de méthamphétamine, d'héroïne, de fentanyl et de cannabis, en poids, étaient supérieures de 57 % à l'exercice 2026 jusqu'en juin par rapport à la même période de l'exercice 2024, avec 1 072 livres de fentanyl saisies au seul mois de juin 2026 [dhs-border-releases-2026]. La Stratégie de défense nationale de 2026 érige la sécurité frontalière et la lutte antidrogue en priorités intérieures de premier rang et prescrit un appui militaire aux opérations frontalières interagences [ndstrategy-2026]. Le crime organisé intérieur et le financement illicite ne font l'objet d'aucune mesure consolidée au-delà de ces poids de saisie. Le financement illicite fait l'objet d'une évaluation plutôt que d'un dénombrement, et il est réprimé au moyen d'un régime de déclaration d'une ampleur inhabituelle. L'évaluation nationale des risques de blanchiment d'argent publiée par le Trésor en 2024, accompagnée d'évaluations parallèles du financement du terrorisme et de la prolifération, désigne comme principales menaces le commerce du fentanyl, le financement du terrorisme intérieur et étranger, les rançongiciels, les réseaux professionnels de blanchiment et la numérisation continue des paiements, et une obligation de déclaration des bénéficiaires effectifs est entrée en vigueur le 1er janvier 2024 [treasury-nra-2024]. Environ 324 000 institutions financières inscrites et autres déclarants transmettent leurs données au Financial Crimes Enforcement Network, qui a reçu 4,7 millions de déclarations d'opérations douteuses à l'exercice 2024, contre 4,3 millions à l'exercice 2022 [fincen-year-in-review]. À l'exercice 2025, le Federal Bureau of Investigation a arrêté 5 957 personnes visées par une enquête à partir de ces déclarations, en a mis 4 727 en accusation et a obtenu 2 795 condamnations; les menaces prioritaires déclarées par l'organisme étaient les cartels, les réseaux chinois de blanchiment d'argent, le fentanyl et le financement du terrorisme [fincen-year-in-review].

  La conduite au sein des forces de sécurité est vérifiée principalement par des organes internes à l'exécutif qui les commande, et le constat marquant de la période est venu de l'extérieur. La Commission interaméricaine des droits de l'homme a tenu l'État responsable de la torture et du décès d'une personne détenue sous la garde du service des douanes et de la protection des frontières, a jugé que le droit des États-Unis régissant l'usage de la force ne comportait pas les paramètres nécessaires pour protéger les droits, a relevé de graves lacunes dans l'enquête criminelle, dont la destruction d'éléments de preuve, et a consigné que l'État n'a pas répondu lorsque le constat lui a été transmis à deux reprises [political.rightsAndChecks].

  La mobilisation politique est massive et presque toujours pacifique. Les manifestations ont augmenté d'environ 77 % en 2025 par rapport à l'année précédente, soit le nombre le plus élevé depuis 2020, portées principalement par l'opposition à l'administration et à sa politique migratoire; environ 97 % n'ont donné lieu à aucune violence ni à aucune intervention policière [acled-us-overview-2026]. Des armes à feu étaient présentes à plus de 50 manifestations, soit plus du double du chiffre de 2024. Plus des deux tiers de ces manifestations portaient explicitement sur le président, et environ 17 % d'entre elles ont donné lieu à des violences; ce qui les rend plus de cinq fois plus susceptibles de le faire que les manifestations sans armes [acled-us-overview-2026]. 

  Le niveau de menace terroriste est jugé élevé : le département de la Sécurité intérieure estime que la principale menace de violence de masse provient d'auteurs isolés et de petits groupes mus par un mélange de convictions idéologiques et de griefs personnels, et a émis un bulletin liant cet environnement à l'implication directe des États-Unis dans le conflit entre Israël et l'Iran [dhs-ntas].
security_military_en: |-
  The United States is the world's pre-eminent military power, with an all-volunteer force and power projection across land, sea, air, cyber and space; the Space Force, established in 2019, is the sixth service. The active force stood at 1,298,099 across the five Department of Defense services at the end of fiscal 2025 — Army 454,637, Navy 341,109, Air Force 319,119, Marine Corps 173,249 and Space Force 9,985, comprising 235,575 officers, 1,049,509 enlisted personnel and 13,015 academy cadets — with reserve components adding 760,210, of which the Army National Guard accounted for 328,870 and the Air National Guard 105,120 [budget-appendix-fy2027-personnel]. Congress sets an authorised ceiling annually under 10 U.S.C. § 115; for fiscal 2026 it authorised 1,302,800 across those five services, an increase of 26,100 concentrated in the Army and Navy, or 1,352,800 including the Coast Guard [crs-end-strength-2026].

  The overseas footprint has no parallel. The Department of Defense manages or uses at least 128 overseas bases in at least 51 countries — 68 persistent bases, of which 56 were established during the Cold War, and 60 other sites to which it has access [crs-overseas-basing-r48123]. As of March 2024 roughly 156,000 active-duty personnel were permanently assigned abroad: about 81,000 in the Indo-Pacific across 24 persistent bases and 20 other sites, concentrated in Japan (54,774) and South Korea (24,234); about 67,200 in Europe across 31 persistent bases and 19 other sites, concentrated in Germany (35,068), Italy (12,375) and the United Kingdom (10,058); about 5,400 in the Middle East across eight persistent bases and 11 other sites, concentrated in Bahrain (3,479); about 1,650 in Latin America and the Caribbean; and about 1,150 in Africa, where the regional command describes its seven access sites as minimal-presence posture locations [crs-overseas-basing-r48123]. Those figures exclude rotational deployments, which are substantial: in June 2024 the executive reported roughly 80,000 personnel assigned or deployed to North Atlantic Treaty Organization countries in Europe against the 67,200 permanently assigned [crs-overseas-basing-r48123]. Only two locations covered by the report (Syria and Guantánamo Bay) are used without host-nation consent, and access elsewhere carries political risk: Niger revoked its status-of-forces agreement in March 2024, compelling withdrawal from two bases by September [crs-overseas-basing-r48123].

  Host nations carry a larger share of the cost than the headline figure suggests. The department reported $714.2 million in burden-sharing contributions in fiscal 2023, from Kuwait, Japan, South Korea, Saudi Arabia and Poland — but that measure is narrow: the Government Accountability Office found that between fiscal 2016 and 2019 Japan provided $12.6 billion and South Korea $5.8 billion in direct financial support, equal to 60.2% and 43.3% respectively of the departmental obligations associated with the United States presence in each country [crs-overseas-basing-r48123]. Total overseas basing cost cannot be stated precisely because budget documents do not disaggregate by location; the department's own two estimates for fiscal 2023 were $27.8 billion and $31.7 billion, and overseas military construction took $5.355 billion of $13.593 billion appropriated worldwide [crs-overseas-basing-r48123].

  Spending is the largest in the world and falling. Military expenditure was $954 billion in 2025, equal to 3.1% of gross domestic product against 3.4% in 2016, and 33% of world military spending [sipri-milex-2025]. That was a real-terms fall of 7.5% from 2024, against increases by twelve of the fifteen largest spenders, and the country's share of world spending dropped 4.3 percentage points in a single year [sipri-milex-2025]. It still spent 2.8 times as much as China, down from 3.2 times in 2024, and more than the next six countries combined [sipri-milex-2025]. The decline was driven mainly by the end of supplemental appropriations for military assistance abroad: of $127 billion allocated for Ukraine-related support between 2022 and 2025, only $65.1 billion had been disbursed by the end of 2025, and no new supplemental appropriations were made in 2025 for either Ukraine or Israel [sipri-milex-2025].

  It is a nuclear-weapons state prioritising modernisation, allocating $9.9 billion in 2025 to the nuclear-armed Columbia-class submarine programme and $13.9 billion to the conventionally armed Virginia-class programme [sipri-milex-2025]. The 2026 National Defense Strategy reorients priorities to homeland defence, deterring China through denial in the Indo-Pacific, allied burden-sharing and rebuilding the defence industrial base [ndstrategy-2026].
security_military_fr: |-
  Les États-Unis sont la première puissance militaire mondiale, disposant d'une force entièrement volontaire et d'une capacité de projection sur terre, sur mer, dans les airs, dans le cyberespace et dans l'espace; la Space Force, créée en 2019, en constitue la sixième armée. L'effectif actif s'établissait à 1 298 099 pour les cinq armées du département de la Défense à la fin de l'exercice 2025 : armée de terre 454 637, marine 341 109, force aérienne 319 119, corps des marines 173 249 et Space Force 9 985, soit 235 575 officiers, 1 049 509 militaires du rang et 13 015 élèves des académies militaires; les composantes de réserve y ajoutant 760 210, dont 328 870 pour la Garde nationale de l'armée de terre et 105 120 pour la Garde nationale aérienne [budget-appendix-fy2027-personnel]. Le Congrès fixe annuellement un plafond autorisé en vertu du 10 U.S.C. § 115; pour l'exercice 2026, il a autorisé 1 302 800 pour ces cinq armées, en hausse de 26 100 concentrée dans l'armée de terre et la marine, ou 1 352 800 en incluant la garde côtière [crs-end-strength-2026]. 

  L'empreinte outre-mer est sans équivalent. Le département de la Défense gère ou utilise au moins 128 bases à l'étranger dans au moins 51 pays : 68 bases permanentes, dont 56 établies pendant la guerre froide, et 60 autres sites auxquels il a accès [crs-overseas-basing-r48123]. En mars 2024, environ 156 000 militaires en service à temps plein y étaient affectés en permanence : quelque 81 000 dans l'Indo-Pacifique, répartis entre 24 bases permanentes et 20 autres sites, concentrés au Japon (54 774) et en Corée du Sud (24 234); quelque 67 200 en Europe, répartis entre 31 bases permanentes et 19 autres sites, concentrés en Allemagne (35 068), en Italie (12 375) et au Royaume-Uni (10 058); quelque 5 400 au Moyen-Orient, répartis entre huit bases permanentes et 11 autres sites, concentrés à Bahreïn (3 479); quelque 1 650 en Amérique latine et dans les Caraïbes; et quelque 1 150 en Afrique, où le commandement régional qualifie ses sept sites d'accès "d'emplacements de présence minimale" [crs-overseas-basing-r48123]. Ces chiffres excluent les déploiements par rotation, qui sont considérables : en juin 2024, l'exécutif faisait état d'environ 80 000 militaires affectés ou déployés dans les pays de l'Organisation du Traité de l'Atlantique Nord en Europe, contre 67 200 affectés en permanence [crs-overseas-basing-r48123]. Deux emplacements parmi ceux que recense le rapport (Syrie et Guantánamo) sont utilisés sans le consentement du pays hôte; l'accès ailleurs comporte un risque politique : le Niger a révoqué son accord sur le statut des forces en mars 2024, contraignant au retrait de deux bases avant septembre [crs-overseas-basing-r48123].

  Les pays hôtes assument une part des coûts plus importante que ne le laisse croire le chiffre global. Le département a déclaré 714,2 millions de dollars de contributions au partage du fardeau à l'exercice 2023, en provenance du Koweït, du Japon, de la Corée du Sud, de l'Arabie saoudite et de la Pologne. Ce chiffre ne recense toutefois qu'une catégorie de versements formellement comptabilisés comme telle : le Government Accountability Office a établi qu'entre les exercices 2016 et 2019, le Japon avait versé 12,6 milliards de dollars et la Corée du Sud 5,8 milliards en soutien financier direct, soit respectivement 60,2 % et 43,3 % des engagements du département liés à la présence des États-Unis dans chacun de ces pays [crs-overseas-basing-r48123]. Le coût total des bases à l'étranger ne peut être établi avec précision; les documents budgétaires ne le ventilant pas par lieu. Les deux estimations du département pour l'exercice 2023 s'élevaient à 27,8 et à 31,7 milliards de dollars, et les constructions militaires outre-mer ont absorbé 5,355 milliards des 13,593 milliards affectés dans le monde [crs-overseas-basing-r48123].

  Les dépenses militaires des États-Unis sont les plus élevées au monde et elles reculent. Elles ont atteint 954 milliards de dollars en 2025, soit 3,1 % du produit intérieur brut contre 3,4 % en 2016, et 33 % des dépenses militaires mondiales [sipri-milex-2025]. Il s'agit d'un recul de 7,5 % en termes réels par rapport à 2024, alors que douze des quinze premiers pays dépensiers augmentaient les leurs, et la part du pays dans les dépenses mondiales a chuté de 4,3 points de pourcentage en une seule année [sipri-milex-2025]. Le pays dépensait encore 2,8 fois plus que la Chine, contre 3,2 fois en 2024, et davantage que les six pays suivants réunis [sipri-milex-2025]. Ce repli tient principalement à la fin des crédits supplémentaires d'aide militaire à l'étranger : sur les 127 milliards affectés au soutien lié à l'Ukraine entre 2022 et 2025, seuls 65,1 milliards avaient été versés à la fin de 2025, et aucun nouveau crédit supplémentaire n'a été accordé en 2025 pour l'Ukraine ou pour Israël [sipri-milex-2025].

  Il s'agit d'un État doté de l'arme nucléaire qui privilégie la modernisation, ayant affecté 9,9 milliards de dollars en 2025 au programme de sous-marins de la classe Columbia, à armement nucléaire, et 13,9 milliards au programme de la classe Virginia, à armement conventionnel [sipri-milex-2025]. La Stratégie de défense nationale de 2026 réoriente les priorités vers la défense du territoire, la dissuasion de la Chine par le déni dans l'Indo-Pacifique, le partage du fardeau entre alliés et la reconstruction de la base industrielle de défense [ndstrategy-2026].
security_transnationalExposure_en: |-
  The dominant cross-border flow reversed direction during the period. Net international migration fell from roughly 2.7 million in 2023 to 1.3 million in 2024 and to about 321,000 in 2025 [census-poprelease-2026]. Border encounters fell with it: nationwide encounters totalled 91,603 across October, November and December 2025, the lowest start to any fiscal year on record, and southwest border apprehensions have averaged 258 a day against 5,110 between February 2021 and December 2024 [dhs-cbp-border-stats]. The Intelligence Community attributes the decline to changes in United States policy during 2025 and to increased enforcement both at the border and regionally [odni-ata-2026].

  Transnational criminal organisations are the principal non-state entanglement, and the assessment names them. Mexico-based organisations — the Sinaloa Cartel and the Jalisco New Generation Cartel — dominate production and smuggling of fentanyl, heroin, methamphetamine and cocaine into the country; Colombia-based organisations and armed groups including the Revolutionary Armed Forces of Colombia and the National Liberation Army traffic cocaine to United States and European markets, with Colombia remaining the world's largest producer and Colombian groups extending trafficking relationships to Ecuadorian and Brazilian gangs; and MS-13 maintains established cells inside the country, using violence against the Salvadoran diaspora [odni-ata-2026]. Fentanyl overdose deaths fell about 30% between September 2024 and September 2025 and potency declined, which the assessment attributes to disruption of the production supply chain, while cooperation with China and India on precursor chemicals is described as improving against tens of thousands of fentanyl-related deaths a year [odni-ata-2026]. Beyond narcotics, these organisations engage in financial fraud and launder money through international financial institutions [odni-ata-2026]. The 2026 National Defense Strategy frames this exposure as warranting military response, including strikes on trafficking vessels [ndstrategy-2026].

  Cyber exposure is the entanglement with no border at all. Actors linked to China, Russia, Iran and North Korea, together with non-state ransomware groups, seek to compromise government and private-sector networks and critical infrastructure to collect intelligence, create options for future disruption, and for financial gain; China and Russia are assessed as the most persistent and active [odni-ata-2026]. North Korean cryptocurrency thefts probably took $2 billion in 2025 alone, funding the regime including its strategic weapons programmes — illicit finance operating as state revenue [odni-ata-2026]. Financially and ideologically motivated non-state actors are becoming bolder, with ransomware groups shifting to faster, high-volume attacks that are harder to identify and mitigate, and the assessment expects artificial intelligence to accelerate cyber threats [odni-ata-2026].

  Foreign influence is a standing exposure whose assessment apparatus was dismantled during the period. Congress established the Foreign Malign Influence Center within the Office of the Director of National Intelligence under the Intelligence Authorization Act for fiscal years 2018 to 2020, codified at 50 U.S.C. § 3059, following the Intelligence Community's assessment of Russian efforts to influence the 2016 presidential election; it began operating in September 2022 and housed the Election Threats Executive, the Community's coordinating authority on election security [crs-if12470-fmic]. In August 2025 the Director of National Intelligence announced its dissolution as part of a reorganisation, and the Federal Bureau of Investigation's Foreign Influence Task Force was dissolved in parallel; the ranking members of the House and Senate intelligence committees state that intelligence production on foreign plans and intentions toward future United States elections has been paralysed and that repeated requests for legally required briefings on threats to the 2026 midterms have gone unanswered [himes-warner-letter-2026]. Those members are the opposition party's senior representatives on the committees; what is not in dispute is that the statutory body was created by bipartisan legislation and no longer operates.

  Shared-resource friction runs on water. The 1944 Water Treaty entitles the United States to an average of at least 350,000 acre-feet a year from Mexican tributaries feeding the Rio Grande, measured over five-year cycles totalling 1.75 million acre-feet, and the International Boundary and Water Commission administers it [crs-if12976-water-treaty]. Mexico has failed to meet the cycle obligation on multiple occasions since 1994, and at the close of the cycle in late October 2025 had delivered 0.88 million acre-feet against the 1.75 million owed [crs-if12976-water-treaty]. Congress responded in the Consolidated Appropriations Act, 2026, conditioning some funds on the Secretary of State certifying delivery, and in February 2026 the State Department announced Mexico had committed to annual deliveries of at least 350,000 acre-feet and to a plan addressing the shortfall [crs-if12976-water-treaty]. The same treaty governs border sanitation, including raw sewage and industrial wastewater flows in the Tijuana River Valley [crs-if12976-water-treaty].
security_transnationalExposure_fr: |-
  Le principal flux transfrontalier s'est inversé au cours de la période. La migration internationale nette est passée d'environ 2,7 millions en 2023 à 1,3 million en 2024, puis à quelque 321 000 en 2025 [census-poprelease-2026]. Les interceptions de personnes à la frontière ont suivi : elles ont totalisé 91 603 en octobre, novembre et décembre 2025, soit le plus faible début d'exercice jamais enregistré, et les appréhensions à la frontière sud-ouest s'établissent en moyenne à 258 par jour, contre 5 110 entre février 2021 et décembre 2024 [dhs-cbp-border-stats]. La communauté du renseignement attribue ce recul aux changements de politique intervenus aux États-Unis en 2025 et au renforcement de l'application des règles, à la frontière comme dans la région [odni-ata-2026].

  Les organisations criminelles transnationales constituent le principal enchevêtrement non étatique, et l'évaluation les nomme. Les organisations basées au Mexique (le cartel de Sinaloa et le cartel Jalisco Nouvelle Génération) dominent la production et l'acheminement du fentanyl, de l'héroïne, de la méthamphétamine et de la cocaïne vers le pays; les organisations et groupes armés basés en Colombie (dont les Forces armées révolutionnaires de Colombie et l'Armée de libération nationale) acheminent la cocaïne vers les marchés états-uniens et européens; la Colombie demeurant le premier producteur mondial et les groupes colombiens étendant leurs relations aux gangs équatoriens et brésiliens. La MS-13 maintient des cellules établies à l'intérieur du pays, recourant à la violence contre la diaspora salvadorienne [odni-ata-2026]. Les décès par surdose de fentanyl ont reculé d'environ 30 % entre septembre 2024 et septembre 2025 et la puissance du produit a diminué; ce que l'évaluation attribue à la perturbation de la chaîne de production, tandis que la coopération avec la Chine et l'Inde sur les précurseurs chimiques est jugée en progrès face à des dizaines de milliers de décès liés au fentanyl chaque année [odni-ata-2026]. Au-delà des stupéfiants, ces organisations pratiquent la fraude financière et blanchissent des fonds par l'entremise d'institutions financières internationales [odni-ata-2026]. La Stratégie de défense nationale de 2026 présente cette exposition comme justifiant une réponse militaire, y compris des frappes contre des navires de trafic [ndstrategy-2026].

  L'exposition cybernétique est l'enchevêtrement sans frontière aucune. Des acteurs liés à la Chine, à la Russie, à l'Iran et à la Corée du Nord, de même que des groupes non étatiques de rançongiciels, cherchent à compromettre les réseaux gouvernementaux, ceux du secteur privé et les infrastructures essentielles, afin de recueillir du renseignement, de se ménager des possibilités de perturbation future et d'en tirer un gain financier; la Chine et la Russie sont jugées les plus persistantes et les plus actives [odni-ata-2026]. Les vols de cryptomonnaie nord-coréens ont probablement rapporté 2 milliards de dollars pour la seule année 2025, finançant le régime et notamment ses programmes d'armement stratégique; financement illicite servant de recette d'État [odni-ata-2026]. Les acteurs non étatiques motivés par l'argent ou l'idéologie s'enhardissent; les groupes de rançongiciels adoptant des attaques plus rapides et plus nombreuses, plus difficiles à repérer et à contrer, et l'évaluation prévoit que l'intelligence artificielle accélérera les menaces dans le cyberespace [odni-ata-2026].

  L'influence étrangère constitue une exposition permanente dont l'appareil d'évaluation a été démantelé au cours de la période. Le Congrès a créé le Foreign Malign Influence Center au sein de l'Office of the Director of National Intelligence par la loi d'autorisation du renseignement pour les exercices 2018 à 2020, codifiée au 50 U.S.C. § 3059, à la suite de l'évaluation par la communauté du renseignement des efforts russes visant à influencer l'élection présidentielle de 2016. Il est entré en fonction en septembre 2022 et abritait l'Election Threats Executive, autorité de coordination de la communauté en matière de sécurité électorale [crs-if12470-fmic]. En août 2025, la directrice du renseignement national a annoncé sa dissolution dans le cadre d'une réorganisation, et la Foreign Influence Task Force du Federal Bureau of Investigation a été dissoute en parallèle. Les chefs de file de l'opposition aux comités du renseignement de la Chambre et du Sénat affirment que la production de renseignement sur les intentions étrangères à l'égard des prochaines élections états-uniennes est paralysée et que des demandes répétées de séances d'information exigées par la loi sur les menaces visant les élections de mi-mandat de 2026 sont restées sans réponse [himes-warner-letter-2026]. Ces élus sont les représentants principaux du parti d'opposition au sein de ces comités; ce qui n'est pas contesté est que l'organisme créé par une loi bipartisane n'existe plus.

  La friction sur les ressources partagées porte sur l'eau. Le traité sur les eaux de 1944 donne aux États-Unis droit à une moyenne minimale de 350 000 acres-pieds par an provenant des affluents mexicains alimentant le Rio Grande, calculée sur des cycles de cinq ans totalisant 1,75 million d'acres-pieds; la Commission internationale des frontières et des eaux en assure l'administration [crs-if12976-water-treaty]. Le Mexique a manqué à cette obligation de cycle à plusieurs reprises depuis 1994 et, à la clôture du cycle à la fin d'octobre 2025, avait livré 0,88 million d'acres-pieds sur les 1,75 million dus [crs-if12976-water-treaty]. Le Congrès a réagi dans la loi de crédits consolidés de 2026 en conditionnant certains fonds à une attestation de livraison par le secrétaire d'État; en février 2026 le département d'État a annoncé que le Mexique s'engageait à livrer au moins 350 000 acres-pieds par an et à établir un plan pour combler le déficit [crs-if12976-water-treaty]. Le même traité régit l'assainissement frontalier, notamment les rejets d'eaux usées brutes et d'effluents industriels dans la vallée de la rivière Tijuana [crs-if12976-water-treaty].
security_diplomacy_en: |-
  The United States anchors the largest treaty alliance system in the world while its 2026 National Defense Strategy shifts toward transactional burden-sharing, directing European allies to lead their own defence with limited support and framing China as the primary balance-of-power competitor to be deterred by denial in the Indo-Pacific [ndstrategy-2026]. The system is named and treaty-based: the North Atlantic Treaty binds the country to the 31 other members of the North Atlantic Treaty Organization, 32 in all as of 2026 [nato-member-countries]; collective-defence treaties cover Japan, South Korea, the Philippines, Australia and New Zealand, Thailand, and the Americas under the Rio Treaty [state-collective-defense-arrangements]; a statutory tier of major non-NATO allies includes Israel, Japan, South Korea and Australia [state-major-non-nato-ally-status]; and the AUKUS partnership adds submarine and advanced-capability cooperation with the United Kingdom and Australia [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599].

  The commitments are underwritten by forces on the ground, and the weight is unevenly distributed. As of March 2024, 54,774 personnel were permanently assigned in Japan, 35,068 in Germany, 24,234 in South Korea, 12,375 in Italy and 10,058 in the United Kingdom [crs-overseas-basing-r48123]. Host-nation support tracks that weight: between fiscal 2016 and 2019 Japan provided $12.6 billion and South Korea $5.8 billion in direct financial support, covering 60.2% and 43.3% respectively of the departmental obligations associated with the presence in each country [crs-overseas-basing-r48123]. Trade runs the other way from security: the largest bilateral goods deficits in 2025 were with the European Union at $218.8 billion, mainland China at $202.1 billion, Mexico at $196.9 billion, Vietnam at $178.2 billion and Taiwan at $146.8 billion, against surpluses with the Netherlands at $60.7 billion and the United Kingdom at $32.2 billion [bea-census-trade-annual-2025]. The China relationship is being restructured through that channel: its share of United States goods imports fell from 13.2% in 2024 to 7.7% by the end of 2025 [imf-art-iv-usa-2026].

  The standing territorial dispute is Guantánamo Bay. Under a February 1903 lease agreement for coaling and naval stations, the United States recognised the continuance of Cuba's ultimate sovereignty over the leased area while Cuba consented that the United States would exercise complete jurisdiction and control within it [crs-r44137-guantanamo]. The 1934 Treaty of Relations repealed the 1903 treaty under which the lease was made but preserved the lease agreements themselves, which can now be modified or abrogated only by agreement between the two governments; the territorial limits therefore stand as they were in 1934 unless the United States abandons the station [crs-r44137-guantanamo]. Cuba's government regards the presence as an illegal occupation of its territory [crs-r44137-guantanamo].

  In the Western Hemisphere the administration has asserted a corollary to the Monroe Doctrine and acted directly, capturing Venezuelan leader Nicolás Maduro in a January 2026 military operation and installing influence over a political transition [maduro-capture-wardept][ndstrategy-2026].

  In the Middle East, United States and Israeli forces began major combat operations against Iran on 28 February 2026, following the June 2025 strikes on Iranian nuclear sites [iran-ops-transcript]. A Pakistan-mediated ceasefire took effect on 8 April and was formalised in an interim memorandum of understanding on 17 June [whitehouse-epic-fury-ceasefire], which the President declared over on 8 July [cnbc-iran-ceasefire-over]. The naval blockade of Iranian ports was reimposed thereafter and remains in force: Central Command reports 44 commercial vessels redirected, two disabled and two boarded as of early August 2026, and planned strikes were called off on 1 August [cnn-iran-war-august2026]. The substantive negotiating channel has moved to Muscat, with Iran and Oman reporting talks on a new Strait of Hormuz transit route close to conclusion while Iran attributes the strait's closure to the blockade [cnn-iran-war-august2026].

  Multilateral membership is being reduced on a scale without precedent since 1945. An executive order of 20 January 2025 directed withdrawal from the Paris Agreement, effective 27 January 2026 under Article 28 of that agreement [crs-r48504-paris]. Executive Order 14199 of 4 February 2025 terminated participation in the United Nations Human Rights Council and ordered the Secretary of State to review every intergovernmental organisation, convention and treaty to which the country belongs [potus-memo-withdrawals-2026]. Acting on that review, a presidential memorandum of 7 January 2026 directed withdrawal from 66 named organisations — 35 outside the United Nations system and 31 within it — instructing agencies to effect the withdrawals as soon as possible and, for United Nations entities, to cease participation and funding so far as law permits; the memorandum states that review of further findings remains ongoing [potus-memo-withdrawals-2026]. The named bodies include the United Nations Framework Convention on Climate Change and the Intergovernmental Panel on Climate Change, and — bearing directly on exposures recorded elsewhere in this report — the European Centre of Excellence for Countering Hybrid Threats, the Global Forum on Cyber Expertise, the Global Counterterrorism Forum and the Global Forum on Migration and Development [potus-memo-withdrawals-2026][state-withdrawal-66-2026].
security_diplomacy_fr: |-
  Les États-Unis ancrent le plus vaste système d'alliances par traité au monde, tandis que leur Stratégie de défense nationale de 2026 s'oriente vers un partage transactionnel du fardeau, enjoignant aux alliés européens d'assurer eux-mêmes leur défense avec un appui limité et désignant la Chine comme le principal concurrent dans l'équilibre des puissances, à dissuader par le déni dans l'Indo-Pacifique [ndstrategy-2026]. Le système est nommé et fondé sur des traités : le Traité de l'Atlantique Nord lie le pays aux 31 autres membres de l'Organisation du Traité de l'Atlantique Nord, soit 32 en tout en 2026 [nato-member-countries]; des traités de défense collective visent le Japon, la Corée du Sud, les Philippines, l'Australie et la Nouvelle-Zélande, la Thaïlande, ainsi que les Amériques au titre du Traité de Rio [state-collective-defense-arrangements]; un palier statutaire d'alliés majeurs hors OTAN comprend Israël, le Japon, la Corée du Sud et l'Australie [state-major-non-nato-ally-status]; et le partenariat AUKUS y ajoute une coopération sur les sous-marins et les capacités avancées avec le Royaume-Uni et l'Australie [crs-aukus-indo-pacific][crs-aukus-pillar2-r47599].

  Ces engagements reposent sur des forces déployées, et le poids en est inégalement réparti. En mars 2024, 54 774 militaires étaient affectés en permanence au Japon, 35 068 en Allemagne, 24 234 en Corée du Sud, 12 375 en Italie et 10 058 au Royaume-Uni [crs-overseas-basing-r48123]. Le soutien des pays hôtes suit cette répartition : entre les exercices 2016 et 2019, le Japon a fourni 12,6 milliards de dollars et la Corée du Sud 5,8 milliards en soutien financier direct, couvrant respectivement 60,2 % et 43,3 % des engagements du département liés à cette présence [crs-overseas-basing-r48123]. Le commerce joue en sens inverse de la sécurité : les principaux déficits bilatéraux sur les biens en 2025 visaient l'Union européenne (218,8 milliards), la Chine continentale (202,1 milliards), le Mexique (196,9 milliards), le Vietnam (178,2 milliards) et Taïwan (146,8 milliards), contre des excédents avec les Pays-Bas (60,7 milliards) et le Royaume-Uni (32,2 milliards) [bea-census-trade-annual-2025]. La relation avec la Chine se restructure par ce canal : sa part dans les importations de biens des États-Unis est passée de 13,2 % en 2024 à 7,7 % à la fin de 2025 [imf-art-iv-usa-2026].

  Le différend territorial permanent porte sur la baie de Guantánamo. Aux termes d'un accord de bail de février 1903 visant l'établissement de stations navales et de soutage, les États-Unis ont reconnu le maintien de la souveraineté ultime de Cuba sur la zone louée; Cuba consentant en retour à ce que les États-Unis y exercent une compétence et un contrôle complets [crs-r44137-guantanamo]. Le traité de relations de 1934 a abrogé le traité de 1903 en vertu duquel le bail avait été conclu, mais a préservé les accords de bail eux-mêmes, qui ne peuvent désormais être modifiés ou abrogés que par entente entre les deux gouvernements. Les limites territoriales demeurent donc celles de 1934, à moins que les États-Unis n'abandonnent la station [crs-r44137-guantanamo]. Le gouvernement cubain considère cette présence comme une occupation illégale de son territoire [crs-r44137-guantanamo].

  Dans l'hémisphère occidental, l'administration a affirmé un corollaire à la doctrine Monroe et agi directement, capturant le dirigeant vénézuélien Nicolás Maduro lors d'une opération militaire en janvier 2026 et installant son influence sur une transition politique [maduro-capture-wardept][ndstrategy-2026].

  Au Moyen-Orient, les forces états-uniennes et israéliennes ont lancé des opérations de combat majeures contre l'Iran le 28 février 2026, après les frappes de juin 2025 sur des sites nucléaires iraniens [iran-ops-transcript]. Un cessez-le-feu négocié par le Pakistan est entré en vigueur le 8 avril et a été formalisé dans un protocole d'entente provisoire le 17 juin [whitehouse-epic-fury-ceasefire], que le président a déclaré caduc le 8 juillet [cnbc-iran-ceasefire-over]. Le blocus naval des ports iraniens a été rétabli par la suite et demeure en vigueur : le Central Command fait état de 44 navires commerciaux détournés, deux mis hors d'état et deux arraisonnés au début d'août 2026; des frappes prévues ont été annulées le 1er août [cnn-iran-war-august2026]. Le canal de négociation substantiel s'est déplacé vers Mascate; l'Iran et Oman faisant état de pourparlers proches de leur conclusion sur une nouvelle voie de transit dans le détroit d'Ormuz, tandis que l'Iran impute la fermeture du détroit au blocus [cnn-iran-war-august2026].

  L'appartenance multilatérale se réduit à une échelle sans précédent depuis 1945. Un décret présidentiel du 20 janvier 2025 a ordonné le retrait de l'Accord de Paris, effectif le 27 janvier 2026 en application de l'article 28 de cet accord [crs-r48504-paris]. Le décret présidentiel 14199 du 4 février 2025 a mis fin à la participation au Conseil des droits de l'homme des Nations unies et chargé le secrétaire d'État d'examiner l'ensemble des organisations intergouvernementales, conventions et traités auxquels le pays est partie [potus-memo-withdrawals-2026]. Donnant suite à cet examen, un mémorandum présidentiel du 7 janvier 2026 a ordonné le retrait de 66 organisations nommément désignées (35 hors du système des Nations unies et 31 en son sein), enjoignant aux organismes de procéder aux retraits dans les meilleurs délais et, pour les entités onusiennes, de cesser toute participation et tout financement dans la mesure permise par la loi; le mémorandum précise que l'examen d'autres conclusions se poursuit [potus-memo-withdrawals-2026]. Parmi les organismes visés figurent la Convention-cadre des Nations unies sur les changements climatiques et le Groupe d'experts intergouvernemental sur l'évolution du climat ainsi que (ce qui touche directement des expositions relevées ailleurs dans le présent rapport) le Centre d'excellence européen pour la lutte contre les menaces hybrides, le Forum mondial sur la cyberexpertise, le Forum mondial de lutte contre le terrorisme et le Forum mondial sur la migration et le développement [potus-memo-withdrawals-2026][state-withdrawal-66-2026].
