domestic:

  - name: "President Donald Trump and the federal executive (the administration)"
    kind: federal executive
    liveActorStatus: current
    fieldsCitedIn: [territory.transition, society.language, economy.politicalEconomy, political.powerStructure, political.rightsAndChecks, political.stabilityDrivers, political.constitutionalSubstrate, capacity.approvals, capacity.steering, capacity.delivery, security.internal, security.military, security.transnationalExposure, security.diplomacy, situation]
    currentPositionFromReport: >
      Holds the presidency on a 312–226 electoral-college margin with unified party control of both
      chambers, and is expanding executive discretion by order and litigation rather than by
      legislation — voiding climate targets, taking equity in named firms, federalising police and
      Guard forces, withdrawing from 66 international organisations, and conducting war and lethal
      hemispheric operations without congressional authorisation.
    layer2Draft:
      status: AI-drafted, unverified — collapsed by default
      citationType: Interpretation
      anchors: [political.powerStructure, political.constitutionalSubstrate, capacity.steering, security.diplomacy, situation]
      interests: >
        Maximising unilateral executive discretion over personnel, tariffs, force and multilateral
        commitments, and converting that discretion into rapid delivery in the domains it has
        prioritised — homeland and hemispheric security, border enforcement, and firm-specific
        industrial policy [capacity.steering][security.diplomacy].
      resources: >
        Article II command authority, the removal power as expanded at commission-style agencies,
        executive orders and proclamations, reconciliation majorities in both chambers, the
        District of Columbia Home Rule authority, and trade-remedy statutes with no rate ceiling
        [political.powerStructure][political.constitutionalSubstrate][situation].
      constraints: >
        The sixty-vote cloture threshold on ordinary legislation, a 218-seat House majority with
        four vacancies, judicial review that ran against it on the Federal Reserve, birthright
        citizenship and Guard federalisation, and a fiscal path in which net interest is the
        fastest-growing outlay [political.powerStructure][political.constitutionalSubstrate][political.shockAbsorbers].
      likelyMoves: >
        Continued reliance on reconciliation, trade-remedy tariffs and executive action over regular
        order; further withdrawals under the ongoing organisational review; continued lethal
        operations in the Western Hemisphere and prosecution of the Iran blockade
        [capacity.steering][security.diplomacy][situation].
      engagementMode: >
        negotiable / dealable, transactionally. The report describes alignment mechanisms that are
        company-by-company and burden-sharing that is transactional rather than institutional, so
        counterparts deal with the executive directly rather than through standing frameworks
        [political.stabilityDrivers][security.diplomacy].

