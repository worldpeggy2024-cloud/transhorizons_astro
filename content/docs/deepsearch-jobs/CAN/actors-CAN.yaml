    currentPositionFromReport: >
      Mark Carney is Prime Minister leading a Liberal government that reached a majority between
      elections through five floor crossings and a sweep of three by-elections; it is running a
      project-approval, internal-trade and defence agenda the report describes as early and mostly
      unrealised, negotiating under United States tariffs, and resetting relations with China and
