        Converting announced agendas into delivered outcomes — first national-interest designations,
        the Canada Strong Fund, mutual recognition, the defence pathway — while containing tariff
        damage without conceding the sectoral duties [capacity.steering][situation].
      resources: >
        Fused executive-legislative control of the House agenda, appointment power exercised through
        the Governor in Council, federal fiscal room (deficit at 2.1% of output, three top-tier
