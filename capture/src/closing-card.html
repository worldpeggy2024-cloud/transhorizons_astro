<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Closing card</title>
<style>
  html, body { margin: 0; height: 100%; background: #0D0D0D; }
  body { display: flex; align-items: center; justify-content: center; }
  .card { max-width: 1240px; padding: 0 80px; text-align: center; }
  .rule { width: 56px; height: 1px; background: #7D1A2E; margin: 0 auto 40px; }
  p { margin: 0; color: rgba(255,255,255,0.86); font-family: Georgia, 'Playfair Display', serif;
      font-weight: 300; font-size: 54px; line-height: 1.35; letter-spacing: 0.005em; }
  .brand { margin-top: 48px; color: rgba(255,255,255,0.35); font-family: 'Segoe UI', system-ui, sans-serif;
           font-size: 18px; letter-spacing: 0.28em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <p id="text"></p>
    <div class="brand">TransHorizons</div>
  </div>
</body>
</html>
